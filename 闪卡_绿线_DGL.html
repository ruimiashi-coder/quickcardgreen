 on High TT Boards", "q": "同花阻挡牌的作用", "clues": ["100%", "40%", "20%"], "a": ["转牌圈的同花阻挡牌效应与翻牌圈类似：手中持有同花阻挡牌时，下注频率显著降低；没有阻挡牌时，下注频率显著提高。", "具体牌例：翻牌面为K♠7♦4♣2♠（双色，黑桃为同花听牌花色），转牌为J♣。手持33且不含黑桃时，转牌圈100%下注；手持33且含一张黑桃时，下注频率降至40%。", "另一牌例：手持22且不含黑桃时，下注频率为40%；手持22且含黑桃时，100%过牌。", "再一牌例：手持55且不含黑桃时，下注频率为40%或20%；手持55且含黑桃时，100%过牌或仅20%下注。"], "note": ""}, {"id": "DGL#28-s3", "ep": "28", "type": "topic", "topic": "DGL#28 - 翻前3-bet底池中，有利位置在高张双色翻牌面用低对子进行转牌双重下注", "en": "PFC 3BP IP Double Barreling Low Pockets on High TT Boards", "q": "桶位调整规则", "clues": ["100%", "80%", "60%", "40%"], "a": ["讲师给出一个实用的启发式规则：将下注频率划分为多个“桶位”（如100%、80%、60%、40%、20%、0%），根据是否持有同花阻挡牌进行上下调整。", "没有同花阻挡牌时，下注频率上调一个桶位。例如，基准为60-40时，无阻挡牌则调整为80-20。", "持有同花阻挡牌时，下注频率下调两个桶位。例如，基准为60-40时，有阻挡牌则调整为20-80。", "下调两个桶位的原因：翻牌圈时，我们已经更频繁地用不含同花阻挡牌的低对子下注，因此转牌圈持有阻挡牌时，需要更大幅度地降低下注频率，以平衡整体范围。"], "note": ""}, {"id": "DGL#28-s4", "ep": "28", "type": "topic", "topic": "DGL#28 - 翻前3-bet底池中，有利位置在高张双色翻牌面用低对子进行转牌双重下注", "en": "PFC 3BP IP Double Barreling Low Pockets on High TT Boards", "q": "实战决策示例", "clues": ["GTO"], "a": ["以22-44为例，基准下注频率为60-40。若手中没有同花阻挡牌，则实际下注频率为80-20；若手中有同花阻挡牌，则实际下注频率为20-80。", "该规则适用于所有低对子（22-77），只需根据对子大小先确定基准频率，再根据阻挡牌情况进行桶位调整。", "讲师强调，这一规则是“手牌类别频率启发式”，旨在帮助玩家在实战中快速做出接近GTO的决策，而非精确计算。"], "note": ""}, {"id": "DGL#28-c0", "ep": "28", "type": "cloze", "topic": "DGL#28 - 翻前3-bet底池中，有利位置在高张双色翻牌面用低对子进行转牌双重下注", "en": "PFC 3BP IP Double Barreling Low Pockets on High TT Boards", "q": "转牌圈继续下注的全局频率约为＿＿，即大约一半的情况下会继续开火。", "clues": [], "a": ["在翻牌圈用低对子（22-77）于高张双色翻牌面下注并被跟注后，转牌圈继续下注的全局频率约为50%，即大约一半的情况下会继续开火。"], "note": "50%"}, {"id": "DGL#28-c1", "ep": "28", "type": "cloze", "topic": "DGL#28 - 翻前3-bet底池中，有利位置在高张双色翻牌面用低对子进行转牌双重下注", "en": "PFC 3BP IP Double Barreling Low Pockets on High TT Boards", "q": "22-44的下注频率上升至约60-40，即＿＿的情况下继续下注，40%的情况下过牌。", "clues": [], "a": ["22-44的下注频率上升至约60-40，即60%的情况下继续下注，40%的情况下过牌。"], "note": "60%"}, {"id": "DGL#28-c2", "ep": "28", "type": "cloze", "topic": "DGL#28 - 翻前3-bet底池中，有利位置在高张双色翻牌面用低对子进行转牌双重下注", "en": "PFC 3BP IP Double Barreling Low Pockets on High TT Boards", "q": "手持33且不含黑桃时，转牌圈＿＿下注；手持33且含一张黑桃时，", "clues": [], "a": ["具体牌例：翻牌面为K♠7♦4♣2♠（双色，黑桃为同花听牌花色），转牌为J♣。手持33且不含黑桃时，转牌圈100%下注；手持33且含一张黑桃时，下注频率降至40%。"], "note": "100%"}, {"id": "DGL#28-note", "ep": "28", "type": "note", "topic": "DGL#28 - 翻前3-bet底池中，有利位置在高张双色翻牌面用低对子进行转牌双重下注", "en": "PFC 3BP IP Double Barreling Low Pockets on High TT Boards", "q": "避坑提醒与行动项", "clues": ["vs 55-77"], "a": ["本视频是“绿线”系列的第二部分，紧接上一期翻牌圈低对子下注策略。建议玩家先掌握翻牌圈的下注频率与阻挡牌调整逻辑，再学习本期的转牌圈内容，两者构成完整的低对子连续下注策略体系。后续视频可能继续探讨河牌圈的行动，或转向其他手牌类别（如高张、中对子）在类似牌面的策略。", "**行动项与常见错误：**", "- 应该做：转牌圈继续下注前，先判断自己的对子大小（22-44 vs 55-77），确定基准频率。", "- 应该做：检查手中是否持有与翻牌面同花听牌花色相同的牌，据此调整下注频率。", "- 不要做：忽略阻挡牌效应，对所有低对子采用统一的下注频率。", "- 不要做：在持有同花阻挡牌时过度下注，这会导致范围失衡，被对手利用。"], "note": ""}, {"id": "DGL#29-intro", "ep": "29", "type": "intro", "topic": "DGL#29 - 翻前加注底池与3-bet底池中的翻牌圈持续下注练习：低权益牌型", "en": "PFR 3BP OOP Practicing Flop Cbet - Low Equity Hands", "q": "DGL#29 - 翻前加注底池与3-bet底池中的翻牌圈持续下注练习：低权益牌型", "clues": ["DGL", "bet", "BTN"], "a": ["本视频是DGL系列第29期，聚焦于3-bet底池（再加注底池）中，小盲位（SB）对阵庄位（BTN）时，翻牌圈（Flop）持续下注（C-bet）的决策练习。讲师通过软件模拟，系统演示了如何先确定整体范围的下注尺度与频率，再根据具体牌型的权益、阻挡牌（blocker）效应等因素，将个别组合（combo）在基准频率上上调或下调一档。视频强调“频率优先”的决策框架，即先定范围频率，再调整个牌频率。", "讲师选取了多个典型翻牌面（如J-7-5两色、Q-4-4两色、7-6-4彩虹、A-J-2两色等），逐一分析下注尺度（半池、1/3池、全池等）与频率（20%、40%、60%、80%等）的选择依据。核心原则包括：低-低-低结构（Low-Low-Low）通常采用半池或过牌；双高张彩虹面（Double Broadway rainbow）通常范围下注小尺度；而带有顺子可能或对手范围优势的牌面则需要更谨慎的频率控制。视频还特别强调了阻挡牌（blocker）在调整频率中的关键作用，例如阻挡对手弃牌范围中的K高牌会降低自身下注频率。"], "note": ""}, {"id": "DGL#29-s0", "ep": "29", "type": "topic", "topic": "DGL#29 - 翻前加注底池与3-bet底池中的翻牌圈持续下注练习：低权益牌型", "en": "PFR 3BP OOP Practicing Flop Cbet - Low Equity Hands", "q": "3.1 决策框架：先范围后组合", "clues": ["80%", "60%", "40%"], "a": ["软件操作流程固定为三步：先用整个范围选择下注尺度，再用整个范围选择下注频率，最后用具体组合选择频率。这个顺序确保了决策的系统性和一致性。", "通过掌握范围频率，可以更精准地调整单牌频率：如果知道范围整体激进，就相应调整手牌的下注频率。例如在J-7-5两色牌面，范围下注频率为80%，属于高频率下注场景。", "具体组合的调整原则是“基准频率上下移动一档”：根据牌型的权益、阻挡牌效应、后门听牌等属性，在范围基准频率的基础上上调或下调一个频率档位（如从60%调到80%，或从60%调到40%）。"], "note": ""}, {"id": "DGL#29-s1", "ep": "29", "type": "topic", "topic": "DGL#29 - 翻前加注底池与3-bet底池中的翻牌圈持续下注练习：低权益牌型", "en": "PFR 3BP OOP Practicing Flop Cbet - Low Equity Hands", "q": "3.2 低-低-低结构牌面（J-7-5两色）", "clues": ["pure bet", "KJo", "60%", "80%"], "a": ["J-7-5两色牌面属于典型的低-低-低结构，标准策略是半池下注或过牌，范围下注频率通常在60%-80%之间，本案例选择60%左右，软件显示实际为80%。", "AQ（两高张+后门同花听牌+对对手继续范围有良好阻挡）在此牌面应纯下注（pure bet），即使实际结果不理想，策略本身是正确的。", "KJo（非同花KJ）在此牌面：K是方片（阻挡效果差），但J是红桃（阻挡效果好），整体阻挡效果中性或略偏正面。由于对手弃牌范围多来自K高区域，KJo的阻挡效果大致中性，因此选择68%频率下注。"], "note": ""}, {"id": "DGL#29-s2", "ep": "29", "type": "topic", "topic": "DGL#29 - 翻前加注底池与3-bet底池中的翻牌圈持续下注练习：低权益牌型", "en": "PFR 3BP OOP Practicing Flop Cbet - Low Equity Hands", "q": "3.3 高牌阻挡与频率调整（KJo案例）", "clues": ["KJo", "70%", "80%"], "a": ["在低结构牌面上，对手（庄位）的弃牌范围大量来自K高牌区域，因此手持K对阻挡对手弃牌有显著影响。", "KJo（非同花KJ）在J-7-5牌面：软件显示约70%频率下注，其中非同花KJ（含红桃J）是纯下注，其他非同花KJ组合下注频率约80%。这说明具体组合的阻挡牌质量会显著影响频率选择。", "阻挡牌效应是双向的：阻挡对手继续范围（如阻挡顶对）会降低下注频率，阻挡对手弃牌范围（如阻挡K高牌）也会降低下注频率，因为对手更可能弃牌时我们下注的收益降低。"], "note": ""}, {"id": "DGL#29-s3", "ep": "29", "type": "topic", "topic": "DGL#29 - 翻前加注底池与3-bet底池中的翻牌圈持续下注练习：低权益牌型", "en": "PFR 3BP OOP Practicing Flop Cbet - Low Equity Hands", "q": "3.4 小尺度范围下注牌面（Q-4-4两色、A-9-2彩虹）", "clues": ["range bet"], "a": ["Q-4-4两色牌面：选择1/4池下注，且为范围下注（range bet），即整个范围都下注。讲师原本以为可能有部分过牌，但软件显示确实是全范围下注。", "A-9-2彩虹牌面：同样是小尺度范围下注，这是最简单直接的场景，即使最没经验的玩家也能轻松处理。", "这类牌面的共同特点是：牌面干燥、对手范围受限、我们的范围优势明显，因此可以用小尺度全范围下注来简化决策。"], "note": ""}, {"id": "DGL#29-s4", "ep": "29", "type": "topic", "topic": "DGL#29 - 翻前加注底池与3-bet底池中的翻牌圈持续下注练习：低权益牌型", "en": "PFR 3BP OOP Practicing Flop Cbet - Low Equity Hands", "q": "3.5 全池或过牌策略（7-6-4彩虹）", "clues": ["30%", "40%", "20%"], "a": ["7-6-4彩虹牌面：没有顺子可能，两对组合（6-4、7-4）不太可能出现在对手范围中，因此选择全池下注或过牌的二极化策略。", "如果选择全池下注，频率必须很低：关键在于判断频率是否高于30%——高于30%则选择40%频率档，低于30%则选择20%频率档。本案例选择20%频率。", "7-6-4方片两色牌面：同样选择全池或过牌，软件验证了20%频率的正确性。讲师强调通过反复练习，这类牌面的频率选择会逐渐形成记忆。"], "note": ""}, {"id": "DGL#29-s5", "ep": "29", "type": "topic", "topic": "DGL#29 - 翻前加注底池与3-bet底池中的翻牌圈持续下注练习：低权益牌型", "en": "PFR 3BP OOP Practicing Flop Cbet - Low Equity Hands", "q": "3.6 半池与频率判断（9-8-6两色、J-7-3两色）", "clues": ["KQo", "80%", "60%", "70%"], "a": ["9-8-6两色牌面：虽然对手可能有9-8同花两个组合，但我们有大量10、J、Q可以打两条街的价值，因此讲师对全池策略存疑，最终选择半池下注。", "半池下注时，范围频率应该相当高：因为我们的范围（大量高张+卡顺）很好地击中此牌面，Q-10、Q-J有卡顺，J-10有双头顺听牌，还有所有超对。频率感觉应在80%左右，但讲师选择60%档。", "J-7-3两色牌面：选择半池或过牌，频率应高于70%但低于80%，最终选择80%档。KQo（含K黑桃）在此牌面应上调一档频率。"], "note": ""}, {"id": "DGL#29-s6", "ep": "29", "type": "topic", "topic": "DGL#29 - 翻前加注底池与3-bet底池中的翻牌圈持续下注练习：低权益牌型", "en": "PFR 3BP OOP Practicing Flop Cbet - Low Equity Hands", "q": "3.7 阻挡牌降低频率（KTo草花案例）", "clues": ["KTo"], "a": ["J-7-3两色牌面，KTo（非同花KT）含草花：由于我们下注时，对手的弃牌范围大量来自K高牌（如KQ草花、KT草花、K9草花），以及Q-10草花，手持KT草花阻挡了大量对手的弃牌范围，因此应降低下注频率。", "讲师考虑下调一档或两档，最终选择下调一档（即频率低于范围基准）。软件验证显示下调一档是正确的，虽然接近但方向正确。", "这个案例说明：阻挡对手弃牌范围会降低下注频率，因为对手更少弃牌时，诈唬的EV降低。"], "note": ""}, {"id": "DGL#29-s7", "ep": "29", "type": "topic", "topic": "DGL#29 - 翻前加注底池与3-bet底池中的翻牌圈持续下注练习：低权益牌型", "en": "PFR 3BP OOP Practicing Flop Cbet - Low Equity Hands", "q": "3.8 双高张彩虹牌面（K-Q-3-2、A-J-T）", "clues": ["10%", "60%", "80%"], "a": ["K-Q-3-2双高张彩虹牌面：这类牌面非常灵活，可以用10%频率范围下注，也可以选择更大尺度，各种玩法基本等效。本案例选择半池或过牌，频率约60%。", "如果范围频率约60%，意味着存在一些纯过牌手牌，也必然存在一些纯下注手牌。本案例选择80%频率档。", "A-J-T彩虹牌面：属于双高张彩虹，非常简单的范围下注小尺度场景。A-4-4、K-Q-6、A-9-7、K-J-4彩虹、A-5-5等牌面均适用此策略。", "核心原则：双高张彩虹牌面（Double Broadway rainbow）一律范围下注小尺度，这是简化策略的重要一环。"], "note": ""}, {"id": "DGL#29-s8", "ep": "29", "type": "topic", "topic": "DGL#29 - 翻前加注底池与3-bet底池中的翻牌圈持续下注练习：低权益牌型", "en": "PFR 3BP OOP Practicing Flop Cbet - Low Equity Hands", "q": "3.9 半池与频率上限（9-8-6彩虹）", "clues": ["set", "RNG 63", "40%", "60%"], "a": ["9-8-6彩虹牌面：对手有少量两对和顺子可能（但无7-5、T-7、8-6、9-6），有set可能。问题是这些是否足以让我们用10、J、Q打两条街的价值——讲师认为不够，因此选择半池。", "半池下注时，范围频率不能太高，约40%。利用这个范围频率信息，J-T黑桃（双头顺听牌）可以上调一档至60%或80%，讲师选择60%，即范围平均频率上调一档。", "软件验证了60%的正确性（RNG 63需过牌）。这个案例展示了如何从范围频率推导单牌频率。"], "note": ""}, {"id": "DGL#29-s9", "ep": "29", "type": "topic", "topic": "DGL#29 - 翻前加注底池与3-bet底池中的翻牌圈持续下注练习：低权益牌型", "en": "PFR 3BP OOP Practicing Flop Cbet - Low Equity Hands", "q": "3.10 纯过牌与阻挡牌（A-3红桃、口袋对子）", "clues": ["60%", "80%"], "a": ["7-6-4两色牌面，A-3红桃：虽然有卡顺听牌，但对手没有太多8x，且容易被加注，讲师不确定如何处理，最终软件显示为纯过牌。", "A-J-2两色牌面：半池下注频率约60%。口袋对子9（无黑桃）应纯过牌，因为阻挡了大量对手弃牌范围（K-9、Q-9、T-9、9-8），如果有黑桃则下注。", "口袋对子8（有黑桃）在60%频率档，口袋对子7（有黑桃）在80%频率档。注意：同时有黑桃和红桃的效果不如只有一张黑桃（无红桃），存在细微差别。"], "note": ""}, {"id": "DGL#29-s10", "ep": "29", "type": "topic", "topic": "DGL#29 - 翻前加注底池与3-bet底池中的翻牌圈持续下注练习：低权益牌型", "en": "PFR 3BP OOP Practicing Flop Cbet - Low Equity Hands", "q": "3.11 其他牌面与频率细节", "clues": ["40%", "90%", "20%", "80%"], "a": ["A-6-4两色：半池下注但非全范围，频率适中。K-J草花方片组合应降低频率（40%档）。", "2-6-4牌面：1/4池下注，几乎全范围。A-K-6牌面：虽然软件显示约90%下注频率，但A-K非同花部分组合有20%过牌，不过这类牌面仍应全范围下注。", "A-K-K牌面：并非全范围下注，存在部分过牌，但讲师认为简化处理不值得。", "10-9-6彩虹牌面：选择半池或过牌，讲师原本感觉80%频率，但软件显示75%下注频率且有加注尺度。K-Q非同花（含草花）比不含草花的过牌更多，草花阻挡效果显著。"], "note": ""}, {"id": "DGL#29-c0", "ep": "29", "type": "cloze", "topic": "DGL#29 - 翻前加注底池与3-bet底池中的翻牌圈持续下注练习：低权益牌型", "en": "PFR 3BP OOP Practicing Flop Cbet - Low Equity Hands", "q": "例如在J-7-5两色牌面，范围下注频率为＿＿，属于高频率下注场景。", "clues": [], "a": ["通过掌握范围频率，可以更精准地调整单牌频率：如果知道范围整体激进，就相应调整手牌的下注频率。例如在J-7-5两色牌面，范围下注频率为80%，属于高频率下注场景。"], "note": "80%"}, {"id": "DGL#29-c1", "ep": "29", "type": "cloze", "topic": "DGL#29 - 翻前加注底池与3-bet底池中的翻牌圈持续下注练习：低权益牌型", "en": "PFR 3BP OOP Practicing Flop Cbet - Low Equity Hands", "q": "范围下注频率通常在＿＿-80%之间，本案例选择60%左右，", "clues": [], "a": ["J-7-5两色牌面属于典型的低-低-低结构，标准策略是半池下注或过牌，范围下注频率通常在60%-80%之间，本案例选择60%左右，软件显示实际为80%。"], "note": "60%"}, {"id": "DGL#29-c2", "ep": "29", "type": "cloze", "topic": "DGL#29 - 翻前加注底池与3-bet底池中的翻牌圈持续下注练习：低权益牌型", "en": "PFR 3BP OOP Practicing Flop Cbet - Low Equity Hands", "q": "KJo（非同花KJ）在J-7-5牌面：软件显示约＿＿频率下注，", "clues": [], "a": ["KJo（非同花KJ）在J-7-5牌面：软件显示约70%频率下注，其中非同花KJ（含红桃J）是纯下注，其他非同花KJ组合下注频率约80%。这说明具体组合的阻挡牌质量会显著影响频率选择。"], "note": "70%"}, {"id": "DGL#29-note", "ep": "29", "type": "note", "topic": "DGL#29 - 翻前加注底池与3-bet底池中的翻牌圈持续下注练习：低权益牌型", "en": "PFR 3BP OOP Practicing Flop Cbet - Low Equity Hands", "q": "避坑提醒与行动项", "clues": ["DGL", "bet", "RNG"], "a": ["本视频是DGL系列第29期，延续了该系列“通过软件模拟练习翻牌圈决策”的教学方法。视频重点展示了3-bet底池中小盲位对庄位的翻牌圈持续下注策略，特别聚焦于低权益牌型的处理。讲师反复强调“先范围后组合”的决策框架，以及通过反复练习形成对常见牌面频率选择的直觉记忆。视频中多次出现“RNG”（随机数生成）验证环节，说明实际游戏中频率选择需要结合随机化来保持不可预测性。", "值得进一步学习的方向包括：转牌圈与河牌圈的频率调整、不同筹码深度下的策略变化、以及如何根据对手倾向进行剥削性调整。视频中提到的“阻挡牌效应”是调整频率的核心工具，建议深入学习不同牌面结构下阻挡牌的具体影响权重。", "**行动项与常见错误：**", "- 应该这样做：先确定范围下注尺度与频率，再调整单牌频率；低-低-低结构用半池或过牌；双高张彩虹面全范围小尺度下注；阻挡对手弃牌范围时降低下注频率。", "- 不要这样做：不要跳过范围频率直接决定单牌频率；不要在7-6-4类牌面用过高频率全池下注；不要忽视阻挡牌对频率的影响；不要在A-K-K牌面强行全范围下注。"], "note": ""}, {"id": "DGL#30-intro", "ep": "30", "type": "intro", "topic": "DGL#30 - 翻前加注者3-bet底池不利位置实战练习：高权益牌在高等两张同花牌面（High 2T Boards）上的打法", "en": "PFR 3BP OOP Practicing - High Equity Hands on High 2T Boards", "q": "DGL#30 - 翻前加注者3-bet底池不利位置实战练习：高权益牌在高等两张同花牌面（High 2T Boards）上的打法", "clues": ["DGL", "PFR", "bet"], "a": ["本视频是DGL系列第30期，主题为“翻前加注者（PFR）在3-bet底池中处于不利位置（OOP）时的实战练习”。讲师使用分桶系统（bucketing system）进行实时决策训练，重点聚焦于“高两张同花牌面”（high two-tone boards，即翻牌包含两张同花色高牌）与“高权益牌”（high equity hands，如AK、AQ、口袋对子AA/KK等）的组合场景。视频通过大量实战牌例，系统展示了翻牌圈和转牌圈的下注尺度选择、频率分配以及慢打（slow play）的时机判断。", "核心方法论是“翻牌圈与转牌圈保持平衡策略，河牌圈采用剥削性打法”。讲师反复强调几个关键原则：在高等两张同花牌面上，小尺度高频下注（small size high frequency）是主流策略；转牌圈出现空白牌（blank）时通常极化到3/4底池或过牌；转牌圈出现高牌（Broadway）时倾向于使用半池下注；同花完成牌面（flush completing runouts）上应大幅提高过牌频率，甚至可以采用纯过牌策略作为简化。视频还详细分析了不同转牌牌面对策略的影响，以及顶对好踢脚（top pair good kicker）在各类牌面上的标准频率分桶。"], "note": ""}, {"id": "DGL#30-s0", "ep": "30", "type": "topic", "topic": "DGL#30 - 翻前加注者3-bet底池不利位置实战练习：高权益牌在高等两张同花牌面（High 2T Boards）上的打法", "en": "PFR 3BP OOP Practicing - High Equity Hands on High 2T Boards", "q": "翻牌圈小尺度高频策略", "clues": ["tone", "pure bet", "checkback range"], "a": ["在K-9-8、A-7-2、K-6-4、Q-4-4、A-5-4、J-7-5、K-5-2、Q-T-7、A-9-5等高等两张同花牌面上，翻牌圈统一采用小尺度（约1/3底池）高频下注策略。", "小尺度下注的核心目的是以较低风险维持较宽的下注范围，同时迫使对手在不利位置做出更多决策。", "在A-K-9-2-tone牌面上，讲师确认“小尺度高频”为正确选择，A-K组合在此类牌面通常是纯下注（pure bet）或高频下注。", "在K-9-8-2-tone牌面上，翻牌圈小尺度下注后，转牌出现空白牌（如4♦）时，策略转为2/3频率过牌，A-K组合可能以一定频率慢打，因为A阻挡牌会阻断对手在转牌圈的过牌范围（checkback range）。"], "note": ""}, {"id": "DGL#30-s1", "ep": "30", "type": "topic", "topic": "DGL#30 - 翻前加注者3-bet底池不利位置实战练习：高权益牌在高等两张同花牌面（High 2T Boards）上的打法", "en": "PFR 3BP OOP Practicing - High Equity Hands on High 2T Boards", "q": "转牌圈极化与过牌策略", "clues": ["tone", "depolarize", "80%", "67%"], "a": ["翻牌圈小尺度下注后，转牌圈出现低张不连接牌（low disconnected card）时，标准策略是极化到3/4底池或过牌，频率约为80/20分桶。", "在A-7-2-2-tone牌面，翻牌小尺度下注后转牌8♦，讲师确认3/4底池下注配合80%频率分桶为正确选择，混合67%全下与32%较小下注，但纯全下也是完全可行的简化。", "在Q-4-4-2-tone牌面，翻牌小尺度下注后转牌3♥，A-Q组合应3/4底池或过牌，且过牌频率高达80%。", "在A-9-5-2-tone牌面，翻牌小尺度下注后转牌A♦，策略转为去极化（depolarize），使用1/4底池下注，频率高达72%，主要施压对象是2-6的低对、K-Q、K-J组合以及7-6等卡顺听牌。"], "note": ""}, {"id": "DGL#30-s2", "ep": "30", "type": "topic", "topic": "DGL#30 - 翻前加注者3-bet底池不利位置实战练习：高权益牌在高等两张同花牌面（High 2T Boards）上的打法", "en": "PFR 3BP OOP Practicing - High Equity Hands on High 2T Boards", "q": "转牌高牌（Broadway）半池策略", "clues": ["tone", "Broadway", "K7s", "40%"], "a": ["在K-5-2-2-tone牌面，翻牌小尺度下注后转牌出现Broadway（如T♥），讲师确认半池下注为正确选择，这是通过实战练习总结出的启发式规则：K高牌面转牌出Broadway时，可用半池下注。", "在K-6-4-2-tone牌面，翻牌小尺度下注后转牌7♣（非Broadway），策略为3/4底池或过牌，因为对手可能有77、76以及K7s（讲师的手牌未阻挡K7s）。", "在A-K-9-2-tone牌面，转牌出现Broadway（T、Q、K、A）时，多数采用半池下注；空白牌则3/4底池或过牌，频率30-40%。"], "note": ""}, {"id": "DGL#30-s3", "ep": "30", "type": "topic", "topic": "DGL#30 - 翻前加注者3-bet底池不利位置实战练习：高权益牌在高等两张同花牌面（High 2T Boards）上的打法", "en": "PFR 3BP OOP Practicing - High Equity Hands on High 2T Boards", "q": "同花完成牌面的过牌简化", "clues": ["flush completing", "tone", "80%", "90%"], "a": ["转牌圈出现第三张同花牌（flush completing）时，讲师多次强调应大幅提高过牌频率，甚至可以采用纯过牌策略作为理论简化。", "在A-K-9-2-tone牌面，转牌为黑桃时，约80%整体范围过牌，纯过牌策略不会损失任何EV。", "在K-6-4-2-tone牌面，转牌为黑桃时，使用1/4底池下注配合极低频率，85-90%过牌，同样可简化为范围过牌。", "在Q-4-4-2-tone牌面，转牌为红心时，3/4底池或过牌，过牌频率极高。", "在A-9-5-2-tone牌面，转牌为同花完成牌时，使用半池或3/4底池配合超高频率过牌。"], "note": ""}, {"id": "DGL#30-s4", "ep": "30", "type": "topic", "topic": "DGL#30 - 翻前加注者3-bet底池不利位置实战练习：高权益牌在高等两张同花牌面（High 2T Boards）上的打法", "en": "PFR 3BP OOP Practicing - High Equity Hands on High 2T Boards", "q": "顶对好踢脚频率分桶", "clues": ["tone", "80%", "72%"], "a": ["在K-6-4-2-tone牌面，转牌7♣后，顶对好踢脚（K-Q）的频率分桶为60/40（下注/过牌），而非讲师预期的80/20。", "讲师总结：顶对好踢脚在多数转牌牌面上，标准分桶为60/40，这是值得记住的通用参考值。", "在J-7-5-2-tone牌面，A-J为纯下注（80%分桶），转牌4后继续下注，频率80%。", "在A-9-5-2-tone牌面，转牌A♦后，A-Q使用1/4底池高频下注（72%范围）。"], "note": ""}, {"id": "DGL#30-s5", "ep": "30", "type": "topic", "topic": "DGL#30 - 翻前加注者3-bet底池不利位置实战练习：高权益牌在高等两张同花牌面（High 2T Boards）上的打法", "en": "PFR 3BP OOP Practicing - High Equity Hands on High 2T Boards", "q": "慢打（Slow Play）原则", "clues": ["tone", "set", "10%", "80%"], "a": ["在A-K-9-2-tone牌面，顶set（如KK）在翻牌圈通常为纯过牌，因为大尺度下注会阻断对手的跟注范围，过牌成为更优选择。", "在A-K-9-2-tone牌面，转牌K♠后，讲师确认10%底池下注为正确选择，频率高达80%，因为己方范围极强（包含大量Kx、三条、葫芦），而对手有大量被压制的低对。", "在Q-T-7-2-tone牌面，口袋Q（顶set）慢打60%频率，口袋T慢打80%频率，讲师强调“在需要加注尺度的牌面上，务必慢打set”。", "在Q-4-4-2-tone牌面，转牌Q♣（配对牌面）时，两对以上牌力需以一定频率慢打，讲师确认过牌频率为20%，下注尺度为1/4底池。", "在J-7-5-2-tone牌面，翻牌下注后转牌为空白牌时，set应大幅提高过牌频率。"], "note": ""}, {"id": "DGL#30-s6", "ep": "30", "type": "topic", "topic": "DGL#30 - 翻前加注者3-bet底池不利位置实战练习：高权益牌在高等两张同花牌面（High 2T Boards）上的打法", "en": "PFR 3BP OOP Practicing - High Equity Hands on High 2T Boards", "q": "过牌-加注（Check-Raise）策略", "clues": ["tone", "stab", "Solver"], "a": ["在J-7-5-2-tone牌面，面对对手的试探下注（stab），口袋A（无黑桃）应纯过牌-加注，但使用较小尺度。", "较小尺度的原因是目标区域是6x、4x、K-Q、A-Q等低区域，而非8-9-T带黑桃的高区域。", "讲师原本认为应使用较大尺度针对8-9-T带黑桃的组合，但Solver显示小尺度为正确选择，因为对手更倾向于用带黑桃的8-9-T下注。", "在Q-T-7-2-tone牌面，面对半池下注，口袋A（无黑桃）可纯过牌-加注，但需注意对手可能有9-7同花听牌。"], "note": ""}, {"id": "DGL#30-s7", "ep": "30", "type": "topic", "topic": "DGL#30 - 翻前加注者3-bet底池不利位置实战练习：高权益牌在高等两张同花牌面（High 2T Boards）上的打法", "en": "PFR 3BP OOP Practicing - High Equity Hands on High 2T Boards", "q": "转牌圈去极化（Depolarize）策略", "clues": ["tone", "10%", "72%"], "a": ["在A-K-9-2-tone牌面，转牌K♠后，策略几乎为纯10%底池下注，频率极高，属于去极化打法。", "在Q-4-4-2-tone牌面，转牌Q♣（配对牌面）时，使用1/4底池去极化下注，频率较高。", "在A-9-5-2-tone牌面，转牌A♦后，使用1/4底池去极化下注，频率72%。", "去极化的核心逻辑是：当己方范围极强且对手范围被压制时，用小尺度下注整个范围，迫使对手用弱牌跟注。"], "note": ""}, {"id": "DGL#30-s8", "ep": "30", "type": "topic", "topic": "DGL#30 - 翻前加注者3-bet底池不利位置实战练习：高权益牌在高等两张同花牌面（High 2T Boards）上的打法", "en": "PFR 3BP OOP Practicing - High Equity Hands on High 2T Boards", "q": "转牌圈特殊牌面的全下策略", "clues": ["tone", "Solver", "jam"], "a": ["在A-7-2-2-tone牌面，翻牌小尺度下注后转牌8♦，Solver显示全下（jam）是最大化EV的单一尺度策略。", "在A-K-9-2-tone牌面，转牌9♦时，全下为最优选择，9是讲师最希望全下的牌。", "其他适合全下的转牌包括：6♥、8♥、8♠、9♠，其中8♠和9♠尤为关键。", "在极空白牌面（如2♣、2♦、2♥、4♣、4♦、4♥、Q、K），使用3/4底池下注频率较高。"], "note": ""}, {"id": "DGL#30-s9", "ep": "30", "type": "topic", "topic": "DGL#30 - 翻前加注者3-bet底池不利位置实战练习：高权益牌在高等两张同花牌面（High 2T Boards）上的打法", "en": "PFR 3BP OOP Practicing - High Equity Hands on High 2T Boards", "q": "河牌圈简化处理", "clues": ["tone", "A7s", "A8s", "10%"], "a": ["讲师明确表示，本视频的目标是翻牌圈和转牌圈保持平衡策略，河牌圈采用剥削性打法，因此河牌圈不做过多策略讨论。", "在A-7-2-2-tone牌面，转牌全下后河牌为空白牌，继续全下，期望被更差牌跟注。", "在K-5-2-2-tone牌面，转牌圈过牌后河牌为空白，讲师建议使用10%底池小尺度下注，因为对手过牌转牌后范围被封顶。", "在J-9-5-2-tone牌面，河牌9♠（配对牌面），对手可能持有9x（如K9、T9、98），但A♥阻挡了对手的诈唬牌（A7s、A8s），讲师选择全下，因为仍能击败QJ、AQ、KQ、KJ等牌。"], "note": ""}, {"id": "DGL#30-s10", "ep": "30", "type": "topic", "topic": "DGL#30 - 翻前加注者3-bet底池不利位置实战练习：高权益牌在高等两张同花牌面（High 2T Boards）上的打法", "en": "PFR 3BP OOP Practicing - High Equity Hands on High 2T Boards", "q": "实战牌例与Solver验证", "clues": ["tone", "pot sizing", "Solver", "A4s"], "a": ["牌例1：A-K在K-9-8-2-tone牌面，翻牌小尺度下注，转牌4♦后2/3频率过牌，A-K组合慢打，河牌空白全下。", "牌例2：A-K在A-T-7-2-tone牌面，翻牌半池下注（纯下注），转牌9♦后继续下注（60%频率），河牌9♥后纯全下。", "牌例3：A-K在A-K-9-2-tone牌面，翻牌半池或过牌（40%下注频率），转牌K♠后10%底池下注（80%频率）。", "牌例4：A-A在J-T-6-2-tone牌面，翻牌使用底池尺度下注（pot sizing），纯下注，Solver显示55%下注频率，下注范围包括A-A、K-K、Q-Q、K-J、J-T（慢打）、A4s、A5s、K9s、KTo、KT s、A8s、A7s、A9s、77（带黑桃）、65s、76s等。", "牌例5：Q-Q在Q-T-5-2-tone牌面，翻牌半池下注（40%频率），慢打60%，转牌Q♣后1/4底池下注（20%频率）。", "牌例6：A-K在K-5-4-2-tone牌面，翻牌小尺度高频下注，转牌T♥（双同花听牌）后半池下注（83%频率）。", "牌例7：A-Q在Q-4-4-2-tone牌面，翻牌小尺度下注，转牌3♥后3/4底池或过牌（过牌80%）。", "牌例8：A-A在J-7-5-2-tone牌面，翻牌半池或过牌（60/40分桶），面对试探下注时纯过牌-加注（小尺度）。", "牌例9：A-K在K-5-2-2-tone牌面，翻牌小尺度下注，转牌Broadway（T）后半池下注。", "牌例10：A-A在Q-T-7-2-tone牌面，翻牌半池下注（纯下注），转牌Q♦后半池下注（纯下注）。"], "note": ""}, {"id": "DGL#30-s11", "ep": "30", "type": "topic", "topic": "DGL#30 - 翻前加注者3-bet底池不利位置实战练习：高权益牌在高等两张同花牌面（High 2T Boards）上的打法", "en": "PFR 3BP OOP Practicing - High Equity Hands on High 2T Boards", "q": "转牌圈不同牌面的策略分类", "clues": ["tone", "Broadway", "20%", "80%"], "a": ["在A-K-9-2-tone牌面，转牌圈策略分类：9、6♥、8♥、8♠、9♠使用全下；极空白牌（2、4、Q、K）使用3/4底池；J使用1/4底池（去极化，因为J完成多种顺子）；黑桃使用半池极低频率（约20%下注，80%过牌）。", "在A-K-9-2-tone牌面，转牌圈策略分类：空白牌3/4底池或过牌（30-40%频率）；Broadway（T、Q、K、A）半池；同花完成牌1/4底池（3♠、4♠、T♠、Q♠）或3/4底池（5♠、7♠、8♠）或半池（9♠、J♠），过牌频率极高。", "在Q-4-4-2-tone牌面，转牌圈策略分类：9、T、Q、4使用半池；其他牌3/4底池；同花完成牌超高频率过牌。", "在Q-T-5-2-tone牌面，转牌圈策略分类：黑桃使用10%底池；Broadway（A、K、J）使用10%底池；T使用底池尺度；3、4、6使用半池；8、9使用1/4底池；整体高频延迟下注。"], "note": ""}, {"id": "DGL#30-s12", "ep": "30", "type": "topic", "topic": "DGL#30 - 翻前加注者3-bet底池不利位置实战练习：高权益牌在高等两张同花牌面（High 2T Boards）上的打法", "en": "PFR 3BP OOP Practicing - High Equity Hands on High 2T Boards", "q": "常见错误与注意事项", "clues": ["tone", "Solver", "80%"], "a": ["讲师在A-7-2-2-tone牌面承认“我搞砸了这手牌”（I butchered this hand），因为未按Solver建议使用全下。", "在A-K-9-2-tone牌面，讲师原本认为可用半池下注，但Solver显示3/4底池为正确选择，提醒不要凭直觉改变已验证的策略。", "在Q-4-4-2-tone牌面，讲师原本认为A-Q为纯下注，但Solver显示3/4底池或过牌且过牌80%，强调“不要过度高估顶对好踢脚的价值”。", "在J-7-5-2-tone牌面，讲师原本认为应使用较大尺度过牌-加注，但Solver显示小尺度为正确，提醒目标区域选择要基于对手实际范围。"], "note": ""}, {"id": "DGL#30-c1", "ep": "30", "type": "cloze", "topic": "DGL#30 - 翻前加注者3-bet底池不利位置实战练习：高权益牌在高等两张同花牌面（High 2T Boards）上的打法", "en": "PFR 3BP OOP Practicing - High Equity Hands on High 2T Boards", "q": "讲师确认3/4底池下注配合＿＿频率分桶为正确选择，", "clues": [], "a": ["在A-7-2-2-tone牌面，翻牌小尺度下注后转牌8♦，讲师确认3/4底池下注配合80%频率分桶为正确选择，混合67%全下与32%较小下注，但纯全下也是完全可行的简化。"], "note": "80%"}, {"id": "DGL#30-c2", "ep": "30", "type": "cloze", "topic": "DGL#30 - 翻前加注者3-bet底池不利位置实战练习：高权益牌在高等两张同花牌面（High 2T Boards）上的打法", "en": "PFR 3BP OOP Practicing - High Equity Hands on High 2T Boards", "q": "空白牌则3/4底池或过牌，频率30-＿＿。", "clues": [], "a": ["在A-K-9-2-tone牌面，转牌出现Broadway（T、Q、K、A）时，多数采用半池下注；空白牌则3/4底池或过牌，频率30-40%。"], "note": "40%"}, {"id": "DGL#30-c3", "ep": "30", "type": "cloze", "topic": "DGL#30 - 翻前加注者3-bet底池不利位置实战练习：高权益牌在高等两张同花牌面（High 2T Boards）上的打法", "en": "PFR 3BP OOP Practicing - High Equity Hands on High 2T Boards", "q": "转牌为黑桃时，约＿＿整体范围过牌，纯过牌策略不会损失任何EV。", "clues": [], "a": ["在A-K-9-2-tone牌面，转牌为黑桃时，约80%整体范围过牌，纯过牌策略不会损失任何EV。"], "note": "80%"}, {"id": "DGL#30-note", "ep": "30", "type": "note", "topic": "DGL#30 - 翻前加注者3-bet底池不利位置实战练习：高权益牌在高等两张同花牌面（High 2T Boards）上的打法", "en": "PFR 3BP OOP Practicing - High Equity Hands on High 2T Boards", "q": "避坑提醒与行动项", "clues": ["DGL", "PFR", "bet"], "a": ["本视频是DGL系列第30期，聚焦于翻前加注者（PFR）在3-bet底池中不利位置（OOP）的实战练习，特别针对“高两张同花牌面”与“高权益牌”的组合场景。讲师明确说明，本视频筛选了高两张同花牌面和高权益牌进行专项训练，因此策略结论适用于此类特定场景，而非所有牌面。视频中反复出现的核心启发式规则包括：翻牌圈小尺度高频下注、转牌圈空白牌极化到3/4底池或过牌、转牌圈Broadway半池下注、同花完成牌面纯过牌简化、顶对好踢脚60/40分桶等，这些规则可直接应用于实战决策。", "值得进一步学习的方向包括：河牌圈的剥削性打法细节（讲师明确表示本视频不深入讨论）、不同翻牌圈尺度（如底池尺度）的适用场景、以及如何根据对手类型调整频率分桶。建议结合Solver软件对特定牌面进行复盘，验证并内化本视频中的策略结论。", "**行动项与常见错误清单：**", "- 翻牌圈在高等两张同花牌面上，优先使用小尺度（约1/3底池）高频下注。", "- 转牌圈出现空白牌时，极化到3/4底池或过牌，频率约80/20。", "- 转牌圈出现Broadway时，优先考虑半池下注。", "- 转牌圈出现同花完成牌时，大幅提高过牌频率，纯过牌是有效简化。", "- 顶对好踢脚在多数转牌牌面上，标准分桶为60/40（下注/过牌）。", "- 在需要加注尺度的牌面上（如J-T-6），务必慢打set。", "- 不要凭直觉改变已验证的Solver策略（如A-7-2牌面的全下）。", "- 不要过度高估顶对好踢脚的价值（如Q-4-4牌面的A-Q）。", "- 过牌-加注时，目标区域选择要基于对手实际范围，而非主观猜测。"], "note": ""}, {"id": "DGL#31-intro", "ep": "31", "type": "intro", "topic": "DGL#31 - 翻前加注者在不利位置3-bet底池的实战练习：低彩虹牌面高权益牌型的频率执行", "en": "PFR 3BP OOP Practicing - High Equity Hands on Low Rainbow Boards", "q": "DGL#31 - 翻前加注者在不利位置3-bet底池的实战练习：低彩虹牌面高权益牌型的频率执行", "clues": ["DGL", "PFR", "bet"], "a": ["本视频是DGL系列第31期，聚焦于翻前加注者（PFR）在3-bet底池中处于不利位置（OOP）时的实战练习，核心主题是“高权益牌型在低彩虹牌面上的频率启发式策略”。讲师通过一系列随机数生成（RNG）驱动的训练手牌，逐一演示如何根据手牌类别（超对、暗三条、顶对等）和牌面结构，执行正确的下注、过牌、过牌加注等动作频率。", "视频首先建立了一套快速参考蓝图：超对在翻牌圈整体执行80-20下注/过牌拆分，转牌圈变为60-40；AAs作为特殊类别在翻牌圈为70-30、转牌圈为40-60；暗三条在翻牌圈高频下注后，转牌圈大量慢打。随后讲师通过大量实战牌例（如AAs在866、772、T75等牌面，KK在93 2、866等牌面，以及各种暗三条和顶对场景），展示了如何将这套频率蓝图与具体牌面、阻挡牌、花色等信息结合，做出最优决策。", "视频还强调了几个重要原则：当不确定正确下注尺度时，可以选择过牌来“用频率错误换取避免EV损失错误”；阻挡牌（特别是A和K）对慢打频率有显著影响；低SPR（底池赔率比）情况下应果断全下而非过牌弃牌；以及倾听直觉的重要性——当直觉告诉你某手牌应该怎么打时，往往直觉是正确的。整个训练过程展示了频率启发式策略在实际执行中的细微差别和调整方法。"], "note": ""}, {"id": "DGL#31-s0", "ep": "31", "type": "topic", "topic": "DGL#31 - 翻前加注者在不利位置3-bet底池的实战练习：低彩虹牌面高权益牌型的频率执行", "en": "PFR 3BP OOP Practicing - High Equity Hands on Low Rainbow Boards", "q": "频率启发式核心蓝图", "clues": ["AAs", "Delayed C-bet", "80%", "20%"], "a": ["翻牌圈持续下注（C-bet）中，超对在低彩虹牌面上整体执行80-20拆分（80%下注、20%过牌）。", "若筛选AAs单独分析，翻牌圈下注频率降至70-30；KK、QQ、JJ则接近79-21，与整体桶位差异不大。", "暗三条在低彩虹牌面翻牌圈同样执行80-20拆分，大多数时候选择下注。", "转牌圈（翻牌下注被跟注后），超对整体执行60-40拆分；AAs单独为40-60，即AAs在转牌圈过牌更多。", "暗三条在翻牌高频下注后，转牌圈大量慢打，执行40-60拆分中的40%下注桶位。", "延迟持续下注（Delayed C-bet）线中，暗三条在转牌圈同样执行40%下注桶位；超对整体为50-50拆分。", "AAs在延迟持续下注线中执行20-80拆分，即仅20%下注、80%过牌，应大量慢打。"], "note": ""}, {"id": "DGL#31-s1", "ep": "31", "type": "topic", "topic": "DGL#31 - 翻前加注者在不利位置3-bet底池的实战练习：低彩虹牌面高权益牌型的频率执行", "en": "PFR 3BP OOP Practicing - High Equity Hands on Low Rainbow Boards", "q": "花色对频率的影响", "clues": ["AAs", "20%", "80%"], "a": ["花色对下注频率有显著影响，超对在翻牌圈80-20、转牌圈60-40，AAs为40-60，延迟持续下注整体50-50但AAs为20-80。", "排除AAs后，其他超对在延迟持续下注线中整体50-50，但KK、QQ为40-60，下注频率更低。", "下注频率最高的是较低的超对（88-TT），执行80-20拆分；AAs仅20%下注，KK、QQ提升一个桶位至40-60，88-TT进入80%桶位。", "在转牌圈，QQ带黑桃比不带黑桃的下注频率高一个桶位，这是可用的花色启发式。", "在转牌圈出现方片时，KK和AAs带方片时过牌更多，JJ和QQ带方片时下注更多。"], "note": ""}, {"id": "DGL#31-s2", "ep": "31", "type": "topic", "topic": "DGL#31 - 翻前加注者在不利位置3-bet底池的实战练习：低彩虹牌面高权益牌型的频率执行", "en": "PFR 3BP OOP Practicing - High Equity Hands on Low Rainbow Boards", "q": "AAs在866牌面的实战", "clues": ["AAs", "RNG 32", "RNG 46", "RNG 77"], "a": ["第一手牌：AAs在866彩虹牌面，翻牌圈执行80-20拆分，RNG 32落入80%桶位，确定下注。", "转牌圈执行60-40全局拆分、AAs为40-60，RNG 46落入40%桶位（即20%桶位下方），选择过牌。", "对手下注后，AAs应混合加注和跟注，可能是过牌全下或小尺度加注，RNG 77时选择过牌跟注。", "河牌出现8x或7x后，AAs应过牌弃牌，没有跟注理由，但实际赢下底池。"], "note": ""}, {"id": "DGL#31-s3", "ep": "31", "type": "topic", "topic": "DGL#31 - 翻前加注者在不利位置3-bet底池的实战练习：低彩虹牌面高权益牌型的频率执行", "en": "PFR 3BP OOP Practicing - High Equity Hands on Low Rainbow Boards", "q": "AAs在772牌面的实战", "clues": ["AAs", "RNG 14", "62%"], "a": ["AAs在772牌面，翻牌圈执行80-20拆分，但该牌面实际为40-60拆分，AAs下注频率仅62%。", "该牌面AAs过牌频率显著高于其他超对，转牌圈执行40-60启发式，RNG 14时选择下注，但实际为纯过牌。", "河牌对手仍有A Q可能过牌，AAs阻挡部分过牌范围但未阻挡跟注范围，解算器建议过牌跟注而非全下。", "讲师原本想全下口袋6，但最终选择过牌跟注，获得正确读牌。"], "note": ""}, {"id": "DGL#31-s4", "ep": "31", "type": "topic", "topic": "DGL#31 - 翻前加注者在不利位置3-bet底池的实战练习：低彩虹牌面高权益牌型的频率执行", "en": "PFR 3BP OOP Practicing - High Equity Hands on Low Rainbow Boards", "q": "KK在T75彩虹牌面的实战", "clues": ["T75", "RNG 100", "100%"], "a": ["KK在T75彩虹牌面，RNG 100，讲师认为可能应该纯下注KK，但坚持80-20拆分。", "实际该牌面可能适合纯下注，最终选择过牌加注，小尺度加注被验证为正确选择。", "该牌面KK可以100%下注，但过牌加注也是可行策略。"], "note": ""}, {"id": "DGL#31-s5", "ep": "31", "type": "topic", "topic": "DGL#31 - 翻前加注者在不利位置3-bet底池的实战练习：低彩虹牌面高权益牌型的频率执行", "en": "PFR 3BP OOP Practicing - High Equity Hands on Low Rainbow Boards", "q": "KK在93 2牌面的实战", "clues": ["RNG 54", "SPR", "80%", "10%"], "a": ["KK在93 2牌面，RNG 54落入80%桶位，实际为纯下注频率。", "转牌圈超对平均执行50-40拆分，KK带红心可提升至80%以上下注频率。", "转牌为红心Q且出现3张红心时，对手有大量同花组合，SPR为0.5时考虑全下，但实际为混合策略：主要10%小注、少量全下、很少过牌。"], "note": ""}, {"id": "DGL#31-s6", "ep": "31", "type": "topic", "topic": "DGL#31 - 翻前加注者在不利位置3-bet底池的实战练习：低彩虹牌面高权益牌型的频率执行", "en": "PFR 3BP OOP Practicing - High Equity Hands on Low Rainbow Boards", "q": "暗三条在T98牌面的实战", "clues": ["set", "T98", "RNG 20", "half pot"], "a": ["底set（88）在T98牌面，该牌面为高频小尺度下注牌面，选择小尺度下注。", "翻牌下注被跟注后，暗三条在转牌圈通常大量慢打，执行40-60拆分，RNG 20时选择继续下注。", "转牌下注尺度选择半池（half pot），被验证为正确。", "河牌出现4后形成顺子面，对手有大量JX组合（JJ、JT、J9、KJ、QJ、AJ）以及76、99、TT等，全下不可行。", "尝试10%小注但被验证错误，正确为半池或四分之一池下注。"], "note": ""}, {"id": "DGL#31-s7", "ep": "31", "type": "topic", "topic": "DGL#31 - 翻前加注者在不利位置3-bet底池的实战练习：低彩虹牌面高权益牌型的频率执行", "en": "PFR 3BP OOP Practicing - High Equity Hands on Low Rainbow Boards", "q": "AAs在5 5 3彩虹牌面的实战", "clues": ["AAs", "RNG 80", "60%", "80%"], "a": ["AAs在553彩虹牌面，RNG 8时选择下注，但该牌面可能比其他牌面过牌更多。", "实际该牌面AAs执行60%下注桶位，低于平均的80%。", "转牌圈顶对中等踢脚（如AT）开始混合过牌，RNG 80时选择过牌，但实际为纯下注。", "河牌圈混合过牌加注和过牌跟注，选择小尺度过牌加注。"], "note": ""}, {"id": "DGL#31-s8", "ep": "31", "type": "topic", "topic": "DGL#31 - 翻前加注者在不利位置3-bet底池的实战练习：低彩虹牌面高权益牌型的频率执行", "en": "PFR 3BP OOP Practicing - High Equity Hands on Low Rainbow Boards", "q": "KK在866彩虹牌面的实战", "clues": ["RNG 97", "range bet", "20%"], "a": ["KK在866彩虹牌面，RNG 97，需要判断是否纯下注KK。", "实际存在20%的过牌频率，这是平衡策略的必要组成部分。", "若选择简化策略（range bet），则无需过牌，但会失去平衡性。", "转牌为T♣时，下注尺度在半个池、四分之三池和满池之间选择，最终选择四分之三池。", "该牌面KK为纯下注，河牌RNG较低时选择全下，被验证为纯全下，对手用AT跟注。"], "note": ""}, {"id": "DGL#31-s9", "ep": "31", "type": "topic", "topic": "DGL#31 - 翻前加注者在不利位置3-bet底池的实战练习：低彩虹牌面高权益牌型的频率执行", "en": "PFR 3BP OOP Practicing - High Equity Hands on Low Rainbow Boards", "q": "A7在977彩虹牌面的实战", "clues": ["RNG 38"], "a": ["A7在977彩虹牌面形成明三条，因A阻挡牌和花色影响，可能存在慢打。", "对手过牌跟注范围主要是梅花和A高牌，这些花色会增加对手下注频率。", "RNG 38时选择下注，实际为纯下注，该牌面整体非常激进。", "转牌K为极佳牌，整体下注频率很高，使用半池尺度。", "因范围下注频率极高，选择纯下注；9和K的组合（如K9、99）因阻挡跟注范围适合慢打。"], "note": ""}, {"id": "DGL#31-s10", "ep": "31", "type": "topic", "topic": "DGL#31 - 翻前加注者在不利位置3-bet底池的实战练习：低彩虹牌面高权益牌型的频率执行", "en": "PFR 3BP OOP Practicing - High Equity Hands on Low Rainbow Boards", "q": "TT在T75牌面的实战", "clues": ["set", "T75", "RNG 95", "10%"], "a": ["顶set（TT）在T75牌面，暗三条翻牌圈通常80-20拆分，但顶set可能慢打更多。", "RNG 95时选择过牌，但实际为纯下注，该牌面顶set应纯下注。", "转牌T出现后，若翻牌纯下注TT，则延迟持续下注范围会失衡。", "当不确定下注尺度且知道手牌应为混合策略时，选择过牌是安全选择——用频率错误换取避免EV损失错误。", "河牌圈A T因A阻挡牌适合慢打，但整体应主要下注，可大尺度，实际解算器为纯10%小注。"], "note": ""}, {"id": "DGL#31-s11", "ep": "31", "type": "topic", "topic": "DGL#31 - 翻前加注者在不利位置3-bet底池的实战练习：低彩虹牌面高权益牌型的频率执行", "en": "PFR 3BP OOP Practicing - High Equity Hands on Low Rainbow Boards", "q": "QQ在93 2牌面的实战", "clues": ["AAs"], "a": ["QQ在93 2牌面，之前KK为纯下注，但QQ按全局启发式执行80-20拆分。", "转牌圈超对执行60-40拆分、AAs为40-60，QQ带黑桃时继续下注。", "QQ带黑桃比不带黑桃下注频率高一个桶位，这是花色启发式的应用。", "河牌圈因黑桃阻挡牌选择全下，被验证为正确。"], "note": ""}, {"id": "DGL#31-s12", "ep": "31", "type": "topic", "topic": "DGL#31 - 翻前加注者在不利位置3-bet底池的实战练习：低彩虹牌面高权益牌型的频率执行", "en": "PFR 3BP OOP Practicing - High Equity Hands on Low Rainbow Boards", "q": "T9在T98牌面的实战", "clues": ["T98", "11%", "31%", "56%"], "a": ["T9在T98牌面为小尺度高频下注牌面，转牌圈继续高频半池下注。", "虽然很多河牌是坏牌，但该河牌适合全下。", "解算器混合过牌（11%）、全下（31%）和阻挡下注（56%），讲师选择全下。"], "note": ""}, {"id": "DGL#31-s13", "ep": "31", "type": "topic", "topic": "DGL#31 - 翻前加注者在不利位置3-bet底池的实战练习：低彩虹牌面高权益牌型的频率执行", "en": "PFR 3BP OOP Practicing - High Equity Hands on Low Rainbow Boards", "q": "JJ在843牌面的实战", "clues": ["RNG 14", "80%", "60%"], "a": ["JJ在843牌面，预期80%桶位，但实际为60%桶位，低于预期。", "转牌5♦时下注尺度在半个池和更大尺度之间选择，RNG 14时落入80-20拆分中的下注桶位 应纯下注，需要一些过牌。", "过牌加注使用小尺度，且至少60%频率选择过牌加注。"], "note": ""}, {"id": "DGL#31-s31", "ep": "31", "type": "topic", "topic": "DGL#31 - 翻前加注者在不利位置3-bet底池的实战练习：低彩虹牌面高权益牌型的频率执行", "en": "PFR 3BP OOP Practicing - High Equity Hands on Low Rainbow Boards", "q": "KK在772牌面的实战", "clues": ["AAs"], "a": ["KK在772牌面，选择纯下注，转牌5♠时无慢打理由。", "纯下注KK，AAs则慢打一部分。"], "note": ""}, {"id": "DGL#31-s32", "ep": "31", "type": "topic", "topic": "DGL#31 - 翻前加注者在不利位置3-bet底池的实战练习：低彩虹牌面高权益牌型的频率执行", "en": "PFR 3BP OOP Practicing - High Equity Hands on Low Rainbow Boards", "q": "KK在T96牌面的实战", "clues": ["T96", "10%"], "a": ["KK在T96牌面，转牌9♣时双方都有9X，但己方超对更多。", "对手被迫用大量A高牌跟注第二枪，己方有K9♦阻挡牌。", "使用10%小注，目标是绝对底端范围，解算器选择范围下注10%。"], "note": ""}, {"id": "DGL#31-s33", "ep": "31", "type": "topic", "topic": "DGL#31 - 翻前加注者在不利位置3-bet底池的实战练习：低彩虹牌面高权益牌型的频率执行", "en": "PFR 3BP OOP Practicing - High Equity Hands on Low Rainbow Boards", "q": "JJ在T98牌面的实战（第二次）", "clues": ["T98", "80%"], "a": ["JJ在T98牌面，选择80%桶位，转牌圈继续下注。", "河牌K♣为有利牌，选择纯下注并加大至四分之三池。"], "note": ""}, {"id": "DGL#31-s34", "ep": "31", "type": "topic", "topic": "DGL#31 - 翻前加注者在不利位置3-bet底池的实战练习：低彩虹牌面高权益牌型的频率执行", "en": "PFR 3BP OOP Practicing - High Equity Hands on Low Rainbow Boards", "q": "QQ在772牌面的实战", "clues": ["RNG 27"], "a": ["QQ在772牌面，转牌配对时对手有7X组合（A7、K7、87、76等）。", "RNG 27时仍选择下注QQ。"], "note": ""}, {"id": "DGL#31-s35", "ep": "31", "type": "topic", "topic": "DGL#31 - 翻前加注者在不利位置3-bet底池的实战练习：低彩虹牌面高权益牌型的频率执行", "en": "PFR 3BP OOP Practicing - High Equity Hands on Low Rainbow Boards", "q": "66在866牌面的实战", "clues": ["RNG 78", "T96", "60%", "25%"], "a": ["66在866牌面，执行40-60拆分，RNG 78时选择60%桶位。", "与之前T96牌面不同，因IP（有利位置）没有那么多8X，双方9X数量不同。", "高频25%下注仍对22-55和部分K高牌施压。"], "note": ""}, {"id": "DGL#31-s36", "ep": "31", "type": "topic", "topic": "DGL#31 - 翻前加注者在不利位置3-bet底池的实战练习：低彩虹牌面高权益牌型的频率执行", "en": "PFR 3BP OOP Practicing - High Equity Hands on Low Rainbow Boards", "q": "88在866牌面的实战", "clues": ["AAs", "80%"], "a": ["88在866牌面，选择80%桶位，被加注后选择全下。", "AAs和KK可慢打，来自翻前范围，可有效对抗88和99。"], "note": ""}, {"id": "DGL#31-s37", "ep": "31", "type": "topic", "topic": "DGL#31 - 翻前加注者在不利位置3-bet底池的实战练习：低彩虹牌面高权益牌型的频率执行", "en": "PFR 3BP OOP Practicing - High Equity Hands on Low Rainbow Boards", "q": "河牌圈混合策略", "clues": ["T98", "10%"], "a": ["河牌圈建议采用剥削性策略，因理论上河牌圈难以精通。", "在T98牌面河牌出现同花时，混合全下和阻挡下注。", "在866牌面河牌圈，A K和A J可10%下注，A A是足够的慢打牌来平衡过牌范围。"], "note": ""}, {"id": "DGL#31-s38", "ep": "31", "type": "topic", "topic": "DGL#31 - 翻前加注者在不利位置3-bet底池的实战练习：低彩虹牌面高权益牌型的频率执行", "en": "PFR 3BP OOP Practicing - High Equity Hands on Low Rainbow Boards", "q": "低SPR情况下的决策", "clues": ["SPR", "T75"], "a": ["在低SPR（如0.36）情况下，河牌圈应直接全下而非过牌弃牌。", "KK在843牌面河牌A♦时，即使权益不高也只能全下。", "在T75牌面河牌出现顺子或同花时，SPR决定无法弃牌。"], "note": ""}, {"id": "DGL#31-s39", "ep": "31", "type": "topic", "topic": "DGL#31 - 翻前加注者在不利位置3-bet底池的实战练习：低彩虹牌面高权益牌型的频率执行", "en": "PFR 3BP OOP Practicing - High Equity Hands on Low Rainbow Boards", "q": "直觉与频率技巧", "clues": ["T75", "10%"], "a": ["讲师多次强调信任直觉：若预感某手牌应如何打，跟随直觉通常正确。", "当不确定下注尺度且手牌应为混合策略时，选择过牌可避免EV损失错误。", "在T75牌面河牌圈，用10%小注引诱加注，成功获得QJ的加注。"], "note": ""}, {"id": "DGL#31-c0", "ep": "31", "type": "cloze", "topic": "DGL#31 - 翻前加注者在不利位置3-bet底池的实战练习：低彩虹牌面高权益牌型的频率执行", "en": "PFR 3BP OOP Practicing - High Equity Hands on Low Rainbow Boards", "q": "超对在低彩虹牌面上整体执行80-20拆分（＿＿下注、20%过牌）。", "clues": [], "a": ["翻牌圈持续下注（C-bet）中，超对在低彩虹牌面上整体执行80-20拆分（80%下注、20%过牌）。"], "note": "80%"}, {"id": "DGL#31-c1", "ep": "31", "type": "cloze", "topic": "DGL#31 - 翻前加注者在不利位置3-bet底池的实战练习：低彩虹牌面高权益牌型的频率执行", "en": "PFR 3BP OOP Practicing - High Equity Hands on Low Rainbow Boards", "q": "AAs仅＿＿下注，KK、QQ提升一个桶位至40-60，", "clues": [], "a": ["下注频率最高的是较低的超对（88-TT），执行80-20拆分；AAs仅20%下注，KK、QQ提升一个桶位至40-60，88-TT进入80%桶位。"], "note": "20%"}, {"id": "DGL#31-c2", "ep": "31", "type": "cloze", "topic": "DGL#31 - 翻前加注者在不利位置3-bet底池的实战练习：低彩虹牌面高权益牌型的频率执行", "en": "PFR 3BP OOP Practicing - High Equity Hands on Low Rainbow Boards", "q": "翻牌圈执行80-20拆分，RNG 32落入＿＿桶位，确定下注。", "clues": [], "a": ["第一手牌：AAs在866彩虹牌面，翻牌圈执行80-20拆分，RNG 32落入80%桶位，确定下注。"], "note": "80%"}, {"id": "DGL#31-note", "ep": "31", "type": "note", "topic": "DGL#31 - 翻前加注者在不利位置3-bet底池的实战练习：低彩虹牌面高权益牌型的频率执行", "en": "PFR 3BP OOP Practicing - High Equity Hands on Low Rainbow Boards", "q": "避坑提醒与行动项", "clues": ["DGL", "bet", "RNG"], "a": ["本视频是DGL系列第31期，承接了之前关于翻前加注者3-bet底池策略的理论框架，将频率启发式蓝图应用到实战训练中。视频通过大量RNG驱动的牌例，展示了频率策略在实际执行中的细微差别，特别是花色、阻挡牌和牌面结构对频率的调整。建议观众在观看前熟悉3-bet底池的基本范围构建和频率概念，观看后可进一步学习转牌圈尺度加大的具体规律以及河牌圈的剥削性策略。", "**应该这样做：**", "- 在低彩虹牌面，超对翻牌圈执行80-20拆分，转牌圈60-40拆分，AAs单独为40-60。", "- 暗三条在翻牌圈高频下注后，转牌圈大量慢打，执行40-60拆分中的40%下注桶位。", "- 当不确定下注尺度且手牌应为混合策略时，选择过牌来避免EV损失错误。", "- 在低SPR情况下（如0.36），河牌圈直接全下而非过牌弃牌。", "- 信任直觉：若预感某手牌应如何打，跟随直觉通常正确。", "**不要这样做：**", "- 不要在所有牌面机械执行统一频率，需根据牌面结构（如T98、T75等）调整。", "- 不要忽视花色对频率的影响，特别是AAs和KK带特定花色时过牌更多。", "- 不要在河牌圈面对大量坏牌时强行价值下注，应选择过牌。", "- 不要在没有阻挡牌的情况下过度慢打，阻挡牌是慢打频率的重要依据。", "- 不要在SPR极低时尝试过牌弃牌，应主动全下。"], "note": ""}, {"id": "DGL#32-intro", "ep": "32", "type": "intro", "topic": "DGL#32 手牌复盘：GTO策略支柱与通用启发式法则", "en": "Hand Review Pillars of GTO Strategy and Universal Heuristics", "q": "DGL#32 手牌复盘：GTO策略支柱与通用启发式法则", "clues": ["Pillars of GTO", "Strategy", "A7o"], "a": ["本视频通过复盘一手GG扑克10/20级别的手牌，系统讲解了GTO策略中的几个核心支柱（Pillars of GTO Strategy）以及可迁移到实战中的通用启发式法则（Universal Heuristics）。讲师以A7o在庄位开局、大盲跟注的单挑底池为例，从翻牌圈开始逐步拆解每个街口的策略选择，并结合GTO求解器（Solver）验证理论要点。", "视频重点强调了三个GTO支柱：一是翻牌圈高牌面（A高翻牌）应采用大尺度下注或过牌的极化策略；二是转牌圈必须慢玩部分强牌（包括顶对）以保持范围平衡；三是转牌圈的下注范围中必须包含纯空气牌，否则河牌圈将无法构建平衡的诈唬范围。讲师通过求解器数据展示了每个决策点的具体频率和组合选择。", "视频还详细分析了河牌圈薄价值下注的适宜性、面对过牌加注时的跟注决策，以及如何从对手的摊牌手牌中读取信息并调整后续策略。整体内容既有理论高度，又提供了大量可操作的实战原则，适合有一定基础的玩家深入学习。"], "note": ""}, {"id": "DGL#32-s0", "ep": "32", "type": "topic", "topic": "DGL#32 手牌复盘：GTO策略支柱与通用启发式法则", "en": "Hand Review Pillars of GTO Strategy and Universal Heuristics", "q": "翻牌圈A高牌面的策略", "clues": ["A7o", "A5o", "A8o", "40%"], "a": ["在A♠K♦4♦这类两色翻牌面上，庄位玩家应采用“大尺度下注或过牌”的极化策略，下注尺度约为1.2倍底池，整体下注频率约40%。", "顶对弱踢脚（如A7o）属于低频下注范围，应作为低频率组合处理，下注频率约10%-30%不等。", "具体而言，A5o下注频率约10%，A8o约30%，A7o建议采用约20%的下注频率，其余时间过牌。", "即使采用20%频率下注，80%的时间过牌也是正确打法，不必过度纠结微观频率，应关注宏观策略框架。"], "note": ""}, {"id": "DGL#32-s1", "ep": "32", "type": "topic", "topic": "DGL#32 手牌复盘：GTO策略支柱与通用启发式法则", "en": "Hand Review Pillars of GTO Strategy and Universal Heuristics", "q": "转牌圈慢玩强牌的必要性", "clues": ["GTO", "A7o", "80%", "15%"], "a": ["转牌发出6♦后，大盲位过牌频率极高，约80%时间过牌，下注时倾向使用大尺度（如3/4底池）。", "庄位在转牌圈应重新开放下注范围，但范围相对偏紧，采用大尺度下注（3/4底池或略超池均可）。", "GTO视角下，翻牌圈过牌的顶对在转牌圈仍需大量慢玩，即使A7o已处于范围顶端，也应属于前15%的强牌范围。", "求解器显示，像A♠T♠这样拥有88%权益的超级强牌，转牌圈仍应约25%的频率过牌慢玩，这是保持范围平衡的关键。", "顶对整体在转牌圈约60%过牌、40%下注；若只看低踢脚顶对，下注频率降至约25%，大部分时间应留在过牌范围中。"], "note": ""}, {"id": "DGL#32-s2", "ep": "32", "type": "topic", "topic": "DGL#32 手牌复盘：GTO策略支柱与通用启发式法则", "en": "Hand Review Pillars of GTO Strategy and Universal Heuristics", "q": "转牌圈下注范围必须包含空气牌", "clues": ["GTO", "27%", "60%", "20%"], "a": ["转牌圈构建下注范围时，必须保留纯空气牌和低对子，这是GTO策略的另一支柱，否则河牌圈将无法平衡价值下注。", "求解器显示，无成牌无听牌的纯空气牌在转牌圈约27%的频率下注，包括大量随机的J高、T高、9高组合。", "具体空气牌组合包括：9♠7♠（60%下注）、9♥7♥、9♥8♥、9♠8♠、T♥7♥、T♠7♠、J♥5♥、J♥3♥（约20%下注）、9♦8♦（约50%下注）等。", "这些“垃圾牌”必须下注的原因在于：河牌圈诈唬需要从转牌圈的空气牌中抽取，如果转牌不带空气牌，河牌将无诈唬可用。", "河牌发出T♥后，转牌圈的卡顺听牌（如QJ、QT、JT）要么已成对要么已成顺，T9、T8等也成了对子，因此必须依赖转牌圈带来的纯空气牌来完成河牌诈唬。"], "note": ""}, {"id": "DGL#32-s3", "ep": "32", "type": "topic", "topic": "DGL#32 手牌复盘：GTO策略支柱与通用启发式法则", "en": "Hand Review Pillars of GTO Strategy and Universal Heuristics", "q": "河牌圈薄价值下注与诈唬范围构建", "clues": ["A7o", "check", "pair on the", "board"], "a": ["河牌T♥发出后，A7o下注半池属于偏薄的价值下注，求解器显示A7o应为纯过牌（check）或仅极低频率下注，半池下注可能过于激进。", "构建河牌圈过牌加注诈唬范围时，应遵循以下原则：阻挡对手跟注范围、阻挡坚果牌、不阻挡对手弃牌范围。", "通常应选择带有牌面配对（pair on the board）的组合作为诈唬，因为能提高阻挡牌质量；若此类组合不足，再选择其他诈唬候选。", "大盲位面对半池下注的过牌加注范围中，价值加注主要为QJ和AT（AT确定加注，QJ部分加注），以及少量T6s（如T♦6♦）和KT（求解器可能不加注KT）。", "诈唬加注的优质候选包括：KQ、KJ非同花组合（不阻挡对手弃牌范围，同时阻挡QJ和KT等坚果组合），以及部分6x组合（阻挡暗三条和两对）。", "其他可用诈唬包括：Q♣6♣、J♣6♣（转牌圈已有部分加注频率但仍保留）、QT、JT（少量）、Q♦4♦、J♦4♦（若在范围内）等。"], "note": ""}, {"id": "DGL#32-s4", "ep": "32", "type": "topic", "topic": "DGL#32 手牌复盘：GTO策略支柱与通用启发式法则", "en": "Hand Review Pillars of GTO Strategy and Universal Heuristics", "q": "频率原则与组合选择", "clues": ["J6s", "Q6s"], "a": ["一个可迁移的通用频率原则：当你的范围中包含大量性质各异的半成品牌时，最优策略往往是让所有这些组合都以某种较低频率被选用。", "求解器显示，大盲位面对半池下注的过牌加注范围中，价值加注集中在QJ和AT，诈唬则从QT、JT、KQ、KJ、J6s、Q6s以及少量Qx空气牌（如Q♦4♦）中抽取。", "部分顶对（如AJ、A9）也会被纳入加注范围，这可能是求解器的微小不精确，但整体策略仍以诈唬上述组合为主。", "面对加注时，庄位应弃掉AJ、A9等顶对，仅用两对以上强牌及部分强顶对跟注。"], "note": ""}, {"id": "DGL#32-s5", "ep": "32", "type": "topic", "topic": "DGL#32 手牌复盘：GTO策略支柱与通用启发式法则", "en": "Hand Review Pillars of GTO Strategy and Universal Heuristics", "q": "从摊牌中读取信息与调整", "clues": ["GTO"], "a": ["本手牌中，大盲位用K♦J♦（KJ同花）过牌加注，但求解器显示KJ并非该场景下的推荐诈唬组合，因为KJ阻挡了对手的弃牌范围（如KQ、KT等）。", "大盲位选择KJ而非更优的KQ、KJ非同花等候选，说明其诈唬频率可能过高，属于剥削性打法。", "实战中看到此类摊牌后，应记录对手的倾向，并在未来对局中调整策略：例如更倾向于用中等强度牌跟注其加注，或更频繁地价值下注。", "讲师强调，理解GTO启发式法则后，结合摊牌信息进行针对性调整，是提升长期盈利的关键。"], "note": ""}, {"id": "DGL#32-c0", "ep": "32", "type": "cloze", "topic": "DGL#32 手牌复盘：GTO策略支柱与通用启发式法则", "en": "Hand Review Pillars of GTO Strategy and Universal Heuristics", "q": "下注尺度约为1.2倍底池，整体下注频率约＿＿。", "clues": [], "a": ["在A♠K♦4♦这类两色翻牌面上，庄位玩家应采用“大尺度下注或过牌”的极化策略，下注尺度约为1.2倍底池，整体下注频率约40%。"], "note": "40%"}, {"id": "DGL#32-c1", "ep": "32", "type": "cloze", "topic": "DGL#32 手牌复盘：GTO策略支柱与通用启发式法则", "en": "Hand Review Pillars of GTO Strategy and Universal Heuristics", "q": "约＿＿时间过牌，下注时倾向使用大尺度（如3/4底池）。", "clues": [], "a": ["转牌发出6♦后，大盲位过牌频率极高，约80%时间过牌，下注时倾向使用大尺度（如3/4底池）。"], "note": "80%"}, {"id": "DGL#32-c2", "ep": "32", "type": "cloze", "topic": "DGL#32 手牌复盘：GTO策略支柱与通用启发式法则", "en": "Hand Review Pillars of GTO Strategy and Universal Heuristics", "q": "无成牌无听牌的纯空气牌在转牌圈约＿＿的频率下注，包括大量随机的J高、T高、9高组合。", "clues": [], "a": ["求解器显示，无成牌无听牌的纯空气牌在转牌圈约27%的频率下注，包括大量随机的J高、T高、9高组合。"], "note": "27%"}, {"id": "DGL#32-note", "ep": "32", "type": "note", "topic": "DGL#32 手牌复盘：GTO策略支柱与通用启发式法则", "en": "Hand Review Pillars of GTO Strategy and Universal Heuristics", "q": "避坑提醒与行动项", "clues": ["DGL", "GTO", "A7o"], "a": ["本视频属于DGL系列第32期，延续了社区中关于GTO策略的系统教学，重点在于将抽象理论转化为实战可用的启发式规则。视频中提到的“三大支柱”——翻牌极化下注、转牌慢玩强牌、转牌保留空气牌——是构建平衡范围的基础框架，建议玩家在模拟器或实战中反复练习。", "值得进一步学习的方向包括：不同翻牌面结构下的极化与融合策略差异、转牌圈慢玩频率的具体调整（如不同踢脚、不同听牌组合）、以及河牌圈面对加注时的跟注范围构建。此外，讲师提到的“频率原则”（低频率选用多种组合）可作为现场决策的快速参考。", "**行动项与常见错误：**", "- 应做：翻牌A高面采用大尺度下注或过牌，避免小尺度下注。", "- 应做：转牌圈保留部分顶对在过牌范围中，即使它们很强。", "- 应做：转牌圈下注范围中必须包含纯空气牌，为河牌诈唬做准备。", "- 应做：构建河牌诈唬加注时，优先选择阻挡坚果且不阻挡弃牌范围的组合（如KQ、KJ非同花）。", "- 不应做：河牌用A7o做半池薄价值下注，求解器显示应过牌。", "- 不应做：用KJ同花作为河牌诈唬加注，因其阻挡了对手的弃牌范围。", "- 不应做：忽视摊牌信息，看到对手使用非最优组合后应及时调整策略。"], "note": ""}, {"id": "DGL#33-intro", "ep": "33", "type": "intro", "topic": "DGL#33 - 翻前加注底池、不利位置手牌复盘：过牌加注与阻挡牌启发式策略", "en": "PFR 3BP OOP Hand Review - Heuristics", "q": "DGL#33 - 翻前加注底池、不利位置手牌复盘：过牌加注与阻挡牌启发式策略", "clues": ["Manuel Saavedra", "Cameron Koach", "bet pot"], "a": ["本视频通过分析 Manuel Saavedra 与 Cameron Koach 在 10-20 级别的一手牌局，系统讲解了翻前加注底池（3-bet pot）中不利位置（OOP）玩家的关键策略启发式。视频以 554 彩虹翻牌面为起点，重点阐述了超牌（overcards）的下注频率与花色选择、转牌圈顶对顶踢脚的过牌平衡，以及河牌圈面对对手有利牌张时的诈唬频率调整。", "视频的核心观点是：在翻前加注底池中，OOP 玩家必须掌握基于频率的策略框架，同时理解阻挡牌（blockers）对对手行动频率的微妙影响。讲师通过 PioSolver 模拟数据展示了花色差异如何改变具体组合的玩法，并强调了“顶对强踢脚需要混合过牌”这一平衡原则。最后，视频还探讨了河牌圈价值下注范围收窄时，诈唬频率必须相应调整的数学逻辑。", "整体内容属于中级至高级策略教学，适合已掌握基础概念、希望深入理解 GTO 频率与阻挡牌应用的玩家。视频以一手真实牌局为线索，将多个独立策略原则串联起来，形成了完整的决策链条。"], "note": ""}, {"id": "DGL#33-s0", "ep": "33", "type": "topic", "topic": "DGL#33 - 翻前加注底池、不利位置手牌复盘：过牌加注与阻挡牌启发式策略", "en": "PFR 3BP OOP Hand Review - Heuristics", "q": "翻牌圈低彩虹牌面的下注策略", "clues": ["OOP", "Manuel", "half pot", "overcards"], "a": ["在 554 彩虹翻牌面（以及等效的 533 牌面）上，OOP 玩家应采用中等尺度、中等频率的下注策略。Manuel 选择了半池下注（half pot），这正是讲师推荐的标准做法。", "超牌（overcards）在此类牌面上属于混合策略下注组合，玩家必须根据具体花色进行随机化。讲师强调“注意你的花色”是执行此类策略的关键。", "以 KQo 为例：没有草花时采用 60-40 的下注-过牌比例；有草花时则反转至 40-60。原因是持有草花会阻挡对手大量的同花听牌组合，从而降低对手的过牌-加注威胁。", "KJo 呈现类似模式，但整体下注频率略低：无草花时 40-60，有草花时 20-80。这些具体数值来自 PioSolver 模拟，可直接作为实战参考。", "全局下注频率是决定单个组合玩法的基准线。本牌面 OOP 整体下注频率为 60%，玩家应以此为基础，再根据具体组合的阻挡牌属性进行微调。"], "note": ""}, {"id": "DGL#33-s1", "ep": "33", "type": "topic", "topic": "DGL#33 - 翻前加注底池、不利位置手牌复盘：过牌加注与阻挡牌启发式策略", "en": "PFR 3BP OOP Hand Review - Heuristics", "q": "转牌圈顶对顶踢脚的过牌平衡", "clues": ["OOP", "Manuel", "top pair with", "strong kicker"], "a": ["转牌发出 Q♠ 后，OOP 玩家持有顶对顶踢脚（如 KQ），此时大多数玩家会倾向持续下注，但讲师明确指出这是“纯粹的坏习惯”。Manuel 选择了过牌，这是理论上的正确做法。", "关键原则：在翻前加注底池中，OOP 玩家的顶对强踢脚（top pair with strong kicker）必须有一定频率的过牌，以平衡整体策略。讲师通过 PioSolver 数据展示，KQ 全局过牌频率约为 50%。", "具体到 KQ 组合，花色差异导致显著分化：K♠Q（带黑桃 K）从不下注，而 KQ 不带黑桃时几乎总是下注（除非带草花 K 时略有差异）。这种“一手牌总是过牌、另一手总是下注”的现象，根源在于阻挡牌对对手行动频率的影响。", "理解逻辑：当一手强牌被 Solver 选择过牌时，原因通常是其阻挡牌增加了过牌的期望值。具体机制是——持有特定阻挡牌时，你面对对手下注的频率会更高，从而提升过牌的收益。"], "note": ""}, {"id": "DGL#33-s2", "ep": "33", "type": "topic", "topic": "DGL#33 - 翻前加注底池、不利位置手牌复盘：过牌加注与阻挡牌启发式策略", "en": "PFR 3BP OOP Hand Review - Heuristics", "q": "阻挡牌与对手下注频率的量化分析", "clues": ["PioSolver", "combo", "OOP", "float"], "a": ["讲师使用 PioSolver 的“frequencies versus one combo”功能，验证了阻挡牌假设。转牌圈 IP 玩家整体下注频率为 39%，但针对 OOP 不同 KQ 组合，该频率存在差异。", "当 OOP 持有 K♥Q♦ 时，IP 下注频率降至 34%。这是因为 K♥Q♦ 阻挡了 IP 大量在翻牌圈漂浮（float）的 K-high 同花听牌组合，这些组合是 IP 转牌诈唬的主要来源。", "当 OOP 持有 K♠Q 时，IP 下注频率升至 36%。原因在于 IP 的慢玩组合（如 K♠Q 本身）以及大量 K-high 同花听牌（K♠7♠ 过牌 40%、K♠8♠ 过牌 60%、K♠9♠ 过牌 60%）都包含黑桃 K，持有 K♠ 会阻挡这些过牌组合，从而面对更多下注。", "这 2% 的频率差异足以改变策略选择：面对更多下注时，过牌的期望值（EV）上升，因此 Solver 选择纯过牌。K♣ 则处于中间位置，面对 35% 的下注频率——持有草花 K 时，不阻挡对手的方块同花听牌，因此对手下注频率略高于无阻挡情况。", "讲师提醒：这些花色细节在实战中可能过于微妙，取决于对手的实际策略，不必过度纠结。但理解其背后的 GTO 逻辑有助于建立正确的频率直觉。"], "note": ""}, {"id": "DGL#33-s3", "ep": "33", "type": "topic", "topic": "DGL#33 - 翻前加注底池、不利位置手牌复盘：过牌加注与阻挡牌启发式策略", "en": "PFR 3BP OOP Hand Review - Heuristics", "q": "顶对弱踢脚的混合策略", "clues": ["high", "OOP", "35%"], "a": ["讲师隔离了 QJ、QT、Q9、Q8 等顶对弱踢脚组合，发现它们整体过牌频率为 35%，即采用 60-40 的下注-过牌比例。这与“数字蓝图”课程中关于顶对弱踢脚的标准分桶一致。", "AQ 的过牌频率也相当高，这主要归因于 A 的阻挡牌效应——IP 玩家的大量过牌组合来自 A-high，持有 A 会阻挡这些过牌，从而影响策略选择。", "核心结论：即使转牌对 OOP 有利（发出 Q），也不应无差别地持续下注所有顶对。保持一定比例的过牌是维持策略平衡、防止被剥削的关键。"], "note": ""}, {"id": "DGL#33-s4", "ep": "33", "type": "topic", "topic": "DGL#33 - 翻前加注底池、不利位置手牌复盘：过牌加注与阻挡牌启发式策略", "en": "PFR 3BP OOP Hand Review - Heuristics", "q": "河牌圈有利牌张与诈唬频率调整", "clues": ["OOP", "Solverland", "high", "over-bluffing"], "a": ["河牌发出 K 后，该牌张对 OOP 玩家极为有利，因为 OOP 范围中包含大量 KX 组合、AK 以及慢玩的 KQ。此时 OOP 的价值范围显著扩大，IP 玩家必须相应调整诈唬策略。", "关键数据：在 Solverland 中，IP 玩家平均应在河牌放弃约 50% 的诈唬组合。但当 K 出现时，A-high 或更差的诈唬组合需要放弃 63%，显著高于平均值。", "对比实验：如果将河牌换成 T♣（不缩小 IP 的价值范围），A-high 或更差的组合仅需放弃 47%，接近标准 50%。这证明了“对手价值范围扩大时，诈唬频率必须收缩”的原则。", "讲师强调：当河牌对对手有利时，你的价值下注范围缩小，诈唬频率必须相应降低，否则会出现过度诈唬（over-bluffing）的问题。"], "note": ""}, {"id": "DGL#33-s5", "ep": "33", "type": "topic", "topic": "DGL#33 - 翻前加注底池、不利位置手牌复盘：过牌加注与阻挡牌启发式策略", "en": "PFR 3BP OOP Hand Review - Heuristics", "q": "价值下注范围收窄时的频率再调整", "clues": ["OOP", "PioSolver", "GTO", "78%"], "a": ["讲师假设一种常见情况：OOP 玩家在河牌不愿用 AQ 价值下注（因为担心对手可能用 AK 过牌-跟注）。通过 PioSolver 锁定 AQ 为纯过牌后，重新模拟策略。", "模拟结果：当不价值下注 AQ 时，IP 玩家需要放弃 78% 的诈唬组合（接近 80%），远高于标准的 63%。这是因为价值下注范围收窄后，诈唬组合必须相应减少以维持平衡。", "实战启示：大多数玩家价值下注比 GTO 更紧，因此必须更激进地控制诈唬频率。如果实际价值下注范围比理论窄，却仍按标准频率诈唬，就会导致过度诈唬。", "讲师建议：在实战中，如果你不确定是否应该价值下注某手牌，宁可选择过牌，同时大幅提高诈唬放弃率，以确保整体策略不失衡。"], "note": ""}, {"id": "DGL#33-s6", "ep": "33", "type": "topic", "topic": "DGL#33 - 翻前加注底池、不利位置手牌复盘：过牌加注与阻挡牌启发式策略", "en": "PFR 3BP OOP Hand Review - Heuristics", "q": "河牌圈反主动全下的可行性分析", "clues": ["OOP", "donk jam", "high", "PioSolver"], "a": ["讲师最后探讨了 OOP 在河牌 K 发出后是否应该采用反主动全下（donk jam）策略。从范围构成看，IP 玩家（红色）持有大量中等强度牌（顶对和口袋对），而 OOP 拥有大量 KX、AK 和慢玩的 KQ，似乎具备全下条件。", "但问题在于 OOP 的诈唬组合不足——大部分诈唬牌在转牌仍有不错的权益，真正的空气牌仅限于超低口袋对和部分 A-high。因此，OOP 的全下范围非常有限。", "PioSolver 显示 OOP 仅有 3% 的全下频率，且全部来自 AA。这符合逻辑：AA 阻挡了对手的诈唬组合（A-high），同时阻挡了 AQ 的价值下注，因此更适合主动全下而非过牌-加注。", "结论：在类似牌面结构中，反主动全下应极其谨慎使用，仅当持有阻挡牌且范围中空气组合极少时才考虑。大多数情况下，过牌仍是更优选择。"], "note": ""}, {"id": "DGL#33-c0", "ep": "33", "type": "cloze", "topic": "DGL#33 - 翻前加注底池、不利位置手牌复盘：过牌加注与阻挡牌启发式策略", "en": "PFR 3BP OOP Hand Review - Heuristics", "q": "本牌面 OOP 整体下注频率为 ＿＿，玩家应以此为基础，", "clues": [], "a": ["全局下注频率是决定单个组合玩法的基准线。本牌面 OOP 整体下注频率为 60%，玩家应以此为基础，再根据具体组合的阻挡牌属性进行微调。"], "note": "60%"}, {"id": "DGL#33-c1", "ep": "33", "type": "cloze", "topic": "DGL#33 - 翻前加注底池、不利位置手牌复盘：过牌加注与阻挡牌启发式策略", "en": "PFR 3BP OOP Hand Review - Heuristics", "q": "讲师通过 PioSolver 数据展示，KQ 全局过牌频率约为 ＿＿。", "clues": [], "a": ["关键原则：在翻前加注底池中，OOP 玩家的顶对强踢脚（top pair with strong kicker）必须有一定频率的过牌，以平衡整体策略。讲师通过 PioSolver 数据展示，KQ 全局过牌频率约为 50%。"], "note": "50%"}, {"id": "DGL#33-c2", "ep": "33", "type": "cloze", "topic": "DGL#33 - 翻前加注底池、不利位置手牌复盘：过牌加注与阻挡牌启发式策略", "en": "PFR 3BP OOP Hand Review - Heuristics", "q": "转牌圈 IP 玩家整体下注频率为 ＿＿，但针对 OOP 不同 KQ 组合，", "clues": [], "a": ["讲师使用 PioSolver 的“frequencies versus one combo”功能，验证了阻挡牌假设。转牌圈 IP 玩家整体下注频率为 39%，但针对 OOP 不同 KQ 组合，该频率存在差异。"], "note": "39%"}, {"id": "DGL#33-note", "ep": "33", "type": "note", "topic": "DGL#33 - 翻前加注底池、不利位置手牌复盘：过牌加注与阻挡牌启发式策略", "en": "PFR 3BP OOP Hand Review - Heuristics", "q": "避坑提醒与行动项", "clues": ["DGL", "OOP", "GTO"], "a": ["本视频属于“数字蓝图”系列课程（DGL）的第 33 期，聚焦于翻前加注底池中 OOP 玩家的策略启发式。视频以一手真实牌局为案例，串联了翻牌圈超牌下注、转牌圈顶对平衡、河牌圈诈唬频率调整等多个核心主题，适合已经掌握基础 GTO 概念、希望深化频率与阻挡牌理解的玩家。讲师在视频中多次引用 PioSolver 模拟数据，展示了如何利用软件验证策略假设。", "值得进一步学习的方向包括：PioSolver 的“frequencies versus one combo”功能使用、不同牌面结构下顶对的分桶策略、以及价值下注范围与诈唬频率的动态匹配关系。视频中提到的花色细节虽然在实际对战中可能过于微妙，但理解其背后的逻辑有助于建立更精准的频率直觉。", "**行动项与常见错误：**", "- 在低彩虹翻牌面（如 554、533），超牌应采用中等尺度、中等频率下注，并根据花色调整具体组合的玩法。", "- 转牌发出对 OOP 有利的牌张时，顶对强踢脚必须保留一定过牌频率（如 KQ 约 50%），避免无差别持续下注。", "- 河牌对对手有利时，诈唬放弃率应显著提高（如从 50% 升至 63%），切勿机械套用标准频率。", "- 如果价值下注范围比 GTO 更紧（如不价值下注 AQ），诈唬放弃率需进一步大幅提高（约 80%），防止过度诈唬。", "- 反主动全下应极其谨慎，仅在持有阻挡牌且空气组合极少时考虑（如 AA 全下 3% 频率）。", "- 常见错误：在转牌持有顶对时过度下注、忽视花色对阻挡牌的影响、河牌价值范围收窄后仍按标准频率诈唬。"], "note": ""}, {"id": "DGL#34-intro", "ep": "34", "type": "intro", "topic": "DGL#34 - 翻前加注者3-bet底池不利位置手牌回顾：提升阻挡牌识别能力", "en": "PFR 3BP OOP Hand Review - Improving Blocker Recognition", "q": "DGL#34 - 翻前加注者3-bet底池不利位置手牌回顾：提升阻挡牌识别能力", "clues": ["Doze of Green", "Manoel", "camera"], "a": ["本视频是“Doze of Green”系列手牌回顾的延续，聚焦于上一集分析过的一手10/20级别、有效筹码约100BB的牌局：翻前CO位玩家（Manoel）用KQ开局加注，翻后双方打到河牌，最终Manoel用KQ在河牌面8♠发出后跟注并赢下底池。本集从对手（camera）视角出发，重点分析河牌圈诈唬手牌选择背后的阻挡牌逻辑。", "讲师指出，许多玩家在河牌圈拿到错过的同花听牌（尤其是A高牌）时会本能地放弃诈唬，但GTO模拟显示，在特定场景下，错过的坚果同花听牌（如A♠X♠）恰恰是纯诈唬手牌，而其他错过的同花听牌（如J♠T♠、9♠8♠）反而应该放弃。这一反直觉结论的核心在于阻挡牌——玩家需要判断自己的手牌与对手弃牌范围及跟注范围的互动关系，而非简单套用“错过的同花听牌就该放弃”的启发式规则。", "视频通过具体频率数据（如36% vs 32%的弃牌权益）和组合分析，系统展示了如何通过识别对手河牌圈的弃牌范围（主要是中对T-7）和跟注范围（主要是带A♠的强牌）来优化诈唬手牌选择，并提出了“双重阻挡弃牌范围则放弃、单一阻挡弃牌范围则混合、阻挡跟注范围则纯诈唬”的决策框架。"], "note": ""}, {"id": "DGL#34-s0", "ep": "34", "type": "topic", "topic": "DGL#34 - 翻前加注者3-bet底池不利位置手牌回顾：提升阻挡牌识别能力", "en": "PFR 3BP OOP Hand Review - Improving Blocker Recognition", "q": "手牌背景回顾", "clues": ["Manoel", "camera", "100BB"], "a": ["牌局为10/20级别，有效筹码约100BB，翻前CO位玩家Manoel用KQ开局加注，对手在盲注位防守。", "翻牌圈双方过牌，转牌圈对手下注，Manoel跟注，河牌发出8♠，对手全下，Manoel跟注并赢下底池。", "本集从对手（camera）视角分析，聚焦于河牌圈诈唬手牌的选择逻辑，而非Manoel的跟注决策。"], "note": ""}, {"id": "DGL#34-s1", "ep": "34", "type": "topic", "topic": "DGL#34 - 翻前加注者3-bet底池不利位置手牌回顾：提升阻挡牌识别能力", "en": "PFR 3BP OOP Hand Review - Improving Blocker Recognition", "q": "反直觉结论：A高错过的同花听牌是纯诈唬", "clues": [], "a": ["模拟显示，A♠X♠（如A♠9♠、A♠8♠、A♠7♠）在河牌圈是纯诈唬手牌，而J♠T♠、J♠9♠等错过的同花听牌则应该放弃。", "许多玩家的常见误区是“拿到A高错过的同花听牌就该自动放弃”，但这一启发式在特定场景下是错误的。", "另一个误区是“我在范围底部（如7♣6♣）就应该总是诈唬”，而A高可能有摊牌价值就该过牌——这同样不成立。", "核心原因在于阻挡牌：A♠阻挡了对手跟注范围中的大量强牌组合，而J♠T♠等手牌对弃牌范围的阻挡效果更差。"], "note": ""}, {"id": "DGL#34-s2", "ep": "34", "type": "topic", "topic": "DGL#34 - 翻前加注者3-bet底池不利位置手牌回顾：提升阻挡牌识别能力", "en": "PFR 3BP OOP Hand Review - Improving Blocker Recognition", "q": "阻挡牌分析：A♠为何是理想诈唬牌", "clues": ["check-call", "AQo"], "a": ["对手河牌圈没有领先下注范围（上一集已确认），其跟注范围主要由强牌构成。", "对手能拿到的AK组合中，最高频率的是A♠K♠，因为A♠K♠在转牌圈可以作为过牌跟注（check-call）保留摊牌价值，且阻挡了同花听牌。", "对手的口袋对子A（AA）组合中，最可能的也是带A♠的组合，因为A♠是转牌圈最明显的慢玩牌（阻挡同花听牌）。", "对手的AQo组合中，唯一能跟注到河牌的也是带A♠的AQo。", "持有A♠时，虽然会轻微阻挡对手弃牌范围中的一些大型同花听牌，但对跟注范围的阻挡效果更大——净效应是增加诈唬成功率。"], "note": ""}, {"id": "DGL#34-s3", "ep": "34", "type": "topic", "topic": "DGL#34 - 翻前加注者3-bet底池不利位置手牌回顾：提升阻挡牌识别能力", "en": "PFR 3BP OOP Hand Review - Improving Blocker Recognition", "q": "频率数据对比：A♠带来的4%弃牌权益差异", "clues": ["half pot", "32%", "36.27%", "33.72%"], "a": ["下注尺度为半池（half pot），诈唬需要至少32%的弃牌权益才能保本盈利。", "持有8♠9♠时，弃牌权益为36.27%，刚好超过保本线，可以诈唬。", "持有J♠9♠时，弃牌权益为32%出头，勉强达到保本线。", "持有J♦9♦时，弃牌权益为33.72%，不足以支持诈唬（因为J♦9♦没有A♠阻挡效果）。", "对比J♠9♠（32%）与A♠9♠（36%），仅因A♠的存在就带来约4%的弃牌权益差异——这4%在边缘场景中决定了诈唬是否盈利。"], "note": ""}, {"id": "DGL#34-s4", "ep": "34", "type": "topic", "topic": "DGL#34 - 翻前加注者3-bet底池不利位置手牌回顾：提升阻挡牌识别能力", "en": "PFR 3BP OOP Hand Review - Improving Blocker Recognition", "q": "对手弃牌范围识别：中对T-7是主要弃牌来源", "clues": [], "a": ["对手在转牌圈过牌跟注后，河牌圈面对全下，其弃牌范围主要是中对口袋对子T到7（TT、99、88、77）。", "对手弃牌范围中虽然也包括A♠X♠错过的同花听牌，但组合数很少，不是主要来源。", "弃牌范围的主体是T-7这些中等对子，因此持有9♠8♠（双重阻挡T-7）会显著减少对手的弃牌组合，降低诈唬成功率。", "持有A♠9♠时，A♠不阻挡T-7这些弃牌组合，同时阻挡了对手跟注范围中的强牌——这是理想的诈唬手牌特征。"], "note": ""}, {"id": "DGL#34-s5", "ep": "34", "type": "topic", "topic": "DGL#34 - 翻前加注者3-bet底池不利位置手牌回顾：提升阻挡牌识别能力", "en": "PFR 3BP OOP Hand Review - Improving Blocker Recognition", "q": "决策框架：阻挡牌与弃牌/跟注范围的互动", "clues": ["mixed strategy", "pure bet"], "a": ["判断诈唬手牌的第一步是思考：我的手牌如何与对手的弃牌范围和跟注范围互动？并非所有阻挡牌都同等重要。", "持有双重阻挡弃牌范围的手牌（如9♠8♠阻挡T-7）时，应该放弃诈唬，因为对手的弃牌组合被大幅削减。", "持有单一阻挡弃牌范围的手牌（如A♠8♠，8阻挡部分中对但A不阻挡）时，通常作为混合策略（mixed strategy）处理，部分频率诈唬、部分频率过牌。", "持有对跟注范围有强阻挡效果的手牌（如A♠9♠，A♠阻挡对手AA、AK、AQ中的A♠组合）时，应该纯诈唬（pure bet）。", "这一框架适用于所有河牌圈诈唬决策：先预判对手的弃牌范围和跟注范围，再选择与之互动最佳的手牌。"], "note": ""}, {"id": "DGL#34-s6", "ep": "34", "type": "topic", "topic": "DGL#34 - 翻前加注者3-bet底池不利位置手牌回顾：提升阻挡牌识别能力", "en": "PFR 3BP OOP Hand Review - Improving Blocker Recognition", "q": "实战应用：如何预判对手范围", "clues": [], "a": ["在本手牌中，预判对手跟注范围时，应意识到对手的AK、AA、AQ等强牌组合中，带A♠的组合是最可能的慢玩选择（因为A♠阻挡同花听牌，适合在转牌圈过牌跟注）。", "预判对手弃牌范围时，应意识到主要来源是T-7的中等对子，而非错过的同花听牌。", "基于上述预判，应避免用带中间牌（如9、8）的手牌诈唬，而应优先选择带A♠的手牌诈唬。", "这种预判能力是进阶策略的核心，也是避免在特定场景下被剥削的关键。"], "note": ""}, {"id": "DGL#34-c0", "ep": "34", "type": "cloze", "topic": "DGL#34 - 翻前加注者3-bet底池不利位置手牌回顾：提升阻挡牌识别能力", "en": "PFR 3BP OOP Hand Review - Improving Blocker Recognition", "q": "有效筹码约＿＿，翻前CO位玩家Manoel用KQ开局加注，", "clues": [], "a": ["牌局为10/20级别，有效筹码约100BB，翻前CO位玩家Manoel用KQ开局加注，对手在盲注位防守。"], "note": "100BB"}, {"id": "DGL#34-c3", "ep": "34", "type": "cloze", "topic": "DGL#34 - 翻前加注者3-bet底池不利位置手牌回顾：提升阻挡牌识别能力", "en": "PFR 3BP OOP Hand Review - Improving Blocker Recognition", "q": "下注尺度为半池（half pot），诈唬需要至少＿＿的弃牌权益才能保本盈利。", "clues": [], "a": ["下注尺度为半池（half pot），诈唬需要至少32%的弃牌权益才能保本盈利。"], "note": "32%"}, {"id": "DGL#34-note", "ep": "34", "type": "note", "topic": "DGL#34 - 翻前加注者3-bet底池不利位置手牌回顾：提升阻挡牌识别能力", "en": "PFR 3BP OOP Hand Review - Improving Blocker Recognition", "q": "避坑提醒与行动项", "clues": ["Doze of Green", "bet", "mixed strategy"], "a": ["本视频是“Doze of Green”系列的第34集，承接上一集的手牌回顾，从对手视角深入分析河牌圈诈唬的阻挡牌逻辑。讲师强调，本视频的重点不是记忆具体频率数字，而是建立“先预判对手弃牌/跟注范围，再选择诈唬手牌”的思维框架。这一框架可推广到所有翻后诈唬决策场景，尤其是3-bet底池的不利位置对抗。", "值得进一步学习的方向包括：不同翻牌面结构下对手弃牌范围与跟注范围的差异、混合策略（mixed strategy）中具体频率的确定方法、以及如何利用阻挡牌优化转牌圈和河牌圈的下注尺度选择。", "**行动项与常见错误提醒：**", "- 不要仅凭“错过的同花听牌就该放弃”或“范围底部就该诈唬”的启发式做决策，必须结合阻挡牌分析。", "- 诈唬前先问自己：我的牌阻挡了对手的弃牌范围还是跟注范围？双重阻挡弃牌范围时果断放弃，单一阻挡时混合，阻挡跟注范围时纯诈唬。", "- 注意A♠等关键阻挡牌带来的边际差异（如4%弃牌权益），在边缘场景中这决定了诈唬是否盈利。", "- 预判对手河牌圈弃牌范围时，优先考虑中对（如T-7）而非错过的同花听牌，因为后者组合数通常较少。"], "note": ""}, {"id": "DGL#35-intro", "ep": "35", "type": "intro", "topic": "DGL#35 - 手牌复盘：成为难缠玩家的4个核心概念", "en": "Hand Review 4 Concepts to Become a Tough Player", "q": "DGL#35 - 手牌复盘：成为难缠玩家的4个核心概念", "clues": ["KQs", "bet", "Rodriguez"], "a": ["本视频通过一手GG平台1020级别（2月25日）的实战手牌，系统讲解了成为高水平难缠玩家所需的四个核心概念。手牌发生在小盲位手持KQs（同花KQ），面对大盲3-bet后跟注，翻牌9-5-3彩虹面过牌过牌，转牌J♠再次过牌过牌，河牌T♥小盲过牌，H. Rodriguez下注3/4底池，小盲全下，H. Rodriguez跟注。整手牌完美展示了GTO策略的两大支柱：混合频率处理听牌与慢打顶端范围。", "视频核心观点是：想要成为难缠的玩家，必须学会在听牌和强牌上混合过牌与下注的频率，而不是一味快打。同时，在河牌选择慢打哪些坚果牌时，阻挡牌（blockers）是决定性因素——应优先选择阻挡对手过牌范围的手牌。此外，视频还引入了\"镜像价值范围\"的诈唬构建概念，以及紧范围对抗中阻挡牌优先于牌力强度的原则。", "本视频属于GTO蓝图课程的实战应用篇，通过具体牌例将抽象理论转化为可操作的决策规则。讲师强调，在紧范围对抗中（3-bet底池、4-bet底池），阻挡牌几乎决定了所有关键决策——快打哪些牌、慢打哪些牌、诈唬加注哪些牌、跟注抓诈哪些牌。"], "note": ""}, {"id": "DGL#35-s0", "ep": "35", "type": "topic", "topic": "DGL#35 - 手牌复盘：成为难缠玩家的4个核心概念", "en": "Hand Review 4 Concepts to Become a Tough Player", "q": "手牌背景与翻前行动", "clues": ["Hero", "KQs", "Rodriguez", "bet"], "a": ["牌局发生在GG平台，级别1020（盲注10/20），2月25日。Hero位于小盲位，手持KQs（同花KQ），开局加注3x，这是标准动作。", "大盲位玩家H. Rodriguez是长期高额桌常客玩家，小盲位玩家（Hero）推测也是常客，从后续打法可看出其水平。", "面对大盲的3-bet（再加注），KQs（同花KQ）在这里应该选择跟注，而不是4-bet或弃牌。"], "note": ""}, {"id": "DGL#35-s1", "ep": "35", "type": "topic", "topic": "DGL#35 - 手牌复盘：成为难缠玩家的4个核心概念", "en": "Hand Review 4 Concepts to Become a Tough Player", "q": "翻牌圈行动与策略", "clues": ["KQs"], "a": ["翻牌面为9-5-3彩虹面（无同花听牌可能），小盲位手持KQs（同花KQ）——两高张加后门同花听牌，但实际翻牌是9-5-3-2彩虹面，KQs只有两高张和后门同花听牌。", "双方过牌过牌，翻牌圈没有发生下注。这个结果对后续转牌和河牌的范围构建有重要影响。"], "note": ""}, {"id": "DGL#35-s2", "ep": "35", "type": "topic", "topic": "DGL#35 - 手牌复盘：成为难缠玩家的4个核心概念", "en": "Hand Review 4 Concepts to Become a Tough Player", "q": "转牌圈：混合处理听牌", "clues": ["KQs", "GTO", "combo draws", "36%"], "a": ["转牌为J♠，小盲位再次过牌，大盲位也过牌。此时小盲位手持KQs（同花KQ）形成了组合听牌（两头顺听牌加同花听牌）。", "第一个GTO支柱原则：不要总是快打你的听牌。总是快打听牌会让你变得可预测——当你河牌击中时，对手知道你有太多强牌；当你被动过牌且听牌击中时，对手知道你没有坚果，从而可以利用你。", "根据GTO策略，在这类牌面上，组合听牌（combo draws）需要约36%的频率选择慢打（过牌）。组合听牌是很好的慢打候选，因为即使它们没有对子、没有摊牌价值，面对下注时仍然可以过牌加注，保持极强的攻击性。", "具体频率数据（小盲位转牌策略）：KQ♦（方片KQ）采用77%过牌频率；KT♦（方片KT）为50-50均分；Q8♦（方片Q8）为62%过牌；87♦（方片87）为35%过牌。", "纯下注的牌包括T8（T8同花或非同花），高频下注的牌包括QT（QT同花或非同花）。但几乎所有组合听牌都混合了一定频率的过牌。", "全局来看，在这类牌面上，组合听牌应采用60-40的分配——约40%过牌、60%下注。"], "note": ""}, {"id": "DGL#35-s3", "ep": "35", "type": "topic", "topic": "DGL#35 - 手牌复盘：成为难缠玩家的4个核心概念", "en": "Hand Review 4 Concepts to Become a Tough Player", "q": "河牌圈：慢打顶端范围", "clues": ["Rodriguez", "KQs", "KQJT9", "GTO"], "a": ["河牌为T♥，小盲位第三次过牌（\"狡猾的过牌\"），H. Rodriguez下注3/4底池，小盲位手持KQs（同花KQ）形成坚果顺子（J-T-9-8-7？实际是KQJT9？），直接全下，H. Rodriguez跟注。", "第二个GTO支柱原则：慢打顶端范围。如果在河牌过牌范围中没有强牌，那么过牌范围将极易受到攻击。必须从范围内选择一些牌进行慢打。", "选择慢打牌的核心原则：阻挡牌（blockers）最重要。应选择那些阻挡对手过牌范围的手牌作为慢打候选。", "具体数据：在河牌，set（暗三条）和顺子合计有28%的频率选择过牌慢打。在转牌，顶对以上牌力有37%的过牌频率。", "常见错误：很多人会在听牌丰富的牌面上快打所有强牌，理由是\"我要保护价值\"或\"我要向听牌收费\"。但这会让你变得极其可预测，极易受到各种情况下的攻击。", "量化指导：转牌应慢打约40%的强牌，河牌应慢打约30%的强牌。"], "note": ""}, {"id": "DGL#35-s4", "ep": "35", "type": "topic", "topic": "DGL#35 - 手牌复盘：成为难缠玩家的4个核心概念", "en": "Hand Review 4 Concepts to Become a Tough Player", "q": "选择慢打坚果的阻挡牌逻辑", "clues": ["set", "GTO", "70%"], "a": ["在河牌选择慢打哪些坚果牌时，set（暗三条）基本都选择快打，慢打频率很低；而顺子则有相当频率的慢打。", "决策核心：思考\"如果我过牌，对手最可能的过牌范围是什么？\"在这个牌面（翻牌9-5-3，转牌J，河牌T），对手（有利位置玩家）的过牌范围中，约70%是AK和AQ的组合。", "因此，最佳慢打候选是KQ组合——因为KQ阻挡了对手最可能的过牌范围（AK和AQ）。在最强牌中，KQ组合是慢打表现最好的。", "具体组合：K♦Q♠、K♥Q♣、K♦Q♣等。不同花色很重要，因为特定花色会阻挡更多对手的过牌范围。", "例如，K♦和K♥是对手（大盲位）到达河牌频率最高的花色组合。Q♥也是对手到达河牌频率较高的花色。因此，包含这些花色的KQ组合应优先选择慢打。", "结论：在GTO理论中，如果过牌能赚更多钱，那么在实际对抗强手时下注很可能会亏钱。考虑到人们面对快打时过度弃牌，这个结论在实战中很可能成立。"], "note": ""}, {"id": "DGL#35-s5", "ep": "35", "type": "topic", "topic": "DGL#35 - 手牌复盘：成为难缠玩家的4个核心概念", "en": "Hand Review 4 Concepts to Become a Tough Player", "q": "镜像价值范围的诈唬构建", "clues": ["range"], "a": ["当你面对下注准备全下时，不应只想着\"我有坚果\"，而应思考\"如果我没有坚果，我会用什么牌诈唬全下？\"", "核心概念：镜像你的价值范围（mirroring your value range）。构建诈唬策略时，选择与价值范围共享牌点的手牌。", "本例中，价值牌是KQ和Q8（Q8也在过牌加注范围内），共同牌点是Q。因此诈唬加注候选应包含Q。", "为什么镜像价值牌有效？因为即使对手没有你代表的坚果牌，他也会选择与你的坚果牌共享牌点的牌作为抓诈牌。如果你的诈唬牌与价值牌共享牌点，你几乎必然阻挡了对手最好的抓诈牌。", "具体分析：对手（大盲位）很少以KQ或Q8到达河牌——Q8总是转牌下注，KQ也是高频转牌下注。但对手的抓诈牌如QJ、KJ（尤其K♦J）会阻挡你的顺子，因此它们是对手喜欢的跟注牌。", "即使你没有KQ，只要手持Q，你就阻挡了对手最可能的抓诈牌——因为对手的抓诈牌会试图与你的价值牌共享牌点。"], "note": ""}, {"id": "DGL#35-s6", "ep": "35", "type": "topic", "topic": "DGL#35 - 手牌复盘：成为难缠玩家的4个核心概念", "en": "Hand Review 4 Concepts to Become a Tough Player", "q": "具体诈唬候选与实战决策", "clues": ["Ace Queen", "Rodriguez", "T9o", "GTO"], "a": ["最佳诈唬加注候选：AQ（Ace Queen）。原因有二：第一，A踢脚牌使得你的手牌不阻挡对手的弃牌范围（对手不会用A高牌诈唬），因此你\"解锁\"了对手的弃牌；第二，手持Q与你的坚果区域共享牌点，从而自动与对手的抓诈牌共享牌点。", "其次，KX组合也是好的诈唬候选，原因类似——对手会跟注KJ和KQ（坚果），因此你与对手的跟注范围共享牌点。", "构建诈唬范围的规则：先确定你的价值区域，然后在可用的诈唬牌中，选择与价值区域共享牌点的手牌。", "H. Rodriguez的实际决策：他用T9o（非同花T9）跟注了全下。根据GTO解算器，T9o在这里应该约90%的频率弃牌——因为对手（小盲位）不会用任何含T或9的牌全下诈唬，所以T9o没有好的阻挡牌属性。", "但H. Rodriguez可能认为小盲位玩家在这个位置过度诈唬——很少有人能正确运用\"慢打顶端范围\"这一GTO支柱，他可能假设对手会过度诈唬，或者认为自己处于范围的顶端。"], "note": ""}, {"id": "DGL#35-s7", "ep": "35", "type": "topic", "topic": "DGL#35 - 手牌复盘：成为难缠玩家的4个核心概念", "en": "Hand Review 4 Concepts to Become a Tough Player", "q": "紧范围中阻挡牌优先于牌力", "clues": ["bet", "90%"], "a": ["关键对比：QJ（一对）是比T9（两对）更差的手牌，但QJ跟注能赚钱，而T9跟注永远不赚钱。这是因为QJ阻挡了对手的价值范围（KQ），而T9没有阻挡任何关键牌。", "在紧范围对抗中（3-bet底池、4-bet底池），阻挡牌几乎是你应该思考的全部内容——它决定了快打哪些牌、慢打哪些牌、诈唬加注哪些牌、跟注抓诈哪些牌。", "量化原则：在紧范围对抗中，阻挡牌约占你应思考内容的90%。牌力强度的重要性远低于阻挡牌质量。", "具体规则：如果一手一对手牌比一手两对手牌有更好的阻挡牌质量，你应该跟注一对手牌而弃掉两对手牌。这是完全正确的决策。", "实战注意事项：对抗人类玩家时，可能遇到对手用某种两对牌型到达河牌并下注的情况，此时弃掉两对可能是错误。但在理论上，应始终关注这些概念。"], "note": ""}, {"id": "DGL#35-c2", "ep": "35", "type": "cloze", "topic": "DGL#35 - 手牌复盘：成为难缠玩家的4个核心概念", "en": "Hand Review 4 Concepts to Become a Tough Player", "q": "组合听牌（combo draws）需要约＿＿的频率选择慢打（过牌）。", "clues": [], "a": ["根据GTO策略，在这类牌面上，组合听牌（combo draws）需要约36%的频率选择慢打（过牌）。组合听牌是很好的慢打候选，因为即使它们没有对子、没有摊牌价值，面对下注时仍然可以过牌加注，保持极强的攻击性。"], "note": "36%"}, {"id": "DGL#35-c3", "ep": "35", "type": "cloze", "topic": "DGL#35 - 手牌复盘：成为难缠玩家的4个核心概念", "en": "Hand Review 4 Concepts to Become a Tough Player", "q": "set（暗三条）和顺子合计有＿＿的频率选择过牌慢打。", "clues": [], "a": ["具体数据：在河牌，set（暗三条）和顺子合计有28%的频率选择过牌慢打。在转牌，顶对以上牌力有37%的过牌频率。"], "note": "28%"}, {"id": "DGL#35-c4", "ep": "35", "type": "cloze", "topic": "DGL#35 - 手牌复盘：成为难缠玩家的4个核心概念", "en": "Hand Review 4 Concepts to Become a Tough Player", "q": "对手（有利位置玩家）的过牌范围中，约＿＿是AK和AQ的组合。", "clues": [], "a": ["决策核心：思考\"如果我过牌，对手最可能的过牌范围是什么？\"在这个牌面（翻牌9-5-3，转牌J，河牌T），对手（有利位置玩家）的过牌范围中，约70%是AK和AQ的组合。"], "note": "70%"}, {"id": "DGL#35-note", "ep": "35", "type": "note", "topic": "DGL#35 - 手牌复盘：成为难缠玩家的4个核心概念", "en": "Hand Review 4 Concepts to Become a Tough Player", "q": "避坑提醒与行动项", "clues": ["GTO", "40%", "30%"], "a": ["本视频是GTO蓝图课程中\"通用启发式策略\"的实战延伸，通过一手完整牌例将多个抽象理论串联起来。视频中提到的\"GTO支柱\"和\"通用启发式\"概念来自该课程体系，建议结合课程中关于频率混合、阻挡牌应用和范围构建的章节进行系统学习。本视频在系列中属于中级进阶内容，适合已掌握基础GTO概念、希望在实战中应用高级策略的玩家。", "**应该这样做：**", "- 转牌面对组合听牌时，混合约40%的过牌频率，不要总是快打听牌", "- 转牌慢打约40%的强牌，河牌慢打约30%的强牌", "- 选择河牌慢打牌时，优先选择阻挡对手过牌范围的牌（如本例中的KQ阻挡AK/AQ）", "- 构建诈唬范围时，选择与价值范围共享牌点的手牌（镜像价值范围）", "- 在紧范围对抗中，优先考虑阻挡牌质量而非绝对牌力", "**不要这样做：**", "- 不要总是快打听牌——这会让你变得可预测且易被剥削", "- 不要在河牌过牌范围中没有强牌——这会让你的过牌范围极易受到攻击", "- 不要用没有阻挡牌质量的两对跟注，而弃掉有更好阻挡牌的一对", "- 不要只想着\"我有坚果\"就无脑全下——应同时思考诈唬范围的构建"], "note": ""}, {"id": "DGL#36-intro", "ep": "36", "type": "intro", "topic": "DGL#36 - 手牌复盘：成为顶尖玩家的两个额外概念", "en": "Hand Review 2 More Concepts to be a Top Player", "q": "DGL#36 - 手牌复盘：成为顶尖玩家的两个额外概念", "clues": ["GTO Blueprint"], "a": ["本视频是“手牌复盘”系列的延续，上一期已通过同一手牌讲解了四个概念，本期继续深入挖掘，补充两个能让你从“难缠的对手”晋升为“顶尖玩家”的关键概念。讲师强调，手牌复盘是展示GTO Blueprint课程中已学概念的最佳方式，能帮助玩家在实战中真正记住并执行这些策略。", "视频聚焦于河牌圈（river）的复杂决策，重点剖析了中等强度手牌（如第二对子、第三对子、第四对子）的正确玩法。核心观点是：在不利位置（OOP）持有中等强度手牌时，应采用小注阻挡下注（block bet），这既是均衡策略（equilibrium strategy）的重要组成部分，也是防止被对手诈唬的有效手段。同时，讲师深入讲解了如何利用阻挡牌（blockers）来平衡下注范围，以及如何选择诈唬加注全下的手牌。", "视频通过具体牌例（如口袋7、口袋8、T9s、口袋5等）和精确的权益数据，展示了理论概念在实战中的具体应用。最后，讲师强调了面对阻挡下注被加注时的正确心态和应对策略，指出这并非“困难局面”，而是需要提前规划好的常规场景。"], "note": ""}, {"id": "DGL#36-s0", "ep": "36", "type": "topic", "topic": "DGL#36 - 手牌复盘：成为顶尖玩家的两个额外概念", "en": "Hand Review 2 More Concepts to be a Top Player", "q": "中等对子的阻挡下注策略", "clues": ["block bet", "GTO Blueprint", "nuts", "bluff"], "a": ["本视频聚焦于河牌圈中等强度手牌的正确处理，具体指第二对子、第三对子甚至第四对子类型的手牌，如9x、口袋8和口袋7。", "这些手牌应采用阻挡下注（block bet）策略，这是GTO Blueprint课程中“通用启发式”（universal heuristics）模块的核心内容之一：在不利位置用中等对子进行阻挡下注。", "阻挡下注是均衡策略的重要组成部分，尤其在持有大量中等强度手牌且有坚果牌（nuts）平衡该区域时，该策略频繁出现且效果显著。", "通过下小注，可以避免过牌后被对手过度诈唬（bluff）的风险，同时由于有强牌保护，对手的加注能力被限制，从而迫使其弃掉许多原本会诈唬的手牌。"], "note": ""}, {"id": "DGL#36-s1", "ep": "36", "type": "topic", "topic": "DGL#36 - 手牌复盘：成为顶尖玩家的两个额外概念", "en": "Hand Review 2 More Concepts to be a Top Player", "q": "阻挡下注的权益优势", "clues": ["printing money", "T8s", "58%", "20%"], "a": ["以本手牌为例，口袋7在河牌圈拥有约58%的权益，应采用20%底池的薄价值阻挡下注尺度。", "大量组合通过这种玩法“印钞”（printing money），如果不采用此策略，持有口袋7、口袋8以及T8s（同花T8）等手牌都会亏损。", "讲师强调，这部分范围（中等强度手牌）在类似局面中通常占据显著比例，必须精准掌握其正确玩法，这是成为顶尖玩家的关键。"], "note": ""}, {"id": "DGL#36-s2", "ep": "36", "type": "topic", "topic": "DGL#36 - 手牌复盘：成为顶尖玩家的两个额外概念", "en": "Hand Review 2 More Concepts to be a Top Player", "q": "平衡阻挡下注范围", "clues": ["capped", "shove", "slow play", "blockers"], "a": ["从平衡角度出发，如果只用中等对子进行小注下注，对手会识别出你的范围封顶（capped），从而用Jx等强牌全下（shove）施压。", "为防止对手大量诈唬，必须在小注下注范围中加入足够的强牌进行平衡，否则中等对子“不被诈唬”的目标将无法实现。", "选择哪些强牌放入小注下注范围，与选择哪些强牌过牌慢玩（slow play）的逻辑一致：利用阻挡牌（blockers）来决定。"], "note": ""}, {"id": "DGL#36-s3", "ep": "36", "type": "topic", "topic": "DGL#36 - 手牌复盘：成为顶尖玩家的两个额外概念", "en": "Hand Review 2 More Concepts to be a Top Player", "q": "阻挡牌决定下注尺度", "clues": ["reopening range", "top set", "top pair"], "a": ["手牌特性决定其适合小注还是大注：过牌不仅因为阻挡了对手的过牌范围，也可能阻挡了对手的“重新加注范围”（reopening range）。", "以顶set（top set）为例，对手会用顶对（top pair）重新加注，如果你持有顶set，就阻挡了对手大量重新加注的手牌，因此不适合过牌。", "价值下注的目标是获得跟注：如果价值牌阻挡了对手的跟注范围，应更被动地游戏；反之，如果未阻挡对手的跟注范围，则应更激进地游戏。"], "note": ""}, {"id": "DGL#36-s4", "ep": "36", "type": "topic", "topic": "DGL#36 - 手牌复盘：成为顶尖玩家的两个额外概念", "en": "Hand Review 2 More Concepts to be a Top Player", "q": "T9s与口袋5的对比", "clues": ["T9s", "overbet", "93%", "94.6%"], "a": ["本手牌中，T9s（同花T9）和口袋5形成了鲜明对比：口袋5几乎总是超额下注（overbet），而T9s总是阻挡下注。", "两者牌力几乎相同：T9s有93%权益，口袋5有94.6%权益，但玩法截然不同。", "口袋5完全不阻挡对手面对大注时的跟注范围（9x、Jx、10x），而T9s恰好阻挡了这些关键跟注牌。", "如果T9s选择大注，会阻挡过多跟注牌；如果过牌，又会阻挡对手的重新加注范围（10x），因此唯一正确的选项是小注。", "通过小注，T9s可以从对手被迫发展的诈唬加注范围中获取价值，如A4、76、K8等手牌；而大注则永远无法从这些牌中获得价值。"], "note": ""}, {"id": "DGL#36-s5", "ep": "36", "type": "topic", "topic": "DGL#36 - 手牌复盘：成为顶尖玩家的两个额外概念", "en": "Hand Review 2 More Concepts to be a Top Player", "q": "平衡范围的构成", "clues": ["T9s"], "a": ["本手牌中，阻挡下注范围包括口袋7、口袋8和9x，平衡该范围的强牌主要是T9s、口袋10和口袋9。", "口袋10与T9s同理：阻挡过多跟注范围和重新加注范围，既不适合过牌也不适合大注，只能小注。", "范围中还包含少量87s和KQ作为混合策略，但主体强牌是T9s、口袋10和口袋9，它们都阻挡了对手面对大注的跟注范围和面对过牌的重新加注范围。"], "note": ""}, {"id": "DGL#36-s6", "ep": "36", "type": "topic", "topic": "DGL#36 - 手牌复盘：成为顶尖玩家的两个额外概念", "en": "Hand Review 2 More Concepts to be a Top Player", "q": "未阻挡跟注范围的手牌", "clues": [], "a": ["与阻挡牌逻辑相反，未阻挡对手跟注范围的手牌应激进游戏，典型例子是口袋5和87s。", "87s完全不阻挡9x、Jx和10x，因此一旦选择大注，有很大机会被这些牌跟注，从而获取最大价值。"], "note": ""}, {"id": "DGL#36-s7", "ep": "36", "type": "topic", "topic": "DGL#36 - 手牌复盘：成为顶尖玩家的两个额外概念", "en": "Hand Review 2 More Concepts to be a Top Player", "q": "面对阻挡下注被加注的策略", "clues": ["shove", "Q8s", "J8o"], "a": ["阻挡下注后遭遇加注是必然事件，不应感到意外或惊慌，这并非“困难局面”，而是需要提前规划好的常规场景。", "应对方案包括：一部分手牌跟注，一部分手牌全下（shove），例如本手牌中全下口袋9、Q8s和87s。", "诈唬全下应使用初始价值下注范围中最弱的手牌：本手牌中阻挡下注范围最弱的是口袋7和口袋8，它们正是诈唬全下的选择。", "这些诈唬牌与价值区域共享牌面（如与口袋8、口袋7、Q8s共享），能阻挡对手的坚果牌和部分抓诈唬牌（如J8o），提高诈唬成功率。"], "note": ""}, {"id": "DGL#36-c1", "ep": "36", "type": "cloze", "topic": "DGL#36 - 手牌复盘：成为顶尖玩家的两个额外概念", "en": "Hand Review 2 More Concepts to be a Top Player", "q": "口袋7在河牌圈拥有约＿＿的权益，应采用20%底池的薄价值阻挡下注尺度。", "clues": [], "a": ["以本手牌为例，口袋7在河牌圈拥有约58%的权益，应采用20%底池的薄价值阻挡下注尺度。"], "note": "58%"}, {"id": "DGL#36-c4", "ep": "36", "type": "cloze", "topic": "DGL#36 - 手牌复盘：成为顶尖玩家的两个额外概念", "en": "Hand Review 2 More Concepts to be a Top Player", "q": "两者牌力几乎相同：T9s有＿＿权益，口袋5有94.6%权益，", "clues": [], "a": ["两者牌力几乎相同：T9s有93%权益，口袋5有94.6%权益，但玩法截然不同。"], "note": "93%"}, {"id": "DGL#36-note", "ep": "36", "type": "note", "topic": "DGL#36 - 手牌复盘：成为顶尖玩家的两个额外概念", "en": "Hand Review 2 More Concepts to be a Top Player", "q": "避坑提醒与行动项", "clues": ["DGL", "GTO Blueprint", "Ace-King-Queen"], "a": ["本视频是DGL系列手牌复盘的第二部分，承接上一期“四个概念”的讲解，通过同一手牌继续深化GTO Blueprint课程中的核心理论。讲师强调，这些概念（阻挡下注、阻挡牌选择、平衡范围、诈唬全下）并非孤立存在，而是相互关联、共同构成完整策略体系。建议玩家先观看GTO Blueprint课程中的“A-K-Q玩具游戏”（Ace-King-Queen toy game）模块，以更深入理解阻挡下注的底层逻辑。", "值得进一步学习的方向包括：如何在不同公共牌面（board texture）和不同位置组合中应用阻挡下注策略，以及如何通过软件（如PioSolver）验证和优化自己的范围选择。本视频展示的“用阻挡牌决定下注尺度”和“用范围底部诈唬全下”两大原则，可推广至翻牌圈和转牌圈的类似场景。", "**行动项与常见错误：**", "- 应该做：在不利位置持有中等对子（第二对、第三对、第四对）时，主动采用小注阻挡下注（约20%底池），而非过牌。", "- 应该做：选择小注下注范围的强牌时，优先考虑阻挡对手跟注范围和重新加注范围的手牌（如T9s、口袋10）。", "- 应该做：诈唬全下时，使用初始价值下注范围中最弱的手牌，并确保与价值区域共享牌面。", "- 不要做：持有阻挡对手跟注范围的价值牌（如T9s）时选择大注，这会损失大量价值。", "- 不要做：持有未阻挡对手跟注范围的价值牌（如口袋5）时选择小注，应激进下注获取最大价值。", "- 不要做：阻挡下注遭遇加注时惊慌失措，应提前规划好跟注和全下的范围分配。"], "note": ""}, {"id": "DGL#37-intro", "ep": "37", "type": "intro", "topic": "DGL#37 - 3bet底池中SB vs BB在A高牌面的持续下注尺度策略", "en": "3BP IP PFR Cbetting on Ax Boards BB vs SB", "q": "DGL#37 - 3bet底池中SB vs BB在A高牌面的持续下注尺度策略", "clues": ["bet pot", "flop", "Ace-high boards"], "a": ["本视频聚焦于大盲位（BB）vs 小盲位（SB）在3bet底池（3-bet pot）中，翻牌圈（flop）为A高牌面（Ace-high boards）时的持续下注（c-bet）尺度选择。讲师指出，这一场景与常见的按钮位（BTN）vs 劫位（CO）或小盲位（SB）vs 按钮位（BTN）的3bet底池有本质区别，根源在于双方翻前3bet范围的结构差异——BB vs SB的3bet范围是高度极化（polarized）的，包含大量非同花垃圾牌和同花垃圾牌，而非线性（linear）范围。", "讲师通过PioSolver生成的GTO报告（GTO report）展示了不同A高牌面上的最优策略：在A低低（Ace-low-low）牌面上，应采用小尺度（25%底池）配合中等频率（约60%）下注；而在A双高张（Ace-double Broadway）牌面上，则应放弃小尺度，改用半池（half pot）或四分之三池（three-quarter pot）的大尺度，下注频率降至40%-50%。视频还特别指出了两个例外牌面（A92彩虹面和AA3彩虹面），以及配对牌面（如AAT、AA4）应采用范围下注（range bet）的特殊情况。"], "note": ""}, {"id": "DGL#37-s0", "ep": "37", "type": "topic", "topic": "DGL#37 - 3bet底池中SB vs BB在A高牌面的持续下注尺度策略", "en": "3BP IP PFR Cbetting on Ax Boards BB vs SB", "q": "3BP中BB vs SB的范围结构差异", "clues": ["BB vs SB", "bet", "polarized", "linear"], "a": ["BB vs SB的3bet范围是高度极化（polarized）的，包含大量非同花垃圾牌和同花垃圾牌，而非线性（linear）范围。", "这与BTN vs CO或SB vs BTN的3bet范围结构截然不同，后者更接近线性范围。", "由于范围组成的差异，许多牌面纹理（board textures）在BB vs SB场景下的打法会与其他位置组合显著不同。", "A高牌面（Ace-high boards）是玩家最容易犯错的一类牌面，需要特别关注。"], "note": ""}, {"id": "DGL#37-s1", "ep": "37", "type": "topic", "topic": "DGL#37 - 3bet底池中SB vs BB在A高牌面的持续下注尺度策略", "en": "3BP IP PFR Cbetting on Ax Boards BB vs SB", "q": "A高牌面的整体策略框架", "clues": ["BB vs SB", "bet", "Ace-high boards", "PioSolver"], "a": ["在BB vs SB的3bet底池中，A高牌面（Ace-high boards）不应采用小尺度高频下注策略，这与在其他位置组合中的打法不同。", "讲师使用PioSolver的GTO报告功能（通过Analysis → Runout → Frequency Analysis生成Excel表格）来对比多个牌面的最优策略。", "模拟中使用的下注尺度选项为：10%底池、25%底池、半池（half pot）和四分之三池（three-quarter pot）。", "10%尺度在所有A高牌面上均未被使用，若想简化为单一尺度策略，10%尺度应完全弃用。"], "note": ""}, {"id": "DGL#37-s2", "ep": "37", "type": "topic", "topic": "DGL#37 - 3bet底池中SB vs BB在A高牌面的持续下注尺度策略", "en": "3BP IP PFR Cbetting on Ax Boards BB vs SB", "q": "A低低牌面的下注策略", "clues": ["Ace-low-low", "check frequency", "range bet", "BB vs SB"], "a": ["A低低（Ace-low-low）牌面定义为A加上两张9或更低的牌（部分玩家将8和9视为中张，但讲师统一归为低张）。", "在A低低牌面上，应采用25%底池的小尺度下注，配合中等频率（约60%），几乎不会超过70%的持续下注频率。", "具体检查频率（check frequency）数据：41%、47%、31%、31%、56%、37%、57%——大量过牌（check）是正常现象。", "相比之下，在其他底池形态（如单加注底池）中，类似牌面（如642、72）可能会接近范围下注（range bet），但在BB vs SB的3bet底池中必须建立过牌范围（checking range）。"], "note": ""}, {"id": "DGL#37-s3", "ep": "37", "type": "topic", "topic": "DGL#37 - 3bet底池中SB vs BB在A高牌面的持续下注尺度策略", "en": "3BP IP PFR Cbetting on Ax Boards BB vs SB", "q": "两个例外牌面：A92和AA3", "clues": ["A92", "solver", "half pot", "AA3"], "a": ["A92彩虹面（A♠9♦2♣）是例外之一：求解器（solver）选择半池（half pot）尺度，下注频率高达73%。", "AA3彩虹面（A♠A♦3♣）是另一个例外：求解器选择半池尺度，下注频率高达83%。", "这两个牌面虽然属于A低低类别，但策略显著不同，需要单独记忆。"], "note": ""}, {"id": "DGL#37-s4", "ep": "37", "type": "topic", "topic": "DGL#37 - 3bet底池中SB vs BB在A高牌面的持续下注尺度策略", "en": "3BP IP PFR Cbetting on Ax Boards BB vs SB", "q": "配对A高牌面的策略", "clues": ["paired boards", "AAT", "range bet", "AA4"], "a": ["配对牌面（paired boards）是A高牌面中过牌频率最低的类别。", "AAT彩虹面（A♠A♦T♣）：接近范围下注（range bet），使用小尺度（25%底池）。", "AA4双色面（A♠A♦4♠）：同样接近范围下注，使用小尺度（25%底池）。", "总体而言，A低低牌面（含配对牌面）采用小尺度加中等频率的策略框架不变。"], "note": ""}, {"id": "DGL#37-s5", "ep": "37", "type": "topic", "topic": "DGL#37 - 3bet底池中SB vs BB在A高牌面的持续下注尺度策略", "en": "3BP IP PFR Cbetting on Ax Boards BB vs SB", "q": "A双高张牌面的下注策略", "clues": ["half pot", "AJ5", "AJ2", "AK3"], "a": ["A双高张（Ace-double Broadway）牌面定义为A加上J、Q、K或T中的任意两张高张。", "在这类牌面上，小尺度（25%底池）几乎完全不再使用，应改用半池（half pot）或四分之三池（three-quarter pot）的大尺度。", "具体数据示例：AJ5彩虹面（A♠J♦5♣）用半池下注56%的范围；AJ2双色面（A♠J♦2♠）用四分之三池下注45%的范围；AK3双色面（A♠K♦3♠）用四分之三池下注38%的范围；AK9双色面（A♠K♦9♠）用四分之三池下注40%的范围。", "半池与四分之三池的区分不必过度纠结，两者非常接近，只要不用小尺度即可；讲师个人偏好半池，因为能迫使不利位置（OOP）玩家做出更困难的回应，但四分之三池也完全可行。"], "note": ""}, {"id": "DGL#37-s6", "ep": "37", "type": "topic", "topic": "DGL#37 - 3bet底池中SB vs BB在A高牌面的持续下注尺度策略", "en": "3BP IP PFR Cbetting on Ax Boards BB vs SB", "q": "三高张同花牌面的特殊处理", "clues": ["board", "blocked", "Broadway", "72%"], "a": ["三高张同花面（triple Broadway mono board）是很多人会谨慎选择小尺度的牌面，但求解器给出的策略是：半池下注，频率高达72%。", "原因在于：虽然牌面是同花面，但由于三张高张被阻挡（blocked），双方范围内的同花组合数量都不多，仅限于连张型同花牌（interconnected type hands）。", "双方范围都高度集中在高张和Broadway牌上，因此可以激进下注。"], "note": ""}, {"id": "DGL#37-s7", "ep": "37", "type": "topic", "topic": "DGL#37 - 3bet底池中SB vs BB在A高牌面的持续下注尺度策略", "en": "3BP IP PFR Cbetting on Ax Boards BB vs SB", "q": "A高牌面的简化策略总结", "clues": ["Ace-low-low", "A92", "AA3", "AAT"], "a": ["A低低牌面（Ace-low-low）：小尺度（25%底池）+ 中等频率（约60%），需建立过牌范围。", "A双高张牌面（Ace-double Broadway）：大尺度（半池或四分之三池）+ 中低频率（40%-50%）。", "两个例外：A92彩虹面（半池73%频率）和AA3彩虹面（半池83%频率），需单独记忆。", "配对牌面（AAT、AA4等）：接近范围下注，使用小尺度。"], "note": ""}, {"id": "DGL#37-c1", "ep": "37", "type": "cloze", "topic": "DGL#37 - 3bet底池中SB vs BB在A高牌面的持续下注尺度策略", "en": "3BP IP PFR Cbetting on Ax Boards BB vs SB", "q": "模拟中使用的下注尺度选项为：＿＿底池、25%底池、半池（half pot）和四分之三池（three-quarter pot）。", "clues": [], "a": ["模拟中使用的下注尺度选项为：10%底池、25%底池、半池（half pot）和四分之三池（three-quarter pot）。"], "note": "10%"}, {"id": "DGL#37-c2", "ep": "37", "type": "cloze", "topic": "DGL#37 - 3bet底池中SB vs BB在A高牌面的持续下注尺度策略", "en": "3BP IP PFR Cbetting on Ax Boards BB vs SB", "q": "应采用＿＿底池的小尺度下注，配合中等频率（约60%），", "clues": [], "a": ["在A低低牌面上，应采用25%底池的小尺度下注，配合中等频率（约60%），几乎不会超过70%的持续下注频率。"], "note": "25%"}, {"id": "DGL#37-c3", "ep": "37", "type": "cloze", "topic": "DGL#37 - 3bet底池中SB vs BB在A高牌面的持续下注尺度策略", "en": "3BP IP PFR Cbetting on Ax Boards BB vs SB", "q": "A92彩虹面（A♠9♦2♣）是例外之一：求解器（solver）选择半池（half pot）尺度，下注频率高达＿＿。", "clues": [], "a": ["A92彩虹面（A♠9♦2♣）是例外之一：求解器（solver）选择半池（half pot）尺度，下注频率高达73%。"], "note": "73%"}, {"id": "DGL#37-note", "ep": "37", "type": "note", "topic": "DGL#37 - 3bet底池中SB vs BB在A高牌面的持续下注尺度策略", "en": "3BP IP PFR Cbetting on Ax Boards BB vs SB", "q": "避坑提醒与行动项", "clues": ["DGL", "bet", "SB vs BB"], "a": ["本视频是DGL系列第37期，聚焦于3bet底池中SB vs BB场景下的A高牌面持续下注策略。该系列此前已讨论过小盲位vs按钮位（SB vs BTN）的类似场景，本视频通过对比凸显了位置和范围结构对策略的深远影响。讲师强调，理解范围组成是制定正确策略的基础，而非机械记忆牌面。", "值得进一步学习的方向包括：转牌圈（turn）和河牌圈（river）在A高牌面上的下注策略、不同筹码深度下的调整、以及如何针对特定对手进行剥削性（exploitative）调整。", "**行动项与常见错误提醒：**", "- 在A低低牌面上，不要过度频繁下注——检查频率达到40%-57%是正常的，应建立过牌范围。", "- 在A双高张牌面上，不要使用小尺度（25%底池）——应改用半池或四分之三池。", "- 不要忽视A92彩虹面和AA3彩虹面这两个例外牌面，它们需要更大的下注尺度和更高频率。", "- 在配对A高牌面（如AAT、AA4）上，可以接近范围下注，使用小尺度。", "- 若想简化策略，可完全弃用10%底池尺度，只保留25%、半池和四分之三池三个选项。"], "note": ""}, {"id": "DGL#38-intro", "ep": "38", "type": "intro", "topic": "DGL#38 手牌复盘：如何在三街下注（3-Barrel）的牌面结构上寻找诈唬牌", "en": "Hand Review How To Find Bluffs on 3BW Runouts", "q": "DGL#38 手牌复盘：如何在三街下注（3-Barrel）的牌面结构上寻找诈唬牌", "clues": ["Blind vs Blind", "with the board", "float"], "a": ["本视频围绕一手盲注位对战（Blind vs Blind）的手牌展开，重点讲解在翻牌圈、转牌圈和河牌圈范围与牌面高度关联（range connects heavily with the board）的情况下，如何构建诈唬范围。讲师指出，当河牌发出后，几乎所有翻牌圈的漂浮跟注（float）牌型都已经成对或成顺，此时诈唬来源必须转向低对子（low pockets）和低频的未成对连牌。", "视频通过PioSOLVER模拟，展示了从翻牌到河牌的完整策略树：翻牌圈采用20%小尺寸持续下注（c-bet），转牌圈过牌后对手过牌，河牌圈发出T后，系统要求使用口袋对子44、55、66甚至部分77作为诈唬牌。讲师强调了一个关键均衡概念：低频出现的连牌（如54s、65s、76s）由于阻挡牌好且频率极低，应作为纯诈唬（pure bluff）下注；而低对子则采用混合策略（mixed strategy），因为它们不阻挡对手的弃牌范围。", "视频的核心结论是：在3-bet底池且牌面与自身范围高度关联的河牌圈，如果不用低对子诈唬，诈唬数量将严重不足，无法平衡价值下注范围。讲师建议玩家在类似场景中主动将低对子转化为诈唬。"], "note": ""}, {"id": "DGL#38-s0", "ep": "38", "type": "topic", "topic": "DGL#38 手牌复盘：如何在三街下注（3-Barrel）的牌面结构上寻找诈唬牌", "en": "Hand Review How To Find Bluffs on 3BW Runouts", "q": "手牌背景与行动线", "clues": ["Joseph Adams", "ATo", "A10", "Naltho Smyers"], "a": ["盲注位对战：Joseph Adams在小盲位（SB）手持ATo（非同花A10），开局加注3BB，Naltho Smyers在大盲位（BB）3-bet（再加注），Joseph跟注，有效筹码约120BB。", "翻牌（Flop）：A♠8♦2♣（彩虹面），Joseph过牌，Phil（大盲位）下注20%底池（约1/5 pot），Joseph用A10跟注。", "转牌（Turn）：Q♠，双方过牌过牌。", "河牌（River）：T♣，Joseph组成两对（A和T），下注1.3倍底池（1.3x pot）。"], "note": ""}, {"id": "DGL#38-s1", "ep": "38", "type": "topic", "topic": "DGL#38 手牌复盘：如何在三街下注（3-Barrel）的牌面结构上寻找诈唬牌", "en": "Hand Review How To Find Bluffs on 3BW Runouts", "q": "价值下注范围的构成", "clues": ["value bet", "A10", "QTs"], "a": ["在此河牌面，价值下注（value bet）范围非常明确：包括A10（两对）、A8（两对）、部分慢打的22和88（暗三条）、以及部分KJ和QTs（顺子）。", "讲师指出，由于牌面与翻前跟注范围高度关联，玩家可以轻松找到足够多的强牌进行价值下注，难点在于如何找到足够的诈唬牌来平衡。"], "note": ""}, {"id": "DGL#38-s2", "ep": "38", "type": "topic", "topic": "DGL#38 手牌复盘：如何在三街下注（3-Barrel）的牌面结构上寻找诈唬牌", "en": "Hand Review How To Find Bluffs on 3BW Runouts", "q": "翻牌圈策略：慢打与范围下注", "clues": ["range bet", "check-raise", "A8s", "GTO"], "a": ["在干燥的A高牌面（A-8-2彩虹），使用单一c-bet尺度时，系统建议采用范围下注（range bet），频率相对较高。", "翻牌圈策略：仅弃掉15%的范围，过牌加注（check-raise）频率为11%。", "必须慢打部分强牌：22和A8s（同花A8）在翻牌圈有相当频率选择过牌，这是GTO策略中“慢打顶range”的原则——保留强牌在过牌范围中，以保护过牌范围的强度。"], "note": ""}, {"id": "DGL#38-s3", "ep": "38", "type": "topic", "topic": "DGL#38 手牌复盘：如何在三街下注（3-Barrel）的牌面结构上寻找诈唬牌", "en": "Hand Review How To Find Bluffs on 3BW Runouts", "q": "转牌圈策略：过牌后的下注范围", "clues": ["Ace-x", "air balls", "T3s", "T4s"], "a": ["转牌发出Q♠，双方过牌后，系统给出的下注策略非常直接：用强A（Ace-x）继续下注，同时加入一些“空气牌”（air balls）。", "空气牌示例：T3s、93s、T4s、K7o、K6o等，这些牌完全没有摊牌价值，但需要以一定频率下注以维持范围平衡。", "讲师强调，这是GTO策略的一部分——在转牌圈用空气牌和低对子继续下注（barrel），为河牌圈的诈唬范围做准备。"], "note": ""}, {"id": "DGL#38-s4", "ep": "38", "type": "topic", "topic": "DGL#38 手牌复盘：如何在三街下注（3-Barrel）的牌面结构上寻找诈唬牌", "en": "Hand Review How To Find Bluffs on 3BW Runouts", "q": "河牌圈诈唬构建：低对子成为核心", "clues": ["T9s", "overbet"], "a": ["河牌T♣发出后，系统显示几乎所有翻牌圈的漂浮跟注牌型（如QJ、QT、KQ、KJ、JT）都已经成对，未成对的牌型仅剩极低频的54s、65s、76s。", "这些未成对连牌（54s、65s、76s）在范围中占比极低，不足以平衡价值下注数量，因此必须转向低对子（44、55、66，甚至部分77）作为诈唬来源。", "系统显示，即使T9s（同花T9）也会以一定频率在河牌圈超池下注（overbet）1.2倍底池。"], "note": ""}, {"id": "DGL#38-s5", "ep": "38", "type": "topic", "topic": "DGL#38 手牌复盘：如何在三街下注（3-Barrel）的牌面结构上寻找诈唬牌", "en": "Hand Review How To Find Bluffs on 3BW Runouts", "q": "均衡中的关键概念：纯诈唬与混合策略", "clues": ["pure bluff", "mixed strategy", "indifferent"], "a": ["河牌圈诈唬范围分为两类：纯诈唬（pure bluff）和混合策略（mixed strategy）诈唬。", "纯诈唬：低频出现的连牌（如54s、65s、76s），因为它们频率极低且阻挡牌好，对手无法让这些牌在“下注与过牌之间无差别”（indifferent），因此它们应始终下注。", "混合策略：低对子（44、55、66、77）是诈唬的主体，采用混合策略——部分频率下注，部分频率过牌。", "原理：对手在抓诈唬时，只能让“足够大区域”的诈唬牌在下注与过牌之间无差别，而低频连牌区域太小，不值得对手调整，因此对手会把调整重点放在低对子区域。"], "note": ""}, {"id": "DGL#38-s6", "ep": "38", "type": "topic", "topic": "DGL#38 手牌复盘：如何在三街下注（3-Barrel）的牌面结构上寻找诈唬牌", "en": "Hand Review How To Find Bluffs on 3BW Runouts", "q": "低对子诈唬的阻挡牌优势", "clues": [], "a": ["低对子（44、55、66）作为诈唬牌的优势在于：它们不阻挡对手的弃牌范围。", "对手的弃牌范围中大量包含高牌和中张牌：Kx、Jx、9x、8x、7x等，这些牌在河牌圈都会弃牌。", "而4、5、6这些点数在对手的弃牌范围中几乎不存在，因此用低对子诈唬不会减少对手的弃牌数量，诈唬效率更高。"], "note": ""}, {"id": "DGL#38-s7", "ep": "38", "type": "topic", "topic": "DGL#38 手牌复盘：如何在三街下注（3-Barrel）的牌面结构上寻找诈唬牌", "en": "Hand Review How To Find Bluffs on 3BW Runouts", "q": "实战建议与常见误区", "clues": ["bet"], "a": ["在3-bet底池且牌面与自身范围高度关联的河牌圈（如A-8-2-Q-T），如果不用低对子诈唬，诈唬数量将严重不足。", "常见误区：玩家倾向于只用未成对的连牌诈唬，但在这种牌面结构下，这些牌几乎都已经成对，导致诈唬范围枯竭。", "正确做法：主动将低对子（44、55、66、77）转化为诈唬，尤其是在对手范围中有大量高牌会弃牌的情况下。"], "note": ""}, {"id": "DGL#38-c0", "ep": "38", "type": "cloze", "topic": "DGL#38 手牌复盘：如何在三街下注（3-Barrel）的牌面结构上寻找诈唬牌", "en": "Hand Review How To Find Bluffs on 3BW Runouts", "q": "开局加注＿＿，Naltho Smyers在大盲位（BB）3-bet（再加注），", "clues": [], "a": ["盲注位对战：Joseph Adams在小盲位（SB）手持ATo（非同花A10），开局加注3BB，Naltho Smyers在大盲位（BB）3-bet（再加注），Joseph跟注，有效筹码约120BB。"], "note": "3BB"}, {"id": "DGL#38-c2", "ep": "38", "type": "cloze", "topic": "DGL#38 手牌复盘：如何在三街下注（3-Barrel）的牌面结构上寻找诈唬牌", "en": "Hand Review How To Find Bluffs on 3BW Runouts", "q": "翻牌圈策略：仅弃掉＿＿的范围，过牌加注（check-raise）频率为11%。", "clues": [], "a": ["翻牌圈策略：仅弃掉15%的范围，过牌加注（check-raise）频率为11%。"], "note": "15%"}, {"id": "DGL#38-note", "ep": "38", "type": "note", "topic": "DGL#38 手牌复盘：如何在三街下注（3-Barrel）的牌面结构上寻找诈唬牌", "en": "Hand Review How To Find Bluffs on 3BW Runouts", "q": "避坑提醒与行动项", "clues": ["DGL", "GTO", "PioSOLVER"], "a": ["本视频是DGL系列第38期，属于手牌复盘类教学内容，重点在于展示GTO框架下诈唬范围的构建逻辑。视频通过PioSOLVER模拟，将抽象的范围构建原则具体化，适合已经掌握基础扑克概念、希望深入理解均衡策略的玩家。讲师强调的“低频连牌纯诈唬+低对子混合策略”框架，可以推广到其他类似牌面结构（如A高彩虹面加后门顺子完成）的河牌圈决策中。", "值得进一步学习的方向包括：如何在不同筹码深度下调整低对子诈唬的频率、如何利用阻挡牌选择最优诈唬组合、以及在实际对战中如何根据对手的弃牌倾向（fold-to-river-bet）进行剥削性调整。", "**行动项（应该这样做）：**", "- 在3-bet底池的河牌圈，如果牌面与自身范围高度关联，优先考虑用低对子（44-77）诈唬。", "- 低频出现的连牌（如54s、65s、76s）在河牌圈应作为纯诈唬，始终下注。", "- 选择诈唬牌时，优先选择不阻挡对手弃牌范围的牌型（低点数牌优于高点数牌）。", "**常见错误（不要这样做）：**", "- 不要只在未成对连牌中寻找诈唬牌——在关联牌面上这些牌大多已成对。", "- 不要忽略低对子的诈唬价值，否则诈唬频率将远低于均衡要求。", "- 不要用阻挡对手弃牌范围的牌型（如Kx、Jx）诈唬，这会降低诈唬成功率。"], "note": ""}, {"id": "DGL#39-intro", "ep": "39", "type": "intro", "topic": "DGL#39 - 河牌圈行动：实现河牌跟注平衡的唯一数学方法", "en": "River Play The Only Way to Be Balanced with River Calls", "q": "DGL#39 - 河牌圈行动：实现河牌跟注平衡的唯一数学方法", "clues": ["GTO", "Bluff Catcher"], "a": ["本视频以一手GG平台高额桌牌局为例，深入讲解如何在河牌圈面对巨大下注时，通过数学方法计算并执行平衡的跟注策略。讲师强调，虽然实战中更推荐剥削性打法，但理解理论基线（GTO）对于深层游戏理解和策略偏离至关重要。视频核心是提供一个基于范围构成（坚果牌与自动弃牌比例）的公式，用于计算每个诈唬抓取牌（Bluff Catcher）组合所需的跟注频率。", "视频首先通过一个具体牌例（Phil Smires在大盲位防守，河牌面对2.5倍底池全下）引出问题，并逐步推导出核心计算公式：首先计算最小防御频率（MDF），然后根据范围内坚果牌（自动跟注）和垃圾牌（自动弃牌）的比例，反推出剩余诈唬抓取牌所需的跟注频率。随后，讲师通过PioSolver软件验证了该数学模型的准确性，并展示了多个不同场景（单次加注底池、3-bet底池、不同下注尺度）下的应用实例。", "最后，讲师提供了一个可下载的电子表格工具，并强调这些计算应在牌桌外进行，通过熟悉不同场景下“自动防御”和“自动弃牌”的百分比，来建立直觉和记忆粗略准则，而非在牌局中实时计算。视频的核心观点是：扑克是数学的游戏，理解这些数学原理能够帮助玩家制定出非常优秀的策略。"], "note": ""}, {"id": "DGL#39-s0", "ep": "39", "type": "topic", "topic": "DGL#39 - 河牌圈行动：实现河牌跟注平衡的唯一数学方法", "en": "River Play The Only Way to Be Balanced with River Calls", "q": "河牌平衡难题与剥削性视角", "clues": ["Phil Smires", "Exploitative", "Baseline", "40%"], "a": ["视频以一手高额桌牌局开场：Phil Smires在大盲位（BB）面对劫位（HJ）2.5x开局加注，选择跟注。翻牌为A-Q-彩虹面，Phil过牌，对手下注40%底池，Phil跟注。转牌为红桃2，Phil过牌，对手超池下注约1.5倍底池，Phil再次跟注。河牌为黑桃Q，Phil过牌，对手全下约2.5倍底池。", "讲师指出，河牌圈决定是否跟注是扑克中最困难的任务之一。他个人更倾向于从剥削性（Exploitative）角度处理河牌，因为通常有足够信息来调整策略至纯跟注或纯弃牌。", "然而，拥有一个理论基线（Baseline）理解至关重要，这能让你在需要时进行偏离，并更深入地理解游戏。本视频旨在解决“为了平衡跟注策略，你需要多频繁地跟注”这个问题。"], "note": ""}, {"id": "DGL#39-s1", "ep": "39", "type": "topic", "topic": "DGL#39 - 河牌圈行动：实现河牌跟注平衡的唯一数学方法", "en": "River Play The Only Way to Be Balanced with River Calls", "q": "核心数学：MDF与Alpha计算", "clues": ["MDF", "Alpha", "71%", "29%"], "a": ["解决河牌平衡问题的起点是防止对手用任意两张牌对你过度诈唬。这需要计算最小防御频率（MDF, Minimum Defense Frequency）。", "MDF的计算公式为：MDF = 1 - Alpha。其中Alpha = 下注额 / (下注额 + 底池大小) = 下注额 / (1 + 下注额)。", "在本例中，对手河牌全下2.5倍底池，Alpha = 2.5 / (1 + 2.5) = 2.5 / 3.5 = 71%。因此，MDF = 1 - 71% = 29%。这意味着你需要用范围内29%的牌来防御，以防止对手用任意两张牌诈唬获利。"], "note": ""}, {"id": "DGL#39-s2", "ep": "39", "type": "topic", "topic": "DGL#39 - 河牌圈行动：实现河牌跟注平衡的唯一数学方法", "en": "River Play The Only Way to Be Balanced with River Calls", "q": "范围构成：坚果牌与诈唬抓取牌", "clues": ["Nuts", "Auto-call", "MDF", "Phil Smires"], "a": ["你的跟注频率并非一个固定数字，它高度依赖于你范围的具体构成。核心原则是：你范围内的坚果牌（Nuts）越多，你需要用诈唬抓取牌跟注的频率就越低。", "坚果牌（如葫芦、四条）是“自动跟注”（Auto-call）牌，它们已经占据了MDF的一部分。在本例中，讲师估计Phil Smires在河牌圈的范围中，约有10%是Q+（三条Q以上）或葫芦，其余90%是诈唬抓取牌（如A高牌）。", "计算过程：既然MDF要求防御29%的范围，而10%已被坚果牌占据，那么剩余需要由诈唬抓取牌提供的防御频率为29% - 10% = 19%。", "由于诈唬抓取牌占范围的90%，那么每手诈唬抓取牌需要跟注的频率为：19% / 90% = 21%。这意味着，为了达到平衡，你需要用约21%的诈唬抓取牌组合进行跟注。"], "note": ""}, {"id": "DGL#39-s3", "ep": "39", "type": "topic", "topic": "DGL#39 - 河牌圈行动：实现河牌跟注平衡的唯一数学方法", "en": "River Play The Only Way to Be Balanced with River Calls", "q": "软件验证与实例对比", "clues": ["PioSolver", "MDF", "Trips Plus", "Top Pair"], "a": ["讲师通过PioSolver软件验证了上述计算。在软件中，面对2.54倍底池的下注，软件建议弃牌71%的范围，跟注28.42%的范围，与MDF计算结果高度一致。", "在软件中查看“三条及以上”（Trips Plus）的牌型，约占范围的12.8%，略高于估算的10%。查看“顶对”（Top Pair）牌型，约占范围的81%，软件建议的跟注频率为20.6%，与手工计算的21%非常接近。", "这个对比证明了该数学方法的准确性，并说明只需知道“自动跟注”牌的比例，就能推算出诈唬抓取牌的跟注频率。"], "note": ""}, {"id": "DGL#39-s4", "ep": "39", "type": "topic", "topic": "DGL#39 - 河牌圈行动：实现河牌跟注平衡的唯一数学方法", "en": "River Play The Only Way to Be Balanced with River Calls", "q": "通用公式与电子表格工具", "clues": ["Auto Defense", "Auto Fold", "True MDF", "Equity"], "a": ["讲师提供了一个电子表格，用于计算诈唬抓取牌的跟注频率。该表格需要两个关键变量：1. 自动防御（Auto Defense）百分比，即你范围内强牌（如两对+）的比例；2. 自动弃牌（Auto Fold）百分比，即你范围内弱到无法跟注的牌型比例。", "计算逻辑为：首先根据对手下注尺度计算MDF，然后从MDF中减去自动防御的百分比，得到需要由诈唬抓取牌提供的防御频率。最后，用这个数值除以诈唬抓取牌在范围内所占的比例（100% - 自动防御% - 自动弃牌%），即可得出每手诈唬抓取牌的跟注频率。", "表格中还有一个“真实MDF”（True MDF）列。这是因为对手诈唬牌通常有一定胜率（Equity），因此你可以比理论MDF稍微多弃牌一些，让对手的诈唬在数学上勉强正期望值（+EV）。例如，面对半池下注，理论MDF为67%，但真实MDF通常在63%-65%左右。"], "note": ""}, {"id": "DGL#39-s5", "ep": "39", "type": "topic", "topic": "DGL#39 - 河牌圈行动：实现河牌跟注平衡的唯一数学方法", "en": "River Play The Only Way to Be Balanced with River Calls", "q": "实例一：单次加注底池（BB vs BTN）", "clues": ["BTN", "Check-Raise", "MDF", "PioSolver"], "a": ["场景：你在BB位，面对BTN位的三枪下注。翻牌为6-5-J，转牌为J，河牌为A。对手在河牌下注半池。", "在此场景中，你的“自动防御”牌（两对+）约占范围的24%。你的“自动弃牌”牌（如K高、错过的听牌）约占13%，若将部分低对也归入自动弃牌，则比例升至19%。", "由于你可能会用部分两对进行过牌-加注（Check-Raise），并且需要搭配诈唬牌来平衡，实际自动防御比例会略高。计算得出，真实MDF约为64%，自动防御为28%，自动弃牌为19%，剩余53%为诈唬抓取牌。因此，你需要用这些诈唬抓取牌跟注的频率为 (64% - 28%) / 53% = 68%。", "在PioSolver中验证，软件对顶对、中对、底对的跟注频率约为62%，与计算结果非常接近。"], "note": ""}, {"id": "DGL#39-s6", "ep": "39", "type": "topic", "topic": "DGL#39 - 河牌圈行动：实现河牌跟注平衡的唯一数学方法", "en": "River Play The Only Way to Be Balanced with River Calls", "q": "实例二：3-bet底池（SB vs CO）", "clues": ["MDF", "PioSolver", "37%", "16%"], "a": ["场景：你在CO位，面对SB位玩家的三枪下注，对手在河牌下注半池。", "在此场景中，你的“自动防御”牌（超对+）约占范围的37%（因为低牌面超对很多）。“自动弃牌”牌（错过的听牌）约占16%。", "计算得出，真实MDF约为62%，自动防御为36%，自动弃牌为16%，剩余48%为诈唬抓取牌。因此，你需要用这些诈唬抓取牌跟注的频率为 (62% - 36%) / 48% = 54%。", "在PioSolver中验证，软件对A高、低对、第三对的跟注频率约为53%，与计算结果高度吻合。"], "note": ""}, {"id": "DGL#39-s7", "ep": "39", "type": "topic", "topic": "DGL#39 - 河牌圈行动：实现河牌跟注平衡的唯一数学方法", "en": "River Play The Only Way to Be Balanced with River Calls", "q": "实例三：面对1.5倍底池下注", "clues": ["MDF", "PioSolver", "26%", "19%"], "a": ["场景：在A高牌面，面对对手1.5倍底池的河牌下注，范围构成与实例一相同。", "由于下注尺度更大，你的加注策略会更紧，因此“自动防御”比例会下降。计算得出
