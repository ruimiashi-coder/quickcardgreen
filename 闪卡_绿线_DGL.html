<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dose of Green Line · 绿线 · 学习闪卡</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --c:#059669; --c2:#065f46; --soft:#ecfdf5;
  --bg:#f7f8fa; --ink:#1a1d23; --ink2:#4a5260; --ink3:#8b93a1;
  --line:#e7e9ee; --white:#fff; --radius:16px;
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; min-height:100vh;
}
/* ---------- 顶栏 ---------- */
.top{border-bottom:1px solid var(--line); background:rgba(255,255,255,.85); backdrop-filter:blur(12px); position:sticky; top:0; z-index:30}
.top-in{max-width:1080px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px var(--soft)}
.brand h1{font-size:16px;font-weight:700;letter-spacing:.2px;display:flex;align-items:baseline;gap:10px}
.brand h1 span{font-size:12px;color:var(--ink3);font-weight:400;padding-left:10px;border-left:1px solid var(--line)}
.spacer{flex:1}
.lines{display:flex;gap:3px;background:#eef0f4;padding:3px;border-radius:9px;flex-shrink:0}
.lines a{font-size:12px;padding:5px 11px;border-radius:7px;color:var(--ink2);text-decoration:none;transition:.15s;white-space:nowrap}
.lines a:hover{background:#fff;color:var(--c)}
.lines a.on{background:#fff;color:var(--c);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.09);cursor:default}
.stat{display:flex;gap:18px;font-size:12.5px;color:var(--ink2);flex-shrink:0}
.stat b{font-size:15px;color:var(--c);font-weight:700;font-variant-numeric:tabular-nums}
/* ---------- 工具行 ---------- */
.tools{max-width:1080px;margin:0 auto;padding:14px 24px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;width:100%}
.seg{display:flex;background:#eef0f4;border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:12.5px;color:var(--ink2);cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.seg button.on{background:#fff;color:var(--c);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.search{flex:1;min-width:150px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px 8px 32px;font-size:13px;font-family:inherit;color:var(--ink);outline:none;transition:.15s}
.search input:focus{border-color:var(--c);box-shadow:0 0 0 3px var(--soft)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.4}
.icon-btn{border:1px solid var(--line);background:#fff;width:36px;height:36px;border-radius:10px;cursor:pointer;display:grid;place-items:center;color:var(--ink2);transition:.15s}
.icon-btn:hover{border-color:var(--c);color:var(--c)}
.icon-btn.on{background:var(--c);border-color:var(--c);color:#fff}
/* ---------- 进度条 ---------- */
.bar-wrap{max-width:1080px;margin:12px auto 0;padding:0 24px;width:100%}
.bar{height:3px;background:#e7e9ee;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--c2));width:0;transition:width .35s ease;border-radius:3px}
/* ---------- 卡片 ---------- */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 24px 20px;perspective:2200px}
.scene{width:100%;max-width:780px;height:clamp(380px,58vh,560px);position:relative;cursor:pointer}
.card{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .62s cubic-bezier(.4,.2,.2,1)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius);background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(16,24,40,.04),0 12px 32px -12px rgba(16,24,40,.12);padding:30px 34px;display:flex;flex-direction:column;overflow:hidden}
.face.back{transform:rotateY(180deg)}
/* 正面 */
.meta{display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:600;letter-spacing:.3px;padding:3px 9px;border-radius:6px;background:var(--soft);color:var(--c)}
.chip.gray{background:#f1f3f6;color:var(--ink3);font-weight:500}
.q{z-index:1;flex:1;display:flex;flex-direction:column;justify-content:center}
.q .topic{font-size:13px;color:var(--ink3);margin-bottom:12px;line-height:1.6}
.q .head{font-size:clamp(20px,2.6vw,27px);font-weight:700;line-height:1.45;letter-spacing:-.2px;color:var(--ink)}
.q.cloze .head{font-size:clamp(16px,2vw,19px);font-weight:500;line-height:1.95;color:var(--ink2)}
.q.cloze .head b{color:var(--c);font-weight:700}
.blank{display:inline-block;min-width:66px;height:1.05em;border-bottom:2px solid var(--c);margin:0 5px;vertical-align:baseline;position:relative;top:2px}
.clues{margin-top:22px;display:flex;flex-wrap:wrap;gap:7px}
.need{font-size:12px;color:var(--ink3);margin-top:22px;letter-spacing:.2px}
.need+.clues{margin-top:9px}
.clue{font-size:12px;padding:4px 10px;border-radius:20px;background:#f4f6f9;color:var(--ink2);border:1px solid #ececf1}
.clue:before{content:"·";margin-right:5px;color:var(--c);font-weight:700}
.foot{display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid #f2f4f7;margin-top:16px}
.foot .tip{font-size:12px;color:var(--ink3)}
.kbd{display:inline-block;font-size:10.5px;padding:1px 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:#fafbfc;font-family:ui-monospace,monospace;color:var(--ink2);margin:0 1px}
/* 背面 */
.face.back{padding:26px 30px 20px}
.bh{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-shrink:0}
.bh .t{font-size:12px;font-weight:600;color:var(--c);letter-spacing:.3px}
.bh .src{font-size:11.5px;color:var(--ink3);margin-left:auto;text-align:right;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-right:8px;margin-right:-8px}
.scroll::-webkit-scrollbar{width:5px}
.scroll::-webkit-scrollbar-thumb{background:#d8dce3;border-radius:3px}
.scroll ul{list-style:none;display:flex;flex-direction:column;gap:13px}
.scroll li{position:relative;padding-left:20px;font-size:14.5px;line-height:1.92;color:#2c313b;text-align:justify}
.scroll li:before{content:"";position:absolute;left:5px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--c);opacity:.55}
.scroll li em{font-style:normal;background:linear-gradient(transparent 62%,#fde68a 0);padding:0 1px;font-weight:600;color:var(--ink)}
.scroll p{font-size:14.5px;line-height:1.92;color:#2c313b;margin-bottom:12px;text-align:justify}
.answer-key{display:inline-block;margin-bottom:10px;padding:5px 12px;border-radius:8px;background:var(--soft);color:var(--c);font-weight:700;font-size:15px;letter-spacing:.5px}
/* 底部操作 */
.ops{max-width:1080px;margin:0 auto;padding:0 24px 26px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink2);padding:9px 16px;border-radius:10px;font-size:13px;font-family:inherit;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--c);color:var(--c)}
.btn.primary{background:var(--c);border-color:var(--c);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--c2);border-color:var(--c2);color:#fff}
.btn.good:hover,.btn.good.on{border-color:#059669;color:#059669;background:#ecfdf5}
.btn.bad:hover,.btn.bad.on{border-color:#d97706;color:#d97706;background:#fffbeb}
.ops .nav{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums;padding:0 6px}
.empty{text-align:center;color:var(--ink3);font-size:14px;padding:60px 0}
/* 移动端 */
@media(max-width:720px){
  .top-in{padding:10px 16px}
  .tools{padding:9px 16px 0}
  .bar-wrap{padding:0 16px;margin-top:8px}
  .stage{padding:11px 16px 6px}
  .face{padding:22px 22px}
  .stat{gap:14px;font-size:12px}
  .brand h1 span{display:none}
  .seg button{padding:6px 10px;font-size:12px}
  .tools .seg{flex:1 1 auto}
  .tools .seg button{flex:1;text-align:center}
  #seg-type{order:1;flex-basis:100%}
  #seg-state{order:2}
  #shuffle{order:3;flex:0 0 36px}
  .search{order:4;flex:1 1 100%;min-width:0}
  .scene{height:calc(100vh - 352px);min-height:330px;max-height:660px}
  .hide-sm{display:none !important}
  .lines{display:none}
  .ops{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;justify-content:stretch;
       padding:0 16px calc(16px + env(safe-area-inset-bottom))}
  .ops #flip{order:1} .ops #done{order:2} .ops #rev{order:3}
  .ops #prev{order:4} .ops .nav{order:5} .ops #next{order:6}
  .ops .btn{justify-content:center;padding:11px 8px;font-size:13px}
  .ops .nav{justify-content:center;font-size:12px}
}
</style>
</head>
<body>
<div class="top">
  <div class="top-in">
    <div class="brand">
      <div class="dot"></div>
      <h1>Dose of Green Line · 绿线<span>GTO 与通用启发式</span></h1>
    </div>
    <div class="spacer"></div>
    <div class="lines"><a href="%E9%97%AA%E5%8D%A1_%E8%93%9D%E7%BA%BF_DBL.html">蓝线</a><a class="on">绿线</a><a href="%E9%97%AA%E5%8D%A1_%E7%BA%A2%E7%BA%BF_DRL.html">红线</a></div>
    <div class="stat">
      <div>卡片 <b id="s-total">0</b></div>
      <div>已掌握 <b id="s-done">0</b></div>
      <div>待复习 <b id="s-rev">0</b></div>
    </div>
  </div>
</div>

<div class="tools">
  <div class="seg" id="seg-type">
    <button data-t="all" class="on">全部</button>
    <button data-t="topic">要点</button>
    <button data-t="cloze">填空</button>
    <button data-t="intro">导览</button>
  </div>
  <div class="seg" id="seg-state">
    <button data-s="all" class="on">不筛状态</button>
    <button data-s="new">未看</button>
    <button data-s="rev">待复习</button>
    <button data-s="done">已掌握</button>
  </div>
  <div class="search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" placeholder="搜索关键词，如 overbet / 河牌 / 阻断牌">
  </div>
  <button class="icon-btn" id="shuffle" title="随机顺序">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
  </button>
  <button class="icon-btn on" id="sound" title="翻卡音效" style="display:none"></button>
</div>
<div class="bar-wrap"><div class="bar"><i id="bar"></i></div></div>

<div class="stage">
  <div class="scene" id="scene">
    <div class="card" id="card">
      <div class="face front">
        <div class="meta">
          <span class="chip" id="f-chip">DBL#00</span>
          <span class="chip gray" id="f-type">要点</span>
        </div>
        <div class="q" id="f-q">
          <div class="topic" id="f-topic"></div>
          <div class="head" id="f-head"></div>
          <div class="need" id="f-need"></div>
          <div class="clues" id="f-clues"></div>
        </div>
        <div class="foot">
          <span class="tip">先在心里回想，再翻面核对</span>
          <span class="tip hide-sm"><span class="kbd">空格</span> 翻面 <span class="kbd">←</span><span class="kbd">→</span> 切换</span>
        </div>
      </div>
      <div class="face back">
        <div class="bh">
          <span class="t" id="b-type">要点</span>
          <span class="src" id="b-src"></span>
        </div>
        <div class="scroll" id="b-body"></div>
        <div class="foot">
          <span class="tip"><span class="kbd">1</span> 已掌握 <span class="kbd">2</span> 待复习</span>
          <span class="tip" id="b-mark"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="ops">
  <button class="btn" id="prev">← 上一张</button>
  <button class="btn primary" id="flip">翻面</button>
  <button class="btn good" id="done">已掌握</button>
  <button class="btn bad" id="rev">待复习</button>
  <button class="btn" id="next">下一张 →</button>
  <span class="nav" id="pos">0 / 0</span>
</div>

<script>
const LINE = "DGL";
const CARDS = [{"id": "DGL#00-intro", "ep": "00", "type": "intro", "topic": "DGL#00 - 理论启发式入门：用GTO手牌历史构建平衡策略", "en": "Introduction to Theory Heuristics", "q": "DGL#00 - 理论启发式入门：用GTO手牌历史构建平衡策略", "clues": ["CashMate", "Green Line", "GTO"], "a": ["本视频是CashMate社区“Green Line”系列的第一期内容，主要介绍该系列视频的教学目标与内容框架。讲师明确说明，这些每周更新的短视频旨在教授玩家“下注尺度启发式”和“手牌类别频率启发式”，帮助玩家在牌桌上快速应用GTO理论，实现更平衡、低剥削性的策略。视频强调，平衡策略的核心并非记住复杂公式，而是掌握“用什么尺度下注”和“以什么频率下注”两个关键决策维度。", "讲师提出了一套高效的学习方法论：通过GTO手牌历史（GTO hand histories）配合Hand2Note软件，对特定牌面、特定位置、特定手牌类别进行筛选和频率统计，从而提炼出可操作的实战启发式规则。视频以“转牌圈在有利位置如何处理听牌”为例，展示了如何从GTO模拟数据中提取具体频率（如顺子听牌下注64%、同花听牌下注59%），并强调平衡的本质是让各种手牌类别在范围中保持恰当比例。", "本视频还强调了GTO Blueprint课程作为前置学习内容的重要性，指出本系列中的许多概念（如“混合听牌策略”这一GTO支柱原则）都建立在该课程的理论基础之上。讲师鼓励社区成员积极反馈，共同优化内容形式，使其更符合玩家需求，最终目标是打造全网最优质的扑克策略学习资源。"], "note": ""}, {"id": "DGL#00-s0", "ep": "00", "type": "topic", "topic": "DGL#00 - 理论启发式入门：用GTO手牌历史构建平衡策略", "en": "Introduction to Theory Heuristics", "q": "系列视频的核心目标", "clues": ["theory heuristic", "GTO Blueprint"], "a": ["本系列每周视频的核心目的是教授一个“理论启发式”（theory heuristic），让玩家能快速在牌桌上应用，实现更平衡的策略。", "每个短视频聚焦于两类启发式：一是“下注尺度启发式”（bet size heuristic），即“在这种牌面、这种场景下用这个尺度”；二是“手牌类别频率启发式”（hand class frequency heuristic），即“这种手牌在这种牌面上以这个频率行动”。", "讲师强调，实施低剥削性策略（low-exploitability strategy）需要一个可执行的框架，该框架在GTO Blueprint课程中完整教授，核心就是确定每手牌的最佳下注尺度和混合策略频率。"], "note": ""}, {"id": "DGL#00-s1", "ep": "00", "type": "topic", "topic": "DGL#00 - 理论启发式入门：用GTO手牌历史构建平衡策略", "en": "Introduction to Theory Heuristics", "q": "平衡策略的两大决策维度", "clues": [], "a": ["打平衡扑克只需要知道两件事：第一，这手牌该用什么下注尺度；第二，这手牌该以多高的频率下注。", "你需要一个“下注尺度启发式”和一个“手牌类别频率启发式”，这正是本系列每周视频将要持续输出的内容。", "平衡不是让所有手牌都以相同方式行动，而是让每类手牌在范围中占据恰当比例，从而让对手难以针对你的范围进行剥削。"], "note": ""}, {"id": "DGL#00-s2", "ep": "00", "type": "topic", "topic": "DGL#00 - 理论启发式入门：用GTO手牌历史构建平衡策略", "en": "Introduction to Theory Heuristics", "q": "高效学习方法论", "clues": ["GTO", "Hand2Note"], "a": ["讲师推荐使用“GTO手牌历史”（GTO hand histories）配合Hand2Note软件来提炼理论启发式，他认为这是寻找扑克理论启发式最有效的方法。", "具体操作流程：将大量GTO手牌历史导入Hand2Note，然后按场景（位置、牌面、行动线）进行筛选，查看聚合频率数据，从而得出该场景下的最优下注尺度和频率。", "这种方法能大幅加速启发式构建过程，让玩家从海量模拟数据中快速提取可操作的规律，而不是依赖直觉或零散经验。"], "note": ""}, {"id": "DGL#00-s3", "ep": "00", "type": "topic", "topic": "DGL#00 - 理论启发式入门：用GTO手牌历史构建平衡策略", "en": "Introduction to Theory Heuristics", "q": "听牌混合策略示例", "clues": ["Hand2Note", "GTO", "flush draw", "64%"], "a": ["以“转牌圈在有利位置面对过牌”为例，演示如何用Hand2Note提取GTO频率：当机器人持有两端顺子听牌（open-ended straight draw）时，下注频率为64%，过牌频率为36%。", "当机器人持有同花听牌（flush draw）时，下注频率为59%，过牌频率为41%。", "由此得出一个实用的全局启发式：在转牌圈有利位置，面对过牌时，所有优质听牌（8-9张补牌的听牌）平均应放入“60%下注档位”——即下注约60%的时间，过牌约40%的时间。"], "note": ""}, {"id": "DGL#00-s4", "ep": "00", "type": "topic", "topic": "DGL#00 - 理论启发式入门：用GTO手牌历史构建平衡策略", "en": "Introduction to Theory Heuristics", "q": "平衡的本质定义", "clues": ["overcards"], "a": ["平衡扑克的核心在于选择不同手牌的恰当比例，而不是让所有手牌都采取相同行动。", "一个不平衡的范围意味着某种类型的手牌过多或过少，例如听牌太多而价值牌太少，或空气牌太多而中等对子太少。", "平衡的范围需要包含恰当比例的各种手牌类别：听牌、空气牌、高张（overcards）、中对子、顶对、两对及以上牌力，每种都要有合适的数量。"], "note": ""}, {"id": "DGL#00-s5", "ep": "00", "type": "topic", "topic": "DGL#00 - 理论启发式入门：用GTO手牌历史构建平衡策略", "en": "Introduction to Theory Heuristics", "q": "构建低剥削策略的完整流程", "clues": ["GTO", "Hand2Note"], "a": ["实施低剥削策略的完整流程是：先为当前场景选择最高的EV下注尺度，然后将各类手牌按恰当比例放入该下注范围中。", "如果你能像拼图一样，把正确数量的各类手牌放入范围，就能构建出剥削难度极高的策略。", "本系列视频将通过GTO手牌历史和Hand2Note，持续教授如何完成这个“拼图”过程，帮助玩家逐步掌握平衡策略的实操方法。"], "note": ""}, {"id": "DGL#00-s6", "ep": "00", "type": "topic", "topic": "DGL#00 - 理论启发式入门：用GTO手牌历史构建平衡策略", "en": "Introduction to Theory Heuristics", "q": "前置学习要求与系列定位", "clues": ["GTO Blueprint"], "a": ["讲师强烈建议玩家先学习GTO Blueprint课程，再开始观看本系列视频，因为本系列中的许多概念（如“混合听牌策略”）都建立在GTO Blueprint课程的理论基础之上。", "GTO Blueprint课程中的一个核心支柱原则是“必须混合你的听牌”——不能在所有场景下都用听牌快速加注或持续下注，大多数玩家常犯的错误就是不加区分地持续用听牌下注。", "本系列内容会随着社区反馈持续迭代优化，讲师欢迎玩家在社区中提出建议，共同打造最适合大家的学习内容。"], "note": ""}, {"id": "DGL#00-c3", "ep": "00", "type": "cloze", "topic": "DGL#00 - 理论启发式入门：用GTO手牌历史构建平衡策略", "en": "Introduction to Theory Heuristics", "q": "演示如何用Hand2Note提取GTO频率：当机器人持有两端顺子听牌（open-ended straight draw）时，下注频率为＿＿，过牌频率为36%。", "clues": [], "a": ["以“转牌圈在有利位置面对过牌”为例，演示如何用Hand2Note提取GTO频率：当机器人持有两端顺子听牌（open-ended straight draw）时，下注频率为64%，过牌频率为36%。"], "note": "64%"}, {"id": "DGL#00-note", "ep": "00", "type": "note", "topic": "DGL#00 - 理论启发式入门：用GTO手牌历史构建平衡策略", "en": "Introduction to Theory Heuristics", "q": "避坑提醒与行动项", "clues": ["Green Line", "Blue Line", "Fish Exploits"], "a": ["本视频是整个“Green Line”系列的开篇之作，定位为方法论导论，并未深入具体牌例或复杂场景，而是为后续每周内容奠定学习框架。它与“Blue Line”系列（Fish Exploits）形成互补：Blue Line侧重剥削性策略，Green Line侧重低剥削的平衡策略。建议玩家按顺序先完成GTO Blueprint课程，再跟进本系列，以获得最连贯的学习体验。", "值得进一步学习的方向包括：不同牌面结构（如干燥面、湿润面、配对牌面）下的下注尺度选择、不同位置（有利/不利位置）的频率差异、以及如何将Hand2Note的聚合数据转化为自己实战中的快速决策规则。后续视频预计会覆盖更多具体场景和手牌类别，逐步构建完整的启发式体系。", "**行动项与常见错误提醒：**", "- 应该做：在转牌圈有利位置面对过牌时，将优质听牌（两端顺子听牌、同花听牌）放入约60%下注/40%过牌的频率档位。", "- 应该做：学习使用GTO手牌历史+Hand2Note的筛选方法，从模拟数据中提炼自己的启发式规则。", "- 不要做：不要在所有场景下都用听牌持续下注或加注——这是大多数玩家的常见错误，会导致范围中听牌比例过高，容易被对手剥削。", "- 不要做：不要跳过GTO Blueprint课程直接看本系列，否则会缺乏理解“混合策略”和“范围比例”所需的理论基础。"], "note": ""}, {"id": "DGL#01-intro", "ep": "01", "type": "intro", "topic": "DGL#01 - 按钮位 vs 大盲位 - 延迟持续下注顶对弱踢脚", "en": "BTN vs BB - DelayCbet TPWK", "q": "DGL#01 - 按钮位 vs 大盲位 - 延迟持续下注顶对弱踢脚", "clues": ["Green Line", "TPWK", "GTO"], "a": ["本视频是“Green Line 每周一剂”系列的第一期，聚焦于一个非常具体的翻后场景：按钮位在翻牌圈过牌后，转牌圈面对大盲位过牌时，手持顶对弱踢脚（TPWK）牌型应该如何行动。讲师通过 GTO 求解器（Hand Note）的数据，给出了明确的频率参考和策略分桶建议。", "视频的核心结论是：在高牌面（J 高及以上）上，求解器在延迟持续下注（Delay C-bet）场景下，用顶对弱踢脚下注的频率约为 40%，过牌频率约为 60%；而在低牌面上，下注频率会提升至约 50%。讲师据此建议玩家在实际游戏中，将顶对弱踢脚统一放入 50% 策略分桶（50% 下注、50% 过牌），以保持范围的平衡性。", "视频还分析了转牌圈的下注尺度选择：低牌面和高牌面均以 2/3 底池为主要尺度，但在高牌面且牌面结构连通性强的场景下，求解器会频繁使用超池下注（Overbet），这是因为这些牌面在翻牌圈本身就适合采用极化策略，转牌圈延续大尺度下注是合理的。"], "note": ""}, {"id": "DGL#01-s0", "ep": "01", "type": "topic", "topic": "DGL#01 - 按钮位 vs 大盲位 - 延迟持续下注顶对弱踢脚", "en": "BTN vs BB - DelayCbet TPWK", "q": "视频主题与场景定义", "clues": ["BTN", "check-check", "TPWK", "Delay C-bet"], "a": ["本视频分析的具体场景为：按钮位（BTN）vs 大盲位（BB），翻牌圈双方过牌（check-check），转牌圈大盲位再次过牌，按钮位手持顶对弱踢脚（TPWK）牌型，面临是否延迟持续下注（Delay C-bet）的决策。", "讲师在求解器中设置了筛选条件：顶对第三踢脚（top pair third kicker），并预先筛选了高牌面（J 高及以上），因为这类牌型在大多数情况下出现在高牌面上，但后续也会单独分析低牌面的情况。"], "note": ""}, {"id": "DGL#01-s1", "ep": "01", "type": "topic", "topic": "DGL#01 - 按钮位 vs 大盲位 - 延迟持续下注顶对弱踢脚", "en": "BTN vs BB - DelayCbet TPWK", "q": "高牌面下注频率", "clues": ["polarized", "flop-safe", "depolarize", "41%"], "a": ["当牌面为 J 高或更高，且转牌圈手持顶对弱踢脚时，求解器给出的结果是：下注频率 41%，过牌频率 60%（视频中数据略有出入，以 40%/60% 为基准）。", "讲师提炼出一个可直接用于实战的启发式规则：在按钮位 vs 大盲位的单次加注底池中，翻牌圈过牌后，若想从平衡角度处理延迟持续下注节点，弱顶对应放入 40% 下注、60% 过牌的频率分桶。", "视频展示了多个典型高牌面示例，如 A-T-5、A-Q-3、A-T-7、A-6-5 等，这些牌面在翻牌圈本身就适合采用极化（polarized）或翻牌圈安全（flop-safe）策略，因此翻牌圈过牌频率较高。", "也有可以“去极化”（depolarize）的牌面，如 J-5-5（对子牌面），但由于牌面有成对结构，求解器仍然保留了一定数量的过牌。"], "note": ""}, {"id": "DGL#01-s2", "ep": "01", "type": "topic", "topic": "DGL#01 - 按钮位 vs 大盲位 - 延迟持续下注顶对弱踢脚", "en": "BTN vs BB - DelayCbet TPWK", "q": "转牌圈慢打的必要性", "clues": ["60%", "40%"], "a": ["求解器结果显示，在延迟持续下注线上，转牌圈手持顶对弱踢脚时，过牌频率高达 60%，这意味着玩家不能总是用顶对持续下注。", "讲师强调，为了在转牌圈保持范围的平衡性，必须将约 60% 的顶对弱踢脚放入过牌范围，这些过牌的牌型可以在河牌圈选择跟注对手的下注，或在对手过牌时进行价值下注。", "剩余 40% 的顶对弱踢脚则用于下注，以保护范围并获取价值。"], "note": ""}, {"id": "DGL#01-s3", "ep": "01", "type": "topic", "topic": "DGL#01 - 按钮位 vs 大盲位 - 延迟持续下注顶对弱踢脚", "en": "BTN vs BB - DelayCbet TPWK", "q": "低牌面下注频率", "clues": ["strategy buckets", "50%", "40%", "25%"], "a": ["将筛选条件改为“非高牌面”（即低牌面）后，求解器显示下注频率显著提升，约为 50%。", "结论是：在低牌面上，延迟持续下注的频率更高，顶对弱踢脚的下注比例从高牌面的 40% 提升至低牌面的 50%。", "讲师给出实战建议：在实际游戏中，推荐使用策略分桶（strategy buckets）方法，只设置 25%、50%、75% 三个分桶。对于顶对弱踢脚，应统一放入 50% 分桶，即 50% 下注、50% 过牌，这样既简化了决策，又能在高低牌面之间取得合理的平衡。"], "note": ""}, {"id": "DGL#01-s4", "ep": "01", "type": "topic", "topic": "DGL#01 - 按钮位 vs 大盲位 - 延迟持续下注顶对弱踢脚", "en": "BTN vs BB - DelayCbet TPWK", "q": "下注尺度分析", "clues": ["small overbet", "straight draws", "overpair"], "a": ["在低牌面上，求解器主要使用 2/3 底池的下注尺度。视频展示了多个示例：Q-8 牌面转牌圈 2/3 尺度下注、9-8 牌面 2/3 尺度下注、5-3-2 牌面转牌 8 后 2/3 尺度下注、Q-J 牌面转牌 Q 后 2/3 尺度下注。", "在高牌面上，求解器仍然以 2/3 底池为主要尺度，但出现了相当数量的超池下注（Overbet），且以小超池（small overbet）为主。", "讲师解释了这一现象的原因：这些高牌面在翻牌圈本身就适合采用大尺度下注，意味着范围应该非常极化。到了转牌圈，尤其是发出空白牌或对己方范围有利的牌时，延续大尺度下注是合理的。", "具体示例包括：J-10-4-3 牌面转牌圈超池下注、K-9 牌面（K-5-2-Q）转牌圈小超池下注、A-10 牌面（K-5-4-8）转牌圈大尺度下注。", "这些高牌面通常具有高牌加多连张（straight draws）的结构特点，超对（overpair）在这些牌面上拥有较高的权益，翻牌圈会频繁持续下注，但一旦过牌后，转牌圈仍然应该保持极化的延迟持续下注策略。"], "note": ""}, {"id": "DGL#01-s5", "ep": "01", "type": "topic", "topic": "DGL#01 - 按钮位 vs 大盲位 - 延迟持续下注顶对弱踢脚", "en": "BTN vs BB - DelayCbet TPWK", "q": "实战策略总结", "clues": ["GTO", "50%"], "a": ["在按钮位 vs 大盲位的延迟持续下注场景中，顶对弱踢脚应放入 50% 策略分桶（50% 下注、50% 过牌）。", "下注尺度方面，低牌面和高牌面均以 2/3 底池为主；高牌面且结构连通性强时，可考虑使用小超池下注。", "讲师强调，这些频率和尺度数据来自 GTO 求解器，玩家在实际游戏中应根据对手倾向进行剥削性调整，但平衡策略是基础。"], "note": ""}, {"id": "DGL#01-c1", "ep": "01", "type": "cloze", "topic": "DGL#01 - 按钮位 vs 大盲位 - 延迟持续下注顶对弱踢脚", "en": "BTN vs BB - DelayCbet TPWK", "q": "求解器给出的结果是：下注频率 ＿＿，过牌频率 60%（视频中数据略有出入，", "clues": [], "a": ["当牌面为 J 高或更高，且转牌圈手持顶对弱踢脚时，求解器给出的结果是：下注频率 41%，过牌频率 60%（视频中数据略有出入，以 40%/60% 为基准）。"], "note": "41%"}, {"id": "DGL#01-c2", "ep": "01", "type": "cloze", "topic": "DGL#01 - 按钮位 vs 大盲位 - 延迟持续下注顶对弱踢脚", "en": "BTN vs BB - DelayCbet TPWK", "q": "过牌频率高达 ＿＿，这意味着玩家不能总是用顶对持续下注。", "clues": [], "a": ["求解器结果显示，在延迟持续下注线上，转牌圈手持顶对弱踢脚时，过牌频率高达 60%，这意味着玩家不能总是用顶对持续下注。"], "note": "60%"}, {"id": "DGL#01-c3", "ep": "01", "type": "cloze", "topic": "DGL#01 - 按钮位 vs 大盲位 - 延迟持续下注顶对弱踢脚", "en": "BTN vs BB - DelayCbet TPWK", "q": "求解器显示下注频率显著提升，约为 ＿＿。", "clues": [], "a": ["将筛选条件改为“非高牌面”（即低牌面）后，求解器显示下注频率显著提升，约为 50%。"], "note": "50%"}, {"id": "DGL#01-note", "ep": "01", "type": "note", "topic": "DGL#01 - 按钮位 vs 大盲位 - 延迟持续下注顶对弱踢脚", "en": "BTN vs BB - DelayCbet TPWK", "q": "避坑提醒与行动项", "clues": ["Green Line", "GTO", "40%"], "a": ["本视频是“Green Line 每周一剂”系列的开篇之作，后续视频预计会继续深入探讨延迟持续下注线的其他牌型（如顶对强踢脚、超对、听牌等）的处理方式，以及不同位置组合下的策略差异。讲师在视频中多次提到“策略分桶”方法，这是其教学体系中的核心工具，值得玩家进一步学习和实践。", "需要特别注意的是，视频中的频率数据（40%/60%、50%/50%）是基于 GTO 求解器在特定假设下的输出，实际游戏中需要根据对手的弃牌率、跟注范围、加注倾向等因素进行动态调整。对于初学者，建议先掌握平衡策略的基准频率，再逐步学习剥削性调整。", "行动项与常见错误提醒：", "- 不要在所有延迟持续下注场景中都用顶对弱踢脚持续下注，应保留约 50% 的过牌频率。", "- 不要在所有牌面上都使用统一的下注尺度，低牌面以 2/3 底池为主，高牌面连通性强的牌面可考虑超池下注。", "- 不要忽视转牌圈过牌后河牌圈的后续行动规划，过牌的顶对弱踢脚应准备好跟注或价值下注。"], "note": ""}, {"id": "DGL#02-intro", "ep": "02", "type": "intro", "topic": "BTN vs BB 翻牌圈持续下注中的空气牌处理频率启发式", "en": "BTN vs BB Flop Cbet NOND", "q": "BTN vs BB 翻牌圈持续下注中的空气牌处理频率启发式", "clues": ["GTO"], "a": ["本视频聚焦于一个常见难题：在翻牌圈持有完全空气牌（无高张、无听牌）时，应该如何平衡下注与过牌。讲师指出，许多玩家在翻牌圈用空气牌范围过牌过多，导致在转牌面对探针下注时过度弃牌，这是一个需要修正的问题。视频通过GTO求解器数据，给出了一个简单实用的频率启发式规则。", "视频的核心发现是：在BTN vs BB的单挑底池中，当对手过牌给BTN时，求解器对完全空气牌的整体下注频率约为48%（接近50%）。但在特定牌面结构下，这一频率会显著变化——在适合极化下注的高牌双色牌面上，下注频率降至约32%；而在其他牌面上则保持约50%。讲师据此提炼出“50/25”的简化策略框架。", "视频通过多个具体牌例展示了求解器在不同牌面上的实际选择，包括下注与过牌的混合频率，帮助玩家理解何时应该用空气牌下注、何时应该过牌，以及如何根据牌面结构调整自己的空气牌处理策略。"], "note": ""}, {"id": "DGL#02-s0", "ep": "02", "type": "topic", "topic": "BTN vs BB 翻牌圈持续下注中的空气牌处理频率启发式", "en": "BTN vs BB Flop Cbet NOND", "q": "空气牌定义与问题背景", "clues": ["overcards"], "a": ["本视频讨论的“完全空气牌”定义为：翻牌圈没有任何高张（overcards）、没有任何听牌（无顺子听牌、无同花听牌）的牌型。", "例如J♥T♠在Q♦8♣3♠牌面上，既无高张也无听牌，属于完全空气牌；但若有后门顺子听牌（如J♥T♠在Q♦8♣3♠有后门顺子听牌），仍归入此类。", "玩家常见错误：用空气牌范围过牌过多，导致在转牌面对对手探针下注时过度弃牌，损失底池权益。"], "note": ""}, {"id": "DGL#02-s1", "ep": "02", "type": "topic", "topic": "BTN vs BB 翻牌圈持续下注中的空气牌处理频率启发式", "en": "BTN vs BB Flop Cbet NOND", "q": "全局频率基准（约50%）", "clues": ["BTN vs BB", "48%", "50%"], "a": ["在BTN vs BB翻牌圈单挑底池中，当BB过牌给BTN时，求解器对完全空气牌的整体下注频率为48%（约等于50%）。", "这意味着在大多数牌面上，玩家应该用约一半的完全空气牌组合进行持续下注，另一半则过牌。", "求解器示例：J♥T♠（无听牌无高张，但有后门顺子听牌）有时下注；T♠8♠有时下注；Q♥J♦（双重未阻挡牌）下注；Q♥5♥下注；K♠5♦下注；T♦9♣下注；9♥8♥在K♣5♦4♠牌面下注。", "关键原则：即使持有完全空气牌，也必须保持一定的下注频率，不能全部过牌。"], "note": ""}, {"id": "DGL#02-s2", "ep": "02", "type": "topic", "topic": "BTN vs BB 翻牌圈持续下注中的空气牌处理频率启发式", "en": "BTN vs BB Flop Cbet NOND", "q": "极化牌面下的频率调整（约25%）", "clues": ["Broadway", "BTN", "32%", "30%"], "a": ["特定牌面结构（高牌双色、第三张为低牌、第二张为Broadway牌、非三连张、非对子牌面）下，BTN应采用更极化的下注策略。", "此类牌面示例：J♠T♠6♦、A♠T♠7♦、A♦Q♦3♣等。", "在这些牌面上，求解器对完全空气牌的下注频率降至32%（约30%）。", "具体牌例：5♥4♥在J♠T♠6♦牌面有时全下（大注）；Q♥3♥在A♠T♠7♦牌面有时全下；J♠9♦（完全未阻挡牌）在A♦Q♦3♣牌面有时全下；9♣8♣有时采用小注；K♠8♦在A♠T♠7♦牌面有时全下。", "注意：在极化牌面上，空气牌下注时多采用大注（如全下或接近全下），小注使用较少。"], "note": ""}, {"id": "DGL#02-s3", "ep": "02", "type": "topic", "topic": "BTN vs BB 翻牌圈持续下注中的空气牌处理频率启发式", "en": "BTN vs BB Flop Cbet NOND", "q": "非极化牌面下的频率保持（约50%）", "clues": ["50%"], "a": ["在非极化牌面（即不属于上述高牌双色结构）上，求解器对完全空气牌的下注频率仍为50%。", "这意味着在大多数牌面上，玩家可以继续使用50%的基准频率来处理空气牌。", "非极化牌面包括：低牌面、彩虹牌面、对子牌面、三连张牌面等。"], "note": ""}, {"id": "DGL#02-s4", "ep": "02", "type": "topic", "topic": "BTN vs BB 翻牌圈持续下注中的空气牌处理频率启发式", "en": "BTN vs BB Flop Cbet NOND", "q": "核心启发式规则（50/25法则）", "clues": ["BTN vs BB", "50%", "25%"], "a": ["在非极化牌面上，将完全空气牌放入50%下注频率的“桶”中，即约一半组合下注、一半过牌。", "在极化牌面上，将完全空气牌放入25%下注频率的“桶”中，即约四分之一组合下注、四分之三过牌。", "这一规则帮助玩家在保持平衡的同时，避免过度下注或过度过牌，从而减少被剥削的风险。", "讲师强调：这是基于求解器的频率启发式，适用于BTN vs BB翻牌圈单挑场景，其他位置或多人底池需另行调整。"], "note": ""}, {"id": "DGL#02-c1", "ep": "02", "type": "cloze", "topic": "BTN vs BB 翻牌圈持续下注中的空气牌处理频率启发式", "en": "BTN vs BB Flop Cbet NOND", "q": "求解器对完全空气牌的整体下注频率为＿＿（约等于50%）。", "clues": [], "a": ["在BTN vs BB翻牌圈单挑底池中，当BB过牌给BTN时，求解器对完全空气牌的整体下注频率为48%（约等于50%）。"], "note": "48%"}, {"id": "DGL#02-c2", "ep": "02", "type": "cloze", "topic": "BTN vs BB 翻牌圈持续下注中的空气牌处理频率启发式", "en": "BTN vs BB Flop Cbet NOND", "q": "求解器对完全空气牌的下注频率降至＿＿（约30%）。", "clues": [], "a": ["在这些牌面上，求解器对完全空气牌的下注频率降至32%（约30%）。"], "note": "32%"}, {"id": "DGL#02-c3", "ep": "02", "type": "cloze", "topic": "BTN vs BB 翻牌圈持续下注中的空气牌处理频率启发式", "en": "BTN vs BB Flop Cbet NOND", "q": "在非极化牌面（即不属于上述高牌双色结构）上，求解器对完全空气牌的下注频率仍为＿＿。", "clues": [], "a": ["在非极化牌面（即不属于上述高牌双色结构）上，求解器对完全空气牌的下注频率仍为50%。"], "note": "50%"}, {"id": "DGL#02-note", "ep": "02", "type": "note", "topic": "BTN vs BB 翻牌圈持续下注中的空气牌处理频率启发式", "en": "BTN vs BB Flop Cbet NOND", "q": "避坑提醒与行动项", "clues": ["DGL", "Dose of Green", "Light"], "a": ["本视频属于“DGL”（Dose of Green Light）系列的第二集，聚焦于翻牌圈持续下注策略中的空气牌处理。该系列旨在通过求解器数据提炼简单实用的频率启发式，帮助玩家在实战中快速做出平衡决策。视频内容承接了第一集关于持续下注整体框架的讨论，并为后续转牌、河牌策略打下基础。", "值得进一步学习的方向包括：不同位置组合（如CO vs BB、SB vs BB）下的空气牌处理差异；转牌圈面对探针下注时的应对策略；以及如何根据对手倾向调整这些频率（剥削性调整）。玩家可将此50/25法则作为起点，结合自身游戏风格和对手特征进行微调。", "**行动项与常见错误提醒：**", "- 应该这样做：在非极化牌面上，用约50%的完全空气牌组合下注；在极化牌面上，将下注频率降至约25%。", "- 应该这样做：在极化牌面上，优先选择具有阻挡牌（如阻挡对手顶对或坚果听牌）的空气牌组合进行下注。", "- 不要这样做：不要用完全空气牌范围全部过牌，这会导致转牌面对探针下注时过度弃牌。", "- 不要这样做：不要在极化牌面上用过多空气牌下注，这会破坏范围平衡，容易被对手利用。"], "note": ""}, {"id": "DGL#03-intro", "ep": "03", "type": "intro", "topic": "3-bet底池中不利位置双倍下注线路上坚果牌的玩法", "en": "SB vs BU B30-B 2Pair+", "q": "3-bet底池中不利位置双倍下注线路上坚果牌的玩法", "clues": ["Green Line", "bet"], "a": ["本视频是“Green Line 每周一剂”系列的第3期，聚焦于3-bet底池中，处于不利位置（小盲位）时，在翻牌圈被跟注后，转牌圈持有两对及以上牌力（坚果牌）时的频率化处理策略。讲师通过软件过滤数据，展示了在转牌圈面对“双倍下注线路”（即翻牌下注被跟注后转牌继续下注）时，应该多频繁地继续下注，以及多频繁地选择过牌慢打。", "核心发现是：在转牌圈持有两对及以上牌力时，过牌慢打的频率接近50%（约46%），这意味着玩家应该非常频繁地用最强牌进行慢打，而不是一味追求快速建立底池。讲师通过多个具体牌例（如口袋对10、口袋对Q、口袋对6、A7等）展示了这一策略的实际应用，并强调了阻挡牌（blocker）在构建过牌范围时的重要作用。", "视频的核心观点是：在3-bet底池的不利位置，转牌圈持有坚果牌时，应采用约50/50的过牌与下注频率拆分，以实现更平衡、更难被剥削的玩法。讲师还提醒玩家，当手牌阻挡了对手的过牌范围时（如持有对子阻挡了对手可能过牌的高张），更应将这些牌放入过牌范围。"], "note": ""}, {"id": "DGL#03-s0", "ep": "03", "type": "topic", "topic": "3-bet底池中不利位置双倍下注线路上坚果牌的玩法", "en": "SB vs BU B30-B 2Pair+", "q": "视频背景与过滤条件", "clues": ["bet", "two pair plus", "opportunities", "check"], "a": ["本视频分析的是3-bet底池中，小盲位（SB）对阵按钮位（BU）的情况：按钮位开局加注，小盲位3-bet，按钮位跟注，翻牌圈小盲位下注并被跟注，进入转牌圈。", "过滤条件为：转牌圈时持有两对及以上牌力（two pair plus），且转牌不是第三张同花牌（避免同花干扰）。", "数据样本为7,400个机会（opportunities），其中约3.4k次选择了过牌（check）。"], "note": ""}, {"id": "DGL#03-s1", "ep": "03", "type": "topic", "topic": "3-bet底池中不利位置双倍下注线路上坚果牌的玩法", "en": "SB vs BU B30-B 2Pair+", "q": "转牌圈坚果牌的频率拆分", "clues": ["betting bucket", "checking bucket", "46%", "54%"], "a": ["数据显示，在转牌圈持有两对及以上牌力时，过牌慢打的平均频率为46%，下注频率约为54%，几乎呈50-50的均分状态。", "讲师强调：这一结果说明，在转牌圈应该非常频繁地用最强牌进行慢打，而不是总是急于下注。", "结论：如果希望在该线路上玩得更平衡，应将两对及以上牌力放入约50%的下注桶（betting bucket）和50%的过牌桶（checking bucket）。"], "note": ""}, {"id": "DGL#03-s2", "ep": "03", "type": "topic", "topic": "3-bet底池中不利位置双倍下注线路上坚果牌的玩法", "en": "SB vs BU B30-B 2Pair+", "q": "具体牌例：口袋对10（Pocket 10s）", "clues": ["small size", "full house"], "a": ["牌例：翻牌面为Q-Q-8（Q♥Q♠8♦），小盲位持有口袋对10（TT），翻牌圈选择小尺寸下注（small size），转牌圈形成葫芦（full house），随后选择过牌。", "讲师点评：这是典型的慢打场景，用葫芦过牌，让对手有机会诈唬或下注。"], "note": ""}, {"id": "DGL#03-s3", "ep": "03", "type": "topic", "topic": "3-bet底池中不利位置双倍下注线路上坚果牌的玩法", "en": "SB vs BU B30-B 2Pair+", "q": "具体牌例：口袋对Q（Pocket Queens）", "clues": ["tiny sizing"], "a": ["牌例：翻牌面为K-Q-9（K♦Q♠9♣），小盲位持有口袋对Q（QQ），翻牌圈选择极小尺寸下注（tiny sizing），转牌圈形成三条Q，随后选择过牌。", "讲师点评：即使翻牌圈已经下注，转牌圈形成强牌后仍应选择过牌慢打，而不是继续下注。"], "note": ""}, {"id": "DGL#03-s4", "ep": "03", "type": "topic", "topic": "3-bet底池中不利位置双倍下注线路上坚果牌的玩法", "en": "SB vs BU B30-B 2Pair+", "q": "具体牌例：口袋对6（Pocket 6s）", "clues": ["big bet", "semi-nuts"], "a": ["牌例：翻牌面为Q-10-5（Q♠10♦5♣），小盲位持有口袋对6（66），翻牌圈选择大尺寸下注（big bet），转牌圈形成“半坚果”（semi-nuts），但输给按钮位范围内的口袋对10（TT），随后选择过牌。", "讲师点评：即使牌力很强（三条6），但考虑到对手范围内存在更强的牌（如TT），过牌是合理的慢打选择。"], "note": ""}, {"id": "DGL#03-s5", "ep": "03", "type": "topic", "topic": "3-bet底池中不利位置双倍下注线路上坚果牌的玩法", "en": "SB vs BU B30-B 2Pair+", "q": "具体牌例：A7（A7o）", "clues": [], "a": ["牌例：翻牌面为A-7-5（A♠7♦5♣），小盲位持有A7形成两对，翻牌圈选择小尺寸下注，转牌圈发出6♦，选择过牌慢打。", "讲师点评：两对牌力在转牌圈同样适合过牌，避免被对手加注或诈唬。"], "note": ""}, {"id": "DGL#03-s6", "ep": "03", "type": "topic", "topic": "3-bet底池中不利位置双倍下注线路上坚果牌的玩法", "en": "SB vs BU B30-B 2Pair+", "q": "阻挡牌与过牌范围构建", "clues": ["Detail Blueprint", "check back range"], "a": ["讲师回顾了“Detail Blueprint 课程”中教授的一个通用启发式原则：当手牌阻挡了对手的过牌范围（check back range）时，应将这些牌放入自己的过牌范围。", "例如，持有对子（如66、TT）时，会阻挡对手可能过牌的高张组合（如A6、KT等），因此将这些牌放入过牌范围更有意义。", "视频中显示，这一原则在转牌圈慢打场景中频繁出现，玩家应主动利用阻挡牌来构建平衡的过牌范围。"], "note": ""}, {"id": "DGL#03-s7", "ep": "03", "type": "topic", "topic": "3-bet底池中不利位置双倍下注线路上坚果牌的玩法", "en": "SB vs BU B30-B 2Pair+", "q": "平衡策略的落地方法", "clues": ["bet", "50%"], "a": ["如果希望在3-bet底池的转牌圈双倍下注线路上玩得更平衡，具体做法是：将两对及以上牌力按约50%的频率放入下注桶，约50%放入过牌桶。", "讲师强调，这一频率拆分是基于大量数据（7,400个机会）得出的平均结果，适用于大多数情况，但玩家仍需根据具体对手和牌面结构进行微调。"], "note": ""}, {"id": "DGL#03-c1", "ep": "03", "type": "cloze", "topic": "3-bet底池中不利位置双倍下注线路上坚果牌的玩法", "en": "SB vs BU B30-B 2Pair+", "q": "在转牌圈持有两对及以上牌力时，过牌慢打的平均频率为＿＿，下注频率约为54%，", "clues": [], "a": ["数据显示，在转牌圈持有两对及以上牌力时，过牌慢打的平均频率为46%，下注频率约为54%，几乎呈50-50的均分状态。"], "note": "46%"}, {"id": "DGL#03-c7", "ep": "03", "type": "cloze", "topic": "3-bet底池中不利位置双倍下注线路上坚果牌的玩法", "en": "SB vs BU B30-B 2Pair+", "q": "具体做法是：将两对及以上牌力按约＿＿的频率放入下注桶，", "clues": [], "a": ["如果希望在3-bet底池的转牌圈双倍下注线路上玩得更平衡，具体做法是：将两对及以上牌力按约50%的频率放入下注桶，约50%放入过牌桶。"], "note": "50%"}, {"id": "DGL#03-note", "ep": "03", "type": "note", "topic": "3-bet底池中不利位置双倍下注线路上坚果牌的玩法", "en": "SB vs BU B30-B 2Pair+", "q": "避坑提醒与行动项", "clues": ["Green Line", "bet", "Detail Blueprint"], "a": ["本视频是“Green Line 每周一剂”系列的第3期，承接了前两期关于3-bet底池基础策略的内容，进一步深入到转牌圈坚果牌的频率化处理。视频通过软件数据分析和具体牌例，展示了如何在实际游戏中应用“50/50慢打”原则，并强调了阻挡牌在范围构建中的核心作用。对于希望提升3-bet底池攻防能力的玩家，这是一个非常实用的参考。", "值得进一步学习的方向包括：转牌圈第三张同花牌出现时的处理方式（本视频特意排除了这一情况）、河牌圈的后续策略、以及如何根据对手类型调整慢打频率。此外，建议结合“Detail Blueprint 课程”中关于阻挡牌和范围构建的通用原则，加深对频率化策略的理解。", "**行动项与常见错误提醒：**", "- 应该这样做：在3-bet底池转牌圈持有两对及以上牌力时，主动将约50%的牌力放入过牌范围，避免过度下注。", "- 应该这样做：利用阻挡牌（如对子阻挡对手高张组合）来构建过牌范围，提高范围的平衡性和剥削难度。", "- 不要这样做：不要因为持有强牌（如葫芦、三条）就总是急于下注，应结合频率拆分和阻挡牌因素考虑慢打。", "- 不要这样做：不要忽略转牌圈第三张同花牌的影响，本视频的结论仅适用于非第三张同花的情况。"], "note": ""}, {"id": "DGL#04-intro", "ep": "04", "type": "intro", "topic": "DGL#04 - SB vs BTN 翻牌圈持续下注：低牌面A高张打法", "en": "SB vs BU Flop Cbet - A Highs on Low Boards", "q": "DGL#04 - SB vs BTN 翻牌圈持续下注：低牌面A高张打法", "clues": ["bet", "OOP", "BTN"], "a": ["本视频是“每周绿灯”系列第4期，聚焦于一个具体的翻后场景：小盲位（SB）3-bet(再加注)后，在翻牌圈处于不利位置（OOP）面对按钮位（BTN）开局加注者，且翻牌面为低牌面（low boards）时，A高张（Ace High）手牌应该如何选择下注或过牌。讲师通过GTO求解器数据，提炼出一套基于手牌类别（高踢脚/中低踢脚）和牌面结构（彩虹面/双色面）的频率启发式策略。", "视频的核心发现是：A高张的下注频率并非一成不变，而是显著受到踢脚牌大小、是否持有后门同花听牌（Backdoor Flush Draw）以及牌面纹理的影响。高踢脚的A高张（如AK、AQ）在低牌面上有约50%的下注频率，而中低踢脚的A高张（如AT、AJ）频率则大幅下降至25%-35%。讲师特别强调了后门同花听牌对下注频率的加成作用，以及非同花与同花手牌之间的巨大策略差异。", "视频最后给出了从简化到精细的两套启发式方案：一套是适合低级别玩家的通用规则（高踢脚50%下注，中低踢脚25%下注），另一套是更精确的细分规则（考虑后门同花听牌和牌面纹理）。讲师反复建议观众将这些启发式制作成闪卡并每日复习，以真正内化这些频率数据。"], "note": ""}, {"id": "DGL#04-s0", "ep": "04", "type": "topic", "topic": "DGL#04 - SB vs BTN 翻牌圈持续下注：低牌面A高张打法", "en": "SB vs BU Flop Cbet - A Highs on Low Boards", "q": "场景定义与筛选条件", "clues": ["bet", "BTN", "low boards", "low two-tone"], "a": ["本视频研究的具体场景：SB位3-bet后，在翻牌圈处于不利位置，面对BTN位的翻前加注者。", "翻牌面限定为“低牌面”（low boards），即牌面点数较低的翻牌。", "首先分析低彩虹面（low rainbow boards，三张翻牌花色各不相同），再分析低双色面（low two-tone boards，有两张同花色）。", "所有数据均来自GTO求解器，统计的是整体下注频率（betting frequency）。"], "note": ""}, {"id": "DGL#04-s1", "ep": "04", "type": "topic", "topic": "DGL#04 - SB vs BTN 翻牌圈持续下注：低牌面A高张打法", "en": "SB vs BU Flop Cbet - A Highs on Low Boards", "q": "低彩虹面：高踢脚A高张策略", "clues": ["Ace High High", "Kicker", "61%", "50%"], "a": ["在低彩虹面上，整体下注频率为61%（14,000次下注/23,000次样本）。", "高踢脚A高张（Ace High High Kicker，如AK、AQ）的整体下注频率为50-50（约50%下注，50%过牌）。", "若持有后门同花听牌（Backdoor Flush Draw），下注频率提升至58%，可归入60%下注桶（若使用20/40/60/80四档混合策略桶）。", "若无后门同花听牌（非同花手牌），下注频率仍为50-50。", "结论：高踢脚A高张在低彩虹面上，整体可下注50-50；若有后门同花听牌，可提升至60-40。"], "note": ""}, {"id": "DGL#04-s2", "ep": "04", "type": "topic", "topic": "DGL#04 - SB vs BTN 翻牌圈持续下注：低牌面A高张打法", "en": "SB vs BU Flop Cbet - A Highs on Low Boards", "q": "低彩虹面：中低踢脚A高张策略", "clues": ["Medium to Low", "Kickers", "suited hands", "pure check"], "a": ["中低踢脚A高张（Medium to Low Kickers，如AJ、AT）的整体下注频率仅为35%（远低于高踢脚）。", "若有后门同花听牌，下注频率提升至42%（500次下注/1,200次样本）。", "若无后门同花听牌且为同花手牌（suited hands），几乎纯过牌（pure check），几乎从不下注。", "若无后门同花听牌且为非同花手牌（offsuit hands），如ATo，下注频率为40%（60次下注/150次样本）。", "关键规则：中低踢脚A高张，若无后门同花听牌且为同花手牌，纯过牌；若为非同花手牌（ATo），可下注40%。"], "note": ""}, {"id": "DGL#04-s3", "ep": "04", "type": "topic", "topic": "DGL#04 - SB vs BTN 翻牌圈持续下注：低牌面A高张打法", "en": "SB vs BU Flop Cbet - A Highs on Low Boards", "q": "低双色面：高踢脚A高张策略", "clues": ["47%", "50%", "40%"], "a": ["在低双色面上，高踢脚A高张的下注频率略降至47%，但仍可归入50%下注桶。", "有趣的是，持有后门同花听牌时，下注频率反而下降至40%（与彩虹面相反），但仍可四舍五入归入50%桶。", "非同花高踢脚A高张的下注频率约为50-50。", "结论：低双色面上，高踢脚A高张整体下注50-50；若有后门同花听牌，频率略降至40-60（可忽略差异）。"], "note": ""}, {"id": "DGL#04-s4", "ep": "04", "type": "topic", "topic": "DGL#04 - SB vs BTN 翻牌圈持续下注：低牌面A高张打法", "en": "SB vs BU Flop Cbet - A Highs on Low Boards", "q": "低双色面：中低踢脚A高张策略", "clues": ["ATo", "30%", "75%", "25%"], "a": ["中低踢脚A高张在低双色面上的整体下注频率为30%（380次下注/1,330次样本），即30-70。", "若有后门同花听牌，下注频率提升至接近50-50（162次下注/365次样本）。", "若无后门同花听牌且为非同花手牌（如ATo），下注频率为50-50。", "对于非同花ATo，建议：持有黑桃（后门同花听牌）时归入75%下注桶，无黑桃时归入25%下注桶。", "简化建议：中低踢脚A高张在低双色面上，整体可归入25%下注桶；有后门同花听牌时提升至50%桶。"], "note": ""}, {"id": "DGL#04-s5", "ep": "04", "type": "topic", "topic": "DGL#04 - SB vs BTN 翻牌圈持续下注：低牌面A高张打法", "en": "SB vs BU Flop Cbet - A Highs on Low Boards", "q": "后门同花听牌的影响", "clues": ["50%", "60%", "35%", "42%"], "a": ["后门同花听牌（Backdoor Flush Draw）是影响A高张下注频率的关键因素，通常会使下注频率提升约10-20个百分点。", "在低彩虹面上，高踢脚A高张有后门同花听牌时下注频率从50%升至60%；中低踢脚从35%升至42%。", "在低双色面上，高踢脚A高张有后门同花听牌时频率反而略降（从47%降至40%），但中低踢脚则从30%大幅升至50%。", "对于非同花手牌，后门同花听牌（如持有黑桃）是决定是否下注的重要参考，建议有黑桃时归入75%桶，无黑桃时归入25%桶。"], "note": ""}, {"id": "DGL#04-s6", "ep": "04", "type": "topic", "topic": "DGL#04 - SB vs BTN 翻牌圈持续下注：低牌面A高张打法", "en": "SB vs BU Flop Cbet - A Highs on Low Boards", "q": "通用简化启发式", "clues": ["25%"], "a": ["若不想过度复杂化，可采用以下通用规则：低牌面（无论彩虹或双色），高踢脚A高张下注50-50；中低踢脚A高张下注25%。", "这一简化规则适合低级别玩家，易于记忆和执行。", "更精细的规则（考虑后门同花听牌、牌面纹理）适合高级玩家，可进一步提升策略精度。", "讲师强调：这些启发式应制作成闪卡，每日复习20分钟，才能真正内化。"], "note": ""}, {"id": "DGL#04-s7", "ep": "04", "type": "topic", "topic": "DGL#04 - SB vs BTN 翻牌圈持续下注：低牌面A高张打法", "en": "SB vs BU Flop Cbet - A Highs on Low Boards", "q": "常见错误与注意事项", "clues": ["vs 25-35", "50%", "35%"], "a": ["不要忽视后门同花听牌的价值：有后门同花听牌时，A高张的下注频率应显著提升。", "不要对同花中低踢脚A高张（无后门同花听牌）在低彩虹面上盲目下注，应纯过牌。", "不要将高踢脚与中低踢脚的A高张混为一谈，两者下注频率差异巨大（50% vs 25-35%）。", "不要忽略牌面纹理的影响：低彩虹面与低双色面的策略虽有差异，但差异不大，可统一处理。"], "note": ""}, {"id": "DGL#04-c1", "ep": "04", "type": "cloze", "topic": "DGL#04 - SB vs BTN 翻牌圈持续下注：低牌面A高张打法", "en": "SB vs BU Flop Cbet - A Highs on Low Boards", "q": "整体下注频率为＿＿（14,000次下注/23,000次样本）。", "clues": [], "a": ["在低彩虹面上，整体下注频率为61%（14,000次下注/23,000次样本）。"], "note": "61%"}, {"id": "DGL#04-c2", "ep": "04", "type": "cloze", "topic": "DGL#04 - SB vs BTN 翻牌圈持续下注：低牌面A高张打法", "en": "SB vs BU Flop Cbet - A Highs on Low Boards", "q": "如AJ、AT）的整体下注频率仅为＿＿（远低于高踢脚）。", "clues": [], "a": ["中低踢脚A高张（Medium to Low Kickers，如AJ、AT）的整体下注频率仅为35%（远低于高踢脚）。"], "note": "35%"}, {"id": "DGL#04-c3", "ep": "04", "type": "cloze", "topic": "DGL#04 - SB vs BTN 翻牌圈持续下注：低牌面A高张打法", "en": "SB vs BU Flop Cbet - A Highs on Low Boards", "q": "高踢脚A高张的下注频率略降至＿＿，但仍可归入50%下注桶。", "clues": [], "a": ["在低双色面上，高踢脚A高张的下注频率略降至47%，但仍可归入50%下注桶。"], "note": "47%"}, {"id": "DGL#04-note", "ep": "04", "type": "note", "topic": "DGL#04 - SB vs BTN 翻牌圈持续下注：低牌面A高张打法", "en": "SB vs BU Flop Cbet - A Highs on Low Boards", "q": "避坑提醒与行动项", "clues": ["SB vs BTN", "GTO", "ATo"], "a": ["本视频是“每周绿灯”系列的第4期，专注于SB vs BTN单挑底池中A高张在低牌面的翻牌圈策略。视频建立在GTO求解器数据之上，提供了一套可操作的手牌类别频率启发式，与系列中其他视频（如不同牌面结构、不同位置对抗）形成互补。建议观众结合前几期内容，逐步构建完整的翻后策略体系。", "值得进一步学习的方向包括：转牌圈和河牌圈的后续策略、不同筹码深度下的调整、以及如何根据对手类型进行剥削性偏离。讲师在视频中反复强调“制作闪卡、每日复习”的学习方法，说明这些频率数据需要刻意记忆才能在实际对局中灵活运用。", "**行动项与常见错误清单：**", "- 低牌面（彩虹或双色），高踢脚A高张：下注50-50；有后门同花听牌可提升至60%。", "- 低牌面，中低踢脚A高张：下注25%；有后门同花听牌提升至50%。", "- 低彩虹面，中低踢脚同花A高张（无后门同花听牌）：纯过牌，不要下注。", "- 低双色面，非同花ATo：有黑桃（后门同花听牌）归入75%下注桶，无黑桃归入25%桶。", "- 不要将高踢脚与中低踢脚A高张混用同一频率，两者差异显著。", "- 不要忽略后门同花听牌对下注频率的加成作用。"], "note": ""}, {"id": "DGL#05-intro", "ep": "05", "type": "intro", "topic": "DGL#05 - 翻前加注单次加注底池、不利位置过牌-跟注-过牌-跟注线路的跟注阈值", "en": "PFR SRP OOP B-XC-XC Thresholds", "q": "DGL#05 - 翻前加注单次加注底池、不利位置过牌-跟注-过牌-跟注线路的跟注阈值", "clues": ["SRP", "OOP", "GTO"], "a": ["本视频聚焦于德州扑克中一个非常具体且高频的场景：在小盲位（SB）对抗大盲位（BB）的单次加注底池（SRP）中，翻牌圈作为不利位置（OOP）玩家选择过牌-跟注后，转牌再次过牌-跟注，最终在河牌圈面对对手下注时，我们应该用多“边缘”的牌去跟注。讲师指出，很多玩家在这种线路上严重过度弃牌，而GTO解算器（Solver）给出的答案远比想象中更“粘人”。", "视频的核心是给出具体的量化跟注阈值：对于最困难的跟注类别（低对、中对、低口袋对），我们分别需要跟注40%、34%和11%的频率，甚至偶尔还要加注。讲师通过多个具体牌例展示了这些阈值在实际牌局中的应用，强调了在河牌圈用第三对子（Third Pair）甚至更差的牌进行“英雄式跟注”的必要性。", "视频还解释了为什么在跟注频率上，低对（如底对）的跟注比例要高于中对（可能包含口袋对）的原因——这涉及到阻挡牌（Blockers）的价值。最后，讲师总结道，在GTO/Solver的视角下，这种线路上的跟注应该非常激进，玩家需要克服对“被碾压”（被对手更好的牌击败）的恐惧，严格按照频率进行防守。"], "note": ""}, {"id": "DGL#05-s0", "ep": "05", "type": "topic", "topic": "DGL#05 - 翻前加注单次加注底池、不利位置过牌-跟注-过牌-跟注线路的跟注阈值", "en": "PFR SRP OOP B-XC-XC Thresholds", "q": "视频主题与场景设定", "clues": ["PFR", "SRP", "OOP", "Check-Call"], "a": ["本视频讨论的是翻前加注（PFR）后，在单次加注底池（SRP）中，处于不利位置（OOP）的玩家（本例中为小盲位SB）面对对手（大盲位BB）时的“过牌-跟注-过牌-跟注”（Check-Call, Check-Call）线路。", "具体场景为：翻牌圈SB过牌，BB下注，SB跟注；转牌圈SB过牌，BB下注，SB跟注；河牌圈BB再次下注，此时SB需要决定跟注频率。", "视频中假设对手在转牌圈的下注尺度为2/3底池，在河牌圈的下注频率约为50%（即一半的时候会下注）。"], "note": ""}, {"id": "DGL#05-s1", "ep": "05", "type": "topic", "topic": "DGL#05 - 翻前加注单次加注底池、不利位置过牌-跟注-过牌-跟注线路的跟注阈值", "en": "PFR SRP OOP B-XC-XC Thresholds", "q": "核心跟注阈值数据", "clues": ["GTO", "Middle Pair", "Low Pair", "Low Pockets"], "a": ["在河牌圈面对对手下注时，对于“最困难跟注”的手牌类别（低对、中对、低口袋对），GTO解算器给出的答案是：整体跟注频率为32%，并且还有5%的频率需要加注。", "具体分类来看：中对（Middle Pair）的跟注频率为34%，低对（Low Pair，如底对或第三对子）的跟注频率为40%，低口袋对（Low Pockets，如22-66）的跟注频率为11%。", "讲师强调，如果你觉得这个数据很惊讶，那么你很可能在这条线路上过度弃牌（Over Fold）了，实际应该用更宽的范围进行跟注。"], "note": ""}, {"id": "DGL#05-s2", "ep": "05", "type": "topic", "topic": "DGL#05 - 翻前加注单次加注底池、不利位置过牌-跟注-过牌-跟注线路的跟注阈值", "en": "PFR SRP OOP B-XC-XC Thresholds", "q": "牌例一：T8s（同花T8）", "clues": ["T8s", "Third Pair"], "a": ["翻前SB用T8s（同花T8）开局加注，BB跟注。翻牌面为J♠8♦6♣，SB下注小注，BB跟注。转牌为3♦，SB过牌-跟注BB的下注。", "河牌为Q♣，使SB的牌力降为第三对子（Third Pair）。此时SB仍然需要偶尔跟注，尽管很多时候会被Q7这样的牌击败（被“碾压”）。"], "note": ""}, {"id": "DGL#05-s3", "ep": "05", "type": "topic", "topic": "DGL#05 - 翻前加注单次加注底池、不利位置过牌-跟注-过牌-跟注线路的跟注阈值", "en": "PFR SRP OOP B-XC-XC Thresholds", "q": "牌例二：T9s（同花T9）", "clues": ["T9s", "Gutshot"], "a": ["翻前SB用T9s（同花T9）开局加注，BB跟注。翻牌面为Q♦9♣5♥，SB下注小注，BB跟注。转牌为J♠，SB形成第三对子外加卡顺听牌（Gutshot），过牌-跟注。", "河牌为3♣，BB下注接近底池大小（约3/4底池），SB仍然需要用第三对子跟注，尽管有时会输给顶对。"], "note": ""}, {"id": "DGL#05-s4", "ep": "05", "type": "topic", "topic": "DGL#05 - 翻前加注单次加注底池、不利位置过牌-跟注-过牌-跟注线路的跟注阈值", "en": "PFR SRP OOP B-XC-XC Thresholds", "q": "牌例三：ATo（非同花AT）", "clues": ["ATo", "Overbet", "Blockers"], "a": ["翻前SB用ATo（非同花AT）开局加注，BB跟注。翻牌面为Q♣T♦2♠，SB下注小注，BB跟注。转牌为K♥，SB形成第三对子外加卡顺听牌，过牌-跟注。", "河牌为7♦，BB超池下注（Overbet）。由于SB持有A阻挡牌（Blockers），阻断了AA、AJ、KT、QT等关键组合，因此这次选择跟注，但BB实际持有K♦2♦（顶对），SB被击败。"], "note": ""}, {"id": "DGL#05-s5", "ep": "05", "type": "topic", "topic": "DGL#05 - 翻前加注单次加注底池、不利位置过牌-跟注-过牌-跟注线路的跟注阈值", "en": "PFR SRP OOP B-XC-XC Thresholds", "q": "牌例四：Q6s（同花Q6）", "clues": ["Q6s", "Hero Call"], "a": ["翻前SB用Q6s（同花Q6）开局加注，BB跟注。翻牌面为J♣J♦9♥（彩虹面），SB下注小注，BB跟注。转牌为6♠，SB击中一对（Q6），BB下注3/4底池，SB跟注。", "河牌为T♠，BB下注2/3底池，SB必须用Q6进行“抓鸡”（Hero Call）。讲师以此说明这条线路需要跟注到多薄。"], "note": ""}, {"id": "DGL#05-s6", "ep": "05", "type": "topic", "topic": "DGL#05 - 翻前加注单次加注底池、不利位置过牌-跟注-过牌-跟注线路的跟注阈值", "en": "PFR SRP OOP B-XC-XC Thresholds", "q": "牌例五：J9o（非同花J9）", "clues": ["J9o"], "a": ["翻前SB用J9o（非同花J9）开局加注，BB跟注。翻牌面为J♦8♣2♠，SB下注小注，BB跟注。转牌为2♦，SB过牌，BB下注，SB持有顶对加卡顺听牌，跟注。", "河牌为4♣（完全空白牌），BB超池下注1.2倍底池，SB仍然需要偶尔跟注，尽管这次被BB的2x（如A2）击败。"], "note": ""}, {"id": "DGL#05-s7", "ep": "05", "type": "topic", "topic": "DGL#05 - 翻前加注单次加注底池、不利位置过牌-跟注-过牌-跟注线路的跟注阈值", "en": "PFR SRP OOP B-XC-XC Thresholds", "q": "牌例六：A7o（非同花A7）", "clues": ["A7o", "Bottom Pair"], "a": ["翻前SB用A7o（非同花A7）开局加注，BB跟注。翻牌面为Q♦9♣7♠，SB击中底对（Bottom Pair），过牌-跟注。转牌为9♦，SB再次过牌-跟注。", "河牌为6♣，BB超池下注1.2倍底池，SB仍然需要偶尔跟注，尽管很多时候会输。"], "note": ""}, {"id": "DGL#05-s8", "ep": "05", "type": "topic", "topic": "DGL#05 - 翻前加注单次加注底池、不利位置过牌-跟注-过牌-跟注线路的跟注阈值", "en": "PFR SRP OOP B-XC-XC Thresholds", "q": "牌例七：99（口袋对子9）", "clues": ["Min Bet", "GTO", "11%"], "a": ["翻前SB用99（口袋对子9）开局加注，BB跟注。翻牌面为A♠7♦2♣（两张同花），SB下注最小注（Min Bet），BB跟注。转牌为A♦，SB过牌-跟注。河牌为J♥，BB超池下注1.2倍底池。", "尽管SB的99已经基本没有摊牌价值，但根据GTO，仍然需要以少量频率（约11%的低口袋对跟注区间内）进行跟注。"], "note": ""}, {"id": "DGL#05-s9", "ep": "05", "type": "topic", "topic": "DGL#05 - 翻前加注单次加注底池、不利位置过牌-跟注-过牌-跟注线路的跟注阈值", "en": "PFR SRP OOP B-XC-XC Thresholds", "q": "为什么低对跟注频率高于中对", "clues": ["Blockers", "Middle Pair", "T8s", "40%"], "a": ["讲师解释了一个反直觉的现象：为什么低对（如底对、第三对子）的跟注频率（40%）要高于中对（34%）？", "原因在于阻挡牌（Blockers）效应。中对（Middle Pair）很多时候是由口袋对子（如口袋J在Q-9-7牌面，口袋Q在K-8-6牌面）构成的，而口袋对子缺乏对对手价值范围的阻挡效果。", "相反，低对（如用T8s在J-8-6牌面形成的对子）往往带有一张与牌面相关的牌，能有效阻断对手的顶对或两对组合，因此更适合用来跟注。这就是为什么我们更倾向于用第三对子、第四对子跟注，而不是用那些可能是口袋对子的中对跟注。"], "note": ""}, {"id": "DGL#05-c0", "ep": "05", "type": "cloze", "topic": "DGL#05 - 翻前加注单次加注底池、不利位置过牌-跟注-过牌-跟注线路的跟注阈值", "en": "PFR SRP OOP B-XC-XC Thresholds", "q": "在河牌圈的下注频率约为＿＿（即一半的时候会下注）。", "clues": [], "a": ["视频中假设对手在转牌圈的下注尺度为2/3底池，在河牌圈的下注频率约为50%（即一半的时候会下注）。"], "note": "50%"}, {"id": "DGL#05-c1", "ep": "05", "type": "cloze", "topic": "DGL#05 - 翻前加注单次加注底池、不利位置过牌-跟注-过牌-跟注线路的跟注阈值", "en": "PFR SRP OOP B-XC-XC Thresholds", "q": "GTO解算器给出的答案是：整体跟注频率为＿＿，并且还有5%的频率需要加注。", "clues": [], "a": ["在河牌圈面对对手下注时，对于“最困难跟注”的手牌类别（低对、中对、低口袋对），GTO解算器给出的答案是：整体跟注频率为32%，并且还有5%的频率需要加注。"], "note": "32%"}, {"id": "DGL#05-c8", "ep": "05", "type": "cloze", "topic": "DGL#05 - 翻前加注单次加注底池、不利位置过牌-跟注-过牌-跟注线路的跟注阈值", "en": "PFR SRP OOP B-XC-XC Thresholds", "q": "仍然需要以少量频率（约＿＿的低口袋对跟注区间内）进行跟注。", "clues": [], "a": ["尽管SB的99已经基本没有摊牌价值，但根据GTO，仍然需要以少量频率（约11%的低口袋对跟注区间内）进行跟注。"], "note": "11%"}, {"id": "DGL#05-note", "ep": "05", "type": "note", "topic": "DGL#05 - 翻前加注单次加注底池、不利位置过牌-跟注-过牌-跟注线路的跟注阈值", "en": "PFR SRP OOP B-XC-XC Thresholds", "q": "避坑提醒与行动项", "clues": ["DGL", "Fish", "GTO"], "a": ["本视频是“DGL#05”系列的一部分，承接了之前关于“对抗鱼玩家（Fish）时下注小、过牌-跟注”的简单策略，进一步深入到GTO层面的平衡阈值计算。视频明确给出了在特定线路（SB vs BB，SRP，翻牌小注，转牌2/3下注，河牌50%下注频率）下的具体跟注频率，为玩家提供了可量化的防守基准。", "值得进一步学习的方向包括：转牌圈的跟注阈值（视频中明确提到“不涵盖转牌圈跟注阈值，留待未来视频”）、不同下注尺度（如1/3底池、超池下注）对阈值的影响，以及如何根据对手的实际倾向（如过度诈唬或价值过窄）来调整这些GTO频率。", "**行动项与常见错误：**", "- 应该这样做：在SB vs BB的单次加注底池中，面对河牌下注，用40%的低对、34%的中对和11%的低口袋对进行跟注，甚至偶尔加注（5%频率）。", "- 应该这样做：优先选择带有阻挡牌（如A、K、Q或与牌面相关的牌）的边缘对子进行跟注，而不是无阻挡的口袋对子。", "- 不要这样做：不要因为害怕被对手的顶对或两对“碾压”而过度弃牌。如果你发现自己在河牌圈几乎不用第三对子跟注，说明你正在严重过度弃牌。", "- 不要这样做：不要忽视低口袋对（如22-66）在河牌圈的少量跟注价值，即使它们看起来毫无摊牌价值，GTO仍然要求你用约11%的频率跟注。"], "note": ""}, {"id": "DGL#06-intro", "ep": "06", "type": "intro", "topic": "DGL#06 - 翻前加注单次加注底池不利位置过牌-跟注线的转牌跟注频率阈值", "en": "PFR SRP OOP B-XC Thresholds", "q": "DGL#06 - 翻前加注单次加注底池不利位置过牌-跟注线的转牌跟注频率阈值", "clues": ["OOP"], "a": ["本视频是“坏过牌-跟注线”系列的第二部分，承接上一集关于河牌圈跟注频率的内容。讲师聚焦于翻前加注者在单次加注底池中处于不利位置（OOP）时的场景：翻牌圈小注持续下注被跟注后，转牌圈过牌，面对对手2/3底池的下注，分析不同牌力类别（A高、中对、低对、双高张）应如何继续。", "视频的核心方法论是利用GTO求解器数据，为各手牌类别建立“全局启发式频率基准”，再根据具体牌面结构进行上下调整。讲师强调，转牌圈的跟注频率必须与河牌圈的跟注频率相衔接，否则会导致范围失衡。通过具体数据，讲师给出了各类牌力的基准跟注频率，并详细说明了哪些转牌出牌允许弃牌、哪些必须继续。", "视频最后总结了各牌力类别的行动指南：A高仅10%跟注、低对40%跟注、中对几乎总是跟注（除非转牌完成顺子或同花）、双高张A高在配对牌面高频跟注。这些频率基准可作为实战中的大脑参考框架，再根据具体牌面纹理进行一个或两个“桶”的上下调整。"], "note": ""}, {"id": "DGL#06-s0", "ep": "06", "type": "topic", "topic": "DGL#06 - 翻前加注单次加注底池不利位置过牌-跟注线的转牌跟注频率阈值", "en": "PFR SRP OOP B-XC Thresholds", "q": "视频承接与过滤条件设定", "clues": [], "a": ["本视频延续上一集内容，上一集讨论了IP玩家面对“过牌-跟注-过牌-跟注”线时河牌圈的跟注频率。本集聚焦转牌圈，因为只有转牌圈以正确频率继续，才能保证河牌圈范围中保留正确数量的手牌类别。", "过滤条件设定：翻牌圈小注下注被跟注，转牌圈过牌，对手下注2/3底池（这是最常见尺度），且我方手牌为A高、低对或中对且不带听牌。", "排除带听牌的手牌：如果手牌有听牌（如对子加听牌、A高加听牌），必然跟注甚至偶尔加注，绝不会弃牌，因此不在本视频讨论范围内。"], "note": ""}, {"id": "DGL#06-s1", "ep": "06", "type": "topic", "topic": "DGL#06 - 翻前加注单次加注底池不利位置过牌-跟注线的转牌跟注频率阈值", "en": "PFR SRP OOP B-XC Thresholds", "q": "A高牌类的转牌跟注频率", "clues": ["A10", "10%", "90%"], "a": ["全局数据：A高牌类跟注10%、弃牌90%。跟注部分主要集中在高踢脚A高（A10及以上），如A J、A 10、A Q、A K。", "跟注场景集中在配对牌面：如7-7-9-2-2-8、7-7-2配对转牌、Q-9-7转牌配对9等。干燥牌面如K-8-6-3、Q-6-2-2、K-J-4-J也会有一些跟注。", "结论：在配对翻牌、配对转牌或极干燥牌面上，A高可以过牌-跟注；其他牌面基本不跟注A高。"], "note": ""}, {"id": "DGL#06-s2", "ep": "06", "type": "topic", "topic": "DGL#06 - 翻前加注单次加注底池不利位置过牌-跟注线的转牌跟注频率阈值", "en": "PFR SRP OOP B-XC Thresholds", "q": "中对牌类的转牌跟注频率", "clues": ["87%"], "a": ["全局数据：中对跟注87%，几乎不弃牌。弃牌仅发生在转牌完成同花或完成顺子的牌面。", "典型弃牌场景：Q-10-6翻牌转牌来K（完成同花和顺子），Q-8可弃牌；K-10-8翻牌转牌来J（完成多种顺子和两对），J可弃牌；J-4翻牌J-9-5转牌来A（完成同花）；K-Q-J翻牌转牌来A（完成顺子）；A-Q-J转牌第三张同花；A-K-9转牌完成顺子。", "除上述转牌外，中对几乎总是跟注：K-9-6-Q牌面跟注Q-X；A-K-9-7跟注K-X；Q-9-5-Q跟注9-X；10-8-5转牌来A跟注10-X；J-8-6转牌来3跟注8-X；A-J-5-3跟注J-X。", "核心原则：除非转牌让双方范围都变得更强（同花、顺子等），否则中对在转牌几乎总是继续。即使最终河牌不一定跟注到底，转牌圈基本不弃牌。"], "note": ""}, {"id": "DGL#06-s3", "ep": "06", "type": "topic", "topic": "DGL#06 - 翻前加注单次加注底池不利位置过牌-跟注线的转牌跟注频率阈值", "en": "PFR SRP OOP B-XC Thresholds", "q": "低对牌类的转牌跟注频率", "clues": ["60%", "40%", "20%"], "a": ["全局数据：低对（牌面上的第三对或第四对）呈60-40分布，60%弃牌、40%跟注。40%的跟注频率不可忽视。", "典型跟注牌例：J-7在K-7-2翻牌转牌来9（第三对仍跟注）；Q-9-7-5牌面跟注7-X。", "全局40%是跨所有牌面的基准，具体牌面需上下调整一个或两个“桶”（每个桶约20%）。例如A-Q-8翻牌转牌来3，8-X组合跟注频率较高；A-4在Q-4-3-9牌面因A踢脚跟注更多；10-9在A-J-5-10牌面跟注10-X。", "调整逻辑：如果自己范围中有大量强牌（如A高、对子加听牌、卡顺等），低对可降至20%桶；如果牌面极干燥、自己范围中强牌不多，低对需提高到60%跟注。"], "note": ""}, {"id": "DGL#06-s4", "ep": "06", "type": "topic", "topic": "DGL#06 - 翻前加注单次加注底池不利位置过牌-跟注线的转牌跟注频率阈值", "en": "PFR SRP OOP B-XC Thresholds", "q": "双高张A高的转牌跟注频率", "clues": ["10%", "50%"], "a": ["区分A高类型：只有一张高张（即A）的A高跟注10%；有两张高张（如A K、A Q）的A高跟注50%，差异显著。", "双高张A高跟注场景集中在配对翻牌或配对转牌：A K在J-9-4-J牌面、A Q在Q-9-K-9牌面、A-8在J-3-2-J牌面（A为中对的高张）、A K在J-8-6-7牌面则不跟注。", "结论：双高张A高在配对牌面或配对转牌出牌时高频过牌-跟注，其他牌面基本弃牌。"], "note": ""}, {"id": "DGL#06-s5", "ep": "06", "type": "topic", "topic": "DGL#06 - 翻前加注单次加注底池不利位置过牌-跟注线的转牌跟注频率阈值", "en": "PFR SRP OOP B-XC Thresholds", "q": "全局频率基准总结", "clues": ["10%", "90%", "60%", "40%"], "a": ["A高（仅一张高张）：10%跟注、90%弃牌。", "低对（第三/第四对）：60%弃牌、40%跟注。", "中对（第二对）：几乎纯跟注（87%），仅在同花或顺子完成转牌弃牌。", "双高张A高：仅在配对翻牌或配对转牌高频跟注（50%），其他场景低频。"], "note": ""}, {"id": "DGL#06-s6", "ep": "06", "type": "topic", "topic": "DGL#06 - 翻前加注单次加注底池不利位置过牌-跟注线的转牌跟注频率阈值", "en": "PFR SRP OOP B-XC Thresholds", "q": "牌面纹理调整原则", "clues": ["20%", "60%"], "a": ["全局频率是跨所有牌面的基准，实战中需根据具体牌面上下调整一个或两个桶（每桶约20%）。", "如果牌面干燥、自己范围中强牌（对子加听牌、顺子听牌等）较少，低对跟注频率需提高至60%左右。", "如果牌面湿润、自己范围中强牌较多（如Q-9-5-A牌面有大量A高和听牌），低对可降至20%桶。", "调整的核心逻辑：自己范围中相对强牌越多，越可以少跟注弱牌；反之则需多跟注弱牌以保护范围。"], "note": ""}, {"id": "DGL#06-c1", "ep": "06", "type": "cloze", "topic": "DGL#06 - 翻前加注单次加注底池不利位置过牌-跟注线的转牌跟注频率阈值", "en": "PFR SRP OOP B-XC Thresholds", "q": "全局数据：A高牌类跟注＿＿、弃牌90%。跟注部分主要集中在高踢脚A高（A10及以上），", "clues": [], "a": ["全局数据：A高牌类跟注10%、弃牌90%。跟注部分主要集中在高踢脚A高（A10及以上），如A J、A 10、A Q、A K。"], "note": "10%"}, {"id": "DGL#06-c2", "ep": "06", "type": "cloze", "topic": "DGL#06 - 翻前加注单次加注底池不利位置过牌-跟注线的转牌跟注频率阈值", "en": "PFR SRP OOP B-XC Thresholds", "q": "全局数据：中对跟注＿＿，几乎不弃牌。", "clues": [], "a": ["全局数据：中对跟注87%，几乎不弃牌。弃牌仅发生在转牌完成同花或完成顺子的牌面。"], "note": "87%"}, {"id": "DGL#06-c3", "ep": "06", "type": "cloze", "topic": "DGL#06 - 翻前加注单次加注底池不利位置过牌-跟注线的转牌跟注频率阈值", "en": "PFR SRP OOP B-XC Thresholds", "q": "全局数据：低对（牌面上的第三对或第四对）呈60-40分布，＿＿弃牌、40%跟注。40%的跟注频率不可忽视。", "clues": [], "a": ["全局数据：低对（牌面上的第三对或第四对）呈60-40分布，60%弃牌、40%跟注。40%的跟注频率不可忽视。"], "note": "60%"}, {"id": "DGL#06-note", "ep": "06", "type": "note", "topic": "DGL#06 - 翻前加注单次加注底池不利位置过牌-跟注线的转牌跟注频率阈值", "en": "PFR SRP OOP B-XC Thresholds", "q": "避坑提醒与行动项", "clues": ["DGL", "OOP", "pot vs 2"], "a": ["本视频是DGL系列第6集，聚焦翻前加注者OOP面对转牌下注的跟注频率，与上一集河牌圈频率形成完整体系。讲师强调“全局启发式+牌面调整”的方法论，而非死记硬背具体组合。值得进一步学习的方向包括：翻牌圈小注持续下注后的转牌加注频率、不同下注尺度（如1/3 pot vs 2/3 pot）对频率的影响，以及河牌圈各牌力类别的具体跟注/弃牌决策。", "**行动项与常见错误：**", "- 不要在所有牌面都跟注A高，仅在配对牌面、配对转牌或极干燥牌面跟注（10%频率）。", "- 不要在转牌轻易弃掉中对，除非转牌完成同花或顺子（87%跟注频率）。", "- 低对需保持40%跟注频率，根据牌面纹理上下调整一个或两个桶，不要全部弃牌。", "- 双高张A高仅在配对牌面或配对转牌高频跟注，其他场景低频处理。", "- 转牌跟注频率必须与河牌跟注频率衔接，否则会导致河牌范围中该类手牌数量失衡。"], "note": ""}, {"id": "DGL#07-intro", "ep": "07", "type": "intro", "topic": "DGL#07 - 翻前加注单次加注底池、不利位置过牌-下注-下注线路中的放弃诈唬", "en": "PFR SRP OOP X-B-B Line Giving Up The Bluffs", "q": "DGL#07 - 翻前加注单次加注底池、不利位置过牌-下注-下注线路中的放弃诈唬", "clues": ["PFR", "SRP", "OOP"], "a": ["本视频聚焦于翻前加注（PFR）后形成的单次加注底池（SRP）中，不利位置（OOP）玩家在翻牌圈过牌-跟注后，转牌圈下注、河牌圈面临是否继续诈唬的决策。讲师通过求解器（Solver）数据，揭示了一个关键频率启发式：在转牌圈下注后，河牌圈需要放弃约60%的诈唬牌，才能保持平衡。", "视频的核心观点是，这条线路（翻牌过牌-过牌，转牌下注被跟注，河牌再行动）是玩家最容易过度诈唬（over-bluff）的线路之一。因为要维持平衡，必须高频放弃诈唬，而现实中绝大多数玩家（包括常规玩家和鱼）都无法做到这一点，导致该线路被系统性过度诈唬。讲师通过多个具体牌例展示了求解器在河牌圈放弃诈唬的决策模式。", "视频还指出，在各类诈唬牌中，错过的同花听牌（Miss Flush Draw）放弃频率最高（约三分之二），而错过的垃圾牌（Miss Trash）放弃频率稍低（约一半）。为简化执行，讲师建议将所有诈唬牌归为一类，统一采用60%的放弃频率。"], "note": ""}, {"id": "DGL#07-s0", "ep": "07", "type": "topic", "topic": "DGL#07 - 翻前加注单次加注底池、不利位置过牌-下注-下注线路中的放弃诈唬", "en": "PFR SRP OOP X-B-B Line Giving Up The Bluffs", "q": "线路定义与背景", "clues": ["PFR", "SRP", "flop", "check-check"], "a": ["本视频分析的线路为：翻前加注（PFR）后进入单次加注底池（SRP），翻牌圈（flop）双方过牌（check-check），转牌圈（turn）不利位置玩家下注（bet）并被跟注（call），河牌圈（river）面临是否继续诈唬的决策。", "该线路属于“过牌-下注-下注”（X-B-B）线路，且是翻牌圈过牌后，在转牌和河牌连续下注的模式。", "讲师强调，此线路中玩家处于不利位置（OOP），即翻牌圈先行动、转牌圈先行动、河牌圈先行动。"], "note": ""}, {"id": "DGL#07-s1", "ep": "07", "type": "topic", "topic": "DGL#07 - 翻前加注单次加注底池、不利位置过牌-下注-下注线路中的放弃诈唬", "en": "PFR SRP OOP X-B-B Line Giving Up The Bluffs", "q": "河牌圈放弃诈唬的整体频率", "clues": ["check-fold", "check-call", "60%", "40%"], "a": ["求解器数据显示，在近800手样本中，对于“错过的垃圾牌、错过的超对、错过的顺子听牌、错过的同花听牌”这四类诈唬牌，河牌圈放弃（check-fold）的频率为60%。", "讲师指出，这意味着如果转牌圈下注是平衡的，那么河牌圈必须放弃60%的诈唬牌，仅继续下注40%。", "在河牌圈，求解器大部分时候选择过牌-弃牌（check-fold），极小部分时候能过牌-跟注（check-call），例如某些A高牌或强K高牌。", "讲师强调，这个60%的放弃频率是维持平衡的关键，且该线路极易被过度诈唬，因为现实中很少有人能如此高频地放弃。"], "note": ""}, {"id": "DGL#07-s2", "ep": "07", "type": "topic", "topic": "DGL#07 - 翻前加注单次加注底池、不利位置过牌-下注-下注线路中的放弃诈唬", "en": "PFR SRP OOP X-B-B Line Giving Up The Bluffs", "q": "具体牌例分析", "clues": ["overcard", "check-call", "QTs", "JTs"], "a": ["**K8（垃圾牌）**：转牌圈下注诈唬，河牌圈牌面未改善，必须放弃。", "**JT（顺子听牌）**：翻牌面5-3-2，转牌出现高牌（overcard），转牌圈下注诈唬，河牌A出现，由于对手（IP）会用很多A高牌跟注转牌，即使JT阻挡了最强的A高牌（AJ、AT），仍选择放弃。", "**J9（卡顺+同花听牌阻挡牌）**：转牌圈下注，河牌空白，必须放弃，不能继续开火。", "**K6（卡顺）**：低牌面，转牌圈下注，河牌空白，必须放弃。但求解器在此例中选择了过牌-跟注（check-call），原因是K6没有阻挡对手的QTs、JTs等牌，反而让对手更可能持有这些牌，因此可以跟注。", "**Q8（卡顺）**：转牌K出现，转牌圈下注，河牌出现顺子面，选择放弃。", "**KQ（同花听牌）**：转牌圈下注，河牌未中，放弃。", "**A5（弱卡顺）**：河牌出现第四张同花，不再下注。", "**QJ（低牌面超牌）**：河牌出现顺子面，放弃。", "**J9（卡顺+同花听牌阻挡牌）**：转牌K出现，河牌Q♠，阻挡牌失效，过牌放弃。", "讲师总结，这些牌例展示了求解器在河牌圈大量放弃诈唬（60个放弃场景），而现实中对手很少这样做。"], "note": ""}, {"id": "DGL#07-s3", "ep": "07", "type": "topic", "topic": "DGL#07 - 翻前加注单次加注底池、不利位置过牌-下注-下注线路中的放弃诈唬", "en": "PFR SRP OOP X-B-B Line Giving Up The Bluffs", "q": "各类诈唬牌的放弃频率差异", "clues": ["Miss Flush Draw", "Miss Trash", "66%", "50%"], "a": ["错过的同花听牌（Miss Flush Draw）放弃频率最高，约三分之二（66%）。", "错过的垃圾牌（Miss Trash）放弃频率稍低，约一半（50%）。", "讲师建议，为简化执行，可将所有诈唬牌归为同一类别，统一采用60%的放弃频率，以保持平衡。"], "note": ""}, {"id": "DGL#07-s4", "ep": "07", "type": "topic", "topic": "DGL#07 - 翻前加注单次加注底池、不利位置过牌-下注-下注线路中的放弃诈唬", "en": "PFR SRP OOP X-B-B Line Giving Up The Bluffs", "q": "平衡与过度诈唬的现实意义", "clues": ["balanced play", "randomizing", "regulators", "fish"], "a": ["讲师指出，虽然本视频主题是平衡打法（balanced play），但最重要的启示是：对于没有正确随机化（randomizing）的玩家，几乎不可能在此线路保持平衡。", "因此，该线路被常规玩家（regulators）和鱼（fish）系统性过度诈唬。", "若要在此线路保持平衡，必须做到河牌圈放弃60%的诈唬牌，这是一个极高的要求，也是大多数玩家做不到的。"], "note": ""}, {"id": "DGL#07-c1", "ep": "07", "type": "cloze", "topic": "DGL#07 - 翻前加注单次加注底池、不利位置过牌-下注-下注线路中的放弃诈唬", "en": "PFR SRP OOP X-B-B Line Giving Up The Bluffs", "q": "对于“错过的垃圾牌、错过的超对、错过的顺子听牌、错过的同花听牌”这四类诈唬牌，河牌圈放弃（check-fold）的频率为＿＿。", "clues": [], "a": ["求解器数据显示，在近800手样本中，对于“错过的垃圾牌、错过的超对、错过的顺子听牌、错过的同花听牌”这四类诈唬牌，河牌圈放弃（check-fold）的频率为60%。"], "note": "60%"}, {"id": "DGL#07-c3", "ep": "07", "type": "cloze", "topic": "DGL#07 - 翻前加注单次加注底池、不利位置过牌-下注-下注线路中的放弃诈唬", "en": "PFR SRP OOP X-B-B Line Giving Up The Bluffs", "q": "错过的同花听牌（Miss Flush Draw）放弃频率最高，约三分之二（＿＿）。", "clues": [], "a": ["错过的同花听牌（Miss Flush Draw）放弃频率最高，约三分之二（66%）。"], "note": "66%"}, {"id": "DGL#07-c4", "ep": "07", "type": "cloze", "topic": "DGL#07 - 翻前加注单次加注底池、不利位置过牌-下注-下注线路中的放弃诈唬", "en": "PFR SRP OOP X-B-B Line Giving Up The Bluffs", "q": "必须做到河牌圈放弃＿＿的诈唬牌，这是一个极高的要求，", "clues": [], "a": ["若要在此线路保持平衡，必须做到河牌圈放弃60%的诈唬牌，这是一个极高的要求，也是大多数玩家做不到的。"], "note": "60%"}, {"id": "DGL#07-note", "ep": "07", "type": "note", "topic": "DGL#07 - 翻前加注单次加注底池、不利位置过牌-下注-下注线路中的放弃诈唬", "en": "PFR SRP OOP X-B-B Line Giving Up The Bluffs", "q": "避坑提醒与行动项", "clues": ["GTO", "lacy bet", "40%"], "a": ["本视频是“GTO蓝图课程”（GTO Blueprint Course）中关于河牌圈玩法系列的一部分，承接了之前关于河牌圈“放弃约一半诈唬”的概念，并针对特定线路（X-B-B）给出了更精确的频率。讲师提到，在GTO蓝图课程中，有关于“溜入-下注”（lacy bet）线路的所有手牌类别频率启发式，例如转牌圈需要过牌约40%的听牌等。", "进一步学习方向：可深入研究转牌圈下注范围的构建（哪些弱牌应该过牌、哪些听牌应该下注），以及河牌圈不同牌面结构下放弃频率的微调。对于实战玩家，建议在类似线路中刻意练习“放弃诈唬”，避免过度诈唬的倾向。", "**行动项（应该做/不要做）**：", "- 应该做：在翻牌过牌-过牌、转牌下注被跟注后，河牌圈放弃约60%的诈唬牌。", "- 应该做：将错过的同花听牌、垃圾牌、顺子听牌等诈唬牌统一归类，简化决策。", "- 不要做：不要在该线路连续开火所有诈唬牌，这会导致过度诈唬。", "- 不要做：不要因为持有阻挡牌（如阻挡A高牌）就强行继续诈唬，求解器在多数情况下仍会选择放弃。"], "note": ""}, {"id": "DGL#08-intro", "ep": "08", "type": "intro", "topic": "DGL#08 - 翻前加注者单次加注底池中处于不利位置时，如何在转牌圈游戏听牌", "en": "PFR SRP OOP How to Play Draws on the Turn", "q": "DGL#08 - 翻前加注者单次加注底池中处于不利位置时，如何在转牌圈游戏听牌", "clues": ["PFR", "SRP", "OOP"], "a": ["本视频聚焦于翻前加注者（PFR）在单次加注底池（SRP）中处于不利位置（OOP）时，如何在转牌圈游戏听牌。视频首先回顾了整体转牌圈双倍下注（double barrel）频率为34%，且主要使用2/3到3/4底池的下注尺度，同时包含少量1.2倍底池和2倍底池的超池下注。在此基础上，讲师深入分析了当持有听牌时，应该如何调整下注与过牌的频率分配。", "视频的核心发现是：无论翻牌面结构如何变化（A高、K高、Q高、J高或低牌面），听牌的下注频率都惊人地稳定在70%-75%左右，过牌频率为25%-30%。唯一显著的例外是当转牌发出高牌（overcard）时，下注频率会提升至84%。在过牌后面对对手的下注时，组合听牌（combo draw）的过牌加注频率高达45%-50%，而普通同花听牌和顺子听牌的过牌加注频率则在15%-26%之间。", "视频通过大量具体牌例展示了不同听牌类型（组合听牌、同花听牌、顺子听牌）在不同牌面结构下的具体行动选择，强调了“大部分时候下注、过牌后大部分时候跟注、少量过牌加注”的核心策略框架，并指出听牌类型之间的策略差异远小于预期。"], "note": ""}, {"id": "DGL#08-s0", "ep": "08", "type": "topic", "topic": "DGL#08 - 翻前加注者单次加注底池中处于不利位置时，如何在转牌圈游戏听牌", "en": "PFR SRP OOP How to Play Draws on the Turn", "q": "转牌圈整体双倍下注策略回顾", "clues": ["depolarization", "34%"], "a": ["在翻牌圈下注被跟注后，转牌圈整体双倍下注频率为34%。", "最常用的下注尺度是2/3到3/4底池，同时有相当数量的1.2倍底池下注。", "策略中包含少量去极化（depolarization）下注和少量2倍底池的超池极化下注。", "这是用整个范围在转牌圈游戏的平均策略基线。"], "note": ""}, {"id": "DGL#08-s1", "ep": "08", "type": "topic", "topic": "DGL#08 - 翻前加注者单次加注底池中处于不利位置时，如何在转牌圈游戏听牌", "en": "PFR SRP OOP How to Play Draws on the Turn", "q": "听牌的整体下注与过牌频率", "clues": ["75%", "25%", "70%", "30%"], "a": ["筛选出转牌圈持有听牌（包括两头顺听牌、同花听牌和组合听牌）的情况后，双倍下注频率为75%，过牌频率为25%。", "不同听牌类别之间的策略差异并不大：组合听牌下注70%、过牌30%；同花听牌也是70/30；两头顺听牌下注频率略高，为78/22。", "同花听牌和组合听牌过牌频率略高（30%），因为这些牌型具备更强的过牌加注潜力。", "核心结论：无论具体听牌类型，转牌圈下注频率基本维持在70%-75%区间。"], "note": ""}, {"id": "DGL#08-s2", "ep": "08", "type": "topic", "topic": "DGL#08 - 翻前加注者单次加注底池中处于不利位置时，如何在转牌圈游戏听牌", "en": "PFR SRP OOP How to Play Draws on the Turn", "q": "过牌后面对对手下注的应对策略", "clues": ["stab", "check-call", "QJo", "QTo"], "a": ["过牌后面对对手的下注（stab），整体过牌加注频率为27%，极少弃牌。", "大部分时候选择跟注（check-call），这是最频繁的行动。", "过牌加注频率为27%，且组合听牌的过牌加注频率显著更高。", "具体牌例：QJo在K-8-6-T牌面，过牌频率25%，过牌后大部分时候跟注。", "具体牌例：KQ在A-8-3-4牌面（K高同花听牌），选择过牌跟注。", "具体牌例：KQ在J-T-X牌面（两张高张+两头顺听牌），同样过牌跟注。", "具体牌例：6♠5♠在A-T-7-4牌面（同花听牌+两头顺听牌），过牌跟注，河牌圈过牌全下。", "具体牌例：K♦T♦在转牌2♠（组合听牌），过牌跟注。", "具体牌例：QTo在转牌圈（两头顺听牌），过牌后面对小超池下注选择跟注。", "具体牌例：JTo在A-Q-8牌面，转牌圈有时过牌，面对大注选择跟注。"], "note": ""}, {"id": "DGL#08-s3", "ep": "08", "type": "topic", "topic": "DGL#08 - 翻前加注者单次加注底池中处于不利位置时，如何在转牌圈游戏听牌", "en": "PFR SRP OOP How to Play Draws on the Turn", "q": "不同听牌类型的过牌加注频率差异", "clues": ["45%", "16%", "26%", "50%"], "a": ["组合听牌：从不弃牌，过牌加注频率高达45%，面对对手下注时基本是50/50的跟注与加注分配。", "同花听牌：可以弃掉一小部分，特别是非同花同花听牌（offsuit flush draws）以及部分同花听牌。", "同花听牌的具体弃牌牌例：Q♦J♦在6-4-7牌面（仅Q高），面对小超池下注无法继续；7♦6♦面对非常大的下注弃牌；J♦T♦面对小下注弃牌；Q♦9（仅9♦）面对2/3底池下注弃牌；8♦5♦（仅同花听牌）面对2倍底池下注无法继续。", "同花听牌整体：极少弃牌，大部分跟注，过牌加注频率约16%。", "顺子听牌：策略与同花听牌类似，弃牌频率略高，过牌加注频率约26%。", "组合听牌过牌加注频率50%，两头顺和同花听牌过牌加注频率15%-25%，其余大部分跟注。"], "note": ""}, {"id": "DGL#08-s4", "ep": "08", "type": "topic", "topic": "DGL#08 - 翻前加注者单次加注底池中处于不利位置时，如何在转牌圈游戏听牌", "en": "PFR SRP OOP How to Play Draws on the Turn", "q": "牌面结构对听牌策略的影响极小", "clues": ["74%", "26%", "75%", "25%"], "a": ["无论翻牌面高牌结构如何变化，听牌的下注/过牌频率几乎不变。", "A高牌面：下注74%、过牌26%。", "K高或Q高牌面：下注75%、过牌25%。", "Q高或J高牌面：下注75%、过牌25%。", "J高或10高牌面：下注73%、过牌27%。", "9高或更低牌面：下注70%、过牌30%，过牌频率略增。", "结论：听牌的下注频率在70%-75%之间波动，差异极小，这是一个非常稳定、全局性的手牌类别频率特征。"], "note": ""}, {"id": "DGL#08-s5", "ep": "08", "type": "topic", "topic": "DGL#08 - 翻前加注者单次加注底池中处于不利位置时，如何在转牌圈游戏听牌", "en": "PFR SRP OOP How to Play Draws on the Turn", "q": "转牌为高牌时的策略调整", "clues": ["overcard", "75%", "84%", "10%"], "a": ["当转牌发出高牌（overcard，高于翻牌圈所有牌）时，听牌的下注频率从75%提升至84%，上升约10%。", "当转牌不是高牌时，下注频率略低于平均值，为72%。", "这是视频中发现的唯一显著影响听牌下注频率的牌面结构因素。", "转牌发出第三张同花牌时，策略与平均值类似（约72/28）。", "转牌使牌面成对（翻牌圈未成对）时，策略同样与平均值类似（约72/28）。", "结论：听牌的双倍下注频率极其稳定，几乎不受牌面结构影响，唯一例外是转牌为高牌时增加约10%的下注频率。"], "note": ""}, {"id": "DGL#08-s6", "ep": "08", "type": "topic", "topic": "DGL#08 - 翻前加注者单次加注底池中处于不利位置时，如何在转牌圈游戏听牌", "en": "PFR SRP OOP How to Play Draws on the Turn", "q": "核心策略总结", "clues": ["75%", "10%", "84%", "15%"], "a": ["转牌圈持有听牌时，双倍下注频率为75%，无论牌面结构如何基本保持不变。", "如果转牌是高牌，下注频率增加10%至84%。", "过牌后面对对手下注：组合听牌过牌加注一半、跟注一半；两头顺听牌和同花听牌过牌加注15%-25%，其余跟注，偶尔在大尺度下注时弃牌。"], "note": ""}, {"id": "DGL#08-c0", "ep": "08", "type": "cloze", "topic": "DGL#08 - 翻前加注者单次加注底池中处于不利位置时，如何在转牌圈游戏听牌", "en": "PFR SRP OOP How to Play Draws on the Turn", "q": "在翻牌圈下注被跟注后，转牌圈整体双倍下注频率为＿＿。", "clues": [], "a": ["在翻牌圈下注被跟注后，转牌圈整体双倍下注频率为34%。"], "note": "34%"}, {"id": "DGL#08-c1", "ep": "08", "type": "cloze", "topic": "DGL#08 - 翻前加注者单次加注底池中处于不利位置时，如何在转牌圈游戏听牌", "en": "PFR SRP OOP How to Play Draws on the Turn", "q": "筛选出转牌圈持有听牌（包括两头顺听牌、同花听牌和组合听牌）的情况后，双倍下注频率为＿＿，过牌频率为25%。", "clues": [], "a": ["筛选出转牌圈持有听牌（包括两头顺听牌、同花听牌和组合听牌）的情况后，双倍下注频率为75%，过牌频率为25%。"], "note": "75%"}, {"id": "DGL#08-c2", "ep": "08", "type": "cloze", "topic": "DGL#08 - 翻前加注者单次加注底池中处于不利位置时，如何在转牌圈游戏听牌", "en": "PFR SRP OOP How to Play Draws on the Turn", "q": "过牌后面对对手的下注（stab），整体过牌加注频率为＿＿，极少弃牌。", "clues": [], "a": ["过牌后面对对手的下注（stab），整体过牌加注频率为27%，极少弃牌。"], "note": "27%"}, {"id": "DGL#08-note", "ep": "08", "type": "note", "topic": "DGL#08 - 翻前加注者单次加注底池中处于不利位置时，如何在转牌圈游戏听牌", "en": "PFR SRP OOP How to Play Draws on the Turn", "q": "避坑提醒与行动项", "clues": ["DGL", "GTO", "34%"], "a": ["本视频是DGL系列第8期，聚焦于翻前加注者单次加注底池中处于不利位置时的转牌圈听牌策略。视频建立在前期关于转牌圈整体双倍下注频率（34%）和下注尺度分布的基础上，进一步细化了听牌这一特定手牌类别的处理方式。核心价值在于揭示了听牌策略的高度稳定性——无论牌面结构如何变化，下注频率始终维持在70%-75%区间，这为玩家提供了一个简单易记的全局性频率基准。", "值得进一步学习的方向包括：河牌圈听牌未完成时的后续处理、转牌圈过牌加注后的河牌圈策略、以及面对不同对手类型时如何偏离这些GTO基准频率进行剥削性调整。", "**行动项与常见错误提醒：**", "- 转牌圈持有听牌时，应保持约75%的下注频率，不要因牌面结构变化而大幅偏离。", "- 转牌为高牌时，可将下注频率提升至84%。", "- 过牌后面对对手下注，组合听牌应一半跟注一半加注，不要过度弃牌。", "- 普通同花听牌和顺子听牌过牌后应以跟注为主，过牌加注频率控制在15%-25%。", "- 避免在持有强听牌时频繁弃牌，特别是组合听牌几乎不应弃牌。", "- 不要因为翻牌面高低而大幅改变听牌的下注频率，除非转牌是高牌。"], "note": ""}, {"id": "DGL#09-intro", "ep": "09", "type": "intro", "topic": "DGL#09 - 翻前加注、单次加注底池、有利位置双枪诈唬", "en": "PFR SRP IP Double Barreling Air", "q": "DGL#09 - 翻前加注、单次加注底池、有利位置双枪诈唬", "clues": ["BTN", "SRP", "bet"], "a": ["本视频聚焦于按钮位（BTN）对抗大盲位（BB）的单次加注底池（SRP）中，翻牌圈持续下注（c-bet）后，转牌圈对手过牌时，我们手持“绝对空气牌”（无对子、无听牌、无高张）应该如何继续下注（双枪）。讲师通过Hand2Note的频率报告和GTO模拟器数据，给出了一个清晰、可执行的手牌类别启发式策略。", "核心结论是：在按钮位 vs 大盲位的单次加注底池中，翻牌圈小注持续下注后，转牌圈整体双枪频率应为39%。而对于“无对子、无听牌、无高张”的绝对空气牌，你仍然需要以约26%的频率继续双枪下注，而不是全部过牌。这个结论对很多玩家来说反直觉，但它是GTO策略中保护过牌范围、维持诈唬频率所必需的。", "视频通过多个具体牌例（如J9o在A高翻牌面、Q3s在K高翻牌面等）展示了这些空气牌在实际牌局中的下注场景，并强调在构建策略时，应关注手牌类别层面的频率平衡，而非追求单一组合的精确下注频率。讲师认为，将空气牌统一放入25%的下注频率桶中，已经足以构建一个稳定、接近不可剥削的策略。"], "note": ""}, {"id": "DGL#09-s0", "ep": "09", "type": "topic", "topic": "DGL#09 - 翻前加注、单次加注底池、有利位置双枪诈唬", "en": "PFR SRP IP Double Barreling Air", "q": "翻前加注与翻牌圈过滤条件", "clues": ["BTN", "RFI", "small c-bet", "Hand2Note"], "a": ["本视频研究的具体场景为：按钮位（BTN）率先加注（RFI），大盲位（BB）跟注，翻牌圈我们（BTN）进行小尺度持续下注（c-bet），转牌圈对手过牌给我们。", "视频中使用的翻牌圈下注尺度为小注（small c-bet），这是该场景下最常用的下注尺度。", "通过Hand2Note软件过滤出上述条件后，可以查看转牌圈各手牌类别的具体行动频率。"], "note": ""}, {"id": "DGL#09-s1", "ep": "09", "type": "topic", "topic": "DGL#09 - 翻前加注、单次加注底池、有利位置双枪诈唬", "en": "PFR SRP IP Double Barreling Air", "q": "转牌圈整体双枪频率", "clues": ["GTO", "Double Barrel", "Hand2Note", "39%"], "a": ["在上述特定场景下，GTO策略要求我们在转牌圈整体双枪（Double Barrel）的频率为39%。", "这个39%是全局频率，涵盖了所有手牌类别，包括强牌、中等牌、听牌以及空气牌。", "该数据来自Hand2Note的“转牌手牌报告”，该报告能清晰展示每一类手牌在转牌圈的下注频率。"], "note": ""}, {"id": "DGL#09-s2", "ep": "09", "type": "topic", "topic": "DGL#09 - 翻前加注、单次加注底池、有利位置双枪诈唬", "en": "PFR SRP IP Double Barreling Air", "q": "空气牌（无对无听无高张）的双枪频率", "clues": ["GTO", "26%"], "a": ["视频重点关注的手牌类别是“无对子、无听牌、无高张”的绝对空气牌，即没有任何权益的牌。", "对于这类手牌，GTO策略给出的双枪频率为26%。", "讲师强调，很多玩家会直觉性地将所有这类垃圾牌都用于过牌，但这是错误的。如果诈唬范围中只有听牌，过牌范围将变得极易被剥削。", "正确的做法是，必须在双枪范围中保留一定比例的空气牌，以平衡范围，使对手无法通过简单的过牌-加注或跟注来利用我们。"], "note": ""}, {"id": "DGL#09-s3", "ep": "09", "type": "topic", "topic": "DGL#09 - 翻前加注、单次加注底池、有利位置双枪诈唬", "en": "PFR SRP IP Double Barreling Air", "q": "空气牌双枪的具体牌例", "clues": ["K86", "K76", "QQ8", "K73"], "a": ["讲师展示了多个模拟器中的具体牌例，说明哪些空气牌在哪些牌面结构下会进行双枪下注。", "牌例1：翻牌面653，转牌A。手持K9，会以一定频率双枪下注。", "牌例2：翻牌面33J（彩虹面），转牌Q♠。手持T♣8♥，有时会双枪下注。", "牌例3：翻牌面K86，转牌3。手持Q♦J♦（QJ非同花），会以一定频率用Q高双枪。", "牌例4：翻牌面K76（彩虹面），转牌3。手持Q♣J♣（QJ非同花），会用Q高双枪。", "牌例5：翻牌面QQ8（彩虹面），转牌K。手持75s，有时会双枪下注。", "牌例6：翻牌面K73（彩虹面），转牌A。手持7♥5♥，会直接双枪下注，讲师称之为“完全垃圾牌”。", "牌例7：翻牌面K7T，转牌J（形成双高张牌面）。手持Q3s，会使用超大注码（约2倍底池）进行双枪，该牌没有任何权益，也没有高张。"], "note": ""}, {"id": "DGL#09-s4", "ep": "09", "type": "topic", "topic": "DGL#09 - 翻前加注、单次加注底池、有利位置双枪诈唬", "en": "PFR SRP IP Double Barreling Air", "q": "高张牌面与低张牌面的区别", "clues": [], "a": ["讲师指出，高张牌面（A高、K高、Q高）是产生“无对无听无高张”空气牌最多的牌面结构。", "在低张牌面（如6-5-3），大部分诈唬牌至少会有一张高张，因此“无高张”的空气牌相对较少。", "因此，在A高、K高、Q高等高张牌面上，我们更容易找到适合双枪的绝对空气牌。"], "note": ""}, {"id": "DGL#09-s5", "ep": "09", "type": "topic", "topic": "DGL#09 - 翻前加注、单次加注底池、有利位置双枪诈唬", "en": "PFR SRP IP Double Barreling Air", "q": "模拟器验证与频率桶", "clues": ["GTO Wizard", "K96", "J8o", "Q73"], "a": ["讲师通过GTO Wizard模拟器展示了两个具体牌面结构下的策略。", "牌面结构1：K96彩虹面，转牌2。无对无听无高张类手牌的双枪频率为29%-30%。其中J♣5♣的下注频率为50%，J8o等随机牌也会以一定频率下注。", "牌面结构2：Q73彩虹面，转牌4。无对无听无高张类手牌的双枪频率约为20%。J9o、JTo、T9o等牌会以接近该频率下注。", "讲师总结，无论牌面结构如何，GTO策略都要求我们在双枪范围中保留一定比例的空气牌，全局来看，可以将这些牌统一放入25%的下注频率桶中。"], "note": ""}, {"id": "DGL#09-s6", "ep": "09", "type": "topic", "topic": "DGL#09 - 翻前加注、单次加注底池、有利位置双枪诈唬", "en": "PFR SRP IP Double Barreling Air", "q": "组合级精度与手牌类别启发式", "clues": ["J5s", "Q3s", "vs 75", "25%"], "a": ["讲师指出，在模拟器中，同一类别的空气牌（如J5s和Q3s）可能会有不同的下注频率（例如25% vs 75%），这会让玩家感到困惑或沮丧。", "他强调，追求每一个具体组合的精确频率是“不必要的”且“对大多数人来说几乎不可能实现”的。", "正确的做法是建立手牌类别层面的启发式策略，例如将所有“无对无听无高张”的空气牌统一放入25%的下注频率桶中。", "两种策略（组合级精确 vs 类别级统一）在实际EV上的差异微乎其微，但类别级策略更容易实施，且能保证策略的稳定性和连贯性，使其接近不可剥削。"], "note": ""}, {"id": "DGL#09-s7", "ep": "09", "type": "topic", "topic": "DGL#09 - 翻前加注、单次加注底池、有利位置双枪诈唬", "en": "PFR SRP IP Double Barreling Air", "q": "核心行动结论", "clues": ["25%"], "a": ["在按钮位 vs 大盲位的单次加注底池中，翻牌圈小注持续下注后，转牌圈对手过牌时，如果你手持“无对子、无听牌、无高张”的绝对空气牌，请以约25%的频率继续双枪下注。", "这一策略能确保你的下注范围中包含足够的诈唬牌，从而保护你的过牌范围，使其不被对手利用。", "不要试图在组合级别上追求完美，而是专注于执行手牌类别层面的频率策略。"], "note": ""}, {"id": "DGL#09-c1", "ep": "09", "type": "cloze", "topic": "DGL#09 - 翻前加注、单次加注底池、有利位置双枪诈唬", "en": "PFR SRP IP Double Barreling Air", "q": "GTO策略要求我们在转牌圈整体双枪（Double Barrel）的频率为＿＿。", "clues": [], "a": ["在上述特定场景下，GTO策略要求我们在转牌圈整体双枪（Double Barrel）的频率为39%。"], "note": "39%"}, {"id": "DGL#09-c2", "ep": "09", "type": "cloze", "topic": "DGL#09 - 翻前加注、单次加注底池、有利位置双枪诈唬", "en": "PFR SRP IP Double Barreling Air", "q": "对于这类手牌，GTO策略给出的双枪频率为＿＿。", "clues": [], "a": ["对于这类手牌，GTO策略给出的双枪频率为26%。"], "note": "26%"}, {"id": "DGL#09-c5", "ep": "09", "type": "cloze", "topic": "DGL#09 - 翻前加注、单次加注底池、有利位置双枪诈唬", "en": "PFR SRP IP Double Barreling Air", "q": "无对无听无高张类手牌的双枪频率为＿＿-30%。其中J♣5♣的下注频率为50%，", "clues": [], "a": ["牌面结构1：K96彩虹面，转牌2。无对无听无高张类手牌的双枪频率为29%-30%。其中J♣5♣的下注频率为50%，J8o等随机牌也会以一定频率下注。"], "note": "29%"}, {"id": "DGL#09-note", "ep": "09", "type": "note", "topic": "DGL#09 - 翻前加注、单次加注底池、有利位置双枪诈唬", "en": "PFR SRP IP Double Barreling Air", "q": "避坑提醒与行动项", "clues": ["DGL", "PFR", "SRP"], "a": ["本视频是DGL系列课程的第9讲，专注于翻前加注（PFR）后、单次加注底池（SRP）中、有利位置（IP）的双枪下注策略。视频重点解决了“何时用空气牌双枪”这一具体问题，为玩家提供了一个简单、可量化的频率基准（25%桶）。这为后续学习更复杂的转牌圈策略（如不同牌面结构下的下注尺度选择、组合选择等）奠定了基础。", "值得进一步学习的方向包括：在不同牌面结构（如连接性强的牌面、对子牌面）下，空气牌双枪频率的具体调整；如何结合阻挡牌（Blockers）优化空气牌的选择；以及如何将这一频率启发式应用到其他位置对抗（如CO vs BB、BTN vs SB）的场景中。", "**行动项与常见错误：**", "- **应该这样做：** 在BTN vs BB的单次加注底池中，转牌圈对手过牌时，手持无对无听无高张的空气牌，应以约25%的频率继续双枪下注。", "- **不要这样做：** 不要将所有无对无听无高张的垃圾牌都用于过牌，这会使你的过牌范围过于脆弱，容易被对手剥削。", "- **不要这样做：** 不要试图在组合级别上精确复刻GTO策略的每一个下注频率，这几乎不可能实现，且收益微乎其微。应专注于手牌类别层面的频率执行。"], "note": ""}, {"id": "DGL#10-intro", "ep": "10", "type": "intro", "topic": "按钮位对盲注位三条街诈唬空气牌的策略频率", "en": "PFR SRP IP Triple Barreling Air", "q": "按钮位对盲注位三条街诈唬空气牌的策略频率", "clues": ["BTN", "triple barrel", "air"], "a": ["本视频聚焦于按钮位（BTN）率先加注后被大盲位（BB）跟注，随后在翻牌、转牌、河牌三条街持续下注（triple barrel）的牌局中，如何用空气牌（air）进行河牌圈诈唬。讲师通过求解器（solver）数据，给出了一个基于手牌类别（hand class）的频率启发式策略，帮助玩家快速决策。", "视频将空气牌细分为四类：垃圾牌（Mr. Trash）、未中的顺子听牌（Missed Straight Draw）、未中的高张（Missed Overs）和未中的同花听牌（Missed Flush Draw）。核心发现是：不同类别的空气牌在河牌圈继续诈唬的频率差异显著，从垃圾牌的50%到未中同花听牌的30%不等。", "讲师最终给出了一个简化的全局启发式：所有空气牌在河牌圈采用40-60的诈唬/过牌比例即可。同时，他也指出了更精细的分类频率，并预告了未来视频将深入讨论未中同花听牌内部的具体牌张差异（如阻挡牌效应）。"], "note": ""}, {"id": "DGL#10-s0", "ep": "10", "type": "topic", "topic": "按钮位对盲注位三条街诈唬空气牌的策略频率", "en": "PFR SRP IP Triple Barreling Air", "q": "牌局设定与筛选条件", "clues": ["BTN", "open", "bet", "check"], "a": ["牌局场景：按钮位（BTN）开局加注（open），大盲位（BB）跟注，翻牌圈持续下注（c-bet）被跟注，转牌圈再次下注被跟注，河牌圈对手过牌（check）给我们。", "筛选条件：仅分析空气牌，排除A高牌（not ace high），因为A高牌在摊牌时有一定价值，不纳入本启发式。", "手牌类别筛选：包含四类——垃圾牌（Mr. Trash）、未中的高张（Mr. Overs）、未中的顺子听牌（Mr. Straight Draw）、未中的同花听牌（Ms. Flush Draw）。"], "note": ""}, {"id": "DGL#10-s1", "ep": "10", "type": "topic", "topic": "按钮位对盲注位三条街诈唬空气牌的策略频率", "en": "PFR SRP IP Triple Barreling Air", "q": "全局频率：空气牌河牌圈继续诈唬43%", "clues": ["bet", "43%", "57%"], "a": ["求解器数据显示，在上述牌局中，所有空气牌在河牌圈面对对手过牌时，继续下注（bet）的频率为43%。", "这意味着约57%的空气牌会选择过牌，放弃诈唬，因为对手的跟注范围在三条街后已经相当强。", "43%的全局频率可作为快速决策的基准，但更精细的分类能提供更优策略。"], "note": ""}, {"id": "DGL#10-s2", "ep": "10", "type": "topic", "topic": "按钮位对盲注位三条街诈唬空气牌的策略频率", "en": "PFR SRP IP Triple Barreling Air", "q": "四类空气牌的细分频率", "clues": ["Trash", "Missed Overs", "50%", "60%"], "a": ["垃圾牌（Mr. Trash）：河牌圈继续诈唬的频率为50%，呈现50-50的均分（下注/过牌各半）。这类牌完全没有摊牌价值，且阻挡牌效应较弱，适合高频诈唬。", "未中的顺子听牌（Missed Straight Draw）：河牌圈继续诈唬的频率为60-40（下注60%，过牌40%）。这类牌在翻牌和转牌的下注频率略低于垃圾牌，但河牌诈唬倾向更高。", "未中的高张（Missed Overs）：同样采用60-40的诈唬/过牌比例。高张牌（如A、K、Q）具有一定的阻挡牌效应，且可能阻断对手的跟注范围。", "未中的同花听牌（Missed Flush Draw）：河牌圈继续诈唬的频率仅为30%，呈现25-75或30-70的下注/过牌比例。这类牌是公认的较差诈唬候选，因为对手更可能持有同花或同花阻挡牌。"], "note": ""}, {"id": "DGL#10-s3", "ep": "10", "type": "topic", "topic": "按钮位对盲注位三条街诈唬空气牌的策略频率", "en": "PFR SRP IP Triple Barreling Air", "q": "简化启发式：40-60全局比例", "clues": ["40%", "60%", "43%"], "a": ["讲师建议，如果不做精细分类，所有空气牌在河牌圈统一采用40-60的诈唬/过牌比例（即40%下注，60%过牌），这是一个非常实用的全局启发式。", "该比例与求解器的43%全局频率高度吻合，误差极小，适合实战中快速决策。", "对于追求更精细策略的玩家，可参考上述四类频率：垃圾牌50-50，未中顺子听牌和未中高张60-40，未中同花听牌25-75或30-70。"], "note": ""}, {"id": "DGL#10-s4", "ep": "10", "type": "topic", "topic": "按钮位对盲注位三条街诈唬空气牌的策略频率", "en": "PFR SRP IP Triple Barreling Air", "q": "未中同花听牌的细节差异", "clues": ["A2s", "K3s", "QJs", "JTs"], "a": ["未中同花听牌内部存在显著差异：高牌和低牌（如A2s、K3s）比两张中间高牌（如QJs、JTs）更适合诈唬，因为前者具有更强的阻挡牌效应（blocker），能阻断对手的顶对或同花组合。", "非同花（offsuit）的未中同花听牌与同花（suited）的未中同花听牌在诈唬频率上也有区别，但具体细节留待未来视频讲解。", "当前视频仅给出总体结论：未中同花听牌是四类空气牌中最差的诈唬候选，频率最低。"], "note": ""}, {"id": "DGL#10-s5", "ep": "10", "type": "topic", "topic": "按钮位对盲注位三条街诈唬空气牌的策略频率", "en": "PFR SRP IP Triple Barreling Air", "q": "常见错误与决策原则", "clues": ["30%", "70%"], "a": ["不要对所有空气牌一视同仁：垃圾牌和未中顺子听牌的诈唬频率应显著高于未中同花听牌，盲目统一频率会损失EV。", "不要忽视阻挡牌效应：高张和低张的未中同花听牌因阻挡牌优势，诈唬频率可适当提高，但中间高张应更保守。", "不要过度诈唬未中同花听牌：30%的诈唬频率意味着70%的时间应过牌放弃，因为对手跟注范围中同花组合较多。", "实战中若时间紧迫，直接采用40-60全局比例即可，误差可控且易于执行。"], "note": ""}, {"id": "DGL#10-c1", "ep": "10", "type": "cloze", "topic": "按钮位对盲注位三条街诈唬空气牌的策略频率", "en": "PFR SRP IP Triple Barreling Air", "q": "所有空气牌在河牌圈面对对手过牌时，继续下注（bet）的频率为＿＿。", "clues": [], "a": ["求解器数据显示，在上述牌局中，所有空气牌在河牌圈面对对手过牌时，继续下注（bet）的频率为43%。"], "note": "43%"}, {"id": "DGL#10-c2", "ep": "10", "type": "cloze", "topic": "按钮位对盲注位三条街诈唬空气牌的策略频率", "en": "PFR SRP IP Triple Barreling Air", "q": "垃圾牌（Mr. Trash）：河牌圈继续诈唬的频率为＿＿，", "clues": [], "a": ["垃圾牌（Mr. Trash）：河牌圈继续诈唬的频率为50%，呈现50-50的均分（下注/过牌各半）。这类牌完全没有摊牌价值，且阻挡牌效应较弱，适合高频诈唬。"], "note": "50%"}, {"id": "DGL#10-c3", "ep": "10", "type": "cloze", "topic": "按钮位对盲注位三条街诈唬空气牌的策略频率", "en": "PFR SRP IP Triple Barreling Air", "q": "所有空气牌在河牌圈统一采用40-60的诈唬/过牌比例（即＿＿下注，", "clues": [], "a": ["讲师建议，如果不做精细分类，所有空气牌在河牌圈统一采用40-60的诈唬/过牌比例（即40%下注，60%过牌），这是一个非常实用的全局启发式。"], "note": "40%"}, {"id": "DGL#10-note", "ep": "10", "type": "note", "topic": "按钮位对盲注位三条街诈唬空气牌的策略频率", "en": "PFR SRP IP Triple Barreling Air", "q": "避坑提醒与行动项", "clues": ["DGL", "40%", "60%"], "a": ["本视频是DGL系列第10期，承接了前几期关于翻牌圈和转牌圈持续下注频率的内容，将分析延伸至河牌圈的三条街诈唬。讲师通过求解器数据，将空气牌分类并给出频率启发式，为玩家提供了从“凭感觉诈唬”到“基于频率决策”的升级路径。未来视频预计会深入探讨未中同花听牌内部的具体牌张差异（如阻挡牌效应和同花/非同花区别），以及如何将这些频率应用于剥削性策略。", "行动项清单：", "- 河牌圈面对对手过牌时，所有空气牌默认采用40%下注、60%过牌的全局比例。", "- 若想更精细，垃圾牌采用50-50，未中顺子听牌和未中高张采用60-40，未中同花听牌采用25-75或30-70。", "- 未中同花听牌中，优先选择高牌或低牌（有阻挡牌）诈唬，避免用两张中间高牌诈唬。", "- 不要对未中同花听牌过度诈唬，70%的时间应过牌放弃。"], "note": ""}, {"id": "DGL#11-intro", "ep": "11", "type": "intro", "topic": "DGL#11 - 双重持续下注：非A高听牌", "en": "Double Double Barreling - Non Ace High Draws", "q": "DGL#11 - 双重持续下注：非A高听牌", "clues": ["bet", "double barrel", "non ace high"], "a": ["本视频聚焦于三人底池（3-bet底池）中，翻牌圈持续下注（c-bet）被跟注后，转牌圈进行双重持续下注（double barrel）时，非A高听牌（non ace high draws）的频率启发式策略。讲师通过筛选特定手牌类别（卡顺、两头顺、同花听牌、组合听牌、两高张），展示GTO求解器给出的最优下注频率，并据此提出简化的“分桶”执行方案。", "核心观点是：不同听牌类别在转牌圈的下注频率差异显著，同花听牌与两头顺听牌下注频率最高（约86%），组合听牌次之（约73%），卡顺听牌较低（约66%），两高张最低（约40%）。讲师建议将这些频率归入80%、60%、40%三个“桶”中，便于实战记忆与执行，同时解释了频率差异背后的原因——手牌在范围中的占比（组合数）影响了下注频率的设定。", "视频内容框架清晰：先展示求解器数据，再逐类分析各听牌类别的具体频率与牌例，最后给出分桶建议。整体属于“频率启发式”教学，强调用简化规则替代复杂GTO计算，适合有一定基础的玩家学习转牌圈听牌策略。"], "note": ""}, {"id": "DGL#11-s0", "ep": "11", "type": "topic", "topic": "DGL#11 - 双重持续下注：非A高听牌", "en": "Double Double Barreling - Non Ace High Draws", "q": "视频背景与筛选条件", "clues": ["BTN", "small bet", "gut shots", "open enders"], "a": ["本视频研究场景为：3-bet底池中，小盲位（SB）玩家对按钮位（BTN）玩家进行小尺度3-bet，被跟注后翻牌圈下注小注（small bet），对手跟注，进入转牌圈。", "筛选的手牌类别包括：卡顺（gut shots）、两头顺（open enders）、同花听牌（flush draws）、组合听牌（combo draws），并额外包含两高张（two overs），因为这些均属于听牌型手牌。", "数据来源为GTO求解器（Hand2Note），通过“Turn Hand”标签查看具体手牌类别的建议玩法，通过“Next Actions”标签查看精确下注频率。"], "note": ""}, {"id": "DGL#11-s1", "ep": "11", "type": "topic", "topic": "DGL#11 - 双重持续下注：非A高听牌", "en": "Double Double Barreling - Non Ace High Draws", "q": "同花听牌与两头顺听牌：最高下注频率", "clues": ["non ace high", "flush draws", "straight draws", "86.14%"], "a": ["非A高同花听牌（non ace high flush draws）的下注频率为86.14%，非A高两头顺听牌（non ace high straight draws）为87.13%，两者非常接近。", "讲师建议将这两类手牌归入“80%桶”（80%下注，20%过牌），即转牌圈约八成时间下注，两成时间过牌。", "这两类听牌是转牌圈最激进的听牌类型，因为其成牌潜力高且权益实现能力强，下注既能获取价值也能保护权益。"], "note": ""}, {"id": "DGL#11-s2", "ep": "11", "type": "topic", "topic": "DGL#11 - 双重持续下注：非A高听牌", "en": "Double Double Barreling - Non Ace High Draws", "q": "组合听牌：略低频率但同桶处理", "clues": ["combo draws", "check-raise", "73%", "80%"], "a": ["组合听牌（combo draws，如同花+两头顺）的下注频率为73%，明显低于同花听牌和两头顺听牌。", "频率较低的原因在于组合听牌更倾向于过牌加注（check-raise），而非单纯下注，因为其权益更强，适合构建更大的底池。", "尽管频率为73%，但按照分桶系统，最接近的桶是“80%桶”，因此讲师建议将组合听牌与同花听牌、两头顺听牌放入同一个80%桶中，简化执行。"], "note": ""}, {"id": "DGL#11-s3", "ep": "11", "type": "topic", "topic": "DGL#11 - 双重持续下注：非A高听牌", "en": "Double Double Barreling - Non Ace High Draws", "q": "卡顺听牌：频率显著降低", "clues": ["gut shots", "66.34%", "66%", "60%"], "a": ["卡顺听牌（gut shots）的下注频率为66.34%，即约66%下注、34%过牌，归入“60%桶”（60%下注，40%过牌）。", "频率降低的根本原因是卡顺在范围中的组合数远多于其他听牌类型，从手牌样本可见，卡顺出现的频率远高于同花听牌、两头顺或组合听牌，因此必须降低下注频率以保持范围平衡。", "具体牌例：KQ在A-J-5翻牌面，转牌圈有时过牌；K♣9♣在T-T-6翻牌面，转牌来Q时有时过牌；K♥9♥在Q-J-6彩虹面，转牌为空白牌时也偶尔过牌。"], "note": ""}, {"id": "DGL#11-s4", "ep": "11", "type": "topic", "topic": "DGL#11 - 双重持续下注：非A高听牌", "en": "Double Double Barreling - Non Ace High Draws", "q": "两高张：最被动处理", "clues": ["two overs", "40%", "60%"], "a": ["两高张（two overs，排除A高）的下注频率仅为40%，归入“40%桶”（40%下注，60%过牌）。", "这类手牌通常是K高或Q高，出现在低牌面或对子牌面上，例如T8在K-5-5牌面（K为对子）被视为两高张，因为两张牌均高于中间对子5。", "两高张的权益较弱，成牌潜力有限，因此采取更被动的策略，多数时候过牌控池，仅在特定情况下下注诈唬或半诈唬。"], "note": ""}, {"id": "DGL#11-s5", "ep": "11", "type": "topic", "topic": "DGL#11 - 双重持续下注：非A高听牌", "en": "Double Double Barreling - Non Ace High Draws", "q": "分桶系统总结", "clues": ["GTO", "80%", "20%", "60%"], "a": ["组合听牌、两头顺听牌、同花听牌：统一归入80%桶（80%下注，20%过牌）。", "卡顺听牌：归入60%桶（60%下注，40%过牌）。", "两高张（非A高）：归入40%桶（40%下注，60%过牌）。", "分桶系统的意义在于将复杂频率简化为三个档位，便于实战中快速决策，同时保持与GTO策略的近似一致性。"], "note": ""}, {"id": "DGL#11-c1", "ep": "11", "type": "cloze", "topic": "DGL#11 - 双重持续下注：非A高听牌", "en": "Double Double Barreling - Non Ace High Draws", "q": "非A高同花听牌（non ace high flush draws）的下注频率为＿＿，", "clues": [], "a": ["非A高同花听牌（non ace high flush draws）的下注频率为86.14%，非A高两头顺听牌（non ace high straight draws）为87.13%，两者非常接近。"], "note": "86.14%"}, {"id": "DGL#11-c2", "ep": "11", "type": "cloze", "topic": "DGL#11 - 双重持续下注：非A高听牌", "en": "Double Double Barreling - Non Ace High Draws", "q": "如同花+两头顺）的下注频率为＿＿，明显低于同花听牌和两头顺听牌。", "clues": [], "a": ["组合听牌（combo draws，如同花+两头顺）的下注频率为73%，明显低于同花听牌和两头顺听牌。"], "note": "73%"}, {"id": "DGL#11-c3", "ep": "11", "type": "cloze", "topic": "DGL#11 - 双重持续下注：非A高听牌", "en": "Double Double Barreling - Non Ace High Draws", "q": "卡顺听牌（gut shots）的下注频率为＿＿，", "clues": [], "a": ["卡顺听牌（gut shots）的下注频率为66.34%，即约66%下注、34%过牌，归入“60%桶”（60%下注，40%过牌）。"], "note": "66.34%"}, {"id": "DGL#11-note", "ep": "11", "type": "note", "topic": "DGL#11 - 双重持续下注：非A高听牌", "en": "Double Double Barreling - Non Ace High Draws", "q": "避坑提醒与行动项", "clues": ["DGL", "check-raise", "80%"], "a": ["本视频属于“DGL”系列（Double Barreling Line）的第11集，聚焦于非A高听牌在转牌圈的双重持续下注策略。系列中其他视频可能涵盖A高听牌、价值下注、诈唬等不同主题，本集为听牌类手牌提供了清晰的分桶框架，可直接应用于实战。建议进一步学习同系列中关于A高听牌的处理方式，以及转牌圈过牌加注（check-raise）策略的细节，以完善整体转牌圈打法。", "**行动项与常见错误：**", "- 应该这样做：将同花听牌、两头顺听牌、组合听牌统一按80%频率下注；卡顺按60%频率下注；两高张按40%频率下注。", "- 不要这样做：不要对所有听牌类型使用相同的下注频率，尤其不要对卡顺和两高张过度下注，否则会导致范围失衡。", "- 不要这样做：不要忽视组合数对频率的影响——卡顺组合数多，必须降低下注频率以保持平衡。"], "note": ""}, {"id": "DGL#12-intro", "ep": "12", "type": "intro", "topic": "DGL#12 - 翻前3-bet底池中，有利位置面对过牌时，在低牌面用纯空气牌进行下注的策略", "en": "PFC 3BP IP Stabbing Complete Air on Low Boards", "q": "DGL#12 - 翻前3-bet底池中，有利位置面对过牌时，在低牌面用纯空气牌进行下注的策略", "clues": ["BTN", "bet", "low boards"], "a": ["本视频聚焦于一个非常具体但高频的场景：我们在按钮位（BTN）开局加注，小盲位（SB）对我们进行3-bet（再加注），我们跟注后，翻牌圈小盲位过牌给我们。此时，我们手持的是在低牌面（low boards）上没有任何成牌潜力的“纯空气牌”（complete air），例如无高张、无后门听牌的垃圾牌。视频的核心目标是解决大多数常规玩家（regulars）在这个场景下的一个普遍困惑——他们不清楚自己应该以多高的频率用这类牌下注。", "讲师通过数据筛选，展示了在低牌面上，面对对手过牌时，我们手持各类“纯空气牌”（如无高张无后门、一张高张无后门、两张高张无后门、A高牌等）的平均下注频率应为60%。这个数据颠覆了很多人“纯空气牌就应该过牌”的直觉，强调了在翻前3-bet底池中，作为翻前加注者，我们拥有显著的范围优势，因此必须积极利用这一优势进行持续下注（c-bet）。", "为了简化决策过程，讲师提出了一个非常实用的“分桶”（bucketing）系统，即把下注频率划分为20%、40%、60%、80%等几个档位。他建议将所有类型的纯空气牌统一归入“60%下注频率”的桶中，而不是去记忆每个具体手牌组合的细微频率差异。同时，视频明确指出，在这种场景下，我们几乎总是应该使用小尺寸下注（small size），即约1/3底池的尺度。"], "note": ""}, {"id": "DGL#12-s0", "ep": "12", "type": "topic", "topic": "DGL#12 - 翻前3-bet底池中，有利位置面对过牌时，在低牌面用纯空气牌进行下注的策略", "en": "PFC 3BP IP Stabbing Complete Air on Low Boards", "q": "场景定义与手牌类型", "clues": ["BTN", "bet", "No overcard with", "no backdoor"], "a": ["视频讨论的具体场景是：我们在BTN位（庄位）开局加注，SB位（小盲）对我们进行3-bet（再加注），我们选择跟注。翻牌圈发出低牌面，SB位过牌给我们。", "我们手持的“纯空气牌”被分为几类：无高张且无后门听牌（No overcard with no backdoor）、一张高张且无后门听牌（One overcard with no backdoor）、两张高张且无后门听牌（Two overs with no backdoor），以及A高牌（Ace high）。", "具体牌例包括：Q♣9♣在T♠4♠2♦牌面（无高张无后门）；9♥7♥在8♦4♣3♠牌面（无高张无后门）；K♥9♥在T♠7♦5♣牌面（无高张无后门）；K♦Q♣在8♦4♣3♠牌面（两张高张无后门）；J♣T♣在7♦6♠5♥牌面（两张高张无后门）；K♥T♥在7♦6♣4♠牌面（两张高张无后门）。"], "note": ""}, {"id": "DGL#12-s1", "ep": "12", "type": "topic", "topic": "DGL#12 - 翻前3-bet底池中，有利位置面对过牌时，在低牌面用纯空气牌进行下注的策略", "en": "PFC 3BP IP Stabbing Complete Air on Low Boards", "q": "核心数据：60%下注频率", "clues": ["60%"], "a": ["通过数据筛选，讲师发现，在上述低牌面场景中，手持这些纯空气牌时，平均下注频率应为60%。", "具体到各个手牌类别，频率略有差异：两张高张无后门为60/40（下注/过牌），A高牌为64/36，一张高张无后门为68/32，无高张无后门为70/30。", "讲师强调，这些数据表明，即使手持的是“垃圾牌”，我们也应该在大多数时候主动下注，而不是被动过牌。"], "note": ""}, {"id": "DGL#12-s2", "ep": "12", "type": "topic", "topic": "DGL#12 - 翻前3-bet底池中，有利位置面对过牌时，在低牌面用纯空气牌进行下注的策略", "en": "PFC 3BP IP Stabbing Complete Air on Low Boards", "q": "简化策略：分桶系统", "clues": ["bucketing system", "20%", "40%", "60%"], "a": ["讲师推荐使用“分桶系统”（bucketing system）来简化决策，即把下注频率归入20%、40%、60%、80%等几个固定档位。", "他建议将所有类型的纯空气牌统一放入“60%下注频率”的桶中，而不是去记忆每个具体组合的精确频率（如70%或64%）。", "这样做的理由是，60%与70%之间的差异在实际游戏中影响极小，而统一使用60%可以大幅降低决策复杂度，提高执行效率。"], "note": ""}, {"id": "DGL#12-s3", "ep": "12", "type": "topic", "topic": "DGL#12 - 翻前3-bet底池中，有利位置面对过牌时，在低牌面用纯空气牌进行下注的策略", "en": "PFC 3BP IP Stabbing Complete Air on Low Boards", "q": "下注尺度：小尺寸", "clues": ["small size", "pot", "60%"], "a": ["在这种场景下，讲师明确指出，我们几乎总是应该使用小尺寸下注（small size），即约1/3底池（1/3 pot）的尺度。", "视频中展示了翻牌圈的下注尺度分布，确认了在绝大多数情况下，小尺寸下注是唯一选择。", "因此，最终的行动准则可以概括为：在低牌面、面对过牌时，用纯空气牌以60%的频率进行1/3底池的小尺寸下注。"], "note": ""}, {"id": "DGL#12-c1", "ep": "12", "type": "cloze", "topic": "DGL#12 - 翻前3-bet底池中，有利位置面对过牌时，在低牌面用纯空气牌进行下注的策略", "en": "PFC 3BP IP Stabbing Complete Air on Low Boards", "q": "手持这些纯空气牌时，平均下注频率应为＿＿。", "clues": [], "a": ["通过数据筛选，讲师发现，在上述低牌面场景中，手持这些纯空气牌时，平均下注频率应为60%。"], "note": "60%"}, {"id": "DGL#12-c2", "ep": "12", "type": "cloze", "topic": "DGL#12 - 翻前3-bet底池中，有利位置面对过牌时，在低牌面用纯空气牌进行下注的策略", "en": "PFC 3BP IP Stabbing Complete Air on Low Boards", "q": "即把下注频率归入＿＿、40%、60%、80%等几个固定档位。", "clues": [], "a": ["讲师推荐使用“分桶系统”（bucketing system）来简化决策，即把下注频率归入20%、40%、60%、80%等几个固定档位。"], "note": "20%"}, {"id": "DGL#12-c3", "ep": "12", "type": "cloze", "topic": "DGL#12 - 翻前3-bet底池中，有利位置面对过牌时，在低牌面用纯空气牌进行下注的策略", "en": "PFC 3BP IP Stabbing Complete Air on Low Boards", "q": "用纯空气牌以＿＿的频率进行1/3底池的小尺寸下注。", "clues": [], "a": ["因此，最终的行动准则可以概括为：在低牌面、面对过牌时，用纯空气牌以60%的频率进行1/3底池的小尺寸下注。"], "note": "60%"}, {"id": "DGL#12-note", "ep": "12", "type": "note", "topic": "DGL#12 - 翻前3-bet底池中，有利位置面对过牌时，在低牌面用纯空气牌进行下注的策略", "en": "PFC 3BP IP Stabbing Complete Air on Low Boards", "q": "避坑提醒与行动项", "clues": ["DGL", "Deep Game Logic", "bet"], "a": ["本视频是DGL系列（Deep Game Logic）第12期，专注于翻前3-bet底池（3BP）中，有利位置（IP）玩家在低牌面上的策略。它承接了系列中关于翻前范围构建和翻后下注频率的基础理论，并将其应用到“纯空气牌”这一具体且容易被忽视的手牌类别上。视频的核心价值在于提供了一个极其清晰、可执行的频率基准（60%下注、1/3底池），帮助玩家克服在低牌面上“不敢用垃圾牌下注”的心理障碍。", "值得进一步学习的方向包括：如何根据对手的3-bet频率和翻后倾向调整这一基准频率；在转牌和河牌圈，当我们的纯空气牌继续毫无改进时，应如何继续游戏；以及如何将“分桶系统”应用到其他类型的手牌和牌面结构上。", "**行动项与常见错误：**", "- 应该这样做：在低牌面、翻前3-bet底池中，手持纯空气牌时，以60%的频率进行小尺寸（1/3底池）下注。", "- 应该这样做：将所有类型的纯空气牌（无高张、一张高张、两张高张、A高）统一归入60%下注频率的“桶”中，简化决策。", "- 不要这样做：不要因为手持“垃圾牌”就倾向于过牌，从而放弃我们在翻前3-bet底池中作为加注者的范围优势。", "- 不要这样做：不要试图记忆每个具体手牌组合的精确下注频率（如70% vs 64%），而应使用分桶系统来降低复杂度。"], "note": ""}, {"id": "DGL#13-intro", "ep": "13", "type": "intro", "topic": "DGL#13 - 河牌圈玩法：利用三条（Trips）在河牌圈诈唬加注", "en": "River Play Using Trips to Bluf
