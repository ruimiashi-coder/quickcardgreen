逼迫对手弃掉所有空气牌，从而“买下底池”并避免被诈唬。由于对手缺乏抓诈牌，你无法用大注获取价值；由于你本身缺乏诈唬牌，也无法平衡大注中的价值牌。微小下注同时迫使对手为了防守而用部分空气牌加注，这反过来让你的坚果牌获得额外价值。"], "note": "10%"}, {"id": "DGL#100-c2", "ep": "100", "type": "cloze", "topic": "DGL#100 - 翻前单次加注底池、不利位置：河牌圈开发10%底池下注策略", "en": "PFC SRP OOP Developing 10% Pot Bets on the River", "q": "对手范围包含大量空气、少量抓诈牌、极少量坚果牌。这种分布匹配是＿＿底池下注策略的充分必要条件。", "clues": [], "a": ["匹配条件：你的范围包含大量中等强度牌型、一定数量的坚果牌、极少空气；对手范围包含大量空气、少量抓诈牌、极少量坚果牌。这种分布匹配是10%底池下注策略的充分必要条件。"], "note": "10%"}, {"id": "DGL#100-note", "ep": "100", "type": "note", "topic": "DGL#100 - 翻前单次加注底池、不利位置：河牌圈开发10%底池下注策略", "en": "PFC SRP OOP Developing 10% Pot Bets on the River", "q": "避坑提醒与行动项", "clues": ["DGL", "SRP", "OOP"], "a": ["本视频为DGL系列第100期，聚焦翻前单次加注底池（SRP）中不利位置（OOP）的河牌圈策略，是“10%底池下注”这一微观策略的系统性讲解。视频承接了GTO蓝图课程中关于AKQ玩具游戏的理论框架，并将其落地到具体牌面与实战场景中。建议进一步学习权益分布图（equity distribution graph）的绘制与解读方法，以及在不同底池类型（3-bet底池、4-bet底池）中识别类似的分布匹配。", "**行动项与常见错误：**", "- 应当：当你的范围以中等牌力为主、空气极少、坚果有限，且对手范围空气占比极高时，积极使用10%底池下注。", "- 应当：在翻牌小注被加注后转牌过牌、或跟注两条街后顶牌成对的场景中，主动寻找10%下注机会。", "- 不应：在对手范围中有大量可跟注强牌时使用10%下注——此时应选择更大尺度获取价值。", "- 不应：在自身范围包含大量空气时使用10%下注——此时缺乏足够的价值牌来平衡该尺度。", "- 不应：因为10%下注“看起来太小”而放弃使用——其价值在于逼迫对手空气牌弃牌或加注，而非直接获取薄价值。"], "note": ""}, {"id": "DGL#101-intro", "ep": "101", "type": "intro", "topic": "DGL#101 - 翻牌圈过牌加注后遭遇翻牌3-bet（不利位置跟注者）的启发式策略", "en": "PFC SRP OOP Heuristics Facing Flop 3Bets", "q": "DGL#101 - 翻牌圈过牌加注后遭遇翻牌3-bet（不利位置跟注者）的启发式策略", "clues": ["OOP", "check-raise", "bet"], "a": ["本视频聚焦于一个极少被讨论但实战中令人不适的场景：你在翻牌圈作为不利位置（OOP）的跟注者过牌加注（check-raise）后，对手在翻牌圈对你进行3-bet。讲师以自己最近打的一手牌为引子，系统性地分析了在此类局面下，你的整体范围应该如何继续游戏，并给出了基于GTO解算器数据的频率参考与启发式决策规则。", "视频首先通过解算器数据给出了面对翻牌3-bet时的整体继续频率：弃牌31%、跟注61%、4-bet仅8.7%。随后，讲师按手牌类别逐一拆解了不同牌型的应对策略，包括听牌（draws）、垃圾牌（trash）、卡顺（gut shots）、低对（low pairs）以及成牌（nutted hands），并重点强调了“被动继续”是这一局面的核心策略基调。最后，讲师结合自己实战的牌例说明了下注尺度（SPR）如何影响具体决策。"], "note": ""}, {"id": "DGL#101-s0", "ep": "101", "type": "topic", "topic": "DGL#101 - 翻牌圈过牌加注后遭遇翻牌3-bet（不利位置跟注者）的启发式策略", "en": "PFC SRP OOP Heuristics Facing Flop 3Bets", "q": "整体继续频率与策略基调", "clues": ["bet", "31%", "61%", "8.7%"], "a": ["当你过牌加注翻牌后遭遇对手3-bet，解算器给出的平均继续频率为：弃牌31%、跟注61%、4-bet仅8.7%。", "核心结论：面对翻牌3-bet时，你不应过于激进地反击，整体策略应保持相对被动。这与你面对持续下注（c-bet）时的策略形成对比——面对c-bet时你可以平均过牌加注14-15%的频率，弃牌35%左右。", "讲师强调，这一被动基调的底层逻辑是：对手的3-bet频率本身很低，且其范围极化，你的过牌加注范围中大量牌型在遭遇3-bet后权益大幅缩水，因此被动跟注成为最优解。"], "note": ""}, {"id": "DGL#101-s1", "ep": "101", "type": "topic", "topic": "DGL#101 - 翻牌圈过牌加注后遭遇翻牌3-bet（不利位置跟注者）的启发式策略", "en": "PFC SRP OOP Heuristics Facing Flop 3Bets", "q": "听牌（Draws）的应对策略", "clues": ["bet 12", "SPR", "fast play", "15%"], "a": ["听牌（包括顺子听牌、同花听牌和组合听牌）是你过牌加注范围中数量最多的手牌类别，也是4-bet频率最高的类别。", "面对翻牌3-bet，听牌的平均策略为：弃牌15%、跟注73%、4-bet 12%。", "尽管听牌是4-bet最多的类别，但整体上仍以跟注为主，说明即便在激进场景中，被动继续仍是主流选择。", "具体频率会随下注尺度变化：若对手下注大、你加注大、对手3-bet大，则SPR极低，你应快速游戏（fast play）听牌和坚果；若下注尺度小，SPR较高，你应更宽地跟注，减少诈唬。"], "note": ""}, {"id": "DGL#101-s2", "ep": "101", "type": "topic", "topic": "DGL#101 - 翻牌圈过牌加注后遭遇翻牌3-bet（不利位置跟注者）的启发式策略", "en": "PFC SRP OOP Heuristics Facing Flop 3Bets", "q": "垃圾牌（Trash）与剥削漏洞", "clues": ["bet", "blockers", "auto-fold", "93%"], "a": ["垃圾牌（主要是后门同花听牌类）是你过牌加注范围中数量第二多的类别，也是弃牌频率最高的类别——面对3-bet时弃牌率高达93%。", "这些垃圾牌是你31%弃牌频率的主要来源，它们通常因阻挡牌（blockers）和后门权益而被用于过牌加注，但面对3-bet时属于自动弃牌（auto-fold）。", "重要警告：如果你过度频繁地用这些后门牌过牌加注，你会变得极易被对手的3-bet剥削，因为你将过牌加注后弃牌过多，白白送给对手筹码。"], "note": ""}, {"id": "DGL#101-s3", "ep": "101", "type": "topic", "topic": "DGL#101 - 翻牌圈过牌加注后遭遇翻牌3-bet（不利位置跟注者）的启发式策略", "en": "PFC SRP OOP Heuristics Facing Flop 3Bets", "q": "卡顺（Gut Shots）的意外跟注频率", "clues": ["bet", "J9o", "67%", "30%"], "a": ["卡顺是你过牌加注范围中数量第三多的手牌类别，面对3-bet时你应当跟注约三分之二的时间（约67%跟注、30%弃牌）。", "讲师表示这一数字出乎意料，但解算器显示在对手使用较小3-bet尺度时，卡顺仍属于继续范围。", "具体牌例：手持J9o（非同花J9），翻牌面彩虹结构，对手在按钮位3-bet到较小尺度，你应当继续跟注。"], "note": ""}, {"id": "DGL#101-s4", "ep": "101", "type": "topic", "topic": "DGL#101 - 翻牌圈过牌加注后遭遇翻牌3-bet（不利位置跟注者）的启发式策略", "en": "PFC SRP OOP Heuristics Facing Flop 3Bets", "q": "低对（Low Pairs）的继续策略", "clues": ["bet", "indifferent", "J3s", "T63"], "a": ["低对在过牌加注策略中非常有效，因为它们能获得保护、迫使高张弃牌，有时还能被更差的对子跟注，同时也是多街下注（multi-street barrel）的好牌。", "面对3-bet时，低对也属于继续范围，且与卡顺类似，在对手使用较小3-bet尺度时处于“无差别”（indifferent）状态——跟注约三分之二、弃牌约30%。", "具体牌例：手持J3s（同花J3），翻牌面T63，对手下注2/3底池，你过牌加注小尺度，对手3-bet小尺度，你应当继续跟注。"], "note": ""}, {"id": "DGL#101-s5", "ep": "101", "type": "topic", "topic": "DGL#101 - 翻牌圈过牌加注后遭遇翻牌3-bet（不利位置跟注者）的启发式策略", "en": "PFC SRP OOP Heuristics Facing Flop 3Bets", "q": "成牌（Nutted Hands）的被动慢打", "clues": ["bet", "SPR", "0%", "22%"], "a": ["成牌区域（暗三条、两对）面对3-bet时弃牌率为0%，但解算器显示你应当相对被动地游戏它们：暗三条仅22%的频率4-bet，两对几乎不4-bet。", "原因在于对手使用较小3-bet尺度时SPR仍然较高，你的跟注范围中包含大量卡顺和低对，因此无法过于激进地游戏强牌。", "这一被动策略能创造有趣的动态：对手可能误以为你范围内没有强牌，从而在后续街犯下错误。"], "note": ""}, {"id": "DGL#101-s6", "ep": "101", "type": "topic", "topic": "DGL#101 - 翻牌圈过牌加注后遭遇翻牌3-bet（不利位置跟注者）的启发式策略", "en": "PFC SRP OOP Heuristics Facing Flop 3Bets", "q": "实战牌例与尺度影响", "clues": ["BTN", "bet", "SPR"], "a": ["讲师实战牌例：BB位对BTN位，翻牌面872，对手下注大尺度，讲师手持96♥（同花96）过牌加注到17个大盲，对手3-bet到36个大盲以上。", "在此类大尺度下注场景中，SPR已经很低，因此你可以更频繁地快速游戏强牌，但解算器仍显示约一半时间你会慢打两对+（如87和口袋对2），而77和88则可以选择全下。", "关键结论：下注尺度（SPR）是决定你策略激进程度的核心变量——SPR越低，越应快速游戏坚果和听牌；SPR越高，越应慢打坚果并减少诈唬。"], "note": ""}, {"id": "DGL#101-c0", "ep": "101", "type": "cloze", "topic": "DGL#101 - 翻牌圈过牌加注后遭遇翻牌3-bet（不利位置跟注者）的启发式策略", "en": "PFC SRP OOP Heuristics Facing Flop 3Bets", "q": "解算器给出的平均继续频率为：弃牌＿＿、跟注61%、4-bet仅8.7%。", "clues": [], "a": ["当你过牌加注翻牌后遭遇对手3-bet，解算器给出的平均继续频率为：弃牌31%、跟注61%、4-bet仅8.7%。"], "note": "31%"}, {"id": "DGL#101-c1", "ep": "101", "type": "cloze", "topic": "DGL#101 - 翻牌圈过牌加注后遭遇翻牌3-bet（不利位置跟注者）的启发式策略", "en": "PFC SRP OOP Heuristics Facing Flop 3Bets", "q": "听牌的平均策略为：弃牌＿＿、跟注73%、4-bet 12%。", "clues": [], "a": ["面对翻牌3-bet，听牌的平均策略为：弃牌15%、跟注73%、4-bet 12%。"], "note": "15%"}, {"id": "DGL#101-c2", "ep": "101", "type": "cloze", "topic": "DGL#101 - 翻牌圈过牌加注后遭遇翻牌3-bet（不利位置跟注者）的启发式策略", "en": "PFC SRP OOP Heuristics Facing Flop 3Bets", "q": "也是弃牌频率最高的类别——面对3-bet时弃牌率高达＿＿。", "clues": [], "a": ["垃圾牌（主要是后门同花听牌类）是你过牌加注范围中数量第二多的类别，也是弃牌频率最高的类别——面对3-bet时弃牌率高达93%。"], "note": "93%"}, {"id": "DGL#101-note", "ep": "101", "type": "note", "topic": "DGL#101 - 翻牌圈过牌加注后遭遇翻牌3-bet（不利位置跟注者）的启发式策略", "en": "PFC SRP OOP Heuristics Facing Flop 3Bets", "q": "避坑提醒与行动项", "clues": ["DGL", "bet", "SPR"], "a": ["本视频是DGL系列第101期，属于翻牌圈不利位置策略的进阶内容。讲师通过解算器数据与实战牌例结合的方式，为“过牌加注后遭遇3-bet”这一低频但高难度场景提供了可操作的启发式规则。建议观众结合前序视频中关于翻牌圈过牌加注频率、c-bet防守策略等内容进行学习，以形成完整的知识体系。", "值得进一步学习的方向包括：不同下注尺度组合下的具体频率调整、转牌与河牌圈的后续策略、以及如何针对特定对手的3-bet频率进行剥削性调整。", "**行动项与常见错误：**", "- 应当做：面对翻牌3-bet时，整体保持被动，以跟注为主（约61%），4-bet频率控制在10%以内。", "- 应当做：用卡顺和低对在对手小尺度3-bet时继续跟注约三分之二的时间。", "- 应当做：在SPR较低时（大尺度下注后），快速游戏坚果和强听牌；在SPR较高时，慢打强牌。", "- 不要做：过度频繁地用后门同花听牌类垃圾牌过牌加注，否则面对3-bet时弃牌过多，极易被剥削。", "- 不要做：面对3-bet时用暗三条或两对过于激进地4-bet——解算器显示即使在大尺度场景下，慢打一半左右的强牌仍是正确选择。"], "note": ""}, {"id": "DGL#102-intro", "ep": "102", "type": "intro", "topic": "DGL#102 - 多人底池中阻挡牌与诈唬的重要性", "en": "MULTIWAY The Importance of Blockers Bluffing", "q": "DGL#102 - 多人底池中阻挡牌与诈唬的重要性", "clues": ["blocker"], "a": ["本视频通过一个具体的多人底池实战牌例，深入讲解了在翻牌圈和转牌圈进行诈唬时，如何利用阻挡牌（blocker）来构建平衡的范围。讲师强调，在多人底池中，由于对手范围更宽且坚果组合更多，单纯依靠下注频率很难获得足够的弃牌率，必须提前规划自己的范围结构，确保在后续街有足够的诈唬组合来平衡价值下注范围。", "视频的核心观点是“提前思考”（playing ahead）：在翻牌圈做决定时，就要预见到转牌和河牌可能出现的牌面结构，并据此选择那些既具备权益（equity）又具备阻挡牌属性的手牌进入下注范围。讲师以A K非同花为例，展示了如何在翻牌圈用该手牌下注，在转牌圈击中顶对顶踢脚后继续诈唬，最终迫使对手弃掉更强的成手牌。", "视频还特别强调了在多人底池中，小盲位在特定翻牌面（如J-T-9两草花）拥有很高的领先下注频率，但实际玩家很少会这样做，因此作为翻前加注者需要调整自己的持续下注策略，避免在弃牌率有限的情况下盲目下注。"], "note": ""}, {"id": "DGL#102-s0", "ep": "102", "type": "topic", "topic": "DGL#102 - 多人底池中阻挡牌与诈唬的重要性", "en": "MULTIWAY The Importance of Blockers Bluffing", "q": "多人底池的翻牌圈范围思考", "clues": ["Ace King offsuit", "fish", "GTO Wizard", "way"], "a": ["牌例背景：讲师在劫位（HJ）用A K非同花（Ace King offsuit）开局加注，小盲位（SB）是一个鱼玩家（fish）跟注，大盲位（BB）也跟注，三人底池，有效筹码深度为280个大盲（BB）。", "翻牌面为J♠ T♠ 9♣（两张草花），这是一个对翻前加注者不利、对小盲位非常有利的牌面结构。", "使用GTO Wizard的多way功能查看软件解算结果，小盲位在这个牌面上应该以40%的频率进行2/3底池大小的领先下注（lead）。", "如果改为较小的下注尺寸，小盲位在这个牌面上大概率应该进行全范围领先下注（range lead），前提是其范围构建中包含这些口袋对子和A X同花组合。", "但现实中，无论是常规玩家还是鱼玩家，小盲位都很少会足够频繁地领先下注；鱼玩家偶尔会下注，但频率远不够，大盲位则几乎总是过牌。"], "note": ""}, {"id": "DGL#102-s1", "ep": "102", "type": "topic", "topic": "DGL#102 - 多人底池中阻挡牌与诈唬的重要性", "en": "MULTIWAY The Importance of Blockers Bluffing", "q": "翻牌圈持续下注策略调整", "clues": ["bet", "under bluffing"], "a": ["面对两个对手，且翻牌面击中了大盲位的范围（大盲位很少会挤压加注JJ、TT和KQ，因此会以大量对子+听牌组合击中此牌面），翻前加注者的弃牌率非常有限。", "因此，持续下注（c-bet）必须侧重于那些具备权益或相关属性（如阻挡牌）的手牌，以便在后续街继续游戏。", "A K（带A♣阻挡牌）正是必须纳入下注范围的手牌之一，原因在于：这个牌面后续很可能出现顺子完成牌或同花完成牌。", "如果不在翻牌圈下注这些手牌，到转牌或河牌时，范围中会有大量想要价值下注的同花组合，但缺乏诈唬组合来平衡，导致整体范围严重诈唬不足（under bluffing），对手会过度弃牌，无法被剥削。"], "note": ""}, {"id": "DGL#102-s2", "ep": "102", "type": "topic", "topic": "DGL#102 - 多人底池中阻挡牌与诈唬的重要性", "en": "MULTIWAY The Importance of Blockers Bluffing", "q": "转牌圈利用阻挡牌继续诈唬", "clues": ["nut flush"], "a": ["翻牌圈小盲位和大盲位都跟注，小盲位在跟注前思考了一段时间。转牌发出K♣，讲师认为大多数人会犯错误选择过牌。", "虽然击中了顶对顶踢脚，但很多人会因为有对子+听牌而选择过牌实现权益，因为这张牌明显连接了小盲位和大盲位的跟注范围，他们现在可能有同花或顺子。", "关键点：讲师手里有A♣阻挡牌，因此两个对手都不可能持有坚果同花（nut flush）。虽然Q♣ 9♣是坚果同花，但这只是一个组合，当自己持有A♣时，对手不可能有坚果同花。", "转牌圈需要价值下注的同花组合（包括A♣ X同花）来平衡范围，而A K正是用来诈唬的完美手牌——它阻挡了对手的坚果同花，同时自身又有摊牌价值。"], "note": ""}, {"id": "DGL#102-s3", "ep": "102", "type": "topic", "topic": "DGL#102 - 多人底池中阻挡牌与诈唬的重要性", "en": "MULTIWAY The Importance of Blockers Bluffing", "q": "河牌圈诈唬与范围极化", "clues": ["pocket nines"], "a": ["小盲位弃牌，大盲位正常时间跟注转牌，河牌发出空白牌，讲师继续下注诈唬，目标是让对手弃掉Q X组合、口袋对子9（pocket nines）以及一些较弱的同花。", "讲师的范围看起来极强：拥有所有A X同花组合（A♣ 2♣、A♣ 3♣、A♣ 4♣、A♣ 5♣、A♣ 6♣、A♣ 7♣、A♣ 8♣，甚至A♣ 9♣），还有Q♣ X同花组合。", "对手用Q X组合、较弱同花或口袋对子9面对这个下注会陷入极困难的决策，因为讲师的范围中几乎没有诈唬组合——如果不在翻牌圈就为范围构建做好准备的话。", "对手长时间思考后弃牌，讲师推断他弃掉的是Q或低同花，因为如果是跟注牌型，不需要思考这么久。最终讲师赢下了一个可观的底池。"], "note": ""}, {"id": "DGL#102-s4", "ep": "102", "type": "topic", "topic": "DGL#102 - 多人底池中阻挡牌与诈唬的重要性", "en": "MULTIWAY The Importance of Blockers Bluffing", "q": "提前规划范围的重要性", "clues": [], "a": ["这手牌展示了“提前思考”和“可视化自己范围”的重要性：在翻牌圈就预见到转牌和河牌的范围需求。", "通过提前规划，讲师知道自己会有大量想要获取价值的价值下注组合，如果诈唬不足，对手就能剥削自己，因此必须提前准备诈唬组合。", "将A K纳入翻牌圈下注范围，并最重要的是纳入转牌圈下注范围，从而在河牌圈能够从Q X、口袋对子9和低同花范围中获得弃牌。"], "note": ""}, {"id": "DGL#102-c0", "ep": "102", "type": "cloze", "topic": "DGL#102 - 多人底池中阻挡牌与诈唬的重要性", "en": "MULTIWAY The Importance of Blockers Bluffing", "q": "小盲位在这个牌面上应该以＿＿的频率进行2/3底池大小的领先下注（lead）。", "clues": [], "a": ["使用GTO Wizard的多way功能查看软件解算结果，小盲位在这个牌面上应该以40%的频率进行2/3底池大小的领先下注（lead）。"], "note": "40%"}, {"id": "DGL#102-note", "ep": "102", "type": "note", "topic": "DGL#102 - 多人底池中阻挡牌与诈唬的重要性", "en": "MULTIWAY The Importance of Blockers Bluffing", "q": "避坑提醒与行动项", "clues": ["DGL", "multiway", "GTO Wizard"], "a": ["本视频是DGL系列第102期，聚焦于多人底池（multiway）中的高级诈唬策略，特别是阻挡牌在范围构建中的核心作用。视频通过一个完整的实战牌例，将翻前范围选择、翻牌圈下注决策、转牌圈阻挡牌利用和河牌圈范围极化串联起来，展示了高水平玩家如何系统性地思考每一街的行动。", "值得进一步学习的方向包括：使用GTO Wizard等软件研究不同牌面结构下各位置的领先下注频率和范围构建，以及如何在多人底池中调整持续下注策略以应对更紧的对手范围。", "**行动项与常见错误：**", "- 应该做：在翻牌圈下注时，优先选择带阻挡牌（尤其是A♣）且具备后续权益的手牌，如A K。", "- 应该做：在转牌圈击中顶对顶踢脚且持有坚果同花阻挡牌时，继续下注而非过牌，以平衡价值范围。", "- 应该做：在河牌圈利用极化范围（大量坚果同花组合）对对手的中间强度成手牌施压。", "- 不要做：在多人底池中盲目持续下注，而不考虑对手范围的坚果组合和自身弃牌率。", "- 不要做：忽视翻牌圈的范围构建对后续街的影响，导致河牌圈诈唬不足。"], "note": ""}, {"id": "DGL#103-intro", "ep": "103", "type": "intro", "topic": "DGL#103 - 翻前加注者单次加注底池：翻牌圈顶对弱踢脚在河牌圈面对对手阻挡下注时的加注策略", "en": "PFR SRP IP Raising TPWK vs Block Bet OTR", "q": "DGL#103 - 翻前加注者单次加注底池：翻牌圈顶对弱踢脚在河牌圈面对对手阻挡下注时的加注策略", "clues": ["Q9o", "block bet", "regulars"], "a": ["本视频围绕一个具体牌例展开：玩家在CO位用Q9o（非同花Q9）开局加注，翻牌圈Q-T-4彩虹面，转牌方片2，河牌黑桃6。讲师强调，在河牌圈面对对手的阻挡下注（block bet）时，许多常规玩家（regulars）严重缺乏用顶对弱踢脚（TPWK）进行加注的频率，这是一个普遍存在的策略漏洞。", "讲师通过GTO数据分析展示了正确的加注频率基准：在单次加注底池、有位置的情况下，面对对手河牌圈的阻挡下注，顶对弱踢脚整体应加注约37%的时间，且应使用40%底池大小的加注尺度。同时，这一频率会随河牌牌面结构显著变化——在空白河牌面可高达70%，而在完成同花或顺子的牌面则降至21%左右，且应优先选择带有阻挡牌（blocker）的组合进行加注。", "视频的核心价值在于为玩家提供一个可操作的频率基准（baseline），帮助玩家避免在河牌圈过度弃牌或只跟注而不加注的错误，同时通过补充薄价值加注（thin value raise）来平衡整体范围，防止诈唬过度。"], "note": ""}, {"id": "DGL#103-s0", "ep": "103", "type": "topic", "topic": "DGL#103 - 翻前加注者单次加注底池：翻牌圈顶对弱踢脚在河牌圈面对对手阻挡下注时的加注策略", "en": "PFR SRP IP Raising TPWK vs Block Bet OTR", "q": "牌例背景与行动线", "clues": ["Q9o", "block bet"], "a": ["讲师在CO位（关位）用Q9o（非同花Q9）开局加注，属于偏松的开局，但基于当时牌桌构成（对手偏弱、弃牌率高）是正EV（期望值为正）的选择。", "翻牌圈Q-T-4彩虹面，讲师选择用整个范围持续下注（c-bet），理由是此牌面结构对自己极有利，无需过度关注平衡策略。", "转牌方片2，讲师手持Q9o属于该场景下最弱的顶对之一，理论上应高频过牌，讲师选择过牌，目的是在河牌圈利用位置优势剥削对手。", "河牌黑桃6，基本是空白牌，未完成任何明显听牌。对手（大盲位防守方）选择阻挡下注（block bet），讲师认为此时必须用顶对弱踢脚进行加注。"], "note": ""}, {"id": "DGL#103-s1", "ep": "103", "type": "topic", "topic": "DGL#103 - 翻前加注者单次加注底池：翻牌圈顶对弱踢脚在河牌圈面对对手阻挡下注时的加注策略", "en": "PFR SRP IP Raising TPWK vs Block Bet OTR", "q": "顶对弱踢脚面对阻挡下注的加注频率", "clues": ["GTO", "Hand2Note", "River Hand", "pot raise"], "a": ["通过GTO求解器数据（来自Hand2Note的River Hand标签页），在单次加注底池、翻牌圈被跟注、转牌圈过牌过牌、河牌圈对手阻挡下注的场景下，顶对弱踢脚不应弃牌。", "整体加注频率为37%，且加注尺度应使用40%底池大小的加注（即40% pot raise）。", "讲师强调，这是基准频率（baseline），实际频率需根据具体牌面结构和顶对弱踢脚的强度进行调整。"], "note": ""}, {"id": "DGL#103-s2", "ep": "103", "type": "topic", "topic": "DGL#103 - 翻前加注者单次加注底池：翻牌圈顶对弱踢脚在河牌圈面对对手阻挡下注时的加注策略", "en": "PFR SRP IP Raising TPWK vs Block Bet OTR", "q": "不同河牌牌面下的频率调整", "clues": ["high", "bluff raise", "thin value raise", "21%"], "a": ["河牌完成同花时（如三张同花牌面），顶对弱踢脚加注频率降至21%，且应优先选择带有同花阻挡牌（如A♦、K♦）的组合进行加注，以阻断对手的同花范围。", "河牌为空白牌且牌面为T-high或K-high时（如T-2-4-7-K），加注频率高达70%，此时顶对弱踢脚的价值显著提升。", "河牌完成顺子时（如J-9-8-7-6），仍应进行一定频率的加注，但更多是作为诈唬加注（bluff raise）而非价值加注。", "河牌出现A（高张）且为空白牌时，应积极用A3、A4等顶对弱踢脚组合进行薄价值加注（thin value raise），以获取更差牌型的跟注。"], "note": ""}, {"id": "DGL#103-s3", "ep": "103", "type": "topic", "topic": "DGL#103 - 翻前加注者单次加注底池：翻牌圈顶对弱踢脚在河牌圈面对对手阻挡下注时的加注策略", "en": "PFR SRP IP Raising TPWK vs Block Bet OTR", "q": "常见错误与误区", "clues": ["regulars", "MDA", "fast click call", "button"], "a": ["常规玩家（regulars）在MDA（人群数据分析）中显著低估了对阻挡下注的加注频率，即使是非常快速的跟注型玩家（fast click call button）也经常用本应加注的牌只选择跟注。", "玩家普遍缺乏对薄价值区域的加注意识，导致整体范围中价值加注不足，进而引发诈唬过度（overbluff）的问题。", "讲师指出，GTO策略的核心支柱之一是适当慢打（slow play）范围顶端的强牌，但大多数玩家未能正确执行，因此更需要通过补充薄价值加注来维持范围平衡。"], "note": ""}, {"id": "DGL#103-s4", "ep": "103", "type": "topic", "topic": "DGL#103 - 翻前加注者单次加注底池：翻牌圈顶对弱踢脚在河牌圈面对对手阻挡下注时的加注策略", "en": "PFR SRP IP Raising TPWK vs Block Bet OTR", "q": "数据工具与分析方法", "clues": ["Hand2Note", "River Hand", "GTO", "37%"], "a": ["使用Hand2Note软件的River Hand标签页，筛选特定手牌类别（如顶对弱踢脚）来查看GTO建议的加注频率。", "可通过进一步筛选河牌牌面结构（如同花面、空白面、高张面）来细化频率基准，从而获得更精准的决策指导。", "讲师强调，即使没有实时GTO求解器，掌握上述基准频率（37%整体、40%底池加注尺度）也能显著改善河牌圈的决策质量。"], "note": ""}, {"id": "DGL#103-c1", "ep": "103", "type": "cloze", "topic": "DGL#103 - 翻前加注者单次加注底池：翻牌圈顶对弱踢脚在河牌圈面对对手阻挡下注时的加注策略", "en": "PFR SRP IP Raising TPWK vs Block Bet OTR", "q": "整体加注频率为＿＿，且加注尺度应使用40%底池大小的加注（即40% pot raise）。", "clues": [], "a": ["整体加注频率为37%，且加注尺度应使用40%底池大小的加注（即40% pot raise）。"], "note": "37%"}, {"id": "DGL#103-c2", "ep": "103", "type": "cloze", "topic": "DGL#103 - 翻前加注者单次加注底池：翻牌圈顶对弱踢脚在河牌圈面对对手阻挡下注时的加注策略", "en": "PFR SRP IP Raising TPWK vs Block Bet OTR", "q": "顶对弱踢脚加注频率降至＿＿，且应优先选择带有同花阻挡牌（如A♦、K♦）的组合进行加注，", "clues": [], "a": ["河牌完成同花时（如三张同花牌面），顶对弱踢脚加注频率降至21%，且应优先选择带有同花阻挡牌（如A♦、K♦）的组合进行加注，以阻断对手的同花范围。"], "note": "21%"}, {"id": "DGL#103-c4", "ep": "103", "type": "cloze", "topic": "DGL#103 - 翻前加注者单次加注底池：翻牌圈顶对弱踢脚在河牌圈面对对手阻挡下注时的加注策略", "en": "PFR SRP IP Raising TPWK vs Block Bet OTR", "q": "掌握上述基准频率（＿＿整体、40%底池加注尺度）也能显著改善河牌圈的决策质量。", "clues": [], "a": ["讲师强调，即使没有实时GTO求解器，掌握上述基准频率（37%整体、40%底池加注尺度）也能显著改善河牌圈的决策质量。"], "note": "37%"}, {"id": "DGL#103-note", "ep": "103", "type": "note", "topic": "DGL#103 - 翻前加注者单次加注底池：翻牌圈顶对弱踢脚在河牌圈面对对手阻挡下注时的加注策略", "en": "PFR SRP IP Raising TPWK vs Block Bet OTR", "q": "避坑提醒与行动项", "clues": ["DGL", "Deep Game Logic", "PFR"], "a": ["本视频属于DGL系列（Deep Game Logic）第103期，聚焦于翻前加注者（PFR）在单次加注底池（SRP）中有位置（IP）时，面对河牌圈阻挡下注的应对策略。视频内容承接了系列中关于范围平衡、薄价值下注和阻挡牌应用的讨论，适合已掌握基础翻前范围和翻牌圈策略的玩家深入学习。", "值得进一步学习的方向包括：如何根据对手类型（如跟注站型、紧凶型）调整加注频率；如何在不同转牌圈行动线（如对手主动下注、过牌加注）下重新评估顶对弱踢脚的玩法；以及如何将本视频的河牌圈加注原则推广到其他牌力类别（如中对、底对）的决策中。", "**行动项与常见错误清单：**", "- 应该做：在单次加注底池、有位置、河牌圈面对对手阻挡下注时，用顶对弱踢脚至少加注37%的时间，加注尺度为40%底池。", "- 应该做：在空白河牌面（如T-high或K-high）时，将加注频率提升至70%左右，积极获取价值。", "- 应该做：在完成同花的河牌面，优先用带同花阻挡牌（如A♦、K♦）的顶对弱踢脚加注，频率约21%。", "- 应该做：在河牌出现A时，用A3、A4等组合进行薄价值加注，以平衡范围并防止诈唬过度。", "- 不要做：不要因为担心被更强牌跟注而放弃加注，顶对弱踢脚在阻挡下注场景中具有明确的价值加注空间。", "- 不要做：不要在所有牌面结构下都使用同一加注频率，必须根据河牌是否完成听牌、是否出现高张等因素动态调整。", "- 不要做：不要忽略慢打范围顶端强牌的重要性，否则会加剧薄价值区域加注不足的问题，导致范围失衡。"], "note": ""}, {"id": "DGL#104-intro", "ep": "104", "type": "intro", "topic": "DGL#104 - 翻前单次加注底池、不利位置：过牌加注-过牌加注（XR-XR）线路中的诈唬策略", "en": "PFC SRP OOP Bluffing in the XR-XR Line", "q": "DGL#104 - 翻前单次加注底池、不利位置：过牌加注-过牌加注（XR-XR）线路中的诈唬策略", "clues": ["check-raise", "stab"], "a": ["本视频聚焦于一个特定且高级的翻后场景：你在翻牌圈用空气牌（或听牌）做过牌加注（check-raise），转牌圈你选择过牌（这是你应该以一定频率去做的事），随后对手下注（stab），此时你该如何继续行动。视频的核心是给出这一复杂线路下的范围构建与频率基准，帮助玩家避免过度诈唬或轻易放弃底池。", "讲师通过GTO求解器数据与MDA（人群数据分析）频率，为不同手牌类别（听牌、低对子、两对以上牌力、垃圾牌、卡顺听牌）提供了明确的行动频率基准。核心结论是：即使你过牌后，也不能轻易放弃底池，必须用一定比例的强牌和听牌进行过牌加注或过牌跟注，以保护你的范围并反制对手的过度下注。", "视频还特别强调了卡顺听牌（gut shot）在转牌圈进行二次过牌加注（double check-raise）的条件——通常需要具备高张（overcard）、阻挡牌（blocker）或阻断对手弃牌范围等特征。最后，讲师预告了后续将展示一个针对玩家池的剥削性实战牌例，以验证该理论线路的有效性。"], "note": ""}, {"id": "DGL#104-s0", "ep": "104", "type": "topic", "topic": "DGL#104 - 翻前单次加注底池、不利位置：过牌加注-过牌加注（XR-XR）线路中的诈唬策略", "en": "PFC SRP OOP Bluffing in the XR-XR Line", "q": "翻牌圈过牌加注后的转牌过牌频率控制", "clues": ["gut shots", "ace high draws", "non-ace high", "depolarized"], "a": ["无论你在转牌圈选择何种下注尺度，都必须对所有听牌（包括卡顺听牌）进行频率控制，不能总是持续下注。", "在极化（polarized）场景下，卡顺听牌（gut shots）应过牌60%或80%的时间；A高听牌（ace high draws）过牌40%的时间；非A高听牌（non-ace high draws）在高度极化场景下过牌40%，在较去极化（depolarized）场景下过牌20%。", "无论具体下注尺度如何，你必须用一部分弱牌（未成对牌）过牌，否则你的过牌加注范围会变得过度诈唬（overbluffed），极易被剥削。"], "note": ""}, {"id": "DGL#104-s1", "ep": "104", "type": "topic", "topic": "DGL#104 - 翻前单次加注底池、不利位置：过牌加注-过牌加注（XR-XR）线路中的诈唬策略", "en": "PFC SRP OOP Bluffing in the XR-XR Line", "q": "对手在转牌圈的下注频率（MDA数据）", "clues": ["MDA", "stab", "52%"], "a": ["根据MDA（人群数据分析），当你翻牌圈过牌加注后转牌圈过牌，对手会以52%的频率下注（stab）。", "这意味着对手的下注频率相当高，你必须准备好应对这一攻击，而不是简单地放弃底池。"], "note": ""}, {"id": "DGL#104-s2", "ep": "104", "type": "topic", "topic": "DGL#104 - 翻前单次加注底池、不利位置：过牌加注-过牌加注（XR-XR）线路中的诈唬策略", "en": "PFC SRP OOP Bluffing in the XR-XR Line", "q": "转牌圈面对下注时的总体频率基准", "clues": ["24%", "46%", "30%", "70%"], "a": ["在“对手下注半池或更小”的最常见场景下，面对对手转牌下注，你的整体行动频率为：过牌加注24%、跟注46%、弃牌30%。", "这些是基准频率，不同牌面结构会有所变化，但必须牢记：即使你过牌了，仍然有70%的时间需要继续战斗（加注或跟注），不能轻易弃牌。"], "note": ""}, {"id": "DGL#104-s3", "ep": "104", "type": "topic", "topic": "DGL#104 - 翻前单次加注底池、不利位置：过牌加注-过牌加注（XR-XR）线路中的诈唬策略", "en": "PFC SRP OOP Bluffing in the XR-XR Line", "q": "听牌（Draws）在转牌圈的行动频率", "clues": ["30%", "24%", "46%"], "a": ["听牌是此线路中最常见的手牌类别，因为它们是翻牌圈最常用来过牌加注的牌型。", "即使你持有的是未成对的听牌，面对对手下注时，也仅应弃牌30%的时间——这说明不能因为过牌就放弃底池。", "听牌的整体行动频率为：过牌加注24%、跟注46%、弃牌30%，与总体基准一致。"], "note": ""}, {"id": "DGL#104-s4", "ep": "104", "type": "topic", "topic": "DGL#104 - 翻前单次加注底池、不利位置：过牌加注-过牌加注（XR-XR）线路中的诈唬策略", "en": "PFC SRP OOP Bluffing in the XR-XR Line", "q": "低对子（Low Pairs）在转牌圈的行动频率", "clues": ["high card boards", "45%"], "a": ["低对子在高牌面（high card boards）上非常频繁地出现在翻牌圈过牌加注策略中，因为它们适合多街下注（multi-street barrels）。", "转牌圈过牌后面对下注，低对子需要以约45%的频率跟注，同时也要用一定频率进行二次过牌加注（double check-raise）。", "不能因为持有低对子就只选择弃牌或跟注，必须混合加注以保护范围。"], "note": ""}, {"id": "DGL#104-s5", "ep": "104", "type": "topic", "topic": "DGL#104 - 翻前单次加注底池、不利位置：过牌加注-过牌加注（XR-XR）线路中的诈唬策略", "en": "PFC SRP OOP Bluffing in the XR-XR Line", "q": "两对以上牌力（Two Pair+）的慢打与反击", "clues": ["GTO", "over-stab", "value bet", "geometric"], "a": ["两对以上牌力在此线路中非常特殊：以“过牌加注-过牌跟注”的方式游戏是非常不自然的，但根据GTO求解器，这正是你应该在过牌后一半时间做的事情。", "根据GTO蓝图课程，你应该在转牌圈慢打约20%的最强牌；在极化场景下，这一比例提升至40%。", "如果不这样做，你的过牌范围将缺乏强牌保护，对手可以过度下注（over-stab）并价值下注（value bet）剥削你。", "在几何增长（geometric）转牌面（最常见的情况），两对以上牌力应慢打30%的时间；2/3池下注尺度仅用于对子转牌、对子翻牌或同花牌面；25%池下注仅用于四连顺、低对翻牌或同花转牌。", "慢打后面对半池或更小的下注，两对以上牌力应过牌加注50%、过牌跟注50%——必须保留大量的过牌跟注。"], "note": ""}, {"id": "DGL#104-s6", "ep": "104", "type": "topic", "topic": "DGL#104 - 翻前单次加注底池、不利位置：过牌加注-过牌加注（XR-XR）线路中的诈唬策略", "en": "PFC SRP OOP Bluffing in the XR-XR Line", "q": "两对以上牌力的具体牌例", "clues": ["K9s"], "a": ["讲师展示了多个具体牌例：Q7在翻牌圈过牌加注，转牌圈形成葫芦后过牌跟注；口袋对6同样过牌跟注；Q6翻牌圈过牌加注，转牌出7后对手小注，再次过牌加注；K9s过牌加注；Q9过牌跟注；53过牌加注（二次加注）。", "这些例子说明，两对以上牌力在过牌后必须混合使用跟注和加注，各占一半。"], "note": ""}, {"id": "DGL#104-s7", "ep": "104", "type": "topic", "topic": "DGL#104 - 翻前单次加注底池、不利位置：过牌加注-过牌加注（XR-XR）线路中的诈唬策略", "en": "PFC SRP OOP Bluffing in the XR-XR Line", "q": "垃圾牌（Trash Hands）的处理", "clues": ["backdoor draw", "K9o", "K8o", "J9o"], "a": ["垃圾牌指翻牌圈带有某种后门听牌（backdoor draw）但转牌未击中的牌型，如K9o、K8o、J9o、Q4s等（在转牌为白板时）。", "这类牌的处理非常简单：过牌后面对下注直接弃牌（check-fold）。", "这些明显的弃牌牌型正是你必须在策略中加入两对和听牌过牌加注的原因——否则对手可以用任意两张牌下注剥削你。"], "note": ""}, {"id": "DGL#104-s8", "ep": "104", "type": "topic", "topic": "DGL#104 - 翻前单次加注底池、不利位置：过牌加注-过牌加注（XR-XR）线路中的诈唬策略", "en": "PFC SRP OOP Bluffing in the XR-XR Line", "q": "卡顺听牌（Gut Shots）的转牌圈行动", "clues": ["overcard", "blocker to trips", "range", "4%"], "a": ["卡顺听牌在转牌圈大部分情况下应选择过牌弃牌，但存在约4%的过牌加注和4%的过牌跟注频率。", "具体频率因牌面结构而异：某些牌面可以加注更多，某些牌面则更少。", "能够进行过牌跟注或过牌加注的卡顺听牌通常具备以下特征之一：带有高张（overcard）、阻挡对手三条组合（blocker to trips）、或是不阻挡对手的弃牌范围（unblocker to fold range）。"], "note": ""}, {"id": "DGL#104-s9", "ep": "104", "type": "topic", "topic": "DGL#104 - 翻前单次加注底池、不利位置：过牌加注-过牌加注（XR-XR）线路中的诈唬策略", "en": "PFC SRP OOP Bluffing in the XR-XR Line", "q": "卡顺听牌的具体牌例与阻挡牌逻辑", "clues": ["K9o"], "a": ["K J（卡顺听坚果+高张）有时会选择过牌跟注——这是少数可以过牌跟注的卡顺类型。", "K T（卡顺+高张+K阻挡顺子组合+阻挡黑桃同花听牌）也能提升权益，可考虑过牌加注。", "5♥3♥在Q♦7♣4♣牌面上翻牌圈过牌加注，转牌圈对手小注后再次过牌加注——这是极其罕见的打法。", "5♣4♣（卡顺+阻挡Q5和Q4的两对组合）因阻挡了对手的两对组合，提升了诈唬成功率，可进行二次过牌加注。", "K♥9♥（或K9o带红桃）可进行过牌加注，因为对手在翻牌圈不会用红桃组合跟注，因此你阻挡了对手的弃牌范围。", "模式总结：能够进行二次过牌加注的卡顺听牌通常带有高张、阻挡对手三条组合、或不阻挡对手的弃牌范围。"], "note": ""}, {"id": "DGL#104-s10", "ep": "104", "type": "topic", "topic": "DGL#104 - 翻前单次加注底池、不利位置：过牌加注-过牌加注（XR-XR）线路中的诈唬策略", "en": "PFC SRP OOP Bluffing in the XR-XR Line", "q": "频率基准的应用方法", "clues": ["flash cards", "XR-XR"], "a": ["牢记这些基准频率（听牌/低对子/两对以上/垃圾牌/卡顺的各自行动频率），每次实战后可将手牌输入求解器，对比频率并制作闪卡（flash cards）以熟悉各牌面的正确打法。", "过牌加注-过牌加注（XR-XR）线路是一个非常有用的武器，值得加入你的策略库。"], "note": ""}, {"id": "DGL#104-c0", "ep": "104", "type": "cloze", "topic": "DGL#104 - 翻前单次加注底池、不利位置：过牌加注-过牌加注（XR-XR）线路中的诈唬策略", "en": "PFC SRP OOP Bluffing in the XR-XR Line", "q": "卡顺听牌（gut shots）应过牌＿＿或80%的时间；", "clues": [], "a": ["在极化（polarized）场景下，卡顺听牌（gut shots）应过牌60%或80%的时间；A高听牌（ace high draws）过牌40%的时间；非A高听牌（non-ace high draws）在高度极化场景下过牌40%，在较去极化（depolarized）场景下过牌20%。"], "note": "60%"}, {"id": "DGL#104-c1", "ep": "104", "type": "cloze", "topic": "DGL#104 - 翻前单次加注底池、不利位置：过牌加注-过牌加注（XR-XR）线路中的诈唬策略", "en": "PFC SRP OOP Bluffing in the XR-XR Line", "q": "当你翻牌圈过牌加注后转牌圈过牌，对手会以＿＿的频率下注（stab）。", "clues": [], "a": ["根据MDA（人群数据分析），当你翻牌圈过牌加注后转牌圈过牌，对手会以52%的频率下注（stab）。"], "note": "52%"}, {"id": "DGL#104-c2", "ep": "104", "type": "cloze", "topic": "DGL#104 - 翻前单次加注底池、不利位置：过牌加注-过牌加注（XR-XR）线路中的诈唬策略", "en": "PFC SRP OOP Bluffing in the XR-XR Line", "q": "你的整体行动频率为：过牌加注＿＿、跟注46%、弃牌30%。", "clues": [], "a": ["在“对手下注半池或更小”的最常见场景下，面对对手转牌下注，你的整体行动频率为：过牌加注24%、跟注46%、弃牌30%。"], "note": "24%"}, {"id": "DGL#104-note", "ep": "104", "type": "note", "topic": "DGL#104 - 翻前单次加注底池、不利位置：过牌加注-过牌加注（XR-XR）线路中的诈唬策略", "en": "PFC SRP OOP Bluffing in the XR-XR Line", "q": "避坑提醒与行动项", "clues": ["DGL", "Red Line", "30%"], "a": ["本视频是DGL系列第104期，属于理论讲解部分，为后续的“红线”（Red Line）实战牌例分析做铺垫。讲师明确表示，下一期将展示一个针对玩家池的剥削性实战案例，证明该线路在实际对局中的高盈利性。建议结合求解器练习与闪卡记忆，将频率基准内化为直觉。", "**行动项与常见错误提醒：**", "- 不要：翻牌圈过牌加注后，转牌圈总是继续下注——必须混合过牌，否则范围过度诈唬。", "- 不要：过牌后面对下注轻易弃牌——即使持有未成对听牌，也仅应弃牌30%的时间。", "- 应该：用两对以上牌力在转牌圈慢打20%-40%的时间，过牌后面对下注时一半加注、一半跟注。", "- 应该：卡顺听牌在转牌圈大部分弃牌，但带有高张、阻挡牌或阻断对手弃牌范围时可考虑过牌跟注或过牌加注。", "- 应该：牢记基准频率（加注24%、跟注46%、弃牌30%），并根据具体牌面结构调整。"], "note": ""}, {"id": "DGL#105-intro", "ep": "105", "type": "intro", "topic": "DGL#105 - 手牌复盘：拥抱无上限游戏的本质", "en": "Hand Review The Game is No Limit. Embrace it", "q": "DGL#105 - 手牌复盘：拥抱无上限游戏的本质", "clues": ["heads-up", "all-in", "capped"], "a": ["本视频通过一手单挑（heads-up）实战手牌，系统展示了在无限注德州扑克中如何识别并执行全下（all-in）策略。讲师强调，许多玩家在应该全下的场合却选择了中等尺度下注，这实际上偏离了最优策略。视频的核心观点是：当对手的范围在理论上被限制（capped）时，你应当毫不犹豫地利用全下尺度来最大化价值。", "讲师通过具体的翻牌圈、转牌圈和河牌圈决策过程，演示了如何结合自身范围（range）和对手范围来构建策略。他特别指出，人类的直觉往往比均衡策略（equilibrium strategy）更被动，因此玩家需要主动“放宽阈值”——包括价值下注的范围和下注尺度。视频最后总结了一个实用技巧：当你认为某个下注尺度或价值范围已经足够激进时，实际上还可以更进一步。"], "note": ""}, {"id": "DGL#105-s0", "ep": "105", "type": "topic", "topic": "DGL#105 - 手牌复盘：拥抱无上限游戏的本质", "en": "Hand Review The Game is No Limit. Embrace it", "q": "手牌背景与翻前行动", "clues": ["BTN", "KQs", "bet", "slow play"], "a": ["讲师在单挑局中于庄位（BTN）用KQ同花（KQs）开局加注，对手在大盲位（BB）3-bet(再加注)，讲师跟注。", "翻牌圈发出Q♠A♥3♦（彩虹面），对手过牌，讲师决定过牌。", "讲师强调，在翻牌圈必须混合慢玩（slow play）策略，不能总是快打所有强牌，这是构建平衡范围的基础。"], "note": ""}, {"id": "DGL#105-s1", "ep": "105", "type": "topic", "topic": "DGL#105 - 手牌复盘：拥抱无上限游戏的本质", "en": "Hand Review The Game is No Limit. Embrace it", "q": "翻牌圈过牌频率与范围选择", "clues": ["pocket 8", "top tier range", "20%"], "a": ["在单挑情况下，讲师选择约20%的频率过牌自己的强牌，KQ正好落在这个过牌区间内。", "通过筛选顶对以上牌力，可以看到20%的过牌频率是标准配置，甚至口袋对子88（pocket 8）会以更高频率慢玩。", "核心原则：顶级范围（top tier range）在大多数场景下应有约20%的慢玩频率，这有助于保护过牌范围并平衡后续街的下注策略。"], "note": ""}, {"id": "DGL#105-s2", "ep": "105", "type": "topic", "topic": "DGL#105 - 手牌复盘：拥抱无上限游戏的本质", "en": "Hand Review The Game is No Limit. Embrace it", "q": "转牌圈范围分析与下注尺度", "clues": ["nuts", "half pot", "33%"], "a": ["转牌发出3♠，对手再次过牌。此时讲师认为自己的牌力接近坚果（nuts），对手只可能有QQ（仅1个组合）或极少数情况下的AA。", "讲师提醒，决策时不能只看自己的实际手牌，还要考虑范围内其他牌型的需求。例如，口袋对子88、77等中等对子需要下注保护。", "讲师采用单一尺度策略（one size strategy），选择半池（half pot）下注，以兼顾范围内不同牌型的需求，如口袋对子44-66适合33%底池下注，而3X牌型可能倾向更大尺度甚至超池下注。"], "note": ""}, {"id": "DGL#105-s3", "ep": "105", "type": "topic", "topic": "DGL#105 - 手牌复盘：拥抱无上限游戏的本质", "en": "Hand Review The Game is No Limit. Embrace it", "q": "河牌圈全下决策与理论依据", "clues": ["pot", "unprotected", "polarized", "GTO"], "a": ["河牌发出9♦，对手过牌后，讲师判断对手不可能有JT（顺子），自己只输给QQ（1个组合）和偶尔的AA。", "此时底池后手为2倍底池（2x pot），讲师明确表示应选择全下尺度，而非中等下注。", "理论依据：对手在转牌圈的跟注范围缺乏保护（unprotected），因此讲师的价值下注范围可以极度极化（polarized），几乎所有Q都可以全下2倍底池。", "讲师强调，这并非剥削性打法，而是GTO(博弈论最优)框架下的最优解，只是人类直觉往往低估了全下的合理性。"], "note": ""}, {"id": "DGL#105-s4", "ep": "105", "type": "topic", "topic": "DGL#105 - 手牌复盘：拥抱无上限游戏的本质", "en": "Hand Review The Game is No Limit. Embrace it", "q": "放宽阈值的实用技巧", "clues": [], "a": ["讲师分享了一个重要技巧：当你认为某个阈值（如最弱可价值下注的手牌、最大可下注的尺度）已经确定时，尝试将其放宽一点。", "这个技巧适用于下注尺度、防守策略、诈唬频率和价值下注范围等多个方面。例如，如果你认为最弱可价值下注的是某手牌，实际上可能更弱；如果你认为最大下注尺度是某个值，实际上可能更大。", "原因在于人类直觉通常比均衡策略更被动，主动放宽阈值有助于更接近最优执行。"], "note": ""}, {"id": "DGL#105-s5", "ep": "105", "type": "topic", "topic": "DGL#105 - 手牌复盘：拥抱无上限游戏的本质", "en": "Hand Review The Game is No Limit. Embrace it", "q": "常见错误与游戏本质", "clues": [], "a": ["讲师指出，许多玩家（尤其是低级别，但中高级别也存在）在应该全下的场合却选择了中等下注，例如在2倍底池后手时只下注27-30个大盲，而正确做法是下注80个大盲。", "无限注德州扑克的本质就是允许在任何情况下全下，玩家应当充分利用这一特性。", "最终建议：始终提醒自己“游戏是无上限的”，在均衡策略下，阈值通常比你想象的更宽松，你可以下注更大、价值下注更弱的手牌、诈唬更多。"], "note": ""}, {"id": "DGL#105-c1", "ep": "105", "type": "cloze", "topic": "DGL#105 - 手牌复盘：拥抱无上限游戏的本质", "en": "Hand Review The Game is No Limit. Embrace it", "q": "讲师选择约＿＿的频率过牌自己的强牌，KQ正好落在这个过牌区间内。", "clues": [], "a": ["在单挑情况下，讲师选择约20%的频率过牌自己的强牌，KQ正好落在这个过牌区间内。"], "note": "20%"}, {"id": "DGL#105-c2", "ep": "105", "type": "cloze", "topic": "DGL#105 - 手牌复盘：拥抱无上限游戏的本质", "en": "Hand Review The Game is No Limit. Embrace it", "q": "如口袋对子44-66适合＿＿底池下注，而3X牌型可能倾向更大尺度甚至超池下注。", "clues": [], "a": ["讲师采用单一尺度策略（one size strategy），选择半池（half pot）下注，以兼顾范围内不同牌型的需求，如口袋对子44-66适合33%底池下注，而3X牌型可能倾向更大尺度甚至超池下注。"], "note": "33%"}, {"id": "DGL#105-note", "ep": "105", "type": "note", "topic": "DGL#105 - 手牌复盘：拥抱无上限游戏的本质", "en": "Hand Review The Game is No Limit. Embrace it", "q": "避坑提醒与行动项", "clues": ["DGL", "Deep Game Logic", "GTO"], "a": ["本视频属于DGL系列（Deep Game Logic）的第105期，聚焦于手牌复盘与理论结合。讲师通过一手具体的单挑手牌，将抽象的范围构建、下注尺度选择与全下决策原则具象化，适合有一定基础的玩家学习。视频中反复强调的“放宽阈值”技巧，可以进一步结合GTO求解器（如PioSolver）进行验证和训练，以克服人类直觉的被动倾向。", "行动项与常见错误总结：", "- 应该做：在翻牌圈对顶级强牌保持约20%的过牌频率，以平衡范围。", "- 应该做：在转牌圈选择能兼顾范围内所有牌型需求的单一尺度（如半池）。", "- 应该做：在河牌圈当对手范围被限制时，优先考虑全下尺度而非中等下注。", "- 应该做：主动放宽价值下注范围、下注尺度和诈唬频率的阈值。", "- 不要做：在应该全下的场合（如2倍底池后手）只下注中等尺度（如27-30大盲）。", "- 不要做：仅凭直觉判断下注尺度，而应结合理论分析和范围构建。"], "note": ""}];

  if(typeFilter !== "all"){
    if(typeFilter === "topic" && c.type !== "topic" && c.type !== "note") return false;
    if(typeFilter !== "topic" && c.type !== typeFilter) return false;
  }
  const st = marks[c.id];
  if(stateFilter === "new" && st) return false;
  if(stateFilter === "rev" && st !== 2) return false;
  if(stateFilter === "done" && st !== 1) return false;
  if(qtext){
    const hay = (c.topic + c.en + c.q + c.a.join(" ") + c.clues.join(" ")).toLowerCase();
    if(!hay.includes(qtext)) return false;
  }
  return true;
}

function rebuild(reset){
  view = order.filter(i => match(CARDS[i]));
  if(reset !== false) idx = 0;
  if(idx >= view.length) idx = Math.max(0, view.length - 1);
  render();
  stats();
}

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function hl(text, key){
  let h = esc(text);
  if(!key) return h;
  try{
    const k = esc(key).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    h = h.replace(new RegExp(k,"g"), m => "<em>"+m+"</em>");
  }catch(e){}
  return h;
}

function render(){
  card.classList.remove("flipped");
  const pos = $("#pos"), total = $("#s-total");
  if(!view.length){
    $("#f-topic").textContent = "";
    $("#f-head").textContent = "没有符合条件的卡片";
    $("#f-need").textContent = "";
    $("#f-clues").innerHTML = "";
    $("#f-chip").textContent = "—";
    $("#f-type").textContent = "空";
    $("#b-body").innerHTML = '<p class="empty">调整上方的筛选条件或清空搜索</p>';
    $("#b-src").textContent = "";
    pos.textContent = "0 / 0";
    $("#bar").style.width = "0%";
    return;
  }
  const c = CARDS[view[idx]];
  $("#f-chip").textContent = LINE + "#" + c.ep;
  $("#f-type").textContent = TYPE_LABEL[c.type] || "要点";
  $("#f-topic").textContent = c.topic;
  const qbox = $("#f-q");
  qbox.classList.toggle("cloze", c.type === "cloze");
  if(c.type === "cloze"){
    $("#f-head").innerHTML = esc(c.q).replace("＿＿", '<span class="blank"></span>');
  } else if(c.type === "intro"){
    $("#f-head").textContent = "这一期在讲什么？用自己的话讲一遍";
  } else {
    $("#f-head").textContent = "「" + c.q + "」";
  }
  $("#f-clues").innerHTML = (c.clues||[]).map(k => '<span class="clue">'+esc(k)+'</span>').join("");
  const needBox = $("#f-need");
  if(c.type === "topic"){
    needBox.textContent = "回忆这一节的 " + c.a.length + " 条要点";
  } else if(c.type === "note"){
    needBox.textContent = "回忆这一节的避坑点与行动项";
  } else if(c.type === "cloze"){
    needBox.textContent = "补出下划线处的数字";
  } else {
    needBox.textContent = "";
  }

  $("#b-type").textContent = TYPE_LABEL[c.type] || "要点";
  $("#b-src").textContent = c.topic + (c.en ? " · " + c.en : "");
  let html = "";
  if(c.type === "cloze" && c.note) html += '<div class="answer-key">'+esc(c.note)+'</div>';
  if(c.type === "intro") html = c.a.map(p => "<p>"+hl(p)+"</p>").join("");
  else html += "<ul>" + c.a.map(t => "<li>"+hl(t, c.type==="cloze"?c.note:"")+"</li>").join("") + "</ul>";
  $("#b-body").innerHTML = html;
  $("#b-body").scrollTop = 0;

  const st = marks[c.id];
  $("#b-mark").textContent = st === 1 ? "已标记掌握" : (st === 2 ? "已标记待复习" : "");
  $("#done").classList.toggle("on", st === 1);
  $("#rev").classList.toggle("on", st === 2);
  pos.textContent = (idx+1) + " / " + view.length;
  $("#bar").style.width = (view.length ? ((idx+1)/view.length*100) : 0) + "%";
}

function stats(){
  const done = CARDS.filter(c => marks[c.id] === 1).length;
  const rev = CARDS.filter(c => marks[c.id] === 2).length;
  $("#s-total").textContent = CARDS.length;
  $("#s-done").textContent = done;
  $("#s-rev").textContent = rev;
}

function go(d){
  if(!view.length) return;
  idx = (idx + d + view.length) % view.length;
  render();
}
function mark(v){
  if(!view.length) return;
  const c = CARDS[view[idx]];
  marks[c.id] = (marks[c.id] === v) ? 0 : v;
  save();
  if(marks[c.id] === 0) delete marks[c.id];
  stats();
  $("#b-mark").textContent = marks[c.id] === 1 ? "已标记掌握" : (marks[c.id] === 2 ? "已标记待复习" : "");
  $("#done").classList.toggle("on", marks[c.id] === 1);
  $("#rev").classList.toggle("on", marks[c.id] === 2);
  if(marks[c.id] && stateFilter === "all") setTimeout(()=>go(1), 260);
}

$("#scene").addEventListener("click", e => { card.classList.toggle("flipped"); });
$("#flip").addEventListener("click", e => { e.stopPropagation(); card.classList.toggle("flipped"); });
$("#next").addEventListener("click", ()=>go(1));
$("#prev").addEventListener("click", ()=>go(-1));
$("#done").addEventListener("click", e => { e.stopPropagation(); mark(1); });
$("#rev").addEventListener("click", e => { e.stopPropagation(); mark(2); });
$("#shuffle").addEventListener("click", () => {
  for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  $("#shuffle").classList.add("on");
  rebuild(true);
  setTimeout(()=>$("#shuffle").classList.remove("on"), 600);
});
$("#seg-type").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  [...e.currentTarget.children].forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); typeFilter = b.dataset.t; rebuild(true);
});
$("#seg-state").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  [...e.currentTarget.children].forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); stateFilter = b.dataset.s; rebuild(true);
});
let tmr;
$("#q").addEventListener("input", e => {
  clearTimeout(tmr);
  tmr = setTimeout(()=>{ qtext = e.target.value.trim().toLowerCase(); rebuild(true); }, 180);
});
document.addEventListener("keydown", e => {
  if(e.target.tagName === "INPUT") return;
  if(e.code === "Space"){ e.preventDefault(); card.classList.toggle("flipped"); }
  else if(e.key === "ArrowRight"){ go(1); }
  else if(e.key === "ArrowLeft"){ go(-1); }
  else if(e.key === "1"){ mark(1); }
  else if(e.key === "2"){ mark(2); }
  else if(e.key.toLowerCase() === "s"){ $("#shuffle").click(); }
});

rebuild(true);
// 支持 ?i=12&flip=1 直接定位到某张卡
try{
  const P = new URLSearchParams(location.search);
  const n = parseInt(P.get("i") || "0", 10);
  if(n > 0 && n <= view.length){ idx = n - 1; render(); }
  if(P.get("flip") === "1") card.classList.add("flipped");
}catch(e){}
</script>
</body>
</html>
