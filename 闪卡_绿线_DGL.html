当比例的弃牌。", "最大的变化出现在同花听牌：面对B50时，无对子同花听牌的过牌加注频率飙升至41%，且几乎不跟注，剩余约50%弃牌。这是与B70序列最显著的差异。", "A高同花听牌延续类似模式，但加注更多：19%加注、77%跟注，呈现约20-80的跟注-加注分配。", "组合听牌呈现40-60的分配（跟注-加注），与SB vs BB阵型中的表现非常接近。整体而言，面对更小的转牌下注，同花听牌从被动防守转为主动加注，是最大的结构性变化。"], "note": ""}, {"id": "DGL#71-s3", "ep": "71", "type": "topic", "topic": "DGL#71 - 翻前3-bet底池中，不利位置（CO vs BTN）面对双枪下注时如何游戏未成对听牌", "en": "PFC 3BP OOP How To Play Unpaired Draws vs Double Barrel - CO vs BTN", "q": "面对B25-B100序列的防守策略", "clues": ["B25-B100", "SPR", "jam", "84%"], "a": ["面对B25-B100（转牌全池下注），未成对听牌几乎不加注（仅3%），弃牌率高达84%。这是因为对手范围此时极强，且SPR已较低，缺乏加注空间。", "继续游戏的主要是A高同花听牌和组合听牌：A高同花听牌弃牌21%、跟注为主；组合听牌无对子时弃牌25%、跟注63%、加注12%，呈现约20-60-20的分配。", "其他手牌类别（卡顺、两头顺、普通同花听牌）基本以弃牌为主，仅保留少量跟注和加注。面对全池下注，一旦决定加注，唯一合理的选择就是全下（jam）。"], "note": ""}, {"id": "DGL#71-s4", "ep": "71", "type": "topic", "topic": "DGL#71 - 翻前3-bet底池中，不利位置（CO vs BTN）面对双枪下注时如何游戏未成对听牌", "en": "PFC 3BP OOP How To Play Unpaired Draws vs Double Barrel - CO vs BTN", "q": "面对B50-B50序列的防守策略", "clues": ["B50-B50", "B25-B50", "pot raise", "22%"], "a": ["面对B50-B50序列，整体防守频率为：22%过牌加注、46%弃牌。相比B25-B50（14%加注、61%弃牌），对手选择B50-B50时，我们的范围更强，因此弃牌更少、加注更多。", "卡顺听牌依然几乎不加注，大量弃牌。两头顺听牌则显著更激进：40%过牌加注，是该序列下最积极的手牌类别之一。", "无对子同花听牌呈现30-20-50的分配（加注-跟注-弃牌）。A高同花听牌延续一贯的20-80分配（加注-跟注），几乎不受下注尺度影响。", "组合听牌呈现50-50的加注-跟注分配，打法更激进。整体来看，B50-B50序列下，两头顺听牌和组合听牌是主要的加注来源。", "值得注意的是，三倍底池加注（3x pot raise）在此序列中非常常见，约占加注频率的三分之二，用于对对手范围中中等强度牌施加压力。"], "note": ""}, {"id": "DGL#71-s5", "ep": "71", "type": "topic", "topic": "DGL#71 - 翻前3-bet底池中，不利位置（CO vs BTN）面对双枪下注时如何游戏未成对听牌", "en": "PFC 3BP OOP How To Play Unpaired Draws vs Double Barrel - CO vs BTN", "q": "面对B50-B70序列的防守策略", "clues": ["B50-B70", "B50-B50", "shove", "14%"], "a": ["面对B50-B70序列，整体防守频率为：14%过牌加注、54%弃牌。相比B50-B50，加注减少、弃牌增加，符合下注尺度越大防守越紧的规律。", "卡顺听牌依然遵循一贯模式（几乎不加注、大量弃牌）。两头顺听牌和同花听牌在加注、跟注、弃牌之间混合，但加注频率明显下降，尤其两头顺听牌。", "A高同花听牌依然保持20-80分配（加注-跟注），组合听牌保持40-60分配（跟注-加注），两者几乎不受下注尺度序列影响，是防守最稳定的手牌类别。", "面对该序列，首选加注尺度为全下（shove），因为底池中已有大量资金，缺乏小尺度加注的空间。"], "note": ""}, {"id": "DGL#71-s6", "ep": "71", "type": "topic", "topic": "DGL#71 - 翻前3-bet底池中，不利位置（CO vs BTN）面对双枪下注时如何游戏未成对听牌", "en": "PFC 3BP OOP How To Play Unpaired Draws vs Double Barrel - CO vs BTN", "q": "核心手牌类别的稳定频率规律", "clues": ["B25-B50", "B50-B50"], "a": ["A高同花听牌（无对子）在所有下注尺度序列下几乎都保持20-80的加注-跟注分配，是防守最稳定的手牌类别，因其有坚果听牌权益。", "组合听牌（无对子）在所有序列下几乎都保持40-60的跟注-加注分配，同样非常稳定，是防守最积极的手牌类别。", "卡顺听牌在所有序列下都几乎不加注，以弃牌为主，是防守最被动的手牌类别。", "变化最大的是两头顺听牌和普通同花听牌：面对某些序列（如B25-B50）同花听牌加注频率飙升，面对另一些序列（如B50-B50）两头顺听牌加注频率飙升。建议优先记忆A高同花听牌和组合听牌的稳定频率，再根据下注尺度调整两头顺和同花听牌的策略。"], "note": ""}, {"id": "DGL#71-s7", "ep": "71", "type": "topic", "topic": "DGL#71 - 翻前3-bet底池中，不利位置（CO vs BTN）面对双枪下注时如何游戏未成对听牌", "en": "PFC 3BP OOP How To Play Unpaired Draws vs Double Barrel - CO vs BTN", "q": "CO vs BTN与SB vs BB的阵型差异", "clues": ["CO vs BTN", "SPR", "Hero", "BTN 3-bet"], "a": ["CO vs BTN的SPR更深：翻前3-bet尺度更小（Hero开2.3BB，BTN 3-bet至7.5BB），而SB vs BB中开3BB、3-bet至10BB，因此CO vs BTN翻后SPR更高。", "更深的SPR允许使用更小的过牌加注尺度：CO vs BTN中常用2.6x-3x的过牌加注，而SB vs BB中更依赖全下。", "BTN在下注尺度序列上更多样化，例如可以在转牌使用B100，而BB位则较少这样做。", "CO vs BTN的过牌弃牌频率整体更高，尤其在翻牌圈面对B25后。原因在于BTN的翻前范围是线性的（linear），整体更强；而BB的翻前范围是极化的（polarized），未成对听牌权益实现更好。", "CO vs BTN的防守更极化：弃牌更多，但过牌加注也更多。相比之下，SB vs BB的防守更均衡。这一差异源于对手范围结构和SPR的不同。"], "note": ""}, {"id": "DGL#71-c0", "ep": "71", "type": "cloze", "topic": "DGL#71 - 翻前3-bet底池中，不利位置（CO vs BTN）面对双枪下注时如何游戏未成对听牌", "en": "PFC 3BP OOP How To Play Unpaired Draws vs Double Barrel - CO vs BTN", "q": "本视频场景为三人底池（3-bet pot）：Hero在CO位（关位）开局加注至＿＿，", "clues": [], "a": ["本视频场景为三人底池（3-bet pot）：Hero在CO位（关位）开局加注至2.3BB，BTN位（按钮位）3-bet（再加注），Hero跟注。翻牌圈BTN持续下注（c-bet），Hero跟注，转牌圈Hero过牌，BTN再次下注（双枪）。"], "note": "2.3BB"}, {"id": "DGL#71-c1", "ep": "71", "type": "cloze", "topic": "DGL#71 - 翻前3-bet底池中，不利位置（CO vs BTN）面对双枪下注时如何游戏未成对听牌", "en": "PFC 3BP OOP How To Play Unpaired Draws vs Double Barrel - CO vs BTN", "q": "未成对听牌的整体防守频率为：＿＿过牌加注、17%跟注、72%弃牌。", "clues": [], "a": ["面对B25-B70序列，未成对听牌的整体防守频率为：11%过牌加注、17%跟注、72%弃牌。加注时首选全下（jam），但小尺度加注（约2.6x-3x）也占加注频率的40%，用于极化范围并施压对手中等强度牌。"], "note": "11%"}, {"id": "DGL#71-c2", "ep": "71", "type": "cloze", "topic": "DGL#71 - 翻前3-bet底池中，不利位置（CO vs BTN）面对双枪下注时如何游戏未成对听牌", "en": "PFC 3BP OOP How To Play Unpaired Draws vs Double Barrel - CO vs BTN", "q": "整体防守频率变为：＿＿过牌加注、25%跟注、61%弃牌。", "clues": [], "a": ["面对B25-B50序列，整体防守频率变为：14%过牌加注、25%跟注、61%弃牌。相比B70，弃牌率下降11个百分点，加注率上升3个百分点，范围极化程度降低，可以更积极地快打价值牌并搭配更多诈唬。"], "note": "14%"}, {"id": "DGL#71-note", "ep": "71", "type": "note", "topic": "DGL#71 - 翻前3-bet底池中，不利位置（CO vs BTN）面对双枪下注时如何游戏未成对听牌", "en": "PFC 3BP OOP How To Play Unpaired Draws vs Double Barrel - CO vs BTN", "q": "避坑提醒与行动项", "clues": ["DGL", "SB vs BB", "SPR"], "a": ["本视频是DGL系列中关于“未成对听牌面对双枪下注”的第二部分，承接SB vs BB阵型的分析，通过对比不同位置组合，帮助玩家理解位置、SPR和对手范围结构对防守策略的深刻影响。建议结合上一集（SB vs BB）和后续可能的其他位置组合（如BTN vs SB）视频，形成完整的防守框架。", "### 行动清单", "- 面对B25-B70序列：未成对听牌整体弃牌72%，加注时首选全下，但小尺度加注（2.6x-3x）占40%加注频率，用于极化施压。", "- 面对B25-B50序列：同花听牌加注频率飙升至41%，几乎不跟注，应大幅提高同花听牌的过牌加注频率。", "- 面对B25-B100序列：几乎不加注（3%），弃牌84%，仅A高同花听牌和组合听牌继续游戏，加注时直接全下。", "- 面对B50-B50序列：两头顺听牌加注40%，组合听牌加注-跟注各半，三倍底池加注占加注频率三分之二。", "- 面对B50-B70序列：加注减少、弃牌增加，首选全下，A高同花听牌和组合听牌保持稳定频率。", "- 不要对卡顺听牌进行加注，几乎在所有序列下都应弃牌为主。", "- 不要忽视A高同花听牌和组合听牌的稳定性：无论下注尺度如何，前者保持20-80加注-跟注分配，后者保持40-60跟注-加注分配。", "- 不要忘记CO vs BTN的防守比SB vs BB更极化：弃牌更多，但过牌加注也更多，应根据位置调整整体防守策略。"], "note": ""}, {"id": "DGL#72-intro", "ep": "72", "type": "intro", "topic": "DGL#72 - 翻牌圈打法：优化翻牌过牌加注范围构成", "en": "Flop Play Improving Flop XR Composition", "q": "DGL#72 - 翻牌圈打法：优化翻牌过牌加注范围构成", "clues": ["GTO", "check-raise"], "a": ["本视频通过对比GTO机器人与人类玩家在翻牌圈过牌加注（check-raise）范围构成上的差异，揭示了两类最关键的偏差区域。讲师使用自己学生与机器人对战的数据库，分别统计了双方在翻牌圈过牌加注时的牌力分布，发现人类玩家在中等强度牌力的使用频率上严重不足，而在超强牌力的使用频率上又明显过度。", "视频指出，人类玩家在低对子（low pocket）、低对（low pair）和中对（middle pair）这三类牌力的过牌加注频率仅为GTO要求的不到一半，而在两对及更强牌力（two pair plus）上则过度快打（fast play）。讲师建议玩家应增加中等牌力的过牌加注频率，同时降低超强牌力的过牌加注频率，将更多强牌放入跟注范围，以实现更平衡的范围构成。", "视频还给出了具体的牌例和频率建议，包括A4s在K-T-4翻牌面的过牌加注、54s在9-6-5彩虹面的过牌加注，以及强牌应控制在60%左右的过牌加注频率等实操指导，帮助玩家在翻牌圈构建更接近GTO的过牌加注范围。"], "note": ""}, {"id": "DGL#72-s0", "ep": "72", "type": "topic", "topic": "DGL#72 - 翻牌圈打法：优化翻牌过牌加注范围构成", "en": "Flop Play Improving Flop XR Composition", "q": "数据来源与对比方法", "clues": ["GTO", "check-raise", "air", "strong hands"], "a": ["讲师使用自己开发的GTO模拟器中学生的对战数据库，分别筛选了人类玩家和GTO机器人在翻牌圈的过牌加注（check-raise）行为，对比双方的范围构成差异。", "通过对比空气牌（air）、边缘成手牌（marginal made hands）和超强牌（strong hands）三大类牌力的使用频率，找出人类与GTO之间最显著的偏差区域。", "视频的核心目标是帮助玩家识别自己在翻牌过牌加注范围构成上的主要问题，并给出具体的调整方向。"], "note": ""}, {"id": "DGL#72-s1", "ep": "72", "type": "topic", "topic": "DGL#72 - 翻牌圈打法：优化翻牌过牌加注范围构成", "en": "Flop Play Improving Flop XR Composition", "q": "空气牌范围构成对比", "clues": ["air", "GTO", "1%", "3%"], "a": ["在空气牌（air）类别中，人类与GTO的频率非常接近：无高张无后门同花听牌均为1%，无高张有后门同花听牌GTO为3%而人类为4%，一张高张无后门同花听牌均为1%，一张高张有后门同花听牌GTO为2%而人类为3%。", "两张高张无后门同花听牌GTO为3%而人类为4%，两张高张有后门同花听牌双方均为4%。整体来看，空气牌范围的构成双方几乎一致，不是需要调整的重点区域。"], "note": ""}, {"id": "DGL#72-s2", "ep": "72", "type": "topic", "topic": "DGL#72 - 翻牌圈打法：优化翻牌过牌加注范围构成", "en": "Flop Play Improving Flop XR Composition", "q": "中等牌力范围构成对比", "clues": ["low pocket pairs", "GTO", "low pair no", "draw"], "a": ["低口袋对子（low pocket pairs）在GTO中占过牌加注范围的3%，而人类仅占1%；低对无后门听牌（low pair no draw）GTO为6%而人类为3%；中对（middle pair）GTO为5%而人类仅为2%。", "这三类牌力合计，GTO的过牌加注范围中有14%（6+5+3）由低对子、低对和中对构成，而人类只有6%，不到GTO所需频率的一半。", "讲师指出，人类玩家在心理上更倾向于极化（polarized）的过牌加注范围，对用中等强度牌力过牌加注感到不自在，更习惯用跟注来处理这些牌，但这是与GTO平衡范围构成的主要偏差之一。"], "note": ""}, {"id": "DGL#72-s3", "ep": "72", "type": "topic", "topic": "DGL#72 - 翻牌圈打法：优化翻牌过牌加注范围构成", "en": "Flop Play Improving Flop XR Composition", "q": "低对子过牌加注牌例", "clues": ["A4s", "heuristic", "GTO"], "a": ["A4s（同花A4）在K-T-4翻牌面进行大额过牌加注，这是讲师建议玩家应掌握的启发式策略（heuristic），在GTO蓝图课程中已有讲解。", "54s（同花54）在9-6-5彩虹翻牌面应进行过牌加注，利用低对子加卡顺听牌的组合。", "65s（同花65）在K-5-2翻牌面，即使只有后门同花听牌，也应过牌加注。", "76o（非同花76）在K-Q-7翻牌面，即使没有听牌，也应将这类低对子纳入过牌加注范围，当然很多时候会有后门听牌，但即使没有也应该加注。"], "note": ""}, {"id": "DGL#72-s4", "ep": "72", "type": "topic", "topic": "DGL#72 - 翻牌圈打法：优化翻牌过牌加注范围构成", "en": "Flop Play Improving Flop XR Composition", "q": "中对过牌加注牌例", "clues": ["middle pair", "GTO", "J9o", "A8s"], "a": ["中对（middle pair）是比低对子更不直观、更让人不舒服的过牌加注牌力类别，但GTO中同样需要以一定频率使用。", "J9o（非同花J9）在Q-J-2翻牌面，面对高张J时，应以一定频率过牌加注。", "A8s（同花A8）在K-8-6翻牌面，这是中等牌力慢打（slow play）的典型场景，应进行过牌加注。", "讲师强调，这些中对牌力在过牌加注范围中的使用频率虽然不如低对子高，但同样是平衡范围不可或缺的组成部分。"], "note": ""}, {"id": "DGL#72-s5", "ep": "72", "type": "topic", "topic": "DGL#72 - 翻牌圈打法：优化翻牌过牌加注范围构成", "en": "Flop Play Improving Flop XR Composition", "q": "超强牌范围构成对比", "clues": ["two pair plus", "GTO", "trips", "sets"], "a": ["在两对及更强牌力（two pair plus）类别中，人类与GTO存在显著差异：两对（two pair）GTO为6%而人类为8%，三条（trips）GTO为4%而人类为6%，暗三条（sets）GTO为7%而人类为9%。", "顺子（straight）双方均为1%，同花顺和葫芦（straight flush and full house）GTO为1%而人类为2%。整体来看，人类在超强牌上的过牌加注频率明显高于GTO。", "人类超强牌过牌加注合计约为28%（8+6+9+4+1），而GTO仅为20%左右（6+4+7+1+1+1），人类过度快打了约8个百分点的超强牌。"], "note": ""}, {"id": "DGL#72-s6", "ep": "72", "type": "topic", "topic": "DGL#72 - 翻牌圈打法：优化翻牌过牌加注范围构成", "en": "Flop Play Improving Flop XR Composition", "q": "超强牌频率调整建议", "clues": ["GTO", "top two", "calling range", "60%"], "a": ["讲师建议玩家参考GTO蓝图课程中关于顶两对（top two）范围的启发式策略，但核心原则是：超强牌的平均过牌加注频率不应超过60%。", "这意味着玩家应将最强牌中的40%放入跟注范围（calling range），而不是全部用于过牌加注，这样可以让过牌加注范围更加平衡。", "通过减少超强牌的过牌加注频率，同时增加低对子、低对和中对的过牌加注频率，玩家可以显著改善翻牌圈过牌加注范围的构成，更接近GTO的平衡状态。"], "note": ""}, {"id": "DGL#72-c1", "ep": "72", "type": "cloze", "topic": "DGL#72 - 翻牌圈打法：优化翻牌过牌加注范围构成", "en": "Flop Play Improving Flop XR Composition", "q": "人类与GTO的频率非常接近：无高张无后门同花听牌均为＿＿，", "clues": [], "a": ["在空气牌（air）类别中，人类与GTO的频率非常接近：无高张无后门同花听牌均为1%，无高张有后门同花听牌GTO为3%而人类为4%，一张高张无后门同花听牌均为1%，一张高张有后门同花听牌GTO为2%而人类为3%。"], "note": "1%"}, {"id": "DGL#72-c2", "ep": "72", "type": "cloze", "topic": "DGL#72 - 翻牌圈打法：优化翻牌过牌加注范围构成", "en": "Flop Play Improving Flop XR Composition", "q": "低口袋对子（low pocket pairs）在GTO中占过牌加注范围的＿＿，", "clues": [], "a": ["低口袋对子（low pocket pairs）在GTO中占过牌加注范围的3%，而人类仅占1%；低对无后门听牌（low pair no draw）GTO为6%而人类为3%；中对（middle pair）GTO为5%而人类仅为2%。"], "note": "3%"}, {"id": "DGL#72-c5", "ep": "72", "type": "cloze", "topic": "DGL#72 - 翻牌圈打法：优化翻牌过牌加注范围构成", "en": "Flop Play Improving Flop XR Composition", "q": "人类与GTO存在显著差异：两对（two pair）GTO为＿＿而人类为8%，", "clues": [], "a": ["在两对及更强牌力（two pair plus）类别中，人类与GTO存在显著差异：两对（two pair）GTO为6%而人类为8%，三条（trips）GTO为4%而人类为6%，暗三条（sets）GTO为7%而人类为9%。"], "note": "6%"}, {"id": "DGL#72-note", "ep": "72", "type": "note", "topic": "DGL#72 - 翻牌圈打法：优化翻牌过牌加注范围构成", "en": "Flop Play Improving Flop XR Composition", "q": "避坑提醒与行动项", "clues": ["DGL", "GTO", "A4s"], "a": ["本视频是DGL系列中关于翻牌圈打法的重要一课，重点聚焦于过牌加注范围的构成优化。讲师在GTO蓝图课程中已经详细讲解了各类牌力的过牌加注启发式策略，本视频则通过数据对比，让玩家直观看到自己与GTO之间的实际差距，属于理论与实践结合的教学内容。建议玩家在观看本视频前，先掌握GTO蓝图课程中关于翻牌圈过牌加注的基本框架。", "值得进一步学习的方向包括：如何根据不同的翻牌面结构（如干燥面、湿润面、配对面）调整中等牌力的过牌加注频率，以及如何在实战中平衡超强牌的快打与慢打。此外，玩家还可以结合自己的数据库统计，定期检查过牌加注范围的构成，持续优化策略。", "**应该这样做：**", "- 增加低口袋对子、低对和中对在翻牌过牌加注范围中的使用频率，至少达到GTO要求的一半以上。", "- 将超强牌（两对及以上）的过牌加注频率控制在60%左右，剩余40%放入跟注范围。", "- 在K-T-4、9-6-5、K-5-2、K-Q-7等翻牌面，积极用A4s、54s、65s、76o等低对子牌力过牌加注。", "**不要这样做：**", "- 不要只用极化范围（超强牌+纯诈唬）进行过牌加注，而忽略中等牌力的平衡作用。", "- 不要将所有超强牌都用于过牌加注，过度快打会让你的跟注范围变得过于脆弱。", "- 不要因为对中等牌力过牌加注感到不自在就完全放弃这类操作，这是人类玩家最常见的范围构成偏差。"], "note": ""}, {"id": "DGL#73-intro", "ep": "73", "type": "intro", "topic": "翻牌后过牌、转牌超额下注被跟注后，如何在河牌圈游戏诈唬牌", "en": "PFC SRP OOP How To Play Rivers After Turn Overbet Probe - Bluffs", "q": "翻牌后过牌、转牌超额下注被跟注后，如何在河牌圈游戏诈唬牌", "clues": ["DGL", "overbet probe"], "a": ["本视频是 DGL 系列第 73 集，聚焦于一个具体且常见的翻后场景：大盲位玩家在翻牌圈过牌-过牌后，于转牌圈进行底池大小或更大的超额下注（overbet probe），被对手跟注后，河牌圈应如何继续游戏。讲师指出，河牌圈理论通常不被单独讲解，但玩家需要建立一个基线理解，再根据具体情况进行动态调整，而非机械追求平衡。", "视频的核心发现是：在转牌超额下注被跟注后，河牌圈所有诈唬手牌类别（未成对牌）的持续下注频率几乎一致，均落在 40% 左右的“桶”内。讲师通过手牌分类分析（如错失顺子听牌、错失同花听牌、低对、错失高牌、垃圾牌、A 高牌）展示了这一规律，并强调只要价值牌比例正确，40% 的诈唬频率即可保证接近平衡的范围构建。", "视频还提醒玩家注意常见误区：如果价值牌在转牌被过度快打（fast play），导致河牌价值牌比例偏高，那么使用 40% 诈唬频率可能会导致诈唬不足。讲师建议在实际对局中根据对手倾向、牌面结构和自身范围强弱进行上下浮动，而非僵化套用。"], "note": ""}, {"id": "DGL#73-s0", "ep": "73", "type": "topic", "topic": "翻牌后过牌、转牌超额下注被跟注后，如何在河牌圈游戏诈唬牌", "en": "PFC SRP OOP How To Play Rivers After Turn Overbet Probe - Bluffs", "q": "场景设定与前提条件", "clues": ["polarized", "linear", "low pair", "semi-bluff"], "a": ["本视频讨论的场景为：对手在有利位置开局加注，玩家在大盲位跟注；翻牌圈双方过牌；转牌圈玩家下注（底池大小或更大），对手跟注。", "转牌下注采用底池大小或更高尺度，意味着玩家的下注范围是极化（polarized）的，即由强价值牌和诈唬牌组成，而非线性（linear）范围。", "低对（low pair）在转牌圈常被用作半诈唬（semi-bluff），因为它们含有改进为两对或三条的补牌（outs），因此也被纳入本视频的河牌分析范围。"], "note": ""}, {"id": "DGL#73-s1", "ep": "73", "type": "topic", "topic": "翻牌后过牌、转牌超额下注被跟注后，如何在河牌圈游戏诈唬牌", "en": "PFC SRP OOP How To Play Rivers After Turn Overbet Probe - Bluffs", "q": "河牌圈诈唬频率的核心规律", "clues": ["low pair", "missed overs", "missed trash", "ace high"], "a": ["讲师通过手牌分类分析发现：在转牌超额下注被跟注后，河牌圈所有诈唬手牌类别的持续下注频率几乎一致，均落在 40% 左右的“桶”内。", "具体数据：错失顺子听牌（missed straight draw）的诈唬频率为 39%-61%；错失同花听牌（missed flush draw）为 33%-67%；低对（low pair）为 38%-62%；错失高牌（missed overs）为 50%-50%（样本量较小）；错失垃圾牌（missed trash）为 41%-59%；A 高牌（ace high）为 44%-56%。", "结论：无论具体是哪一类未成对牌，河牌圈的诈唬频率都围绕 40% 波动，40% 是保证接近平衡范围构建的“桶”。"], "note": ""}, {"id": "DGL#73-s2", "ep": "73", "type": "topic", "topic": "翻牌后过牌、转牌超额下注被跟注后，如何在河牌圈游戏诈唬牌", "en": "PFC SRP OOP How To Play Rivers After Turn Overbet Probe - Bluffs", "q": "40% 诈唬频率的适用条件", "clues": ["under-bluffing", "value bucket", "40%"], "a": ["40% 诈唬频率的前提是：玩家的下注范围中价值牌比例必须正确，即价值牌与诈唬牌的比例符合平衡要求。", "如果价值牌在转牌被过度快打（例如本应慢打的价值牌也被下注），导致河牌圈价值牌比例偏高，那么使用 40% 诈唬频率可能会导致诈唬不足（under-bluffing）。", "讲师强调：玩家需要先确保自己的价值牌桶（value bucket）是合理的，再应用 40% 诈唬频率，否则结果会偏离平衡。"], "note": ""}, {"id": "DGL#73-s3", "ep": "73", "type": "topic", "topic": "翻牌后过牌、转牌超额下注被跟注后，如何在河牌圈游戏诈唬牌", "en": "PFC SRP OOP How To Play Rivers After Turn Overbet Probe - Bluffs", "q": "实际对局中的调整原则", "clues": ["board texture", "40%"], "a": ["讲师建议在实战中根据对手倾向、牌面纹理（board texture）和自身范围构成进行上下浮动，而非僵化套用 40% 频率。", "当自身范围看起来较弱时（例如牌面与对手范围更相关），应减少诈唬；当自身范围看起来较强时（例如牌面与自身范围更相关），应增加诈唬。", "讲师明确表示不推荐在河牌圈机械追求平衡，但需要有一个基线理解作为起点，再根据具体情况进行剥削性调整。"], "note": ""}, {"id": "DGL#73-s4", "ep": "73", "type": "topic", "topic": "翻牌后过牌、转牌超额下注被跟注后，如何在河牌圈游戏诈唬牌", "en": "PFC SRP OOP How To Play Rivers After Turn Overbet Probe - Bluffs", "q": "常见错误与误区", "clues": ["40%"], "a": ["常见错误：在转牌圈过度快打价值牌，导致河牌圈价值牌比例偏高，进而使用 40% 诈唬频率时诈唬不足。", "另一个误区：认为不同手牌类别（如错失顺子 vs 错失同花）在河牌圈的诈唬频率应有显著差异，但数据显示它们几乎一致，均落在 40% 左右。"], "note": ""}, {"id": "DGL#73-c1", "ep": "73", "type": "cloze", "topic": "翻牌后过牌、转牌超额下注被跟注后，如何在河牌圈游戏诈唬牌", "en": "PFC SRP OOP How To Play Rivers After Turn Overbet Probe - Bluffs", "q": "河牌圈所有诈唬手牌类别的持续下注频率几乎一致，均落在 ＿＿ 左右的“桶”内。", "clues": [], "a": ["讲师通过手牌分类分析发现：在转牌超额下注被跟注后，河牌圈所有诈唬手牌类别的持续下注频率几乎一致，均落在 40% 左右的“桶”内。"], "note": "40%"}, {"id": "DGL#73-c2", "ep": "73", "type": "cloze", "topic": "翻牌后过牌、转牌超额下注被跟注后，如何在河牌圈游戏诈唬牌", "en": "PFC SRP OOP How To Play Rivers After Turn Overbet Probe - Bluffs", "q": "＿＿ 诈唬频率的前提是：玩家的下注范围中价值牌比例必须正确，", "clues": [], "a": ["40% 诈唬频率的前提是：玩家的下注范围中价值牌比例必须正确，即价值牌与诈唬牌的比例符合平衡要求。"], "note": "40%"}, {"id": "DGL#73-c3", "ep": "73", "type": "cloze", "topic": "翻牌后过牌、转牌超额下注被跟注后，如何在河牌圈游戏诈唬牌", "en": "PFC SRP OOP How To Play Rivers After Turn Overbet Probe - Bluffs", "q": "讲师建议在实战中根据对手倾向、牌面纹理（board texture）和自身范围构成进行上下浮动，而非僵化套用 ＿＿ 频率。", "clues": [], "a": ["讲师建议在实战中根据对手倾向、牌面纹理（board texture）和自身范围构成进行上下浮动，而非僵化套用 40% 频率。"], "note": "40%"}, {"id": "DGL#73-note", "ep": "73", "type": "note", "topic": "翻牌后过牌、转牌超额下注被跟注后，如何在河牌圈游戏诈唬牌", "en": "PFC SRP OOP How To Play Rivers After Turn Overbet Probe - Bluffs", "q": "避坑提醒与行动项", "clues": ["DGL", "post-flop", "40%"], "a": ["本视频是 DGL 系列第 73 集，属于翻后（post-flop）策略的进阶内容，承接了之前关于翻前范围构建和转牌圈下注策略的讨论。讲师强调河牌圈理论通常不被单独讲解，因此本视频为玩家提供了一个难得的基线框架，后续可结合具体对手类型和牌面结构进行更深入的剥削性调整研究。", "**行动项与常见错误清单：**", "- 在转牌超额下注被跟注后，河牌圈所有诈唬手牌类别的持续下注频率应保持在 40% 左右，这是接近平衡的频率。", "- 确保转牌圈价值牌比例合理，避免过度快打价值牌，否则河牌圈 40% 诈唬频率会导致诈唬不足。", "- 根据对手倾向、牌面纹理和自身范围强弱调整诈唬频率：范围弱时少诈唬，范围强时多诈唬。", "- 不要认为不同手牌类别（如错失顺子 vs 错失同花）在河牌圈的诈唬频率应有显著差异——数据显示它们几乎一致。"], "note": ""}, {"id": "DGL#74-intro", "ep": "74", "type": "intro", "topic": "DGL#74 - 翻前单次加注底池、不利位置跟注者：如何玩转过牌-过牌-下注（X-X-B）线路中的诈唬", "en": "PFC SRP OOP How To Play The X-X-B Line - Bluffs", "q": "DGL#74 - 翻前单次加注底池、不利位置跟注者：如何玩转过牌-过牌-下注（X-X-B）线路中的诈唬", "clues": ["SRP", "OOP", "MDA"], "a": ["本视频聚焦于翻前单次加注底池（SRP）中，作为翻前跟注者处于不利位置（OOP）时，如何应对“过牌-过牌-下注”（X-X-B）这条线路上的诈唬频率控制问题。讲师指出，这条线路是MDA（人群数据聚合分析）中最容易被过度诈唬的线路之一，无论是鱼玩家还是常规玩家都普遍存在这一问题。其根本原因在于，当你走到河牌时，你的范围往往非常弱，而诈唬频率需要被严格约束。", "讲师通过GTO求解器数据展示了具体的频率数值：在X-X-B线路中，当你持有“错失同花听牌、错失顺子听牌、错失高张、垃圾牌”这些牌型时，整体诈唬频率只能维持在27%左右，这意味着你需要在73%的时间里选择放弃。视频进一步拆分了不同牌型之间的细微差异，并给出了简化的频率分桶建议，帮助玩家在实际游戏中更接近平衡状态。"], "note": ""}, {"id": "DGL#74-s0", "ep": "74", "type": "topic", "topic": "DGL#74 - 翻前单次加注底池、不利位置跟注者：如何玩转过牌-过牌-下注（X-X-B）线路中的诈唬", "en": "PFC SRP OOP How To Play The X-X-B Line - Bluffs", "q": "线路背景与过度诈唬现象", "clues": ["MDA"], "a": ["X-X-B线路（翻牌过牌、转牌过牌、河牌下注）是MDA数据中显示最容易被过度诈唬的线路之一，鱼玩家和常规玩家都存在这一问题。", "产生这一现象的原因在于：你走到河牌时的范围非常弱，且需要对这些弱牌进行严格的频率控制，而大多数玩家缺乏这种纪律性。", "讲师强调，这条线路要做到平衡非常困难，但通过数据可以明确看到正确的频率基准。"], "note": ""}, {"id": "DGL#74-s1", "ep": "74", "type": "topic", "topic": "DGL#74 - 翻前单次加注底池、不利位置跟注者：如何玩转过牌-过牌-下注（X-X-B）线路中的诈唬", "en": "PFC SRP OOP How To Play The X-X-B Line - Bluffs", "q": "整体诈唬频率基准", "clues": ["39%", "27%", "73%"], "a": ["在X-X-B线路中，用全部范围下注的整体频率为39%，但这是包含价值牌和诈唬牌的总频率。", "当只看“错失同花听牌、错失顺子听牌、错失高张、错失垃圾牌”这些纯诈唬牌型时，河牌诈唬频率仅为27%。", "这意味着持有这些牌时，你需要在73%的时间里选择过牌放弃，才能保持范围平衡。", "这是一个“巨大”的发现，也是该线路被过度诈唬的核心原因——玩家拿到弱牌后总想诈唬，但正确做法是四分之三的时间都选择放弃。"], "note": ""}, {"id": "DGL#74-s2", "ep": "74", "type": "topic", "topic": "DGL#74 - 翻前单次加注底池、不利位置跟注者：如何玩转过牌-过牌-下注（X-X-B）线路中的诈唬", "en": "PFC SRP OOP How To Play The X-X-B Line - Bluffs", "q": "具体牌例：必须过牌的情况", "clues": [], "a": ["牌例1：手持J♣5♣，翻牌面为K-Q-7-2-A（河牌A），你必须过牌。", "牌例2：手持7♦4♦，翻牌面为K-5-2-9-2（河牌为2），你必须过牌。", "牌例3：手持7♠6♠，翻牌面为K-Q-9-4-5，你大部分时候也必须过牌。", "这些例子说明，即使你拿着看似有顺子或同花听牌潜力的牌，在X-X-B线路中也不能随意诈唬。"], "note": ""}, {"id": "DGL#74-s3", "ep": "74", "type": "topic", "topic": "DGL#74 - 翻前单次加注底池、不利位置跟注者：如何玩转过牌-过牌-下注（X-X-B）线路中的诈唬", "en": "PFC SRP OOP How To Play The X-X-B Line - Bluffs", "q": "不同牌型间的频率差异", "clues": ["27%", "25%", "34%"], "a": ["错失同花听牌：诈唬频率略高于27%的平均值，因为这类牌拥有更好的阻挡牌——对手在更早街巷应该会用同花听牌阻挡牌进行诈唬，因此你持有这些牌时对手更不可能有同花。", "错失垃圾牌：诈唬频率略低，约为25%。", "错失顺子听牌：诈唬频率最高，可达34%，但即便如此，你仍然需要在三分之二的时间里选择过牌。", "讲师指出，这些差异在实际游戏中可以忽略不计，你可以将它们归为同一类处理，但需要知道它们之间存在细微差别。"], "note": ""}, {"id": "DGL#74-s4", "ep": "74", "type": "topic", "topic": "DGL#74 - 翻前单次加注底池、不利位置跟注者：如何玩转过牌-过牌-下注（X-X-B）线路中的诈唬", "en": "PFC SRP OOP How To Play The X-X-B Line - Bluffs", "q": "简化频率分桶建议", "clues": ["20%", "25%", "40%"], "a": ["讲师给出了一个简化的操作方案：将所有错失牌型统一放入20%频率桶中即可。", "如果你想要更精确一点，可以使用25%频率桶。", "如果你追求极度精确，可以将错失顺子听牌单独放入40%频率桶，其余所有错失牌型放入20%频率桶。", "这样处理能让你在X-X-B线路中更接近平衡范围，避免过度诈唬。"], "note": ""}, {"id": "DGL#74-s5", "ep": "74", "type": "topic", "topic": "DGL#74 - 翻前单次加注底池、不利位置跟注者：如何玩转过牌-过牌-下注（X-X-B）线路中的诈唬", "en": "PFC SRP OOP How To Play The X-X-B Line - Bluffs", "q": "更多牌例与频率控制", "clues": [], "a": ["牌例4：手持K9（翻牌面K-Q-10-4-Q，河牌Q），你最终需要过牌。", "牌例5：手持T♦（翻牌面K-Q-7，转牌4♣），即使转牌过牌后河牌是空白牌，你仍然需要大部分时候过牌。", "牌例6：手持97o，面对最小加注防守，翻牌转牌都过牌后，在空白河牌上仍需控制频率。", "这些例子反复强调同一个原则：在X-X-B线路中，弱牌的默认动作是过牌，而不是诈唬。"], "note": ""}, {"id": "DGL#74-c1", "ep": "74", "type": "cloze", "topic": "DGL#74 - 翻前单次加注底池、不利位置跟注者：如何玩转过牌-过牌-下注（X-X-B）线路中的诈唬", "en": "PFC SRP OOP How To Play The X-X-B Line - Bluffs", "q": "用全部范围下注的整体频率为＿＿，但这是包含价值牌和诈唬牌的总频率。", "clues": [], "a": ["在X-X-B线路中，用全部范围下注的整体频率为39%，但这是包含价值牌和诈唬牌的总频率。"], "note": "39%"}, {"id": "DGL#74-c3", "ep": "74", "type": "cloze", "topic": "DGL#74 - 翻前单次加注底池、不利位置跟注者：如何玩转过牌-过牌-下注（X-X-B）线路中的诈唬", "en": "PFC SRP OOP How To Play The X-X-B Line - Bluffs", "q": "错失同花听牌：诈唬频率略高于＿＿的平均值，因为这类牌拥有更好的阻挡牌——对手在更早街巷应该会用同花听牌阻挡牌进行诈唬，", "clues": [], "a": ["错失同花听牌：诈唬频率略高于27%的平均值，因为这类牌拥有更好的阻挡牌——对手在更早街巷应该会用同花听牌阻挡牌进行诈唬，因此你持有这些牌时对手更不可能有同花。"], "note": "27%"}, {"id": "DGL#74-c4", "ep": "74", "type": "cloze", "topic": "DGL#74 - 翻前单次加注底池、不利位置跟注者：如何玩转过牌-过牌-下注（X-X-B）线路中的诈唬", "en": "PFC SRP OOP How To Play The X-X-B Line - Bluffs", "q": "讲师给出了一个简化的操作方案：将所有错失牌型统一放入＿＿频率桶中即可。", "clues": [], "a": ["讲师给出了一个简化的操作方案：将所有错失牌型统一放入20%频率桶中即可。"], "note": "20%"}, {"id": "DGL#74-note", "ep": "74", "type": "note", "topic": "DGL#74 - 翻前单次加注底池、不利位置跟注者：如何玩转过牌-过牌-下注（X-X-B）线路中的诈唬", "en": "PFC SRP OOP How To Play The X-X-B Line - Bluffs", "q": "避坑提醒与行动项", "clues": ["DGL", "MDA", "GTO"], "a": ["本视频是DGL系列第74期，聚焦于翻前单次加注底池中不利位置跟注者的河牌诈唬频率控制。视频内容建立在MDA数据与GTO求解器分析之上，属于进阶策略内容，适合已经掌握基础翻前范围和翻后下注尺度的玩家学习。后续可以进一步研究X-X-B线路中的价值下注频率、阻挡牌选择以及对手剥削性调整的应对方式。", "**行动项与常见错误提醒：**", "- 应该这样做：在X-X-B线路中，持有错失听牌或垃圾牌时，默认过牌，仅在约20%-27%的频率下选择诈唬。", "- 应该这样做：将错失顺子听牌单独放入40%频率桶，其余错失牌型放入20%频率桶，以更精确地平衡范围。", "- 不要这样做：不要因为拿到看似有诈唬潜力的牌（如错失同花听牌或顺子听牌）就随意下注，必须严格遵循频率控制。", "- 不要这样做：不要忽视阻挡牌的价值——错失同花听牌比错失垃圾牌拥有更好的阻挡效果，可以略微提高诈唬频率。"], "note": ""}, {"id": "DGL#75-intro", "ep": "75", "type": "intro", "topic": "DGL#75 - 翻前单次加注底池、不利位置过牌-过牌-下注线路中的坚果牌处理", "en": "PFC SRP OOP X-X-B Line - Nuts", "q": "DGL#75 - 翻前单次加注底池、不利位置过牌-过牌-下注线路中的坚果牌处理", "clues": ["SRP", "OOP", "GTO"], "a": ["本视频聚焦于一个特定翻后场景：翻前单次加注底池（SRP），我方处于不利位置（OOP）作为翻前跟注者，对手在有利位置加注。翻牌圈和转牌圈双方均过牌，行动来到河牌圈，我方持有坚果类牌型（两对及以上），需要决定下注还是过牌。讲师强调，虽然不推荐在河牌圈机械追求GTO平衡，但必须建立基线认知，再根据对手倾向调整。", "视频核心是使用手牌频率启发式工具（Hand Class Frequency Heuristic）来确定该线路下强牌的合理下注-过牌比例。通过求解器计算，两对以上牌型在此线路中约72%的频率应下注，对应最接近的简化分桶为80-20或75-25。讲师给出了明确的慢打频率建议（20-25%），并解释了在实际对抗中应偏向慢打的原因。", "内容框架清晰：先说明线路背景与平衡基线的重要性，再展示求解器计算结果，最后给出实践调整建议。视频篇幅短小精悍，核心结论明确，适合作为该系列中关于河牌圈坚果牌处理策略的快速参考。"], "note": ""}, {"id": "DGL#75-s0", "ep": "75", "type": "topic", "topic": "DGL#75 - 翻前单次加注底池、不利位置过牌-过牌-下注线路中的坚果牌处理", "en": "PFC SRP OOP X-X-B Line - Nuts", "q": "线路定义与背景", "clues": ["SRP", "OOP", "Flop", "Turn"], "a": ["本视频分析的线路为：翻前单次加注底池（SRP），我方作为翻前跟注者处于不利位置（OOP），对手在有利位置（IP）加注。", "翻牌圈（Flop）双方过牌，转牌圈（Turn）双方再次过牌，行动来到河牌圈（River）。", "此线路简称为“过牌-过牌-下注”（Check-Check-Bet）线路，即X-X-B Line。", "视频聚焦于该线路中，我方持有最强牌型（两对及以上，Two Pair Plus）时的最优处理方式。"], "note": ""}, {"id": "DGL#75-s1", "ep": "75", "type": "topic", "topic": "DGL#75 - 翻前单次加注底池、不利位置过牌-过牌-下注线路中的坚果牌处理", "en": "PFC SRP OOP X-X-B Line - Nuts", "q": "平衡基线的重要性", "clues": ["GTO", "fast play", "slow play"], "a": ["讲师明确表示：不推荐在河牌圈机械追求GTO平衡，但建立基线理解至关重要。", "基线的作用是让你知道“什么是平衡”，然后根据个人判断和对手倾向调整策略。", "如果你倾向于更激进（fast play）或更保守（slow play），可以自行调整，但必须从基线出发。", "基线理解是后续剥削性调整（exploitative adjustment）的前提。"], "note": ""}, {"id": "DGL#75-s2", "ep": "75", "type": "topic", "topic": "DGL#75 - 翻前单次加注底池、不利位置过牌-过牌-下注线路中的坚果牌处理", "en": "PFC SRP OOP X-X-B Line - Nuts", "q": "求解器计算结果", "clues": ["Heuristic", "Next Action Step", "72%", "80%"], "a": ["使用手牌频率启发式工具（Hand Class Frequency Heuristic），筛选该线路中两对以上牌型。", "点击“下一步行动”（Next Action Step）后，求解器计算得出：两对以上牌型在此线路中约72%的频率应下注。", "72%最接近的简化分桶为80-20桶：即80%下注、20%过牌。", "若使用更简化的0.25倍数分桶，则归入75%桶：75%下注、25%过牌。", "结论：该线路中坚果牌型的慢打频率应为20-25%。"], "note": ""}, {"id": "DGL#75-s3", "ep": "75", "type": "topic", "topic": "DGL#75 - 翻前单次加注底池、不利位置过牌-过牌-下注线路中的坚果牌处理", "en": "PFC SRP OOP X-X-B Line - Nuts", "q": "实践调整建议", "clues": ["fast play", "position player", "regulars", "fish"], "a": ["针对此特定线路，讲师建议在实际游戏中主要采用慢打策略（mostly slow playing）。", "理由一：激进快打（fast play）会导致对手过度弃牌（massive over fold），损失价值。", "理由二：过牌可以利用有利位置玩家（position player）的过度诈唬倾向（over bluffing tendencies）。", "大多数常规玩家（regulars）和娱乐玩家（fish）在“过牌-过牌-下注”线路中都会过度诈唬。", "因此，实际游戏中应偏向慢打，而非理论上的75-25或80-20比例。"], "note": ""}, {"id": "DGL#75-s4", "ep": "75", "type": "topic", "topic": "DGL#75 - 翻前单次加注底池、不利位置过牌-过牌-下注线路中的坚果牌处理", "en": "PFC SRP OOP X-X-B Line - Nuts", "q": "理论基线与实践调整的关系", "clues": ["GTO", "player profile"], "a": ["理论基线（75-25或80-20）适用于：想要接近GTO策略，或作为调整的起点。", "实践调整方向：根据具体对手画像（player profile）进行个性化分析后，再决定偏离基线的方向与幅度。", "本视频的核心信息：先掌握理论基线，再根据实际情况调整，而非盲目追求平衡。"], "note": ""}, {"id": "DGL#75-c2", "ep": "75", "type": "cloze", "topic": "DGL#75 - 翻前单次加注底池、不利位置过牌-过牌-下注线路中的坚果牌处理", "en": "PFC SRP OOP X-X-B Line - Nuts", "q": "求解器计算得出：两对以上牌型在此线路中约＿＿的频率应下注。", "clues": [], "a": ["点击“下一步行动”（Next Action Step）后，求解器计算得出：两对以上牌型在此线路中约72%的频率应下注。"], "note": "72%"}, {"id": "DGL#75-note", "ep": "75", "type": "note", "topic": "DGL#75 - 翻前单次加注底池、不利位置过牌-过牌-下注线路中的坚果牌处理", "en": "PFC SRP OOP X-X-B Line - Nuts", "q": "避坑提醒与行动项", "clues": ["DGL", "blocker", "bluff frequency"], "a": ["本视频属于DGL系列（#75），聚焦于翻前单次加注底池中特定过牌线路的河牌圈处理。该系列似乎以“手牌频率启发式”为核心方法论，帮助玩家快速建立各类场景的基线策略。本视频内容简短，但结论明确，适合与系列中其他关于河牌圈下注尺度、阻挡牌（blocker）运用、以及不同位置对抗策略的视频配合学习。", "值得进一步学习的方向包括：如何根据具体对手的河牌圈诈唬频率（bluff frequency）精确调整慢打比例；不同公共牌结构（如对子牌面、三同花牌面）对该线路的影响；以及当自己处于有利位置时，面对对手过牌-过牌-下注线路的应对策略。", "**行动项与常见错误：**", "- 应该做：在“过牌-过牌-下注”线路中，用两对以上牌型保持20-25%的慢打频率作为基线。", "- 应该做：实际游戏中优先考虑慢打，利用对手过度诈唬的倾向获取额外价值。", "- 不要做：在河牌圈机械追求GTO平衡，忽视对手的实际倾向。", "- 不要做：在该线路中过度快打坚果牌，导致对手过度弃牌、损失价值。"], "note": ""}, {"id": "DGL#76-intro", "ep": "76", "type": "intro", "topic": "DGL#76 - 翻前加注者有利位置三枪诈唬：频率启发式", "en": "PFR 3BP IP Triple Barrel Bluff - Frequency Heuristic", "q": "DGL#76 - 翻前加注者有利位置三枪诈唬：频率启发式", "clues": ["PFR", "double barrel", "40%"], "a": ["本视频聚焦于一个具体场景：翻前加注者（PFR）在有利位置（IP）进入三人底池，翻牌圈和转牌圈连续下注（double barrel）后，河牌圈持有未成手牌时，应如何决定是否继续第三枪诈唬（triple barrel bluff）。讲师通过数据筛选，给出了一个清晰的频率基线：整体上，这类未成手牌在河牌圈应以约40%的频率继续下注，60%的频率过牌放弃。", "视频强调，虽然不推荐在河牌圈追求绝对平衡，但理解这一基线频率至关重要，因为它为玩家在特定情况下进行剥削性偏离（exploitative deviation）提供了参照系。讲师进一步拆分了不同手牌类别（如错过的超对、错过的顺子听牌、错过的同花听牌、A高牌等）的具体频率，发现它们大多落在40%的“桶”内，从而简化了执行策略。", "最后，视频通过多个具体牌例（如A♠J♠、A♠3♠、A♠5♠）展示了在实际牌局中如何应用这一频率启发式，并特别指出不要对错过的同花听牌过于被动，它们同样需要以约40%的频率进行三枪诈唬。"], "note": ""}, {"id": "DGL#76-s0", "ep": "76", "type": "topic", "topic": "DGL#76 - 翻前加注者有利位置三枪诈唬：频率启发式", "en": "PFR 3BP IP Triple Barrel Bluff - Frequency Heuristic", "q": "视频主题与核心问题", "clues": ["balanced", "baseline", "deviate"], "a": ["本视频回答的核心问题：作为翻前加注者，在有利位置进入三人底池，翻牌和转牌连续下注后，河牌圈拿到未成手牌时，应该以多高的频率继续“扣动扳机”（即第三枪诈唬）。", "讲师明确建议：不推荐在河牌圈追求绝对平衡（balanced），但理解基线频率（baseline）非常重要，因为它是你进行任何偏离（deviate）决策的基础。"], "note": ""}, {"id": "DGL#76-s1", "ep": "76", "type": "topic", "topic": "DGL#76 - 翻前加注者有利位置三枪诈唬：频率启发式", "en": "PFR 3BP IP Triple Barrel Bluff - Frequency Heuristic", "q": "数据筛选与整体频率", "clues": ["BTN", "double barrel", "missed trash", "missed overs"], "a": ["数据筛选条件：按钮位（BTN）对劫位（HJ）的三人底池（3BP），翻牌和转牌均下注（double barrel），河牌圈面临诈唬或过牌决策。", "手牌筛选范围：河牌圈未成手牌，具体包括错过的垃圾牌（missed trash）、错过的超对（missed overs）、错过的顺子听牌（missed straight draw）、错过的同花听牌（missed flush draw）以及A高牌（ace high）。", "整体频率结论：所有未成手牌在河牌圈呈现40-60的分配——即40%继续下注诈唬，60%过牌放弃。若要保持平衡，应放弃60%的诈唬牌。", "重要警示：如果你诈唬频率超过40%，且转牌圈的价值下注（value bet）范围合理，那么你就是在过度诈唬（overbluffing）。这揭示了扑克中过度诈唬是多么容易发生。"], "note": ""}, {"id": "DGL#76-s2", "ep": "76", "type": "topic", "topic": "DGL#76 - 翻前加注者有利位置三枪诈唬：频率启发式", "en": "PFR 3BP IP Triple Barrel Bluff - Frequency Heuristic", "q": "各手牌子类别的频率差异", "clues": ["Missed Overs", "Ace High", "Missed Trash", "38%"], "a": ["错过的超对（Missed Overs）：38-62分配，即38%下注、62%过牌，基本落入40%的“桶”。", "错过的顺子听牌（Missed Straight Draw）：36%下注、64%过牌，同样落在40%的桶内。", "A高牌（Ace High）：下注频率比其他类别高约10%，但若简化为桶系统，仍可归入40%的桶。", "错过的垃圾牌（Missed Trash）：48%下注、52%过牌，频率略高，但仍在40%桶的范围内。", "错过的同花听牌（Missed Flush Draw）：通常被认为应非常被动，但数据表明，你仍应以约40%的相同频率进行诈唬。"], "note": ""}, {"id": "DGL#76-s3", "ep": "76", "type": "topic", "topic": "DGL#76 - 翻前加注者有利位置三枪诈唬：频率启发式", "en": "PFR 3BP IP Triple Barrel Bluff - Frequency Heuristic", "q": "具体牌例与执行", "clues": ["blasting off", "low board", "don", "be too shy"], "a": ["牌例一：A♠J♠，翻牌面为T♥8♣5♦2♠（转牌2），直接三枪诈唬（blasting off）。", "牌例二：A♠3♠，翻牌面为Q♥T♣6♦，三枪诈唬。", "牌例三：A♠5♠，翻牌面为Q♥T♣6♦，从低牌面（low board）三枪诈唬。", "讲师强调：不要对错过的同花听牌过于害羞（don't be too shy），它们在全球范围内也需要约40%的时间进行三枪诈唬。", "执行总结：将所有未成手牌整体保留40%的诈唬频率，就能在河牌圈三枪诈唬上实现非常平衡的执行。"], "note": ""}, {"id": "DGL#76-c1", "ep": "76", "type": "cloze", "topic": "DGL#76 - 翻前加注者有利位置三枪诈唬：频率启发式", "en": "PFR 3BP IP Triple Barrel Bluff - Frequency Heuristic", "q": "整体频率结论：所有未成手牌在河牌圈呈现40-60的分配——即＿＿继续下注诈唬，", "clues": [], "a": ["整体频率结论：所有未成手牌在河牌圈呈现40-60的分配——即40%继续下注诈唬，60%过牌放弃。若要保持平衡，应放弃60%的诈唬牌。"], "note": "40%"}, {"id": "DGL#76-c2", "ep": "76", "type": "cloze", "topic": "DGL#76 - 翻前加注者有利位置三枪诈唬：频率启发式", "en": "PFR 3BP IP Triple Barrel Bluff - Frequency Heuristic", "q": "错过的超对（Missed Overs）：38-62分配，即＿＿下注、62%过牌，基本落入40%的“桶”。", "clues": [], "a": ["错过的超对（Missed Overs）：38-62分配，即38%下注、62%过牌，基本落入40%的“桶”。"], "note": "38%"}, {"id": "DGL#76-c3", "ep": "76", "type": "cloze", "topic": "DGL#76 - 翻前加注者有利位置三枪诈唬：频率启发式", "en": "PFR 3BP IP Triple Barrel Bluff - Frequency Heuristic", "q": "讲师强调：不要对错过的同花听牌过于害羞（don't be too shy），它们在全球范围内也需要约＿＿的时间进行三枪诈唬。", "clues": [], "a": ["讲师强调：不要对错过的同花听牌过于害羞（don't be too shy），它们在全球范围内也需要约40%的时间进行三枪诈唬。"], "note": "40%"}, {"id": "DGL#76-note", "ep": "76", "type": "note", "topic": "DGL#76 - 翻前加注者有利位置三枪诈唬：频率启发式", "en": "PFR 3BP IP Triple Barrel Bluff - Frequency Heuristic", "q": "避坑提醒与行动项", "clues": ["DGL", "BTN", "40%"], "a": ["本视频是DGL系列（#76）的一部分，聚焦于翻前加注者在有利位置、三人底池中的河牌圈诈唬决策。它提供了一个基于频率的启发式方法，帮助玩家在复杂局面中快速做出合理选择。视频的核心价值在于给出了一个可量化的基线（40%），玩家可以据此评估自己的实际诈唬频率是否偏离，并据此进行针对性调整。", "值得进一步学习的方向包括：转牌圈的价值下注范围如何影响河牌圈的诈唬频率、不同位置组合（如CO对BTN、SB对BB）下的频率差异，以及如何根据对手的跟注倾向进行剥削性偏离。", "- 应该这样做：在翻前加注者、有利位置、三人底池、翻牌转牌连续下注后，河牌圈持有未成手牌时，以约40%的频率继续诈唬，60%过牌放弃。", "- 不要这样做：不要对所有未成手牌都无差别地持续诈唬——那将导致过度诈唬；也不要对错过的同花听牌过于被动，它们同样需要约40%的诈唬频率。"], "note": ""}, {"id": "DGL#77-intro", "ep": "77", "type": "intro", "topic": "DGL#77 - 转牌圈行动：扑克中最困难的动作——转牌加注策略深度解析", "en": "Turn Play The Most Difficult Action In Poker - Turn Raises", "q": "DGL#77 - 转牌圈行动：扑克中最困难的动作——转牌加注策略深度解析", "clues": ["Turn Raise", "GTO", "Solver"], "a": ["本视频聚焦于扑克中最难掌握的动作之一——转牌圈加注（Turn Raise）。讲师通过对比GTO求解器（Solver）与人类玩家的统计数据，揭示了人类在转牌加注频率上的巨大偏差，并指出这是多数玩家在牌局中难以实现无剥削（Unexploitable）策略的关键短板。视频的核心论点是：人类玩家普遍缺乏足够的转牌加注，根源在于未能遵循GTO的几大支柱原则。", "讲师首先展示了其数据库中的统计数据，对比了机器人（Bots）与人类学生在不同底池大小、不同位置下的转牌加注频率，数据差异极为显著。随后，他通过多个具体牌例，详细讲解了转牌加注的正确时机与手牌选择，包括如何用强牌慢打（Slow Play）以保留转牌加注范围，以及如何用听牌（Draws）进行过牌加注（Check-Raise）诈唬。最后，讲师特别强调了面对对手转牌圈反主动下注（Donk Bet）时，建立加注范围的重要性。", "视频的核心观点是：转牌加注是区分优秀玩家与普通玩家的关键领域。大多数玩家在转牌加注上表现糟糕，如果你能精通此道，就能在玩家池中获得显著优势。讲师通过求解器演示了在特定牌面下，即使是一些看似边缘的牌型（如A6、65）也需要进行高频率或低频率的加注，以保持范围的平衡与剥削能力。"], "note": ""}, {"id": "DGL#77-s0", "ep": "77", "type": "topic", "topic": "DGL#77 - 转牌圈行动：扑克中最困难的动作——转牌加注策略深度解析", "en": "Turn Play The Most Difficult Action In Poker - Turn Raises", "q": "转牌加注的统计数据差异", "clues": ["Bots", "Small Pots", "Large Pots", "vs 13"], "a": ["讲师展示了其数据库中的统计数据，对比了机器人（Bots）与人类学生在转牌加注频率上的差异。数据分为四类：小底池（Small Pots）转牌加注（分有位置和无位置）以及大底池（Large Pots）转牌加注（分有位置和无位置）。", "机器人（Bots）的数据为：小底池有位置加注频率8.9，无位置14；大底池有位置12，无位置13。", "人类学生（被视为高于平均水平的玩家）的数据为：小底池有位置4.8，无位置8.5；大底池有位置6.95，无位置0.6。", "对比可见，人类在转牌加注频率上远低于求解器，尤其是在大底池无位置的情况下（0.6 vs 13），差异极为显著。讲师强调，即使是被认为高于平均水平的玩家，在转牌加注上也存在巨大漏洞。"], "note": ""}, {"id": "DGL#77-s1", "ep": "77", "type": "topic", "topic": "DGL#77 - 转牌圈行动：扑克中最困难的动作——转牌加注策略深度解析", "en": "Turn Play The Most Difficult Action In Poker - Turn Raises", "q": "转牌加注不足的根本原因", "clues": ["Pillars of GTO", "Slow Play Top", "of Your Range", "Flop"], "a": ["讲师指出，人类玩家无法找到正确转牌加注频率的主要原因在于未能遵循GTO的“支柱原则”（Pillars of GTO）。", "第一大支柱是“慢打你的顶端范围”（Slow Play Top of Your Range）。许多人在翻牌圈（Flop）过于激进地快打（Fast Play）自己的强牌，导致进入转牌圈时，他们的范围中缺乏足够的强牌来支持加注。", "第二大支柱与听牌的使用有关。用于转牌圈过牌加注的高权益听牌（High Equity Draws），如果也在翻牌圈被过度快打，同样会导致转牌圈缺乏可用的诈唬加注组合。", "如果在翻牌圈的范围构成（Range Composition）出现错误，转牌圈的范围构成必然会被扭曲，导致加注频率失衡，从而影响整体的不可剥削性。"], "note": ""}, {"id": "DGL#77-s2", "ep": "77", "type": "topic", "topic": "DGL#77 - 转牌圈行动：扑克中最困难的动作——转牌加注策略深度解析", "en": "Turn Play The Most Difficult Action In Poker - Turn Raises", "q": "用听牌构建转牌加注范围", "clues": ["Straight Draw", "Check-Raise", "Calling Range", "Solver"], "a": ["讲师通过一个具体牌例说明如何用听牌进行转牌加注：盲注位对抗，翻前有人开局加注，翻牌为J♠J♥8♦，转牌发出4♣。", "手持65（非同花或同花）这样的6高顺子听牌（Straight Draw），在某些情况下应该选择过牌加注（Check-Raise），而不是总是跟注。", "如果总是用这类牌跟注，会导致两个问题：一是跟注范围（Calling Range）变得过弱；二是会缺乏转牌圈的过牌加注组合，使整体策略失衡。", "讲师展示了求解器（Solver）在此类牌面下，会用65进行非常大尺度的过牌加注，以平衡范围并保持攻击性。"], "note": ""}, {"id": "DGL#77-s3", "ep": "77", "type": "topic", "topic": "DGL#77 - 转牌圈行动：扑克中最困难的动作——转牌加注策略深度解析", "en": "Turn Play The Most Difficult Action In Poker - Turn Raises", "q": "用强牌慢打构建转牌加注范围", "clues": ["Top and Bottom", "Pair", "Villain"], "a": ["与听牌相对，强牌也需要在转牌圈进行慢打，以等待对手下注后再进行加注。讲师举例手持A6，在某个牌面（如A♠6♦3♣2♠）形成顶对带底对（Top and Bottom Pair）。", "在这种情况下，有时应该选择慢打转牌，等待对手（Villain）投入更多筹码后，再发动过牌加注。", "这种策略的目的是保留强牌在转牌圈的加注范围，避免在翻牌圈过早暴露牌力，从而在转牌圈获得更大的价值。"], "note": ""}, {"id": "DGL#77-s4", "ep": "77", "type": "topic", "topic": "DGL#77 - 转牌圈行动：扑克中最困难的动作——转牌加注策略深度解析", "en": "Turn Play The Most Difficult Action In Poker - Turn Raises", "q": "面对反主动下注的转牌加注", "clues": ["Donk Bet"], "a": ["讲师重点讲解了在转牌圈面对对手反主动下注（Donk Bet）时的应对策略，尤其是在大底池且有位置的情况下。他指出，有位置的转牌加注往往比无位置更难找到，但面对Donk Bet时，必须建立加注范围。", "牌例一：翻牌为J♦9♣3♠，转牌为9♥（配对转牌）。翻牌圈有人下注，转牌圈有人Donk Bet小注，手持J9（顶两对）的玩家选择进行大额加注。", "牌例二：翻牌为9♣8♦3♠，转牌为6♣。翻牌圈有人下注，A5跟注。转牌圈对手Donk Bet，手持A5（带一张高张和同花听牌）的玩家被“迫使”进行加注诈唬。", "讲师强调，许多玩家在面对小注Donk Bet时，会错误地认为应该比面对过牌时打得更被动。虽然确实应该更被动，但不应过度，仍然需要保留一定的加注频率。求解器显示，即使面对小注Donk，也需要用A5这类牌进行加注。"], "note": ""}, {"id": "DGL#77-s5", "ep": "77", "type": "topic", "topic": "DGL#77 - 转牌圈行动：扑克中最困难的动作——转牌加注策略深度解析", "en": "Turn Play The Most Difficult Action In Poker - Turn Raises", "q": "求解器在转牌加注中的激进表现", "clues": ["Donk Bet", "River", "Pot", "All-in"], "a": ["讲师展示了求解器在面对转牌圈Donk Bet时的极端激进策略，包括在河牌圈（River）进行2倍底池（2x Pot）的全下（All-in）。", "牌例：翻牌为9♦8♣3♠2♦，手持A6。翻牌圈A6以低频率进行超池下注（Over Bet），被跟注。转牌发出5♠，对手选择在转牌圈Donk Bet（针对同花完成牌面）。", "求解器会用A6进行诈唬加注（Bluff Raise），即使转牌并未帮助A6，也会利用其阻挡牌（Blockers）和坚果听牌的可能性进行攻击。如果河牌幸运地击中一对，则可能获得额外价值。", "讲师总结道，如果不熟悉求解器在面对Donk Bet时的行为，人类玩家很容易因为不熟悉而降低加注频率，从而被剥削。"], "note": ""}, {"id": "DGL#77-note", "ep": "77", "type": "note", "topic": "DGL#77 - 转牌圈行动：扑克中最困难的动作——转牌加注策略深度解析", "en": "Turn Play The Most Difficult Action In Poker - Turn Raises", "q": "避坑提醒与行动项", "clues": ["DGL", "GTO", "Donk Bet"], "a": ["本视频是DGL系列（#77）中的一讲，重点在于转牌圈加注这一高难度动作。讲师通过数据对比和求解器演示，强调了转牌加注在GTO策略中的核心地位，并指出这是多数玩家与顶级玩家之间的主要差距所在。视频内容承接了之前关于翻牌圈范围构建和慢打原则的讨论，并进一步深入到转牌圈的复杂决策。", "值得进一步学习的方向包括：深入研究求解器在各类转牌牌面（如配对牌面、同花完成牌面、顺子完成牌面）上的加注频率与尺度；学习如何根据对手的Donk Bet频率调整自己的加注范围；以及如何在实战中平衡价值加注与诈唬加注的比例，以实现不可剥削的策略。", "**行动项与常见错误：**", "- **应该这样做：** 在转牌圈用强牌（如顶对带底对）进行慢打，保留加注范围，等待对手下注后再加注。", "- **应该这样做：** 在转牌圈用高权益听牌（如顺子听牌、同花听牌）进行过牌加注，以平衡范围并增加诈唬组合。", "- **应该这样做：** 面对对手转牌圈的Donk Bet时，即使下注尺度很小，也需要建立并执行加注范围，避免过度被动。", "- **不要这样做：** 不要在翻牌圈过度快打强牌或听牌，否则会导致转牌圈范围失衡，缺乏必要的加注组合。", "- **不要这样做：** 不要因为对手Donk Bet尺度小就大幅降低自己的加注频率，求解器显示即使面对小注Donk，也需要保持一定的攻击性。"], "note": ""}, {"id": "DGL#78-intro", "ep": "78", "type": "intro", "topic": "翻牌圈打法：剥削性策略还是理论导向策略？", "en": "Flop Play Should You Play Exploitatively or Theory Oriented", "q": "翻牌圈打法：剥削性策略还是理论导向策略？", "clues": ["Hand of History", "Flop", "exploitative"], "a": ["本视频由会员GM在Hand of History论坛分享的一手牌引发，围绕翻牌圈（Flop）策略展开讨论。核心问题是：在翻牌圈应该采用剥削性（exploitative）策略、简化策略还是理论导向（theory-oriented）策略？讲师指出，翻牌圈本身的选择并不重要，真正决定盈利水平的是后续街（转牌和河牌）的范围执行能力。", "视频通过一手具体牌例（BTN位口袋K，翻牌K9832）分析了翻牌过牌、转牌面对2倍底池超池下注、河牌弃牌的全过程，并深入探讨了翻牌策略与后续街执行之间的关系。讲师强调，无论选择哪种翻牌策略，都必须具备应对后续街各种局面的能力，否则简化策略反而是更优选择。", "视频还讨论了在100NL级别与500NL以上级别中，简化策略与复杂策略的适用性差异，以及如何通过研究转牌探针下注（probe）的跟注阈值来提升应对能力。最终结论是：翻牌本身不是问题，问题在于你是否准备好应对翻牌决策带来的后续局面。"], "note": ""}, {"id": "DGL#78-s0", "ep": "78", "type": "topic", "topic": "翻牌圈打法：剥削性策略还是理论导向策略？", "en": "Flop Play Should You Play Exploitatively or Theory Oriented", "q": "翻牌策略与盈利无直接关联", "clues": [], "a": ["翻牌策略（无论是剥削性、简化还是理论导向）与玩家整体盈利能力之间不应存在显著相关性。翻牌本身不是决定玩家水平高低的关键因素。", "选择理论导向、简化或剥削性的翻牌打法都可以接受，前提是你必须清楚自己在做什么，并且能够应对后续街的复杂局面。", "翻牌单独来看并不重要，它甚至是最不重要的决策点之一。真正重要的是翻牌后你如何执行你的范围策略，尤其是转牌和河牌节点。"], "note": ""}, {"id": "DGL#78-s1", "ep": "78", "type": "topic", "topic": "翻牌圈打法：剥削性策略还是理论导向策略？", "en": "Flop Play Should You Play Exploitatively or Theory Oriented", "q": "翻牌决策的真正关键：后续街执行", "clues": [], "a": ["如果你在翻牌选择理论导向打法，你必须知道如何驾驭后续街，尤其是那些如果你采用简化策略就不会进入的节点。", "如果你在翻牌选择剥削性打法，你必须清楚剥削的理由是什么，以及如何应对因翻牌决策而进入的后续局面。", "翻牌决策本身在EV上几乎无法判断优劣，因为翻牌下注的EV高度依赖于被跟注、被加注、转牌河牌的发牌以及对手的反应。"], "note": ""}, {"id": "DGL#78-s2", "ep": "78", "type": "topic", "topic": "翻牌圈打法：剥削性策略还是理论导向策略？", "en": "Flop Play Should You Play Exploitatively or Theory Oriented", "q": "口袋K翻牌过牌案例分析", "clues": ["BTN", "King 9832", "K9832", "hero"], "a": ["牌例：BTN位手持口袋K（K♠K♦），SB弃牌，BB跟注。翻牌K♠9♠8♦3♦（原文为King 9832，应为K9832，含两张同花听牌面），hero选择过牌。", "讲师观点：口袋K在这张牌面上应该是极高频率下注甚至纯下注（pure bet）的牌，尤其是手持方块K时。hero选择过牌说明他要么在简化策略（如80%下注20%过牌），要么出于某种剥削性理由，但hero并未提及任何剥削性理由。", "hero提到他结合了高RNG（随机化）和对手是激进玩家的因素，决定过牌。但讲师认为这不是合理的剥削性理由。"], "note": ""}, {"id": "DGL#78-s3", "ep": "78", "type": "topic", "topic": "翻牌圈打法：剥削性策略还是理论导向策略？", "en": "Flop Play Should You Play Exploitatively or Theory Oriented", "q": "转牌面对2倍底池超池下注的决策", "clues": ["pot", "hero", "monitor democrat", "KQo"], "a": ["转牌发出后，对手超池下注2倍底池（2x pot），hero选择跟注。讲师和monitor democrat都认为这是一个错误。", "理由：转牌是双花顺听牌完成的牌面，hero手持口袋K阻挡了对手几乎所有合理的诈唬组合，包括带方块或草花的KQo、KTo等卡顺+花顺阻挡牌组合。", "对手的范围是权益驱动的，人们会过度快打强牌，不会混合太多听牌。hero阻挡了诈唬组合但不阻挡任何价值组合，面对2倍底池的下注，这是一个相对容易的弃牌。"], "note": ""}, {"id": "DGL#78-s4", "ep": "78", "type": "topic", "topic": "翻牌圈打法：剥削性策略还是理论导向策略？", "en": "Flop Play Should You Play Exploitatively or Theory Oriented", "q": "翻牌过牌的EV依赖性与实践选择", "clues": ["probe"], "a": ["翻牌过牌的EV高度依赖于对手探针下注（probe）的频率、面对加注时的弃牌/跟注比例、以及探针转牌后河牌的下注频率等因素。", "翻牌下注的EV则依赖于被跟注后、被加注后、转牌河牌发牌后的各种情况。理论上两者EV应非常接近，实践中几乎不可能知道哪个更优。", "因此，选择你感觉最舒服的翻牌策略完全没问题，关键是后续街的执行能力。"], "note": ""}, {"id": "DGL#78-s5", "ep": "78", "type": "topic", "topic": "翻牌圈打法：剥削性策略还是理论导向策略？", "en": "Flop Play Should You Play Exploitatively or Theory Oriented", "q": "简化翻牌策略的误区与正确解法", "clues": ["thresholds"], "a": ["有人用“你不熟悉面对探针下注”来为简化翻牌策略辩护，但正确的做法不是逃避，而是学习如何应对转牌探针下注。", "应对方法并不难：只需研究各个底池赔率下，最弱需要跟注的手牌阈值（thresholds），即“什么牌力在什么底池赔率下必须跟注”。", "随着级别提升（如500NL以上），学习驾驭不同线路比过度简化、只专注于单一游戏树节点要有利得多。"], "note": ""}, {"id": "DGL#78-s6", "ep": "78", "type": "topic", "topic": "翻牌圈打法：剥削性策略还是理论导向策略？", "en": "Flop Play Should You Play Exploitatively or Theory Oriented", "q": "不同级别下的策略选择建议", "clues": [], "a": ["在100NL级别，采用简化策略、完全不打翻牌过牌这条线路是完全可以接受的，不会有任何问题。", "在500NL及以上级别，讲师个人建议熟悉更多线路，能够玩更复杂的打法，避免过于简化而被对手针对。", "如果想从常规玩家身上榨取更多优势，熟悉不同的翻牌后线路（尤其是转牌河牌的复杂节点）是绝对必要的。"], "note": ""}, {"id": "DGL#78-s7", "ep": "78", "type": "topic", "topic": "翻牌圈打法：剥削性策略还是理论导向策略？", "en": "Flop Play Should You Play Exploitatively or Theory Oriented", "q": "本手牌的最终结论", "clues": ["hero"], "a": ["本手牌中，问题不在于翻牌过牌还是下注，而在于hero不知道如何应对转牌的2倍底池超池下注。", "转牌跟注是错误的，应该弃牌。hero没有预见到这个局面，导致做出了亏损的跟注。", "真正的解决方案是提升面对转牌探针下注的能力，而不是简单地简化翻牌策略。"], "note": ""}, {"id": "DGL#78-c2", "ep": "78", "type": "cloze", "topic": "翻牌圈打法：剥削性策略还是理论导向策略？", "en": "Flop Play Should You Play Exploitatively or Theory Oriented", "q": "hero选择过牌说明他要么在简化策略（如＿＿下注20%过牌），", "clues": [], "a": ["讲师观点：口袋K在这张牌面上应该是极高频率下注甚至纯下注（pure bet）的牌，尤其是手持方块K时。hero选择过牌说明他要么在简化策略（如80%下注20%过牌），要么出于某种剥削性理由，但hero并未提及任何剥削性理由。"], "note": "80%"}, {"id": "DGL#78-note", "ep": "78", "type": "note", "topic": "翻牌圈打法：剥削性策略还是理论导向策略？", "en": "Flop Play Should You Play Exploitatively or Theory Oriented", "q": "避坑提醒与行动项", "clues": ["DGL", "blocker"], "a": ["本视频是DGL系列第78期，承接了之前关于翻牌圈策略的讨论，并引出了后续街执行能力这一核心主题。视频通过具体牌例展示了翻牌决策与后续街之间的紧密联系，强调了“翻牌不重要，后续街执行才重要”的核心观点。值得进一步学习的方向包括：转牌探针下注的跟注阈值研究、不同翻牌策略下的范围构建、以及如何在不同级别中平衡简化与复杂性。", "**行动项与常见错误：**", "- 应该做：在翻牌选择策略时，先评估自己是否具备应对后续街局面的能力；如果不具备，简化翻牌策略是合理选择。", "- 应该做：研究转牌探针下注的跟注阈值，提升面对超池下注时的决策能力。", "- 应该做：在500NL以上级别，逐步熟悉更多复杂线路，避免过于简化。", "- 不要做：不要因为翻牌策略本身而过度纠结，翻牌决策的EV差异远小于后续街执行的影响。", "- 不要做：不要用“不熟悉探针下注”作为简化翻牌策略的借口，正确做法是学习应对方法。", "- 不要做：不要忽视阻挡牌（blocker）在决策中的重要性，尤其是在面对超池下注时。"], "note": ""}, {"id": "DGL#79-intro", "ep": "79", "type": "intro", "topic": "DGL#79 - 4-Bet底池有利位置三枪诈唬频率解析", "en": "PFR 4BP IP Triple Barreling Bluffing Frequency", "q": "DGL#79 - 4-Bet底池有利位置三枪诈唬频率解析", "clues": ["Bet Pot", "Triple Barreling", "BTN"], "a": ["本视频聚焦于4-Bet底池（4-Bet Pot）中，作为有利位置（IP）玩家在翻牌、转牌、河牌连续下注（Triple Barreling）时的诈唬频率问题。讲师通过分析100万手“按钮位（BTN）对抗小盲位（SB）”的4-Bet底池数据库，专门筛选出“翻牌下注-跟注、转牌下注-跟注、河牌对手过牌”的行动线，统计不同牌型类别（如错过的超牌、错过的顺子听牌、错过的同花听牌等）在河牌圈的全下或放弃频率，为玩家提供一个清晰的基准频率参考。", "核心观点是：在4-Bet底池中，由于河牌圈底池筹码比（SPR）极低（通常只有底池的25%-40%），整体诈唬全下频率应显著高于其他场景。讲师给出的基准数字是：当你带着任意未成对牌或阻挡牌到达河牌时，应整体全下约60%的诈唬牌。不同牌型类别虽有细微差异（如错过的垃圾牌全下70%，错过的同花听牌全下约50%），但基本都可四舍五入到60%这一“基准桶”。讲师强调，虽然不建议在河牌圈完全按理论（GTO）打牌，但掌握这些基准频率能帮助玩家避免过度诈唬或诈唬不足的常见错误。", "视频还深入解释了为何某些牌型（如错过的中等连张同花牌）是更好的诈唬候选：因为它们不阻挡对手的弃牌范围，且与对手偏重Broadway牌的跟注范围互动较少。最后，讲师指出错过的同花听牌是玩家最容易产生认知失调的类别，但数据显示应全下约50%的频率，并建议将其四舍五入到60%以保持整体平衡。"], "note": ""}, {"id": "DGL#79-s0", "ep": "79", "type": "topic", "topic": "DGL#79 - 4-Bet底池有利位置三枪诈唬频率解析", "en": "PFR 4BP IP Triple Barreling Bluffing Frequency", "q": "4-Bet底池IP三枪的SPR特点", "clues": ["Bet", "SPR", "40%", "25%"], "a": ["在4-Bet底池中，作为有利位置玩家，经过翻牌和转牌连续下注后，河牌圈剩余筹码通常不足底池的1/3，最多为底池的40%，一般在25%-40%之间。", "这种极低的SPR直接导致河牌圈诈唬全下频率显著高于其他底池类型，因为剩余筹码量使得全下成为更自然、更具压迫力的下注尺度。"], "note": ""}, {"id": "DGL#79-s1", "ep": "79", "type": "topic", "topic": "DGL#79 - 4-Bet底池有利位置三枪诈唬频率解析", "en": "PFR 4BP IP Triple Barreling Bluffing Frequency", "q": "整体诈唬全下基准频率", "clues": ["58%", "60%"], "a": ["在“翻牌下注-跟注、转牌下注-跟注、河牌对手过牌”的三枪行动线中，数据库显示整体全下频率为58%，四舍五入后即为60%。", "结论：当你带着任意未成对牌或阻挡牌到达河牌时，应整体全下约60%的诈唬牌。这是需要牢记的基准数字，用于校准自己的诈唬频率，避免过度或不足。"], "note": ""}, {"id": "DGL#79-s2", "ep": "79", "type": "topic", "topic": "DGL#79 - 4-Bet底池有利位置三枪诈唬频率解析", "en": "PFR 4BP IP Triple Barreling Bluffing Frequency", "q": "各牌型类别的具体频率", "clues": ["Missed Overcards", "Ace Highs", "Missed Trash", "55%"], "a": ["错过的超牌（Missed Overcards）：全下频率55%，接近60%基准桶。", "A高牌（Ace Highs）：全下频率57%，与60%基准桶基本一致。", "错过的顺子听牌（Missed Straight Draws）：全下频率63%，仍可四舍五入到60%桶。", "错过的垃圾牌（Missed Trash）：全下频率最高，达70%，是诈唬频率最高的类别。", "错过的同花听牌（Missed Flush Draws）：全下频率最低，为52%-48%，平均约50%，但建议四舍五入到60%桶以保持平衡。"], "note": ""}, {"id": "DGL#79-s3", "ep": "79", "type": "topic", "topic": "DGL#79 - 4-Bet底池有利位置三枪诈唬频率解析", "en": "PFR 4BP IP Triple Barreling Bluffing Frequency", "q": "错过的垃圾牌为何是最好诈唬牌", "clues": ["J9s", "T8s", "Q9s", "Bet"], "a": ["错过的垃圾牌通常指中等连张同花牌，如J9s、T8s、Q9s、98s等，这些牌在4-Bet底池翻前出现频率较低，容易被玩家忽视。", "这些牌成为最佳诈唬候选的原因：它们不阻挡对手的弃牌范围（即对手弃牌范围中很少包含这些中等牌），且与对手偏重Broadway牌的跟注范围互动最少。", "对手的跟注范围通常非常偏重Broadway牌（如AK、AQ、KQ等），而中等牌（如9、8、T）与这些牌的互动较少，因此这些牌作为诈唬更有效。"], "note": ""}, {"id": "DGL#79-s4", "ep": "79", "type": "topic", "topic": "DGL#79 - 4-Bet底池有利位置三枪诈唬频率解析", "en": "PFR 4BP IP Triple Barreling Bluffing Frequency", "q": "错过的同花听牌的认知失调", "clues": ["50%", "60%"], "a": ["错过的同花听牌（如A♦K♦在河牌方片未出现时）是玩家最容易产生认知失调的类别：玩家常因担心对手有同花听牌而不敢诈唬。", "数据显示，错过的同花听牌应全下约50%的频率，例如A♥K♥在T♠6♣3♦2♦Q♠河牌圈（红桃未出现）时应以一定频率全下。", "后门同花听牌（如A♦K♦在方片未出现时）更容易让玩家说服自己全下，但前门同花听牌（如A♥K♥在红桃未出现时）也应在适当频率下全下，以保持平衡。", "讲师建议将错过的同花听牌全下频率四舍五入到60%桶，这样所有牌型类别都能统一到60%基准，整体保持超级平衡。"], "note": ""}, {"id": "DGL#79-s5", "ep": "79", "type": "topic", "topic": "DGL#79 - 4-Bet底池有利位置三枪诈唬频率解析", "en": "PFR 4BP IP Triple Barreling Bluffing Frequency", "q": "河牌圈全下的具体牌例", "clues": [], "a": ["例1：A♦K♦在翻牌T♠6♣3♦、转牌2♦、河牌Q♠（方片未出现）时，应全下诈唬。", "例2：A♥K♥在翻牌T♠8♣5♦、转牌6♣、河牌K♠（红桃未出现且河牌出现A或K等超牌）时，应全下诈唬。", "这些牌例说明，即使同花听牌未完成，只要河牌出现对诈唬有利的牌面（如超牌），就应继续全下。"], "note": ""}, {"id": "DGL#79-s6", "ep": "79", "type": "topic", "topic": "DGL#79 - 4-Bet底池有利位置三枪诈唬频率解析", "en": "PFR 4BP IP Triple Barreling Bluffing Frequency", "q": "基准频率的实用建议", "clues": ["GTO", "60%"], "a": ["讲师明确表示不推荐在河牌圈完全按理论（GTO）打牌，但强调掌握基准频率的重要性，因为这是玩家容易困惑的领域（“我该不该诈唬？我是否过度诈唬或诈唬不足？”）。", "基准频率60%是校准自己诈唬频率的起点，实际游戏中可根据对手倾向和具体牌面进行调整，但不应偏离此基准过远。", "所有牌型类别（错过的超牌、A高、错过的顺子听牌、错过的垃圾牌、错过的同花听牌）都可四舍五入到60%桶，这样整体诈唬频率将非常平衡。"], "note": ""}, {"id": "DGL#79-c0", "ep": "79", "type": "cloze", "topic": "DGL#79 - 4-Bet底池有利位置三枪诈唬频率解析", "en": "PFR 4BP IP Triple Barreling Bluffing Frequency", "q": "河牌圈剩余筹码通常不足底池的1/3，最多为底池的＿＿，一般在25%-40%之间。", "clues": [], "a": ["在4-Bet底池中，作为有利位置玩家，经过翻牌和转牌连续下注后，河牌圈剩余筹码通常不足底池的1/3，最多为底池的40%，一般在25%-40%之间。"], "note": "40%"}, {"id": "DGL#79-c1", "ep": "79", "type": "cloze", "topic": "DGL#79 - 4-Bet底池有利位置三枪诈唬频率解析", "en": "PFR 4BP IP Triple Barreling Bluffing Frequency", "q": "数据库显示整体全下频率为＿＿，四舍五入后即为60%。", "clues": [], "a": ["在“翻牌下注-跟注、转牌下注-跟注、河牌对手过牌”的三枪行动线中，数据库显示整体全下频率为58%，四舍五入后即为60%。"], "note": "58%"}, {"id": "DGL#79-c2", "ep": "79", "type": "cloze", "topic": "DGL#79 - 4-Bet底池有利位置三枪诈唬频率解析", "en": "PFR 4BP IP Triple Barreling Bluffing Frequency", "q": "错过的超牌（Missed Overcards）：全下频率＿＿，", "clues": [], "a": ["错过的超牌（Missed Overcards）：全下频率55%，接近60%基准桶。"], "note": "55%"}, {"id": "DGL#79-note", "ep": "79", "type": "note", "topic": "DGL#79 - 4-Bet底池有利位置三枪诈唬频率解析", "en": "PFR 4BP IP Triple Barreling Bluffing Frequency", "q": "避坑提醒与行动项", "clues": ["DGL", "Bet", "J9s"], "a": ["本视频是DGL系列（#79）的一部分，专注于4-Bet底池的有利位置三枪诈唬策略。视频基于1百万手真实数据库分析，提供了可量化的基准频率，适合希望系统化提升河牌圈诈唬决策的玩家。建议结合前序视频（如4-Bet底池翻前范围构建、翻牌圈持续下注频率等）学习，以形成完整的4-Bet底池策略框架。", "**行动项与常见错误：**", "- 应该做：在4-Bet底池IP三枪行动线中，河牌圈全下约60%的诈唬牌（包括错过的超牌、A高、顺子听牌、垃圾牌、同花听牌）。", "- 应该做：将错过的垃圾牌（如J9s、T8s、Q9s、98s）作为最高频率的诈唬牌（约70%全下），因为它们不阻挡对手弃牌范围。", "- 应该做：错过的同花听牌（如A♦K♦）也应以约50%频率全下，并建议四舍五入到60%以保持平衡。", "- 不要做：因担心对手有同花听牌而完全放弃用错过的同花听牌诈唬，数据显示应全下约一半频率。", "- 不要做：在河牌圈诈唬频率显著偏离60%基准（如低于40%或高于80%），除非有明确的剥削性理由。"], "note": ""}, {"id": "DGL#80-intro", "ep": "80", "type": "intro", "topic": "DGL#80 - 4-Bet底池中作为不利位置跟注者，过牌-跟注-过牌-下注线路的诈唬频率", "en": "PFC 4BP OOP Bluffing Frequency in XC-X-B", "q": "DGL#80 - 4-Bet底池中作为不利位置跟注者，过牌-跟注-过牌-下注线路的诈唬频率", "clues": ["bet", "OOP", "GTO solver"], "a": ["本视频聚焦于4-bet底池中，作为翻前跟注方且处于不利位置（OOP）时，在“翻牌过牌-跟注，转牌双方过牌，河牌行动”这一特定线路下的诈唬频率分配问题。讲师通过GTO solver数据，将诈唬牌型分为A高牌、空气牌和错失听牌（含错失顺子听牌与错失同花听牌）三类，分别统计其最优诈唬频率，并给出具体的行动指导。", "核心结论是：在汇总层面，该场景下总诈唬频率应为40%，但不同牌型的诈唬频率差异显著——空气牌和错失听牌应诈唬约50%，而A高牌仅应诈唬约27%。讲师强调，玩家常对错失同花听牌是否诈唬存在认知失调，而数据表明应半诈唬半过牌。最后，讲师建议在实战中可基于剥削视角调整频率，但需保留部分诈唬组合以避免策略过于明显。"], "note": ""}, {"id": "DGL#80-s0", "ep": "80", "type": "topic", "topic": "DGL#80 - 4-Bet底池中作为不利位置跟注者，过牌-跟注-过牌-下注线路的诈唬频率", "en": "PFC 4BP OOP Bluffing Frequency in XC-X-B", "q": "3.1 场景定义与筛选条件", "clues": ["bet", "OOP", "Ace High", "Air"], "a": ["适用场景：4-bet底池中，作为翻前跟注方且处于不利位置（OOP），翻牌圈过牌后对手下注、我们跟注，转牌双方均过牌，河牌需要决定是否诈唬。", "诈唬牌型筛选：仅统计A高牌（Ace High）、空气牌（Air）和错失同花听牌（Miss Flush Draws）三类作为诈唬候选。", "翻牌圈策略背景：该场景下我们本身价值牌不多，因为翻牌圈会用大量价值牌进行过牌-加注（check-raise），且对手范围在低SPR情况下仍可能慢打转牌，因此对手范围未封顶。"], "note": ""}, {"id": "DGL#80-s1", "ep": "80", "type": "topic", "topic": "DGL#80 - 4-Bet底池中作为不利位置跟注者，过牌-跟注-过牌-下注线路的诈唬频率", "en": "PFC 4BP OOP Bluffing Frequency in XC-X-B", "q": "3.2 汇总诈唬频率：40-60分配", "clues": ["float", "underbluff", "40%", "60%"], "a": ["关键数据：在汇总层面，A高牌、空气牌和错失同花听牌三类牌型的平均诈唬频率为40%，即40%诈唬、60%过牌。", "频率分布原因：A高牌在范围中占比极高，因为翻牌圈会用大量A高牌进行漂浮跟注（float），这拉低了整体诈唬频率。", "实战调整建议：若想剥削对手，可降低汇总诈唬频率至20%（underbluff），但仍保留部分诈唬组合，避免策略过于明显被对手快速察觉。"], "note": ""}, {"id": "DGL#80-s2", "ep": "80", "type": "topic", "topic": "DGL#80 - 4-Bet底池中作为不利位置跟注者，过牌-跟注-过牌-下注线路的诈唬频率", "en": "PFC 4BP OOP Bluffing Frequency in XC-X-B", "q": "3.3 空气牌诈唬频率：50-50", "clues": ["50%"], "a": ["空气牌定义：包括错失顺子听牌（missed straight draws）及其他翻牌圈漂浮的组合。", "关键数据：空气牌的诈唬频率为50%，即一半诈唬、一半过牌。", "决策原则：空气牌应比A高牌更频繁地诈唬，这是平衡策略的基础频率。"], "note": ""}, {"id": "DGL#80-s3", "ep": "80", "type": "topic", "topic": "DGL#80 - 4-Bet底池中作为不利位置跟注者，过牌-跟注-过牌-下注线路的诈唬频率", "en": "PFC 4BP OOP Bluffing Frequency in XC-X-B", "q": "3.4 A高牌诈唬频率：27%", "clues": ["27%"], "a": ["关键数据：A高牌的诈唬频率仅为27%，显著低于空气牌。", "具体牌例：A♦J♦（翻牌Q♣9♣5♦，转牌空白，河牌全下）；A♥J♥（翻牌Q♣6♣6♦，转牌3♣，河牌4♦，空白牌面全下）；A♣Q♦（河牌黑桃完成同花时全下）；A♣Q♦（河牌黑桃未完成时全下）。", "决策原则：高踢脚A高牌（如AQ、AJ）应低频诈唬，仅约27%时全下，其余时间过牌。"], "note": ""}, {"id": "DGL#80-s4", "ep": "80", "type": "topic", "topic": "DGL#80 - 4-Bet底池中作为不利位置跟注者，过牌-跟注-过牌-下注线路的诈唬频率", "en": "PFC 4BP OOP Bluffing Frequency in XC-X-B", "q": "3.5 错失同花听牌诈唬频率：50%", "clues": ["50%", "27%"], "a": ["关键数据：所有错失同花听牌（包括A高同花听牌）的诈唬频率为50%。", "认知失调说明：讲师指出，玩家通常对“是否用错失同花听牌诈唬”存在认知失调，但数据明确显示应一半时间诈唬、一半时间过牌。", "与A高牌对比：错失同花听牌虽包含A高牌，但其诈唬频率（50%）远高于纯A高牌（27%），说明听牌结构对诈唬决策有显著影响。"], "note": ""}, {"id": "DGL#80-s5", "ep": "80", "type": "topic", "topic": "DGL#80 - 4-Bet底池中作为不利位置跟注者，过牌-跟注-过牌-下注线路的诈唬频率", "en": "PFC 4BP OOP Bluffing Frequency in XC-X-B", "q": "3.6 平衡与剥削的调整框架", "clues": ["bet", "exploitative", "50%", "25%"], "a": ["基础频率总结：空气牌和错失同花听牌约50%诈唬，A高牌约25%诈唬（视频中具体为27%）。", "剥削调整原则：不必极端地“总是诈唬”或“从不诈唬”，可在40%汇总频率与20%汇总频率之间选择中间值，以平衡剥削效果与策略隐蔽性。", "场景特殊性：由于4-bet底池出现频率低，且该线路不常发生，讲师建议采用更偏向剥削（exploitative）的视角，但需牢记上述基础频率作为基准。"], "note": ""}, {"id": "DGL#80-c1", "ep": "80", "type": "cloze", "topic": "DGL#80 - 4-Bet底池中作为不利位置跟注者，过牌-跟注-过牌-下注线路的诈唬频率", "en": "PFC 4BP OOP Bluffing Frequency in XC-X-B", "q": "A高牌、空气牌和错失同花听牌三类牌型的平均诈唬频率为＿＿，", "clues": [], "a": ["关键数据：在汇总层面，A高牌、空气牌和错失同花听牌三类牌型的平均诈唬频率为40%，即40%诈唬、60%过牌。"], "note": "40%"}, {"id": "DGL#80-c2", "ep": "80", "type": "cloze", "topic": "DGL#80 - 4-Bet底池中作为不利位置跟注者，过牌-跟注-过牌-下注线路的诈唬频率", "en": "PFC 4BP OOP Bluffing Frequency in XC-X-B", "q": "关键数据：空气牌的诈唬频率为＿＿，即一半诈唬、一半过牌。", "clues": [], "a": ["关键数据：空气牌的诈唬频率为50%，即一半诈唬、一半过牌。"], "note": "50%"}, {"id": "DGL#80-c3", "ep": "80", "type": "cloze", "topic": "DGL#80 - 4-Bet底池中作为不利位置跟注者，过牌-跟注-过牌-下注线路的诈唬频率", "en": "PFC 4BP OOP Bluffing Frequency in XC-X-B", "q": "关键数据：A高牌的诈唬频率仅为＿＿，显著低于空气牌。", "clues": [], "a": ["关键数据：A高牌的诈唬频率仅为27%，显著低于空气牌。"], "note": "27%"}, {"id": "DGL#80-note", "ep": "80", "type": "note", "topic": "DGL#80 - 4-Bet底池中作为不利位置跟注者，过牌-跟注-过牌-下注线路的诈唬频率", "en": "PFC 4BP OOP Bluffing Frequency in XC-X-B", "q": "避坑提醒与行动项", "clues": ["DGL", "bet", "OOP"], "a": ["本视频属于DGL系列第80期，聚焦于4-bet底池中OOP跟注方的河牌诈唬频率分配，是系列中关于“过牌-跟注-过牌-下注”线路的专项分析。视频内容建立在GTO solver数据之上，适合已掌握4-bet底池基础策略、希望深入理解河牌平衡与剥削调整的玩家。后续可进一步学习翻牌圈过牌-加注范围的构建、转牌慢打策略，以及不同SPR下对手范围封顶程度的判断。", "**行动项与常见错误：**", "- 应做：空气牌和错失同花听牌在河牌约50%诈唬，A高牌约27%诈唬。", "- 应做：若选择剥削性调整，可降低汇总诈唬频率至20%，但保留部分诈唬组合。", "- 应做：根据对手倾向选择underbluff或overbluff，但避免极端化策略。", "- 不应做：用高踢脚A高牌（如AQ、AJ）高频诈唬，应低频处理。", "- 不应做：因认知失调而完全放弃错失同花听牌的诈唬，应保持50%的诈唬频率。"], "note": ""}, {"id": "DGL#81-intro", "ep": "81", "type": "intro", "topic": "DGL#81 手牌复盘：紧范围场景中的阻挡牌效应", "en": "Hand Review Blocker Effects in Tight Range Spots", "q": "DGL#81 手牌复盘：紧范围场景中的阻挡牌效应", "clues": ["blocker effects", "tight range", "GTO"], "a": ["本视频通过一手具体手牌复盘，深入讲解阻挡牌效应（blocker effects）在紧范围（tight range）场景中的理论重要性。讲师使用 GTO 求解器（Iosolver）展示：在翻牌后多条街的下注场景中，看似同类的抓诈唬牌（bluff catcher）会因阻挡牌差异而拥有截然不同的期望值（EV），并由此引出“对手诈唬时应针对特定区域构建范围”的核心理论。", "视频的核心观点是：当对手的诈唬范围被构建为使某一特定牌力区域（如 10x）达到无差别（indifferent）时，那些对价值范围有强阻挡、但对诈唬范围几乎无阻挡的牌（如 QJ）会变得极其有利可图。讲师通过数学计算（alpha 值、组合数）量化了这一效应，并提醒观众：理论上的高 EV 并不直接等同于实战中应该无脑跟注，还需考虑人口倾向（population tendencies）等实践因素。", "视频内容框架清晰：先呈现手牌过程，再引入理论概念，接着用求解器数据与数学计算验证，最后讨论理论与实践的联系与区别，并预告后续“红线”系列将讨论实践中的剥削性调整。"], "note": ""}, {"id": "DGL#81-s0", "ep": "81", "type": "topic", "topic": "DGL#81 手牌复盘：紧范围场景中的阻挡牌效应", "en": "Hand Review Blocker Effects in Tight Range Spots", "q": "手牌过程与决策背景", "clues": ["Michael", "regular", "bet", "jam"], "a": ["会员 Michael 在 CO 位（关位）用 Q♦J♦（方片QJ）开局加注，被常规玩家（regular）3-bet（再加注），Michael 跟注，两人进入翻牌圈。", "翻牌为 Q♠Q♥T♣（彩虹面），按钮位对手持续下注（c-bet）30% 底池，Michael 跟注。", "转牌为 3♣，对手再次下注 75% 底池（three-quarter pot），Michael 继续跟注。", "河牌为 9♠，对手全下（jam），Michael 选择弃牌。视频讨论这一弃牌在理论上是否正确。"], "note": ""}, {"id": "DGL#81-s1", "ep": "81", "type": "topic", "topic": "DGL#81 手牌复盘：紧范围场景中的阻挡牌效应", "en": "Hand Review Blocker Effects in Tight Range Spots", "q": "同类牌不同 EV 的引入", "clues": ["ATo"], "a": ["讲师指出：有些牌虽然相对价值相同（不击败任何价值牌，只能击败诈唬），但 EV 差异巨大，原因正是阻挡牌效应。", "以 ATo（非同花AT）与 Q♦J♦ 为例：两者在河牌面对全下时相对价值相同（都只赢诈唬），但 ATo 的 EV 为 0，而 Q♦J♦ 跟注的 EV 高达 29 个大盲（BB），是非常有利可图的跟注。"], "note": ""}, {"id": "DGL#81-s2", "ep": "81", "type": "topic", "topic": "DGL#81 手牌复盘：紧范围场景中的阻挡牌效应", "en": "Hand Review Blocker Effects in Tight Range Spots", "q": "阻挡牌对对手价值范围的削减", "clues": ["full house", "4%"], "a": ["讲师强调：对手（按钮位）在河牌被允许用 QJ 全下，但仅限于持有 Q♦ 的情况。因为 Q♦ 阻挡了 Q♦T♦（方片QT）这一组合，从而阻挡了对手的一个葫芦（full house）组合。", "具体数据：Q♦J♦ 相比 Q♠J♠（黑桃QJ）有超过 4% 的权益提升，原因正是对 Q♦T♦ 的阻挡。", "若你持有 Q♦J♦，对手的诈唬范围中不可能再有 QJ，因此你只输给更好的牌，或赢一些随机的诈唬牌。"], "note": ""}, {"id": "DGL#81-s3", "ep": "81", "type": "topic", "topic": "DGL#81 手牌复盘：紧范围场景中的阻挡牌效应", "en": "Hand Review Blocker Effects in Tight Range Spots", "q": "对手构建范围的核心理念", "clues": ["bluff catcher", "indifferent", "triple barrel", "ATo"], "a": ["讲师重申理论概念：当对手诈唬时，他需要针对你特定区域的抓诈唬牌（bluff catcher）来构建范围，使其达到无差别（indifferent）。", "在本手牌中，对手三枪下注（triple barrel）应针对你的 10x 区域（如 ATo、KTo、JTo、JJ）来构建，使这些牌在跟注与弃牌之间无差别，而不是针对你的三条（trips）区域。", "求解器结果显示：ATo、KTo、JTo 和 JJ 在面临全下时，都在跟注与弃牌之间无差别，这正是被针对的区域。"], "note": ""}, {"id": "DGL#81-s4", "ep": "81", "type": "topic", "topic": "DGL#81 手牌复盘：紧范围场景中的阻挡牌效应", "en": "Hand Review Blocker Effects in Tight Range Spots", "q": "数学计算：平衡范围与 alpha 值", "clues": ["combos", "alpha", "97.1%", "95.09%"], "a": ["对手（IP，即按钮位）的河牌下注范围为 11.7 个组合（combos），下注尺度为 97.1% 底池（约 0.971 倍底池）。", "价值区域（三条及以上）共 8 个组合，但其中 95.09% 被用于价值下注，因此实际价值组合为 8 × 0.9509 = 7.6 个。", "计算 alpha（诈唬与价值的平衡比例）：alpha = 下注尺度 / (1 + 下注尺度) = 0.971 / 1.971 = 0.4926。", "因此，为保持平衡，对手需要 7.6 × 0.4926 = 3.744 个诈唬组合，总下注组合数为 7.6 + 3.744 = 11.34 个，与求解器显示的 11.7 个组合基本一致（差异来自无阻挡视角）。"], "note": ""}, {"id": "DGL#81-s5", "ep": "81", "type": "topic", "topic": "DGL#81 手牌复盘：紧范围场景中的阻挡牌效应", "en": "Hand Review Blocker Effects in Tight Range Spots", "q": "不同手牌视角下的组合数感知", "clues": ["ATo", "JTo"], "a": ["从 K♣T♣（草花KT）的视角看，对手的下注范围变为 10.3 个组合，因为 KT 会阻挡部分 KQ、KJ 以及诈唬牌（如 K7、K6）。", "从 ATo、JTo、JJ 的视角看，对手的下注范围恰好是平衡的（即这些牌在跟注与弃牌之间无差别）。", "但从 QX（如 QJ）的视角看，由于对价值范围有强阻挡，对手的下注范围中诈唬比例大幅上升。"], "note": ""}, {"id": "DGL#81-s6", "ep": "81", "type": "topic", "topic": "DGL#81 手牌复盘：紧范围场景中的阻挡牌效应", "en": "Hand Review Blocker Effects in Tight Range Spots", "q": "QJ 的 EV 逆向工程与诈唬感知", "clues": ["over-bluffing", "29 BB", "68.5 BB", "97.1%"], "a": ["讲师逆向计算了 Q♦J♦ 跟注的 EV（约 29 BB），在底池 68.5 BB、下注尺度 97.1% 的情况下，Q♦J♦ 感知到对手的下注范围中有 47.3% 的诈唬。", "具体组合数：从 Q♦J♦ 的视角，对手的下注范围仅剩 7.6 个组合，其中 3.6 个诈唬组合、4 个价值组合（3.6 / 7.6 ≈ 47%）。", "对比无阻挡视角下的平衡范围（7.6 价值 + 3.74 诈唬），Q♦J♦ 几乎不阻挡诈唬范围，但将价值组合从 7.6 削减至 4 个（减少约 50%），导致其感知到对手严重过度诈唬（over-bluffing）。"], "note": ""}, {"id": "DGL#81-s7", "ep": "81", "type": "topic", "topic": "DGL#81 手牌复盘：紧范围场景中的阻挡牌效应", "en": "Hand Review Blocker Effects in Tight Range Spots", "q": "理论结论与实践警示", "clues": ["under-bluff", "29 BB"], "a": ["理论上，对手应构建使 10x 无差别的下注范围，此时 QJ 这类牌会变得极其有利可图（EV 高达 29 BB），尽管它只是抓诈唬牌。", "但讲师强调：不要因为理论 EV 高就认为“绝对不该弃牌”。实战中，对手是否真的按理论构建范围（使 10x 零 EV）是未知的。", "会员在帖子中提出“这条线是否 under-bluff（诈唬不足），我是否该弃掉弱三条”，讲师表示这将在未来的“红线”系列中回答，涉及人口倾向与剥削性调整。"], "note": ""}, {"id": "DGL#81-c0", "ep": "81", "type": "cloze", "topic": "DGL#81 手牌复盘：紧范围场景中的阻挡牌效应", "en": "Hand Review Blocker Effects in Tight Range Spots", "q": "按钮位对手持续下注（c-bet）＿＿ 底池，Michael 跟注。", "clues": [], "a": ["翻牌为 Q♠Q♥T♣（彩虹面），按钮位对手持续下注（c-bet）30% 底池，Michael 跟注。"], "note": "30%"}, {"id": "DGL#81-c2", "ep": "81", "type": "cloze", "topic": "DGL#81 手牌复盘：紧范围场景中的阻挡牌效应", "en": "Hand Review Blocker Effects in Tight Range Spots", "q": "具体数据：Q♦J♦ 相比 Q♠J♠（黑桃QJ）有超过 ＿＿ 的权益提升，", "clues": [], "a": ["具体数据：Q♦J♦ 相比 Q♠J♠（黑桃QJ）有超过 4% 的权益提升，原因正是对 Q♦T♦ 的阻挡。"], "note": "4%"}, {"id": "DGL#81-c4", "ep": "81", "type": "cloze", "topic": "DGL#81 手牌复盘：紧范围场景中的阻挡牌效应", "en": "Hand Review Blocker Effects in Tight Range Spots", "q": "下注尺度为 ＿＿ 底池（约 0.971 倍底池）。", "clues": [], "a": ["对手（IP，即按钮位）的河牌下注范围为 11.7 个组合（combos），下注尺度为 97.1% 底池（约 0.971 倍底池）。"], "note": "97.1%"}, {"id": "DGL#81-note", "ep": "81", "type": "note", "topic": "DGL#81 手牌复盘：紧范围场景中的阻挡牌效应", "en": "Hand Review Blocker Effects in Tight Range Spots", "q": "避坑提醒与行动项", "clues": ["Green Light", "GTO", "Red Line"], "a": ["本视频属于“绿灯”系列（Green Light），专注于 GTO 理论层面的分析，不涉及人口倾向或剥削性调整。讲师通过求解器与数学计算，清晰展示了阻挡牌效应在紧范围场景中的巨大影响，为观众理解“同类牌不同 EV”提供了量化框架。后续的“红线”系列（Red Line）将转向实践层面，讨论如何根据对手的实际倾向调整策略。", "值得进一步学习的方向包括：alpha 值的计算与平衡范围构建、不同下注尺度下的阻挡牌效应差异、以及如何在实战中识别对手是否过度诈唬或诈唬不足。建议结合求解器软件（如 Iosolver、PioSOLVER）进行模拟，加深对阻挡牌效应的直观理解。", "行动项与常见错误：", "- 不要仅凭理论 EV 高就盲目跟注，需结合对手的实际倾向（如是否诈唬不足）做决策。", "- 不要忽略阻挡牌效应：同相对价值的牌（如 ATo 与 QJ）可能因阻挡牌差异而 EV 天差地别。", "- 在分析对手范围时，应从具体手牌的视角计算组合数，而非仅看无阻挡的全局范围。", "- 记住：对手构建诈唬范围时应针对特定区域（如 10x），而非所有抓诈唬牌；识别这一区域有助于判断自己的牌是否被“针对”。"], "note": ""}, {"id": "DGL#82-intro", "ep": "82", "type": "intro", "topic": "DGL#82 手牌复盘：何时该用强牌慢打", "en": "Hand Review When to Slowplay a Strong Hand", "q": "DGL#82 手牌复盘：何时该用强牌慢打", "clues": ["David", "OOP", "GTO"], "a": ["本视频围绕一个由会员 David 提交的具体手牌展开，核心问题是：在河牌圈处于不利位置（OOP）且手持强牌（顺子）时，应该选择自己下注（快打）还是过牌诱捕（慢打）。讲师以口袋对子10（TT）为例，从理论（GTO）角度剖析了决定慢打与否的关键因素，并特别强调了阻挡牌（blocker）效应在河牌圈紧范围对抗中的决定性作用。", "视频的核心结论是：慢打并非单纯取决于手牌绝对强度，而在于你的手牌与对手范围之间的互动关系。具体而言，你需要判断自己的手牌是否阻挡了对手的跟注范围（若快打）或过牌范围（若慢打）。在本文的牌例中，TT 由于不阻挡对手的 A 高牌跟注范围，因此纯策略下注；而同为顺子的 ATo 由于同时阻挡了对手的跟注和过牌范围，则成为更优的慢打候选。", "此外，讲师还引入了范围强度对比的概念，指出当你的范围显著强于对手时，对手的过牌-加注（reopen）频率会很低，此时慢打的价值自然下降。视频通过求解器（solver）模拟数据，展示了在特定牌面下，只有具备 Ace 阻挡牌的组合（如 A5s、A4s）才适合慢打，其余两对以上牌力均选择快打。"], "note": ""}, {"id": "DGL#82-s0", "ep": "82", "type": "topic", "topic": "DGL#82 手牌复盘：何时该用强牌慢打", "en": "Hand Review When to Slowplay a Strong Hand", "q": "牌例回顾与问题提出", "clues": ["David", "UTG", "MaxiSuite 3-bet", "Flop"], "a": ["牌局背景：15NL（盲注级别），David 在 UTG（枪口）位手持 TT（口袋对子10）开局加注，对手 MaxiSuite 3-bet（再加注）至 6.8，David 跟注。", "翻牌（Flop）：A♠ 8♥ 7♦（彩虹面）。MaxiSuite 选择半池持续下注（c-bet），这在 3-bet 底池的 A 高牌面上非常少见，David 用 TT（含红桃）跟注。", "转牌（Turn）：9♠，双方过牌。", "河牌（River）：6♣，David 击中顺子（T-8-7-6-5 或 9-8-7-6-5，实际为 T-9-8-7-6 的顺子）。David 选择过牌，MaxiSuite 下注 3/4 底池，David 过牌-全下（check-jam），对手弃牌。", "David 的疑问：应该自己下注（快打）还是过牌诱捕（慢打）？他对 TT 在河牌纯下注感到惊讶，希望理解背后的理论依据。"], "note": ""}, {"id": "DGL#82-s1", "ep": "82", "type": "topic", "topic": "DGL#82 手牌复盘：何时该用强牌慢打", "en": "Hand Review When to Slowplay a Strong Hand", "q": "慢打的核心逻辑：对手是否会替你下注", "clues": ["interaction", "blocker effects"], "a": ["核心问题：当你手持强牌时，首先要问“对手是否会往底池里投钱？”如果答案是肯定的，慢打才有意义。", "判断依据：需要考虑范围与范围的互动（range versus range interaction），其中最重要的是阻挡牌效应（blocker effects）。", "在河牌圈的紧范围对抗中，阻挡牌效应的影响极其显著，因为每个范围只有 10-20 个组合，一张阻挡牌可能影响 3-4 个组合，占比巨大。"], "note": ""}, {"id": "DGL#82-s2", "ep": "82", "type": "topic", "topic": "DGL#82 手牌复盘：何时该用强牌慢打", "en": "Hand Review When to Slowplay a Strong Hand", "q": "范围强度对比：己方范围远强于对手", "clues": ["OOP", "sets", "two pairs", "straights"], "a": ["在本牌例中，经过翻牌跟注、转牌过牌后，己方（OOP）范围明显强于对手（IP）范围。", "己方范围包含更多暗三条（sets）、两对（two pairs）和顺子（straights），而对手范围则充满弱抓诈唬牌（weak bluff catchers）和一些放弃牌（give ups）。", "由于己方范围几乎没有空气牌，且对手范围较弱，理论上对手的过牌-加注（reopen）频率极低（仅 33%），这意味着慢打很难获得足够回报。", "结论：在范围强度差距大的情况下，快打是默认策略，除非有极强的阻挡牌效应。"], "note": ""}, {"id": "DGL#82-s3", "ep": "82", "type": "topic", "topic": "DGL#82 手牌复盘：何时该用强牌慢打", "en": "Hand Review When to Slowplay a Strong Hand", "q": "阻挡牌效应：快打与慢打的选择标准", "clues": [], "a": ["快打（自己下注）的条件：你的手牌不应阻挡对手的跟注范围。如果阻挡了跟注范围，被跟注的概率下降，快打价值降低。", "慢打（过牌诱捕）的条件：你的手牌应阻挡对手的过牌范围。如果阻挡了过牌范围，对手更可能下注，从而替你往底池投钱。", "理想情况：同时阻挡跟注范围和过牌范围，此时快打与慢打的 EV 相等。", "本牌例中，TT 不阻挡对手的跟注范围（对手用 A 高牌跟注），也不阻挡过牌范围（对手用 A 高牌过牌），因此 TT 缺乏慢打所需的阻挡牌属性，纯策略下注。"], "note": ""}, {"id": "DGL#82-s4", "ep": "82", "type": "topic", "topic": "DGL#82 手牌复盘：何时该用强牌慢打", "en": "Hand Review When to Slowplay a Strong Hand", "q": "ATo 与 TT 的对比：同强度不同策略", "clues": ["ATo", "A10", "pure bet"], "a": ["会员评论指出：ATo（非同花A10）似乎比 TT 更适合慢打，讲师确认这一观点完全正确。", "两者都是顺子，牌力相同，但阻挡牌效应截然不同：", "TT：不阻挡任何 A 高牌组合，因此不减少对手跟注或下注的频率。", "ATo：阻挡了对手的 A 高牌跟注范围（若下注），也阻挡了对手的 A 高牌过牌范围（若过牌），因此同时增加了对手下注的概率并减少了被跟注的概率，慢打属性更优。", "求解器模拟证实：TT 在河牌选择 3/4 底池下注为纯策略（pure bet），而 ATo 则大量选择慢打。"], "note": ""}, {"id": "DGL#82-s5", "ep": "82", "type": "topic", "topic": "DGL#82 手牌复盘：何时该用强牌慢打", "en": "Hand Review When to Slowplay a Strong Hand", "q": "求解器数据验证：TT 纯下注与 ATo 慢打", "clues": ["ATo", "100%"], "a": ["求解器对 TT 的河牌策略：选择 3/4 底池下注，且为纯下注（100% 频率）。", "跟注范围分析：对手面对 3/4 底池下注时，会用 A 高牌跟注，包括 AK、AQ、A5、A4 等组合。TT 不阻挡这些组合，因此下注能获得价值。", "ATo 的慢打逻辑：若过牌，对手会用 A 高牌过牌，增加对手下注（诈唬或价值）的概率；若下注，则阻挡了对手的跟注组合，降低被跟注率。因此 ATo 是更优的慢打候选。", "策略构建建议：在构建慢打策略时，应优先选择具备阻挡牌效应的组合（如 ATo），而非单纯依赖牌力强度。"], "note": ""}, {"id": "DGL#82-s6", "ep": "82", "type": "topic", "topic": "DGL#82 手牌复盘：何时该用强牌慢打", "en": "Hand Review When to Slowplay a Strong Hand", "q": "范围紧度与阻挡牌效应的放大", "clues": ["OOP", "Ace", "A5s", "A4s"], "a": ["在河牌圈，双方范围都非常紧（IP 约 20 个组合，OOP 约 10-12 个组合），此时一张阻挡牌的影响被极度放大。", "例如，手持一张 A 会阻挡对手 3-4 个 A 高牌组合，这在紧范围中占比极高（约 20-30%）。", "求解器显示，在河牌圈，所有两对以上牌力几乎都选择快打，唯一例外是具备 Ace 阻挡牌的组合（如 A5s、A4s），这些组合因阻挡效应过强而选择慢打。", "一般原则：若你的范围远强于对手，且对手 reopen 频率很低，慢打价值有限；除非你的手牌同时阻挡跟注范围和过牌范围，否则应优先快打。"], "note": ""}, {"id": "DGL#82-c2", "ep": "82", "type": "cloze", "topic": "DGL#82 手牌复盘：何时该用强牌慢打", "en": "Hand Review When to Slowplay a Strong Hand", "q": "理论上对手的过牌-加注（reopen）频率极低（仅 ＿＿），", "clues": [], "a": ["由于己方范围几乎没有空气牌，且对手范围较弱，理论上对手的过牌-加注（reopen）频率极低（仅 33%），这意味着慢打很难获得足够回报。"], "note": "33%"}, {"id": "DGL#82-c5", "ep": "82", "type": "cloze", "topic": "DGL#82 手牌复盘：何时该用强牌慢打", "en": "Hand Review When to Slowplay a Strong Hand", "q": "求解器对 TT 的河牌策略：选择 3/4 底池下注，且为纯下注（＿＿ 频率）。", "clues": [], "a": ["求解器对 TT 的河牌策略：选择 3/4 底池下注，且为纯下注（100% 频率）。"], "note": "100%"}, {"id": "DGL#82-c6", "ep": "82", "type": "cloze", "topic": "DGL#82 手牌复盘：何时该用强牌慢打", "en": "Hand Review When to Slowplay a Strong Hand", "q": "手持一张 A 会阻挡对手 3-4 个 A 高牌组合，这在紧范围中占比极高（约 20-＿＿）。", "clues": [], "a": ["例如，手持一张 A 会阻挡对手 3-4 个 A 高牌组合，这在紧范围中占比极高（约 20-30%）。"], "note": "30%"}, {"id": "DGL#82-note", "ep": "82", "type": "note", "topic": "DGL#82 手牌复盘：何时该用强牌慢打", "en": "Hand Review When to Slowplay a Strong Hand", "q": "避坑提醒与行动项", "clues": ["DGL", "Daily GTO Lab", "PioSOLVER"], "a": ["本视频属于 DGL（Daily GTO Lab）系列的第 82 期，聚焦于河牌圈强牌的慢打决策，是“手牌复盘”类内容。视频严格从 GTO 理论角度分析，未涉及针对特定对手的剥削性调整（如对手是否过度弃牌或是否会用诈唬加注），讲师明确表示这部分内容将在后续视频中讨论。建议观众结合求解器软件（如 PioSOLVER、GTO+）自行模拟类似场景，以加深对阻挡牌效应和范围互动的理解。", "**行动项与常见错误：**", "- 应该这样做：在决定慢打前，先问“对手是否会替我下注？”并分析自己的阻挡牌是否同时影响对手的跟注和过牌范围。", "- 应该这样做：在构建慢打策略时，优先选择具备 Ace 阻挡牌的组合（如 ATo、A5s），而非仅凭牌力强度选择。", "- 不要这样做：不要因为手牌是坚果或强牌就盲目慢打；若你的范围远强于对手且对手 reopen 频率低，快打通常是更优选择。", "- 不要这样做：不要忽视阻挡牌效应在河牌圈紧范围中的巨大影响，一张关键阻挡牌可能改变整个策略方向。"], "note": ""}, {"id": "DGL#83-intro", "ep": "83", "type": "intro", "topic": "DGL#83 高额桌手牌复盘：坚果同花阻挡牌在诈唬中失效", "en": "Hand Review High Stakes - Nut Flush Blocker No Good", "q": "DGL#83 高额桌手牌复盘：坚果同花阻挡牌在诈唬中失效", "clues": ["JG Poker 10", "Anyhill", "AJo"], "a": ["本视频复盘了一手来自JG Poker 10/20级别的高额桌对局，由小盲位玩家Anyhill（手持AJo）与按钮位玩家Marius（手持64s）展开。视频核心围绕两个GTO原则展开：一是翻牌圈听牌必须混合频率（如60%加注/40%跟注），二是顶对顶踢脚等成牌需要慢打以平衡范围。讲师通过软件策略分析，展示了从翻前到河牌每个决策点的最优频率与行动选择。", "视频重点分析了转牌圈的纯过牌决策与河牌圈的诈唬加注失败案例。Marius在转牌用顺子听牌纯过牌，理由是阻挡牌太差；而Anyhill在河牌持有A♠阻挡牌时选择全下诈唬，却被Marius用顺子跟注赢下大底池。讲师指出，A♠阻挡牌在此场景下完全无效，因为它不阻挡对手的任何价值范围，反而只阻挡了对手的诈唬范围，导致诈唬加注损失约4个EV点。", "视频最后强调了“可视化对手范围”的核心方法论：策略是范围互动的函数，只有准确构建对手范围，才能避免表面理论正确但实际亏损的决策。讲师还给出了更优的诈唬阻挡牌选择（如Q♠或9♠），并对比了不同起手牌在河牌诈唬加注中的EV差异。"], "note": ""}, {"id": "DGL#83-s0", "ep": "83", "type": "topic", "topic": "DGL#83 高额桌手牌复盘：坚果同花阻挡牌在诈唬中失效", "en": "Hand Review High Stakes - Nut Flush Blocker No Good", "q": "翻前行动与起手牌范围", "clues": ["Anyhill", "AJo", "Marius"], "a": ["小盲位Anyhill手持AJo（非同花A J）开局加注至3x，按钮位Marius手持64s（同花6 4）跟注。翻牌圈发出J♣5♥3♦彩虹面，两人进入单挑底池。", "翻前范围构建中，小盲位面对按钮位跟注时，AJo属于标准的率先加注范围；而64s在按钮位跟注小盲位加注时，属于可游戏的投机牌，主要依赖翻牌后的顺子或同花潜力。"], "note": ""}, {"id": "DGL#83-s1", "ep": "83", "type": "topic", "topic": "DGL#83 高额桌手牌复盘：坚果同花阻挡牌在诈唬中失效", "en": "Hand Review High Stakes - Nut Flush Blocker No Good", "q": "翻牌圈下注尺度与听牌混合频率", "clues": ["Anyhill", "Marius", "GTO", "AJo"], "a": ["翻牌J♣5♥3♦彩虹面，Anyhill选择小尺度持续下注（约1/3底池）。讲师强调，在高-低-低且连接的牌面上，小盲位作为翻前加注者应采用统一的小尺度下注策略，几乎所有下注范围都使用同一尺度。", "Marius用64s（卡顺+后门同花听牌）选择过牌加注。讲师指出，根据GTO策略，64s在此位置应混合行动：60%频率加注，40%频率跟注，不能总是用顺子听牌加注。", "从Anyhill视角，翻牌圈需要慢打顶对顶踢脚（AJo）、口袋对子JJ、55、33以及AA等强牌，形成高度混合的过牌加注防守范围。这些慢打组合是维持范围平衡的关键。"], "note": ""}, {"id": "DGL#83-s2", "ep": "83", "type": "topic", "topic": "DGL#83 高额桌手牌复盘：坚果同花阻挡牌在诈唬中失效", "en": "Hand Review High Stakes - Nut Flush Blocker No Good", "q": "转牌圈纯过牌决策与阻挡牌逻辑", "clues": ["Marius", "Q9o", "KQo", "Axo"], "a": ["转牌发出T♠，Marius手持64s（此时为两头顺子听牌+后门同花听牌）选择纯过牌。讲师指出，软件策略显示64s的所有组合（除64♠外）均为纯过牌，64♠因形成组合听牌才勉强有下注频率。", "纯过牌的原因是阻挡牌太差：64s阻挡了对手大量弃牌范围中的6x和4x组合（如带6或4的同花牌、口袋对子），这些牌在翻牌圈因卡顺听牌而漂浮跟注。用64s诈唬会减少对手弃牌频率，不如选择其他更好的诈唬候选。", "更好的转牌诈唬候选包括：所有黑桃同花组合、非同花Q9o、部分KQo、以及带黑桃的Axo（有高张+同花阻挡牌）。这些牌不阻挡对手弃牌范围，且具备更强的摊牌价值或阻挡效果。"], "note": ""}, {"id": "DGL#83-s3", "ep": "83", "type": "topic", "topic": "DGL#83 高额桌手牌复盘：坚果同花阻挡牌在诈唬中失效", "en": "Hand Review High Stakes - Nut Flush Blocker No Good", "q": "河牌圈价值下注与诈唬加注的EV分析", "clues": ["Anyhill", "AJo", "T7s", "KTo"], "a": ["河牌发出8♠，完成同花面。Anyhill用AJo（顶对顶踢脚+A♠阻挡牌）下注3/4底池价值。他判断对手范围中有大量Jx（如J9、JT、QJ）和转牌成对的10x（如T7s、KTo），这些牌会跟注价值下注。", "Marius手持64s已成顺子，选择加注至48BB（约3/4底池），后手剩86BB。讲师指出，很多人会加注更小（如3x约39BB），但Marius选择了更大的尺度，给对手施压。", "Anyhill看到A♠阻挡牌后触发全下诈唬，但讲师通过软件分析显示，AJo在此场景下不应加注，全下诈唬的EV损失约4个点。若对手（如Marius）过度跟注64s，损失会更大。"], "note": ""}, {"id": "DGL#83-s4", "ep": "83", "type": "topic", "topic": "DGL#83 高额桌手牌复盘：坚果同花阻挡牌在诈唬中失效", "en": "Hand Review High Stakes - Nut Flush Blocker No Good", "q": "坚果阻挡牌失效的核心原因", "clues": ["Marius", "A5s", "J9o", "QJo"], "a": ["A♠阻挡牌在此场景完全无效，因为它不与对手的任何价值范围互动。Marius的河牌价值范围（如顺子、暗三条）不包含A♠，而A♠只阻挡了对手的诈唬范围（如A5s带A♠的诈唬加注）。", "讲师强调，Marius的河牌同花范围主要是中等牌面同花（如Q♠x、9♠x），这些牌在翻牌圈会加注，而A♠x同花在翻牌圈只会跟注，不会进入加注范围。因此A♠阻挡牌对减少对手价值组合毫无帮助。", "更优的诈唬阻挡牌是Q♠或9♠：Q♠阻挡对手的Q高同花，9♠阻挡对手的中等同花。例如J9o带9♠几乎是纯诈唬全下，QJo带Q♠是混合诈唬，KQo带Q♠也是良好候选。"], "note": ""}, {"id": "DGL#83-s5", "ep": "83", "type": "topic", "topic": "DGL#83 高额桌手牌复盘：坚果同花阻挡牌在诈唬中失效", "en": "Hand Review High Stakes - Nut Flush Blocker No Good", "q": "范围可视化与策略互动原则", "clues": ["A5s", "AJo"], "a": ["讲师总结核心方法论：策略是范围互动的函数，必须可视化对手的精确范围才能避免表面理论错误。A♠阻挡牌看似合理，但深入分析范围后会发现它只阻挡对手的诈唬，不阻挡价值，导致诈唬加注亏损。", "具体对比：A5s带A♠有时会被用作诈唬加注，但AJo带A♠则完全不加注。原因是A5s的阻挡牌与对手价值范围互动更少，且自身摊牌价值更低，更适合诈唬。", "讲师建议玩家在实战中避免“死板启发式”（如“有坚果阻挡牌就诈唬”），而应基于对手范围的具体构成选择诈唬候选，优先使用中等阻挡牌（Q♠、9♠）而非坚果阻挡牌（A♠）。"], "note": ""}, {"id": "DGL#83-c1", "ep": "83", "type": "cloze", "topic": "DGL#83 高额桌手牌复盘：坚果同花阻挡牌在诈唬中失效", "en": "Hand Review High Stakes - Nut Flush Blocker No Good", "q": "64s在此位置应混合行动：＿＿频率加注，40%频率跟注，", "clues": [], "a": ["Marius用64s（卡顺+后门同花听牌）选择过牌加注。讲师指出，根据GTO策略，64s在此位置应混合行动：60%频率加注，40%频率跟注，不能总是用顺子听牌加注。"], "note": "60%"}, {"id": "DGL#83-c3", "ep": "83", "type": "cloze", "topic": "DGL#83 高额桌手牌复盘：坚果同花阻挡牌在诈唬中失效", "en": "Hand Review High Stakes - Nut Flush Blocker No Good", "q": "选择加注至＿＿（约3/4底池），后手剩86BB。", "clues": [], "a": ["Marius手持64s已成顺子，选择加注至48BB（约3/4底池），后手剩86BB。讲师指出，很多人会加注更小（如3x约39BB），但Marius选择了更大的尺度，给对手施压。"], "note": "48BB"}, {"id": "DGL#83-note", "ep": "83", "type": "note", "topic": "DGL#83 高额桌手牌复盘：坚果同花阻挡牌在诈唬中失效", "en": "Hand Review High Stakes - Nut Flush Blocker No Good", "q": "避坑提醒与行动项", "clues": ["DGL", "GTO", "60%"], "a": ["本视频属于DGL系列第83期，定位为高额桌手牌复盘教学，承接了系列中关于GTO频率混合与范围构建的讨论。讲师通过具体牌例展示了软件策略与实战决策的差异，适合已掌握基础GTO概念、希望提升范围互动理解的中高级玩家。进一步学习方向可关注：不同牌面结构下阻挡牌的有效性差异、转牌圈纯过牌策略的适用条件、以及河牌圈诈唬加注的EV计算框架。", "### 行动项与常见错误", "- 应该这样做：翻牌圈用听牌混合频率（如64s按60%加注/40%跟注）；转牌圈优先选择不阻挡对手弃牌范围的诈唬候选；河牌圈诈唬时选择Q♠或9♠等中等阻挡牌，而非A♠。", "- 不要这样做：不要因为持有坚果阻挡牌（A♠）就盲目诈唬加注；不要用阻挡对手弃牌范围的牌（如64s）在转牌持续下注；不要忽略对手翻牌圈加注范围与河牌范围的差异，导致阻挡牌选择错误。"], "note": ""}, {"id": "DGL#84-intro", "ep": "84", "type": "intro", "topic": "DGL#84 - 高额桌实战牌局复盘：当顶级玩家完美执行Solver策略", "en": "Hand Review When High Stakes Reaches Solver", "q": "DGL#84 - 高额桌实战牌局复盘：当顶级玩家完美执行Solver策略", "clues": ["Solver", "GTO"], "a": ["本视频复盘了一手在10-20级别、三人桌中两位顶尖玩家之间的牌局，展示了他们几乎完美地按照Solver（求解器）策略进行游戏的过程。讲师指出，在绝大多数对局中，这手牌几乎不可能以这种方式被玩出来，因为其中包含了多个极低频率的决策点，尤其是翻牌和转牌上的连续过牌，体现了顶级玩家对GTO（博弈论最优）策略的深刻理解。", "牌局核心围绕BTN（庄位）玩家手持65s（同花65）与BB（大盲位）玩家手持JJ（口袋对子J）展开。翻牌J-7-4-2（两张方片）上，JJ作为顶set（三条）选择高频过牌；转牌Q♣后，65s再次选择纯过牌；河牌3♥完成同花后，BB位玩家选择全下，BTN位玩家被迫跟注。整个过程中，双方的行动几乎与Solver输出完全一致，展示了高额桌玩家如何在实际对局中执行理论策略。", "讲师通过这手牌强调了几个关键教学点：顶set在干燥牌面上的慢打价值、组合听牌（combo draw）在某些情况下不应下注的原因、阻挡牌（blocker）对决策的影响，以及河牌圈极化下注（polarized bet）与薄价值加注（thin value raise）的区别。这些内容对于希望提升扑克理论水平的玩家具有很高的参考价值。"], "note": ""}, {"id": "DGL#84-s0", "ep": "84", "type": "topic", "topic": "DGL#84 - 高额桌实战牌局复盘：当顶级玩家完美执行Solver策略", "en": "Hand Review When High Stakes Reaches Solver", "q": "翻牌前行动与初始范围", "clues": ["BTN", "bet", "13BB"], "a": ["牌局为10-20级别三人桌，BTN位玩家手持65s（红桃65），率先加注到3BB（大盲），BB位玩家手持JJ（口袋对子J）选择3-bet（再加注）到13BB，BTN位跟注。", "翻牌前BTN位的率先加注尺寸为标准3BB，BB位的3-bet尺寸为13BB，这是一个典型的线性范围对抗场景，双方范围都相对较宽。", "讲师指出，在这种三人桌情况下，BTN位的开局加注范围和BB位的防守范围都包含大量非同花高张（如AJ、KQ等），这为后续翻牌圈的策略选择埋下伏笔。"], "note": ""}, {"id": "DGL#84-s1", "ep": "84", "type": "topic", "topic": "DGL#84 - 高额桌实战牌局复盘：当顶级玩家完美执行Solver策略", "en": "Hand Review When High Stakes Reaches Solver", "q": "翻牌圈顶set的慢打逻辑", "clues": ["set", "Solver", "GTO", "60%"], "a": ["翻牌为J♠7♦4♦2♦（实际为四张牌面，应为J-7-4-2，其中两张方片），BB位玩家手持JJ击中顶set（三条J），但Solver建议以约60%的频率过牌，仅40%频率下注。", "讲师解释，这个牌面对于BB位玩家来说并非特别有利，因为其范围中包含大量非同花高张，而这些牌在J-7-4-2的牌面上缺乏强成牌或强听牌。", "顶set（JJ）由于阻挡了对手可能跟注的Jx组合，同时自身又是超强牌，因此被Solver归类为高频过牌范围。讲师强调，在干燥牌面上，顶set是极佳的慢打牌型，尤其是在有位置劣势的情况下。", "讲师坦言，很多玩家在实战中很难做出这个过牌决策，但这是GTO策略下的标准打法，目的是保护过牌范围并诱导对手诈唬。"], "note": ""}, {"id": "DGL#84-s2", "ep": "84", "type": "topic", "topic": "DGL#84 - 高额桌实战牌局复盘：当顶级玩家完美执行Solver策略", "en": "Hand Review When High Stakes Reaches Solver", "q": "翻牌圈组合听牌的过牌决策", "clues": ["BTN", "Solver", "Broadway", "over pairs"], "a": ["BTN位手持65s（红桃65），在翻牌面J-7-4-2（两张方片）上拥有卡顺听牌（5-6-7-8）和后门同花听牌，是一个典型的组合听牌，但Solver建议以纯过牌频率处理。", "讲师指出，Solver更倾向于用Broadway高张（如AT、KJ等）进行下注，而非这类组合听牌，核心原因是对手（BB位）的过牌加注频率极高，约为20%。", "对手的过牌加注范围主要由超对（over pairs）、顶对（top pairs）以及带后门听牌的Broadway牌组成，如果BTN位下注后被加注，将陷入被动局面。", "讲师强调，这些Broadway牌作为诈唬牌比组合听牌更合适，因为它们有更好的阻断效应和摊牌价值，而65s这类牌更适合过牌看免费牌。", "讲师承认，在实战中他本人也很难找到这个纯过牌决策，通常会根据策略桶进行混合，但Solver的输出是纯过牌，这体现了高额桌玩家对理论的极致追求。"], "note": ""}, {"id": "DGL#84-s3", "ep": "84", "type": "topic", "topic": "DGL#84 - 高额桌实战牌局复盘：当顶级玩家完美执行Solver策略", "en": "Hand Review When High Stakes Reaches Solver", "q": "转牌圈的第二次慢打与阻挡牌效应", "clues": ["Solver", "BTN", "70%", "30%"], "a": ["转牌为Q♣，牌面变为J-7-4-2-Q（两张方片），BB位手持JJ再次选择过牌，Solver建议以70%频率过牌，仅30%频率下注。", "讲师解释，JJ在转牌圈拥有双重阻挡效应：既阻挡了对手可能跟注的Jx组合（降低下注EV），又阻挡了对手可能过牌的Jx组合（提高过牌EV），因此慢打价值极高。", "对手（BTN位）的Jx组合（如AJ、KJ）在转牌圈大部分会过牌，这使得JJ的过牌策略更加合理，因为下注很难获得价值。", "讲师指出，在双高张且听牌丰富的牌面上，Solver建议采用3/4底池下注或过牌的混合策略，下注范围主要包含Qx+的成牌和一些诈唬牌，而JJ属于纯过牌范围。"], "note": ""}, {"id": "DGL#84-s4", "ep": "84", "type": "topic", "topic": "DGL#84 - 高额桌实战牌局复盘：当顶级玩家完美执行Solver策略", "en": "Hand Review When High Stakes Reaches Solver", "q": "转牌圈组合听牌的再次过牌", "clues": ["BTN", "Solver", "RNG"], "a": ["BTN位手持65s（红桃65）在转牌Q♣后，依然拥有卡顺听牌和后门同花听牌，但Solver再次建议纯过牌，这是本手牌中最难找到的决策之一。", "讲师强调，连续两次纯过牌在实战中几乎不可能被人类玩家执行，即使是他本人也会倾向于混合策略，但Solver的输出是明确的纯过牌。", "讲师推测，BTN位玩家可能是通过随机数生成器（RNG）偶然选择了这个低频率动作，但即便如此，能意识到这个选项的存在本身就是高水平的表现。", "这手牌展示了组合听牌在特定牌面和对手范围下的被动打法价值，与一般认知中“听牌应该激进下注”的直觉相反。"], "note": ""}, {"id": "DGL#84-s5", "ep": "84", "type": "topic", "topic": "DGL#84 - 高额桌实战牌局复盘：当顶级玩家完美执行Solver策略", "en": "Hand Review When High Stakes Reaches Solver", "q": "河牌圈的极化下注与跟注决策", "clues": ["jam", "Solver", "BTN"], "a": ["河牌为3♥，牌面最终为J-7-4-2-Q-3（三张红桃，两张方片），BB位手持JJ击中同花，选择全下（jam），Solver确认这是正确打法。", "讲师解释，虽然同花完成，但BB位主要瞄准对手范围中的特定区域：口袋对子10（TT）和口袋对子9（99），试图从这些中等对子中榨取价值。", "JJ阻挡了对手可能跟注的Jx同花组合，因此全下是极化下注，旨在最大化价值，而非担心被跟注的范围。", "面对全下，BTN位手持65s（红桃65）虽然只击中同花，但Solver建议必须跟注，尽管这手牌的EV（期望值）接近零，但在理论上跟注是唯一正确的选择。", "讲师指出，Solver在面对小尺寸下注时，会混合使用多种加注尺度：A Q和K Q选择薄价值加注，而65s则选择纯全下，这体现了不同牌力在河牌圈的差异化处理。"], "note": ""}, {"id": "DGL#84-s6", "ep": "84", "type": "topic", "topic": "DGL#84 - 高额桌实战牌局复盘：当顶级玩家完美执行Solver策略", "en": "Hand Review When High Stakes Reaches Solver", "q": "高额桌玩家的Solver执行能力", "clues": ["Solver", "GTO"], "a": ["讲师总结，这手牌展示了顶级玩家如何在实际对局中接近Solver的完美执行，包括翻牌和转牌上的连续过牌、河牌圈的极化全下等关键决策。", "讲师认为，这种级别的执行能力需要大量的理论学习、复盘和实战积累，对于低级别玩家来说，这是一个可以追求的目标。", "他强调，只要投入足够的时间和精力学习GTO策略，普通玩家也有可能达到高额桌的执行水平，关键在于耐心和专注。"], "note": ""}, {"id": "DGL#84-c0", "ep": "84", "type": "cloze", "topic": "DGL#84 - 高额桌实战牌局复盘：当顶级玩家完美执行Solver策略", "en": "Hand Review When High Stakes Reaches Solver", "q": "率先加注到＿＿（大盲），BB位玩家手持JJ（口袋对子J）选择3-bet（再加注）到13BB，", "clues": [], "a": ["牌局为10-20级别三人桌，BTN位玩家手持65s（红桃65），率先加注到3BB（大盲），BB位玩家手持JJ（口袋对子J）选择3-bet（再加注）到13BB，BTN位跟注。"], "note": "3BB"}, {"id": "DGL#84-c1", "ep": "84", "type": "cloze", "topic": "DGL#84 - 高额桌实战牌局复盘：当顶级玩家完美执行Solver策略", "en": "Hand Review When High Stakes Reaches Solver", "q": "但Solver建议以约＿＿的频率过牌，仅40%频率下注。", "clues": [], "a": ["翻牌为J♠7♦4♦2♦（实际为四张牌面，应为J-7-4-2，其中两张方片），BB位玩家手持JJ击中顶set（三条J），但Solver建议以约60%的频率过牌，仅40%频率下注。"], "note": "60%"}, {"id": "DGL#84-c2", "ep": "84", "type": "cloze", "topic": "DGL#84 - 高额桌实战牌局复盘：当顶级玩家完美执行Solver策略", "en": "Hand Review When High Stakes Reaches Solver", "q": "核心原因是对手（BB位）的过牌加注频率极高，约为＿＿。", "clues": [], "a": ["讲师指出，Solver更倾向于用Broadway高张（如AT、KJ等）进行下注，而非这类组合听牌，核心原因是对手（BB位）的过牌加注频率极高，约为20%。"], "note": "20%"}, {"id": "DGL#84-note", "ep": "84", "type": "note", "topic": "DGL#84 - 高额桌实战牌局复盘：当顶级玩家完美执行Solver策略", "en": "Hand Review When High Stakes Reaches Solver", "q": "避坑提醒与行动项", "clues": ["DGL", "GTO", "Solver"], "a": ["本视频是DGL系列的第84期，专注于高额桌实战牌局复盘，适合已经掌握基础扑克理论并希望深入了解GTO策略应用的玩家。视频中涉及的Solver输出、阻挡牌效应、极化下注等概念，需要一定的理论基础才能完全理解，建议初学者先学习基础的范围构建和底池赔率计算。", "值得进一步学习的方向包括：Solver软件的具体使用方法、不同牌面结构下的范围分布、以及如何在实际对局中平衡理论策略与剥削性调整。讲师在视频中多次提到“混合策略”和“频率选择”，这些都是高级玩家必须掌握的技能。", "**行动项与常见错误提醒：**", "- 在干燥牌面上，顶set应优先考虑过牌慢打，而非自动下注，以保护过牌范围并诱导诈唬。", "- 组合听牌并非总是应该激进下注，当对手过牌加注频率较高时，过牌看免费牌可能是更优选择。", "- 不要忽视阻挡牌效应，它直接影响下注和过牌的EV，是高级决策的核心依据。", "- 河牌圈面对全下时，即使EV接近零，也要根据理论正确性决定是否跟注，而非仅凭直觉。"], "note": ""}, {"id": "DGL#85-intro", "ep": "85", "type": "intro", "topic": "DGL#85 - 翻前加注单次加注底池有利位置：A高无听牌在转牌圈的双重下注策略", "en": "PFR SRP IP Double Barreling A High No Draw", "q": "DGL#85 - 翻前加注单次加注底池有利位置：A高无听牌在转牌圈的双重下注策略", "clues": ["A6s", "seven", "three"], "a": ["本视频围绕一个具体手牌展开：讲师在CO位用A6s（A6同花）开局加注，对手在BB位跟注，翻牌为7♣3♦3♣2♣（原文为seven, three, three, two clubs，即7-3-3-2，其中两张草花），讲师选择在翻牌圈下注约40%底池，转牌发出K♠后选择过牌。但在复盘时，讲师通过GTO求解器发现，在这个转牌面上，A高无听牌实际上应该以相当高的频率进行双重下注（double barrel），这促使他深入研究了这一手牌类别在类似局面下的最优频率。", "视频的核心内容是：讲师利用GTO数据，系统性地分析了在翻前加注、单次加注底池、有利位置（IP）的线路中，A高无听牌（Ace high no draw）在转牌圈的双重下注频率。他得出了几个关键结论：平均而言，在所有牌面结构下，A高无听牌的双重下注频率约为30%；当转牌是低牌面上的高张（overcard）时，该频率会提升至约40%；踢脚（kicker）越低，下注频率越高；位置越靠后（范围越紧），下注频率也越高。这些数据为玩家提供了可操作的频率启发式规则。"], "note": ""}, {"id": "DGL#85-s0", "ep": "85", "type": "topic", "topic": "DGL#85 - 翻前加注单次加注底池有利位置：A高无听牌在转牌圈的双重下注策略", "en": "PFR SRP IP Double Barreling A High No Draw", "q": "手牌回顾与问题发现", "clues": ["A6s", "vs BTN", "vs BB", "40%"], "a": ["讲师在CO位用A6s（A6同花）开局加注，BB位对手跟注，翻牌为7♣3♦3♣2♣（7-3-3-2，两张草花），他选择下注约40%底池，对手跟注，转牌发出K♠。", "讲师在转牌选择过牌，但复盘时通过求解器发现，这个转牌面应该以相当高的频率用A高进行双重下注，这让他意识到自己对该牌类在此类局面下的频率启发式并不准确。", "讲师特别指出，他当时应用的是“BB位vs BTN位”的策略思路，而在BB位vs BTN位的情况下，A高无听牌确实几乎纯过牌，因此他当时的决策在那种情境下是正确的，但CO位vs BB位的情况完全不同。"], "note": ""}, {"id": "DGL#85-s1", "ep": "85", "type": "topic", "topic": "DGL#85 - 翻前加注单次加注底池有利位置：A高无听牌在转牌圈的双重下注策略", "en": "PFR SRP IP Double Barreling A High No Draw", "q": "求解器数据：CO位vs BB位转牌策略", "clues": ["vs BB", "low pair texture", "A5s", "A2s"], "a": ["在CO位vs BB位的模拟中，翻牌圈主要使用小尺寸下注（约40%底池），但在这类低对子牌面（low pair texture）上必须保留一些过牌频率，因为存在被加注的显著威胁。", "转牌发出K后，求解器显示整体双重下注频率为60%。若筛选A高无听牌，特别是低踢脚和中踢脚的A高，下注频率极高：A♠6♠几乎是纯下注，A♥6♥也几乎是纯下注。", "A5s（A5同花）、A2s（A2同花）也大量下注，甚至包含很多超池下注（overbet）；连A8（A8）这样的强牌也无论是否带草花阻挡牌都进行双重下注。", "这一结果让讲师非常惊讶，因为他原本以为A高无听牌在此类牌面应该以过牌为主。"], "note": ""}, {"id": "DGL#85-s2", "ep": "85", "type": "topic", "topic": "DGL#85 - 翻前加注单次加注底池有利位置：A高无听牌在转牌圈的双重下注策略", "en": "PFR SRP IP Double Barreling A High No Draw", "q": "不同位置间的策略差异", "clues": ["vs BTN", "pure check", "vs BB", "22%"], "a": ["在BB位vs BTN位的情况下，A高无听牌几乎纯过牌（pure check），这与CO位vs BB位形成鲜明对比。", "在CO位vs BB位的情况下，A高无听牌的双重下注频率为22%，其中很多中踢脚的A高是纯下注。", "在HJ位vs BB位的情况下，转牌圈整体双重下注频率达到70%，A高无听牌的下注频率超过一半：A8、A9是纯下注，A6也是高频率下注。", "结论：随着位置越靠前（范围越紧），转牌K对己方范围越有利，A高组合的下注频率也越高。"], "note": ""}, {"id": "DGL#85-s3", "ep": "85", "type": "topic", "topic": "DGL#85 - 翻前加注单次加注底池有利位置：A高无听牌在转牌圈的双重下注策略", "en": "PFR SRP IP Double Barreling A High No Draw", "q": "A高无听牌的平均双重下注频率", "clues": ["30%", "40%"], "a": ["讲师建立了一个针对双重下注线路（翻前加注、单次加注底池、有利位置）的筛选器，专门分析A高无听牌在转牌圈的频率。", "令人惊讶的核心数据：在所有牌面结构下，A高无听牌的平均双重下注频率为30%。这意味着玩家应该以30%的频率用A高无听牌进行双重下注。", "当筛选翻牌圈小尺寸下注（约40%底池）后，频率保持不变，仍为30%，因为样本中大部分情况已经使用了小尺寸下注。"], "note": ""}, {"id": "DGL#85-s4", "ep": "85", "type": "topic", "topic": "DGL#85 - 翻前加注单次加注底池有利位置：A高无听牌在转牌圈的双重下注策略", "en": "PFR SRP IP Double Barreling A High No Draw", "q": "转牌高张（Overcard）的影响", "clues": ["overcard", "blank", "30%", "40%"], "a": ["当转牌是低牌面上的高张（overcard）时，A高无听牌的双重下注频率会显著提升，从30%上升到约40%（40-60分拆）。", "具体而言，在低牌面且转牌为高张的情况下，A高无听牌的双重下注频率约为40%。", "如果转牌是空白牌（blank）且翻牌是高牌牌面，频率会下降到25%。", "转牌为低牌面上的高张是A高无听牌下注频率最高的场景之一，中低踢脚甚至可以推高到50-50分拆。"], "note": ""}, {"id": "DGL#85-s5", "ep": "85", "type": "topic", "topic": "DGL#85 - 翻前加注单次加注底池有利位置：A高无听牌在转牌圈的双重下注策略", "en": "PFR SRP IP Double Barreling A High No Draw", "q": "踢脚大小对频率的影响", "clues": ["high kicker", "30%", "18%", "20%"], "a": ["在30%的平均频率基础上，踢脚大小对下注频率有显著影响：高踢脚（high kicker）的A高无听牌下注频率降至18%，中踢脚为20%，低踢脚则高达40%。", "对于非同花A高：高踢脚非同花无听牌为22%，中踢脚非同花为33%，低踢脚非同花为37%。", "结论：踢脚越低，越应该下注。低踢脚的A高阻挡了对手更少的强牌组合，且自身摊牌价值较低，更适合作为诈唬牌。"], "note": ""}, {"id": "DGL#85-s6", "ep": "85", "type": "topic", "topic": "DGL#85 - 翻前加注单次加注底池有利位置：A高无听牌在转牌圈的双重下注策略", "en": "PFR SRP IP Double Barreling A High No Draw", "q": "位置对频率的最终影响", "clues": ["BTN", "27%", "29%", "33%"], "a": ["在BTN位，A高无听牌的双重下注频率为27%（27-73分拆），略低于平均值。", "在CO位，频率为29%（29-71分拆），接近平均值。", "在HJ位，频率为33%（33-67分拆），明显更高。", "结论：位置越紧（范围越强），转牌高张对己方越有利，越应该用A高进行双重下注。"], "note": ""}, {"id": "DGL#85-s7", "ep": "85", "type": "topic", "topic": "DGL#85 - 翻前加注单次加注底池有利位置：A高无听牌在转牌圈的双重下注策略", "en": "PFR SRP IP Double Barreling A High No Draw", "q": "核心启发式总结", "clues": ["30%", "20%", "40%"], "a": ["平均而言，在所有牌面结构下，A高无听牌在双重下注线路中的频率为30%。", "高踢脚A高下注约20%，中踢脚和低踢脚约40%。", "当转牌是低牌面上的高张时，整体频率提升至40%；中低踢脚可推高至50-50分拆。", "记住三个关键因素：位置（越紧越下注）、牌面结构（转牌高张是极佳信号）、踢脚大小（踢脚越低越下注）。"], "note": ""}, {"id": "DGL#85-c0", "ep": "85", "type": "cloze", "topic": "DGL#85 - 翻前加注单次加注底池有利位置：A高无听牌在转牌圈的双重下注策略", "en": "PFR SRP IP Double Barreling A High No Draw", "q": "两张草花），他选择下注约＿＿底池，对手跟注，", "clues": [], "a": ["讲师在CO位用A6s（A6同花）开局加注，BB位对手跟注，翻牌为7♣3♦3♣2♣（7-3-3-2，两张草花），他选择下注约40%底池，对手跟注，转牌发出K♠。"], "note": "40%"}, {"id": "DGL#85-c1", "ep": "85", "type": "cloze", "topic": "DGL#85 - 翻前加注单次加注底池有利位置：A高无听牌在转牌圈的双重下注策略", "en": "PFR SRP IP Double Barreling A High No Draw", "q": "翻牌圈主要使用小尺寸下注（约＿＿底池），但在这类低对子牌面（low pair texture）上必须保留一些过牌频率，", "clues": [], "a": ["在CO位vs BB位的模拟中，翻牌圈主要使用小尺寸下注（约40%底池），但在这类低对子牌面（low pair texture）上必须保留一些过牌频率，因为存在被加注的显著威胁。"], "note": "40%"}, {"id": "DGL#85-c2", "ep": "85", "type": "cloze", "topic": "DGL#85 - 翻前加注单次加注底池有利位置：A高无听牌在转牌圈的双重下注策略", "en": "PFR SRP IP Double Barreling A High No Draw", "q": "A高无听牌的双重下注频率为＿＿，其中很多中踢脚的A高是纯下注。", "clues": [], "a": ["在CO位vs BB位的情况下，A高无听牌的双重下注频率为22%，其中很多中踢脚的A高是纯下注。"], "note": "22%"}, {"id": "DGL#85-note", "ep": "85", "type": "note", "topic": "DGL#85 - 翻前加注单次加注底池有利位置：A高无听牌在转牌圈的双重下注策略", "en": "PFR SRP IP Double Barreling A High No Draw", "q": "避坑提醒与行动项", "clues": ["DGL", "GTO", "vs BTN"], "a": ["本视频是DGL系列第85期，聚焦于翻前加注、单次加注底池、有利位置线路中A高无听牌在转牌圈的双重下注频率。讲师通过求解器数据，推翻了常见的“A高无听牌应过牌”的直觉，提供了具体的频率启发式。这些数据为玩家在类似局面下的决策提供了量化依据，尤其适合希望从GTO角度优化转牌圈策略的玩家。", "值得进一步学习的方向包括：转牌圈其他牌类（如带对、带听牌）的双重下注频率；河牌圈在类似线路中的策略；以及不同下注尺度（如超池下注）对A高无听牌频率的影响。讲师也提到可能在未来制作关于河牌圈策略的视频。", "**行动项与常见错误**：", "- 应该做：在低牌面且转牌为高张时，以约40%频率用A高无听牌双重下注；踢脚越低越倾向于下注；位置越紧（如HJ位）越倾向于下注。", "- 不要做：不要在所有牌面上都用A高无听牌过牌——平均30%的下注频率是必要的；不要忽视踢脚大小对频率的影响，高踢脚和低踢脚的频率差异可达20个百分点以上；不要将BB位vs BTN位的策略直接套用到CO位vs BB位等更紧的位置对抗中。"], "note": ""}, {"id": "DGL#86-intro", "ep": "86", "type": "intro", "topic": "DGL#86 - 翻前单次加注底池、不利位置过牌-下注-下注线路中的河牌弃牌策略构建", "en": "PFC SRP OOP River Give Ups in X-B-B Line", "q": "DGL#86 - 翻前单次加注底池、不利位置过牌-下注-下注线路中的河牌弃牌策略构建", "clues": ["SRP", "OOP", "QJo"], "a": ["本视频聚焦于翻前单次加注底池（SRP）中，不利位置（OOP）玩家采用过牌-下注-下注（X-B-B）线路时，如何构建河牌圈诈唬与弃牌策略。讲师以一个实战牌例切入：他在大盲位用QJo防守对抗庄位加注，翻牌A♠T♣3♣双方过牌，转牌Q♥对手下注2/3底池他跟注，河牌5♠对手超额下注1.7倍底池，他最终抓诈成功，对手亮出87o。这个牌例引出了核心问题：当面对一个能够激进抓诈的对手时，有利位置玩家应如何控制自己的诈唬频率。", "视频的核心观点是：在X-B-B线路中，玩家必须接受一个反直觉的事实——在河牌圈需要放弃极高比例的未成对牌。GTO蓝图课程中提到的50-50基准频率（即河牌圈约一半诈唬牌需要放弃）在此线路中只是一个起点，实际弃牌频率会根据河牌牌面结构和下注尺度在40%到80%之间大幅波动。讲师通过GTO软件模拟数据，系统性地展示了如何根据价值下注区域的大小和下注尺度的选择来动态调整弃牌频率。", "视频提供了三个关键决策变量：价值区域的大小（组合数多少）、你希望使用的下注尺度（放大或缩小）、以及河牌是否与对手范围产生关联。通过这三个变量的组合，玩家可以精确地调节自己的弃牌频率，从而在X-B-B线路中接近平衡状态。讲师强调，即使是在最有利的河牌面，也仍然需要放弃40-50%的诈唬牌，这是保持范围平衡的必要代价。"], "note": ""}, {"id": "DGL#86-s0", "ep": "86", "type": "topic", "topic": "DGL#86 - 翻前单次加注底池、不利位置过牌-下注-下注线路中的河牌弃牌策略构建", "en": "PFC SRP OOP River Give Ups in X-B-B Line", "q": "实战牌例引入", "clues": ["QJo", "BTN"], "a": ["牌例背景：大盲位用QJo防守对抗庄位（BTN）加注，有效筹码深度未明确但为常规深度。", "翻牌面为A♠T♣3♣（两张草花），双方过牌；转牌Q♥，对手下注2/3底池，大盲位跟注。", "河牌5♠，对手超额下注1.7倍底池，大盲位选择跟注，对手亮出87o（非同花87），大盲位赢下底池。", "讲师指出，这个牌例展示了面对能激进抓诈的对手时，诈唬方必须严格控制自己的诈唬频率，否则会被对手利用。"], "note": ""}, {"id": "DGL#86-s1", "ep": "86", "type": "topic", "topic": "DGL#86 - 翻前单次加注底池、不利位置过牌-下注-下注线路中的河牌弃牌策略构建", "en": "PFC SRP OOP River Give Ups in X-B-B Line", "q": "软件模拟基础数据", "clues": ["GTO", "Hand2Note", "66%"], "a": ["讲师使用GTO软件（Hand2Note）模拟该牌局，筛选出所有未成对牌（K高及以下无对子牌型）。", "在转牌下注2/3底池后，河牌圈需要放弃66%的未成对牌——这是该线路的基准弃牌率。", "讲师强调，这是玩家需要克服的第一个心理障碍：即使手持7高或87s、98o这样的牌，也必须接受放弃的事实。", "如果总是用这些牌诈唬，就无法保持平衡，会被擅长抓诈的对手剥削。"], "note": ""}, {"id": "DGL#86-s2", "ep": "86", "type": "topic", "topic": "DGL#86 - 翻前单次加注底池、不利位置过牌-下注-下注线路中的河牌弃牌策略构建", "en": "PFC SRP OOP River Give Ups in X-B-B Line", "q": "50-50基准频率法则", "clues": ["GTO", "53%", "47%", "50%"], "a": ["从GTO蓝图课程中可知，GTO策略的粗略弃牌频率基准是50-50：到达河牌圈后，约一半的诈唬牌应该放弃。", "在X-B-B线路中，软件数据显示：未成对牌在河牌圈下注53%、过牌47%，接近50-50的基准。", "注意：此计算排除了A高牌，因为部分A高牌在转牌会作为\"保护性下注\"进入下注范围，若包含A高牌，实际弃牌频率会略高于50%。", "50-50是调整的起点，实际弃牌率会根据牌面结构和下注尺度在40%-80%之间波动。"], "note": ""}, {"id": "DGL#86-s3", "ep": "86", "type": "topic", "topic": "DGL#86 - 翻前单次加注底池、不利位置过牌-下注-下注线路中的河牌弃牌策略构建", "en": "PFC SRP OOP River Give Ups in X-B-B Line", "q": "河牌结构对弃牌率的影响", "clues": ["66%", "50%"], "a": ["以两个具体河牌为例：5♠（空白牌）与9♥（与JT、T8等组合产生关联）。", "在5♠河牌面，弃牌率高达66%；在9♥河牌面，弃牌率降至约50%，更接近基准。", "差异的核心原因：河牌是否与对手的翻牌圈过牌范围产生关联，以及是否改变了价值区域的构成。", "讲师指出，9♥会增强J8、T9等组合的价值，使得价值区域扩大，从而需要更多诈唬来平衡。"], "note": ""}, {"id": "DGL#86-s4", "ep": "86", "type": "topic", "topic": "DGL#86 - 翻前单次加注底池、不利位置过牌-下注-下注线路中的河牌弃牌策略构建", "en": "PFC SRP OOP River Give Ups in X-B-B Line", "q": "下注尺度与弃牌率的关系", "clues": ["Hand2Note", "53%", "47%", "77%"], "a": ["讲师通过Hand2Note筛选了所有X-B-B线路的河牌面，分为\"放大下注尺度\"和\"缩小下注尺度\"两类。", "基准情况：未成对牌下注53%、弃牌47%（约50-50）。", "放大下注尺度的河牌面（如使用77%底池或超额下注）：弃牌率降至42%，形成60-40的下注-弃牌比例。", "缩小下注尺度的河牌面（通常是配对牌面，如河牌A或转牌A）：弃牌率升至60%，形成40-60的下注-弃牌比例。", "总结规律：放大下注时弃牌40%，基准时弃牌50%，缩小时弃牌60%。"], "note": ""}, {"id": "DGL#86-s5", "ep": "86", "type": "topic", "topic": "DGL#86 - 翻前单次加注底池、不利位置过牌-下注-下注线路中的河牌弃牌策略构建", "en": "PFC SRP OOP River Give Ups in X-B-B Line", "q": "价值区域大小决定弃牌率", "clues": ["80%", "40%"], "a": ["河牌为10时（如T♠），虽然使用超额下注（1.5倍底池），但价值区域极小，弃牌率飙升至80%。", "原因：价值下注组合数极少，不需要太多诈唬来平衡，因此大部分未成对牌必须放弃。", "讲师强调，即使使用大尺度下注，如果价值区域本身很小，弃牌率依然会很高——这是玩家经常误解的地方。", "判断规则：价值组合数少→弃牌率大幅上升；价值组合数正常→维持50-50基准；价值组合数多且放大下注→弃牌率降至40%。"], "note": ""}, {"id": "DGL#86-s6", "ep": "86", "type": "topic", "topic": "DGL#86 - 翻前单次加注底池、不利位置过牌-下注-下注线路中的河牌弃牌策略构建", "en": "PFC SRP OOP River Give Ups in X-B-B Line", "q": "三个核心决策变量总结", "clues": ["77%", "40%", "23%", "60%"], "a": ["变量一：价值
