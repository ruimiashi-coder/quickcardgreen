f Raise The River", "q": "DGL#13 - 河牌圈玩法：利用三条（Trips）在河牌圈诈唬加注", "clues": ["Trips", "Full House"], "a": ["本视频围绕一个具体牌局展开，讲解在河牌圈面对对手极化下注时，如何选择诈唬加注的组合。讲师提出一个核心启发式策略：在牌面成对的公共牌结构下，应优先使用三条（Trips）组合而非顶对（如A5）组合进行诈唬加注，因为三条能阻挡对手的葫芦（Full House）组合，同时不阻挡对手的诈唬范围。", "视频通过一个2024年11月GG扑克40K NL级别真实牌局（Tobias Dovweiler vs Iva Ganinak）引入主题，随后用模拟器数据展示多个三条诈唬加注的成功案例，强调该策略在均衡状态（Equilibrium）下广泛存在，并适用于多种类似场景。", "讲师特别强调花色选择的重要性：应选择能最大程度阻挡对手葫芦组合的花色（如本例中的红心10），同时保留阻挡对手诈唬范围的能力（如A阻挡牌）。该策略的核心逻辑是：当对手范围极化为“葫芦或空气”时，三条成为完美的诈唬候选——既能让对手弃掉更好的牌，又不会损失太多摊牌价值。"], "note": ""}, {"id": "DGL#13-s0", "ep": "13", "type": "topic", "topic": "DGL#13 - 河牌圈玩法：利用三条（Trips）在河牌圈诈唬加注", "en": "River Play Using Trips to Bluff Raise The River", "q": "牌局背景与行动过程", "clues": ["Tobias Dovweiler", "Iva Ganinak", "Kala Djurjevic", "Ante"], "a": ["牌局发生于2024年11月GG扑克40K NL级别，Tobias Dovweiler在CO位（关位）开局加注，Iva Ganinak在SB位（小盲）跟注，Kala Djurjevic在BB位（大盲）跟注，游戏带前注（Ante）。", "翻牌面为A♠J♥T♦（彩虹面），三人均过牌。转牌5♥，Iva在SB位主动下注半个底池（half-pot），Kala弃牌，Tobias跟注。", "河牌T♠，牌面成对（A-J-T-5-T），Iva下注2倍底池（2x pot），Tobias选择全下诈唬加注（all-in bluff raise），这是一个非常精彩的操作。", "讲师指出，虽然不知道Tobias的具体手牌，但该场景非常适合用来讲解河牌圈诈唬加注的启发式策略。"], "note": ""}, {"id": "DGL#13-s1", "ep": "13", "type": "topic", "topic": "DGL#13 - 河牌圈玩法：利用三条（Trips）在河牌圈诈唬加注", "en": "River Play Using Trips to Bluff Raise The River", "q": "诈唬组合选择：三条优于顶对", "clues": ["A5s", "A4s", "T8s", "T9s"], "a": ["许多玩家会错误地使用A5、A4等顶对组合（如A5s、A4s）进行诈唬，但讲师强调应使用10x（即带T的组合，如T8s、T9s、TJs等）三条组合来诈唬。", "核心逻辑：当对手范围极化为“葫芦或空气”时，三条成为极佳的诈唬候选——你阻挡了所有葫芦组合，同时不阻挡对手的诈唬范围。", "具体而言，持有三条T时，你阻挡了对手可能组成的TT、AT、JT、T8s、T9s等葫芦组合，同时你的牌力本身足够强，可以扮演葫芦进行加注。"], "note": ""}, {"id": "DGL#13-s2", "ep": "13", "type": "topic", "topic": "DGL#13 - 河牌圈玩法：利用三条（Trips）在河牌圈诈唬加注", "en": "River Play Using Trips to Bluff Raise The River", "q": "花色选择与阻挡效应", "clues": ["printing money"], "a": ["存在微妙的花色启发式：应使用红心T（T♥）进行诈唬，因为红心T阻挡了对手可能持有的T♥8♥、T♥9♥等组合，从而获得更好的阻挡效果。", "红心A（A♥）同样重要：在本例中，A♥J♥（带红心A的AJ）作为诈唬组合“印钞”（printing money），因为红心A阻挡了对手可能持有的A♥X♥同花听牌组合。", "总结原则：选择能阻挡最多葫芦组合的花色，同时保留阻挡对手诈唬范围的能力。"], "note": ""}, {"id": "DGL#13-s3", "ep": "13", "type": "topic", "topic": "DGL#13 - 河牌圈玩法：利用三条（Trips）在河牌圈诈唬加注", "en": "River Play Using Trips to Bluff Raise The River", "q": "模拟器案例一：CO位vs BB位", "clues": ["Grind Simulator", "check-raise", "trips with flush", "draw"], "a": ["案例来自讲师Grind Simulator数据库，机器人与学生实战对局。机器人（CO位）对学生（BB位），翻牌圈小注跟注，转牌学生击中葫芦。", "转牌机器人下注半池，学生过牌加注（check-raise），机器人手持三条+同花听牌（trips with flush draw）无法弃牌，跟注。", "河牌面对底池下注（pot-sized bet），机器人选择用三条诈唬加注，成功迫使学生的葫芦弃牌。", "讲师强调：这种打法在均衡状态下存在于多种场景，非常有效。"], "note": ""}, {"id": "DGL#13-s4", "ep": "13", "type": "topic", "topic": "DGL#13 - 河牌圈玩法：利用三条（Trips）在河牌圈诈唬加注", "en": "River Play Using Trips to Bluff Raise The River", "q": "模拟器案例二：SB位vs BB位", "clues": ["A3s", "full pot"], "a": ["第二个案例：A3s（同花A3）在SB位（小盲）开局加注，BB位（大盲）跟注。翻牌击中三条，下注被跟注。", "转牌8♦，下注小注被加注，A3s仍处于良好形状，跟注。河牌完成顺子和同花面，对手过牌后下注满池（full pot）代表同花。", "A3s被转成诈唬加注，成功迫使对手弃掉同花，效果极佳。", "关键条件：当你面对极化下注，且你的三条并不主导对手的价值下注范围（对手不会用比三条更差的牌价值下注）时，可以将三条转为诈唬。"], "note": ""}, {"id": "DGL#13-s5", "ep": "13", "type": "topic", "topic": "DGL#13 - 河牌圈玩法：利用三条（Trips）在河牌圈诈唬加注", "en": "River Play Using Trips to Bluff Raise The River", "q": "适用条件与决策原则", "clues": ["polarized range"], "a": ["适用场景：对手范围极化为“葫芦或空气”（polarized range），且你的三条无法击败对手的价值下注范围。", "决策原则：使用三条组合进行诈唬加注，因为三条阻挡葫芦组合，同时不阻挡对手的诈唬范围，可以迫使对手弃掉更好的牌。", "花色选择：优先选择阻挡最多葫芦组合的花色（如本例中的红心），同时保留阻挡对手诈唬范围的能力（如A阻挡牌）。", "常见错误：不要使用顶对（如A5）组合诈唬，因为顶对不阻挡葫芦，且容易被对手的葫芦跟注。"], "note": ""}, {"id": "DGL#13-note", "ep": "13", "type": "note", "topic": "DGL#13 - 河牌圈玩法：利用三条（Trips）在河牌圈诈唬加注", "en": "River Play Using Trips to Bluff Raise The River", "q": "避坑提醒与行动项", "clues": ["DGL", "paired board"], "a": ["本视频属于DGL系列第13期，聚焦河牌圈玩法，承接前几期关于极化下注与诈唬频率的内容。讲师通过真实牌局和模拟器数据，展示了一个可复用的启发式策略，适合中高级玩家学习。进一步学习方向包括：不同公共牌结构下的诈唬组合选择、花色阻挡效应的量化分析、以及如何根据对手范围调整诈唬频率。", "行动项与常见错误：", "- 应该：在成对牌面（paired board）面对极化下注时，优先使用三条组合诈唬加注。", "- 应该：选择阻挡最多葫芦组合的花色（如红心T），同时保留阻挡对手诈唬范围的能力。", "- 不要：使用顶对（如A5）组合诈唬，因为顶对不阻挡葫芦，且容易被跟注。", "- 不要：在三条能击败对手价值下注范围时将其转为诈唬，应优先考虑摊牌价值。"], "note": ""}, {"id": "DGL#14-intro", "ep": "14", "type": "intro", "topic": "翻牌过牌加注后，转牌出现公对时的下注策略", "en": "Turn Play Barreling Paired Turns after Flop XR", "q": "翻牌过牌加注后，转牌出现公对时的下注策略", "clues": ["check-raise", "paired turn", "GTO Solver"], "a": ["本视频聚焦于一个具体的翻后场景：翻牌圈我们过牌加注（check-raise）后被对手跟注，转牌圈牌面出现公对（paired turn）时的下注策略。讲师通过GTO Solver的批量数据分析，揭示了一个与多数玩家直觉相反的结论：在此类牌面结构下，Solver几乎从不选择小注下注，而是以高频率使用大注甚至超池下注。", "视频首先展示了Solver在大量实例中的平均行为——在233,236个样本中，Solver仅在8.5%的情况下选择小注，其余绝大多数时候使用1.2倍超池、2倍超池或90%底池的大注。随后讲师深入解释了这一现象背后的范围构成逻辑：当转牌是花牌面时，我们的范围中包含大量中等权益的牌，适合用小注；但当转牌形成公对时，范围并未变成中等强度，而是呈现“坚果或空气”的两极分化结构，因此大注才是合理选择。", "最后，讲师通过具体牌例（如Q-J-2彩虹面转牌J）和范围权益对比图，直观展示了两种场景下范围的本质差异，并给出了明确的行动建议：翻牌过牌加注后，转牌出公对时，应高频过牌，下注时选择大注以在河牌打出全下。"], "note": ""}, {"id": "DGL#14-s0", "ep": "14", "type": "topic", "topic": "翻牌过牌加注后，转牌出现公对时的下注策略", "en": "Turn Play Barreling Paired Turns after Flop XR", "q": "视频主题与数据来源", "clues": ["Solver", "monotone boards"], "a": ["本视频研究翻牌圈过牌加注后，转牌出现公对时的最优下注策略，基于Solver在大量实例中的平均行为。", "数据筛选条件：翻牌圈我们过牌、对手下注、我们加注、对手跟注；翻牌面本身不成对，转牌使牌面成对；排除单调牌面（monotone boards），因为单调牌面在转牌几乎总是小注。", "场景主要为大盲位对抗位置位加注者，但也包含小盲对大盲等其他可能场景，过滤器未限定单一位置组合。"], "note": ""}, {"id": "DGL#14-s1", "ep": "14", "type": "topic", "topic": "翻牌过牌加注后，转牌出现公对时的下注策略", "en": "Turn Play Barreling Paired Turns after Flop XR", "q": "核心发现：Solver几乎不用小注", "clues": ["Solver", "overbet", "GTO", "8.5%"], "a": ["在233,236个实例中，Solver仅20次选择小注，占比8.5%。", "Solver最常用的尺度是1.2倍超池下注（overbet），其次是2倍超池和90%底池的大注。", "结论：翻牌过牌加注后，转牌出公对时，小注在GTO框架下几乎不存在，这与大多数玩家的直觉相反。"], "note": ""}, {"id": "DGL#14-s2", "ep": "14", "type": "topic", "topic": "翻牌过牌加注后，转牌出现公对时的下注策略", "en": "Turn Play Barreling Paired Turns after Flop XR", "q": "小注适用的唯一场景：转牌是花牌面", "clues": ["Solver", "flush card turn", "50%", "80%"], "a": ["在Solver确实选择小注的少数实例中，绝大多数是转牌出现同花牌（flush card turn）。", "原因：当转牌完成同花时，我们的范围中包含大量中等权益的牌（50%-80%权益），这些牌适合用小注获取价值并保护权益。", "具体数据：在K-9-8翻牌面，转牌出任意黑桃时，过牌加注者的范围中约一半是50%-80%权益的中等牌，而位置玩家的范围中约一半是低于30%权益的弱牌。", "这种范围构成使得小注成为合理选择——用中等牌对抗对手的大量弱牌。"], "note": ""}, {"id": "DGL#14-s3", "ep": "14", "type": "topic", "topic": "翻牌过牌加注后，转牌出现公对时的下注策略", "en": "Turn Play Barreling Paired Turns after Flop XR", "q": "公对转牌的范围构成差异", "clues": [], "a": ["当转牌形成公对时，范围构成完全不同：我们的坚果牌数量减少（某些情况下因底对成三条而增加），但范围并未变成中等强度。", "公对转牌导致我们的范围呈现“坚果或空气”的两极分化结构，而非中等强度分布。", "因此，下注频率必须降低（因为坚果减少），但一旦下注，应选择大注，因为范围要么很强要么很弱，没有中间地带。"], "note": ""}, {"id": "DGL#14-s4", "ep": "14", "type": "topic", "topic": "翻牌过牌加注后，转牌出现公对时的下注策略", "en": "Turn Play Barreling Paired Turns after Flop XR", "q": "具体牌例分析", "clues": [], "a": ["大盲位对劫位：翻牌用底对过牌加注，转牌出公对后继续用大注下注（底池大小）。", "大盲位对劫位：翻牌用10-7过牌加注，转牌公对后继续大注下注。", "大盲位对劫位：翻牌用10-8同花过牌加注（卡顺听牌），转牌出7形成公对，继续大注下注。", "大盲位对劫位：翻牌用J-9同花在Q-10-5-2牌面过牌加注（组合听牌），转牌公对后继续大注下注。"], "note": ""}, {"id": "DGL#14-s5", "ep": "14", "type": "topic", "topic": "翻牌过牌加注后，转牌出现公对时的下注策略", "en": "Turn Play Barreling Paired Turns after Flop XR", "q": "Q-J-2彩虹面实例详解", "clues": ["Solver", "20%"], "a": ["翻牌Q-J-2彩虹面，我们过牌加注，Solver建议使用底池大小的加注，而非较薄的价值加注。", "转牌出J形成公对，此时绝不应小注下注——范围分析显示，我们的范围中约20%是强牌，其余大部分是半诈唬和空气。", "对比：在花牌面转牌场景中，我们的范围有大量中等牌，对手范围有大量垃圾牌，因此小注高频下注合理。", "在公对转牌场景中，权益曲线完全反转——我们的范围低于对手的权益线，因为缺乏中等强度牌，只有坚果和空气。"], "note": ""}, {"id": "DGL#14-s6", "ep": "14", "type": "topic", "topic": "翻牌过牌加注后，转牌出现公对时的下注策略", "en": "Turn Play Barreling Paired Turns after Flop XR", "q": "行动建议与常见错误", "clues": ["check"], "a": ["翻牌过牌加注后，转牌出公对时，应高频过牌（check），下注频率要低。", "一旦选择下注，应使用大注（底池大小或超池），目标是在河牌打出全下。", "常见错误：大多数玩家在转牌出公对时倾向于小注，这在理论上是不成立的。", "不要因为“牌面成对”就自动认为范围变成中等强度——公对并不改变范围的两极分化本质。"], "note": ""}, {"id": "DGL#14-c1", "ep": "14", "type": "cloze", "topic": "翻牌过牌加注后，转牌出现公对时的下注策略", "en": "Turn Play Barreling Paired Turns after Flop XR", "q": "Solver仅20次选择小注，占比＿＿。", "clues": [], "a": ["在233,236个实例中，Solver仅20次选择小注，占比8.5%。"], "note": "8.5%"}, {"id": "DGL#14-c2", "ep": "14", "type": "cloze", "topic": "翻牌过牌加注后，转牌出现公对时的下注策略", "en": "Turn Play Barreling Paired Turns after Flop XR", "q": "我们的范围中包含大量中等权益的牌（＿＿-80%权益），", "clues": [], "a": ["原因：当转牌完成同花时，我们的范围中包含大量中等权益的牌（50%-80%权益），这些牌适合用小注获取价值并保护权益。"], "note": "50%"}, {"id": "DGL#14-c5", "ep": "14", "type": "cloze", "topic": "翻牌过牌加注后，转牌出现公对时的下注策略", "en": "Turn Play Barreling Paired Turns after Flop XR", "q": "我们的范围中约＿＿是强牌，其余大部分是半诈唬和空气。", "clues": [], "a": ["转牌出J形成公对，此时绝不应小注下注——范围分析显示，我们的范围中约20%是强牌，其余大部分是半诈唬和空气。"], "note": "20%"}, {"id": "DGL#14-note", "ep": "14", "type": "note", "topic": "翻牌过牌加注后，转牌出现公对时的下注策略", "en": "Turn Play Barreling Paired Turns after Flop XR", "q": "避坑提醒与行动项", "clues": ["DGL"], "a": ["本视频是DGL系列第14期，聚焦于转牌圈的下注策略，特别是翻牌过牌加注后公对转牌的处理。该视频与此前关于翻牌圈过牌加注策略的视频形成承接关系——翻牌圈的行动决定了转牌圈的范围构成，而转牌圈的下注尺度选择必须基于对范围构成的准确理解。讲师强调，理解范围构成（而非凭直觉选择下注尺度）是做出正确决策的核心。", "值得进一步学习的方向包括：不同翻牌面结构（如连牌面、高牌面）对公对转牌策略的影响；公对转牌上具体哪些牌型适合继续下注（如底对、卡顺听牌、组合听牌）；以及如何在实际对局中识别对手在公对转牌上的剥削性调整。", "**应该这样做：**", "- 翻牌过牌加注后，转牌出公对时，优先选择过牌，控制下注频率。", "- 下注时使用大注（底池大小或超池），目标是在河牌全下。", "- 仅在转牌是花牌面时考虑小注，因为此时范围包含大量中等权益牌。", "**不要这样做：**", "- 不要在转牌出公对时自动选择小注——这是大多数玩家的常见错误。", "- 不要因为牌面成对就认为范围变成中等强度——公对转牌的范围仍是“坚果或空气”结构。", "- 不要在没有坚果优势的情况下高频下注——公对转牌上坚果数量减少，下注频率必须相应降低。"], "note": ""}, {"id": "DGL#15-intro", "ep": "15", "type": "intro", "topic": "DGL#15 - 翻前加注单次加注底池有利位置：在Ax双高张双色翻牌面上双重开枪诈唬卡顺听牌", "en": "PFR SRP IP Double Barreling Gutshots on Ax DB Boards", "q": "DGL#15 - 翻前加注单次加注底池有利位置：在Ax双高张双色翻牌面上双重开枪诈唬卡顺听牌", "clues": ["PFR", "SRP", "double broadway"], "a": ["本视频聚焦于翻前加注者（PFR）在单次加注底池（SRP）中处于有利位置（IP）时，面对Ax双高张（double broadway）双色翻牌面（如A♠K♠8♦、A♦Q♦9♣、A♣J♣7♥）的持续下注（c-bet）策略，并深入探讨转牌圈出现空白牌（brick）后，如何用卡顺听牌（gutshot）进行双重开枪（double barrel）的决策。讲师提出一个关键的花色启发式（suit heuristic）：翻牌圈拥有同花听牌阻挡牌（flush draw blocker）通常是有利的，但一旦被跟注进入转牌圈，拥有该阻挡牌反而会降低你的下注频率，甚至导致纯过牌。", "视频通过多个具体牌面（A-K-8、A-Q-9、A-J-7、A-K-7）的GTO解算数据，展示了这一规律在不同牌面上的重复出现。核心结论是：在转牌空白牌上，持有卡顺听牌且带有同花听牌阻挡牌时，应纯过牌；而不带阻挡牌时，应以40/60或50/50的频率下注。这一规律源于对手在翻牌圈跟注卡顺听牌时，大多依赖后门同花听牌（backdoor flush draw），因此你的阻挡牌实际上阻挡了对手最可能的弃牌范围。", "视频最后总结了一个简单易用的启发式规则，帮助玩家在类似牌面上快速做出更准确的决策，避免因花色选择不当而损失期望值（EV）。"], "note": ""}, {"id": "DGL#15-s0", "ep": "15", "type": "topic", "topic": "DGL#15 - 翻前加注单次加注底池有利位置：在Ax双高张双色翻牌面上双重开枪诈唬卡顺听牌", "en": "PFR SRP IP Double Barreling Gutshots on Ax DB Boards", "q": "翻牌圈策略基础", "clues": ["BTN vs BB", "polarized", "overbet"], "a": ["在BTN vs BB的单次加注底池中，面对Ax双高张双色翻牌面（如A♠K♠8♦、A♦Q♦9♣、A♣J♣7♥），翻前加注者应采用极化（polarized）的下注范围，并使用1.2倍底池的超池下注（overbet）尺度。", "具体牌面示例：A♣J♣7♥、A♦Q♦9♣、A♠K♠8♦均使用1.2x超池下注；A♣K♣8♦同样如此。这些牌面上，翻前加注者拥有大量非同花卡顺听牌组合。", "翻牌圈拥有同花听牌阻挡牌（如牌面有两张方片时持有方片）通常是有利的，可以作为更频繁下注的驱动因素。"], "note": ""}, {"id": "DGL#15-s1", "ep": "15", "type": "topic", "topic": "DGL#15 - 翻前加注单次加注底池有利位置：在Ax双高张双色翻牌面上双重开枪诈唬卡顺听牌", "en": "PFR SRP IP Double Barreling Gutshots on Ax DB Boards", "q": "转牌圈花色区分的重要性", "clues": ["fold"], "a": ["当翻牌圈超池下注被跟注后，转牌发出空白牌（如3♥），卡顺听牌的处理方式会出现显著的花色差异，这一差异初看可能违反直觉，但规律非常清晰。", "核心原则：转牌圈你不再希望拥有同花听牌阻挡牌。原因是对手在翻牌圈跟注的卡顺听牌大多带有后门同花听牌，因此你的阻挡牌实际上阻挡了对手范围中更多的弃牌（fold），降低了你的诈唬成功率。"], "note": ""}, {"id": "DGL#15-s2", "ep": "15", "type": "topic", "topic": "DGL#15 - 翻前加注单次加注底池有利位置：在Ax双高张双色翻牌面上双重开枪诈唬卡顺听牌", "en": "PFR SRP IP Double Barreling Gutshots on Ax DB Boards", "q": "A-K-8双色牌面实例", "clues": ["QJo", "QTo", "JTo", "20%"], "a": ["在A♠K♠8♦牌面上，转牌空白牌后，QJo（非同花QJ）和QTo（非同花QT）全局使用20/80的下注/过牌比例，即20%下注、80%过牌；JTo（非同花JT）为50/50比例。", "按花色细分后：持有方片（与牌面同花色）的卡顺听牌纯过牌（0%下注）；不持有方片的卡顺听牌下注频率显著提高，JTo几乎纯下注（接近100%），QJo和QTo为50/50比例。", "这一差异完全基于是否拥有同花听牌阻挡牌，与卡顺本身的价值无关。"], "note": ""}, {"id": "DGL#15-s3", "ep": "15", "type": "topic", "topic": "DGL#15 - 翻前加注单次加注底池有利位置：在Ax双高张双色翻牌面上双重开枪诈唬卡顺听牌", "en": "PFR SRP IP Double Barreling Gutshots on Ax DB Boards", "q": "A-Q-9双色牌面实例", "clues": ["KJo", "KTo", "JTo", "20%"], "a": ["在A♦Q♦9♣牌面上，翻牌圈同样超池下注，持有方片（同花色）会略微增加下注频率。", "转牌发出3♥空白牌后，KJo和KTo（非同花KJ、KT）全局为20/80比例（20%下注、80%过牌）。", "按花色细分：持有方片的组合纯过牌，包括JTo（此时为两端顺子听牌，但因带方片阻挡牌仍纯过牌）；不持有方片的JTo纯下注，KJo和KTo升至50/50比例。"], "note": ""}, {"id": "DGL#15-s4", "ep": "15", "type": "topic", "topic": "DGL#15 - 翻前加注单次加注底池有利位置：在Ax双高张双色翻牌面上双重开枪诈唬卡顺听牌", "en": "PFR SRP IP Double Barreling Gutshots on Ax DB Boards", "q": "A-J-7双色牌面实例", "clues": ["KQo", "KTo 56", "QTo 36", "30%"], "a": ["在A♣J♣7♥牌面上，翻牌圈超池下注后，转牌空白牌时，KQo（非同花KQ）无论花色如何均纯过牌。", "KTo和QTo（非同花KT、QT）全局为30/70比例（30%下注、70%过牌）。", "按花色细分：持有黑桃（与牌面同花色）时下注频率极低，KTo为11%、QTo为25%；不持有黑桃时频率升至KTo 56%、QTo 36%。规律再次重复：有阻挡牌少下注，无阻挡牌多下注。"], "note": ""}, {"id": "DGL#15-s5", "ep": "15", "type": "topic", "topic": "DGL#15 - 翻前加注单次加注底池有利位置：在Ax双高张双色翻牌面上双重开枪诈唬卡顺听牌", "en": "PFR SRP IP Double Barreling Gutshots on Ax DB Boards", "q": "A-K-7双色牌面实例", "clues": ["QJo", "QTo", "JTo", "15%"], "a": ["在A♠K♠7♦牌面上，转牌空白牌时，QJo和QTo全局为20/80比例，JTo接近纯下注。", "按花色细分：持有黑桃（与牌面同花色）时下注频率极低，QJo为15%、QTo为11%、JTo为0%；不持有黑桃时JTo纯下注，QJo和QTo升至40/60比例。", "该牌面再次验证了同一规律，且JTo在无阻挡牌时从0%下注跃升至100%下注，差异极为显著。"], "note": ""}, {"id": "DGL#15-s6", "ep": "15", "type": "topic", "topic": "DGL#15 - 翻前加注单次加注底池有利位置：在Ax双高张双色翻牌面上双重开枪诈唬卡顺听牌", "en": "PFR SRP IP Double Barreling Gutshots on Ax DB Boards", "q": "核心启发式规则", "clues": ["JTo"], "a": ["简单规则：转牌发出空白牌后，如果你持有卡顺听牌且带有同花听牌阻挡牌，应纯过牌；如果不带阻挡牌，应以40/60或50/50的比例下注。", "该规则适用于所有Ax双高张双色翻牌面，且不因卡顺的具体类型（如两端顺子听牌）而改变——即使JTo在A-Q-9牌面上是两端顺子听牌，带阻挡牌时仍纯过牌。", "底层逻辑：对手翻牌圈跟注的卡顺听牌大多依赖后门同花听牌，你的阻挡牌会减少对手弃牌范围，降低诈唬的期望值。"], "note": ""}, {"id": "DGL#15-c2", "ep": "15", "type": "cloze", "topic": "DGL#15 - 翻前加注单次加注底池有利位置：在Ax双高张双色翻牌面上双重开枪诈唬卡顺听牌", "en": "PFR SRP IP Double Barreling Gutshots on Ax DB Boards", "q": "即＿＿下注、80%过牌；JTo（非同花JT）为50/50比例。", "clues": [], "a": ["在A♠K♠8♦牌面上，转牌空白牌后，QJo（非同花QJ）和QTo（非同花QT）全局使用20/80的下注/过牌比例，即20%下注、80%过牌；JTo（非同花JT）为50/50比例。"], "note": "20%"}, {"id": "DGL#15-c3", "ep": "15", "type": "cloze", "topic": "DGL#15 - 翻前加注单次加注底池有利位置：在Ax双高张双色翻牌面上双重开枪诈唬卡顺听牌", "en": "PFR SRP IP Double Barreling Gutshots on Ax DB Boards", "q": "KJo和KTo（非同花KJ、KT）全局为20/80比例（＿＿下注、80%过牌）。", "clues": [], "a": ["转牌发出3♥空白牌后，KJo和KTo（非同花KJ、KT）全局为20/80比例（20%下注、80%过牌）。"], "note": "20%"}, {"id": "DGL#15-c4", "ep": "15", "type": "cloze", "topic": "DGL#15 - 翻前加注单次加注底池有利位置：在Ax双高张双色翻牌面上双重开枪诈唬卡顺听牌", "en": "PFR SRP IP Double Barreling Gutshots on Ax DB Boards", "q": "KTo和QTo（非同花KT、QT）全局为30/70比例（＿＿下注、70%过牌）。", "clues": [], "a": ["KTo和QTo（非同花KT、QT）全局为30/70比例（30%下注、70%过牌）。"], "note": "30%"}, {"id": "DGL#15-note", "ep": "15", "type": "note", "topic": "DGL#15 - 翻前加注单次加注底池有利位置：在Ax双高张双色翻牌面上双重开枪诈唬卡顺听牌", "en": "PFR SRP IP Double Barreling Gutshots on Ax DB Boards", "q": "避坑提醒与行动项", "clues": ["DGL", "Deep Game Logic", "OOP"], "a": ["本视频属于DGL系列（Deep Game Logic）第15期，聚焦于翻前加注单次加注底池中有利位置玩家的转牌圈策略，特别是花色选择对诈唬频率的影响。视频建立在翻牌圈超池下注策略的基础上，为玩家提供了可操作的花色过滤规则，可直接应用于实战决策。", "进一步学习方向：可研究转牌发出同花牌（而非空白牌）时该规则如何调整，以及不利位置（OOP）玩家面对这一策略时的最优防守范围。视频中反复出现的20/80、50/50、40/60等频率数据，建议结合GTO软件自行验证，以加深对阻挡牌效应的理解。", "**行动项与常见错误：**", "- 应该做：在Ax双高张双色翻牌面超池下注被跟注后，转牌空白牌时，优先用不带同花听牌阻挡牌的卡顺听牌下注。", "- 应该做：不带阻挡牌时，采用40/60或50/50的下注/过牌比例，保持范围平衡。", "- 不要做：不要因为卡顺听牌本身的价值（如两端顺子听牌）而忽略花色因素，带阻挡牌时即使听牌更强也应纯过牌。", "- 不要做：不要在转牌圈继续用带同花听牌阻挡牌的卡顺听牌诈唬，这会显著降低你的期望值。"], "note": ""}, {"id": "DGL#16-intro", "ep": "16", "type": "intro", "topic": "DGL#16 - 翻前加注单次加注底池有利位置双重下注：A小踢脚+同花阻挡牌", "en": "PFR SRP IP Double Barreling Ax Low Kicker + FD Blocker", "q": "DGL#16 - 翻前加注单次加注底池有利位置双重下注：A小踢脚+同花阻挡牌", "clues": ["PFR", "SRP", "size down"], "a": ["本视频聚焦于一个特定的翻牌圈与转牌圈下注场景：翻前加注者（PFR）在单次加注底池（SRP）中处于有利位置（IP），翻牌圈选择小尺度下注（size down），转牌圈面对同花听牌出现或翻牌已是双色面且转牌为非同花牌时，如何利用“A小踢脚+同花阻挡牌”这一组合来提高双重下注（double barrel）的准确率。讲师提出了一套“频率启发式”与“组合花色启发式”相结合的决策框架。", "该启发式适用于特定的牌面结构：翻牌圈为干燥牌面（如高牌K、Q、J组合），转牌圈出现同花听牌，且转牌未完成顺子、未配对牌面。在这些场景下，讲师强调单纯依赖顺子听牌和同花听牌并不足以构建平衡的范围，必须纳入A6o、A5o、A4o等非同花A小牌组合，利用其同花阻挡牌属性来优化下注频率。", "视频通过多个具体牌面示例（如K-7-2-9、Q-7-3、J-7-2）展示了这一启发式的应用方式，并给出了明确的频率建议：在转牌为高牌（尤其是K或Q）时纯下注这些组合，在非高牌转牌时采用80%下注、20%过牌的频率分配。这一方法旨在填补玩家在“butterspeak盲区”中的策略空白。"], "note": ""}, {"id": "DGL#16-s0", "ep": "16", "type": "topic", "topic": "DGL#16 - 翻前加注单次加注底池有利位置双重下注：A小踢脚+同花阻挡牌", "en": "PFR SRP IP Double Barreling Ax Low Kicker + FD Blocker", "q": "启发式适用条件", "clues": ["bet small"], "a": ["该启发式适用于翻牌圈选择小尺度下注（bet small）的牌面结构，主要是干燥牌面，包含高牌（K高、Q高、J高）组合。", "转牌圈必须满足以下条件：转牌带来同花听牌（或翻牌已是双色面且转牌为非同花牌），且转牌未完成顺子、未配对牌面。", "这些场景下，玩家范围内通常有大量顺子听牌和同花听牌可用，但仅靠这些听牌不足以构建平衡的下注范围。"], "note": ""}, {"id": "DGL#16-s1", "ep": "16", "type": "topic", "topic": "DGL#16 - 翻前加注单次加注底池有利位置双重下注：A小踢脚+同花阻挡牌", "en": "PFR SRP IP Double Barreling Ax Low Kicker + FD Blocker", "q": "核心组合选择", "clues": ["A6o", "A5o", "A4o", "pure betting"], "a": ["讲师重点推荐使用A6o、A5o、A4o（非同花A6、A5、A4）作为双重下注的补充组合，主要利用其同花阻挡牌属性。", "在9♠转牌示例中，A6、A5、A4主要以极高频率纯下注（pure betting），部分情况下落入75%下注频率的区间。", "该启发式在不同转牌面下重复出现，无论转牌是10♠、J♠还是Q♠，A6及以下的A小牌组合都保持纯下注或75%下注的高频率。"], "note": ""}, {"id": "DGL#16-s2", "ep": "16", "type": "topic", "topic": "DGL#16 - 翻前加注单次加注底池有利位置双重下注：A小踢脚+同花阻挡牌", "en": "PFR SRP IP Double Barreling Ax Low Kicker + FD Blocker", "q": "具体牌面示例", "clues": ["A9s", "75%"], "a": ["K-7-2-9牌面：转牌9，A6、A5、A4以纯下注或75%频率下注，利用同花阻挡牌。", "Q-7-3牌面：若转牌为K♠，持有K♠的组合纯下注；若持有J♠，纯下注或75%下注；若持有10♠，同样纯下注或75%下注。", "J-7-2彩虹牌面：转牌为高牌（如A）时，A6、A5、A4纯下注，甚至没有同花阻挡牌时也下注；A9s（含A♠）在10♠转牌（完成顺子）时仍以可观频率下注。"], "note": ""}, {"id": "DGL#16-s3", "ep": "16", "type": "topic", "topic": "DGL#16 - 翻前加注单次加注底池有利位置双重下注：A小踢脚+同花阻挡牌", "en": "PFR SRP IP Double Barreling Ax Low Kicker + FD Blocker", "q": "频率分配建议", "clues": ["A7o", "overcard", "80%", "20%"], "a": ["转牌圈，将A7o及更低的非同花A牌（A7o或更低）纳入下注范围。", "若持有同花阻挡牌，将这些组合放入80%下注频率区间：80%时间下注，20%时间过牌。", "在转牌为高牌（overcard）时，特别是K转牌，偶尔也包括Q转牌，对这些组合进行纯下注（100%频率）。", "在非高牌转牌上，采用80-20分配：80%下注，20%过牌。"], "note": ""}, {"id": "DGL#16-s4", "ep": "16", "type": "topic", "topic": "DGL#16 - 翻前加注单次加注底池有利位置双重下注：A小踢脚+同花阻挡牌", "en": "PFR SRP IP Double Barreling Ax Low Kicker + FD Blocker", "q": "常见错误与误区", "clues": ["A6o", "A5o", "A4o"], "a": ["不要仅依赖顺子听牌和同花听牌来构建转牌下注范围，这会导致范围不平衡，缺乏足够的诈唬组合。", "不要忽视A小踢脚非同花组合（A6o、A5o、A4o）的价值，它们虽然牌力不强，但同花阻挡牌属性使其成为理想的双重下注候选。", "不要在转牌为高牌时降低这些组合的下注频率，高牌转牌恰恰是纯下注这些组合的最佳时机。"], "note": ""}, {"id": "DGL#16-c1", "ep": "16", "type": "cloze", "topic": "DGL#16 - 翻前加注单次加注底池有利位置双重下注：A小踢脚+同花阻挡牌", "en": "PFR SRP IP Double Barreling Ax Low Kicker + FD Blocker", "q": "A6、A5、A4主要以极高频率纯下注（pure betting），部分情况下落入＿＿下注频率的区间。", "clues": [], "a": ["在9♠转牌示例中，A6、A5、A4主要以极高频率纯下注（pure betting），部分情况下落入75%下注频率的区间。"], "note": "75%"}, {"id": "DGL#16-c2", "ep": "16", "type": "cloze", "topic": "DGL#16 - 翻前加注单次加注底池有利位置双重下注：A小踢脚+同花阻挡牌", "en": "PFR SRP IP Double Barreling Ax Low Kicker + FD Blocker", "q": "A6、A5、A4以纯下注或＿＿频率下注，利用同花阻挡牌。", "clues": [], "a": ["K-7-2-9牌面：转牌9，A6、A5、A4以纯下注或75%频率下注，利用同花阻挡牌。"], "note": "75%"}, {"id": "DGL#16-c3", "ep": "16", "type": "cloze", "topic": "DGL#16 - 翻前加注单次加注底池有利位置双重下注：A小踢脚+同花阻挡牌", "en": "PFR SRP IP Double Barreling Ax Low Kicker + FD Blocker", "q": "将这些组合放入＿＿下注频率区间：80%时间下注，20%时间过牌。", "clues": [], "a": ["若持有同花阻挡牌，将这些组合放入80%下注频率区间：80%时间下注，20%时间过牌。"], "note": "80%"}, {"id": "DGL#16-note", "ep": "16", "type": "note", "topic": "DGL#16 - 翻前加注单次加注底池有利位置双重下注：A小踢脚+同花阻挡牌", "en": "PFR SRP IP Double Barreling Ax Low Kicker + FD Blocker", "q": "避坑提醒与行动项", "clues": ["DGL", "A6o", "A5o"], "a": ["本视频是DGL系列第16期，承接了之前关于翻前加注、单次加注底池、有利位置下注策略的讨论，重点深化了转牌圈双重下注的决策框架。该启发式与“频率启发式”和“组合花色启发式”相结合，为玩家在特定牌面结构下提供了可操作的决策依据。建议结合系列中关于翻牌圈小尺度下注和转牌圈范围构建的其他视频进行系统学习。", "**行动项与常见错误：**", "- 在干燥高牌牌面、转牌出现同花听牌且未完成顺子或未配对时，主动加入A6o、A5o、A4o等非同花A小牌进行双重下注。", "- 持有同花阻挡牌时，采用80%下注、20%过牌的频率分配；转牌为高牌（K或Q）时，改为纯下注。", "- 不要仅依赖听牌构建下注范围，务必纳入A小踢脚非同花组合以平衡范围。", "- 避免在转牌为高牌时减少这些组合的下注频率，高牌转牌是纯下注的最佳时机。"], "note": ""}, {"id": "DGL#17-intro", "ep": "17", "type": "intro", "topic": "DGL#17 - 翻前加注底池、不利位置下，转牌A发出时用小对子双重下注的策略", "en": "PFR 3BP OOP Double Barreling Low Pockets on Ace Turn", "q": "DGL#17 - 翻前加注底池、不利位置下，转牌A发出时用小对子双重下注的策略", "clues": ["GTO"], "a": ["本视频聚焦于一个非常具体的翻后场景：在小盲位对阵按钮位的三人底池中，我们处于不利位置，翻牌圈小注下注并被跟注后，转牌发出A且非对子、非同花、非顺子牌面。在此情境下，视频揭示了GTO求解器的一个反直觉策略——大量使用低对子和中对子进行双重下注。", "视频的核心发现是，当转牌发出A时，求解器倾向于“去极化”下注，即使用小尺寸下注（1/4底池或12%底池），且下注范围中高达37%由低对子、小对子和中对子构成。这与大多数玩家在实际游戏中的做法截然不同，多数人很少会用这类牌在转牌A发出时继续下注。", "视频通过多个具体牌例展示了这一策略的普遍性，并给出了明确的执行频率建议：在转牌A发出时，应以小尺寸下注低对子约40%的时间。这一发现对于改进玩家在特定翻后场景中的剥削性策略具有重要参考价值。"], "note": ""}, {"id": "DGL#17-s0", "ep": "17", "type": "topic", "topic": "DGL#17 - 翻前加注底池、不利位置下，转牌A发出时用小对子双重下注的策略", "en": "PFR 3BP OOP Double Barreling Low Pockets on Ace Turn", "q": "场景定义与筛选条件", "clues": [], "a": ["视频分析的具体场景为：三人底池、小盲位对阵按钮位、翻牌圈小注下注被跟注后，转牌圈获得下注机会。", "转牌条件限定为：发出A、非对子转牌、非同花第三张或第四张、非同花第四张顺子牌面。", "该场景在求解器数据中共有677个实例，确保了统计的可靠性。"], "note": ""}, {"id": "DGL#17-s1", "ep": "17", "type": "topic", "topic": "DGL#17 - 翻前加注底池、不利位置下，转牌A发出时用小对子双重下注的策略", "en": "PFR 3BP OOP Double Barreling Low Pockets on Ace Turn", "q": "去极化下注与尺寸选择", "clues": ["56%", "12%", "75%"], "a": ["求解器在此类转牌A牌面上倾向于“去极化”下注，而非极化下注。", "平均下注频率为56%，且主要使用小尺寸下注。", "1/4底池和12%底池两种小尺寸合计占下注行为的75%，即75%的下注时间使用这两种小尺寸。"], "note": ""}, {"id": "DGL#17-s2", "ep": "17", "type": "topic", "topic": "DGL#17 - 翻前加注底池、不利位置下，转牌A发出时用小对子双重下注的策略", "en": "PFR 3BP OOP Double Barreling Low Pockets on Ace Turn", "q": "下注范围构成分析", "clues": ["TT-JJ", "37%"], "a": ["在求解器选择下注的范围中，低对子（22-55）、小对子（66-99）和中对子（TT-JJ）合计占37%。", "这一构成比例非常高，表明求解器非常重视用这些中等强度牌进行下注。", "大多数玩家（尤其是中低级别玩家）在实际游戏中很少用这类牌双重下注，这是一个常见的策略错误。"], "note": ""}, {"id": "DGL#17-s3", "ep": "17", "type": "topic", "topic": "DGL#17 - 翻前加注底池、不利位置下，转牌A发出时用小对子双重下注的策略", "en": "PFR 3BP OOP Double Barreling Low Pockets on Ace Turn", "q": "具体牌例展示", "clues": ["12%"], "a": ["口袋对子66：翻牌Q-9-7，转牌A，继续小尺寸下注。", "口袋对子77：翻牌K-9-6彩虹面，转牌A，双重下注。", "口袋对子JJ：翻牌K-9-6，转牌A，继续下注。", "口袋对子77：翻牌Q-J-6，转牌A（形成三张高牌），继续下注。", "口袋对子88：翻牌Q-J-6，转牌A，使用12%底池下注。", "口袋对子TT：翻牌K-9-6，转牌A，使用小尺寸下注。"], "note": ""}, {"id": "DGL#17-s4", "ep": "17", "type": "topic", "topic": "DGL#17 - 翻前加注底池、不利位置下，转牌A发出时用小对子双重下注的策略", "en": "PFR 3BP OOP Double Barreling Low Pockets on Ace Turn", "q": "下注频率与阻挡牌影响", "clues": ["42%", "40%", "75%", "50%"], "a": ["低对子在转牌A发出时的双重下注频率为42%，属于40%频率区间。", "在K-9-6-A牌面上，求解器几乎用整个范围下注1/4底池。", "口袋对子77下注频率约75%，口袋对子88约50%，口袋对子99约50%。", "口袋对子TT带方片时下注频率更高，不带方片时约50%。", "在Q-J-4-A（三张高牌）牌面上，口袋对子66带红桃时几乎纯下注，不带红桃时约75%；口袋对子77约75%；口袋对子55纯下注；口袋对子88约25%。", "在Q-9-5-A牌面上，口袋对子66和77几乎总是下注，口袋对子88不带红桃时下注25%。"], "note": ""}, {"id": "DGL#17-s5", "ep": "17", "type": "topic", "topic": "DGL#17 - 翻前加注底池、不利位置下，转牌A发出时用小对子双重下注的策略", "en": "PFR 3BP OOP Double Barreling Low Pockets on Ace Turn", "q": "核心执行原则", "clues": ["40%"], "a": ["在翻前加注底池、不利位置、转牌A发出的场景下，应以小尺寸下注低对子约40%的时间。", "求解器倾向于使用去极化的小尺寸下注，而非极化的大尺寸下注。", "低对子在此类牌面上具有较高的下注频率，应避免过度弃牌或过牌。"], "note": ""}, {"id": "DGL#17-c1", "ep": "17", "type": "cloze", "topic": "DGL#17 - 翻前加注底池、不利位置下，转牌A发出时用小对子双重下注的策略", "en": "PFR 3BP OOP Double Barreling Low Pockets on Ace Turn", "q": "平均下注频率为＿＿，且主要使用小尺寸下注。", "clues": [], "a": ["平均下注频率为56%，且主要使用小尺寸下注。"], "note": "56%"}, {"id": "DGL#17-c2", "ep": "17", "type": "cloze", "topic": "DGL#17 - 翻前加注底池、不利位置下，转牌A发出时用小对子双重下注的策略", "en": "PFR 3BP OOP Double Barreling Low Pockets on Ace Turn", "q": "低对子（22-55）、小对子（66-99）和中对子（TT-JJ）合计占＿＿。", "clues": [], "a": ["在求解器选择下注的范围中，低对子（22-55）、小对子（66-99）和中对子（TT-JJ）合计占37%。"], "note": "37%"}, {"id": "DGL#17-c3", "ep": "17", "type": "cloze", "topic": "DGL#17 - 翻前加注底池、不利位置下，转牌A发出时用小对子双重下注的策略", "en": "PFR 3BP OOP Double Barreling Low Pockets on Ace Turn", "q": "转牌A，使用＿＿底池下注。", "clues": [], "a": ["口袋对子88：翻牌Q-J-6，转牌A，使用12%底池下注。"], "note": "12%"}, {"id": "DGL#17-note", "ep": "17", "type": "note", "topic": "DGL#17 - 翻前加注底池、不利位置下，转牌A发出时用小对子双重下注的策略", "en": "PFR 3BP OOP Double Barreling Low Pockets on Ace Turn", "q": "避坑提醒与行动项", "clues": ["DGL", "12%", "40%"], "a": ["本视频是DGL系列第17期，专注于翻前加注底池中不利位置的双重下注策略。视频通过求解器数据揭示了低对子在转牌A牌面上的高频下注行为，这一发现与多数玩家的直觉相悖，具有重要的实战指导意义。建议玩家在实际游戏中尝试将低对子纳入双重下注范围，并注意根据阻挡牌（如红桃、方片）微调下注频率。", "行动项：", "- 在转牌A发出时，应以小尺寸（1/4底池或12%底池）下注低对子约40%的时间。", "- 避免在转牌A发出时过度弃掉低对子，应积极考虑继续下注。", "- 注意阻挡牌的影响：带特定花色（如红桃、方片）的低对子下注频率更高。"], "note": ""}, {"id": "DGL#18-intro", "ep": "18", "type": "intro", "topic": "DGL#18 - 3-bet底池中位置优势：利用低对子在转牌与河牌诈唬", "en": "PFC 3BP IP Using Low Pockets to Bluff Turn and River", "q": "DGL#18 - 3-bet底池中位置优势：利用低对子在转牌与河牌诈唬", "clues": ["bet"], "a": ["本视频聚焦于3-bet底池中，作为翻前跟注方且拥有位置优势时，如何利用低对子（22-55）在转牌与河牌进行诈唬。讲师通过多个实战牌例，系统展示了低对子在不同行动线（跟注翻牌后转牌下注、延迟持续下注、翻牌下注后转牌继续下注、翻牌加注等）中的诈唬价值，并强调这类牌型对于平衡转牌下注范围的重要性。", "核心观点是：低对子（尤其是22-55）是转牌下注范围中不可或缺的诈唬牌型，因为它们完全不阻挡对手的弃牌范围，同时偶尔能改进为更强牌型（如暗三条）从而实现摊牌价值。讲师通过具体牌例和频率建议，帮助玩家理解何时以及如何将这些牌转化为诈唬，从而提升整体策略的平衡性与剥削能力。", "视频最后总结指出，若想在转牌下注范围中实现更好的平衡，必须将低对子纳入诈唬组合之中，这是构建完整、不可预测策略的关键环节。"], "note": ""}, {"id": "DGL#18-s0", "ep": "18", "type": "topic", "topic": "DGL#18 - 3-bet底池中位置优势：利用低对子在转牌与河牌诈唬", "en": "PFC 3BP IP Using Low Pockets to Bluff Turn and River", "q": "低对子诈唬的核心逻辑", "clues": ["bet"], "a": ["低对子（22-55）在3-bet底池的转牌下注线中极为重要，几乎任何需要在转牌下注的线路，其下注范围构成中都包含大量低对子。", "这些牌型是极其强大的诈唬牌，因为它们拥有对手弃牌范围的完全非阻挡牌（complete unblockers），意味着对手手中所有可能弃掉的中等牌型（如口袋对子88、99、TT）都不会被低对子阻挡。", "低对子有时能改进为更好的牌型（如击中暗三条），从而在河牌实现摊牌胜利甚至赢下大底池。", "适用线路包括：跟注翻牌后转牌下注、翻牌过牌后转牌延迟持续下注、翻牌下注后转牌继续下注等。"], "note": ""}, {"id": "DGL#18-s1", "ep": "18", "type": "topic", "topic": "DGL#18 - 3-bet底池中位置优势：利用低对子在转牌与河牌诈唬", "en": "PFC 3BP IP Using Low Pockets to Bluff Turn and River", "q": "翻牌漂浮后转牌诈唬", "clues": ["bet", "float"], "a": ["牌例一：手持口袋对子44，翻前面对小盲的3-bet（再加注）后跟注，翻牌为双高张且略带连接的牌面（如K-Q-J类型）。", "在该类牌面上，必须有时用44进行漂浮跟注（float），因为后续转牌和河牌将用其作为多街诈唬的武器。", "转牌采用小尺度下注（保护性下注），目的是让对手弃掉可能在河牌诈唬或反超的听牌，同时偶尔会被更差的对子跟注。", "该牌例中，44在河牌最终弃牌，但其他类似牌例展示了成功诈唬的场景。"], "note": ""}, {"id": "DGL#18-s2", "ep": "18", "type": "topic", "topic": "DGL#18 - 3-bet底池中位置优势：利用低对子在转牌与河牌诈唬", "en": "PFC 3BP IP Using Low Pockets to Bluff Turn and River", "q": "转牌延迟持续下注", "clues": [], "a": ["牌例：手持口袋对子33，翻牌面为K-Q-J，对手过牌后，需要以一定频率将33转化为诈唬，进行延迟持续下注。", "讲师强调，面对对手过牌时，低对子应被纳入诈唬范围，以增加转牌下注范围的平衡性。", "这类下注利用对手范围中大量中等牌型（如口袋对子88-1010）的弃牌倾向，实现诈唬收益。"], "note": ""}, {"id": "DGL#18-s3", "ep": "18", "type": "topic", "topic": "DGL#18 - 3-bet底池中位置优势：利用低对子在转牌与河牌诈唬", "en": "PFC 3BP IP Using Low Pockets to Bluff Turn and River", "q": "翻牌下注后转牌继续下注", "clues": [], "a": ["牌例：手持口袋对子44，翻牌面为K-J-x，对手（KJ）过牌后，以中等频率进行小尺度翻牌下注。", "对手跟注后，转牌发出K，此时继续将44转化为诈唬，并计划在河牌全下。", "该牌例中对手最终持有两对，但讲师指出这正是低对子诈唬价值的体现——即使偶尔被抓，长期来看这类诈唬仍是正EV的。", "另一牌例：翻牌对手过牌后，用口袋对子44进行三街连续诈唬（翻牌、转牌、河牌全下），展示低对子在多街诈唬中的威力。"], "note": ""}, {"id": "DGL#18-s4", "ep": "18", "type": "topic", "topic": "DGL#18 - 3-bet底池中位置优势：利用低对子在转牌与河牌诈唬", "en": "PFC 3BP IP Using Low Pockets to Bluff Turn and River", "q": "延迟持续下注的具体案例", "clues": [], "a": ["牌例：手持口袋对子55，对手（AA）翻牌过牌后，转牌发出A，此时将55转化为诈唬进行延迟持续下注。", "55是极佳的诈唬牌，因为它完全不阻挡对手弃牌范围中的中等牌型（如口袋对子88、99、1010），这些牌在转牌面对下注时大概率弃牌。", "当河牌发出配对牌时，55选择放弃诈唬，展示了对牌面动态的敏锐判断。"], "note": ""}, {"id": "DGL#18-s5", "ep": "18", "type": "topic", "topic": "DGL#18 - 3-bet底池中位置优势：利用低对子在转牌与河牌诈唬", "en": "PFC 3BP IP Using Low Pockets to Bluff Turn and River", "q": "翻牌加注线路中的低对子", "clues": ["12%"], "a": ["牌例：翻牌面为A-T-5彩虹，对手下注12%底池（小尺度），手持口袋对子33选择加注。", "讲师指出，在类似牌面上，可以用22、33、44甚至偶尔66以一定频率进行翻牌加注。", "33特别适合的原因是带有后门顺子听牌（底牌3-4-5-6的顺子潜力），增加了诈唬的额外收益。", "加注被跟注后，转牌继续下注，河牌全下，最终迫使对手弃掉口袋对子JJ，成功完成三街诈唬。"], "note": ""}, {"id": "DGL#18-s6", "ep": "18", "type": "topic", "topic": "DGL#18 - 3-bet底池中位置优势：利用低对子在转牌与河牌诈唬", "en": "PFC 3BP IP Using Low Pockets to Bluff Turn and River", "q": "平衡转牌下注范围的必要性", "clues": [], "a": ["讲师总结：若想实现更平衡的策略，必须将低对子纳入转牌下注范围的构成中。", "低对子适用于所有不同的转牌下注线路（跟注后下注、延迟持续下注、翻牌下注后继续下注、翻牌加注后下注等），是构建完整诈唬体系的基础。", "忽略低对子会导致转牌下注范围过于偏向强牌或高张牌，使对手更容易剥削。"], "note": ""}, {"id": "DGL#18-c5", "ep": "18", "type": "cloze", "topic": "DGL#18 - 3-bet底池中位置优势：利用低对子在转牌与河牌诈唬", "en": "PFC 3BP IP Using Low Pockets to Bluff Turn and River", "q": "对手下注＿＿底池（小尺度），手持口袋对子33选择加注。", "clues": [], "a": ["牌例：翻牌面为A-T-5彩虹，对手下注12%底池（小尺度），手持口袋对子33选择加注。"], "note": "12%"}, {"id": "DGL#18-note", "ep": "18", "type": "note", "topic": "DGL#18 - 3-bet底池中位置优势：利用低对子在转牌与河牌诈唬", "en": "PFC 3BP IP Using Low Pockets to Bluff Turn and River", "q": "避坑提醒与行动项", "clues": ["DGL", "Deep Game Layers", "bet"], "a": ["本视频属于DGL系列（Deep Game Layers）第18期，聚焦于3-bet底池中位置优势下的转牌诈唬策略。视频承接了系列中关于翻前3-bet底池构建和翻牌圈策略的内容，进一步深入到转牌与河牌的诈唬执行层面。建议观众先掌握3-bet底池的翻前范围构建和翻牌圈下注频率，再学习本视频的转牌诈唬技巧，效果更佳。", "值得进一步学习的方向包括：低对子在不利位置（OOP）时的诈唬策略、转牌发出高张时的范围调整、以及如何根据对手的弃牌频率动态调整低对子的诈唬频率。", "**行动项与常见错误：**", "- 应该做：在3-bet底池中，作为有利位置跟注方，转牌下注范围中应包含低对子（22-55）作为诈唬组合。", "- 应该做：在翻牌圈用低对子进行漂浮跟注或小尺度下注时，要有明确的转牌诈唬计划。", "- 应该做：利用低对子的非阻挡特性，针对对手弃牌范围中的中等口袋对子（88-1010）进行诈唬。", "- 不要做：在转牌下注范围中完全排除低对子，这会导致范围过于线性，容易被对手剥削。", "- 不要做：在河牌发出明显改进对手范围的牌面时（如转牌A、河牌配对），盲目继续诈唬，应学会适时放弃。"], "note": ""}, {"id": "DGL#19-intro", "ep": "19", "type": "intro", "topic": "DGL#19 - 翻前加注单次加注底池不利位置：转牌圈卡顺听牌的打法", "en": "PFR SRP OOP How to Play Gutshots on the Turn", "q": "DGL#19 - 翻前加注单次加注底池不利位置：转牌圈卡顺听牌的打法", "clues": ["Green Line", "PFR", "SRP"], "a": ["本视频是 Green Line 系列第 19 期，聚焦于翻前加注（PFR）后进入单次加注底池（SRP）、处于不利位置（OOP）时，转牌圈持有卡顺听牌（gutshot）的决策框架。讲师首先指出卡顺听牌是该场景下最高频的手牌类别，因此必须建立清晰的打法启发式规则。视频基于大量 solver 数据分析，给出了不同情况下的下注/过牌频率基准，并进一步拆解了影响具体组合频率的多个维度。", "视频的核心贡献在于两层结构：第一层是手牌类别频率启发式（Hand Class Frequency Heuristic），即根据是否带 A 高牌、转牌是否为高牌或空白牌来调整整体下注频率；第二层是组合层面的精细化调整，包括是否带高牌、是否阻挡同花听牌、是否解除同花听牌阻挡、以及是否阻挡对手弃牌范围等四个要素。通过这两层叠加，玩家可以达到极高的频率精确度。", "视频还特别强调了“即使转牌对你的范围非常有利，也不能总是下注”的平衡原则，以及具体牌面（如 953 彩虹面）上不同组合（如 KJs、T8o、87o）之间的频率差异及其背后的逻辑。最后，讲师提醒玩家，手牌类别的整体频率只是起点，具体组合的频率还需结合花色和阻挡效应进行微调。"], "note": ""}, {"id": "DGL#19-s0", "ep": "19", "type": "topic", "topic": "DGL#19 - 翻前加注单次加注底池不利位置：转牌圈卡顺听牌的打法", "en": "PFR SRP OOP How to Play Gutshots on the Turn", "q": "卡顺听牌是最高频手牌类别", "clues": ["Green Line", "65%"], "a": ["在翻前加注、翻牌被跟注、转牌处于不利位置的场景中，四张卡顺听牌（4-out straight draw）是出现频率最高的手牌类别。", "由于该场景下卡顺听牌数量庞大（数据中约 5.7k 样本中的 3.7k，占比约 65%），掌握其打法对整体策略至关重要。", "此前第 8 期 Green Line 视频已讨论过顺子听牌、同花听牌和组合听牌的打法，但当时未包含卡顺听牌，因此本视频专门补充这一缺口。"], "note": ""}, {"id": "DGL#19-s1", "ep": "19", "type": "topic", "topic": "DGL#19 - 翻前加注单次加注底池不利位置：转牌圈卡顺听牌的打法", "en": "PFR SRP OOP How to Play Gutshots on the Turn", "q": "核心区分：A 高卡顺与非 A 高卡顺", "clues": ["ace high gutshot", "non-ace high", "check-call", "40%"], "a": ["第一层区分标准是卡顺听牌是否带 A 高牌（ace high gutshot）还是非 A 高牌（non-ace high gutshot）。", "全局数据（所有牌面汇总）显示：A 高卡顺的下注频率为 40%，过牌频率为 60%（40/60 拆分）。", "非 A 高卡顺的下注频率为 60%，过牌频率为 40%（60/40 拆分）。", "逻辑解释：A 高卡顺（如 AK、AQ、AJ、AT）通常带有高张踢脚，这些牌更适合过牌-跟注（check-call）而非主动下注。", "非 A 高卡顺占所有卡顺的约 65%（3.7k/5.7k），是更常见的类型，因此后续重点分析此类。"], "note": ""}, {"id": "DGL#19-s2", "ep": "19", "type": "topic", "topic": "DGL#19 - 翻前加注单次加注底池不利位置：转牌圈卡顺听牌的打法", "en": "PFR SRP OOP How to Play Gutshots on the Turn", "q": "转牌为高牌时增加下注频率", "clues": ["overcard", "60%", "40%", "20%"], "a": ["全局非 A 高卡顺的基准频率为 60/40 拆分（下注 60%，过牌 40%）。", "当转牌是一张高牌（overcard，即大于翻牌圈所有牌面的牌）时，下注频率显著提升至 80/20 拆分。", "高牌转牌通常是对你范围最有利的牌，但即便如此，仍不能总是下注——必须保留约 20% 的过牌频率以维持平衡。", "在转牌 A 的情况下，下注频率最高，数据显示为 80/18（约 80% 下注），而一般高牌转牌为 75/25。", "讲师建议：在转牌为高牌时，采用 80/20 拆分是接近最优的平衡策略。"], "note": ""}, {"id": "DGL#19-s3", "ep": "19", "type": "topic", "topic": "DGL#19 - 翻前加注单次加注底池不利位置：转牌圈卡顺听牌的打法", "en": "PFR SRP OOP How to Play Gutshots on the Turn", "q": "转牌为低牌（空白牌）时降低频率", "clues": ["low card", "blank", "solver"], "a": ["低牌转牌（low card）通常接近空白牌（blank），偶尔会带来同花听牌或完成某些顺子，但大多数情况下对牌面影响不大。", "数据显示，低牌转牌是该场景下最常见的转牌类型。", "在低牌转牌上，非 A 高卡顺的下注频率相比全局 60/40 有所下降，solver 显示约为 50/50 拆分。", "如果希望保持简单，可以将其四舍五入到 60/40 拆分（使用 0.2 频率桶的建议），但需注意实际上下注频率略低。", "保持平衡的关键在于：空白牌转牌出现频率高，如果在此类牌面下注过多，整体策略会失衡。"], "note": ""}, {"id": "DGL#19-s4", "ep": "19", "type": "topic", "topic": "DGL#19 - 翻前加注单次加注底池不利位置：转牌圈卡顺听牌的打法", "en": "PFR SRP OOP How to Play Gutshots on the Turn", "q": "组合层面的四个调整要素", "clues": ["overcard", "range"], "a": ["手牌类别频率只是起点，具体组合的实际下注频率取决于四个要素：1. 是否带高牌（overcard）：带高牌的组合下注频率更高。2. 是否阻挡同花听牌（flush draw blocker）：转牌出现同花听牌时，持有该花色阻挡牌的组合下注频率显著提升。3. 是否解除同花听牌阻挡（flush draw unblocker）：在彩虹牌面上，持有未出现花色的组合（即不阻挡对手漂浮跟注的花色）下注频率更高。4. 是否阻挡对手弃牌范围（blocker to folding range）：持有对手弃牌范围中常见牌（如 8、T、J）的组合，下注频率会降低。"], "note": ""}, {"id": "DGL#19-s5", "ep": "19", "type": "topic", "topic": "DGL#19 - 翻前加注单次加注底池不利位置：转牌圈卡顺听牌的打法", "en": "PFR SRP OOP How to Play Gutshots on the Turn", "q": "具体牌面示例：953 彩虹面", "clues": ["T8o", "100%", "75%", "25%"], "a": ["以 953 彩虹面为例（翻牌 9-5-3，转牌为某张牌），非 A 高卡顺的全局下注频率为 60/40。", "持有 KJ（带草花）时，由于同时具备高牌和同花听牌阻挡牌，下注频率升至 100%（纯下注策略）。", "持有 KT 时，带同花阻挡牌的组合（除黑桃 K 和红桃 K 外）为纯下注，其余组合下注频率为 75%。", "持有 T8o（非同花 T8）时，由于没有高牌、没有同花阻挡牌，下注频率降至 25% 或直接过牌。", "持有 87o 时，带同花阻挡牌的组合为纯下注，不带阻挡牌的组合频率较低。", "持有 86s（红桃）时，由于不阻挡对手在翻牌圈可能持有的黑桃、方片、草花漂浮跟注范围，下注频率较高；而 87s 红桃下注、87s 黑桃不过牌。"], "note": ""}, {"id": "DGL#19-s6", "ep": "19", "type": "topic", "topic": "DGL#19 - 翻前加注单次加注底池不利位置：转牌圈卡顺听牌的打法", "en": "PFR SRP OOP How to Play Gutshots on the Turn", "q": "阻挡弃牌范围的影响", "clues": ["T8o"], "a": ["对手的弃牌范围中会包含大量 8x、Tx 和 Jx 牌型，尤其是 8x（因为翻牌圈很多 8x 会以卡顺听牌形式漂浮跟注）。", "持有 8 是最差的阻挡牌，因为它阻挡了对手弃牌范围中数量最多的牌型。", "当 8 与 T 或 J 组合时（如 J8、T8），会成为“双重坏阻挡”，下注频率大幅降低。", "相比之下，87 中的 7 是较好的阻挡牌，因为它不阻挡对手的弃牌范围，因此 87 即使没有高牌，只要带同花阻挡牌，也可以纯下注。", "T8o 虽然带同花阻挡牌，但由于包含 T，下注频率下降，几乎无法达到纯下注。"], "note": ""}, {"id": "DGL#19-s7", "ep": "19", "type": "topic", "topic": "DGL#19 - 翻前加注单次加注底池不利位置：转牌圈卡顺听牌的打法", "en": "PFR SRP OOP How to Play Gutshots on the Turn", "q": "频率调整的叠加逻辑", "clues": ["solver"], "a": ["将手牌类别基准频率与四个要素结合：如果组合具备“解除弃牌阻挡 + 同花阻挡牌 + 高牌 + 解除同花听牌阻挡”，下注频率会显著上升。", "反之，如果组合“阻挡弃牌 + 无同花阻挡牌 + 无解除同花阻挡 + 无高牌”，下注频率会显著下降。", "通过这种叠加方式，玩家可以从 60/40 的基准出发，精确调整每个具体组合的下注频率，达到接近 solver 的精度。"], "note": ""}, {"id": "DGL#19-c0", "ep": "19", "type": "cloze", "topic": "DGL#19 - 翻前加注单次加注底池不利位置：转牌圈卡顺听牌的打法", "en": "PFR SRP OOP How to Play Gutshots on the Turn", "q": "由于该场景下卡顺听牌数量庞大（数据中约 5.7k 样本中的 3.7k，占比约 ＿＿），掌握其打法对整体策略至关重要。", "clues": [], "a": ["由于该场景下卡顺听牌数量庞大（数据中约 5.7k 样本中的 3.7k，占比约 65%），掌握其打法对整体策略至关重要。"], "note": "65%"}, {"id": "DGL#19-c1", "ep": "19", "type": "cloze", "topic": "DGL#19 - 翻前加注单次加注底池不利位置：转牌圈卡顺听牌的打法", "en": "PFR SRP OOP How to Play Gutshots on the Turn", "q": "全局数据（所有牌面汇总）显示：A 高卡顺的下注频率为 ＿＿，", "clues": [], "a": ["全局数据（所有牌面汇总）显示：A 高卡顺的下注频率为 40%，过牌频率为 60%（40/60 拆分）。"], "note": "40%"}, {"id": "DGL#19-c2", "ep": "19", "type": "cloze", "topic": "DGL#19 - 翻前加注单次加注底池不利位置：转牌圈卡顺听牌的打法", "en": "PFR SRP OOP How to Play Gutshots on the Turn", "q": "全局非 A 高卡顺的基准频率为 60/40 拆分（下注 ＿＿，", "clues": [], "a": ["全局非 A 高卡顺的基准频率为 60/40 拆分（下注 60%，过牌 40%）。"], "note": "60%"}, {"id": "DGL#19-note", "ep": "19", "type": "note", "topic": "DGL#19 - 翻前加注单次加注底池不利位置：转牌圈卡顺听牌的打法", "en": "PFR SRP OOP How to Play Gutshots on the Turn", "q": "避坑提醒与行动项", "clues": ["Green Line", "KJs", "20%"], "a": ["本视频是 Green Line 系列中关于转牌圈听牌打法的延伸，与第 8 期（转牌圈听牌分类）形成互补。第 8 期涵盖了顺子听牌、同花听牌和组合听牌，但未包含卡顺听牌；本视频专门填补了这一空白，并进一步深入到组合层面的频率微调。建议先观看第 8 期建立基础框架，再学习本期的精细化调整。", "值得进一步学习的方向包括：不同翻牌面结构（如连接性强的牌面 vs. 干燥牌面）对卡顺听牌频率的影响、转牌为对子牌面时的特殊处理、以及如何在实战中快速判断自己组合的阻挡效应。此外，讲师提到的“0.2 频率桶”方法（将频率四舍五入到 0%、20%、40%、60%、80%、100%）是简化决策的有效工具，值得在练习中反复应用。", "**行动项与常见错误：**", "- 不要对 A 高卡顺下注过多——记住 40/60 拆分（下注 40%，过牌 60%）。", "- 不要对非 A 高卡顺在空白转牌上下注过多——实际频率应略低于 60%，可近似为 50/50。", "- 转牌为高牌时，即使对你有利，也不要总是下注——保留约 20% 的过牌频率。", "- 持有 8x 组合时，要意识到这是最差的阻挡牌，下注频率应相应降低。", "- 持有带同花阻挡牌 + 高牌的组合（如 KJs 带草花），可以放心提高下注频率甚至纯下注。", "- 在彩虹牌面上，持有未出现花色的组合（解除同花阻挡）时，下注频率应高于其他花色组合。"], "note": ""}, {"id": "DGL#20-intro", "ep": "20", "type": "intro", "topic": "DGL#20 - 翻前3-bet底池中，处于不利位置时如何在转牌圈游戏中间对子", "en": "PFR 3BP OOP How to Play Middle Pair on the Turn", "q": "DGL#20 - 翻前3-bet底池中，处于不利位置时如何在转牌圈游戏中间对子", "clues": ["bet"], "a": ["本视频聚焦于一个极其常见的翻后场景：你在小盲位用3-bet(再加注)对抗按钮位的开局加注，翻牌圈下注被跟注后，你处于不利位置进入转牌圈。讲师指出，在这种局面下，你手中持有频率最高的两类牌型就是低对子和中间对子，因此掌握中间对子的正确玩法至关重要。", "视频的核心观点是：大多数玩家在转牌圈将中间对子作为纯粹的过牌范围来处理，这虽然是一个可行的简化策略，但从GTO(博弈论最优)平衡的角度来看，你需要在转牌圈的下注范围中包含一部分中间对子。讲师通过Solver数据展示了具体的下注频率，并分析了不同牌面结构对下注频率的影响——A高牌面、转牌出A或牌面成对的公共牌面，下注频率会显著提高。", "视频还深入探讨了中间对子下注的具体牌型选择逻辑：在非A高牌面上，主要下注的是带有高踢脚的第二对子（如A kicker或K kicker），因为这些牌型既能压制对手的跟注范围，又保留了一定的权益。最后，讲师给出了具体的频率数据：A高/成对牌面下注约30%，其他牌面下注约20%。"], "note": ""}, {"id": "DGL#20-s0", "ep": "20", "type": "topic", "topic": "DGL#20 - 翻前3-bet底池中，处于不利位置时如何在转牌圈游戏中间对子", "en": "PFR 3BP OOP How to Play Middle Pair on the Turn", "q": "场景定义与手牌分布", "clues": ["bet", "OOP", "Solver", "low pockets"], "a": ["本视频讨论的具体场景：你在小盲位3-bet(再加注)按钮位的开局加注，对手跟注，翻牌圈你下注被跟注，现在进入转牌圈，你处于不利位置（OOP）。", "根据Solver数据显示，在这个转牌圈局面中，你手中最频繁出现的两类牌型是低对子（low pockets）和中间对子（middle pair），因此搞清楚这两类牌型的玩法非常关键。", "讲师强调，这是3-bet底池中最常见的手牌类别，几乎每个玩家都会频繁遇到，值得投入时间深入研究。"], "note": ""}, {"id": "DGL#20-s1", "ep": "20", "type": "topic", "topic": "DGL#20 - 翻前3-bet底池中，处于不利位置时如何在转牌圈游戏中间对子", "en": "PFR 3BP OOP How to Play Middle Pair on the Turn", "q": "全局下注频率与常见误区", "clues": ["Solver", "75%", "25%", "100%"], "a": ["从全局范围来看，Solver建议在转牌圈对中间对子采取混合策略：75%的时候过牌，25%的时候下注。", "大多数玩家（包括观看本视频的观众）会把这手牌类作为纯粹的过牌范围处理，即100%过牌，没有任何下注。", "讲师指出，纯过牌是一个“可以接受的简化策略”（fine simplification），但如果你追求策略的精确平衡，就必须在转牌下注范围中加入一些中间对子。", "关键结论：平均而言，你需要在转牌圈用中间对子下注约26%的频率，才能保持策略的平衡性。"], "note": ""}, {"id": "DGL#20-s2", "ep": "20", "type": "topic", "topic": "DGL#20 - 翻前3-bet底池中，处于不利位置时如何在转牌圈游戏中间对子", "en": "PFR 3BP OOP How to Play Middle Pair on the Turn", "q": "下注中间对子的理论依据", "clues": ["Red Line", "population", "overfold", "Solver"], "a": ["这一建议源于之前一期视频（Red Line系列）的发现：普通玩家（population）在“下注-下注-过牌-面对河牌下注”的线路上会严重过度弃牌（overfold）。", "社区成员提出一个洞察：这种过度弃牌可能正是因为大多数玩家在转牌圈的下注范围中根本没有中间对子这类牌型。", "逻辑链条：Solver会用中间对子在转牌下注，然后在河牌圈过牌-跟注；如果人类玩家转牌根本不下注这些牌，那么他们自然无法在河牌做出正确的过牌-跟注决策。", "因此，如果你希望在河牌圈保持平衡，就必须在转牌圈的下注范围中包含中间对子。"], "note": ""}, {"id": "DGL#20-s3", "ep": "20", "type": "topic", "topic": "DGL#20 - 翻前3-bet底池中，处于不利位置时如何在转牌圈游戏中间对子", "en": "PFR 3BP OOP How to Play Middle Pair on the Turn", "q": "牌面结构对下注频率的影响", "clues": ["board texture", "ace high flops", "ace on the", "turn"], "a": ["讲师专门研究了不同牌面结构（board texture）对该场景下注频率的影响，发现牌面结构确实会产生一定影响，但幅度不大。", "下注频率更高的牌面类型：A高翻牌面（ace high flops）、转牌出A（ace on the turn）、或成对的公共牌面（paired runouts）。", "在这些牌面上，你更倾向于采用深度极化（deep polarized）的下注策略，因此中间对子会被纳入转牌下注范围。", "具体数据：当筛选A高翻牌、A高转牌或成对转牌时，中间对子的下注频率为29%，整体呈现约30-70的过牌/下注比例。", "在其他牌面类型上，下注频率降至20%，但仍然存在，并非完全过牌。"], "note": ""}, {"id": "DGL#20-s4", "ep": "20", "type": "topic", "topic": "DGL#20 - 翻前3-bet底池中，处于不利位置时如何在转牌圈游戏中间对子", "en": "PFR 3BP OOP How to Play Middle Pair on the Turn", "q": "A高牌面的下注模式与牌例", "clues": ["Solver", "double barrel", "12%", "25%"], "a": ["在A高牌面上，典型的下注模式是：翻牌圈下注12%底池（极小注），转牌圈继续下注25%底池（小注）。", "牌例1：手持KJ（非同花），翻牌面A-J-5彩虹面，Solver经常用中间对子配合小尺寸进行双重下注（double barrel）。", "牌例2：手持KJ，翻牌面A-9-7，翻牌圈下注1/4底池，转牌圈发出K后，Solver再次下注1/4底池。", "牌例3：翻牌面A-Q-8，Solver先下注12%底池，被跟注后转牌圈继续下注1/4底池。", "讲师总结：这类下注模式在A高牌面上出现频率非常高，是Solver策略中的常见操作。"], "note": ""}, {"id": "DGL#20-s5", "ep": "20", "type": "topic", "topic": "DGL#20 - 翻前3-bet底池中，处于不利位置时如何在转牌圈游戏中间对子", "en": "PFR 3BP OOP How to Play Middle Pair on the Turn", "q": "成对牌面的下注模式与牌例", "clues": ["Solver", "12%"], "a": ["成对的公共牌面同样会触发更高的中间对子下注频率，下注模式与A高牌面类似。", "牌例1：翻牌面K-9-6，翻牌圈用小尺寸下注，转牌圈牌面成对（发出K），继续采用深度极化策略下注。", "牌例2：手持A9，翻牌面Q-9-7，转牌圈发出Q（牌面成对），Solver选择继续下注。", "牌例3：手持口袋K（KK），翻牌面A-Q-A，转牌圈发出空白牌，Solver仍然下注。", "牌例4：手持J9，翻牌面A-T-5，翻牌圈下注极小（12%），转牌圈继续下注极小（12%）。", "讲师特别指出一个有趣的例子：手持JX（如J9），翻牌圈下注12%，转牌圈再次下注12%，这种极小尺寸的连续下注在Solver中出现频率不低。"], "note": ""}, {"id": "DGL#20-s6", "ep": "20", "type": "topic", "topic": "DGL#20 - 翻前3-bet底池中，处于不利位置时如何在转牌圈游戏中间对子", "en": "PFR 3BP OOP How to Play Middle Pair on the Turn", "q": "非A高牌面的下注逻辑与牌例", "clues": ["an overcard", "Solver", "20%", "30%"], "a": ["当牌面不属于A高或成对类型时，中间对子的下注频率降至20%，但依然值得关注。", "这些下注主要来自“高踢脚的第二对子”（second pairs with an overcard），即你的对子带有一张高于牌面的踢脚牌。", "牌例1：手持AJ，翻牌面Q-J-4，转牌圈发出7（空白牌），Solver约30%的频率选择下注。", "牌例2：同一翻牌面Q-J-4，转牌圈发出6，下注频率为25%；发出5或4时约30%；发出3时约30%。", "讲师强调，这些空白转牌上，你确实应该用部分中间对子（带高踢脚）进行下注，这是Solver的明确建议。"], "note": ""}, {"id": "DGL#20-s7", "ep": "20", "type": "topic", "topic": "DGL#20 - 翻前3-bet底池中，处于不利位置时如何在转牌圈游戏中间对子", "en": "PFR 3BP OOP How to Play Middle Pair on the Turn", "q": "第二对子下注的牌型选择", "clues": ["Solver", "overcard", "outs"], "a": ["牌例：翻牌面Q-9-5，转牌圈发出空白牌，Solver不仅用A9和K9下注，还会用J9、T9、98等第二对子配合小尺寸下注。", "牌例：手持AQ，翻牌面K-Q-3，转牌空白，Solver选择下注。", "牌例：手持口袋T（TT），翻牌面J-9-4，转牌空白，Solver选择下注。", "牌例：手持AJ，翻牌面Q-J-6，转牌空白，Solver选择下注。", "牌例：手持AT，翻牌面Q-T-2，转牌空白，Solver选择下注。", "牌例：手持QT，翻牌面K-T-4，转牌空白，Solver选择下注。", "牌例：手持AT，翻牌面Q-5-T，转牌空白，Solver选择下注。", "选择逻辑：这些第二对子通常带有A或K作为踢脚牌，能够压制对手的跟注范围（很多被跟注的第二对子会被你的踢脚压制），同时你的高张（overcard）仍然保留着改进的出路（outs）。"], "note": ""}, {"id": "DGL#20-s8", "ep": "20", "type": "topic", "topic": "DGL#20 - 翻前3-bet底池中，处于不利位置时如何在转牌圈游戏中间对子", "en": "PFR 3BP OOP How to Play Middle Pair on the Turn", "q": "频率总结与策略执行", "clues": ["merged", "Solver", "20%"], "a": ["A高翻牌、转牌出A或成对转牌：使用约30-70的过牌/下注比例，主要采用小尺寸下注（翻牌圈极小注后转牌圈继续小注）。", "其他牌面类型：中间对子的下注频率约为20%，主要选择高踢脚的第二对子进行下注。", "即使牌面结构不要求你采用深度极化或融合（merged）策略，你仍然应该通过包含中间对子来保持下注范围的平衡。", "讲师最后强调：这些频率数据是Solver给出的平均值，实际游戏中需要根据对手倾向进行适当调整。"], "note": ""}, {"id": "DGL#20-c1", "ep": "20", "type": "cloze", "topic": "DGL#20 - 翻前3-bet底池中，处于不利位置时如何在转牌圈游戏中间对子", "en": "PFR 3BP OOP How to Play Middle Pair on the Turn", "q": "Solver建议在转牌圈对中间对子采取混合策略：＿＿的时候过牌，", "clues": [], "a": ["从全局范围来看，Solver建议在转牌圈对中间对子采取混合策略：75%的时候过牌，25%的时候下注。"], "note": "75%"}, {"id": "DGL#20-c3", "ep": "20", "type": "cloze", "topic": "DGL#20 - 翻前3-bet底池中，处于不利位置时如何在转牌圈游戏中间对子", "en": "PFR 3BP OOP How to Play Middle Pair on the Turn", "q": "中间对子的下注频率为＿＿，整体呈现约30-70的过牌/下注比例。", "clues": [], "a": ["具体数据：当筛选A高翻牌、A高转牌或成对转牌时，中间对子的下注频率为29%，整体呈现约30-70的过牌/下注比例。"], "note": "29%"}, {"id": "DGL#20-c4", "ep": "20", "type": "cloze", "topic": "DGL#20 - 翻前3-bet底池中，处于不利位置时如何在转牌圈游戏中间对子", "en": "PFR 3BP OOP How to Play Middle Pair on the Turn", "q": "典型的下注模式是：翻牌圈下注＿＿底池（极小注），转牌圈继续下注25%底池（小注）。", "clues": [], "a": ["在A高牌面上，典型的下注模式是：翻牌圈下注12%底池（极小注），转牌圈继续下注25%底池（小注）。"], "note": "12%"}, {"id": "DGL#20-note", "ep": "20", "type": "note", "topic": "DGL#20 - 翻前3-bet底池中，处于不利位置时如何在转牌圈游戏中间对子", "en": "PFR 3BP OOP How to Play Middle Pair on the Turn", "q": "避坑提醒与行动项", "clues": ["DGL", "bet", "low pockets"], "a": ["本视频是DGL（Deep Game Learning）系列第20期，承接了之前关于“普通玩家在河牌圈过度弃牌”的讨论，将理论发现转化为具体的转牌圈策略调整。视频的核心价值在于给出了明确的频率数据和牌型选择标准，帮助玩家在3-bet底池的转牌圈做出更平衡的决策。", "值得进一步学习的方向包括：低对子（low pockets）在相同场景下的玩法、河牌圈的具体过牌-跟注范围构建，以及如何根据对手的弃牌率调整这些基准频率。", "**行动项与常见错误：**", "- 不要将所有中间对子在转牌圈一律过牌，应保留约20-30%的下注频率。", "- 在A高牌面、转牌出A或成对牌面上，主动提高中间对子的下注频率至约30%。", "- 在其他牌面上，优先选择带A或K踢脚的第二对子进行下注，避免用低踢脚的中间对子下注。", "- 下注时采用小尺寸策略：翻牌圈12%底池或1/4底池，转牌圈继续25%底池或更小。"], "note": ""}, {"id": "DGL#21-intro", "ep": "21", "type": "intro", "topic": "DGL#21 - 4-bet底池中按钮位对抗小盲位的翻牌圈下注尺度选择", "en": "PFR 4BP IP Cbet Sizings 07 4BET POTS", "q": "DGL#21 - 4-bet底池中按钮位对抗小盲位的翻牌圈下注尺度选择", "clues": ["bet", "BTN", "10%"], "a": ["本视频聚焦于4-bet底池中按钮位（BTN）对抗小盲位（SB）的翻牌圈下注尺度选择。讲师通过算法模拟，分析了三种主要下注尺度（10%底池、1/4底池、约1/2底池）在不同牌面结构下的EV表现，并提炼出可供实战使用的简化启发式规则。视频强调，这类场景研究人数较少，掌握其中规律能为玩家创造显著优势。", "模拟结果显示，整体持续下注频率高达77%，其中绝大多数牌面应使用1/4底池尺度。讲师指出，90%的情况下玩家可以直接采用1/4底池下注，这本身就是一个非常有效的简化策略。同时，视频详细分析了需要使用10%小尺度下注的特殊牌面类别（同花牌面、高对牌面、A高牌面），以及少数适合半池下注的牌面结构。"], "note": ""}, {"id": "DGL#21-s0", "ep": "21", "type": "topic", "topic": "DGL#21 - 4-bet底池中按钮位对抗小盲位的翻牌圈下注尺度选择", "en": "PFR 4BP IP Cbet Sizings 07 4BET POTS", "q": "模拟设置与三种尺度", "clues": ["bet", "BTN", "10%", "48%"], "a": ["本视频研究4-bet底池中按钮位（BTN）对抗小盲位（SB）的翻牌圈下注尺度选择，使用算法优化翻牌圈和转牌圈节点，寻找单一尺度下EV最高的策略。", "模拟中测试了三种下注尺度：10%底池（近年来常规玩家越来越常用）、1/4底池（4-bet底池的经典尺度）、以及约48%底池（接近半池，是两条街的几何尺度，通过该尺度可在转牌圈以相同比例全下）。", "算法会遍历所有尺度，仅用单一尺度求解，然后选出生成最高EV策略的那个尺度。模拟覆盖了127种牌面子集。"], "note": ""}, {"id": "DGL#21-s1", "ep": "21", "type": "topic", "topic": "DGL#21 - 4-bet底池中按钮位对抗小盲位的翻牌圈下注尺度选择", "en": "PFR 4BP IP Cbet Sizings 07 4BET POTS", "q": "整体下注频率与主流尺度", "clues": ["range bet", "J53", "J94", "J99"], "a": ["整体持续下注（c-bet）频率为77%，属于相当高的频率，这源于我们范围构成的天然优势。", "绝大多数牌面下，1/4底池尺度是生成最高EV策略的选择，且大量牌面直接采用全范围下注（range bet）。", "低连接对子牌面（如843、852、866、93、977、98等）全部采用全范围下注；J53、J94、J99彩虹面、JT6、K52、K53、K64、K72、K74、K86等牌面也基本或完全全范围下注。"], "note": ""}, {"id": "DGL#21-s2", "ep": "21", "type": "topic", "topic": "DGL#21 - 4-bet底池中按钮位对抗小盲位的翻牌圈下注尺度选择", "en": "PFR 4BP IP Cbet Sizings 07 4BET POTS", "q": "皇后高牌面的检查频率", "clues": ["AQs", "AQo", "bet", "QJs"], "a": ["皇后高牌面虽然看起来干燥，但对手范围中可以包含AQs和AQo，而我们几乎没有任何AQ组合——我们不会用AQ进行4-bet，也不会用太多AQo进行4-bet。", "对手可以有AQs、QQ、QJs、QTs，而我们没有这些牌，因此在Q44、Q52、Q54、Q62、Q66、Q73、Q74、Q95等皇后高牌面上，应发展约40%的过牌频率。", "核心原因：对手范围中存在AQs和KQs，而我们范围中缺乏这些组合，导致我们在这些牌面上的范围优势被削弱。"], "note": ""}, {"id": "DGL#21-s3", "ep": "21", "type": "topic", "topic": "DGL#21 - 4-bet底池中按钮位对抗小盲位的翻牌圈下注尺度选择", "en": "PFR 4BP IP Cbet Sizings 07 4BET POTS", "q": "1/4底池尺度的简化建议", "clues": ["bet", "90%", "10%"], "a": ["在73种牌面中，90%（约9/10）的4-bet底池牌面都应使用1/4底池尺度。", "如果希望极致简化，可以在所有牌面统一使用1/4底池尺度，这本身就是一种非常合理的简化策略。", "例外情况仅出现在少数特定牌面类别中，需要切换到10%尺度或半池尺度。"], "note": ""}, {"id": "DGL#21-s4", "ep": "21", "type": "topic", "topic": "DGL#21 - 4-bet底池中按钮位对抗小盲位的翻牌圈下注尺度选择", "en": "PFR 4BP IP Cbet Sizings 07 4BET POTS", "q": "10%尺度的适用牌面（一）：同花牌面", "clues": ["Q43", "K97", "10%"], "a": ["10%尺度是第二常用的选择，使用频率约10%。", "第一类适用牌面是同花牌面（monotone textures），例如Q43同花、K97同花、542同花等，10%尺度在这些牌面上是最高EV的选择。"], "note": ""}, {"id": "DGL#21-s5", "ep": "21", "type": "topic", "topic": "DGL#21 - 4-bet底池中按钮位对抗小盲位的翻牌圈下注尺度选择", "en": "PFR 4BP IP Cbet Sizings 07 4BET POTS", "q": "10%尺度的适用牌面（二）：高对牌面", "clues": ["high card paired", "boards", "KQQ", "AKK"], "a": ["第二类适用牌面是高牌配对牌面（high card paired boards），即配对牌为A、K或Q的牌面。", "例如KQQ牌面全范围下注10%；AKK、AA T、AA3等A对牌面也非常适合10%尺度；K82同花和T三张高牌（triple broadway）也属于此类。"], "note": ""}, {"id": "DGL#21-s6", "ep": "21", "type": "topic", "topic": "DGL#21 - 4-bet底池中按钮位对抗小盲位的翻牌圈下注尺度选择", "en": "PFR 4BP IP Cbet Sizings 07 4BET POTS", "q": "10%尺度的适用牌面（三）：A高牌面", "clues": ["boards", "A64", "A65", "A72"], "a": ["第三类也是最显著的一类：A高未配对牌面（ace high unpaired boards），例如A64、A65、A72、A76、A83、A87、A92、A95、A97等，使用10%尺度配合中等下注频率。", "这类牌面上我们范围极强（61%对38%的权益优势），如果全范围小尺度下注，对手会弃掉60%的范围且没有跟注范围；唯一让对手范围中某些牌对继续与否无差别的方法，就是过牌一些强牌。", "求解器在这些牌面上几乎纯过牌AK，AJ、AT也大量过牌，即使范围极强也必须发展检查频率，这是为了给对手创造跟注的激励。"], "note": ""}, {"id": "DGL#21-s7", "ep": "21", "type": "topic", "topic": "DGL#21 - 4-bet底池中按钮位对抗小盲位的翻牌圈下注尺度选择", "en": "PFR 4BP IP Cbet Sizings 07 4BET POTS", "q": "半池尺度的适用牌面", "clues": ["AKJ", "QJA", "all-in sizing", "48%"], "a": ["少数牌面使用约半池（48%）尺度：低连接牌面986、1096、1098，以及AKJ同花（讲师表示这个结果很有趣但未深入解释）。", "这些低连接牌面上对手有大量顺子听牌和带听牌的高张，我们希望用两条街把筹码打光。", "127种牌面中仅有一种牌面（QJA）使用全下尺度（all-in sizing）能最大化EV，且该牌面上我们几乎全范围下注。"], "note": ""}, {"id": "DGL#21-s8", "ep": "21", "type": "topic", "topic": "DGL#21 - 4-bet底池中按钮位对抗小盲位的翻牌圈下注尺度选择", "en": "PFR 4BP IP Cbet Sizings 07 4BET POTS", "q": "实战简化策略总结", "clues": ["10%"], "a": ["推荐使用两种尺度的策略：1/4底池或10%底池。", "10%底池用于：同花牌面、高牌配对牌面（A/K/Q配对）、A低低牌面（A带9到2的任意两张低牌）。", "其余所有牌面一律使用1/4底池尺度。"], "note": ""}, {"id": "DGL#21-c0", "ep": "21", "type": "cloze", "topic": "DGL#21 - 4-bet底池中按钮位对抗小盲位的翻牌圈下注尺度选择", "en": "PFR 4BP IP Cbet Sizings 07 4BET POTS", "q": "模拟中测试了三种下注尺度：＿＿底池（近年来常规玩家越来越常用）、1/4底池（4-bet底池的经典尺度）、以及约48%底池（接近半池，", "clues": [], "a": ["模拟中测试了三种下注尺度：10%底池（近年来常规玩家越来越常用）、1/4底池（4-bet底池的经典尺度）、以及约48%底池（接近半池，是两条街的几何尺度，通过该尺度可在转牌圈以相同比例全下）。"], "note": "10%"}, {"id": "DGL#21-c1", "ep": "21", "type": "cloze", "topic": "DGL#21 - 4-bet底池中按钮位对抗小盲位的翻牌圈下注尺度选择", "en": "PFR 4BP IP Cbet Sizings 07 4BET POTS", "q": "整体持续下注（c-bet）频率为＿＿，属于相当高的频率，", "clues": [], "a": ["整体持续下注（c-bet）频率为77%，属于相当高的频率，这源于我们范围构成的天然优势。"], "note": "77%"}, {"id": "DGL#21-c2", "ep": "21", "type": "cloze", "topic": "DGL#21 - 4-bet底池中按钮位对抗小盲位的翻牌圈下注尺度选择", "en": "PFR 4BP IP Cbet Sizings 07 4BET POTS", "q": "因此在Q44、Q52、Q54、Q62、Q66、Q73、Q74、Q95等皇后高牌面上，应发展约＿＿的过牌频率。", "clues": [], "a": ["对手可以有AQs、QQ、QJs、QTs，而我们没有这些牌，因此在Q44、Q52、Q54、Q62、Q66、Q73、Q74、Q95等皇后高牌面上，应发展约40%的过牌频率。"], "note": "40%"}, {"id": "DGL#21-note", "ep": "21", "type": "note", "topic": "DGL#21 - 4-bet底池中按钮位对抗小盲位的翻牌圈下注尺度选择", "en": "PFR 4BP IP Cbet Sizings 07 4BET POTS", "q": "避坑提醒与行动项", "clues": ["DGL", "bet", "10%"], "a": ["本视频属于DGL系列第21期，是4-bet底池专题的预告内容，完整模块将收录于详细蓝图课程中。讲师强调，4-bet底池按钮位对抗小盲位是研究人数较少的场景，掌握这些启发式规则能帮助玩家建立显著优势。后续可进一步学习转牌圈和河牌圈的下注策略，以及如何根据对手倾向调整这些基准频率。", "**行动项与常见错误提醒：**", "- 不要在所有牌面都使用同一尺度，至少区分1/4底池和10%底池两类场景。", "- 不要在皇后高牌面上盲目全范围下注，应保留约40%的过牌频率。", "- 不要在A高牌面上全范围小尺度下注，否则对手会过度弃牌，应通过过牌强牌来维持对手的跟注范围。", "- 同花牌面、高对牌面、A低低牌面优先考虑10%底池尺度，而非1/4底池。"], "note": ""}, {"id": "DGL#22-intro", "ep": "22", "type": "intro", "topic": "DGL#22 - 4Bet底池中位置劣势下如何用中等口袋对子对抗低牌面持续下注", "en": "PFC 4BP OOP How to Play Middle Pockets vs Cbet on Low Boards", "q": "DGL#22 - 4Bet底池中位置劣势下如何用中等口袋对子对抗低牌面持续下注", "clues": ["bet pot", "OOP", "GTO"], "a": ["本视频聚焦于4Bet底池（4-bet pot）中，玩家处于不利位置（OOP）时，如何用中等口袋对子（5到9的对子）对抗对手在低牌面上的持续下注（c-bet）。讲师通过GTO模拟器数据与Hand2Note软件筛选真实牌局，总结出基于牌力类型（中对、超对、低对）的频率化行动启发式策略，帮助玩家在 uncomfortable 的场景中做出正确决策。", "视频核心发现是：在低牌面（如T63彩虹面）上，面对按钮位4Bet者1/4底池的持续下注，小盲位玩家应高频使用过牌加注（check-raise），尤其是持有中对时加注频率高达60%，超对时达80%，而低对则大幅降至20%左右。讲师还补充了牌面结构（彩虹面 vs 双色面）对加注尺度选择的影响，以及阻挡牌（blocker）在决定全下与否时的关键作用。"], "note": ""}, {"id": "DGL#22-s0", "ep": "22", "type": "topic", "topic": "DGL#22 - 4Bet底池中位置劣势下如何用中等口袋对子对抗低牌面持续下注", "en": "PFC 4BP OOP How to Play Middle Pockets vs Cbet on Low Boards", "q": "视频背景与数据来源", "clues": ["GTO", "sims", "cashmade simple", "Bet"], "a": ["视频灵感来源于讲师用自研算法运行的GTO模拟器（sims），这些模拟器将在cashmade simple商店中供玩家购买。", "研究场景设定：4Bet底池中，小盲位（SB）对抗按钮位（BTN）4Bet者，翻牌后对手用1/4底池尺度持续下注（c-bet），这是大多数常规玩家（regulars）的常见打法。", "分析方法：结合GTO手牌历史与Hand2Note软件，筛选出4Bet底池、按钮位加注、小盲位3Bet、按钮位4Bet、小盲位跟注、翻牌对手1/4底池c-bet的场景，并过滤出中等口袋对子（5到9）与低牌面。"], "note": ""}, {"id": "DGL#22-s1", "ep": "22", "type": "topic", "topic": "DGL#22 - 4Bet底池中位置劣势下如何用中等口袋对子对抗低牌面持续下注", "en": "PFC 4BP OOP How to Play Middle Pockets vs Cbet on Low Boards", "q": "低牌面上口袋对子的牌力分布", "clues": ["middle pair", "T75", "T63", "T22"], "a": ["在低牌面上，中等口袋对子（5-9）约50%的情况下会形成中对（middle pair），例如：T高牌面上的口袋9、T75牌面上的口袋8、T63牌面上的口袋7、884牌面上的口袋6、955牌面上的口袋6、T22牌面上的口袋7。", "约30%的情况下会形成超对（over pair），例如：7高牌面上的口袋9、5高牌面上的口袋9等。", "剩余约20%的情况下会形成低对（low pocket，即第三对或更差），例如：662牌面上的口袋5、743牌面上的口袋5、884牌面上的口袋5。"], "note": ""}, {"id": "DGL#22-s2", "ep": "22", "type": "topic", "topic": "DGL#22 - 4Bet底池中位置劣势下如何用中等口袋对子对抗低牌面持续下注", "en": "PFC 4BP OOP How to Play Middle Pockets vs Cbet on Low Boards", "q": "中对（Middle Pair）的过牌加注频率", "clues": ["T63", "bet", "Indiri", "60%"], "a": ["持有中对（第二对）时，在低牌面上平均过牌加注频率为60%，这是一个非常显著的频率。", "具体牌例：T63彩虹面，小盲位持口袋8（无黑桃），面对按钮位1/4底池c-bet，过牌加注频率高达80%，且加注尺度较小——对手下注13盲注，你应过牌加注到36盲注。", "讲师强调，这类打法（高频过牌加注）会让玩家感到非常不舒服，但这是必须做出的调整（Indiri），多年教学与实战经验都验证了这一点。"], "note": ""}, {"id": "DGL#22-s3", "ep": "22", "type": "topic", "topic": "DGL#22 - 4Bet底池中位置劣势下如何用中等口袋对子对抗低牌面持续下注", "en": "PFC 4BP OOP How to Play Middle Pockets vs Cbet on Low Boards", "q": "超对与低对的频率对比", "clues": ["80%", "20%", "60%", "40%"], "a": ["持有超对时，过牌加注频率升至80-20分（80%加注、20%跟注），在低牌面上直接采用80/20策略。", "持有低对（第三对或更差）时，频率显著下降至12-80分，可简化为20%加注、80%跟注。", "总结：超对为80%加注/20%跟注，中对为60%加注/40%跟注，低对为20%加注/80%跟注。"], "note": ""}, {"id": "DGL#22-s4", "ep": "22", "type": "topic", "topic": "DGL#22 - 4Bet底池中位置劣势下如何用中等口袋对子对抗低牌面持续下注", "en": "PFC 4BP OOP How to Play Middle Pockets vs Cbet on Low Boards", "q": "牌面结构对加注尺度的影响", "clues": ["two-tone boards", "all-in", "rainbow boards", "T63"], "a": ["在双色牌面（two-tone boards）上，主要使用全下（all-in）尺度，不做小尺度过牌加注。", "在彩虹牌面（rainbow boards）上，如T63，最优策略是使用小尺度过牌加注，而非全下。", "双色牌面上，全下时主要选择带有坚果同花听牌阻挡牌（nut flush draw blocker）的口袋对子，例如：T42牌面上，用带黑桃的口袋8、口袋9、口袋7等全下；942牌面上，用带黑桃的口袋8、口袋7、口袋6全下。"], "note": ""}, {"id": "DGL#22-s5", "ep": "22", "type": "topic", "topic": "DGL#22 - 4Bet底池中位置劣势下如何用中等口袋对子对抗低牌面持续下注", "en": "PFC 4BP OOP How to Play Middle Pockets vs Cbet on Low Boards", "q": "实战应用启发式", "clues": ["heuristic"], "a": ["玩家可以基于上述手牌类别频率启发式（hand class frequency heuristic）制定整体游戏计划，再根据牌面结构调整：双色牌面多用全下，彩虹牌面多用小尺度过牌加注。", "具体执行时，优先选择带同花听牌阻挡牌的口袋对子进行全下，以增加弃牌率并保护权益。"], "note": ""}, {"id": "DGL#22-c1", "ep": "22", "type": "cloze", "topic": "DGL#22 - 4Bet底池中位置劣势下如何用中等口袋对子对抗低牌面持续下注", "en": "PFC 4BP OOP How to Play Middle Pockets vs Cbet on Low Boards", "q": "中等口袋对子（5-9）约＿＿的情况下会形成中对（middle pair），", "clues": [], "a": ["在低牌面上，中等口袋对子（5-9）约50%的情况下会形成中对（middle pair），例如：T高牌面上的口袋9、T75牌面上的口袋8、T63牌面上的口袋7、884牌面上的口袋6、955牌面上的口袋6、T22牌面上的口袋7。"], "note": "50%"}, {"id": "DGL#22-c2", "ep": "22", "type": "cloze", "topic": "DGL#22 - 4Bet底池中位置劣势下如何用中等口袋对子对抗低牌面持续下注", "en": "PFC 4BP OOP How to Play Middle Pockets vs Cbet on Low Boards", "q": "在低牌面上平均过牌加注频率为＿＿，这是一个非常显著的频率。", "clues": [], "a": ["持有中对（第二对）时，在低牌面上平均过牌加注频率为60%，这是一个非常显著的频率。"], "note": "60%"}, {"id": "DGL#22-c3", "ep": "22", "type": "cloze", "topic": "DGL#22 - 4Bet底池中位置劣势下如何用中等口袋对子对抗低牌面持续下注", "en": "PFC 4BP OOP How to Play Middle Pockets vs Cbet on Low Boards", "q": "过牌加注频率升至80-20分（＿＿加注、20%跟注），", "clues": [], "a": ["持有超对时，过牌加注频率升至80-20分（80%加注、20%跟注），在低牌面上直接采用80/20策略。"], "note": "80%"}, {"id": "DGL#22-note", "ep": "22", "type": "note", "topic": "DGL#22 - 4Bet底池中位置劣势下如何用中等口袋对子对抗低牌面持续下注", "en": "PFC 4BP OOP How to Play Middle Pockets vs Cbet on Low Boards", "q": "避坑提醒与行动项", "clues": ["DGL", "GTO", "Bet"], "a": ["本视频是DGL系列第22期，延续了讲师一贯的“GTO模拟器+实战数据”结合教学法，重点解决4Bet底池中OOP位置的棘手局面。视频中提到的Hand2Note筛选功能与模拟器数据可在cashmade simple商店获取，适合希望深入挖掘频率化策略的进阶玩家。下一步可学习如何在不同翻牌面结构（如高牌面、连接性强的牌面）中调整这些频率，以及如何利用阻挡牌优化全下范围。", "**行动项与常见错误：**", "- 应该做：在低牌面4Bet底池中，面对1/4底池c-bet，持有中对时积极过牌加注（60%频率），不要害怕不适感。", "- 应该做：在彩虹牌面上使用小尺度过牌加注（如13盲注加注到36盲注），在双色牌面上优先全下。", "- 应该做：全下时选择带坚果同花听牌阻挡牌的口袋对子（如带黑桃的口袋8/9/7）。", "- 不要做：持有低对（第三对或更差）时过度加注，应保持20%加注/80%跟注的低频率。", "- 不要做：在双色牌面上使用小尺度过牌加注，应直接全下。"], "note": ""}, {"id": "DGL#23-intro", "ep": "23", "type": "intro", "topic": "DGL#23 - 翻前3-bet底池中，处于不利位置时如何在低牌面翻牌圈游戏口袋对子AA", "en": "PFR 3BP OOP Playing Aces on the Flop on Low Boards", "q": "DGL#23 - 翻前3-bet底池中，处于不利位置时如何在低牌面翻牌圈游戏口袋对子AA", "clues": ["bet"], "a": ["本视频聚焦于一个具体场景：在小盲位对阵按钮位的3-bet底池中，手持口袋对子AA，且翻牌圈牌面为低牌面（如两色或彩虹面）时的策略执行。讲师通过手牌类别与牌面纹理的频率启发式方法，给出了明确的行动频率分配方案，并强调无需过度精确，60-40的拆分即可覆盖多数情况。", "视频进一步深入探讨了AA在低两色牌面与低彩虹牌面上的频率差异，以及手持A♠阻挡牌（blocker）对下注与过牌加注频率的显著影响。讲师指出，拥有坚果同花听牌阻挡牌时，下注频率应增加，但过牌加注频率反而应降低，这一反直觉的结论是视频的核心教学点之一。", "最后，视频还讲解了面对翻牌圈对手下注（flop stab）时的应对策略，即过牌加注与跟注的频率分配，并对比了AA与其他高对（KK-TT）在慢打与快打倾向上的本质区别，为玩家在后续街的平衡策略提供了重要参考。"], "note": ""}, {"id": "DGL#23-s0", "ep": "23", "type": "topic", "topic": "DGL#23 - 翻前3-bet底池中，处于不利位置时如何在低牌面翻牌圈游戏口袋对子AA", "en": "PFR 3BP OOP Playing Aces on the Flop on Low Boards", "q": "翻牌圈AA的基础频率分配", "clues": ["SB vs BTN", "bet", "low two-tone", "low rainbow"], "a": ["在SB vs BTN的3-bet底池中，手持AA且翻牌为低两色或低彩虹牌面时，整体策略为60-40拆分：60%的频率下注，40%的频率过牌。", "低两色牌面（low two-tone）上，下注频率略降至55%；低彩虹牌面（low rainbow）上，下注频率升至71-29拆分。", "若追求极致精确，低彩虹面可采用70-30拆分，低两色面可采用60-40或50-50拆分，但讲师个人认为60-40的拆分已足够应对所有低牌面纹理，无需过度细分。"], "note": ""}, {"id": "DGL#23-s1", "ep": "23", "type": "topic", "topic": "DGL#23 - 翻前3-bet底池中，处于不利位置时如何在低牌面翻牌圈游戏口袋对子AA", "en": "PFR 3BP OOP Playing Aces on the Flop on Low Boards", "q": "阻挡牌对下注频率的影响", "clues": ["80%", "60%", "40%"], "a": ["在低两色牌面（如8-2-2两色）上，若手持A♠（即拥有坚果同花听牌的阻挡牌），下注频率显著提升至约80%；若无A♠，下注频率为60%。", "具体数据：AA带A♠时，下注频率为80-20拆分；AA不带A♠时，下注频率为40-60拆分。", "这一规律在低牌面高对中非常普遍：拥有坚果同花听牌阻挡牌时，下注更多；反之则更少。可将AA分为两个桶：有阻挡牌时进入80%下注桶，无阻挡牌时进入40%下注桶。"], "note": ""}, {"id": "DGL#23-s2", "ep": "23", "type": "topic", "topic": "DGL#23 - 翻前3-bet底池中，处于不利位置时如何在低牌面翻牌圈游戏口袋对子AA", "en": "PFR 3BP OOP Playing Aces on the Flop on Low Boards", "q": "面对翻牌圈下注的应对策略", "clues": ["flop stab", "KK-TT", "60%", "40%"], "a": ["过牌后面对对手下注（flop stab）时，AA的整体策略为60%跟注、40%过牌加注，即慢打频率高于快打频率。", "对比其他高对（KK-TT），这些牌在同样情境下过牌加注频率高达78%，即80-20拆分，明显更倾向于快打。", "讲师强调，AA在低牌面慢打多于快打是策略平衡的关键，玩家需严格遵循40%加注、60%跟注的频率分配。"], "note": ""}, {"id": "DGL#23-s3", "ep": "23", "type": "topic", "topic": "DGL#23 - 翻前3-bet底池中，处于不利位置时如何在低牌面翻牌圈游戏口袋对子AA", "en": "PFR 3BP OOP Playing Aces on the Flop on Low Boards", "q": "阻挡牌对过牌加注频率的影响", "clues": ["40%", "60%"], "a": ["在低两色牌面（如10-4-2）上，若手持A♠（阻挡牌），过牌加注频率为40%；若无A♠，过牌加注频率升至60%。", "在10-5-2两色牌面，同样规律成立：有A♠时过牌加注频率为40%，无A♠时为60%。", "核心结论：拥有坚果同花听牌阻挡牌时，下注频率增加，但过牌加注频率反而减少。这一反直觉规律需特别注意，避免混淆。"], "note": ""}, {"id": "DGL#23-s4", "ep": "23", "type": "topic", "topic": "DGL#23 - 翻前3-bet底池中，处于不利位置时如何在低牌面翻牌圈游戏口袋对子AA", "en": "PFR 3BP OOP Playing Aces on the Flop on Low Boards", "q": "执行中的常见误区", "clues": ["KK-TT"], "a": ["不要试图在低两色与低彩虹牌面间进行过度精细的频率区分，60-40的拆分已足够，过度优化反而增加执行难度。", "不要忽略阻挡牌对频率的双向影响：有阻挡牌时下注更多，但过牌加注更少；无阻挡牌时下注更少，但过牌加注更多。", "不要将AA与其他高对（KK-TT）的应对策略混为一谈，AA在低牌面更倾向于慢打，而其他高对更倾向于快打。"], "note": ""}, {"id": "DGL#23-c0", "ep": "23", "type": "cloze", "topic": "DGL#23 - 翻前3-bet底池中，处于不利位置时如何在低牌面翻牌圈游戏口袋对子AA", "en": "PFR 3BP OOP Playing Aces on the Flop on Low Boards", "q": "整体策略为60-40拆分：＿＿的频率下注，40%的频率过牌。", "clues": [], "a": ["在SB vs BTN的3-bet底池中，手持AA且翻牌为低两色或低彩虹牌面时，整体策略为60-40拆分：60%的频率下注，40%的频率过牌。"], "note": "60%"}, {"id": "DGL#23-c1", "ep": "23", "type": "cloze", "topic": "DGL#23 - 翻前3-bet底池中，处于不利位置时如何在低牌面翻牌圈游戏口袋对子AA", "en": "PFR 3BP OOP Playing Aces on the Flop on Low Boards", "q": "若手持A♠（即拥有坚果同花听牌的阻挡牌），下注频率显著提升至约＿＿；若无A♠，", "clues": [], "a": ["在低两色牌面（如8-2-2两色）上，若手持A♠（即拥有坚果同花听牌的阻挡牌），下注频率显著提升至约80%；若无A♠，下注频率为60%。"], "note": "80%"}, {"id": "DGL#23-c2", "ep": "23", "type": "cloze", "topic": "DGL#23 - 翻前3-bet底池中，处于不利位置时如何在低牌面翻牌圈游戏口袋对子AA", "en": "PFR 3BP OOP Playing Aces on the Flop on Low Boards", "q": "AA的整体策略为＿＿跟注、40%过牌加注，即慢打频率高于快打频率。", "clues": [], "a": ["过牌后面对对手下注（flop stab）时，AA的整体策略为60%跟注、40%过牌加注，即慢打频率高于快打频率。"], "note": "60%"}, {"id": "DGL#23-note", "ep": "23", "type": "note", "topic": "DGL#23 - 翻前3-bet底池中，处于不利位置时如何在低牌面翻牌圈游戏口袋对子AA", "en": "PFR 3BP OOP Playing Aces on the Flop on Low Boards", "q": "避坑提醒与行动项", "clues": ["DGL", "bet", "OOP"], "a": ["本视频是DGL系列第23期，聚焦于翻前3-bet底池中不利位置（OOP）的AA玩法，属于该系列中针对特定牌面纹理与位置组合的细分策略教学。视频内容建立在频率平衡与阻挡牌效应的基础上，适合已掌握基础翻前3-bet策略的玩家深入学习。", "建议进一步学习的方向包括：其他高对（KK-TT）在相同场景下的完整策略、转牌与河牌圈AA的后续行动规划，以及如何将本视频的频率启发式方法推广至其他翻牌面纹理（如高牌面或连接性强的牌面）。", "**行动项与常见错误清单：**", "- 应做：在低牌面翻牌圈，AA统一采用60-40拆分（下注-过牌），无需区分两色或彩虹面。", "- 应做：持有A♠阻挡牌时，下注频率提升至80%；无阻挡牌时，下注频率降至40%。", "- 应做：过牌后面对下注，AA采用40%过牌加注、60%跟注，慢打为主。", "- 应做：持有阻挡牌时，过牌加注频率降至40%；无阻挡牌时，过牌加注频率升至60%。", "- 不要做：将AA与其他高对（KK-TT）的快打频率混用，AA更倾向于慢打。", "- 不要做：在低两色与低彩虹牌面间过度细分频率，60-40拆分已足够。"], "note": ""}, {"id": "DGL#24-intro", "ep": "24", "type": "intro", "topic": "DGL#24 - 翻前加注者处于不利位置时，在低牌面翻牌圈持续下注后，转牌圈A对的双重下注策略", "en": "PFR 3BP OOP Double Barreling Aces on Low Boards", "q": "DGL#24 - 翻前加注者处于不利位置时，在低牌面翻牌圈持续下注后，转牌圈A对的双重下注策略", "clues": ["double barrel"], "a": ["本视频是“绿线”系列课程的延续，上一讲聚焦于低牌面翻牌圈A对的打法，给出了翻牌圈的手牌类别频率启发式。本讲则深入转牌圈，重点讨论当翻牌圈下注被跟注后，A对在转牌圈面对不同转牌牌面时的双重下注（double barrel）频率策略。", "视频核心观点是：A对在低牌面转牌圈的整体下注频率接近50-50，但根据转牌牌面类别（高牌、空白牌、对子牌、低牌、中间牌）的不同，下注频率会发生显著变化。讲师提供了具体的频率启发式，帮助玩家快速决策。", "视频通过具体数据展示了不同转牌类别下的下注/过牌频率分配，并特别强调了顶对子与底对子配对时的策略差异，以及如何根据对手范围与转牌牌的关联度调整打法。"], "note": ""}, {"id": "DGL#24-s0", "ep": "24", "type": "topic", "topic": "DGL#24 - 翻前加注者处于不利位置时，在低牌面翻牌圈持续下注后，转牌圈A对的双重下注策略", "en": "PFR 3BP OOP Double Barreling Aces on Low Boards", "q": "翻牌圈回顾与转牌圈衔接", "clues": ["low two tone", "low rainbow", "one villain call", "flop"], "a": ["上一讲中，低牌面翻牌圈A对采用60-40的下注/过牌频率分配，即60%下注、40%过牌。", "低双色（low two tone）牌面下注频率略低，低彩虹（low rainbow）牌面下注频率略高，但总体可简化为60-40分配。", "本讲场景设定：翻牌圈下注后被对手跟注，进入转牌圈，此时面对单一对手（one villain call flop）。"], "note": ""}, {"id": "DGL#24-s1", "ep": "24", "type": "topic", "topic": "DGL#24 - 翻前加注者处于不利位置时，在低牌面翻牌圈持续下注后，转牌圈A对的双重下注策略", "en": "PFR 3BP OOP Double Barreling Aces on Low Boards", "q": "转牌圈整体频率框架", "clues": [], "a": ["在低牌面所有可能的转牌牌面中，A对的整体下注/过牌频率接近50-50分配。", "但不同转牌类别下频率差异显著：有些牌面应高频下注，有些牌面应显著降低下注频率。", "核心记忆锚点：全局保持50-50分配，但根据具体转牌类别调整。"], "note": ""}, {"id": "DGL#24-s2", "ep": "24", "type": "topic", "topic": "DGL#24 - 翻前加注者处于不利位置时，在低牌面翻牌圈持续下注后，转牌圈A对的双重下注策略", "en": "PFR 3BP OOP Double Barreling Aces on Low Boards", "q": "高牌与超牌转牌：高频下注", "clues": ["over cards", "high cards", "Broadway", "80%"], "a": ["超牌（over cards）和高牌（high cards）在低牌面转牌圈表现相似，因为两者有很大重叠。", "超牌指高于牌面最大牌的转牌，如牌面为862时，9、T、J、Q、K、A都是超牌；高牌特指Broadway牌（J、Q、K、A）。", "当转牌为超牌或高牌时，A对的下注频率为73-27，可简化为80-20分配。", "简化启发式：转牌为高牌或超牌时，约80%频率下注，20%频率过牌，采取激进打法。"], "note": ""}, {"id": "DGL#24-s3", "ep": "24", "type": "topic", "topic": "DGL#24 - 翻前加注者处于不利位置时，在低牌面翻牌圈持续下注后，转牌圈A对的双重下注策略", "en": "PFR 3BP OOP Double Barreling Aces on Low Boards", "q": "绝对空白转牌：高频过牌", "clues": ["absolute blanks", "rainbow boards", "22%", "80%"], "a": ["绝对空白牌（absolute blanks）是A对下注频率最低的转牌类别，仅22%下注，可简化为20-80分配。", "绝对空白牌定义：彩虹牌面（rainbow boards）且转牌为2到7之间的非同花牌。", "在绝对空白转牌上，A对80%频率过牌，采取慢打策略，这是非常直观的启发式。"], "note": ""}, {"id": "DGL#24-s4", "ep": "24", "type": "topic", "topic": "DGL#24 - 翻前加注者处于不利位置时，在低牌面翻牌圈持续下注后，转牌圈A对的双重下注策略", "en": "PFR 3BP OOP Double Barreling Aces on Low Boards", "q": "低牌转牌：中等偏慢频率", "clues": ["low cards", "40%", "60%"], "a": ["低牌（low cards）转牌出现频率较高，定义为2到7之间的任意牌。", "低牌转牌的下注/过牌频率为40-60，即40%下注、60%过牌。", "与绝对空白牌相比，低牌转牌慢打频率略低，但仍以过牌为主。", "低牌转牌可能带来同花或顺子听牌，需根据具体牌面调整。"], "note": ""}, {"id": "DGL#24-s5", "ep": "24", "type": "topic", "topic": "DGL#24 - 翻前加注者处于不利位置时，在低牌面翻牌圈持续下注后，转牌圈A对的双重下注策略", "en": "PFR 3BP OOP Double Barreling Aces on Low Boards", "q": "对子转牌：顶对与底对差异显著", "clues": ["paired boards", "66%", "40%", "60%"], "a": ["对子转牌（paired boards）整体慢打频率为66%，可简化为40-60分配（40%下注、60%过牌）。", "顶牌配对与底牌配对存在显著差异：以862牌面为例，转牌为2（底牌配对）时，A对下注频率为55-45；转牌为8（顶牌配对）时，过牌频率显著升高。", "核心启发式：顶牌配对时更倾向于慢打，底牌配对时慢打倾向较弱。", "全局来看，对子转牌60%的过牌频率中，大部分来自顶牌配对，中间牌配对贡献一部分，底牌配对贡献最少。", "具体而言，2配对时慢打最少，6配对时慢打较多，8配对时慢打最多，这取决于该牌与有利位置玩家范围的关联度。"], "note": ""}, {"id": "DGL#24-s6", "ep": "24", "type": "topic", "topic": "DGL#24 - 翻前加注者处于不利位置时，在低牌面翻牌圈持续下注后，转牌圈A对的双重下注策略", "en": "PFR 3BP OOP Double Barreling Aces on Low Boards", "q": "中间牌转牌：中等频率", "clues": ["middle cards", "60%", "40%"], "a": ["中间牌（middle cards）定义为转牌为7、8、9或10。", "中间牌通常带来顺子听牌或顺子成牌，与对手范围有较强关联。", "中间牌转牌的下注/过牌频率为60-40，即60%下注、40%过牌，处于高牌和空白牌之间。"], "note": ""}, {"id": "DGL#24-s7", "ep": "24", "type": "topic", "topic": "DGL#24 - 翻前加注者处于不利位置时，在低牌面翻牌圈持续下注后，转牌圈A对的双重下注策略", "en": "PFR 3BP OOP Double Barreling Aces on Low Boards", "q": "转牌类别频率总结", "clues": ["80%", "20%", "40%", "60%"], "a": ["高牌/超牌：约80%下注，20%过牌，采取激进打法。", "绝对空白牌：约20%下注，80%过牌，采取慢打策略。", "低牌：约40%下注，60%过牌，中等偏慢。", "对子转牌：约40%下注，60%过牌，但顶牌配对时过牌频率显著升高。", "中间牌：约60%下注，40%过牌，中等偏快。"], "note": ""}, {"id": "DGL#24-c0", "ep": "24", "type": "cloze", "topic": "DGL#24 - 翻前加注者处于不利位置时，在低牌面翻牌圈持续下注后，转牌圈A对的双重下注策略", "en": "PFR 3BP OOP Double Barreling Aces on Low Boards", "q": "低牌面翻牌圈A对采用60-40的下注/过牌频率分配，即＿＿下注、40%过牌。", "clues": [], "a": ["上一讲中，低牌面翻牌圈A对采用60-40的下注/过牌频率分配，即60%下注、40%过牌。"], "note": "60%"}, {"id": "DGL#24-c2", "ep": "24", "type": "cloze", "topic": "DGL#24 - 翻前加注者处于不利位置时，在低牌面翻牌圈持续下注后，转牌圈A对的双重下注策略", "en": "PFR 3BP OOP Double Barreling Aces on Low Boards", "q": "简化启发式：转牌为高牌或超牌时，约＿＿频率下注，20%频率过牌，", "clues": [], "a": ["简化启发式：转牌为高牌或超牌时，约80%频率下注，20%频率过牌，采取激进打法。"], "note": "80%"}, {"id": "DGL#24-c3", "ep": "24", "type": "cloze", "topic": "DGL#24 - 翻前加注者处于不利位置时，在低牌面翻牌圈持续下注后，转牌圈A对的双重下注策略", "en": "PFR 3BP OOP Double Barreling Aces on Low Boards", "q": "绝对空白牌（absolute blanks）是A对下注频率最低的转牌类别，仅＿＿下注，可简化为20-80分配。", "clues": [], "a": ["绝对空白牌（absolute blanks）是A对下注频率最低的转牌类别，仅22%下注，可简化为20-80分配。"], "note": "22%"}, {"id": "DGL#24-note", "ep": "24", "type": "note", "topic": "DGL#24 - 翻前加注者处于不利位置时，在低牌面翻牌圈持续下注后，转牌圈A对的双重下注策略", "en": "PFR 3BP OOP Double Barreling Aces on Low Boards", "q": "避坑提醒与行动项", "clues": ["GTO", "80%"], "a": ["本视频是“绿线”系列的第二讲，承接翻牌圈A对打法，为玩家提供了完整的转牌圈频率框架。讲师强调，这些频率启发式是基于GTO理论的简化版本，适用于大多数低牌面场景。建议玩家在实际游戏中结合对手倾向和具体牌面纹理进行调整。", "值得进一步学习的方向包括：转牌圈被过牌加注后的应对策略、河牌圈A对在不同转牌类别下的打法、以及如何根据对手范围调整这些频率。后续视频可能会深入探讨这些主题。", "**行动项与常见错误：**", "- 转牌为高牌或超牌时，应高频下注（约80%），不要过度慢打。", "- 转牌为绝对空白牌时，应高频过牌（约80%），不要盲目持续下注。", "- 转牌为对子且顶牌配对时，应显著增加过牌频率，不要机械下注。", "- 转牌为底牌配对时，慢打倾向较弱，可保持较高下注频率。", "- 不要对所有转牌类别采用统一频率，应根据牌面类别调整策略。"], "note": ""}, {"id": "DGL#25-intro", "ep": "25", "type": "intro", "topic": "DGL#25 - 3-bet底池中不利位置过牌加注对抗延迟下注：A高牌策略", "en": "PFR 3BP OOP XR vs Delayed Stab - Ace Highs", "q": "DGL#25 - 3-bet底池中不利位置过牌加注对抗延迟下注：A高牌策略", "clues": ["bet", "OOP", "delayed stab"], "a": ["本视频聚焦于一个极少被研究的翻后场景：在3-bet底池中处于不利位置（OOP），翻牌圈过牌后对手随后过牌，转牌圈你再次过牌，面对对手的延迟下注（delayed stab）时，你应该以13%的高频率进行过牌加注（check-raise）。讲师强调，这一频率远超大多数玩家的实际执行水平，因此需要建立清晰的启发式策略来正确构建加注范围。", "视频的核心观点是：在构建过牌加注范围时，价值部分相对容易（主要来自慢打的超对和顶对），但诈唬部分必须大量依赖A高牌（Ace Highs），尤其是AK和AQ组合。讲师通过具体牌例和手牌类别频率数据，展示了如何在不同转牌面（如配对牌面、空白牌面）上以约5%的低频率使用A高牌进行过牌加注，从而实现平衡并避免被剥削。", "内容框架包括：首先分析过牌加注范围的整体构成，然后通过多个牌例展示具体操作，接着详细讲解A高牌在不同转牌面的频率变化，最后总结出“平均5%频率使用A高牌过牌加注”的核心启发式规则，并强调这一策略在对抗过度弃牌对手时的重要性。"], "note": ""}, {"id": "DGL#25-s0", "ep": "25", "type": "topic", "topic": "DGL#25 - 3-bet底池中不利位置过牌加注对抗延迟下注：A高牌策略", "en": "PFR 3BP OOP XR vs Delayed Stab - Ace Highs", "q": "3-bet底池OOP过牌加注场景定义", "clues": ["bet", "OOP", "13%", "4%"], "a": ["场景为：你在3-bet底池中处于不利位置（OOP），翻牌圈过牌，对手随后过牌，转牌圈你再次过牌，此时对手对你下注（延迟下注），你面临是否过牌加注的决策。", "该场景的过牌加注频率应为13%，这是一个非常可观的频率，意味着你必须认真研究并制定策略，而不能凭感觉随意处理。", "大多数玩家在此场景的实际过牌加注频率可能只有4%左右，远低于应有的13%，这构成了明显的策略漏洞。"], "note": ""}, {"id": "DGL#25-s1", "ep": "25", "type": "topic", "topic": "DGL#25 - 3-bet底池中不利位置过牌加注对抗延迟下注：A高牌策略", "en": "PFR 3BP OOP XR vs Delayed Stab - Ace Highs", "q": "过牌加注范围的价值部分构建", "clues": ["Lacybat", "overpairs", "top-pair good", "kicker"], "a": ["价值部分相对容易确定：如果你正确实施了“Lacybat手牌类别频率启发式”，你会记得对于2x+的超对（overpairs），在Lacybat线中应约50%的频率过牌，因此当你面对延迟下注时，范围内已有大量强价值牌。", "价值区域包含大量超对、顺子等强牌，这些牌足以支持过牌加注。", "对于顶对好踢脚（top-pair good kicker），应以40%的频率慢打，使其进入过牌加注范围。", "价值部分的构建不应过于困难，关键在于正确应用手牌类别频率启发式。"], "note": ""}, {"id": "DGL#25-s2", "ep": "25", "type": "topic", "topic": "DGL#25 - 3-bet底池中不利位置过牌加注对抗延迟下注：A高牌策略", "en": "PFR 3BP OOP XR vs Delayed Stab - Ace Highs", "q": "过牌加注范围的诈唬部分与A高牌的重要性", "clues": ["13%", "50%", "30%"], "a": ["诈唬部分包含一些相对直接的牌型：非同花听牌、带高张的开放式顺子听牌、带两张高张的卡顺听牌，这些属于“自然诈唬”，较易实施。", "关键发现：A高牌（无听牌）占过牌加注范围的13%，由于整个范围约50%是诈唬，这意味着约30%的诈唬范围必须来自A高牌，特别是AK和AQ组合。", "因此，正确执行过牌加注策略的首要条件是：必须在范围构建中大量使用A高牌，这是理解该场景的核心要点。"], "note": ""}, {"id": "DGL#25-s3", "ep": "25", "type": "topic", "topic": "DGL#25 - 3-bet底池中不利位置过牌加注对抗延迟下注：A高牌策略", "en": "PFR 3BP OOP XR vs Delayed Stab - Ace Highs", "q": "具体牌例：AK在JJ配对翻牌面的过牌加注", "clues": ["bet"], "a": ["牌例：你在劫位（HJ）用A K进行3-bet，翻牌面为J-J，转牌圈对手延迟下注，你应将A K转化为过牌加注诈唬。", "该牌例展示了即使没有成牌，A高牌也能作为诈唬牌使用，关键在于利用其阻挡牌效应和潜在的摊牌价值。"], "note": ""}, {"id": "DGL#25-s4", "ep": "25", "type": "topic", "topic": "DGL#25 - 3-bet底池中不利位置过牌加注对抗延迟下注：A高牌策略", "en": "PFR 3BP OOP XR vs Delayed Stab - Ace Highs", "q": "具体牌例：AJs在T-T-6翻牌面的过牌加注", "clues": [], "a": ["牌例：你手持A J同花（方片），翻牌面为T-T-6，转牌发出8♠，你应将A J方片转化为诈唬进行过牌加注。", "讲师评价这是“非常激进”的策略，但为了平衡范围，必须执行此类操作。"], "note": ""}, {"id": "DGL#25-s5", "ep": "25", "type": "topic", "topic": "DGL#25 - 3-bet底池中不利位置过牌加注对抗延迟下注：A高牌策略", "en": "PFR 3BP OOP XR vs Delayed Stab - Ace Highs", "q": "具体牌例：不同转牌面的过牌加注", "clues": [], "a": ["牌例1：翻牌面为T-7-5，转牌发出3♥，你应进行过牌加注，若河牌击中你的听牌则效果极佳。", "牌例2：翻牌面为T-6，转牌发出9♦，你应选择更大的加注尺度进行过牌加注。", "这些例子表明，A高牌在多种转牌面都可作为诈唬牌使用，且加注尺度可根据牌面结构调整。"], "note": ""}, {"id": "DGL#25-s6", "ep": "25", "type": "topic", "topic": "DGL#25 - 3-bet底池中不利位置过牌加注对抗延迟下注：A高牌策略", "en": "PFR 3BP OOP XR vs Delayed Stab - Ace Highs", "q": "A高牌在过牌加注范围中的频率数据", "clues": ["bet", "OOP", "40%", "60%"], "a": ["在3-bet底池OOP、翻牌过牌-过牌、转牌面对延迟下注的场景中，A高牌约占你过牌后范围的40%，是最常见的手牌类别。", "总体来看，A高牌在此场景的玩法为：60%弃牌、36%跟注、4.4%加注。", "由于A高牌组合数量众多，你无需对每个单独组合使用高频率，只需以低频率（如4.4%）使用即可实现整体平衡。"], "note": ""}, {"id": "DGL#25-s7", "ep": "25", "type": "topic", "topic": "DGL#25 - 3-bet底池中不利位置过牌加注对抗延迟下注：A高牌策略", "en": "PFR 3BP OOP XR vs Delayed Stab - Ace Highs", "q": "频率启发式：低频率使用高频手牌类别", "clues": [], "a": ["核心原则：如果你范围内某类手牌的组合数很多，应以低频率使用每个单独组合，这样整体就能达到平衡。", "反之，如果某类手牌组合数多却以高频率使用，必然导致范围失衡。", "这一原则可广泛应用于整个游戏树，是通用的频率管理工具。"], "note": ""}, {"id": "DGL#25-s8", "ep": "25", "type": "topic", "topic": "DGL#25 - 3-bet底池中不利位置过牌加注对抗延迟下注：A高牌策略", "en": "PFR 3BP OOP XR vs Delayed Stab - Ace Highs", "q": "不同转牌面对A高牌频率的影响", "clues": ["paired turns", "10%", "6%"], "a": ["整体来看，不同转牌面主要影响弃牌频率，对加注频率影响较小。", "但在配对转牌面（paired turns）上，A高牌的弃牌频率降低、加注频率升高，因为A高牌在配对牌面上权益更高。", "具体数据：配对转牌面上加注频率约10%，其他转牌面约5-6%。"], "note": ""}, {"id": "DGL#25-s9", "ep": "25", "type": "topic", "topic": "DGL#25 - 3-bet底池中不利位置过牌加注对抗延迟下注：A高牌策略", "en": "PFR 3BP OOP XR vs Delayed Stab - Ace Highs", "q": "具体A高牌组合的频率差异", "clues": ["blank runouts", "10%", "6%"], "a": ["A K非同花：几乎从不弃牌，加注频率略高于其他A高牌，配对转牌面上约10%过牌加注。", "A Q和A J非同花：弃牌频率更高，加注频率略低。", "A K到A J同花：加注频率略低，但在空白转牌面（blank runouts）上仍有约6%的过牌加注频率。", "总体而言，A K到A T的各类组合玩法相似，差异不大。"], "note": ""}, {"id": "DGL#25-s10", "ep": "25", "type": "topic", "topic": "DGL#25 - 3-bet底池中不利位置过牌加注对抗延迟下注：A高牌策略", "en": "PFR 3BP OOP XR vs Delayed Stab - Ace Highs", "q": "花色阻挡牌效应", "clues": ["10%", "6%"], "a": ["讲师预期带同花阻挡牌（如红桃）的A高牌会有更高加注频率，但数据显示差异并不显著。", "例如，带红桃的A高牌在配对转牌面加注频率约10%，其他转牌面约5-6%，与不带阻挡牌的差异不大。", "尽管如此，讲师仍建议在实施时略微偏向使用带同花阻挡牌的A高牌组合。"], "note": ""}, {"id": "DGL#25-s11", "ep": "25", "type": "topic", "topic": "DGL#25 - 3-bet底池中不利位置过牌加注对抗延迟下注：A高牌策略", "en": "PFR 3BP OOP XR vs Delayed Stab - Ace Highs", "q": "核心启发式规则与执行建议", "clues": ["5%"], "a": ["最终规则：在此场景中，用你的A高牌组合进行过牌加注，平均频率为5%。", "执行时略微偏向使用带同花阻挡牌的A高牌，而非无阻挡牌的组合。", "这一启发式非常细致且低频，通常不会用于其他场景，但鉴于A高牌在此场景中数量众多且玩家普遍失衡，值得专门记忆和执行。", "通过这一调整，你将在该场景中实现更平衡的过牌加注范围，避免被剥削。"], "note": ""}, {"id": "DGL#25-c0", "ep": "25", "type": "cloze", "topic": "DGL#25 - 3-bet底池中不利位置过牌加注对抗延迟下注：A高牌策略", "en": "PFR 3BP OOP XR vs Delayed Stab - Ace Highs", "q": "该场景的过牌加注频率应为＿＿，这是一个非常可观的频率，", "clues": [], "a": ["该场景的过牌加注频率应为13%，这是一个非常可观的频率，意味着你必须认真研究并制定策略，而不能凭感觉随意处理。"], "note": "13%"}, {"id": "DGL#25-c1", "ep": "25", "type": "cloze", "topic": "DGL#25 - 3-bet底池中不利位置过牌加注对抗延迟下注：A高牌策略", "en": "PFR 3BP OOP XR vs Delayed Stab - Ace Highs", "q": "在Lacybat线中应约＿＿的频率过牌，因此当你面对延迟下注时，", "clues": [], "a": ["价值部分相对容易确定：如果你正确实施了“Lacybat手牌类别频率启发式”，你会记得对于2x+的超对（overpairs），在Lacybat线中应约50%的频率过牌，因此当你面对延迟下注时，范围内已有大量强价值牌。"], "note": "50%"}, {"id": "DGL#25-c2", "ep": "25", "type": "cloze", "topic": "DGL#25 - 3-bet底池中不利位置过牌加注对抗延迟下注：A高牌策略", "en": "PFR 3BP OOP XR vs Delayed Stab - Ace Highs", "q": "关键发现：A高牌（无听牌）占过牌加注范围的＿＿，由于整个范围约50%是诈唬，", "clues": [], "a": ["关键发现：A高牌（无听牌）占过牌加注范围的13%，由于整个范围约50%是诈唬，这意味着约30%的诈唬范围必须来自A高牌，特别是AK和AQ组合。"], "note": "13%"}, {"id": "DGL#25-note", "ep": "25", "type": "note", "topic": "DGL#25 - 3-bet底池中不利位置过牌加注对抗延迟下注：A高牌策略", "en": "PFR 3BP OOP XR vs Delayed Stab - Ace Highs", "q": "避坑提醒与行动项", "clues": ["DGL", "Deep Game Life", "bet"], "a": ["本视频属于DGL系列（Deep Game Life）第25期，聚焦于3-bet底池中OOP位置的过牌加注策略，特别是A高牌的使用。视频建立在之前关于Lacybat手牌类别频率启发式的基础上，建议观众先掌握基础频率概念再学习本内容。讲师提到，未来可能进一步讲解如何在该场景中加入更多听牌组合，以实现更完整的平衡执行。", "**应该这样做：**", "- 在3-bet底池OOP、翻牌过牌-过牌、转牌面对延迟下注时，以约13%的频率进行过牌加注。", "- 将A高牌（特别是AK、AQ）纳入过牌加注诈唬范围，平均使用频率为5%。", "- 在配对转牌面上提高A高牌的加注频率（约10%），在其他转牌面保持5-6%。", "- 略微偏向使用带同花阻挡牌的A高牌组合。", "**不要这样做：**", "- 不要只以4%左右的频率过牌加注，这远低于应有的13%。", "- 不要完全不用A高牌作为诈唬牌，这会导致范围严重失衡。", "- 不要对组合数多的手牌类别使用过高频率，应通过低频率使用实现整体平衡。"], "note": ""}, {"id": "DGL#26-intro", "ep": "26", "type": "intro", "topic": "DGL#26 - 翻前加注者3-bet底池中，不利位置过牌加注对抗延迟持续下注——超对策略", "en": "PFR 3BP OOP XR vs Delayed Stab - Overpairs", "q": "DGL#26 - 翻前加注者3-bet底池中，不利位置过牌加注对抗延迟持续下注——超对策略", "clues": ["Green Lion", "PFR", "bet"], "a": ["本视频是Green Lion系列课程的延续，聚焦于翻前加注者（PFR）在3-bet底池中，处于不利位置（OOP）时，面对对手延迟持续下注（Delayed Stab）如何构建过牌加注（Check-Raise）范围。上一讲已讨论了最反直觉的手牌类别——A高牌，本讲则深入分析超对（Overpairs）这一占据范围最大比例的手牌类别。", "视频核心观点是：超对在过牌加注范围中占比高达26%，且占价值范围的一半以上，因此正确游戏超对至关重要。然而，与多数玩家直觉相反，即使面对低牌面且已连续过牌两次，策略仍要求以较高频率被动游戏（慢打）超对，而非一味加注。具体频率因超对牌力不同而显著分化：A A倾向于慢打，而K K和Q Q则更倾向于激进过牌加注。", "视频通过GTO求解器数据，展示了不同超对在翻牌过牌-过牌、转牌面对对手下注后的最优行动频率拆分，并解释了A A与其他超对行为差异背后的阻挡牌效应与牌面覆盖逻辑，为玩家提供了清晰可执行的频率参考。"], "note": ""}, {"id": "DGL#26-s0", "ep": "26", "type": "topic", "topic": "DGL#26 - 翻前加注者3-bet底池中，不利位置过牌加注对抗延迟持续下注——超对策略", "en": "PFR 3BP OOP XR vs Delayed Stab - Overpairs", "q": "超对在过牌加注范围中的占比", "clues": ["26%", "50%"], "a": ["超对占整个过牌加注范围的26%，是范围中最大的单一手牌类别。", "整个过牌加注范围中约有50%为价值牌，因此超对占价值范围的一半以上（超过50%）。", "这意味着超对是此场景下最重要的手牌类别，正确游戏超对直接决定整体策略的成败。"], "note": ""}, {"id": "DGL#26-s1", "ep": "26", "type": "topic", "topic": "DGL#26 - 翻前加注者3-bet底池中，不利位置过牌加注对抗延迟持续下注——超对策略", "en": "PFR 3BP OOP XR vs Delayed Stab - Overpairs", "q": "超对整体慢打频率", "clues": ["50%"], "a": ["即使翻牌圈过牌后对手随后过牌，转牌圈再次过牌后对手下注，也不应总是对超对进行过牌加注。", "求解器显示，在此场景下超对整体应慢打（过牌跟注）50%的时间，快打（过牌加注）50%的时间。", "平均而言，慢打频率应高于快打频率，即“慢打多于快打”是基本原则。", "这一平衡策略与大多数玩家的实际做法形成鲜明对比——多数人翻牌圈直接下注，很少以过牌-过牌路线进入转牌；一旦对手转牌下注，他们几乎只用极少量的超对加注。"], "note": ""}, {"id": "DGL#26-s2", "ep": "26", "type": "topic", "topic": "DGL#26 - 翻前加注者3-bet底池中，不利位置过牌加注对抗延迟持续下注——超对策略", "en": "PFR 3BP OOP XR vs Delayed Stab - Overpairs", "q": "对手视角的剥削机会", "clues": ["OOP"], "a": ["作为有利位置（IP）玩家，可以确信大多数对手在转牌圈不会用足够多的超对过牌跟注。", "因此，IP玩家可以在这些场合用更宽的价值牌下注，因为对手的过牌跟注范围中缺乏足够的超对来防守。", "这提示OOP玩家：若自己的超对慢打频率不足，将面临被IP玩家剥削的风险。"], "note": ""}, {"id": "DGL#26-s3", "ep": "26", "type": "topic", "topic": "DGL#26 - 翻前加注者3-bet底池中，不利位置过牌加注对抗延迟持续下注——超对策略", "en": "PFR 3BP OOP XR vs Delayed Stab - Overpairs", "q": "A A的独特策略", "clues": ["40%", "60%"], "a": ["A A与其他超对行为差异显著，主要源于两个因素：阻挡牌效应，以及不存在能盖过A A的翻牌高牌。", "A A是极佳的慢打候选牌，原因有三：1. 若对手持有两张高牌（如两高张），且击中顶对，对手会主动价值下注，这增加了A A的期望值（EV）。2. A A阻挡了对手的过牌范围——若对手在河牌持有A高牌，极可能选择过牌，因此A A慢打增加了下一街面对下注的概率。3. 慢打A A有助于平衡“过牌-过牌-过牌跟注-过牌加注”这条行动线，为范围中的诈唬提供价值支撑。", "求解器数据显示：A A在此场景下为40-60拆分——仅40%的频率过牌加注，60%的频率过牌跟注（慢打）。", "若目标是保持平衡，必须确保转牌过牌跟注范围中有足够的价值牌，A A在此行动线中表现极为出色。"], "note": ""}, {"id": "DGL#26-s4", "ep": "26", "type": "topic", "topic": "DGL#26 - 翻前加注者3-bet底池中，不利位置过牌加注对抗延迟持续下注——超对策略", "en": "PFR 3BP OOP XR vs Delayed Stab - Overpairs", "q": "K K与Q Q的策略", "clues": ["71%", "80%", "20%"], "a": ["过滤K K和Q Q后，频率显著变化：过牌加注频率飙升至71%。", "求解器建议K K和Q Q采用与A A相反的拆分：80-20拆分——80%的频率过牌加注，仅20%的频率过牌跟注。", "讲师建议直接取整为80%过牌加注、20%过牌跟注，便于记忆和执行。"], "note": ""}, {"id": "DGL#26-s5", "ep": "26", "type": "topic", "topic": "DGL#26 - 翻前加注者3-bet底池中，不利位置过牌加注对抗延迟持续下注——超对策略", "en": "PFR 3BP OOP XR vs Delayed Stab - Overpairs", "q": "J J与T T的策略", "clues": ["40%", "60%"], "a": ["J J和T T在此行动线中出现频率较低，求解器同样给出40-60拆分——40%过牌加注，60%过牌跟注。", "与A A相同，J J和T T倾向于慢打而非快打。"], "note": ""}, {"id": "DGL#26-s6", "ep": "26", "type": "topic", "topic": "DGL#26 - 翻前加注者3-bet底池中，不利位置过牌加注对抗延迟持续下注——超对策略", "en": "PFR 3BP OOP XR vs Delayed Stab - Overpairs", "q": "频率汇总与执行建议", "clues": ["40%", "60%", "80%", "20%"], "a": ["完整频率表：A A为40-60拆分（40%加注/60%跟注），K K和Q Q为80-20拆分（80%加注/20%跟注），J J和T T为40-60拆分（40%加注/60%跟注）。", "核心原则：A A与J J/T T慢打为主，K K/Q Q快打为主。", "若目标是平衡策略，必须严格按照上述频率执行，避免凭直觉过度加注或过度跟注。"], "note": ""}, {"id": "DGL#26-c0", "ep": "26", "type": "cloze", "topic": "DGL#26 - 翻前加注者3-bet底池中，不利位置过牌加注对抗延迟持续下注——超对策略", "en": "PFR 3BP OOP XR vs Delayed Stab - Overpairs", "q": "超对占整个过牌加注范围的＿＿，是范围中最大的单一手牌类别。", "clues": [], "a": ["超对占整个过牌加注范围的26%，是范围中最大的单一手牌类别。"], "note": "26%"}, {"id": "DGL#26-c1", "ep": "26", "type": "cloze", "topic": "DGL#26 - 翻前加注者3-bet底池中，不利位置过牌加注对抗延迟持续下注——超对策略", "en": "PFR 3BP OOP XR vs Delayed Stab - Overpairs", "q": "在此场景下超对整体应慢打（过牌跟注）＿＿的时间，快打（过牌加注）50%的时间。", "clues": [], "a": ["求解器显示，在此场景下超对整体应慢打（过牌跟注）50%的时间，快打（过牌加注）50%的时间。"], "note": "50%"}, {"id": "DGL#26-c3", "ep": "26", "type": "cloze", "topic": "DGL#26 - 翻前加注者3-bet底池中，不利位置过牌加注对抗延迟持续下注——超对策略", "en": "PFR 3BP OOP XR vs Delayed Stab - Overpairs", "q": "求解器数据显示：A A在此场景下为40-60拆分——仅＿＿的频率过牌加注，", "clues": [], "a": ["求解器数据显示：A A在此场景下为40-60拆分——仅40%的频率过牌加注，60%的频率过牌跟注（慢打）。"], "note": "40%"}, {"id": "DGL#26-note", "ep": "26", "type": "note", "topic": "DGL#26 - 翻前加注者3-bet底池中，不利位置过牌加注对抗延迟持续下注——超对策略", "en": "PFR 3BP OOP XR vs Delayed Stab - Overpairs", "q": "避坑提醒与行动项", "clues": ["Green Lion", "bet", "OOP"], "a": ["本视频是Green Lion系列中关于“翻前加注者3-bet底池OOP过牌加注对抗延迟持续下注”专题的第二部分，上一讲已覆盖A高牌的处理，本讲聚焦超对，后续可能继续讨论其他手牌类别或具体行动线构建。建议结合上一讲内容，形成完整的范围构建框架。", "值得进一步学习的方向包括：IP玩家面对OOP过牌加注后的防守策略、不同牌面结构（如高牌面、连牌面）对超对频率的影响、以及如何根据对手倾向调整这些GTO频率以实现剥削性打法。", "**行动项与常见错误：**", "- 应该这样做：在翻牌过牌-过牌、转牌对手下注后，用K K和Q Q约80%频率过牌加注，仅20%过牌跟注。", "- 应该这样做：用A A、J J和T T约60%频率过牌跟注，仅40%过牌加注。", "- 不要这样做：不要对所有超对一视同仁地加注或跟注——A A与K K/Q Q的频率差异巨大，混为一谈将破坏范围平衡。", "- 不要这样做：不要因为翻牌是低牌面就认为必须快打所有超对——慢打是平衡策略的必要组成部分，尤其对A A而言。"], "note": ""}, {"id": "DGL#27-intro", "ep": "27", "type": "intro", "topic": "DGL#27 - 翻前3-bet底池中，有利位置跟注者如何在高低双色翻牌面用低对子进行试探性下注", "en": "PFC 3BP IP Stabbing Low Pockets on High TT Boards", "q": "DGL#27 - 翻前3-bet底池中，有利位置跟注者如何在高低双色翻牌面用低对子进行试探性下注", "clues": ["bet", "BTN", "stabbing"], "a": ["本视频聚焦于翻前3-bet底池中，作为有利位置（BTN）的跟注者，在翻牌圈面对对手过牌时，如何用低对子（如22-77）进行试探性下注（stabbing）的频率策略。讲师通过GTO模拟数据，给出了一个基于“手牌类别频率启发式”的决策框架，帮助玩家快速判断哪些低对子应该下注、哪些应该过牌。", "视频核心发现是：低对子的下注频率并非一成不变，而是受两个关键因素影响——对子本身的大小（越低的对子越倾向于下注）以及是否持有与翻牌面同花的阻挡牌（blocker）。讲师通过具体牌例和模拟数据，展示了这两个因素如何将全局40-60的下注频率细化为50-50或20-80等不同档位，并给出了可操作的下注频率调整建议。", "视频内容结构清晰：先给出全局频率基准，再分别分析对子大小和阻挡牌的影响，最后总结出完整的决策规则。讲师强调，这些频率并非绝对精确值，而是帮助玩家在实战中快速分类手牌、做出合理决策的启发式工具。"], "note": ""}, {"id": "DGL#27-s0", "ep": "27", "type": "topic", "topic": "DGL#27 - 翻前3-bet底池中，有利位置跟注者如何在高低双色翻牌面用低对子进行试探性下注", "en": "PFC 3BP IP Stabbing Low Pockets on High TT Boards", "q": "全局频率基准", "clues": ["bet", "BTN", "high two-tone", "boards"], "a": ["在翻前3-bet底池中，作为BTN跟注者，面对SB过牌，在高双色翻牌面（high two-tone boards）上，全局下注频率约为38%，可简化为40-60的下注-过牌比例。", "低对子（low pockets）的全局下注频率为32%，接近全范围的40-60比例，因此可将其视为一个统一的“手牌类别”进行策略制定。", "讲师强调，这个40-60的基准是“不考虑任何其他信息”时的起点，后续需要根据对子大小和花色进行细化调整。"], "note": ""}, {"id": "DGL#27-s1", "ep": "27", "type": "topic", "topic": "DGL#27 - 翻前3-bet底池中，有利位置跟注者如何在高低双色翻牌面用低对子进行试探性下注", "en": "PFC 3BP IP Stabbing Low Pockets on High TT Boards", "q": "低对子大小对下注频率的影响", "clues": ["bottom card"], "a": ["将低对子细分为22-44和55-77两组后，频率差异显著：22-44的下注频率升至50-50，而55-77则降至20-80。", "原因在于：22-44通常是对子低于翻牌面最小牌（bottom card），几乎没有摊牌价值，更适合作为诈唬牌下注；而55-77有时能形成高于底牌的对子，有一定摊牌价值，因此下注频率更低。", "具体牌例：在Q-7-4翻牌面，口袋对子66（高于底牌7）下注频率低；而在A-K-3翻牌面，口袋对子22（低于底牌3）下注频率高。", "讲师建议，为简化记忆，可将22-44整体归入40-60的“最近档位”，但实战中应更倾向于对22-44下注、对55-77过牌。"], "note": ""}, {"id": "DGL#27-s2", "ep": "27", "type": "topic", "topic": "DGL#27 - 翻前3-bet底池中，有利位置跟注者如何在高低双色翻牌面用低对子进行试探性下注", "en": "PFC 3BP IP Stabbing Low Pockets on High TT Boards", "q": "阻挡牌对下注频率的影响（22-44）", "clues": ["80%", "100%", "20%", "40%"], "a": ["对于22-44这类低对子，是否持有与翻牌面同花的阻挡牌（即与翻牌面花色相同的牌）会显著改变下注频率：没有阻挡牌时下注更多，有阻挡牌时下注更少。", "牌例1：在K-3-2（两张红桃）翻牌面，口袋对子22没有红桃时下注频率为80%或100%，有红桃时降至20%或40%；口袋对子44同理，无红桃时80%或100%，有红桃时60%。", "牌例2：在Q-7-4（两张黑桃）翻牌面，口袋对子22无黑桃时下注40%或60%，有黑桃时仅20%；口袋对子33无黑桃时60-80%，有黑桃时40-20%。", "操作规则：对于22-44，无阻挡牌时可将下注频率从50-50提升至60%档位，有阻挡牌时降至40%档位，这样最接近基准值。"], "note": ""}, {"id": "DGL#27-s3", "ep": "27", "type": "topic", "topic": "DGL#27 - 翻前3-bet底池中，有利位置跟注者如何在高低双色翻牌面用低对子进行试探性下注", "en": "PFC 3BP IP Stabbing Low Pockets on High TT Boards", "q": "阻挡牌对下注频率的影响（55-77）", "clues": ["40%", "20%", "60%", "80%"], "a": ["对于55-77这类较高的低对子，阻挡牌的影响方向相反：有阻挡牌时下注更多，无阻挡牌时下注更少。", "牌例1：在Q-7-4翻牌面，口袋对子77有黑桃时下注40%，无黑桃时仅20%。", "牌例2：在K-6-4翻牌面，口袋对子88有黑桃时下注60%，无黑桃时40%；口袋对子33无黑桃时80%，有黑桃时40%（注意33属于22-44组，方向与55-77相反）。", "牌例3：在K-6-4翻牌面，口袋对子77的阻挡牌效应不明显，但口袋对子88的效应清晰可见。", "原因解释：对于55-77，有阻挡牌时能阻断对手的坚果同花听牌，自身又有一定摊牌价值，因此更适合下注；而22-44本身价值极低，有阻挡牌时更倾向于过牌看免费牌。"], "note": ""}, {"id": "DGL#27-s4", "ep": "27", "type": "topic", "topic": "DGL#27 - 翻前3-bet底池中，有利位置跟注者如何在高低双色翻牌面用低对子进行试探性下注", "en": "PFC 3BP IP Stabbing Low Pockets on High TT Boards", "q": "完整决策规则总结", "clues": ["GTO", "60%", "40%", "20%"], "a": ["在高双色翻牌面，面对SB过牌，低对子的下注频率遵循以下规则：1. 22-44：下注频率约50-50，高于55-77的20-80。2. 22-44：无阻挡牌时下注更多（提升至60%档），有阻挡牌时下注更少（降至40%档）。3. 55-77：有阻挡牌时下注更多（如40%），无阻挡牌时下注更少（如20%）。", "讲师强调，这些频率是“手牌类别频率启发式”，并非精确GTO解，但能帮助玩家在实战中快速分类并做出合理决策。", "所有结论均基于GTO模拟数据，且已针对“高双色翻牌面”这一特定场景过滤，不可直接套用于其他牌面结构。"], "note": ""}, {"id": "DGL#27-c0", "ep": "27", "type": "cloze", "topic": "DGL#27 - 翻前3-bet底池中，有利位置跟注者如何在高低双色翻牌面用低对子进行试探性下注", "en": "PFC 3BP IP Stabbing Low Pockets on High TT Boards", "q": "全局下注频率约为＿＿，可简化为40-60的下注-过牌比例。", "clues": [], "a": ["在翻前3-bet底池中，作为BTN跟注者，面对SB过牌，在高双色翻牌面（high two-tone boards）上，全局下注频率约为38%，可简化为40-60的下注-过牌比例。"], "note": "38%"}, {"id": "DGL#27-c2", "ep": "27", "type": "cloze", "topic": "DGL#27 - 翻前3-bet底池中，有利位置跟注者如何在高低双色翻牌面用低对子进行试探性下注", "en": "PFC 3BP IP Stabbing Low Pockets on High TT Boards", "q": "口袋对子22没有红桃时下注频率为＿＿或100%，有红桃时降至20%或40%；", "clues": [], "a": ["牌例1：在K-3-2（两张红桃）翻牌面，口袋对子22没有红桃时下注频率为80%或100%，有红桃时降至20%或40%；口袋对子44同理，无红桃时80%或100%，有红桃时60%。"], "note": "80%"}, {"id": "DGL#27-c3", "ep": "27", "type": "cloze", "topic": "DGL#27 - 翻前3-bet底池中，有利位置跟注者如何在高低双色翻牌面用低对子进行试探性下注", "en": "PFC 3BP IP Stabbing Low Pockets on High TT Boards", "q": "牌例1：在Q-7-4翻牌面，口袋对子77有黑桃时下注＿＿，无黑桃时仅20%。", "clues": [], "a": ["牌例1：在Q-7-4翻牌面，口袋对子77有黑桃时下注40%，无黑桃时仅20%。"], "note": "40%"}, {"id": "DGL#27-note", "ep": "27", "type": "note", "topic": "DGL#27 - 翻前3-bet底池中，有利位置跟注者如何在高低双色翻牌面用低对子进行试探性下注", "en": "PFC 3BP IP Stabbing Low Pockets on High TT Boards", "q": "避坑提醒与行动项", "clues": ["DGL", "bet"], "a": ["本视频是DGL系列第27期，聚焦于翻前3-bet底池中有利位置跟注者的翻牌圈策略，属于“手牌类别频率启发式”系列的一部分。视频内容承接了前序关于3-bet底池整体策略的讨论，并深入细化了低对子这一具体手牌类别的处理方式。讲师通过大量模拟数据对比，展示了阻挡牌和对子大小如何共同影响下注频率，为玩家提供了可操作的决策框架。", "值得进一步学习的方向包括：将同样的频率启发式应用于其他手牌类别（如高张、同花连牌）在不同翻牌面的策略；以及如何在实际对局中根据对手倾向（如过牌-加注频率）动态调整这些频率。视频中提到的“高双色翻牌面”是一个特定场景，玩家还需掌握其他牌面结构（如彩虹面、对子面）下的类似策略。", "**行动项与常见错误：**", "- 应该做：在Q-7-4、K-6-4等高双色翻牌面，对22-44优先下注，对55-77更多过牌。", "- 应该做：对于22-44，无阻挡牌时果断下注，有阻挡牌时适当减少下注频率。", "- 应该做：对于55-77，有阻挡牌时可以考虑下注，无阻挡牌时倾向于过牌。", "- 不要做：不要对所有低对子采用统一的下注频率，必须区分22-44和55-77。", "- 不要做：不要忽视阻挡牌的影响，尤其是在22-44这类低对子上，阻挡牌对频率的影响非常显著。", "- 不要做：不要将本视频的频率直接套用于其他翻牌面结构（如彩虹面或对子面），需重新参考对应模拟数据。"], "note": ""}, {"id": "DGL#28-intro", "ep": "28", "type": "intro", "topic": "DGL#28 - 翻前3-bet底池中，有利位置在高张双色翻牌面用低对子进行转牌双重下注", "en": "PFC 3BP IP Double Barreling Low Pockets on High TT Boards", "q": "DGL#28 - 翻前3-bet底池中，有利位置在高张双色翻牌面用低对子进行转牌双重下注", "clues": ["Green Line", "bet"], "a": ["本视频是“绿线（Green Line）”系列教学的延续。上一期视频讲解了在翻牌圈，作为翻前3-bet底池中的有利位置玩家，面对高张双色翻牌面时，应该多频繁地用低对子（如22-77）进行持续下注。本视频则聚焦于后续场景：当你在翻牌圈下注并被对手跟注后，转牌圈应该如何继续行动。", "视频的核心结论是：在翻牌圈下注被跟注后，转牌圈用低对子继续下注的频率总体约为50%，但这一频率会因对子大小和手中是否持有同花阻挡牌而产生显著差异。具体而言，越小的对子越倾向于继续下注，而手中持有同花阻挡牌时，下注频率会大幅降低。", "视频最后给出了一个实用的“桶位调整”启发式规则：没有同花阻挡牌时，下注频率上调一个桶位；持有同花阻挡牌时，下注频率下调两个桶位。这一规则帮助玩家在实战中快速做出决策。"], "note": ""}, {"id": "DGL#28-s0", "ep": "28", "type": "topic", "topic": "DGL#28 - 翻前3-bet底池中，有利位置在高张双色翻牌面用低对子进行转牌双重下注", "en": "PFC 3BP IP Double Barreling Low Pockets on High TT Boards", "q": "全局频率概览", "clues": ["50%"], "a": ["在翻牌圈用低对子（22-77）于高张双色翻牌面下注并被跟注后，转牌圈继续下注的全局频率约为50%，即大约一半的情况下会继续开火。", "该数据基于特定过滤条件：翻牌圈对手过牌、我们下注、对手跟注，转牌圈对手再次过牌，我们获得继续下注的机会。", "这一50-50的分布是后续所有细分调整的基准线，玩家需要在此基础上根据具体牌型和牌面结构进行微调。"], "note": ""}, {"id": "DGL#28-s1", "ep": "28", "type": "topic", "topic": "DGL#28 - 翻前3-bet底池中，有利位置在高张双色翻牌面用低对子进行转牌双重下注", "en": "PFC 3BP IP Double Barreling Low Pockets on High TT Boards", "q": "对子大小的影响", "clues": ["60%", "40%"], "a": ["将低对子细分为两组：最小对子（22-44）和较大低对子（55-77），两者在转牌圈的下注频率呈现明显差异。", "22-44的下注频率上升至约60-40，即60%的情况下继续下注，40%的情况下过牌。", "55-77的下注频率则相反，变为约40-60，即只有40%的情况下继续下注，60%的情况下过牌。", "逻辑解释：越小的对子，在翻牌圈下注时就越依赖其作为诈唬牌的价值，因此转牌圈更倾向于继续施压；而较大的低对子（55-77）有一定摊牌价值，更倾向于过牌控池。"], "note": ""}, {"id": "DGL#28-s2", "ep": "28", "type": "topic", "topic": "DGL#28 - 翻前3-bet底池中，有利位置在高张双色翻牌面用低对子进行转牌双重下注", "en": "PFC 3BP IP Double Barreling Low Pockets
