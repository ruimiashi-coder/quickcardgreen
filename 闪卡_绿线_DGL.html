，自动防御为26%，自动弃牌保持19%，剩余55%为诈唬抓取牌。MDF要求防御约40%，因此你需要用诈唬抓取牌跟注的频率为 (40% - 26%) / 55% = 25%。", "在PioSolver中验证，软件对两对、超对、第二对的跟注频率约为26%，与计算结果非常接近。"], "note": ""}, {"id": "DGL#39-s8", "ep": "39", "type": "topic", "topic": "DGL#39 - 河牌圈行动：实现河牌跟注平衡的唯一数学方法", "en": "River Play The Only Way to Be Balanced with River Calls", "q": "实战应用与免责声明", "clues": ["BB vs BTN", "SB vs CO", "bet", "OOP"], "a": ["讲师强调，本视频绝非鼓励玩家在牌局中实时进行这些复杂计算，那是不切实际的。正确的方法是在牌桌外使用电子表格和软件进行练习。", "核心工作在于熟悉不同场景下（如BB vs BTN单次加注底池、SB vs CO 3-bet底池等）你范围内“自动防御”和“自动弃牌”的典型百分比。", "一旦你对这些百分比有了直觉，就可以记忆一些粗略的准则。例如，在BB vs BTN单次加注底池，河牌面对半池下注，你通常需要用约60%的诈唬抓取牌进行跟注。", "这些百分比会因位置和行动线而异。例如，在有利位置（IP）时，你通常会有更多“自动弃牌”（因为会用更多听牌跟注），但也可能有更多“自动防御”（因为会慢玩强牌）。在不利位置（OOP）时，则通常相反，会更多地快玩强牌。"], "note": ""}, {"id": "DGL#39-c0", "ep": "39", "type": "cloze", "topic": "DGL#39 - 河牌圈行动：实现河牌跟注平衡的唯一数学方法", "en": "River Play The Only Way to Be Balanced with River Calls", "q": "Phil过牌，对手下注＿＿底池，Phil跟注。", "clues": [], "a": ["视频以一手高额桌牌局开场：Phil Smires在大盲位（BB）面对劫位（HJ）2.5x开局加注，选择跟注。翻牌为A-Q-彩虹面，Phil过牌，对手下注40%底池，Phil跟注。转牌为红桃2，Phil过牌，对手超池下注约1.5倍底池，Phil再次跟注。河牌为黑桃Q，Phil过牌，对手全下约2.5倍底池。"], "note": "40%"}, {"id": "DGL#39-c1", "ep": "39", "type": "cloze", "topic": "DGL#39 - 河牌圈行动：实现河牌跟注平衡的唯一数学方法", "en": "River Play The Only Way to Be Balanced with River Calls", "q": "Alpha = 2.5 / (1 + 2.5) = 2.5 / 3.5 = ＿＿。", "clues": [], "a": ["在本例中，对手河牌全下2.5倍底池，Alpha = 2.5 / (1 + 2.5) = 2.5 / 3.5 = 71%。因此，MDF = 1 - 71% = 29%。这意味着你需要用范围内29%的牌来防御，以防止对手用任意两张牌诈唬获利。"], "note": "71%"}, {"id": "DGL#39-c2", "ep": "39", "type": "cloze", "topic": "DGL#39 - 河牌圈行动：实现河牌跟注平衡的唯一数学方法", "en": "River Play The Only Way to Be Balanced with River Calls", "q": "约有＿＿是Q+（三条Q以上）或葫芦，其余90%是诈唬抓取牌（如A高牌）。", "clues": [], "a": ["坚果牌（如葫芦、四条）是“自动跟注”（Auto-call）牌，它们已经占据了MDF的一部分。在本例中，讲师估计Phil Smires在河牌圈的范围中，约有10%是Q+（三条Q以上）或葫芦，其余90%是诈唬抓取牌（如A高牌）。"], "note": "10%"}, {"id": "DGL#39-note", "ep": "39", "type": "note", "topic": "DGL#39 - 河牌圈行动：实现河牌跟注平衡的唯一数学方法", "en": "River Play The Only Way to Be Balanced with River Calls", "q": "避坑提醒与行动项", "clues": ["DGL", "MDF", "GTL"], "a": ["本视频是DGL系列课程的一部分，专注于河牌圈的高级策略。它承接了之前关于底池赔率、最小防御频率（MDF）和范围构建的课程内容，并将这些概念整合到一个统一的数学框架中，用于解决河牌圈最困难的决策之一。视频中提到的“GTL蓝图课程”可能包含了更基础的Alpha和MDF计算原理。", "视频的核心行动项是：下载并使用讲师提供的电子表格，结合PioSolver等软件，对常见的翻前、翻后行动线进行复盘，记录并记忆不同场景下“自动防御”和“自动弃牌”的百分比。这能帮助你建立扎实的理论基础，从而在实战中做出更准确的跟注或弃牌决策，并更好地识别和剥削对手的偏差。", "**行动项与常见错误：**", "- **应该做**：在牌桌外，使用电子表格和求解器，熟悉不同位置和行动线（如BB vs BTN, SB vs CO）到达河牌圈时，你范围内“自动防御”（两对+）和“自动弃牌”（错过的听牌、K高）的典型百分比。", "- **应该做**：将计算结果转化为粗略的准则，例如“在XX场景下，面对半池下注，我大约需要用60%的诈唬抓取牌跟注”。", "- **不要做**：不要在牌局进行中试图心算这些复杂的百分比和公式，这会导致决策迟缓并消耗大量精力。", "- **不要做**：不要忽略“自动弃牌”牌型的存在，它们会显著影响你诈唬抓取牌的跟注频率。"], "note": ""}, {"id": "DGL#40-intro", "ep": "40", "type": "intro", "topic": "河牌圈的正确弃牌艺术——如何根据转牌下注尺度决定诈唬频率", "en": "River Play How to Give up Correctly", "q": "河牌圈的正确弃牌艺术——如何根据转牌下注尺度决定诈唬频率", "clues": ["Hijack", "Big Blind", "bluff catching"], "a": ["本视频承接上一期内容，从翻前加注者（Hijack位）的视角出发，探讨在河牌圈如何正确放弃诈唬牌。上一期讨论了Big Blind位如何以正确频率进行抓诈唬（bluff catching），而本期则聚焦于相反的任务：作为翻前加注者，Little Tiny Crab在河牌圈应该以怎样的频率放弃自己的诈唬牌。视频核心观点是：大多数玩家基于情绪或剥削直觉决定是否诈唬，但面对高水平对手或缺乏阅读时，必须采用平衡策略。", "视频提出了一个关键且可量化的决策框架：河牌弃牌频率主要取决于转牌下注尺度。通过GTO求解器的大量模拟数据，讲师给出了清晰的基准数值——默认情况下河牌圈约50%的诈唬牌应该放弃；转牌下注越小，弃牌频率越低（半池约47%）；转牌下注越大，弃牌频率越高（1.5倍底池以上时高达68-70%）。视频还讨论了特定河牌结构（如高牌、顺子完成牌）对弃牌频率的影响，并给出了具体的调整规则。"], "note": ""}, {"id": "DGL#40-s0", "ep": "40", "type": "topic", "topic": "河牌圈的正确弃牌艺术——如何根据转牌下注尺度决定诈唬频率", "en": "River Play How to Give up Correctly", "q": "河牌决策的常见误区", "clues": ["mixed strategy"], "a": ["大多数玩家决定是否在河牌诈唬时，要么基于剥削视角（“我觉得他会弃牌太多”），要么基于情绪视角（“我不想放弃这个底池”），或者两者兼有。", "这种决策方式缺乏系统性，因为河牌策略通常是高度混合的（mixed strategy），需要随机化或频率化的思考方式。", "讲师明确指出：在缺乏剥削性阅读、对手水平与自己相当的情况下，必须采用平衡策略（balanced strategy），而不是凭感觉决定。"], "note": ""}, {"id": "DGL#40-s1", "ep": "40", "type": "topic", "topic": "河牌圈的正确弃牌艺术——如何根据转牌下注尺度决定诈唬频率", "en": "River Play How to Give up Correctly", "q": "基准弃牌频率：50-50法则", "clues": ["solver", "50%"], "a": ["在详细蓝图课程中已发布过“河牌玩法概念”视频，其中展示了求解器（solver）的普遍结论：在河牌圈，求解器大约会放弃其范围内50%的诈唬牌。", "这个50%的基准值在游戏树中非常稳定，适用于大多数“翻牌下注+转牌下注+河牌过牌”的常规场景。", "前提条件：你的范围在河牌圈仍然保持合理的结构（即没有因转牌下注尺度而严重失衡），且不考虑具体下注尺度的影响。"], "note": ""}, {"id": "DGL#40-s2", "ep": "40", "type": "topic", "topic": "河牌圈的正确弃牌艺术——如何根据转牌下注尺度决定诈唬频率", "en": "River Play How to Give up Correctly", "q": "转牌下注尺度对弃牌频率的决定性影响", "clues": ["Big Blind", "bluff catcher", "showdown", "GTO"], "a": ["转牌下注尺度是决定河牌弃牌频率的最重要因素，这是本视频最核心的教学点。", "逻辑解释：转牌下注越大，大盲位（Big Blind）需要投入的成本越高。如果大盲位手持抓诈唬牌（bluff catcher），面对你的河牌下注无法盈利，那么他收回投资的唯一方式就是走到摊牌（showdown）。因此，你转牌下注越大，河牌就越需要放弃更多诈唬牌。", "具体数据（基于GTO求解器历史数据筛选，条件：单次加注底池、翻牌转牌双下注、位置优势、河牌牌力为K高或更差）：", "转牌下注半池或更小（merged range）：河牌弃牌频率降至47%", "转牌下注接近满池（pot）：河牌弃牌频率回到50-50", "转牌下注1.5倍底池或更大：河牌弃牌频率飙升至68%"], "note": ""}, {"id": "DGL#40-s3", "ep": "40", "type": "topic", "topic": "河牌圈的正确弃牌艺术——如何根据转牌下注尺度决定诈唬频率", "en": "River Play How to Give up Correctly", "q": "大额转牌下注时的具体模拟数据", "clues": ["Hijack", "73%", "71%", "72%"], "a": ["具体牌例：翻牌面A-Q-4-2，Hijack位双下注（转牌1.5倍底池），河牌为空白牌（如A♦）。", "当手持低对子或更差牌力时，求解器给出的过牌（放弃诈唬）频率为73%。", "即使排除低对子，仅看K高或更差的牌力，过牌频率仍为71%。", "该频率在各类空白河牌上保持稳定：9♣为72%，8♣为71%，7♣为72%，7♠为69%，7♥为76%，6♥为71%，6♠为72%。"], "note": ""}, {"id": "DGL#40-s4", "ep": "40", "type": "topic", "topic": "河牌圈的正确弃牌艺术——如何根据转牌下注尺度决定诈唬频率", "en": "River Play How to Give up Correctly", "q": "河牌结构对弃牌频率的调整", "clues": ["89%", "80%"], "a": ["某些河牌会显著改变价值下注组合与诈唬组合的比例，从而影响弃牌频率。", "对翻前加注者有利的高牌（改善坚果范围）：如河牌为K、J、10时，几乎从不放弃诈唬牌——因为这些牌极大增强了价值范围，可以全范围开火。", "不利的顺子完成牌：如河牌为5（完成4-5顺子）时，弃牌频率高达89%；河牌为3时，弃牌频率接近80%——因为此时价值组合减少，诈唬组合相对过剩。", "配对顶牌（如河牌为A）：由于减少了价值组合的数量，也应增加弃牌频率。"], "note": ""}, {"id": "DGL#40-s5", "ep": "40", "type": "topic", "topic": "河牌圈的正确弃牌艺术——如何根据转牌下注尺度决定诈唬频率", "en": "River Play How to Give up Correctly", "q": "转牌尺度下调时的频率变化", "clues": ["75%", "60%", "59%", "70%"], "a": ["将转牌下注尺度从1.5倍底池降至75%底池后，河牌弃牌频率显著下降。", "具体数据（空白河牌）：8♦为60%，7为59%，6为60%，8为59%，9为60%，10为60%；J、Q、K仍为从不弃牌。", "结论：转牌尺度每降低一档，河牌弃牌频率大约降低10个百分点（从70%降至60%）。"], "note": ""}, {"id": "DGL#40-s6", "ep": "40", "type": "topic", "topic": "河牌圈的正确弃牌艺术——如何根据转牌下注尺度决定诈唬频率", "en": "River Play How to Give up Correctly", "q": "实战执行指南", "clues": ["overbet", "70%"], "a": ["当你完成翻牌和转牌双下注后到达河牌，且范围结构合理时，基准弃牌频率为50-50。", "随着转牌下注尺度增大，应逐步提高弃牌频率；使用超池下注（overbet）时，应预期放弃65-70%的诈唬牌。", "该指南会因牌面结构不同而有所变化，但这是一个可以直接开始执行和实施的平衡策略起点。"], "note": ""}, {"id": "DGL#40-c1", "ep": "40", "type": "cloze", "topic": "河牌圈的正确弃牌艺术——如何根据转牌下注尺度决定诈唬频率", "en": "River Play How to Give up Correctly", "q": "其中展示了求解器（solver）的普遍结论：在河牌圈，求解器大约会放弃其范围内＿＿的诈唬牌。", "clues": [], "a": ["在详细蓝图课程中已发布过“河牌玩法概念”视频，其中展示了求解器（solver）的普遍结论：在河牌圈，求解器大约会放弃其范围内50%的诈唬牌。"], "note": "50%"}, {"id": "DGL#40-c2", "ep": "40", "type": "cloze", "topic": "河牌圈的正确弃牌艺术——如何根据转牌下注尺度决定诈唬频率", "en": "River Play How to Give up Correctly", "q": "转牌下注半池或更小（merged range）：河牌弃牌频率降至＿＿", "clues": [], "a": ["转牌下注半池或更小（merged range）：河牌弃牌频率降至47%"], "note": "47%"}, {"id": "DGL#40-c3", "ep": "40", "type": "cloze", "topic": "河牌圈的正确弃牌艺术——如何根据转牌下注尺度决定诈唬频率", "en": "River Play How to Give up Correctly", "q": "当手持低对子或更差牌力时，求解器给出的过牌（放弃诈唬）频率为＿＿。", "clues": [], "a": ["当手持低对子或更差牌力时，求解器给出的过牌（放弃诈唬）频率为73%。"], "note": "73%"}, {"id": "DGL#40-note", "ep": "40", "type": "note", "topic": "河牌圈的正确弃牌艺术——如何根据转牌下注尺度决定诈唬频率", "en": "River Play How to Give up Correctly", "q": "避坑提醒与行动项", "clues": ["Green Line", "GTO", "70%"], "a": ["本视频是“绿色线”（Green Line）系列的第40期，与上一期形成完美的视角互补——上期从大盲位防守者角度讨论河牌抓诈唬频率，本期从翻前加注者角度讨论河牌诈唬放弃频率。两者共同构成了河牌圈攻防的完整频率框架。讲师使用的GTO求解器历史数据筛选方法（通过过滤特定场景来估算频率）是值得进一步学习的分析工具，可以应用于其他复杂决策场景。", "**行动项与常见错误清单：**", "- 应该做：将50-50作为河牌弃牌频率的默认基准，再根据转牌下注尺度进行调整。", "- 应该做：转牌下注越大（如1.5倍底池以上），河牌弃牌频率应提升至65-70%。", "- 应该做：关注河牌结构——高牌（K/J/10）出现时减少弃牌，顺子完成牌（如5、3）出现时大幅增加弃牌。", "- 不要做：仅凭情绪或“不想放弃底池”的心态决定是否诈唬。", "- 不要做：在没有剥削性阅读的情况下，凭直觉猜测对手的弃牌率。", "- 不要做：忽略转牌下注尺度对河牌频率的连锁影响。"], "note": ""}, {"id": "DGL#41-intro", "ep": "41", "type": "intro", "topic": "平衡是跨街努力——河牌圈平衡策略的完整构建", "en": "River Play Balance is a Multi Street Effort", "q": "平衡是跨街努力——河牌圈平衡策略的完整构建", "clues": ["Jose Jimenez", "check-shove"], "a": ["本视频通过一手GG平台1020级别实战牌局，深入剖析了河牌圈平衡策略的核心本质：平衡并非单一街的动作，而是翻牌、转牌、河牌三条街范围构建的连续结果。讲师以Jose Jimenez在河牌圈用坚果同花check-shove(过牌全下)被跟注的牌例为切入点，指出若翻牌与转牌阶段范围构建不够精确，河牌圈将面临严重过度诈唬的失衡风险。", "视频借助Solver模拟数据，详细展示了翻牌圈75-25的c-bet(持续下注)策略、转牌圈80%频率过牌同花等关键数据，并引入\"范围追踪\"（range tracking）概念，强调玩家必须时刻感知自身范围构成，避免在河牌圈因价值牌不足而无法支撑诈唬组合。最终结论是：只有三条街都保持平衡，河牌圈的激进打法才具有理论支撑。"], "note": ""}, {"id": "DGL#41-s0", "ep": "41", "type": "topic", "topic": "平衡是跨街努力——河牌圈平衡策略的完整构建", "en": "River Play Balance is a Multi Street Effort", "q": "牌局回顾与核心问题", "clues": ["Phil Myers", "KTs", "K10", "Jose Jimenez"], "a": ["牌局背景：GG平台1020级别，Phil Myers在CO位(关位)用KTs(同花K10)开局加注至2.2BB，面对Jose Jimenez的3-bet(再加注)后跟注。翻牌J♠7♦2♣（两花色），Phil持同花听牌，Jose过牌后Phil选择过牌。转牌A♣，Jose继续过牌，Phil用坚果同花下注2/3底池，Jose跟注。河牌4♣，Phil再次下注2/3底池，面对Jose的全下后跟注，Jose亮出A♠X♠（非同花A带黑桃）。", "核心警示：讲师认为从Jose视角看，此牌局极易出现\" massively over bluffing\"（严重过度诈唬）的问题，因为河牌圈check-shove(过牌全下)的平衡完全依赖于前两条街范围构建的精确度。", "关键数据点：讲师强调，若要实现河牌check-shove的平衡，范围底端必须是K♣（坚果同花），有时可能包含Q♣，但K♣是必备组合。"], "note": ""}, {"id": "DGL#41-s1", "ep": "41", "type": "topic", "topic": "平衡是跨街努力——河牌圈平衡策略的完整构建", "en": "River Play Balance is a Multi Street Effort", "q": "翻牌圈范围构建", "clues": ["Solver", "bet", "75%", "25%"], "a": ["Solver模拟显示，翻牌圈采用75-25的c-bet(持续下注)策略，即75%频率下注、25%频率过牌。", "具体组合频率：口袋K带K♣过牌频率约15%；同花听牌整体过牌频率约17-20%；KQ♣过牌13%、QT♣过牌15%、KT♣过牌23%、K9♣过牌19%。", "讲师指出，这些带K♣的组合是河牌圈坚果同花的主要来源，若翻牌圈过度下注这些牌，将直接导致河牌圈价值牌不足。", "常见错误：大多数玩家在翻牌圈极易对这些强听牌组合过度下注，导致范围失衡。"], "note": ""}, {"id": "DGL#41-s2", "ep": "41", "type": "topic", "topic": "平衡是跨街努力——河牌圈平衡策略的完整构建", "en": "River Play Balance is a Multi Street Effort", "q": "转牌圈被动策略", "clues": ["Solver", "80%"], "a": ["Solver显示，转牌圈防守方应保持极度被动，即使翻牌圈有过牌慢打，转牌圈仍需以80%频率过牌同花组合。", "关键逻辑：若翻牌圈未过牌足够多的同花听牌和带K♣/Q♣的口袋对，且转牌圈未继续慢打，河牌圈将无法获得足够多的同花组合来支撑平衡。", "讲师强调，转牌圈的被动策略是河牌圈激进打法的必要前提，两者缺一不可。"], "note": ""}, {"id": "DGL#41-s3", "ep": "41", "type": "topic", "topic": "平衡是跨街努力——河牌圈平衡策略的完整构建", "en": "River Play Balance is a Multi Street Effort", "q": "范围追踪概念", "clues": ["range tracking", "Jose"], "a": ["范围追踪（range tracking）定义为：追踪自身范围构成的能力，即在每个行动节点清晰认知自己可能持有的牌型组合。", "讲师认为Jose可能未使用范围追踪，否则会意识到自己无法在河牌圈获得足够多的同花组合，从而不应尝试诈唬。", "实践建议：玩家需要诚实地评估自身范围，若意识到范围不平衡，应主动放弃某些激进打法，而非盲目执行理论策略。"], "note": ""}, {"id": "DGL#41-s4", "ep": "41", "type": "topic", "topic": "平衡是跨街努力——河牌圈平衡策略的完整构建", "en": "River Play Balance is a Multi Street Effort", "q": "河牌圈Solver策略", "clues": ["OOP", "check-shove", "AQo", "ATs"], "a": ["面对IP玩家2/3底池的下注，OOP玩家（防守方）的check-shove(过牌全下)价值范围包括：Q♣或更好的同花、部分AK、AQ组合。", "诈唬范围构成：AQ♠（非同花A带黑桃Q）、部分无♣的AQo(非同花AQ)、部分ATs(同花AT)，甚至包括口袋A（作为诈唬组合）。", "讲师指出，若玩家仅学习一小时就试图诈唬，会倾向于选择两对和顶对作为诈唬牌，但往往无法获得足够的价值牌来支撑这些诈唬。", "剥削机会：IP玩家若识别到OOP玩家范围失衡，可采用\"薄价值下注+永不弃牌对抗check-raise(过牌加注)\"的策略，从而大量盈利。"], "note": ""}, {"id": "DGL#41-s5", "ep": "41", "type": "topic", "topic": "平衡是跨街努力——河牌圈平衡策略的完整构建", "en": "River Play Balance is a Multi Street Effort", "q": "平衡的多街属性", "clues": ["Phil"], "a": ["核心结论：平衡是跨街努力（multi-street effort），翻牌和转牌的平衡是河牌圈拥有适当数量手牌的前提。", "若缺乏范围意识，玩家可能执行看似合理的策略，但面对强手时因无法代表目标手牌而遭受重创。", "讲师强调，即使本手牌Phil因持有坚果同花而必然跟注，玩家仍需警惕范围构建的精确性。"], "note": ""}, {"id": "DGL#41-c0", "ep": "41", "type": "cloze", "topic": "平衡是跨街努力——河牌圈平衡策略的完整构建", "en": "River Play Balance is a Multi Street Effort", "q": "Phil Myers在CO位(关位)用KTs(同花K10)开局加注至＿＿，", "clues": [], "a": ["牌局背景：GG平台1020级别，Phil Myers在CO位(关位)用KTs(同花K10)开局加注至2.2BB，面对Jose Jimenez的3-bet(再加注)后跟注。翻牌J♠7♦2♣（两花色），Phil持同花听牌，Jose过牌后Phil选择过牌。转牌A♣，Jose继续过牌，Phil用坚果同花下注2/3底池，Jose跟注。河牌4♣，Phil再次下注2/3底池，面对Jose的全下后跟注，Jose亮出A♠X♠（非同花A带黑桃）。"], "note": "2.2BB"}, {"id": "DGL#41-c1", "ep": "41", "type": "cloze", "topic": "平衡是跨街努力——河牌圈平衡策略的完整构建", "en": "River Play Balance is a Multi Street Effort", "q": "翻牌圈采用75-25的c-bet(持续下注)策略，即＿＿频率下注、25%频率过牌。", "clues": [], "a": ["Solver模拟显示，翻牌圈采用75-25的c-bet(持续下注)策略，即75%频率下注、25%频率过牌。"], "note": "75%"}, {"id": "DGL#41-c2", "ep": "41", "type": "cloze", "topic": "平衡是跨街努力——河牌圈平衡策略的完整构建", "en": "River Play Balance is a Multi Street Effort", "q": "即使翻牌圈有过牌慢打，转牌圈仍需以＿＿频率过牌同花组合。", "clues": [], "a": ["Solver显示，转牌圈防守方应保持极度被动，即使翻牌圈有过牌慢打，转牌圈仍需以80%频率过牌同花组合。"], "note": "80%"}, {"id": "DGL#41-note", "ep": "41", "type": "note", "topic": "平衡是跨街努力——河牌圈平衡策略的完整构建", "en": "River Play Balance is a Multi Street Effort", "q": "避坑提醒与行动项", "clues": ["DGL", "GTO", "Solver"], "a": ["本视频属于DGL系列第41期，聚焦于河牌圈平衡策略的深层逻辑，承接了系列中关于GTO执行、范围构建和频率启发式的内容。讲师通过具体牌例和Solver数据，将抽象的平衡概念转化为可操作的决策原则，适合已掌握基础GTO概念、希望提升多街策略连贯性的玩家。", "值得进一步学习的方向包括：Solver软件的具体操作与解读、不同筹码深度下的范围构建差异、以及如何在实际游戏中培养范围追踪的思维习惯。建议玩家结合自身牌局回放，练习识别翻牌圈过牌频率、转牌圈被动策略对河牌圈范围的影响。", "行动项：", "- 翻牌圈应保留足够多的强听牌（如K♣、Q♣组合）进行过牌，而非全部下注。", "- 转牌圈对同花组合保持80%左右的过牌频率，避免过早暴露范围强度。", "- 河牌圈执行check-shove(过牌全下)前，先评估自身范围中价值牌与诈唬牌的比例。", "- 若发现自身范围无法支撑平衡，应主动放弃激进打法，而非强行诈唬。", "- 练习范围追踪：在每个行动节点，可视化自身可能持有的牌型组合及其频率。"], "note": ""}, {"id": "DGL#42-intro", "ep": "42", "type": "intro", "topic": "DGL#42 - 翻前3-bet底池中，有利位置在过牌-下注线路上慢打同花", "en": "PFC 3BP IP Slowplaying Flushes in the X-B Line", "q": "DGL#42 - 翻前3-bet底池中，有利位置在过牌-下注线路上慢打同花", "clues": ["bet", "Solver"], "a": ["本视频承接前几讲中同一手牌的讨论，聚焦于翻前3-bet底池、翻牌圈双方过牌后，转牌圈持有已成同花时是否应该慢打的问题。讲师以一手具体牌例（K♣Q♣）为切入点，结合Solver输出，展示了在特定牌面结构下，同花牌型在转牌圈的最优混合策略。", "视频核心观点是：在过牌-下注（X-B）线路上，玩家不应将所有同花都快速下注，而必须保留一部分同花用于慢打过牌，以维持下注范围和过牌范围之间的平衡。Solver给出的总体频率约为80%下注、20%过牌，且慢打倾向集中在高张同花（Broadway flush）上，低张同花则更多快速游戏。", "最后，讲师通过Hand2Note软件对多个牌面进行聚合统计，验证了“80-20”这一手牌类别频率启发式规则，并再次强调了GTO核心支柱之一——慢打型范围（slow playing type of range）的实际应用，指出如果全部快速游戏同花，会使下注范围过强、过牌范围过弱，从而被对手剥削。"], "note": ""}, {"id": "DGL#42-s0", "ep": "42", "type": "topic", "topic": "DGL#42 - 翻前3-bet底池中，有利位置在过牌-下注线路上慢打同花", "en": "PFC 3BP IP Slowplaying Flushes in the X-B Line", "q": "牌例回顾与转牌决策背景", "clues": ["Nelfill", "check-bet line", "high flush", "Solver"], "a": ["本视频继续分析此前几讲中出现过的一手牌：Nelfill在翻前3-bet底池中持有K♣Q♣，翻牌圈选择过牌-跟注（check-bet line），转牌圈发出A♣，此时他需要决定是否继续慢打自己的同花。", "该牌例的完整行动线为：翻前3-bet，翻牌圈两人都过牌，转牌圈对手下注，Nelfill手持已成同花（K♣Q♣，转牌A♣使牌面出现三张草花）。", "讲师指出，这个决策的关键在于：当转牌发出A♣后，Nelfill已经拿到坚果同花（K-high flush），但Solver显示他并不应该总是下注或加注，而是需要混合慢打。"], "note": ""}, {"id": "DGL#42-s1", "ep": "42", "type": "topic", "topic": "DGL#42 - 翻前3-bet底池中，有利位置在过牌-下注线路上慢打同花", "en": "PFC 3BP IP Slowplaying Flushes in the X-B Line", "q": "Solver对具体牌例的慢打频率", "clues": ["Solver", "Nelfill", "Broadway flush", "fast playing"], "a": ["在翻牌圈双方过牌、转牌发出A♣的情况下，Solver建议Nelfill对已成的同花牌型，约15%的时候选择慢打过牌。", "具体到K♣Q♣这手牌（即Nelfill实际持有的牌），Solver给出的慢打频率为41%，即接近一半的时候选择过牌，而不是立即下注。", "另一手高张同花K♦Q♦（Broadway flush）的慢打频率更高，达到64%。", "相反，Q♣T♣这类较低的同花，Solver倾向于快速游戏（fast playing），即大多数时候直接下注。", "总体规律是：高张同花（Broadway flush）慢打比例较高，低张同花则更多快速下注，聚合后所有同花牌型的过牌频率约为15%。"], "note": ""}, {"id": "DGL#42-s2", "ep": "42", "type": "topic", "topic": "DGL#42 - 翻前3-bet底池中，有利位置在过牌-下注线路上慢打同花", "en": "PFC 3BP IP Slowplaying Flushes in the X-B Line", "q": "聚合统计与80-20频率启发式", "clues": ["Hand2Note", "BTN", "bet", "heuristic"], "a": ["讲师通过Hand2Note软件，对“从EP到BTN开局加注，被盲注位3-bet，翻牌J-J-X，转牌对手过牌，自己持有同花”这一系列场景进行了聚合筛选。", "统计结果显示，在所有类似牌面结构中，持有同花时的最优策略是遵循“80-20”分桶原则：约80%的同花选择下注，约20%的同花选择过牌慢打。", "这一频率适用于翻牌圈两人都过牌、转牌圈对手过牌给己方的行动线（即X-B线路中的转牌决策点）。", "讲师强调，这个80-20比例是一个手牌类别频率启发式（hand-class frequency heuristic），可以作为实战中的快速参考基准。"], "note": ""}, {"id": "DGL#42-s3", "ep": "42", "type": "topic", "topic": "DGL#42 - 翻前3-bet底池中，有利位置在过牌-下注线路上慢打同花", "en": "PFC 3BP IP Slowplaying Flushes in the X-B Line", "q": "GTO支柱：慢打型范围的应用", "clues": ["GTO", "of range", "balanced", "20%"], "a": ["讲师指出，80-20分桶正是GTO核心支柱之一“慢打型范围”（slow playing type of range）的具体体现，该概念在GTO蓝图课程中已有详细讲解。", "如果玩家将所有同花都快速下注，会导致下注范围过强（全是强牌），而过牌范围过弱（全是弱牌），这种不平衡会被对手利用。", "为了保持平衡（balanced），玩家必须从同花中抽出一部分（约20%）用于慢打过牌，以保护过牌范围，同时避免下注范围过于极化。", "这一原则不仅适用于同花，也适用于其他坚果类牌型，是GTO策略中维持范围均衡的通用方法。"], "note": ""}, {"id": "DGL#42-s4", "ep": "42", "type": "topic", "topic": "DGL#42 - 翻前3-bet底池中，有利位置在过牌-下注线路上慢打同花", "en": "PFC 3BP IP Slowplaying Flushes in the X-B Line", "q": "Solver慢打的具体牌例展示", "clues": ["Solver", "20%"], "a": ["讲师展示了Solver在多个不同牌面上选择慢打同花的具体实例，以说明20%慢打频率的实际分布：", "Q♠J♠在翻牌T♠T♦6♣、转牌K♦的牌面上被选择慢打。", "A♠Q♠在翻牌T♠8♠6♦、转牌3♣的牌面上被选择慢打。", "A♦Q♦在翻牌Q♣4♦3♠、转牌2♦的牌面上被选择慢打（顶对+坚果同花听牌，转牌成同花）。", "A♥J♥在翻牌Q♣4♦3♠、转牌5♥的牌面上被选择慢打。", "K♦Q♦在翻牌T♦T♣6♠、转牌8♦的牌面上被选择慢打。", "这些例子表明，Solver在多种牌面结构下都会从同花中抽出一部分用于慢打，且并非只选择特定某手牌，而是分散在不同组合中。"], "note": ""}, {"id": "DGL#42-s5", "ep": "42", "type": "topic", "topic": "DGL#42 - 翻前3-bet底池中，有利位置在过牌-下注线路上慢打同花", "en": "PFC 3BP IP Slowplaying Flushes in the X-B Line", "q": "常见错误与实战要点", "clues": ["Broadway flush", "Hand2Note", "20%", "80%"], "a": ["常见错误：拿到同花后总是立即下注或加注，试图快速榨取价值，这会使下注范围过强、过牌范围过弱，容易被对手针对性地剥削。", "正确做法：在翻牌圈双方过牌、转牌圈对手过牌的情况下，持有同花时应混合策略，约20%的时候选择过牌慢打，80%的时候下注。", "慢打的选择应偏向高张同花（Broadway flush），因为这类牌阻挡了对手更多的坚果组合，且自身权益更稳固；低张同花则更多快速游戏。", "实战中可借助Hand2Note等软件的手牌类别频率统计功能，快速判断当前场景下的最优频率基准。"], "note": ""}, {"id": "DGL#42-c1", "ep": "42", "type": "cloze", "topic": "DGL#42 - 翻前3-bet底池中，有利位置在过牌-下注线路上慢打同花", "en": "PFC 3BP IP Slowplaying Flushes in the X-B Line", "q": "Solver建议Nelfill对已成的同花牌型，约＿＿的时候选择慢打过牌。", "clues": [], "a": ["在翻牌圈双方过牌、转牌发出A♣的情况下，Solver建议Nelfill对已成的同花牌型，约15%的时候选择慢打过牌。"], "note": "15%"}, {"id": "DGL#42-c2", "ep": "42", "type": "cloze", "topic": "DGL#42 - 翻前3-bet底池中，有利位置在过牌-下注线路上慢打同花", "en": "PFC 3BP IP Slowplaying Flushes in the X-B Line", "q": "持有同花时的最优策略是遵循“80-20”分桶原则：约＿＿的同花选择下注，", "clues": [], "a": ["统计结果显示，在所有类似牌面结构中，持有同花时的最优策略是遵循“80-20”分桶原则：约80%的同花选择下注，约20%的同花选择过牌慢打。"], "note": "80%"}, {"id": "DGL#42-c3", "ep": "42", "type": "cloze", "topic": "DGL#42 - 翻前3-bet底池中，有利位置在过牌-下注线路上慢打同花", "en": "PFC 3BP IP Slowplaying Flushes in the X-B Line", "q": "玩家必须从同花中抽出一部分（约＿＿）用于慢打过牌，", "clues": [], "a": ["为了保持平衡（balanced），玩家必须从同花中抽出一部分（约20%）用于慢打过牌，以保护过牌范围，同时避免下注范围过于极化。"], "note": "20%"}, {"id": "DGL#42-note", "ep": "42", "type": "note", "topic": "DGL#42 - 翻前3-bet底池中，有利位置在过牌-下注线路上慢打同花", "en": "PFC 3BP IP Slowplaying Flushes in the X-B Line", "q": "避坑提醒与行动项", "clues": ["DGL", "bet", "GTO"], "a": ["本视频是DGL系列第42讲，承接了前几讲中同一手牌的连续分析，从翻前3-bet、翻牌圈过牌-跟注，一路推进到转牌圈的慢打决策，展示了GTO策略在完整牌局中的连贯应用。视频中提到的“GTO蓝图课程”是理解慢打型范围等核心概念的前置知识，建议学习者先掌握GTO基础框架，再结合本视频的频率数据进行实战演练。", "值得进一步学习的方向包括：不同翻牌面结构（如彩虹面、公对面、连张面）对慢打频率的具体影响；转牌圈慢打后河牌圈的行动调整；以及如何利用阻挡牌（blocker）在具体组合中微调慢打与快速游戏的比例。视频末尾提到的Hand2Note频率统计功能，可作为日常训练中验证和校准自身策略的实用工具。", "- 应该做：在X-B线路中转牌持有同花时，约20%选择过牌慢打，80%下注；慢打优先选择高张同花。", "- 不应该做：不要将所有同花都快速下注，否则下注范围过强、过牌范围过弱，容易被剥削。", "- 应该做：借助Hand2Note等软件的手牌类别频率统计，定期校准自己的慢打频率是否接近80-20基准。"], "note": ""}, {"id": "DGL#43-intro", "ep": "43", "type": "intro", "topic": "DGL#43 - 单次加注底池中，有利位置持续下注时，错过同花听牌应多频繁放弃", "en": "PFR SRP IP How Often to Give Up Missed Flush Draws", "q": "DGL#43 - 单次加注底池中，有利位置持续下注时，错过同花听牌应多频繁放弃", "clues": ["SRP", "double barrel", "Miss Flush Draw"], "a": ["本视频聚焦于一个具体且高频的场景：在单次加注底池（SRP）中，作为有利位置玩家，翻牌圈和转牌圈连续下注（double barrel）后，河牌圈持有未完成的同花听牌（Miss Flush Draw）时，应该多频繁地放弃诈唬。讲师指出，大多数玩家的直觉是拿着这类牌型应该在河牌直接放弃，但GTO求解器（Solver）的实际策略却与此直觉相悖。", "通过软件数据筛选，讲师发现求解器在河牌圈面对对手过牌时，会以约44%的频率继续用未完成的同花听牌下注（triple barrel），而非大多数人想象的接近0%。这一频率几乎与求解器对其他诈唬牌型的整体下注频率（约50%）持平，说明未完成的同花听牌在河牌圈并非“天然放弃牌”，而是具有相当高的诈唬价值。", "视频的核心教学意义在于纠正玩家的常见误区：不要因为持有未完成的同花听牌就默认放弃河牌诈唬。讲师通过具体牌例（如T9s、54s）展示了求解器的实际下注行为，并建议玩家遵循“约44%频率继续下注”的启发式规则，以保持自身范围的平衡，避免被对手利用。"], "note": ""}, {"id": "DGL#43-s0", "ep": "43", "type": "topic", "topic": "DGL#43 - 单次加注底池中，有利位置持续下注时，错过同花听牌应多频繁放弃", "en": "PFR SRP IP How Often to Give Up Missed Flush Draws", "q": "常见误区：河牌必然放弃", "clues": ["blocker", "Miss Flush Draw", "inner heuristic"], "a": ["大多数玩家在翻牌圈和转牌圈连续下注后，一旦河牌没有完成同花，直觉反应就是直接放弃诈唬。", "这种直觉源于一种假设：未完成的同花听牌阻挡牌（blocker）效果太差，导致无法盈利性地诈唬。", "讲师明确指出，这种“拿着Miss Flush Draw就该放弃”的想法是普遍存在的内在启发式（inner heuristic），但求解器的实际策略并非如此。"], "note": ""}, {"id": "DGL#43-s1", "ep": "43", "type": "topic", "topic": "DGL#43 - 单次加注底池中，有利位置持续下注时，错过同花听牌应多频繁放弃", "en": "PFR SRP IP How Often to Give Up Missed Flush Draws", "q": "求解器实际频率：44%继续下注", "clues": ["Miss Flush Draw", "suited hands", "barrel", "44%"], "a": ["讲师通过软件筛选了“triple barrel line”场景：翻牌下注、转牌下注、河牌对手过牌，且玩家处于有利位置。", "筛选条件为“Miss Flush Draw”，并特别排除了非同花牌型，只关注同花起手牌（suited hands），因为非同花牌型也可能形成未完成的同花听牌。", "软件数据显示，求解器在河牌圈面对对手过牌时，会以44%的频率继续下注（barrel）这些未完成的同花听牌。", "讲师原本预期该频率会更低，但实际结果几乎与求解器对其他诈唬牌型的整体下注频率（约50%）一致，即“一半一半的放弃频率”。"], "note": ""}, {"id": "DGL#43-s2", "ep": "43", "type": "topic", "topic": "DGL#43 - 单次加注底池中，有利位置持续下注时，错过同花听牌应多频繁放弃", "en": "PFR SRP IP How Often to Give Up Missed Flush Draws", "q": "牌例分析：T9s与54s的具体行动", "clues": ["T9s", "double barrel", "queen river", "bomb"], "a": ["讲师以T9s（黑桃T9）为例：翻牌圈下注，转牌圈继续下注（double barrel），河牌圈在Q高牌面（queen river）上继续下注（bomb）。", "另一个牌例为54s（方片54）：翻牌圈下注，转牌圈double barrel，河牌圈同样在Q高牌面继续下注。", "这两个牌例均展示了求解器在持有未完成的同花听牌时，会以一定频率在河牌圈继续诈唬，而非一律放弃。"], "note": ""}, {"id": "DGL#43-s3", "ep": "43", "type": "topic", "topic": "DGL#43 - 单次加注底池中，有利位置持续下注时，错过同花听牌应多频繁放弃", "en": "PFR SRP IP How Often to Give Up Missed Flush Draws", "q": "平衡策略：遵循44%频率启发式", "clues": ["Miss Flush Draw", "44%", "50%"], "a": ["讲师建议，如果玩家在河牌圈持有未完成的同花听牌，可以遵循“约44%频率继续下注”的启发式规则。", "这一频率与求解器对其他诈唬牌型的整体下注频率（约50%）接近，能够使玩家的范围保持合理平衡（reasonably balanced）。", "讲师强调，下次在河牌圈拿到Miss Flush Draw时，不要立即假设应该放弃，因为求解器确实会以44%的频率继续下注这些牌型。"], "note": ""}, {"id": "DGL#43-s4", "ep": "43", "type": "topic", "topic": "DGL#43 - 单次加注底池中，有利位置持续下注时，错过同花听牌应多频繁放弃", "en": "PFR SRP IP How Often to Give Up Missed Flush Draws", "q": "核心结论：不要默认放弃", "clues": ["Miss Flush Draw", "44%"], "a": ["未完成的同花听牌在河牌圈并非“天然放弃牌”，而是具有相当高的诈唬价值。", "求解器的实际策略表明，这类牌型可以与其他诈唬牌型一样，以接近一半的频率继续下注。", "玩家应避免“拿着Miss Flush Draw就放弃”的直觉，而是根据频率启发式（约44%）做出更平衡的决策。"], "note": ""}, {"id": "DGL#43-c1", "ep": "43", "type": "cloze", "topic": "DGL#43 - 单次加注底池中，有利位置持续下注时，错过同花听牌应多频繁放弃", "en": "PFR SRP IP How Often to Give Up Missed Flush Draws", "q": "会以＿＿的频率继续下注（barrel）这些未完成的同花听牌。", "clues": [], "a": ["软件数据显示，求解器在河牌圈面对对手过牌时，会以44%的频率继续下注（barrel）这些未完成的同花听牌。"], "note": "44%"}, {"id": "DGL#43-c3", "ep": "43", "type": "cloze", "topic": "DGL#43 - 单次加注底池中，有利位置持续下注时，错过同花听牌应多频繁放弃", "en": "PFR SRP IP How Often to Give Up Missed Flush Draws", "q": "如果玩家在河牌圈持有未完成的同花听牌，可以遵循“约＿＿频率继续下注”的启发式规则。", "clues": [], "a": ["讲师建议，如果玩家在河牌圈持有未完成的同花听牌，可以遵循“约44%频率继续下注”的启发式规则。"], "note": "44%"}, {"id": "DGL#43-c4", "ep": "43", "type": "cloze", "topic": "DGL#43 - 单次加注底池中，有利位置持续下注时，错过同花听牌应多频繁放弃", "en": "PFR SRP IP How Often to Give Up Missed Flush Draws", "q": "玩家应避免“拿着Miss Flush Draw就放弃”的直觉，而是根据频率启发式（约＿＿）做出更平衡的决策。", "clues": [], "a": ["玩家应避免“拿着Miss Flush Draw就放弃”的直觉，而是根据频率启发式（约44%）做出更平衡的决策。"], "note": "44%"}, {"id": "DGL#43-note", "ep": "43", "type": "note", "topic": "DGL#43 - 单次加注底池中，有利位置持续下注时，错过同花听牌应多频繁放弃", "en": "PFR SRP IP How Often to Give Up Missed Flush Draws", "q": "避坑提醒与行动项", "clues": ["DGL", "Miss Flush Draw", "44%"], "a": ["本视频属于DGL系列（第43期），聚焦于单次加注底池中有利位置玩家的河牌圈决策，特别是未完成同花听牌的诈唬频率。视频内容承接了系列中关于“频率启发式”和“范围平衡”的讨论，为玩家提供了一个具体的、可量化的决策规则。值得进一步学习的方向包括：如何在不同牌面结构（如更湿润或更干燥的河牌）中调整这一频率，以及如何结合对手类型（如跟注站或过度弃牌者）进行剥削性调整。", "行动项与常见错误：", "- 应该这样做：在河牌圈持有未完成的同花听牌时，以约44%的频率继续下注，保持范围平衡。", "- 应该这样做：参考求解器对其他诈唬牌型的整体下注频率（约50%），将Miss Flush Draw视为同等价值的诈唬牌型。", "- 不要这样做：不要因为持有未完成的同花听牌就默认在河牌放弃，这会让你的范围过于可预测。", "- 不要这样做：不要低估同花听牌的阻挡牌价值，求解器数据显示它们足以支持盈利性诈唬。"], "note": ""}, {"id": "DGL#44-intro", "ep": "44", "type": "intro", "topic": "DGL#44 - 单次加注底池中，有利位置顶对好踢脚在转牌圈的双重下注频率", "en": "PFR SRP IP How Often to Double Barrel TPGK", "q": "DGL#44 - 单次加注底池中，有利位置顶对好踢脚在转牌圈的双重下注频率", "clues": ["SRP", "TPGK", "heuristic"], "a": ["本视频聚焦于一个非常具体的翻后场景：在单次加注底池（SRP）中，作为翻前加注者且处于有利位置（IP），翻牌圈持续下注并被跟注后，在转牌圈持有顶对好踢脚（TPGK）时，应该如何选择下注或过牌的频率。讲师引入了一个“手牌类别频率启发式”（hand-class frequency heuristic）工具，帮助玩家快速找到接近GTO的混合策略。", "视频的核心发现是：顶对好踢脚这一手牌类别在双重下注（double barrel）线路中是最常见的牌型，但整体下注频率并非最高，而是处于60%的混合策略区间。更重要的是，具体踢脚的大小会显著改变下注频率：顶对顶踢脚（TPTK）和顶对第二踢脚下注频率高达80%，而顶对第三、第四踢脚则降至60%。此外，转牌牌面结构也会对频率产生系统性影响。", "讲师通过GTO求解器数据，展示了如何根据转牌的具体牌面（低牌、高牌、盖帽牌、对子牌、中间牌、同花牌）来动态调整下注频率。整体逻辑符合直觉：对进攻方有利的转牌（如高牌）应提高下注频率，对进攻方不利的转牌（如同花牌、中间牌）应降低下注频率。该启发式方法为玩家提供了一套无需实时计算即可执行的简化决策框架。"], "note": ""}, {"id": "DGL#44-s0", "ep": "44", "type": "topic", "topic": "DGL#44 - 单次加注底池中，有利位置顶对好踢脚在转牌圈的双重下注频率", "en": "PFR SRP IP How Often to Double Barrel TPGK", "q": "手牌类别定义与数据来源", "clues": ["GTO", "hint to note", "SRP", "double barrel"], "a": ["本视频使用的工具是GTO求解器（提及为“hint to note”），分析场景限定为：单次加注底池（SRP）、翻前加注者处于有利位置（IP）、翻牌圈下注后被跟注、转牌圈面临是否双重下注（double barrel）的决策。", "顶对好踢脚（TPGK）的定义范围较宽：从顶对第三踢脚一直到顶对顶踢脚（TPTK），在某些牌面上甚至包括顶对第四踢脚。该类别是双重下注线路中出现频率最高的手牌类别，因此掌握其频率策略至关重要。", "全局数据显示，顶对好踢脚在转牌圈的下注频率约为70%，但讲师指出更精确的混合策略区间应归入“60%区间”（即约60%下注、40%过牌）。实际数据为60/40分（下注/过牌），即约60%下注。"], "note": ""}, {"id": "DGL#44-s1", "ep": "44", "type": "topic", "topic": "DGL#44 - 单次加注底池中，有利位置顶对好踢脚在转牌圈的双重下注频率", "en": "PFR SRP IP How Often to Double Barrel TPGK", "q": "踢脚大小对频率的影响", "clues": ["over-barrel", "TPTK", "high", "60%"], "a": ["当不区分具体踢脚、只看顶对好踢脚整体时，下注频率为60%区间（60/40分）。讲师强调大多数玩家会过度下注（over-barrel）这些牌，导致频率失衡。", "若单独筛选顶对顶踢脚（TPTK，如AK在K-high牌面），下注频率显著上升至77.23%，可归入80%区间（约80%下注、20%过牌）。这是该类别中下注频率最高的子集。", "顶对第二踢脚（如KQ在K-high牌面，踢脚为Q）同样归入80%区间，与顶对顶踢脚处理方式一致。", "顶对第三踢脚和顶对第四踢脚则归入60%区间，与全局顶对好踢脚的整体频率相同。讲师建议玩家在实战中按此简化：TPTK和第二踢脚打80%频率，第三、第四踢脚打60%频率。"], "note": ""}, {"id": "DGL#44-s2", "ep": "44", "type": "topic", "topic": "DGL#44 - 单次加注底池中，有利位置顶对好踢脚在转牌圈的双重下注频率", "en": "PFR SRP IP How Often to Double Barrel TPGK", "q": "转牌牌面结构的影响", "clues": ["low card", "high card", "overcard", "pair turn"], "a": ["将所有顶对好踢脚合并以增加样本量后，转牌牌面可细分为五类，每类对应不同的下注频率：", "低牌转牌（low card）：下注频率为50/50分，可近似归入60%区间。这是相对中性的牌面。", "高牌转牌（high card）：下注频率上升至63%，略高于全局水平，但仍接近60%区间。", "盖帽转牌（overcard，即转牌大于翻牌圈所有牌且大于顶对）：下注频率显著上升至73%，可归入80%区间。这是对进攻方最有利的转牌之一。", "对子转牌（pair turn）和中间牌转牌（middle card）：下注频率均降至50/50分，接近40%区间。这两类牌面降低了进攻方的下注欲望。", "同花转牌（flush card turn）：下注频率最低，过牌频率高达56%，下注频率仅约44%，明确归入40%区间。这是对进攻方最不利的转牌。"], "note": ""}, {"id": "DGL#44-s3", "ep": "44", "type": "topic", "topic": "DGL#44 - 单次加注底池中，有利位置顶对好踢脚在转牌圈的双重下注频率", "en": "PFR SRP IP How Often to Double Barrel TPGK", "q": "频率调整的核心逻辑", "clues": ["60%", "80%", "40%"], "a": ["整体规律可概括为：对翻前加注者（进攻方）有利的转牌（如盖帽牌、高牌）应提高下注频率；对进攻方不利的转牌（如同花牌、中间牌、对子牌）应降低下注频率。", "具体数值总结：顶对好踢脚全局60%区间；顶对顶踢脚和第二踢脚80%区间；顶对第三、第四踢脚60%区间。在此基础上，根据转牌牌面上下浮动：盖帽牌升至80%区间，同花牌降至40%区间，中间牌和对子牌接近40%区间，低牌和高牌维持60%区间。", "讲师强调，这一“手牌类别频率启发式”的价值在于：玩家无需在牌桌上实时计算精确百分比，只需记住几个关键区间（40%、60%、80%）以及牌面和踢脚的分类，即可快速做出接近平衡的决策。"], "note": ""}, {"id": "DGL#44-c0", "ep": "44", "type": "cloze", "topic": "DGL#44 - 单次加注底池中，有利位置顶对好踢脚在转牌圈的双重下注频率", "en": "PFR SRP IP How Often to Double Barrel TPGK", "q": "顶对好踢脚在转牌圈的下注频率约为＿＿，但讲师指出更精确的混合策略区间应归入“60%区间”（即约60%下注、40%过牌）。", "clues": [], "a": ["全局数据显示，顶对好踢脚在转牌圈的下注频率约为70%，但讲师指出更精确的混合策略区间应归入“60%区间”（即约60%下注、40%过牌）。实际数据为60/40分（下注/过牌），即约60%下注。"], "note": "70%"}, {"id": "DGL#44-c1", "ep": "44", "type": "cloze", "topic": "DGL#44 - 单次加注底池中，有利位置顶对好踢脚在转牌圈的双重下注频率", "en": "PFR SRP IP How Often to Double Barrel TPGK", "q": "下注频率为＿＿区间（60/40分）。讲师强调大多数玩家会过度下注（over-barrel）这些牌，", "clues": [], "a": ["当不区分具体踢脚、只看顶对好踢脚整体时，下注频率为60%区间（60/40分）。讲师强调大多数玩家会过度下注（over-barrel）这些牌，导致频率失衡。"], "note": "60%"}, {"id": "DGL#44-c2", "ep": "44", "type": "cloze", "topic": "DGL#44 - 单次加注底池中，有利位置顶对好踢脚在转牌圈的双重下注频率", "en": "PFR SRP IP How Often to Double Barrel TPGK", "q": "低牌转牌（low card）：下注频率为50/50分，可近似归入＿＿区间。这是相对中性的牌面。", "clues": [], "a": ["低牌转牌（low card）：下注频率为50/50分，可近似归入60%区间。这是相对中性的牌面。"], "note": "60%"}, {"id": "DGL#44-note", "ep": "44", "type": "note", "topic": "DGL#44 - 单次加注底池中，有利位置顶对好踢脚在转牌圈的双重下注频率", "en": "PFR SRP IP How Often to Double Barrel TPGK", "q": "避坑提醒与行动项", "clues": ["DGL", "Deep Game Life", "GTO"], "a": ["本视频属于DGL系列（Deep Game Life）的第44期，聚焦于单次加注底池中有利位置顶对好踢脚的转牌圈决策。该内容承接了系列中关于翻后频率和手牌类别分类的框架，是构建系统化翻后策略的重要一环。视频中提到的“频率启发式”方法，与系列中其他手牌类别（如顶对弱踢脚、中对、听牌等）的频率分析可以相互配合，形成完整的转牌圈决策树。", "值得进一步学习的方向包括：如何将本视频的频率区间应用到不同筹码深度和不同对手类型的剥削性调整中；以及如何在河牌圈根据转牌圈的下注/过牌选择，进一步规划顶对好踢脚的河牌行动。此外，理解这些频率背后的GTO原理（如范围优势和坚果优势）有助于在更复杂的牌面结构中灵活变通。", "**行动项与常见错误：**", "- 应该做：持有顶对顶踢脚或第二踢脚时，在转牌圈积极下注（约80%频率），尤其是转牌为盖帽牌或高牌时。", "- 应该做：持有顶对第三、第四踢脚时，降低下注频率至约60%，并在同花转牌或中间牌转牌上更多过牌。", "- 不要做：不要对所有顶对好踢脚都采用相同的下注频率，踢脚大小是决定频率的首要因素。", "- 不要做：不要在同花转牌上过度下注顶对好踢脚，此时应大幅增加过牌频率（约56%过牌）。", "- 不要做：不要忽视转牌牌面结构，仅凭手牌强度决定下注，必须结合牌面对进攻方是否有利来调整频率。"], "note": ""}, {"id": "DGL#45-intro", "ep": "45", "type": "intro", "topic": "DGL#45 - 翻前单次加注底池：盲注位对抗有利位置玩家时，卡顺听牌的下注频率探讨", "en": "PFC SRP OOP How Often to Probe Gutshots", "q": "DGL#45 - 翻前单次加注底池：盲注位对抗有利位置玩家时，卡顺听牌的下注频率探讨", "clues": ["heuristic"], "a": ["本视频聚焦于一个非常常见的翻后场景：玩家在大盲位防守，面对有利位置（IP）玩家的翻前加注，翻牌圈双方都过牌，然后进入转牌圈。视频的核心是给出一个基于频率的启发式策略（heuristic），帮助玩家快速决定在转牌圈是否应该下注。", "讲师通过数据筛选，将大盲位玩家在转牌圈可能持有的牌型按频率排序，并特别关注“卡顺听牌”（gutshot）这一手牌类别。他根据卡顺听牌所带的“高牌数量”（overcards）将其细分为三类：无高牌、一张高牌和两张高牌，并分别统计了它们的下注频率。", "最终得出的核心结论是：无高牌或仅一张高牌的卡顺听牌，应归入“40%下注频率”的档位；而带有两张高牌的卡顺听牌，下注频率会显著提升，应归入“60%下注频率”的档位。这个简单的分类方法能帮助玩家在实战中更接近平衡地构建诈唬范围。"], "note": ""}, {"id": "DGL#45-s0", "ep": "45", "type": "topic", "topic": "DGL#45 - 翻前单次加注底池：盲注位对抗有利位置玩家时，卡顺听牌的下注频率探讨", "en": "PFC SRP OOP How Often to Probe Gutshots", "q": "牌局场景与数据筛选", "clues": ["trash", "top pair with", "weak kicker", "gutshot"], "a": ["视频分析的具体场景是：玩家在大盲位（BB）防守，对手在任意位置（从枪口位到庄位）加注，翻牌圈双方都过牌，进入转牌圈。", "通过筛选数据，可以观察到在转牌圈，大盲位玩家的范围中“垃圾牌”（trash）和“顶对弱踢脚”（top pair with weak kicker）出现的频率最高。", "卡顺听牌（gutshot）在转牌圈所有可能持有的牌型中，出现频率排在第六位。"], "note": ""}, {"id": "DGL#45-s1", "ep": "45", "type": "topic", "topic": "DGL#45 - 翻前单次加注底池：盲注位对抗有利位置玩家时，卡顺听牌的下注频率探讨", "en": "PFC SRP OOP How Often to Probe Gutshots", "q": "卡顺听牌的分类标准", "clues": ["overcards"], "a": ["讲师将卡顺听牌按照其携带的“高牌数量”（overcards）进行分类，并认为这会对下注频率产生显著影响。", "无高牌的卡顺听牌示例：在A-5-4-8牌面上持有9-7；在A-K-3-9牌面上持有Q-J；在K-Q-7-4牌面上持有J-9。", "两张高牌的卡顺听牌示例：在10-9-2-5牌面上持有K-J；在9-8-3-2牌面上持有Q-10。"], "note": ""}, {"id": "DGL#45-s2", "ep": "45", "type": "topic", "topic": "DGL#45 - 翻前单次加注底池：盲注位对抗有利位置玩家时，卡顺听牌的下注频率探讨", "en": "PFC SRP OOP How Often to Probe Gutshots", "q": "无高牌或一张高牌的卡顺策略", "clues": ["36%", "64%", "40%", "45%"], "a": ["对于无高牌的卡顺听牌，其整体下注频率为36%对64%（过牌），因此应将其归入“40%下注频率”的档位。", "对于只有一张高牌的卡顺听牌，下注频率会略微上升至45%对55%（过牌），但依然最接近“40%下注频率”的档位。", "结论：持有无高牌或一张高牌的卡顺听牌时，应使用“40%下注频率”的档位进行游戏。这意味着在转牌圈，你大约有40%的频率选择下注，60%的频率选择过牌。"], "note": ""}, {"id": "DGL#45-s3", "ep": "45", "type": "topic", "topic": "DGL#45 - 翻前单次加注底池：盲注位对抗有利位置玩家时，卡顺听牌的下注频率探讨", "en": "PFC SRP OOP How Often to Probe Gutshots", "q": "两张高牌的卡顺策略", "clues": ["68%", "32%", "60%"], "a": ["当卡顺听牌带有两张高牌时，下注频率会显著上升至68%对32%（过牌）。", "因此，这类牌型应归入“60%下注频率”的档位。", "结论：持有两张高牌的卡顺听牌时，应使用“60%下注频率”的档位进行游戏，下注频率显著高于前两类牌型。"], "note": ""}, {"id": "DGL#45-s4", "ep": "45", "type": "topic", "topic": "DGL#45 - 翻前单次加注底池：盲注位对抗有利位置玩家时，卡顺听牌的下注频率探讨", "en": "PFC SRP OOP How Often to Probe Gutshots", "q": "核心启发式策略总结", "clues": ["Turn", "bluffing range", "balanced", "40%"], "a": ["核心策略总结：无高牌或一张高牌的卡顺听牌，使用“40%下注频率”档位；两张高牌的卡顺听牌，使用“60%下注频率”档位。", "讲师强调，遵循这个简单的启发式策略，能让你在转牌圈（Turn）的诈唬范围（bluffing range）更接近平衡状态（balanced），从而更难被对手剥削。"], "note": ""}, {"id": "DGL#45-c2", "ep": "45", "type": "cloze", "topic": "DGL#45 - 翻前单次加注底池：盲注位对抗有利位置玩家时，卡顺听牌的下注频率探讨", "en": "PFC SRP OOP How Often to Probe Gutshots", "q": "其整体下注频率为＿＿对64%（过牌），因此应将其归入“40%下注频率”的档位。", "clues": [], "a": ["对于无高牌的卡顺听牌，其整体下注频率为36%对64%（过牌），因此应将其归入“40%下注频率”的档位。"], "note": "36%"}, {"id": "DGL#45-c3", "ep": "45", "type": "cloze", "topic": "DGL#45 - 翻前单次加注底池：盲注位对抗有利位置玩家时，卡顺听牌的下注频率探讨", "en": "PFC SRP OOP How Often to Probe Gutshots", "q": "当卡顺听牌带有两张高牌时，下注频率会显著上升至＿＿对32%（过牌）。", "clues": [], "a": ["当卡顺听牌带有两张高牌时，下注频率会显著上升至68%对32%（过牌）。"], "note": "68%"}, {"id": "DGL#45-c4", "ep": "45", "type": "cloze", "topic": "DGL#45 - 翻前单次加注底池：盲注位对抗有利位置玩家时，卡顺听牌的下注频率探讨", "en": "PFC SRP OOP How Often to Probe Gutshots", "q": "核心策略总结：无高牌或一张高牌的卡顺听牌，使用“＿＿下注频率”档位；两张高牌的卡顺听牌，", "clues": [], "a": ["核心策略总结：无高牌或一张高牌的卡顺听牌，使用“40%下注频率”档位；两张高牌的卡顺听牌，使用“60%下注频率”档位。"], "note": "40%"}, {"id": "DGL#45-note", "ep": "45", "type": "note", "topic": "DGL#45 - 翻前单次加注底池：盲注位对抗有利位置玩家时，卡顺听牌的下注频率探讨", "en": "PFC SRP OOP How Often to Probe Gutshots", "q": "避坑提醒与行动项", "clues": ["DGL", "SRP", "River"], "a": ["本视频是“DGL”系列的第45期，内容承接了翻前单次加注底池（SRP）中关于盲注位防守的讨论，并深入到具体的转牌圈策略。视频提供了一个非常实用的频率分类工具，将复杂的范围构建简化为基于高牌数量的快速决策。", "值得进一步学习的方向包括：如何根据具体的转牌牌面结构（如连接性、花色）微调这些频率，以及如何将这些频率策略与河牌圈（River）的计划相结合。此外，也可以研究在翻牌圈没有过牌的情况下，这些卡顺听牌的策略会有何不同。", "- 应该这样做：在转牌圈持有卡顺听牌时，先数清自己有几张高牌，再决定下注频率。", "- 不要这样做：不要对所有卡顺听牌都采用相同的下注频率，高牌数量是影响频率的关键因素。"], "note": ""}, {"id": "DGL#46-intro", "ep": "46", "type": "intro", "topic": "DGL#46 - 翻前单次加注底池、不利位置：过牌加注后，转牌圈听牌的下注频率", "en": "PFC SRP OOP How Often to Barrel Draws XR - B Line", "q": "DGL#46 - 翻前单次加注底池、不利位置：过牌加注后，转牌圈听牌的下注频率", "clues": ["check-raise", "barrel"], "a": ["本视频聚焦于一个具体且困难的翻后局面：大盲位（BB）对抗有利位置玩家（IP），翻牌圈对手下注、我们过牌加注（check-raise）并被跟注后，转牌圈面对各类听牌时该如何决定是否继续下注（barrel）。讲师指出，此时我们处于不利位置，且范围呈极化特征，而对手范围非常强，因此频率决策至关重要。", "视频的核心内容是将转牌圈的听牌分为三类——两头顺听牌（open-ended）、卡顺听牌（gut shot）和组合听牌（combo draw），并分别给出对应的下注频率桶（frequency bucket）：两头顺60%、卡顺20%、组合听牌80%。讲师强调，即使是最强的两头顺听牌，也应有40%的过牌频率，而非无脑连开三枪。", "最后，讲师通过具体牌例展示了这些频率在实际手牌中的应用，包括哪些牌适合过牌加注、哪些牌适合过牌弃牌，并指出阻挡牌和具体组合会影响频率的微调，但总体框架清晰明确。该视频属于DGL系列中关于翻前单次加注底池（SRP）不利位置策略的专题讲解。"], "note": ""}, {"id": "DGL#46-s0", "ep": "46", "type": "topic", "topic": "DGL#46 - 翻前单次加注底池、不利位置：过牌加注后，转牌圈听牌的下注频率", "en": "PFC SRP OOP How Often to Barrel Draws XR - B Line", "q": "视频背景与局面定义", "clues": ["SRP", "check-raise", "barrel", "OOP"], "a": ["本视频讨论的场景为：翻前单次加注底池（SRP），大盲位（BB）对抗有利位置玩家（IP）。", "具体行动线为：翻牌圈对手下注，我们过牌加注（check-raise），对手跟注，转牌圈我们需要决定是否继续下注（barrel）。", "讲师指出，这是一个在无限注德州扑克中非常困难的局面：我们处于不利位置（OOP），范围呈极化（polarized）特征，而对手的范围非常强。", "在此局面中，我们最常持有的三类手牌恰好都是诈唬类听牌：两头顺听牌（open-ended）、卡顺听牌（gut shot）和组合听牌（combo draw）。"], "note": ""}, {"id": "DGL#46-s1", "ep": "46", "type": "topic", "topic": "DGL#46 - 翻前单次加注底池、不利位置：过牌加注后，转牌圈听牌的下注频率", "en": "PFC SRP OOP How Often to Barrel Draws XR - B Line", "q": "三类听牌的频率桶划分", "clues": ["bucket", "open-ended", "gut shot", "combo draw"], "a": ["讲师将转牌圈听牌分为三个频率桶（bucket）：60%桶、20%桶和80%桶，分别对应两头顺、卡顺和组合听牌。", "两头顺听牌（open-ended）归入60%桶：数据显示为59-41的跟注/下注比例，非常干净地落入60%桶。", "卡顺听牌（gut shot）归入20%桶：数据显示为25-75的下注/过牌比例，应极其被动地游戏。", "组合听牌（combo draw）归入80%桶：不出所料，因其权益最高，应最积极地继续下注。", "频率桶与权益直接相关：权益越高，下注频率越高；权益越低，过牌频率越高。"], "note": ""}, {"id": "DGL#46-s2", "ep": "46", "type": "topic", "topic": "DGL#46 - 翻前单次加注底池、不利位置：过牌加注后，转牌圈听牌的下注频率", "en": "PFC SRP OOP How Often to Barrel Draws XR - B Line", "q": "两头顺听牌的具体频率与牌例", "clues": ["GTO", "check-raise", "check-fold", "60%"], "a": ["两头顺听牌在转牌圈的下注频率为60%，过牌频率为40%。", "讲师强调，即使持有两头顺听牌，也应有40%的时间选择过牌，这看起来“疯狂”但却是GTO建议。", "牌例1：4♠3♠，翻牌面K♠5♦2♣，转牌Q♦。此牌为两头顺听牌（A和6是出路），讲师建议转牌圈过牌加注（check-raise），而非直接下注。", "讲师特别说明：过牌不代表过牌弃牌，我们仍会用很多此类手牌进行过牌加注。", "牌例2：Q♥J♦，翻牌面K♣T♦4♠，转牌6♥。此牌为两头顺听牌（A和9是出路），讲师建议转牌圈过牌加注。", "牌例3：8♣4♣，翻牌面T♦7♠6♥，转牌任意。此牌为两头顺听牌（5和9是出路），但讲师建议过牌弃牌（check-fold），因为牌面结构较差且阻挡牌不利。", "牌例4：T♦3♦，翻牌面J♣9♠8♦，转牌5♣。此牌为两头顺听牌（Q和7是出路），讲师建议过牌弃牌。", "牌例5：6♣5♣，翻牌面7♦4♠2♦，转牌T♣。此牌为两头顺听牌（8和3是出路），讲师建议过牌（check），而非下注。", "讲师总结：两头顺听牌在过牌加注被跟注后，转牌圈40%过牌、60%下注，除非有更多信息（如具体组合、花色、阻挡牌），否则按60%桶执行。"], "note": ""}, {"id": "DGL#46-s3", "ep": "46", "type": "topic", "topic": "DGL#46 - 翻前单次加注底池、不利位置：过牌加注后，转牌圈听牌的下注频率", "en": "PFC SRP OOP How Often to Barrel Draws XR - B Line", "q": "卡顺听牌的具体频率与牌例", "clues": ["barrel", "over card", "gut shot one", "20%"], "a": ["卡顺听牌在转牌圈的下注频率仅为20%，过牌频率高达80%。", "讲师强调，卡顺听牌应“极其极其被动”地游戏，过牌频率是下注频率的三倍以上。", "卡顺听牌只应被极不频繁地继续下注（barrel）。", "即使卡顺听牌带有一张高牌（over card），如“gut shot one over card”，也仍归入20%桶，不因额外权益而提升频率。", "讲师指出，卡顺听牌是三类听牌中最常见的，但也是最应谨慎对待的。"], "note": ""}, {"id": "DGL#46-s4", "ep": "46", "type": "topic", "topic": "DGL#46 - 翻前单次加注底池、不利位置：过牌加注后，转牌圈听牌的下注频率", "en": "PFC SRP OOP How Often to Barrel Draws XR - B Line", "q": "组合听牌的具体频率与牌例", "clues": ["80%", "20%"], "a": ["组合听牌在转牌圈的下注频率为80%，过牌频率为20%。", "组合听牌因其同时具备顺子听牌和同花听牌的权益，权益最高，因此下注频率最高。", "讲师强调，组合听牌归入80%桶，与权益成正比，无需额外说明。", "组合听牌是三类听牌中唯一应积极连开三枪的类别。"], "note": ""}, {"id": "DGL#46-s5", "ep": "46", "type": "topic", "topic": "DGL#46 - 翻前单次加注底池、不利位置：过牌加注后，转牌圈听牌的下注频率", "en": "PFC SRP OOP How Often to Barrel Draws XR - B Line", "q": "频率桶的微调因素", "clues": ["blockers", "60%", "20%", "80%"], "a": ["讲师指出，60%桶（两头顺）可以基于具体组合、花色、阻挡牌（blockers）等因素上下微调。", "例如，持有阻挡牌（如对手可能持有的坚果同花听牌中的关键牌）时，可适当提高下注频率。", "但总体框架不变：两头顺60%、卡顺20%、组合听牌80%。", "讲师提醒，这些频率是全局基准，实际游戏中需结合对手倾向和具体牌面结构进行调整。"], "note": ""}, {"id": "DGL#46-s6", "ep": "46", "type": "topic", "topic": "DGL#46 - 翻前单次加注底池、不利位置：过牌加注后，转牌圈听牌的下注频率", "en": "PFC SRP OOP How Often to Barrel Draws XR - B Line", "q": "常见错误与误区", "clues": ["barrel", "GTO", "80%", "40%"], "a": ["常见错误1：无脑对所有听牌连续下注（barrel），忽视频率桶的差异。", "常见错误2：对卡顺听牌过度激进，实际上应80%过牌。", "常见错误3：对两头顺听牌过度激进，实际上应有40%的过牌频率。", "常见错误4：将过牌等同于过牌弃牌，实际上过牌后仍可进行过牌加注。", "讲师强调，频率桶是GTO基准，偏离需有明确理由（如剥削对手或特定牌面结构）。"], "note": ""}, {"id": "DGL#46-c1", "ep": "46", "type": "cloze", "topic": "DGL#46 - 翻前单次加注底池、不利位置：过牌加注后，转牌圈听牌的下注频率", "en": "PFC SRP OOP How Often to Barrel Draws XR - B Line", "q": "讲师将转牌圈听牌分为三个频率桶（bucket）：＿＿桶、20%桶和80%桶，", "clues": [], "a": ["讲师将转牌圈听牌分为三个频率桶（bucket）：60%桶、20%桶和80%桶，分别对应两头顺、卡顺和组合听牌。"], "note": "60%"}, {"id": "DGL#46-c2", "ep": "46", "type": "cloze", "topic": "DGL#46 - 翻前单次加注底池、不利位置：过牌加注后，转牌圈听牌的下注频率", "en": "PFC SRP OOP How Often to Barrel Draws XR - B Line", "q": "两头顺听牌在转牌圈的下注频率为＿＿，过牌频率为40%。", "clues": [], "a": ["两头顺听牌在转牌圈的下注频率为60%，过牌频率为40%。"], "note": "60%"}, {"id": "DGL#46-c3", "ep": "46", "type": "cloze", "topic": "DGL#46 - 翻前单次加注底池、不利位置：过牌加注后，转牌圈听牌的下注频率", "en": "PFC SRP OOP How Often to Barrel Draws XR - B Line", "q": "卡顺听牌在转牌圈的下注频率仅为＿＿，过牌频率高达80%。", "clues": [], "a": ["卡顺听牌在转牌圈的下注频率仅为20%，过牌频率高达80%。"], "note": "20%"}, {"id": "DGL#46-note", "ep": "46", "type": "note", "topic": "DGL#46 - 翻前单次加注底池、不利位置：过牌加注后，转牌圈听牌的下注频率", "en": "PFC SRP OOP How Often to Barrel Draws XR - B Line", "q": "避坑提醒与行动项", "clues": ["DGL", "SRP", "fold equity"], "a": ["本视频是DGL系列第46期，聚焦于翻前单次加注底池（SRP）中，大盲位过牌加注后转牌圈的听牌频率决策。该系列此前可能已讲解过翻牌圈的过牌加注范围构建，本视频则进一步深入转牌圈的延续下注策略，属于该系列中关于不利位置极化范围游戏的进阶内容。", "值得进一步学习的方向包括：如何根据具体翻牌面结构（如湿润度、连张性）调整频率桶；如何利用阻挡牌和组合计数优化具体手牌决策；以及如何在实际对局中结合对手的弃牌率（fold equity）和跟注范围进行剥削性调整。建议结合GTO求解器（如PioSOLVER）自行验证这些频率，并观察不同筹码深度下的变化。", "**行动项（应做/不应做）**：", "- 应做：两头顺听牌在转牌圈60%下注、40%过牌；组合听牌80%下注、20%过牌。", "- 应做：卡顺听牌在转牌圈80%过牌、20%下注，即使带高牌也保持被动。", "- 应做：过牌后仍可过牌加注，不要将过牌等同于放弃底池。", "- 不应做：对所有听牌统一频率连续下注，忽视类别差异。", "- 不应做：对卡顺听牌过度激进，对两头顺听牌无脑连开三枪。"], "note": ""}, {"id": "DGL#47-intro", "ep": "47", "type": "intro", "topic": "DGL#47 手牌复盘：3-bet底池中的翻牌圈持续下注启发式策略", "en": "Hand Review 3Bet Pots - Flop Cbet Heuristics", "q": "DGL#47 手牌复盘：3-bet底池中的翻牌圈持续下注启发式策略", "clues": ["DGL", "bet", "solver"], "a": ["本视频是DGL系列第47期，聚焦于3-bet底池中翻牌圈持续下注（c-bet）的启发式策略。讲师通过求解器（solver）模拟，对比了Q-9-7和Q-9-5两种翻牌面，揭示了在单一尺度策略下，最优下注尺度应为半池（half pot）而非多数玩家习惯使用的小尺度（如1/3 pot）。视频核心在于建立“手牌类别频率启发式”框架，并强调根据组合特性（如阻挡牌）对基础频率进行微调。", "讲师指出，在Q-9-5这类翻牌面上，半池下注应覆盖约70%的范围。中等口袋对子（如口袋6）需要提高下注频率，而口袋J、口袋T等中等强度牌型则需降低频率。同时，为了构建合理的过牌范围，需要将顶set（如口袋Q）和部分顶对（如AQ、KQ）纳入过牌-加注或慢玩策略中，这取决于具体组合的阻挡牌属性。", "视频强调，在复杂翻牌面上，约90%的范围都应以混合策略（mixed strategy）进行游戏，极少有纯策略组合。因此，掌握范围整体下注频率的基线（如70-30）至关重要，玩家应以该基线为起点，根据具体组合的阻挡牌、坚果潜力等特性进行上下调整，而非机械地执行固定策略。"], "note": ""}, {"id": "DGL#47-s0", "ep": "47", "type": "topic", "topic": "DGL#47 手牌复盘：3-bet底池中的翻牌圈持续下注启发式策略", "en": "Hand Review 3Bet Pots - Flop Cbet Heuristics", "q": "翻牌面选择与求解器对比", "clues": ["bet", "half pot", "set", "70%"], "a": ["视频分析两个翻牌面：Q-9-7和Q-9-5，均来自3-bet底池场景。", "求解器结果显示，在单一尺度策略下，最高EV（期望值）的下注尺度是半池（half pot），而非多数玩家使用的小尺度（如1/3 pot）。", "Q-9-5翻牌面中，口袋7构成set（暗三条），该牌面下求解器建议以约70%的范围频率进行半池下注。", "若玩家希望采用单一尺度策略，应选择半池下注，并覆盖约70%的范围。"], "note": ""}, {"id": "DGL#47-s1", "ep": "47", "type": "topic", "topic": "DGL#47 手牌复盘：3-bet底池中的翻牌圈持续下注启发式策略", "en": "Hand Review 3Bet Pots - Flop Cbet Heuristics", "q": "手牌类别频率调整", "clues": ["set", "check"], "a": ["口袋7（set）在Q-9-5翻牌面上采用混合策略，但下注频率较低。", "口袋6（较弱对子）的下注频率显著提高，因为其需要保护权益并获取价值。", "口袋J和口袋T（中等强度对子）的下注频率降低，因为半池尺度下这些牌型的价值密度不足。", "口袋Q（顶set）部分频率选择慢玩（check），以构建合理的过牌范围，避免范围过于极化。"], "note": ""}, {"id": "DGL#47-s2", "ep": "47", "type": "topic", "topic": "DGL#47 手牌复盘：3-bet底池中的翻牌圈持续下注启发式策略", "en": "Hand Review 3Bet Pots - Flop Cbet Heuristics", "q": "阻挡牌与下注频率的关联", "clues": ["bucket", "80%", "60%", "40%"], "a": ["AQ组合：除非持有A♣（阻挡对手的草花同花听牌跟注范围），否则通常进入80%下注频率的“桶”（bucket）。", "KQ组合：除非持有K♠（阻挡对手的坚果同花听牌），否则通常进入60%下注频率的桶。", "QJ组合：通常进入80%下注频率的桶。", "QT组合：在40%和60%两个频率桶之间混合。", "弱顶对（如Qx）需要保留一定百分比的过牌频率，以平衡过牌范围。"], "note": ""}, {"id": "DGL#47-s3", "ep": "47", "type": "topic", "topic": "DGL#47 手牌复盘：3-bet底池中的翻牌圈持续下注启发式策略", "en": "Hand Review 3Bet Pots - Flop Cbet Heuristics", "q": "手牌类别频率启发式框架", "clues": ["set"], "a": ["课程中已建立“手牌类别频率启发式”作为基础基线，玩家需根据组合特性（如阻挡牌、坚果潜力）进行调整。", "若持有顶set且采用半池下注，由于阻挡了对手的跟注范围（对手难以有强牌），应至少将下注频率下调一个“桶”（即降低频率）。", "当进行大尺度价值下注时，应避免持有阻挡对手跟注范围的牌型，否则会降低被跟注的频率，损害EV。"], "note": ""}, {"id": "DGL#47-s4", "ep": "47", "type": "topic", "topic": "DGL#47 手牌复盘：3-bet底池中的翻牌圈持续下注启发式策略", "en": "Hand Review 3Bet Pots - Flop Cbet Heuristics", "q": "混合策略与范围基线", "clues": ["90%"], "a": ["在Q-9-5这类翻牌面上，约90%的范围都采用混合策略（即同一组合在不同频率下选择下注或过牌）。", "纯策略组合极少，仅包括口袋K、口袋A，以及部分KJ、特定花色的AQ。", "掌握范围整体的下注频率基线（如70-30）至关重要，玩家应以该基线为起点，根据具体组合的阻挡牌、坚果潜力等特性进行上下调整，而非机械地执行固定策略。"], "note": ""}, {"id": "DGL#47-c0", "ep": "47", "type": "cloze", "topic": "DGL#47 手牌复盘：3-bet底池中的翻牌圈持续下注启发式策略", "en": "Hand Review 3Bet Pots - Flop Cbet Heuristics", "q": "该牌面下求解器建议以约＿＿的范围频率进行半池下注。", "clues": [], "a": ["Q-9-5翻牌面中，口袋7构成set（暗三条），该牌面下求解器建议以约70%的范围频率进行半池下注。"], "note": "70%"}, {"id": "DGL#47-c2", "ep": "47", "type": "cloze", "topic": "DGL#47 手牌复盘：3-bet底池中的翻牌圈持续下注启发式策略", "en": "Hand Review 3Bet Pots - Flop Cbet Heuristics", "q": "否则通常进入＿＿下注频率的“桶”（bucket）。", "clues": [], "a": ["AQ组合：除非持有A♣（阻挡对手的草花同花听牌跟注范围），否则通常进入80%下注频率的“桶”（bucket）。"], "note": "80%"}, {"id": "DGL#47-c4", "ep": "47", "type": "cloze", "topic": "DGL#47 手牌复盘：3-bet底池中的翻牌圈持续下注启发式策略", "en": "Hand Review 3Bet Pots - Flop Cbet Heuristics", "q": "约＿＿的范围都采用混合策略（即同一组合在不同频率下选择下注或过牌）。", "clues": [], "a": ["在Q-9-5这类翻牌面上，约90%的范围都采用混合策略（即同一组合在不同频率下选择下注或过牌）。"], "note": "90%"}, {"id": "DGL#47-note", "ep": "47", "type": "note", "topic": "DGL#47 手牌复盘：3-bet底池中的翻牌圈持续下注启发式策略", "en": "Hand Review 3Bet Pots - Flop Cbet Heuristics", "q": "避坑提醒与行动项", "clues": ["DGL", "bet", "turn"], "a": ["本视频是DGL系列中关于3-bet底池翻牌圈策略的专题讲解，承接了课程中“手牌类别频率启发式”的理论框架，并将其应用于具体翻牌面的求解器分析。视频强调，玩家不应盲目模仿求解器的混合策略，而应理解其背后的逻辑——即通过阻挡牌和范围构建来优化EV。后续可进一步学习转牌圈（turn）和河牌圈（river）的尺度选择与范围调整，以及如何在不同筹码深度下应用这些启发式。", "**行动项与常见错误：**", "- 应该做：在Q-9-5类翻牌面上，优先考虑半池下注，而非小尺度（如1/3 pot）。", "- 应该做：以范围整体下注频率（如70%）为基线，再根据具体组合的阻挡牌属性进行上下调整。", "- 应该做：构建过牌范围时，纳入顶set和部分强顶对（如AQ、KQ），以平衡范围。", "- 不要做：持有顶set时盲目高频下注，应降低频率以避免阻挡对手跟注范围。", "- 不要做：忽略组合的阻挡牌属性，机械地执行固定频率策略。"], "note": ""}, {"id": "DGL#48-intro", "ep": "48", "type": "intro", "topic": "DGL#48 - 转牌圈下注目标与无差别化启发式策略", "en": "Turn Play Targeting and Indifference Heuristics", "q": "DGL#48 - 转牌圈下注目标与无差别化启发式策略", "clues": ["targeting"], "a": ["本视频聚焦于转牌圈下注尺度的选择逻辑，核心概念是“目标定位”（targeting）——即通过下注尺度让对手范围中的特定牌型处于零EV（无差别化）状态。讲师强调，下注尺度的选择应基于你想要针对的对手牌型，而非机械套用固定尺度。", "视频通过一个3-bet底池的具体牌面案例，演示了如何分析不同下注尺度（小注、中等注、大注）分别针对哪些牌型，以及如何结合自身范围能力做出最优选择。讲师还展示了PioSolver的优化结果，并提炼出关于配对牌转牌圈下注频率与慢玩频率的重要启发式结论。"], "note": ""}, {"id": "DGL#48-s0", "ep": "48", "type": "topic", "topic": "DGL#48 - 转牌圈下注目标与无差别化启发式策略", "en": "Turn Play Targeting and Indifference Heuristics", "q": "目标定位的核心思想", "clues": [], "a": ["下注尺度的选择应始于一个核心问题：我想针对对手范围中的哪些牌型？目标是让这些牌型在面对我的下注时处于零EV（无差别化）状态。", "下注尺度是实现目标定位的最佳工具，不同尺度对应不同的目标牌型区间，需要根据对手范围的构成来反向推导。"], "note": ""}, {"id": "DGL#48-s1", "ep": "48", "type": "topic", "topic": "DGL#48 - 转牌圈下注目标与无差别化启发式策略", "en": "Turn Play Targeting and Indifference Heuristics", "q": "小注尺度的目标牌型", "clues": [], "a": ["小注（如1/3底池）主要针对A-K组合，因为低对子（如口袋对子7、8）大概率会纯跟注，虽然面对小注时可能开始变得无差别化。", "口袋对子7和口袋对子8可能太强，面对小注时不会完全无差别化，因此小注的核心目标仍是A-K组合。"], "note": ""}, {"id": "DGL#48-s2", "ep": "48", "type": "topic", "topic": "DGL#48 - 转牌圈下注目标与无差别化启发式策略", "en": "Turn Play Targeting and Indifference Heuristics", "q": "中注与大注尺度的目标", "clues": [], "a": ["若选择更大尺度（如3/4底池），目标应转向更强的牌型，如口袋对子10和口袋对子J。", "若再提升一个级别，可以尝试针对Q-X牌型，但讲师认为这并不理想——因为这会让你自己的价值牌很难获得支付，且你的范围中需要拥有超宽的价值区域才能支撑这种策略。"], "note": ""}, {"id": "DGL#48-s3", "ep": "48", "type": "topic", "topic": "DGL#48 - 转牌圈下注目标与无差别化启发式策略", "en": "Turn Play Targeting and Indifference Heuristics", "q": "目标定位与范围能力的匹配", "clues": [], "a": ["目标定位必须与自身范围的能力相匹配：如果你想针对高价值牌型，但你的范围并不具备足够的强牌支撑，那就不是最优策略。", "在本案例中，讲师建议使用介于1/3底池到2/3底池之间的尺度，因为A-K、低对子、J和10都是值得针对的目标区域，且自身范围拥有足够的强牌来支撑这些目标。"], "note": ""}, {"id": "DGL#48-s4", "ep": "48", "type": "topic", "topic": "DGL#48 - 转牌圈下注目标与无差别化启发式策略", "en": "Turn Play Targeting and Indifference Heuristics", "q": "PioSolver的优化结果", "clues": ["PioSolver", "Control H"], "a": ["在具体牌面（配对牌转牌）上，PioSolver算法选择了3/4底池的下注尺度。", "通过PioSolver的“Control H”功能，可以同时查看多个转牌牌面的策略：仅在红桃5和黑桃5这两张转牌上优化使用3/4底池尺度，其他转牌则更倾向于极化，使用几何尺度（1.2倍底池）。"], "note": ""}, {"id": "DGL#48-s5", "ep": "48", "type": "topic", "topic": "DGL#48 - 转牌圈下注目标与无差别化启发式策略", "en": "Turn Play Targeting and Indifference Heuristics", "q": "配对牌转牌的启发式结论", "clues": ["polarized", "80%", "70%"], "a": ["在大多数转牌牌面上，策略应更极化（polarized），使用更大的几何尺度；但在配对牌转牌上，缩小尺度是合理的，尽管使用频率较低。", "即使使用3/4底池尺度，也需要大量慢玩强牌（如9x和5x），频率分别约为80%和70%——这意味着对手过牌时，其范围远比理论均衡弱得多。"], "note": ""}, {"id": "DGL#48-s6", "ep": "48", "type": "topic", "topic": "DGL#48 - 转牌圈下注目标与无差别化启发式策略", "en": "Turn Play Targeting and Indifference Heuristics", "q": "剥削性结论与常见错误", "clues": ["bet", "over-fold", "under-raise", "80%"], "a": ["在3-bet底池中，作为有利位置玩家，如果对手在转牌过牌，他们并没有慢玩80%的9x或70%的5x，也没有慢玩一半的A-Q——这意味着他们的过牌范围非常弱。", "大多数玩家会过度弃牌（over-fold）且对延迟下注的加注不足（under-raise），因为维持这种平衡范围极其困难。", "常见错误：试图针对Q-X牌型下大注，导致价值牌难以获得支付；以及在配对牌转牌上过度下注，而未能充分利用对手范围的明显弱点。"], "note": ""}, {"id": "DGL#48-c5", "ep": "48", "type": "cloze", "topic": "DGL#48 - 转牌圈下注目标与无差别化启发式策略", "en": "Turn Play Targeting and Indifference Heuristics", "q": "频率分别约为＿＿和70%——这意味着对手过牌时，其范围远比理论均衡弱得多。", "clues": [], "a": ["即使使用3/4底池尺度，也需要大量慢玩强牌（如9x和5x），频率分别约为80%和70%——这意味着对手过牌时，其范围远比理论均衡弱得多。"], "note": "80%"}, {"id": "DGL#48-c6", "ep": "48", "type": "cloze", "topic": "DGL#48 - 转牌圈下注目标与无差别化启发式策略", "en": "Turn Play Targeting and Indifference Heuristics", "q": "他们并没有慢玩＿＿的9x或70%的5x，也没有慢玩一半的A-Q——这意味着他们的过牌范围非常弱。", "clues": [], "a": ["在3-bet底池中，作为有利位置玩家，如果对手在转牌过牌，他们并没有慢玩80%的9x或70%的5x，也没有慢玩一半的A-Q——这意味着他们的过牌范围非常弱。"], "note": "80%"}, {"id": "DGL#48-note", "ep": "48", "type": "note", "topic": "DGL#48 - 转牌圈下注目标与无差别化启发式策略", "en": "Turn Play Targeting and Indifference Heuristics", "q": "避坑提醒与行动项", "clues": ["DGL", "PioSolver"], "a": ["本视频是DGL系列第48期，延续了讲师在视频蓝图课程第一课中提出的“目标定位”框架，并将其应用于转牌圈的具体决策场景。视频强调理论与实践的结合——先通过逻辑推导确定目标牌型，再用PioSolver验证并提炼可迁移的启发式规则。", "值得进一步学习的方向包括：不同转牌牌面结构（如顺子完成、同花完成）对下注尺度选择的影响，以及如何利用对手在配对牌转牌上的过牌范围弱点进行剥削性下注。", "- 应该这样做：先明确下注的目标牌型，再选择匹配的尺度；在配对牌转牌上适当缩小尺度，并大量慢玩强牌。", "- 不要这样做：不要试图针对Q-X牌型下大注；不要假设对手在转牌过牌时范围均衡——实际上他们远弱于理论标准。"], "note": ""}, {"id": "DGL#49-intro", "ep": "49", "type": "intro", "topic": "DGL#49 - 四人底池中翻前不利位置玩家在翻牌圈的过牌加注策略", "en": "4BP OOP PFC Check-Raising on the Flop", "q": "DGL#49 - 四人底池中翻前不利位置玩家在翻牌圈的过牌加注策略", "clues": ["bet pot", "OOP", "check-raise"], "a": ["本视频聚焦于四人底池（4-bet pot）中，翻前不利位置（OOP）玩家在面对对手约1/4底池大小的持续下注（c-bet）时，应如何制定过牌加注（check-raise）策略。讲师首先通过GTO求解器估算理论上的最优过牌加注频率，再结合数据库报告对比实际玩家（尤其是低 stakes 玩家）的行为偏差，最后给出针对性的剥削调整建议。", "视频的核心观点是：求解器给出的范围在深度节点（deep node）场景下对实战指导意义有限，真正重要的是准确读取对手范围并据此调整基线策略。讲师通过具体数据（如22%、24.5%、28%等过牌加注频率）展示了理论频率与实际玩家行为之间的差距，并指出在低牌面结构上，低 stakes 玩家往往过度过牌加注，而高 stakes 玩家则相对更接近理论值。", "视频还探讨了翻前范围调整对翻后策略的连锁影响，包括范围下注（range bet）的应对、过牌加注范围的扩展以及利用对手弃牌不足（under-jamming）来获取额外弃牌权益（fold equity）等高级剥削思路。"], "note": ""}, {"id": "DGL#49-s0", "ep": "49", "type": "topic", "topic": "DGL#49 - 四人底池中翻前不利位置玩家在翻牌圈的过牌加注策略", "en": "4BP OOP PFC Check-Raising on the Flop", "q": "理论过牌加注频率估算", "clues": ["GTO", "OOP", "low textures", "high"], "a": ["在GTO框架下，面对1/4底池大小的下注，OOP玩家在翻牌圈的过牌加注频率约为22%。这是基于求解器对标准范围的计算结果。", "通过数据库报告（数据子集包含47个翻牌面），可以看到OOP玩家（小盲位对关位）的过牌频率为24.5%，这是对较小下注尺度的平均应对频率。", "过牌加注频率会根据翻牌面结构（texture）进行调整：低牌面（low textures）通常需要更多过牌加注，高牌面（high-card textures）则相对较少，但A高牌面（A-high）除外，这类牌面可以有相当多的过牌加注。", "平均而言，过牌加注频率约为25%，这是OOP玩家在面对小注下注时的基准参考值。"], "note": ""}, {"id": "DGL#49-s1", "ep": "49", "type": "topic", "topic": "DGL#49 - 四人底池中翻前不利位置玩家在翻牌圈的过牌加注策略", "en": "4BP OOP PFC Check-Raising on the Flop", "q": "翻前范围调整", "clues": ["OOP", "tight", "A5o", "A3s"], "a": ["讲师对OOP玩家的翻前范围进行了调整，以更贴近紧凶型（tight）玩家的实际行为：移除了A5o（非同花A5）、大部分6x和7x组合、部分同花连牌（suited connectors）以及A3s（同花A3）。", "同时减少了KTs（同花KT）和部分口袋对子（如44）的跟注频率，认为紧手玩家在这些区域会过度弃牌（over fold）。", "相应地，IP玩家（按钮位）的范围被扩展，增加了更多诈唬组合，例如AK现在以100%频率进入翻牌圈。", "翻前范围的这些调整会直接影响翻后策略：当OOP范围变紧、IP范围变弱时，IP玩家应该采用范围下注（range bet）策略，而OOP玩家则应更被动地应对。"], "note": ""}, {"id": "DGL#49-s2", "ep": "49", "type": "topic", "topic": "DGL#49 - 四人底池中翻前不利位置玩家在翻牌圈的过牌加注策略", "en": "4BP OOP PFC Check-Raising on the Flop", "q": "翻后策略连锁反应", "clues": ["OOP", "donk bet", "GTO", "fast play"], "a": ["当IP玩家采用范围下注策略时，OOP玩家的自然反应是增加过牌频率——数据显示OOP玩家过牌频率达到62%，同时出现大量反主动下注（donk bet）。", "讲师强调，如果翻前已经进行了剥削性调整，翻后策略也应相应调整，不能机械地套用GTO基线策略。", "面对1/4底池的持续下注，OOP玩家应过牌加注22%的频率，这是一个相当可观的加注频率。", "值得注意的是，像QQ和JJ这样的强牌，OOP玩家在翻牌圈就会快速行动（fast play），而不是慢打，这为后续回合的决策奠定了基础。"], "note": ""}, {"id": "DGL#49-s3", "ep": "49", "type": "topic", "topic": "DGL#49 - 四人底池中翻前不利位置玩家在翻牌圈的过牌加注策略", "en": "4BP OOP PFC Check-Raising on the Flop", "q": "求解器在深度节点中的局限", "clues": ["fold equity", "double barrel", "check and give"], "a": ["讲师指出，在深度节点（如转牌、河牌）场景下，求解器范围对实战指导意义有限，因为对手几乎不可能以接近求解器的范围到达这些节点。", "实战中真正重要的是读取对手范围的能力——能否比对手更准确地判断对方范围，以及对手是如何到达当前局面的。", "求解器仍然有用，但应作为基线策略的参考，需要根据对对手风格的感知进行调整。", "例如，如果认为对手在转牌圈不会有足够的全下权益（fold equity），那么要么选择双重下注（double barrel），要么选择过牌放弃（check and give up），因为很多诈唬手牌需要依靠转牌权益来证明诈唬的合理性。"], "note": ""}, {"id": "DGL#49-s4", "ep": "49", "type": "topic", "topic": "DGL#49 - 四人底池中翻前不利位置玩家在翻牌圈的过牌加注策略", "en": "4BP OOP PFC Check-Raising on the Flop", "q": "实际玩家行为数据对比", "clues": ["stakes", "OOP", "rags", "donk bet"], "a": ["通过数据库对比低 stakes 玩家与高 stakes 玩家在4-bet底池、OOP位置、低牌面（非对子）上的过牌加注频率：", "低 stakes 玩家（rags）在低牌面上过牌加注频率高达28%，可能过度加注。", "高 stakes 玩家为19%，虽然低于求解器的24.5%阈值，但整体更接近理论值。", "低 stakes 玩家在低牌面上的过度过牌加注，部分原因是他们在面对下注时没有足够多地采用反主动下注（donk bet），导致加注频率被人为抬高。", "这一数据表明，针对低 stakes 对手，OOP玩家可以预期对手在低牌面上会过度加注，从而调整自己的应对策略。"], "note": ""}, {"id": "DGL#49-s5", "ep": "49", "type": "topic", "topic": "DGL#49 - 四人底池中翻前不利位置玩家在翻牌圈的过牌加注策略", "en": "4BP OOP PFC Check-Raising on the Flop", "q": "剥削性调整策略", "clues": ["OOP", "under-jamming", "fold equity", "range bet"], "a": ["如果认为对手会过度过牌加注（尤其是在低牌面上），OOP玩家可以大幅扩展自己的过牌加注范围，利用对手的过度激进获取价值。", "讲师认为大多数玩家不会足够频繁地全下（jam），因此像AK这样的牌可以全下，而口袋对子99对很多人来说也很难全下——这意味着IP玩家可以从对手弃牌不足（under-jamming）中获得额外的弃牌权益（fold equity）。", "面对范围下注（range bet）策略，OOP玩家应大幅提高过牌加注频率，数据显示接近80%的过牌加注频率是合理的应对方式。", "这些调整的核心逻辑是：当对手的策略偏离GTO时，通过针对性的范围调整来最大化自己的期望值（EV）。"], "note": ""}, {"id": "DGL#49-c0", "ep": "49", "type": "cloze", "topic": "DGL#49 - 四人底池中翻前不利位置玩家在翻牌圈的过牌加注策略", "en": "4BP OOP PFC Check-Raising on the Flop", "q": "OOP玩家在翻牌圈的过牌加注频率约为＿＿。这是基于求解器对标准范围的计算结果。", "clues": [], "a": ["在GTO框架下，面对1/4底池大小的下注，OOP玩家在翻牌圈的过牌加注频率约为22%。这是基于求解器对标准范围的计算结果。"], "note": "22%"}, {"id": "DGL#49-c1", "ep": "49", "type": "cloze", "topic": "DGL#49 - 四人底池中翻前不利位置玩家在翻牌圈的过牌加注策略", "en": "4BP OOP PFC Check-Raising on the Flop", "q": "增加了更多诈唬组合，例如AK现在以＿＿频率进入翻牌圈。", "clues": [], "a": ["相应地，IP玩家（按钮位）的范围被扩展，增加了更多诈唬组合，例如AK现在以100%频率进入翻牌圈。"], "note": "100%"}, {"id": "DGL#49-c2", "ep": "49", "type": "cloze", "topic": "DGL#49 - 四人底池中翻前不利位置玩家在翻牌圈的过牌加注策略", "en": "4BP OOP PFC Check-Raising on the Flop", "q": "OOP玩家的自然反应是增加过牌频率——数据显示OOP玩家过牌频率达到＿＿，", "clues": [], "a": ["当IP玩家采用范围下注策略时，OOP玩家的自然反应是增加过牌频率——数据显示OOP玩家过牌频率达到62%，同时出现大量反主动下注（donk bet）。"], "note": "62%"}, {"id": "DGL#49-note", "ep": "49", "type": "note", "topic": "DGL#49 - 四人底池中翻前不利位置玩家在翻牌圈的过牌加注策略", "en": "4BP OOP PFC Check-Raising on the Flop", "q": "避坑提醒与行动项", "clues": ["DGL", "OOP", "stakes"], "a": ["本视频是DGL系列第49期，聚焦于四人底池中翻前不利位置玩家的翻牌圈过牌加注策略。视频承接了系列中关于翻前范围构建和翻后策略制定的内容，并进一步深入到剥削性调整的实战应用层面。讲师通过求解器、数据库报告和实战经验三者的结合，展示了从理论到实战的完整思考路径。", "值得进一步学习的方向包括：不同翻牌面结构（如A高、对子面、连牌面）下的过牌加注频率差异、转牌圈和河牌圈的后续策略制定、以及如何针对不同玩家类型（紧手、松手、被动、激进）进行更精细的范围调整。", "**行动项与常见错误：**", "- 应做：面对1/4底池下注时，OOP玩家应保持约22%-25%的过牌加注频率，并根据翻牌面结构进行调整。", "- 应做：在低牌面上，如果对手是低 stakes 玩家且倾向于过度过牌加注，应扩展自己的过牌加注范围以利用对手的偏差。", "- 应做：翻前进行剥削性范围调整后，翻后策略也应相应调整，不能机械套用GTO基线。", "- 不应做：不要假设对手会以接近求解器的范围到达转牌或河牌，应基于对对手实际范围的读取来决策。", "- 不应做：不要忽视反主动下注（donk bet）在低牌面上的作用，这会影响过牌加注频率的合理性。"], "note": ""}, {"id": "DGL#50-intro", "ep": "50", "type": "intro", "topic": "DGL#50 - 翻前单次加注底池中IP位大盲注在过牌-过牌线路中的启发式策略", "en": "PFC SRP IP Big Blind Heuristics in X-X Line - BvB", "q": "DGL#50 - 翻前单次加注底池中IP位大盲注在过牌-过牌线路中的启发式策略", "clues": ["PFC SRP", "OOP", "sim"], "a": ["本视频聚焦于翻前单次加注底池（PFC SRP）中，大盲注（BB）在翻牌圈处于不利位置（OOP）且面对对手过牌后的下注决策。讲师通过模拟器（sim）数据，重点展示了在特定牌面结构下，大盲注必须在其下注范围中纳入大量纯空气牌（complete air）以维持平衡，并给出了具体的下注频率与手牌示例。", "视频强调，GTO策略应作为所有剥削性策略的基线。讲师指出，大多数玩家在实际游戏中存在系统性偏差：过度弃牌、加注不足、过快地游戏强牌和听牌，同时未能足够频繁地用空气牌下注。这些偏差会导致玩家在后续街（转牌、河牌）的范围严重变形，从而被剥削。", "最后，讲师通过对比模拟器中的最优频率与人类玩家的典型行为，揭示了“看似对手在过度弃牌”的深层原因——其到达当前街的范围本身就已因前期策略失误而扭曲，而非单纯是当前街的决策错误。这为玩家提供了构建策略和识别对手漏洞的重要视角。"], "note": ""}, {"id": "DGL#50-s0", "ep": "50", "type": "topic", "topic": "DGL#50 - 翻前单次加注底池中IP位大盲注在过牌-过牌线路中的启发式策略", "en": "PFC SRP IP Big Blind Heuristics in X-X Line - BvB", "q": "空气牌下注的必要性", "clues": ["bucket", "40%", "20%"], "a": ["在翻牌圈面对对手过牌时，大盲注必须在其下注范围中包含纯空气牌（无对子、无听牌的手牌），这是维持范围平衡的基础。", "本视频展示的特定牌面（未明确具体翻牌，但涉及同花听牌与顺子听牌结构）中，空气牌应放入40%的下注频率档位（40% bucket），而非其他牌面常见的20%档位。", "具体空气牌示例：J♥6♥、J♦6♦、J♠5♠、9♠5♠、9♥5♥——这些手牌应以40%的频率下注，以实现平衡。", "讲师强调：“你需要用这些手牌进入下注范围，在本例中40%的时间下注以保持平衡。”这是许多玩家容易忽略的关键点。"], "note": ""}, {"id": "DGL#50-s1", "ep": "50", "type": "topic", "topic": "DGL#50 - 翻前单次加注底池中IP位大盲注在过牌-过牌线路中的启发式策略", "en": "PFC SRP IP Big Blind Heuristics in X-X Line - BvB", "q": "GTO作为策略基线", "clues": ["GTO", "stab", "40%"], "a": ["讲师明确主张：“基线应该是GTO”，即使大多数时候玩家并不试图完全按照GTO打牌。", "在翻牌圈，有时需要采取平衡策略以保持范围在后续街（转牌、河牌）的合理性；但更多时候，玩家会采用“最小剥削”或“最大剥削”策略。", "关键逻辑：先建立GTO基线，然后在此基础上构建剥削性策略。没有基线，剥削策略就失去了参照系。", "面对一个能够正确跟注、足够频繁加注的平衡型对手，玩家应当已经用40%的纯空气牌进行下注（stab）。"], "note": ""}, {"id": "DGL#50-s2", "ep": "50", "type": "topic", "topic": "DGL#50 - 翻前单次加注底池中IP位大盲注在过牌-过牌线路中的启发式策略", "en": "PFC SRP IP Big Blind Heuristics in X-X Line - BvB", "q": "对手（BB）的防守范围要求", "clues": ["check-call"], "a": ["面对下注，对手（此处指翻前加注者）需要用大量A高牌和几乎所有对子进行过牌-跟注（check-call），不能轻易弃掉对子。", "这一要求的前提是对手在翻牌圈已经做到了“平衡过牌”（即过牌范围本身是平衡的）。", "讲师指出：“这是大多数人无法正确做到的”——大多数玩家在翻牌圈的过牌范围已经失衡，导致后续防守出现系统性漏洞。"], "note": ""}, {"id": "DGL#50-s3", "ep": "50", "type": "topic", "topic": "DGL#50 - 翻前单次加注底池中IP位大盲注在过牌-过牌线路中的启发式策略", "en": "PFC SRP IP Big Blind Heuristics in X-X Line - BvB", "q": "顶对以上牌力的频率分配", "clues": ["GTO", "trips", "baby flushes", "one high card"], "a": ["GTO要求对手用顶三条及更好牌力（trips+）进行50-50的过牌-加注/下注与过牌-跟注拆分。", "具体示例：小同花（baby flushes）几乎纯过牌；三条组合约一半时间过牌；一张高牌一张小牌的同花（one high card one little card flushes）也是50-50拆分。", "讲师强调：“几乎没有人能做到这些频率。”大多数玩家会过度快打（fast play）强牌，导致过牌范围变弱。"], "note": ""}, {"id": "DGL#50-s4", "ep": "50", "type": "topic", "topic": "DGL#50 - 翻前单次加注底池中IP位大盲注在过牌-过牌线路中的启发式策略", "en": "PFC SRP IP Big Blind Heuristics in X-X Line - BvB", "q": "听牌的快打与慢打", "clues": ["GTO", "nut flush draw"], "a": ["对于非A高同花听牌（如K高听牌），GTO建议几乎全部快打（下注或加注）。", "而A高同花听牌（nut flush draw）则应以过牌-跟注为主，因为其摊牌价值较高。", "具体示例：A♦3♦、A♣6♣这类低张A高同花听牌，至少有时应该下注，但很多玩家会过度快打这些牌。", "典型人类错误：过度快打强牌和听牌，同时空气牌下注不足。"], "note": ""}, {"id": "DGL#50-s5", "ep": "50", "type": "topic", "topic": "DGL#50 - 翻前单次加注底池中IP位大盲注在过牌-过牌线路中的启发式策略", "en": "PFC SRP IP Big Blind Heuristics in X-X Line - BvB", "q": "空气牌下注频率的补充数据", "clues": ["40%", "35%"], "a": ["除了40%档位的空气牌，模拟器还显示，部分空气牌（如Q♥4♥、Q♠4♠）应以约35%的频率下注。", "这进一步说明，空气牌的下注并非全有或全无，而是根据具体阻断牌、后门听牌等特征分配不同频率。"], "note": ""}, {"id": "DGL#50-s6", "ep": "50", "type": "topic", "topic": "DGL#50 - 翻前单次加注底池中IP位大盲注在过牌-过牌线路中的启发式策略", "en": "PFC SRP IP Big Blind Heuristics in X-X Line - BvB", "q": "数据观察与常见玩家漏洞", "clues": ["under raising", "probe range", "lazy c-bet"], "a": ["通过数据分析发现，大多数玩家存在“大规模过度弃牌（massively over folding）和加注不足（under raising）”的问题。", "讲师警告：不要简单地将对手的过度弃牌归因于“他在弃掉这手牌、那手牌”，而应认识到——对手到达当前街（如转牌）的范围本身就已经完全变形。", "原因链：对手没有正确游戏翻牌圈的探针下注范围（probe range）、延迟持续下注范围（lazy c-bet range），导致其过牌两次后范围严重扭曲，最终表现为大规模过度弃牌。", "结论：观察到的“过度弃牌”往往是前期策略失误的累积结果，而非单一决策错误。"], "note": ""}, {"id": "DGL#50-c0", "ep": "50", "type": "cloze", "topic": "DGL#50 - 翻前单次加注底池中IP位大盲注在过牌-过牌线路中的启发式策略", "en": "PFC SRP IP Big Blind Heuristics in X-X Line - BvB", "q": "空气牌应放入＿＿的下注频率档位（40% bucket），", "clues": [], "a": ["本视频展示的特定牌面（未明确具体翻牌，但涉及同花听牌与顺子听牌结构）中，空气牌应放入40%的下注频率档位（40% bucket），而非其他牌面常见的20%档位。"], "note": "40%"}, {"id": "DGL#50-c1", "ep": "50", "type": "cloze", "topic": "DGL#50 - 翻前单次加注底池中IP位大盲注在过牌-过牌线路中的启发式策略", "en": "PFC SRP IP Big Blind Heuristics in X-X Line - BvB", "q": "玩家应当已经用＿＿的纯空气牌进行下注（stab）。", "clues": [], "a": ["面对一个能够正确跟注、足够频繁加注的平衡型对手，玩家应当已经用40%的纯空气牌进行下注（stab）。"], "note": "40%"}, {"id": "DGL#50-c5", "ep": "50", "type": "cloze", "topic": "DGL#50 - 翻前单次加注底池中IP位大盲注在过牌-过牌线路中的启发式策略", "en": "PFC SRP IP Big Blind Heuristics in X-X Line - BvB", "q": "除了＿＿档位的空气牌，模拟器还显示，", "clues": [], "a": ["除了40%档位的空气牌，模拟器还显示，部分空气牌（如Q♥4♥、Q♠4♠）应以约35%的频率下注。"], "note": "40%"}, {"id": "DGL#50-note", "ep": "50", "type": "note", "topic": "DGL#50 - 翻前单次加注底池中IP位大盲注在过牌-过牌线路中的启发式策略", "en": "PFC SRP IP Big Blind Heuristics in X-X Line - BvB", "q": "避坑提醒与行动项", "clues": ["DGL", "GTO", "double barrel"], "a": ["本视频属于DGL系列（#50），聚焦于翻前单次加注底池中特定位置（大盲注 vs 按钮位）的翻牌圈策略。视频内容建立在模拟器数据之上，强调GTO作为策略基线的必要性，并揭示了人类玩家在频率执行上的系统性偏差。建议进一步学习：不同牌面结构下空气牌下注频率的差异、转牌圈双枪（double barrel）的空气牌选择，以及如何针对“过度弃牌型”对手构建剥削策略。", "**行动项与常见错误：**", "- 应该做：在翻牌圈面对过牌时，主动用40%频率的空气牌（如J6s、95s）下注，保持范围平衡。", "- 应该做：用A高同花听牌过牌-跟注，用非A高同花听牌快打。", "- 应该做：用顶三条及更好牌力进行50-50的过牌/下注拆分。", "- 不要做：过度快打强牌和听牌，导致过牌范围变弱。", "- 不要做：将对手的过度弃牌简单归因于当前街决策，应追溯其前期范围构建是否失衡。"], "note": ""}, {"id": "DGL#51-intro", "ep": "51", "type": "intro", "topic": "DGL#51 手牌复盘：将K5同花转诈唬——概念拆解", "en": "Hand Review Turning into Bluff - Concepts Breakdown", "q": "DGL#51 手牌复盘：将K5同花转诈唬——概念拆解", "clues": [], "a": ["本视频围绕一手具体牌局展开，核心主题是“将边缘摊牌价值手牌在河牌圈转为诈唬”的决策逻辑。讲师强调，研究扑克不应仅从策略角度出发，更应从EV（期望值）视角分析，因为EV才是最终决定一切行动的标准，策略只是实现最高EV选择的手段。视频通过对比“过牌摊牌”与“诈唬下注”两种路线的EV，展示了在剥削性策略下，将K5同花转为诈唬能显著提升收益。", "视频引入了“权益实现率”（equity realization）这一关键概念，区分了手牌权益（equity）与实际能转化为利润的EV之间的差异。讲师利用大量人口统计数据（如常规玩家在特定牌面结构下的弃牌率）来估算诈唬的期望收益，并通过具体计算演示了如何量化诈唬的EV。最终结论是，在类似A高牌面且对手弃牌率极高的场景下，即使手牌本身没有摊牌价值，转为诈唬也是最高EV的选择。", "视频还讨论了阻挡牌（blocker）对诈唬成功率的影响，以及如何保守地调整数据假设。讲师通过对比GTO对手下的过牌EV与剥削性诈唬EV，明确指出在最大化剥削策略中，应果断将此类手牌转为诈唬。整个讲解过程结合了理论概念、实战数据与具体计算，为观众提供了一套完整的决策分析框架。"], "note": ""}, {"id": "DGL#51-s0", "ep": "51", "type": "topic", "topic": "DGL#51 手牌复盘：将K5同花转诈唬——概念拆解", "en": "Hand Review Turning into Bluff - Concepts Breakdown", "q": "权益与EV的区别", "clues": ["equity", "30%", "25%"], "a": ["权益（equity）是指手牌对抗对手整个范围的胜率，而EV（期望值）是权益实现后转化为实际筹码的数值，两者是不同概念。", "例如，K5同花在河牌圈可能有30%的权益，但实际能实现的EV可能只有25%的底池份额，这中间的差距就是权益实现率。", "讲师强调：“不要只从策略角度研究扑克，要从EV角度研究。EV最终才是唯一重要的，策略只是最高EV选择的功能体现。”"], "note": ""}, {"id": "DGL#51-s1", "ep": "51", "type": "topic", "topic": "DGL#51 手牌复盘：将K5同花转诈唬——概念拆解", "en": "Hand Review Turning into Bluff - Concepts Breakdown", "q": "权益实现率的计算", "clues": ["30%", "24.6%", "82%", "8.1BB"], "a": ["权益实现率 = 实际捕获的底池份额 / 总权益。例如，若手牌有30%权益，但只捕获了24.6%的底池，则权益实现率为82%。", "讲师举例：底池为8.1BB，若手牌EV为2BB，则捕获底池份额为24.7%，除以30%权益得到约82%的权益实现率。", "若声称有55%权益和4.2EV，意味着捕获52%底池，对应94%权益实现率，讲师认为这在理论上过于乐观，实践中难以达到。"], "note": ""}, {"id": "DGL#51-s2", "ep": "51", "type": "topic", "topic": "DGL#51 手牌复盘：将K5同花转诈唬——概念拆解", "en": "Hand Review Turning into Bluff - Concepts Breakdown", "q": "河牌圈人口弃牌率数据", "clues": ["OOP", "regulars", "77%", "79%"], "a": ["在单一加注底池、有利位置玩家（IP）过牌给不利位置玩家（OOP）后，河牌圈面对1.5倍底池下注时，常规玩家（regulars）的弃牌率约为77%。", "具体数据点：在A高牌面上，面对1.5倍底池下注，常规玩家弃牌率为79%（基于12,000手样本）；另一个类似场景（河牌破同花听牌、转牌为75）的弃牌率介于75%-79%之间，取约77%。", "讲师指出，在最大剥削策略中，面对如此高的弃牌率，将K5同花转为诈唬是合理的。"], "note": ""}, {"id": "DGL#51-s3", "ep": "51", "type": "topic", "topic": "DGL#51 手牌复盘：将K5同花转诈唬——概念拆解", "en": "Hand Review Turning into Bluff - Concepts Breakdown", "q": "诈唬EV的计算方法", "clues": ["77%", "8.1BB", "12.15BB", "3.44BB"], "a": ["诈唬EV公式：EV = 成功率 × 底池大小 - 失败率 × 下注尺度。", "具体计算：若对手弃牌率77%，底池8.1BB，下注1.5倍底池（即12.15BB），则EV = 0.77 × 8.1 - 0.23 × 12.15 = 6.237 - 2.7945 = 3.44BB。", "这3.44BB相当于捕获底池的42.5%，远高于过牌摊牌的EV。讲师强调，无论对手跟注还是加注，我们损失相同，只需关注弃牌频率。"], "note": ""}, {"id": "DGL#51-s4", "ep": "51", "type": "topic", "topic": "DGL#51 手牌复盘：将K5同花转诈唬——概念拆解", "en": "Hand Review Turning into Bluff - Concepts Breakdown", "q": "阻挡牌对诈唬的影响", "clues": ["blocker", "3%", "77%", "74%"], "a": ["阻挡牌（blocker）会影响诈唬的实际成功率，需要评估我们的阻挡牌是高于还是低于平均水平。", "保守做法是假设阻挡牌会使实际弃牌率比数据低约3%，例如将77%调整为74%再重新计算EV。", "对于K5同花这类手牌，阻挡牌效应显著，但即使采用更保守的估计，诈唬EV仍高于过牌。"], "note": ""}, {"id": "DGL#51-s5", "ep": "51", "type": "topic", "topic": "DGL#51 手牌复盘：将K5同花转诈唬——概念拆解", "en": "Hand Review Turning into Bluff - Concepts Breakdown", "q": "过牌路线的EV对比", "clues": ["GTO", "1.25BB", "8.1BB", "15%"], "a": ["在GTO对手下，K5同花过牌摊牌的EV仅为1.25BB，占底池8.1BB的约15%。", "原因在于：对手翻牌圈下注后，转牌过牌范围包含大量对子，河牌Q可能击中对手的顺子或高对，且对手会用裸A或口袋K等强牌下注，导致我们频繁被诈唬出局。", "即使将诈唬成功率假设下调至70%，诈唬EV仍高于过牌EV，因此在最大剥削策略中应果断转为诈唬。"], "note": ""}, {"id": "DGL#51-s6", "ep": "51", "type": "topic", "topic": "DGL#51 手牌复盘：将K5同花转诈唬——概念拆解", "en": "Hand Review Turning into Bluff - Concepts Breakdown", "q": "剥削策略与GTO的取舍", "clues": ["1.25BB", "15%", "3.44BB", "42.5%"], "a": ["讲师明确指出，在最大剥削策略（max exploit strategy）下，应毫不犹豫地将K5同花转为河牌诈唬。", "对比数据：过牌EV为1.25BB（15%底池份额），而诈唬EV为3.44BB（42.5%底池份额），差距显著。", "即使采用保守的74%弃牌率假设，诈唬EV依然远超过牌，说明该决策在剥削框架下具有压倒性优势。"], "note": ""}, {"id": "DGL#51-c0", "ep": "51", "type": "cloze", "topic": "DGL#51 手牌复盘：将K5同花转诈唬——概念拆解", "en": "Hand Review Turning into Bluff - Concepts Breakdown", "q": "K5同花在河牌圈可能有＿＿的权益，但实际能实现的EV可能只有25%的底池份额，", "clues": [], "a": ["例如，K5同花在河牌圈可能有30%的权益，但实际能实现的EV可能只有25%的底池份额，这中间的差距就是权益实现率。"], "note": "30%"}, {"id": "DGL#51-c1", "ep": "51", "type": "cloze", "topic": "DGL#51 手牌复盘：将K5同花转诈唬——概念拆解", "en": "Hand Review Turning into Bluff - Concepts Breakdown", "q": "例如，若手牌有＿＿权益，但只捕获了24.6%的底池，", "clues": [], "a": ["权益实现率 = 实际捕获的底池份额 / 总权益。例如，若手牌有30%权益，但只捕获了24.6%的底池，则权益实现率为82%。"], "note": "30%"}, {"id": "DGL#51-c2", "ep": "51", "type": "cloze", "topic": "DGL#51 手牌复盘：将K5同花转诈唬——概念拆解", "en": "Hand Review Turning into Bluff - Concepts Breakdown", "q": "河牌圈面对1.5倍底池下注时，常规玩家（regulars）的弃牌率约为＿＿。", "clues": [], "a": ["在单一加注底池、有利位置玩家（IP）过牌给不利位置玩家（OOP）后，河牌圈面对1.5倍底池下注时，常规玩家（regulars）的弃牌率约为77%。"], "note": "77%"}, {"id": "DGL#51-note", "ep": "51", "type": "note", "topic": "DGL#51 手牌复盘：将K5同花转诈唬——概念拆解", "en": "Hand Review Turning into Bluff - Concepts Breakdown", "q": "避坑提醒与行动项", "clues": ["DGL", "GTO", "3%"], "a": ["本视频是DGL系列第51期，聚焦于手牌复盘中的概念拆解，特别强调了EV视角在决策中的核心地位。讲师通过具体牌例和大量统计数据，展示了如何将理论概念（如权益实现率、阻挡牌）应用于实战决策。视频内容承接了系列中关于剥削策略与GTO平衡的讨论，为观众提供了从理论到实践的完整分析路径。", "值得进一步学习的方向包括：深入研究不同牌面结构下的对手弃牌率数据，掌握更精细的阻挡牌效应评估方法，以及如何在多街行动中动态调整诈唬频率。此外，理解权益实现率在不同位置和筹码深度下的变化规律，将有助于构建更精准的剥削策略。", "**行动项与常见错误：**", "- 应该做：在河牌圈面对高弃牌率的对手时，积极考虑将无摊牌价值的手牌转为诈唬，并计算具体EV。", "- 应该做：使用保守的阻挡牌调整（如降低3%弃牌率）来验证诈唬决策的稳健性。", "- 不要做：仅凭手牌权益大小决定是否诈唬，而应比较诈唬与过牌的EV差异。", "- 不要做：忽视对手的实际弃牌数据，仅依赖理论GTO频率进行决策。"], "note": ""}, {"id": "DGL#52-intro", "ep": "52", "type": "intro", "topic": "DGL#52 - 河牌圈不连续下注线中的过牌加注范围构成", "en": "River Play XR Range Composition in Discontinuous Lines", "q": "DGL#52 - 河牌圈不连续下注线中的过牌加注范围构成", "clues": ["River", "OOP", "Check-Raise"], "a": ["本视频聚焦于河牌圈（River）在不连续下注线（Discontinuous Lines）场景下，防守方（OOP）进行过牌加注（Check-Raise）时的范围构建与组合选择。讲师以半池下注被重新打开（reopen）为背景，系统拆解了选择诈唬组合的核心原则：阻挡牌（Blockers）的效用、对对手弃牌范围的影响，以及如何利用范围分布差异筛选最优候选组合。", "视频通过具体牌例（如A5、Q9、J T等）和Solver输出数据，展示了低牌组合（如9-5-4-x）在河牌过牌加注中的高频使用逻辑，并解释了为何K5并非理论最优选择。讲师同时提出了一个重要的平衡策略启发式：当存在大量属性相近的候选组合时，应以相似的低频率全部使用，以控制整体诈唬频率，避免过度诈唬。", "最后，讲师给出了实战建议：在理解GTO理论的基础上，优先从Solver解中的既有候选组合里调整频率来实施剥削，而非寻找范围外的“花哨”组合（如K5），这样既能保持策略的不可剥削性，又能有效针对弱对手实现盈利。"], "note": ""}, {"id": "DGL#52-s0", "ep": "52", "type": "topic", "topic": "DGL#52 - 河牌圈不连续下注线中的过牌加注范围构成", "en": "River Play XR Range Composition in Discontinuous Lines", "q": "河牌过牌加注的诈唬候选原则", "clues": ["pairs of the", "board", "bat folds", "Q4s"], "a": ["面对半池下注被重新打开的局面，K5并非最差的诈唬候选，但需要系统评估所有可用组合。", "核心原则：优先使用“牌面配对牌”（pairs of the board），这类牌不会阻挡对手的弃牌范围（bat folds），同时可能阻挡对手的强牌。", "例如，若对手可能以Q9（同花Q9）到达河牌，持有9就能阻挡Q9这一对手不会弃给过牌加注的强牌。", "针对不同位置的对手，阻挡牌选择需调整：对抗CO位，Q4s（同花Q4）不太可能出现，但对抗BTN位，持有4就能阻挡Q4s。"], "note": ""}, {"id": "DGL#52-s1", "ep": "52", "type": "topic", "topic": "DGL#52 - 河牌圈不连续下注线中的过牌加注范围构成", "en": "River Play XR Range Composition in Discontinuous Lines", "q": "弃牌范围与阻挡牌分析", "clues": [], "a": ["对手（IP）在此场景下最可能的弃牌手牌包括：JT、J8、J7、T8等。", "因此，诈唬候选应避免包含J、T、7等牌点，因为这些牌会阻挡大量对手的弃牌组合。", "薄价值手牌如QJ（非同花QJ）也可能弃给加注，所以持有J同样不理想。", "总体而言，持有T或J作为阻挡牌进行过牌加注是“相当糟糕”的选择。"], "note": ""}, {"id": "DGL#52-s2", "ep": "52", "type": "topic", "topic": "DGL#52 - 河牌圈不连续下注线中的过牌加注范围构成", "en": "River Play XR Range Composition in Discontinuous Lines", "q": "K作为阻挡牌的适用性", "clues": ["Solver"], "a": ["通常来说，在A高牌面，对手不太会用K高诈唬，所以K作为阻挡牌效果不错。", "但本视频的特殊场景中，由于范围分布原因，对手确实会用K高牌诈唬，这削弱了K阻挡牌的部分效用。", "因此，K5在理论解中并非最优候选，Solver使用它的频率很低。"], "note": ""}, {"id": "DGL#52-s3", "ep": "52", "type": "topic", "topic": "DGL#52 - 河牌圈不连续下注线中的过牌加注范围构成", "en": "River Play XR Range Composition in Discontinuous Lines", "q": "低牌组合的候选优势", "clues": ["low cards", "Solver"], "a": ["对手范围中最少的牌型是低牌（low cards），他主要持有高牌和一些口袋对子，因为低牌组合通常会在转牌圈下注。", "基于这一推理，河牌圈最佳候选是包含9、5、4等低牌的组合，尤其是带有6、7、5等小踢脚者的牌型。", "具体候选包括：64、74、85、75、98、96等，Solver以相似频率使用所有这些组合。"], "note": ""}, {"id": "DGL#52-s4", "ep": "52", "type": "topic", "topic": "DGL#52 - 河牌圈不连续下注线中的过牌加注范围构成", "en": "River Play XR Range Composition in Discontinuous Lines", "q": "转牌圈两对过牌频率的启示", "clues": ["80%"], "a": ["讲师特别指出：A5（非同花A5）在转牌圈有80%的频率选择过牌（IP方），这颠覆了“两对必然下注”的直觉。", "因此，持有5并非无关紧要，因为对手的A5两对确实会频繁过牌，5能有效阻挡这一强牌组合。"], "note": ""}, {"id": "DGL#52-s5", "ep": "52", "type": "topic", "topic": "DGL#52 - 河牌圈不连续下注线中的过牌加注范围构成", "en": "River Play XR Range Composition in Discontinuous Lines", "q": "平衡策略的频率控制启发式", "clues": [], "a": ["理论启发式：当策略需要保持相对平衡，且存在大量属性几乎等价的候选组合时，应以相似的低频率全部使用。", "具体操作：将所有等价候选组合以较低频率纳入诈唬范围，从而精确控制整体诈唬频率，避免过度诈唬。", "如果不这样做，诈唬频率会大幅超标，虽然不一定是问题，但理解理论后可以按需调整策略——若愿意承担更高风险，玩极度不平衡的策略也完全可以，前提是具备正确的场景测试能力。"], "note": ""}, {"id": "DGL#52-s6", "ep": "52", "type": "topic", "topic": "DGL#52 - 河牌圈不连续下注线中的过牌加注范围构成", "en": "River Play XR Range Composition in Discontinuous Lines", "q": "皇后X组合与红桃阻挡", "clues": [], "a": ["大量Qx组合也被纳入诈唬范围，因为它们阻挡了对手的两对组合。", "这些Qx组合同样以相似频率被使用，因其属性非常接近。", "特别值得注意的是带红桃的Qx：红桃不阻挡对手的弃牌范围，因为大量红桃牌会在转牌圈下注，所以红桃Qx是更优候选。"], "note": ""}, {"id": "DGL#52-s7", "ep": "52", "type": "topic", "topic": "DGL#52 - 河牌圈不连续下注线中的过牌加注范围构成", "en": "River Play XR Range Composition in Discontinuous Lines", "q": "理论解与实战剥削的取舍", "clues": ["GTO", "70%", "35%"], "a": ["理论解中K5不被使用，但实战中若从最大剥削角度出发，玩家可能会发现85、74等组合更优，进而加注所有这类手牌。", "若将所有低牌组合都纳入过牌加注范围，诈唬比例可能达到70%，过牌加注频率占整体范围的35%——这对弱对手可能非常盈利。", "但风险在于：如果对手识破并过度跟注，这种策略会导致大量EV损失。", "讲师个人建议：先理解理论，然后在GTO解已有的候选组合中调整频率来实施剥削，这样既能针对对手弱点，又不会在摊牌时暴露过于极端的策略，同时保持整体策略不过度可剥削。"], "note": ""}, {"id": "DGL#52-s8", "ep": "52", "type": "topic", "topic": "DGL#52 - 河牌圈不连续下注线中的过牌加注范围构成", "en": "River Play XR Range Composition in Discontinuous Lines", "q": "实战操作建议", "clues": ["Solver"], "a": ["优先使用Solver解中已有的低牌候选组合（如9-5-4-x），无需额外寻找K5等范围外组合。", "如果某些候选组合在到达河牌前已被转成诈唬（如转牌圈下注），则需根据实际范围构成调整。", "在拥有充足候选组合的前提下，只需将这些组合的频率适当上调，即可实现剥削效果，同时避免策略过于脆弱。", "每位玩家应根据自身偏好决定剥削程度，这是个人策略选择问题。"], "note": ""}, {"id": "DGL#52-c4", "ep": "52", "type": "cloze", "topic": "DGL#52 - 河牌圈不连续下注线中的过牌加注范围构成", "en": "River Play XR Range Composition in Discontinuous Lines", "q": "讲师特别指出：A5（非同花A5）在转牌圈有＿＿的频率选择过牌（IP方），", "clues": [], "a": ["讲师特别指出：A5（非同花A5）在转牌圈有80%的频率选择过牌（IP方），这颠覆了“两对必然下注”的直觉。"], "note": "80%"}, {"id": "DGL#52-c7", "ep": "52", "type": "cloze", "topic": "DGL#52 - 河牌圈不连续下注线中的过牌加注范围构成", "en": "River Play XR Range Composition in Discontinuous Lines", "q": "诈唬比例可能达到＿＿，过牌加注频率占整体范围的35%——这对弱对手可能非常盈利。", "clues": [], "a": ["若将所有低牌组合都纳入过牌加注范围，诈唬比例可能达到70%，过牌加注频率占整体范围的35%——这对弱对手可能非常盈利。"], "note": "70%"}, {"id": "DGL#52-note", "ep": "52", "type": "note", "topic": "DGL#52 - 河牌圈不连续下注线中的过牌加注范围构成", "en": "River Play XR Range Composition in Discontinuous Lines", "q": "避坑提醒与行动项", "clues": ["DGL", "GTO", "80%"], "a": ["本视频属于DGL系列第52期，聚焦于河牌圈不连续下注线中的范围构建，是进阶理论内容。讲师在结尾提到应将“等价组合低频均用”这一启发式纳入其Digital Blueprint课程，说明这是可迁移至多种场景的通用平衡原则。建议结合前序视频中关于转牌圈下注范围与阻挡牌选择的内容进行学习，以形成完整的范围构建框架。", "**行动项与常见错误：**", "- 不要使用阻挡对手弃牌范围的组合（如JT、J8、T8中的J/T/7）作为诈唬候选。", "- 不要忽视转牌圈两对过牌的高频率（如A5的80%过牌率），这直接影响河牌阻挡牌的价值。", "- 不要在未理解理论的情况下盲目使用范围外组合（如K5）进行剥削，优先从GTO解中调整频率。", "- 若选择高度剥削策略（如70%诈唬比例），务必确认对手不会过度跟注，否则EV损失巨大。"], "note": ""}, {"id": "DGL#53-intro", "ep": "53", "type": "intro", "topic": "DGL#53 - 翻前加注底池（3BP）中连牌翻牌面的持续下注原则", "en": "PFR 3BP IP Principles of C-betting in Connected Boards", "q": "DGL#53 - 翻前加注底池（3BP）中连牌翻牌面的持续下注原则", "clues": ["bet pot", "connected boards", "in position"], "a": ["本视频聚焦于翻前加注底池（3-bet pot）中，当翻牌面为连牌结构（connected boards）时，作为翻前进攻方在有利位置（in position）的持续下注（c-bet）策略。讲师明确指出，在这类包含顺子可能、大量听牌可能甚至两对组合的牌面上，采用小尺度下注（small size）并配合中等频率（medium frequency）是最优选择，而非大尺度下注（sizing up）。", "视频的核心理论框架围绕“生成无差别”（generating indifference）展开。讲师强调，下注尺度的选择是迫使对手在跟注与弃牌之间产生无差别感的核心工具，而平衡策略（balanced strategy）的本质就是让对手的某些牌陷入艰难决策。如果某种下注尺度让对手的所有牌都能轻松决策（好牌轻松跟注、垃圾牌轻松弃牌），那么这个尺度就不是好尺度。", "讲师还通过具体牌例（如KJ、口袋对子10）演示了在特定牌面下的大尺度下注会如何导致自身下注频率过低，从而进一步论证了小尺度中等频率策略的合理性。整个讲解以GTO（博弈论最优）视角为基准，同时承认在SPR（筹码底池比）或范围改变时，其他场景可能有所不同。"], "note": ""}, {"id": "DGL#53-s0", "ep": "53", "type": "topic", "topic": "DGL#53 - 翻前加注底池（3BP）中连牌翻牌面的持续下注原则", "en": "PFR 3BP IP Principles of C-betting in Connected Boards", "q": "连牌翻牌面的下注尺度选择", "clues": ["small size", "sizing up", "indifference", "polarized"], "a": ["在翻前加注底池中，当翻牌面包含顺子可能、大量听牌可能以及两对组合时（如连牌面），应该选择小尺度下注（small size）而非大尺度下注（sizing up）。", "这类牌面结构下，大尺度下注缺乏合理性，因为无法在对手的听牌范围上生成无差别感（indifference）。", "大尺度下注会迫使对手的跟注范围变得极度极化（polarized）：垃圾牌轻松弃牌，超强牌和超高权益牌轻松跟注，中间牌全部被挤压出局。"], "note": ""}, {"id": "DGL#53-s1", "ep": "53", "type": "topic", "topic": "DGL#53 - 翻前加注底池（3BP）中连牌翻牌面的持续下注原则", "en": "PFR 3BP IP Principles of C-betting in Connected Boards", "q": "大尺度下注的弊端", "clues": ["tough spot"], "a": ["通过大尺度下注，你实际上把对手的范围分裂成两部分：高权益牌（容易继续）和垃圾牌（容易弃牌）。", "当你的下注尺度没有让任何一手牌陷入艰难决策（tough spot）时，这个尺度很可能不是好尺度。", "大尺度下注还会导致你自己的下注频率急剧降低——因为对手范围很强时，你无法用很多牌去下注大尺度。"], "note": ""}, {"id": "DGL#53-s2", "ep": "53", "type": "topic", "topic": "DGL#53 - 翻前加注底池（3BP）中连牌翻牌面的持续下注原则", "en": "PFR 3BP IP Principles of C-betting in Connected Boards", "q": "小尺度中等频率策略", "clues": ["small size", "medium frequency", "low pockets", "UTG"], "a": ["在连牌翻牌面且处于有利位置时，应采用小尺度（small size）配合中等频率（medium frequency）的持续下注策略。", "这种下注尺度的目标是针对对手范围中的低对子（low pockets）区域——这是你应当用整个范围去瞄准的区域。", "具体适用位置包括UTG（枪口）、HJ（劫位）、CO（关位）等翻前加注底池的有利位置场景。"], "note": ""}, {"id": "DGL#53-s3", "ep": "53", "type": "topic", "topic": "DGL#53 - 翻前加注底池（3BP）中连牌翻牌面的持续下注原则", "en": "PFR 3BP IP Principles of C-betting in Connected Boards", "q": "下注尺度的核心原则", "clues": ["equilibrium", "GTO"], "a": ["下注尺度是你在对手反应中生成无差别感的最重要工具。", "玩平衡策略（balanced strategy）要求生成对手反应的无差别感；均衡（equilibrium）的本质就是让对手的某些选择变得无差别。", "如果某种策略无法生成任何无差别感，那么很可能存在更高EV（期望值）的替代策略，你也大概率没有在玩GTO策略。", "必须选择能够让你在对手反应中生成一定无差别感的下注尺度。"], "note": ""}, {"id": "DGL#53-s4", "ep": "53", "type": "topic", "topic": "DGL#53 - 翻前加注底池（3BP）中连牌翻牌面的持续下注原则", "en": "PFR 3BP IP Principles of C-betting in Connected Boards", "q": "具体牌例分析", "clues": ["quarter size", "always check", "pocket 10s", "super low"], "a": ["以四分之一底池（quarter size）尺度求解时，KJ（非同花KJ）在连牌翻牌面应当总是过牌（always check）。", "口袋对子10（pocket 10s）同样应当总是过牌。", "如果采用大尺度下注，你的下注频率会变得极低（super, super low），这本身就是选择下注尺度时需要考虑的重要因素。"], "note": ""}, {"id": "DGL#53-s5", "ep": "53", "type": "topic", "topic": "DGL#53 - 翻前加注底池（3BP）中连牌翻牌面的持续下注原则", "en": "PFR 3BP IP Principles of C-betting in Connected Boards", "q": "适用场景与例外", "clues": ["through bad pots", "in position", "SPR", "UTG"], "a": ["本策略适用于翻前加注底池、有利位置、底池较小（through bad pots in position）的场景。", "其他场景可能不同：当SPR（筹码底池比）被覆盖或范围改变时，策略需要相应调整。", "大尺度下注并非在所有连牌面都不可取，但至少在UTG、HJ、CO等位置的翻前加注底池中，应当避免。"], "note": ""}, {"id": "DGL#53-note", "ep": "53", "type": "note", "topic": "DGL#53 - 翻前加注底池（3BP）中连牌翻牌面的持续下注原则", "en": "PFR 3BP IP Principles of C-betting in Connected Boards", "q": "避坑提醒与行动项", "clues": ["DGL", "GTO", "turn"], "a": ["本视频是DGL系列第53期，聚焦于翻前加注底池（3BP）中连牌翻牌面的持续下注原则。视频内容延续了该系列一贯的GTO导向教学风格，强调下注尺度作为生成无差别感的核心工具。讲师在结尾提到“这就是本视频的全部内容”，暗示该主题可能还有后续视频或与系列中其他集数（如不同牌面结构的下注策略）形成互补。", "值得进一步学习的方向包括：不同翻牌面结构（如干燥面、对子面）下的下注尺度选择；转牌（turn）和河牌（river）圈的下注策略调整；以及当SPR较浅或较深时，连牌面策略的具体变化。", "**行动项与常见错误：**", "- 应该做：在连牌翻牌面、有利位置、翻前加注底池中，使用小尺度下注并配合中等频率。", "- 应该做：选择下注尺度时，优先考虑能否让对手的某些牌陷入艰难决策（生成无差别感）。", "- 不要做：在连牌翻牌面盲目使用大尺度下注，这会让对手的范围轻松分裂成“轻松跟注”和“轻松弃牌”两部分。", "- 不要做：忽略下注尺度对自身下注频率的影响——大尺度下注会显著降低你可下注的牌数。"], "note": ""}, {"id": "DGL#54-intro", "ep": "54", "type": "intro", "topic": "DGL#54 - 翻前3-bet底池中位置优势方的范围构成在决策中的作用", "en": "PFC 3BP IP The Role of Range Composition in Decision Making", "q": "DGL#54 - 翻前3-bet底池中位置优势方的范围构成在决策中的作用", "clues": ["bet", "over-call", "triple barrel"], "a": ["本视频聚焦于翻前3-bet底池中，作为位置优势方（IP）在转牌圈面对对手下注时，如何基于对手的范围构成（特别是诈唬与价值比例）来做出跟注或弃牌的决策。讲师强调，判断能否过度跟注（over-call）的关键，并非仅仅看对手河牌圈是否诈唬不足，而是要看对手整体三条街的下注频率，尤其是河牌圈的三重下注（triple barrel）频率。", "视频通过具体数据对比（如翻牌圈小注与3/4底池下注对河牌圈诈唬比例的影响），说明了范围构成与下注尺度序列之间的紧密关联。讲师还指出，在剥削性策略中，无论是对手过于被动还是过于激进，都会为你的跟注增加EV，因此“最大EV扑克”往往意味着比GTO建议更少的弃牌。", "内容框架包括：范围构成与诈唬/价值平衡的关系、转牌圈跟注EV的决定因素、口袋对子（如55、44、77、88）在转牌圈的跟注决策、以及下注尺度序列对河牌圈范围构成的影响。"], "note": ""}, {"id": "DGL#54-s0", "ep": "54", "type": "topic", "topic": "DGL#54 - 翻前3-bet底池中位置优势方的范围构成在决策中的作用", "en": "PFC 3BP IP The Role of Range Composition in Decision Making", "q": "范围构成与诈唬平衡", "clues": ["give up", "30%"], "a": ["一个“诈唬不足/诈唬过度”的范围，是相对于其需要保持平衡的诈唬数量而言的。例如，3/4底池的下注尺度需要大约30%的诈唬比例才能达到平衡，因为这是跟注方所获得的底池赔率。", "如果对手在河牌圈诈唬不足，但下注频率正确，这本身并不直接增加你跟注的EV。真正增加你转牌圈EV的，是对手在河牌圈放弃（give up）的频率超过理论最优值。", "河牌圈诈唬不足与三重下注频率不足往往同时出现：如果对手没有用本该诈唬的牌开火，那么他河牌圈的诈唬比例自然就会偏低。"], "note": ""}, {"id": "DGL#54-s1", "ep": "54", "type": "topic", "topic": "DGL#54 - 翻前3-bet底池中位置优势方的范围构成在决策中的作用", "en": "PFC 3BP IP The Role of Range Composition in Decision Making", "q": "转牌圈跟注EV的关键频率", "clues": ["GTO"], "a": ["判断能否对某个对手过度跟注的核心问题是：“我能否比跟注盈亏平衡所需的频率更频繁地看到摊牌？”如果能，就可以过度跟注。", "对你最重要的频率是：对手在河牌圈三重下注的频率。如果对手过牌过多（超过GTO建议），你就能更频繁地看到摊牌。", "当然，这也取决于对手过牌范围的具体构成。但假设你对该过牌范围拥有大量权益，那么更频繁地看到摊牌就会增加你转牌圈跟注的EV。", "如果你在转牌圈用抓诈唬牌跟注，并且预期比理论最优更频繁地到达河牌，你就在赚钱，因此可以过度跟注转牌。"], "note": ""}, {"id": "DGL#54-s2", "ep": "54", "type": "topic", "topic": "DGL#54 - 翻前3-bet底池中位置优势方的范围构成在决策中的作用", "en": "PFC 3BP IP The Role of Range Composition in Decision Making", "q": "口袋对子的转牌跟注决策", "clues": [], "a": ["本视频以口袋对子55、44、77、88为例，讨论转牌圈的跟注决策。", "核心问题是：“这个对手在河牌圈放弃的频率有多高？”如果对手过牌过多，你比理论最优更频繁地看到摊牌，那么你转牌圈跟注的EV就会更高。", "如果对手过于被动或过于激进，你都可以过度跟注——这正是扑克的魅力所在。"], "note": ""}, {"id": "DGL#54-s3", "ep": "54", "type": "topic", "topic": "DGL#54 - 翻前3-bet底池中位置优势方的范围构成在决策中的作用", "en": "PFC 3BP IP The Role of Range Composition in Decision Making", "q": "剥削机会与最大EV扑克", "clues": ["over-stab", "GTO", "Solver"], "a": ["在实战中（红线指标），存在大量过度下注（over-stab）的机会：当对手过牌给你时，你可以比GTO理论更激进地攻击。", "同时，也存在大量相对于Solver的过度跟注机会：因为对手要么太被动、要么太激进，这两者都会增加你转牌圈跟注和翻牌圈跟注的EV。", "最大EV扑克是一种极少弃牌的扑克风格。如果你想在扑克中赚最多的钱，几乎总是应该比Solver建议的弃牌更少。"], "note": ""}, {"id": "DGL#54-s4", "ep": "54", "type": "topic", "topic": "DGL#54 - 翻前3-bet底池中位置优势方的范围构成在决策中的作用", "en": "PFC 3BP IP The Role of Range Composition in Decision Making", "q": "下注尺度序列与范围构成", "clues": ["30%", "24%"], "a": ["数据研究中的“Z”代表每条街使用的下注尺度，它只是一个筛选参考：筛选翻牌圈尺度、转牌圈尺度、河牌圈尺度，然后组合出不同的尺度序列。", "这在用数据研究时非常重要，因为河牌圈的范围构成会显著受到前几条街下注尺度的影响。", "例如：如果对手翻牌圈下注很大，那么他河牌圈的诈唬比例会比翻牌圈下注小时少得多。", "具体数据对比：翻牌圈小注并三重下注时，河牌圈有30%的诈唬比例；翻牌圈3/4底池下注时，河牌圈只有24%的诈唬比例——因此你不能同样轻松地跟注到底。"], "note": ""}, {"id": "DGL#54-c0", "ep": "54", "type": "cloze", "topic": "DGL#54 - 翻前3-bet底池中位置优势方的范围构成在决策中的作用", "en": "PFC 3BP IP The Role of Range Composition in Decision Making", "q": "3/4底池的下注尺度需要大约＿＿的诈唬比例才能达到平衡，", "clues": [], "a": ["一个“诈唬不足/诈唬过度”的范围，是相对于其需要保持平衡的诈唬数量而言的。例如，3/4底池的下注尺度需要大约30%的诈唬比例才能达到平衡，因为这是跟注方所获得的底池赔率。"], "note": "30%"}, {"id": "DGL#54-c4", "ep": "54", "type": "cloze", "topic": "DGL#54 - 翻前3-bet底池中位置优势方的范围构成在决策中的作用", "en": "PFC 3BP IP The Role of Range Composition in Decision Making", "q": "具体数据对比：翻牌圈小注并三重下注时，河牌圈有＿＿的诈唬比例；翻牌圈3/4底池下注时，", "clues": [], "a": ["具体数据对比：翻牌圈小注并三重下注时，河牌圈有30%的诈唬比例；翻牌圈3/4底池下注时，河牌圈只有24%的诈唬比例——因此你不能同样轻松地跟注到底。"], "note": "30%"}, {"id": "DGL#54-note", "ep": "54", "type": "note", "topic": "DGL#54 - 翻前3-bet底池中位置优势方的范围构成在决策中的作用", "en": "PFC 3BP IP The Role of Range Composition in Decision Making", "q": "避坑提醒与行动项", "clues": ["DGL", "bet", "GTO"], "a": ["本视频是DGL系列第54期，聚焦于翻前3-bet底池中位置优势方的决策框架。它承接了之前关于范围构成与下注频率的理论，并将其应用于具体的转牌圈跟注场景。值得进一步学习的方向包括：不同下注尺度序列对河牌圈范围构成的量化影响、以及如何利用对手的被动/激进倾向来调整自己的跟注与下注频率。", "**行动项与常见错误：**", "- 应该做：判断对手河牌圈三重下注频率，而非仅看河牌圈诈唬比例。", "- 应该做：在对手过牌过多时，用抓诈唬牌（如中小口袋对子）过度跟注转牌。", "- 应该做：在对手过牌给你时，考虑比GTO更激进地过度下注。", "- 不要做：仅因为对手河牌圈诈唬不足就直接弃牌，而忽略其整体下注频率。", "- 不要做：忽略下注尺度序列对河牌圈范围构成的影响——大注翻牌下注会显著减少河牌圈诈唬比例。"], "note": ""}, {"id": "DGL#55-intro", "ep": "55", "type": "intro", "topic": "DGL#55 - 4-bet底池中的翻前加注者：如何在A高翻牌面游戏持续下注", "en": "PFR 4BP IP How to Play Cbets in Ax boards", "q": "DGL#55 - 4-bet底池中的翻前加注者：如何在A高翻牌面游戏持续下注", "clues": ["bet pot", "PFR", "Ace-high boards"], "a": ["本视频聚焦于4-bet底池（4-bet pot）中，翻前加注者（PFR）在A高翻牌面（Ace-high boards）上的持续下注（c-bet）策略。讲师指出，在这类牌面上下注尺度应绝大多数时候采用10%底池的小注，但在部分特定牌面（如A-J-2、A-J-5等）可以加大到25%底池。核心观点是：A高牌面并非自动全范围下注的场合，因为我们的范围在这些牌面上过于强势，反而需要大量过牌来给对手留出继续游戏的空间。", "视频强调了一个反直觉的GTO结论：当你的范围优势过大时，如果一味地用10%小注全范围下注，对手将无法建立任何跟注范围，最终导致你的期望值（EV）下降。正确的做法是混合使用10%小注与高频过牌，让对手的弱牌（如无同花听牌的小对子）能够以接近零EV或略微正EV的跟注继续游戏，从而在你真正下注时获得更多价值。讲师还提醒，面对现实中普遍过度弃牌（over-fold）的玩家群体，需要适当调整频率策略。"], "note": ""}, {"id": "DGL#55-s0", "ep": "55", "type": "topic", "topic": "DGL#55 - 4-bet底池中的翻前加注者：如何在A高翻牌面游戏持续下注", "en": "PFR 4BP IP How to Play Cbets in Ax boards", "q": "4-bet底池A高牌面的下注尺度选择", "clues": ["bet", "Solver", "double broadway", "triple broadway"], "a": ["在4-bet底池的A高牌面上，软件（Solver）优化的下注尺度绝大多数时候是10%底池。", "存在一些“双高牌”（double broadway）牌面可以加大下注尺度到25%底池，具体包括：A-J-2、A-J-5。", "还有“三高牌”（triple broadway）牌面同样使用25%下注，包括：A-J-10、A-K-3、A-K-9、A-Q-8。", "对于A-low-low（A带两张低牌）的牌面，软件几乎总是选择10%底池的下注尺度。", "对于A-x双高牌（A带两张高牌）的牌面，主要使用25%底池下注，但存在一些例外情况。", "对于配对牌面（如A-K-K），则使用10%底池的下注尺度。"], "note": ""}, {"id": "DGL#55-s1", "ep": "55", "type": "topic", "topic": "DGL#55 - 4-bet底池中的翻前加注者：如何在A高翻牌面游戏持续下注", "en": "PFR 4BP IP How to Play Cbets in Ax boards", "q": "不同A高牌面的下注频率差异", "clues": ["10%", "40%", "50%", "57%"], "a": ["下注频率在不同A高牌面上差异显著，并非自动全范围下注。", "在A-8-7牌面上，使用10%底池下注，但下注频率仅为40%。", "在A-7-6牌面上，下注频率为40%。", "在A-7-2牌面上，下注频率为50%。", "在A-6-4牌面上，下注频率为57%。", "这些数据表明，即使采用10%的小注，也远非所有手牌都适合下注。"], "note": ""}, {"id": "DGL#55-s2", "ep": "55", "type": "topic", "topic": "DGL#55 - 4-bet底池中的翻前加注者：如何在A高翻牌面游戏持续下注", "en": "PFR 4BP IP How to Play Cbets in Ax boards", "q": "范围过强时需要过牌的原理", "clues": ["checking range", "Solver", "indifferent", "10%"], "a": ["在这些A高牌面上，不使用全范围下注的原因并非我们的范围不够强，恰恰相反，是因为我们的范围过于强大。", "如果对10%底池的下注尺度采用全范围下注，对手将无法建立有效的跟注范围，这对我们自身是不利的。", "当我们的范围在这些牌面上极强时，必须发展出过牌范围（checking range），这在Solver策略中并不常见，但在此类场景下确实会发生。", "为了让对手的任何手牌达到无差别（indifferent）状态，必须采用10%底池的下注尺度，同时需要大量过牌。"], "note": ""}, {"id": "DGL#55-s3", "ep": "55", "type": "topic", "topic": "DGL#55 - 4-bet底池中的翻前加注者：如何在A高翻牌面游戏持续下注", "en": "PFR 4BP IP How to Play Cbets in Ax boards", "q": "10%下注对对手弱牌的决策影响", "clues": ["underpair", "10%"], "a": ["以A-8-3牌面为例，10%底池的下注尺度使得对手无黑桃同花听牌的小对子（underpair）处于无差别状态。", "具体来说，对手的99（无黑桃）、77（无黑桃）、66（无黑桃）等手牌都处于跟注与弃牌无差别的状态。", "如果我们在A-8-3牌面上全范围下注（50-50的混合下注），对手将没有任何理由用这些牌继续游戏。", "对手的这些手牌甚至连零EV的跟注都不存在，他们只会一直弃牌，最终导致我们的EV下降。"], "note": ""}, {"id": "DGL#55-s4", "ep": "55", "type": "topic", "topic": "DGL#55 - 4-bet底池中的翻前加注者：如何在A高翻牌面游戏持续下注", "en": "PFR 4BP IP How to Play Cbets in Ax boards", "q": "给对手留出继续游戏的空间", "clues": ["bet", "top pair", "Ace", "10%"], "a": ["在A低牌面的4-bet底池中，一个有趣的现象是：你需要给对手继续游戏的机会。", "具体做法是采用极小的下注尺度（10%底池），同时大量过牌强牌（包括顶对A）来实现这一目标。", "你必须过牌大量的顶对（top pair）区域，特别是必须过牌一些Ace。", "这对你和对手来说都是一个非常棘手的局面。", "例如，在某个牌面上，KQ红桃（K♥Q♥）这样的带后门听牌的高牌组合处于无差别状态，但这样的组合并不多。"], "note": ""}, {"id": "DGL#55-s5", "ep": "55", "type": "topic", "topic": "DGL#55 - 4-bet底池中的翻前加注者：如何在A高翻牌面游戏持续下注", "en": "PFR 4BP IP How to Play Cbets in Ax boards", "q": "范围优势与EV差距的量化分析", "clues": ["bet", "equity", "over-fold", "70%"], "a": ["在A高牌面的4-bet底池中，我们的EV比对手高出约70%。", "我们的权益（equity）为62%，对手仅为38%。", "鉴于双方范围强度的巨大差异，我们只需要给对手“切一小块蛋糕”（即留出一些继续游戏的空间），就能让对手得以在牌局中继续参与。", "这一点需要特别牢记，尤其是考虑到现实中玩家群体在多个场合普遍存在过度弃牌（over-fold）的倾向。"], "note": ""}, {"id": "DGL#55-s6", "ep": "55", "type": "topic", "topic": "DGL#55 - 4-bet底池中的翻前加注者：如何在A高翻牌面游戏持续下注", "en": "PFR 4BP IP How to Play Cbets in Ax boards", "q": "实战中的频率控制与调整", "clues": ["range c-bet", "mix", "10%"], "a": ["关于具体手牌的第一要点是：你需要控制自己的频率。", "如果对手过度弃牌，那么采用10%底池的全范围翻牌圈持续下注（range c-bet）可能会让你少赚一些钱。", "这是首先需要考虑的因素。", "但原则上，10%底池的下注仍然是正确的方向。", "对于你手中的具体牌型，很可能应该采用混合策略（mix），这完全没有问题。"], "note": ""}, {"id": "DGL#55-c0", "ep": "55", "type": "cloze", "topic": "DGL#55 - 4-bet底池中的翻前加注者：如何在A高翻牌面游戏持续下注", "en": "PFR 4BP IP How to Play Cbets in Ax boards", "q": "软件（Solver）优化的下注尺度绝大多数时候是＿＿底池。", "clues": [], "a": ["在4-bet底池的A高牌面上，软件（Solver）优化的下注尺度绝大多数时候是10%底池。"], "note": "10%"}, {"id": "DGL#55-c1", "ep": "55", "type": "cloze", "topic": "DGL#55 - 4-bet底池中的翻前加注者：如何在A高翻牌面游戏持续下注", "en": "PFR 4BP IP How to Play Cbets in Ax boards", "q": "在A-8-7牌面上，使用＿＿底池下注，但下注频率仅为40%。", "clues": [], "a": ["在A-8-7牌面上，使用10%底池下注，但下注频率仅为40%。"], "note": "10%"}, {"id": "DGL#55-c2", "ep": "55", "type": "cloze", "topic": "DGL#55 - 4-bet底池中的翻前加注者：如何在A高翻牌面游戏持续下注", "en": "PFR 4BP IP How to Play Cbets in Ax boards", "q": "如果对＿＿底池的下注尺度采用全范围下注，对手将无法建立有效的跟注范围，", "clues": [], "a": ["如果对10%底池的下注尺度采用全范围下注，对手将无法建立有效的跟注范围，这对我们自身是不利的。"], "note": "10%"}, {"id": "DGL#55-note", "ep": "55", "type": "note", "topic": "DGL#55 - 4-bet底池中的翻前加注者：如何在A高翻牌面游戏持续下注", "en": "PFR 4BP IP How to Play Cbets in Ax boards", "q": "避坑提醒与行动项", "clues": ["DGL", "bet", "GTO"], "a": ["本视频属于DGL系列（#55），聚焦于4-bet底池中翻前加注者在A高翻牌面的持续下注策略，是该系列中关于翻牌圈玩法的重要一环。视频的核心价值在于揭示了一个反直觉的GTO原理：范围优势过大时反而需要主动过牌来保护对手的继续游戏范围，从而实现自身EV的最大化。这与许多玩家“范围强就多下注”的直觉相反，值得深入理解。", "进一步学习的方向包括：不同转牌（turn）发牌后的下注策略调整、如何在实战中识别并剥削过度弃牌的对手、以及如何在A高牌面上构建平衡的过牌-加注（check-raise）范围。", "- 应该做：在4-bet底池的A高牌面上优先考虑10%底池的小注下注。", "- 应该做：在A-J-2、A-J-5、A-J-10、A-K-3、A-K-9、A-Q-8等特定牌面上可加大到25%底池。", "- 应该做：在A-8-7、A-7-6、A-7-2、A-6-4等牌面上大量过牌，下注频率控制在40%-57%之间。", "- 应该做：过牌一部分顶对A（Ace）来保护过牌范围，给对手留出继续游戏的空间。", "-
