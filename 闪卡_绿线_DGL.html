不要做：在范围优势极大的A高牌面上全范围下注10%底池，这会让对手无法建立跟注范围。", "- 不要做：忽略对手过度弃牌的倾向，面对这类对手需要调整下注频率。"], "note": ""}, {"id": "DGL#56-intro", "ep": "56", "type": "intro", "topic": "DGL#56 - 翻前4bet底池中的有利位置打法：A高翻牌面如何打好第二条街", "en": "PFR 4BP IP How to Play 2nd Barrel in Ax Boards", "q": "DGL#56 - 翻前4bet底池中的有利位置打法：A高翻牌面如何打好第二条街", "clues": ["bet", "Ace-high boards", "double barrel"], "a": ["本视频聚焦于翻前4bet底池（4BP）中，作为有利位置（IP）玩家在A高翻牌面（Ace-high boards）上如何执行转牌持续下注（double barrel）。讲师通过运行GTO求解器报告，展示了在不同转牌牌面结构下的最优下注频率与下注尺度，并重点分析了“去极化”（depolarized）的转牌下注策略。", "视频核心发现是：在A低牌翻牌面（如A-8-7、A-8-3）上，当转牌发出“空白牌”（blank）时，求解器倾向于使用约1/4底池的小尺度下注，且下注频率极高（约80%以上）。这一策略与许多玩家直觉中“转牌应加大下注尺度”的认知不同，其底层逻辑与对手翻牌圈check-raise范围的构成密切相关。", "讲师通过对比不同转牌类别（小牌、中牌、Broadway高牌、同花完成牌）的下注行为差异，系统性地展示了GTO框架下基于牌面结构变化的频率调整原则，并特别指出口袋对子QQ在此类牌面上的具体处理方式。"], "note": ""}, {"id": "DGL#56-s0", "ep": "56", "type": "topic", "topic": "DGL#56 - 翻前4bet底池中的有利位置打法：A高翻牌面如何打好第二条街", "en": "PFR 4BP IP How to Play 2nd Barrel in Ax Boards", "q": "转牌双倍下注的整体频率与尺度分布", "clues": ["bet", "quarter pot", "half pot", "ace high boards"], "a": ["在4bet底池、A高翻牌面情境下，求解器给出的平均转牌双倍下注频率为70%，最常用的下注尺度为25%底池（quarter pot）。", "翻牌圈使用10%底池下注后，转牌圈最常延续使用25%底池尺度；10%尺度在转牌几乎不再使用，仅占5.5%的使用频率。", "半池（half pot）下注在转牌的使用频率为22%，属于次要选择。", "在A高牌面（ace high boards）上，不同具体牌面结构之间存在显著的下注行为差异，需要根据具体翻牌面分别分析。"], "note": ""}, {"id": "DGL#56-s1", "ep": "56", "type": "topic", "topic": "DGL#56 - 翻前4bet底池中的有利位置打法：A高翻牌面如何打好第二条街", "en": "PFR 4BP IP How to Play 2nd Barrel in Ax Boards", "q": "A低牌翻牌面的转牌下注策略", "clues": ["ace low low", "baby cards", "Broadway", "shove"], "a": ["以A-8-7（ace low low）为例，求解器在转牌的下注尺度选择上呈现出明显的分化模式，不同转牌类别对应不同的最优尺度。", "当转牌为小牌（baby cards）时，使用25%底池下注，且下注频率极高——约80%以上的范围都会下注。", "若转牌为带草花的小牌（相当于无关花色牌），几乎整个范围（接近100%）都会使用25%底池下注。", "当转牌为中牌（6到10）时，使用半池下注，且下注频率为中等水平。", "当转牌为Broadway高牌（J、Q、K、A）时，下注尺度显著增大，甚至直接全下（shove）。"], "note": ""}, {"id": "DGL#56-s2", "ep": "56", "type": "topic", "topic": "DGL#56 - 翻前4bet底池中的有利位置打法：A高翻牌面如何打好第二条街", "en": "PFR 4BP IP How to Play 2nd Barrel in Ax Boards", "q": "Broadway转牌的特殊处理", "clues": ["shove", "Broadway", "10%", "25%"], "a": ["在A-8-7翻牌面，若转牌为J♦（方片J，干净方片），求解器直接选择全下（shove），这是一个令讲师感到意外的发现。", "若转牌为K♦（方片K），求解器使用10%底池下注；若转牌为A♦（方片A），则转为25%底池下注且频率接近整个范围。", "在Broadway转牌上，整体策略倾向于增大下注尺度，与低牌转牌的小尺度高频下注形成鲜明对比。"], "note": ""}, {"id": "DGL#56-s3", "ep": "56", "type": "topic", "topic": "DGL#56 - 翻前4bet底池中的有利位置打法：A高翻牌面如何打好第二条街", "en": "PFR 4BP IP How to Play 2nd Barrel in Ax Boards", "q": "同花听牌与双同花听牌转牌的处理", "clues": ["Broadway", "big bet", "check", "25%"], "a": ["当转牌为小牌且形成双同花听牌面（double flush draw）时，下注尺度从25%提升至半池。", "当转牌为Broadway高牌且形成双同花听牌面时，下注尺度进一步增大至大尺度（big bet）。", "当转牌直接完成同花（flush completing cards）且为小牌时，使用半池下注，下注频率为低至中等水平。", "同花完成牌与双同花听牌面都会显著降低下注频率，要求更多过牌（check），而空白牌则支持超高频率下注。"], "note": ""}, {"id": "DGL#56-s4", "ep": "56", "type": "topic", "topic": "DGL#56 - 翻前4bet底池中的有利位置打法：A高翻牌面如何打好第二条街", "en": "PFR 4BP IP How to Play 2nd Barrel in Ax Boards", "q": "空白转牌与QQ的具体处理", "clues": ["indifferent", "80%", "25%", "84%"], "a": ["在A-8-7翻牌面，若转牌为2♥（红桃2，最空白的牌），求解器以约80%的频率使用25%底池下注。", "在A-8-3翻牌面（与A-8-7最相似的牌面），转牌为无关的方片2时，求解器给出84%的双倍下注频率，同样使用25%底池尺度。", "口袋对子QQ在此类牌面上会以较强频率继续下注，属于高频下注范围的一部分。", "25%底池的小尺度下注主要使10s和9s（口袋对子10和9）陷入无差别（indifferent）状态，即跟注与弃牌的EV接近。"], "note": ""}, {"id": "DGL#56-s5", "ep": "56", "type": "topic", "topic": "DGL#56 - 翻前4bet底池中的有利位置打法：A高翻牌面如何打好第二条街", "en": "PFR 4BP IP How to Play 2nd Barrel in Ax Boards", "q": "策略背后的逻辑与对手范围影响", "clues": ["depolarized", "check-raise", "GTO"], "a": ["讲师推测，这种去极化（depolarized）的双倍下注策略高度受对手翻牌圈check-raise范围的影响——对手会用大量A带小踢脚（A-x）组合进行check-raise。", "如果锁定对手在翻牌圈跟注范围中始终包含A-Q和A-J，那么这种去极化策略可能会减弱甚至完全消失。", "但在GTO框架下，求解器确认这种去极化双倍下注策略在该类牌面上是正确的选择。", "讲师指出，视频中玩家实际使用的下注尺度偏小，但根据求解器，这正是应该采取的做法。"], "note": ""}, {"id": "DGL#56-c0", "ep": "56", "type": "cloze", "topic": "DGL#56 - 翻前4bet底池中的有利位置打法：A高翻牌面如何打好第二条街", "en": "PFR 4BP IP How to Play 2nd Barrel in Ax Boards", "q": "求解器给出的平均转牌双倍下注频率为＿＿，最常用的下注尺度为25%底池（quarter pot）。", "clues": [], "a": ["在4bet底池、A高翻牌面情境下，求解器给出的平均转牌双倍下注频率为70%，最常用的下注尺度为25%底池（quarter pot）。"], "note": "70%"}, {"id": "DGL#56-c1", "ep": "56", "type": "cloze", "topic": "DGL#56 - 翻前4bet底池中的有利位置打法：A高翻牌面如何打好第二条街", "en": "PFR 4BP IP How to Play 2nd Barrel in Ax Boards", "q": "使用＿＿底池下注，且下注频率极高——约80%以上的范围都会下注。", "clues": [], "a": ["当转牌为小牌（baby cards）时，使用25%底池下注，且下注频率极高——约80%以上的范围都会下注。"], "note": "25%"}, {"id": "DGL#56-c2", "ep": "56", "type": "cloze", "topic": "DGL#56 - 翻前4bet底池中的有利位置打法：A高翻牌面如何打好第二条街", "en": "PFR 4BP IP How to Play 2nd Barrel in Ax Boards", "q": "若转牌为K♦（方片K），求解器使用＿＿底池下注；若转牌为A♦（方片A），", "clues": [], "a": ["若转牌为K♦（方片K），求解器使用10%底池下注；若转牌为A♦（方片A），则转为25%底池下注且频率接近整个范围。"], "note": "10%"}, {"id": "DGL#56-note", "ep": "56", "type": "note", "topic": "DGL#56 - 翻前4bet底池中的有利位置打法：A高翻牌面如何打好第二条街", "en": "PFR 4BP IP How to Play 2nd Barrel in Ax Boards", "q": "避坑提醒与行动项", "clues": ["DGL", "bet", "GTO"], "a": ["本视频属于DGL系列第56期，承接了前序关于翻前4bet底池中有利位置打法的基础框架，进一步深入到转牌圈的具体执行层面。视频重点展示了GTO求解器在A高牌面上的反直觉结论——小尺度高频下注而非大尺度低频下注，这为玩家理解现代GTO策略提供了重要参考。", "值得进一步学习的方向包括：对手翻牌圈check-raise频率变化时如何调整转牌策略、不同翻牌面结构（如A高双同花面vs A高彩虹面）对转牌下注的影响差异，以及如何在实战中识别并利用对手偏离GTO的倾向。", "**行动项与常见错误：**", "- 在A低牌翻牌面（如A-8-7、A-8-3）上，转牌发出空白牌时应使用约1/4底池的小尺度下注，频率保持在80%以上。", "- 不要在所有转牌上都使用同一尺度——小牌转牌用25%底池，中牌（6-T）转牌用半池，Broadway转牌则加大尺度甚至全下。", "- 当转牌完成同花或形成双同花听牌面时，应显著降低下注频率，增加过牌。", "- 不要因为小尺度下注看起来“太弱”而放弃使用——求解器确认这是GTO最优选择，其效果是让对手的10s、9s等中等口袋对陷入无差别状态。"], "note": ""}, {"id": "DGL#57-intro", "ep": "57", "type": "intro", "topic": "DGL#57 - 翻前加注者在不利位置的三条街打法：开发河牌圈阻挡下注", "en": "PFR 3BP OOP Developing River Blocking Bets", "q": "DGL#57 - 翻前加注者在不利位置的三条街打法：开发河牌圈阻挡下注", "clues": ["PFR", "OOP", "block bet"], "a": ["本视频聚焦于德州扑克中一个被多数玩家严重忽视的高价值场景：在翻前加注者（PFR）处于不利位置（OOP）时，于河牌圈开发并使用阻挡下注（block bet）。讲师明确指出，中级别常规桌玩家普遍缺乏这一策略意识，而理论上阻挡下注是OOP玩家最大化中等强度牌型EV的关键工具。", "视频通过求解器（Solver）数据展示了阻挡下注在河牌圈的极高使用频率——在特定的过牌-跟注线中，44%的下注量应来自阻挡下注。讲师详细拆解了阻挡下注的核心目的（防止被诈唬、提高权益实现率）、适用牌型（第三对子、薄价值牌）、以及面对对手加注时的正确应对框架，并对比了求解器与普通玩家在对抗小注时的频率差异。"], "note": ""}, {"id": "DGL#57-s0", "ep": "57", "type": "topic", "topic": "DGL#57 - 翻前加注者在不利位置的三条街打法：开发河牌圈阻挡下注", "en": "PFR 3BP OOP Developing River Blocking Bets", "q": "阻挡下注的核心目的与价值", "clues": ["block bet", "OOP"], "a": ["阻挡下注（block bet）是OOP玩家在河牌圈最被低估的武器，中级别常规桌玩家普遍使用不足，而理论上这是必须发展的策略。", "当你OOP持有中等强度牌时，阻挡下注能显著提高你的权益实现率（equity realization），因为一旦过牌，对手会加大下注尺度并施加诈唬压力。", "阻挡下注的主要目的并非价值获取，而是避免被对手成功诈唬——通过主动下注控制底池大小，让对手难以用大注施压。", "在翻牌、转牌、河牌的任何OOP场景中，阻挡下注都是最频繁使用的下注尺度，因为你始终会有相当数量的中等强度牌需要保护。"], "note": ""}, {"id": "DGL#57-s1", "ep": "57", "type": "topic", "topic": "DGL#57 - 翻前加注者在不利位置的三条街打法：开发河牌圈阻挡下注", "en": "PFR 3BP OOP Developing River Blocking Bets", "q": "阻挡下注的频率数据", "clues": ["45%", "20%", "44%"], "a": ["在“翻牌小注-转牌过牌-河牌对手过牌”的典型线中，求解器在河牌圈下注频率为45%，其中阻挡下注占20%。", "这意味着20除以45等于44%——即44%的河牌下注量应来自阻挡下注，每100次河牌下注中应有44次是阻挡下注。", "讲师强调，玩家群体几乎肯定没有达到这一频率，这是明显的策略缺口。"], "note": ""}, {"id": "DGL#57-s2", "ep": "57", "type": "topic", "topic": "DGL#57 - 翻前加注者在不利位置的三条街打法：开发河牌圈阻挡下注", "en": "PFR 3BP OOP Developing River Blocking Bets", "q": "河牌阻挡下注的牌型示例", "clues": ["25%", "75%"], "a": ["以J♥河牌为例，求解器建议使用25%（1/4底池）的阻挡下注尺度，而非玩家常用的75%（3/4底池）大注。", "口袋对子TT（第三对子）应作为薄价值牌进行1/4底池下注，而非过牌或大注。", "A9（非同花A9）也应纳入河牌薄价值下注范围，很多玩家会遗漏这类牌型的价值。", "JX组合（如KJ、QJ）属于更强的牌型，更直觉性地适合薄价值下注，但阻挡下注的适用范围远不止于此。"], "note": ""}, {"id": "DGL#57-s3", "ep": "57", "type": "topic", "topic": "DGL#57 - 翻前加注者在不利位置的三条街打法：开发河牌圈阻挡下注", "en": "PFR 3BP OOP Developing River Blocking Bets", "q": "面对阻挡下注的加注应对", "clues": ["renouts", "indifferent", "15%", "16%"], "a": ["求解器面对小尺度阻挡下注时，会发展出约15%-16%的加注频率，同时弃牌频率为23%。", "这一数据是跨所有河牌发牌（renouts）的平均值，说明平衡的对手会通过足够多的加注让你在阻挡下注与过牌之间保持无差别（indifferent）。", "实际对局中，普通玩家（特别是常规玩家）面对河牌小注时，加注频率约为12%-13%，略低于求解器；但弃牌率高达43%，远高于最优的23%。"], "note": ""}, {"id": "DGL#57-s4", "ep": "57", "type": "topic", "topic": "DGL#57 - 翻前加注者在不利位置的三条街打法：开发河牌圈阻挡下注", "en": "PFR 3BP OOP Developing River Blocking Bets", "q": "玩家常见错误与调整方向", "clues": ["range bet", "75%", "25%", "43%"], "a": ["玩家最常犯的错误是过度使用75%（3/4底池）的大注，而忽视25%（1/4底池）的阻挡下注尺度。", "在翻牌圈使用小注范围下注（range bet）是完全可以接受的，EV损失很小，但转牌和河牌需要根据牌力分化策略。", "转牌圈不应继续下注所有诈唬牌、中等对子或第二/第三对子，应大量过牌，为河牌的阻挡下注创造机会。", "面对阻挡下注时，普通玩家过度弃牌（43% vs 最优23%）是明显的剥削点，应增加跟注频率。"], "note": ""}, {"id": "DGL#57-c1", "ep": "57", "type": "cloze", "topic": "DGL#57 - 翻前加注者在不利位置的三条街打法：开发河牌圈阻挡下注", "en": "PFR 3BP OOP Developing River Blocking Bets", "q": "求解器在河牌圈下注频率为＿＿，其中阻挡下注占20%。", "clues": [], "a": ["在“翻牌小注-转牌过牌-河牌对手过牌”的典型线中，求解器在河牌圈下注频率为45%，其中阻挡下注占20%。"], "note": "45%"}, {"id": "DGL#57-c2", "ep": "57", "type": "cloze", "topic": "DGL#57 - 翻前加注者在不利位置的三条街打法：开发河牌圈阻挡下注", "en": "PFR 3BP OOP Developing River Blocking Bets", "q": "求解器建议使用＿＿（1/4底池）的阻挡下注尺度，而非玩家常用的75%（3/4底池）大注。", "clues": [], "a": ["以J♥河牌为例，求解器建议使用25%（1/4底池）的阻挡下注尺度，而非玩家常用的75%（3/4底池）大注。"], "note": "25%"}, {"id": "DGL#57-c3", "ep": "57", "type": "cloze", "topic": "DGL#57 - 翻前加注者在不利位置的三条街打法：开发河牌圈阻挡下注", "en": "PFR 3BP OOP Developing River Blocking Bets", "q": "会发展出约＿＿-16%的加注频率，同时弃牌频率为23%。", "clues": [], "a": ["求解器面对小尺度阻挡下注时，会发展出约15%-16%的加注频率，同时弃牌频率为23%。"], "note": "15%"}, {"id": "DGL#57-note", "ep": "57", "type": "note", "topic": "DGL#57 - 翻前加注者在不利位置的三条街打法：开发河牌圈阻挡下注", "en": "PFR 3BP OOP Developing River Blocking Bets", "q": "避坑提醒与行动项", "clues": ["DGL", "PFR", "bet"], "a": ["本视频属于DGL系列第57期，聚焦于翻前加注者（PFR）在3-bet底池中处于不利位置（OOP）的河牌圈策略。视频内容建立在前期翻牌、转牌策略的基础上，是系列中关于河牌圈阻挡下注的专项讲解。讲师通过求解器数据与玩家行为对比，揭示了理论与实践之间的巨大差距。", "值得进一步学习的方向包括：阻挡下注在不同翻牌面结构（静态/动态）下的频率差异、面对不同对手类型时的剥削性调整、以及如何构建包含阻挡下注的完整河牌范围。建议结合实战手牌复盘，刻意练习在OOP河牌圈使用1/4底池的阻挡下注，并观察对手的加注与弃牌倾向。", "**行动项与常见错误：**", "- 应该做：在OOP河牌圈，用第三对子、A9等中等强度牌主动下注1/4底池，而非过牌或大注。", "- 应该做：将河牌下注量的44%分配给阻挡下注，确保频率达标。", "- 应该做：面对对手的小注阻挡下注时，将弃牌率控制在23%左右，而非43%。", "- 不要做：在转牌圈继续下注所有第二/第三对子，应大量过牌为河牌阻挡下注做准备。", "- 不要做：只依赖75%底池的大注，忽视25%底池的薄价值下注尺度。"], "note": ""}, {"id": "DGL#58-intro", "ep": "58", "type": "intro", "topic": "DGL#58 - 翻前3-bet底池中，有利位置玩家在翻牌圈面对对手过牌时的下注策略", "en": "PFC 3BP IP Stabbing Strategy vs Missed Cbet", "q": "DGL#58 - 翻前3-bet底池中，有利位置玩家在翻牌圈面对对手过牌时的下注策略", "clues": ["bet", "OOP", "Solver"], "a": ["本视频聚焦于翻前3-bet底池（3BP）中，作为有利位置（IP）玩家，当对手（不利位置OOP玩家）在翻牌圈过牌后，Solver（最优策略求解器）所采用的下注策略。讲师通过分析Solver在多种翻牌面纹理下的下注频率与尺度，总结出IP玩家“stabbing”（刺探性下注）的核心规律。", "视频核心结论是：Solver在所有翻牌面纹理上的刺探下注频率约为46%，且最常用的下注尺度是1/4底池（quarter pot）。讲师强烈建议采用单一尺度策略，避免混合使用不同尺度，并指出在特定高张牌（Broadway）翻牌面上，应切换为1/2底池（half pot）的极化下注。", "视频通过具体牌例（如A93、KT3、K33、T64等翻牌面）展示了何时该用1/4底池、何时该用1/2底池，为玩家提供了清晰、可执行的翻牌圈决策框架。"], "note": ""}, {"id": "DGL#58-s0", "ep": "58", "type": "topic", "topic": "DGL#58 - 翻前3-bet底池中，有利位置玩家在翻牌圈面对对手过牌时的下注策略", "en": "PFC 3BP IP Stabbing Strategy vs Missed Cbet", "q": "Solver整体下注频率与尺度分布", "clues": ["Solver", "quarter pot", "mostly noise", "46%"], "a": ["Solver作为IP玩家，在所有翻牌面纹理上的刺探下注频率约为46%。", "最高频使用的下注尺度是1/4底池（quarter pot），这是默认首选。", "Solver在某些纹理下会使用1/2底池，偶尔出现2/3底池，但讲师认为2/3底池“mostly noise”（大部分是噪音），不建议玩家采用。", "讲师明确建议：翻牌圈应采用单一尺度策略，不要混合使用1/4底池与2/3底池，只选一种。"], "note": ""}, {"id": "DGL#58-s1", "ep": "58", "type": "topic", "topic": "DGL#58 - 翻前3-bet底池中，有利位置玩家在翻牌圈面对对手过牌时的下注策略", "en": "PFC 3BP IP Stabbing Strategy vs Missed Cbet", "q": "单一尺度策略的推荐", "clues": ["quarter pot", "half pot", "tags"], "a": ["如果只选一种尺度，几乎总是选择1/4底池（quarter pot）。", "1/2底池（half pot）仅用于少数特定翻牌面纹理（tags，即高张牌翻牌面）。", "避免在翻牌圈混用多种尺度，保持策略简洁与一致性。"], "note": ""}, {"id": "DGL#58-s2", "ep": "58", "type": "topic", "topic": "DGL#58 - 翻前3-bet底池中，有利位置玩家在翻牌圈面对对手过牌时的下注策略", "en": "PFC 3BP IP Stabbing Strategy vs Missed Cbet", "q": "高张牌翻牌面（Broadway Flops）的极化下注", "clues": ["A93", "Ace-nine-three", "KT3", "King-ten-three"], "a": ["在特定高张牌翻牌面上，1/2底池是首选尺度，而非1/4底池。", "典型牌例：A93（Ace-nine-three，两张同花）翻牌面，1/2底池是首选。", "典型牌例：KT3（King-ten-three，两张同花）翻牌面，1/2底池是首选。", "典型牌例：K33（King-three-three）翻牌面，1/2底池是首选。", "其他高张牌翻牌面如QJ4（Queen-Jack-four）、KT2（King-ten-deuce）也适用1/2底池。", "讲师观察到：大量Ace-high（Ace-ex）翻牌面，IP玩家应采用更极化的范围进行刺探下注。"], "note": ""}, {"id": "DGL#58-s3", "ep": "58", "type": "topic", "topic": "DGL#58 - 翻前3-bet底池中，有利位置玩家在翻牌圈面对对手过牌时的下注策略", "en": "PFC 3BP IP Stabbing Strategy vs Missed Cbet", "q": "非高张牌翻牌面的默认策略", "clues": ["T64", "A84", "Broadway Boards"], "a": ["对于非高张牌翻牌面（如T64彩虹面、A84等），默认使用1/4底池尺度。", "高张牌翻牌面（Broadway Boards）用1/2底池，其余所有翻牌面用1/4底池，这是讲师给出的核心决策规则。"], "note": ""}, {"id": "DGL#58-s4", "ep": "58", "type": "topic", "topic": "DGL#58 - 翻前3-bet底池中，有利位置玩家在翻牌圈面对对手过牌时的下注策略", "en": "PFC 3BP IP Stabbing Strategy vs Missed Cbet", "q": "高张牌翻牌面的范围特征", "clues": ["bet", "You", "re not really", "doing all that"], "a": ["在高张牌翻牌面上，IP玩家（作为翻前3-bet方）的范围优势并不明显，因此不适合频繁下注。", "讲师指出：“You're not really doing all that on those Broadway Flops”，即在高张牌翻牌面上，IP玩家不应过度激进。", "高张牌翻牌面更适合采用极化范围（polarized range）配合1/2底池尺度进行刺探。"], "note": ""}, {"id": "DGL#58-c0", "ep": "58", "type": "cloze", "topic": "DGL#58 - 翻前3-bet底池中，有利位置玩家在翻牌圈面对对手过牌时的下注策略", "en": "PFC 3BP IP Stabbing Strategy vs Missed Cbet", "q": "Solver作为IP玩家，在所有翻牌面纹理上的刺探下注频率约为＿＿。", "clues": [], "a": ["Solver作为IP玩家，在所有翻牌面纹理上的刺探下注频率约为46%。"], "note": "46%"}, {"id": "DGL#58-note", "ep": "58", "type": "note", "topic": "DGL#58 - 翻前3-bet底池中，有利位置玩家在翻牌圈面对对手过牌时的下注策略", "en": "PFC 3BP IP Stabbing Strategy vs Missed Cbet", "q": "避坑提醒与行动项", "clues": ["DGL", "Deep Game Logic", "bet"], "a": ["本视频是DGL系列（Deep Game Logic）第58期，聚焦于翻前3-bet底池中IP玩家的翻牌圈刺探下注策略。视频内容建立在Solver分析基础上，为玩家提供了清晰的尺度选择框架：默认1/4底池，高张牌翻牌面切换为1/2底池。这一策略简洁易执行，适合作为翻牌圈决策的起点。", "建议进一步学习的方向包括：翻牌圈过牌后的转牌策略、不同筹码深度下的尺度调整、以及如何根据对手的过牌频率进行剥削性调整。", "**行动项与常见错误：**", "- 应该这样做：翻牌圈默认使用1/4底池刺探下注，频率约46%。", "- 应该这样做：在高张牌翻牌面（如A93、KT3、K33）切换为1/2底池极化下注。", "- 不要这样做：不要在翻牌圈混合使用1/4底池与2/3底池，坚持单一尺度。", "- 不要这样做：不要忽视高张牌翻牌面的范围劣势，避免过度下注。"], "note": ""}, {"id": "DGL#59-intro", "ep": "59", "type": "intro", "topic": "DGL#59 - 翻前与翻牌单次下注尺度策略：过度简化之谬误", "en": "PFR SRP IP The Fallacy of Over Simplification", "q": "DGL#59 - 翻前与翻牌单次下注尺度策略：过度简化之谬误", "clues": ["GTO"], "a": ["本视频围绕一个常见问题展开：能否在翻牌圈统一使用一个小尺度下注来简化策略？讲师明确指出这是可行的，但强调早期街（翻前与翻牌）的下注尺度选择被严重高估，其对于整体EV（期望值）的最终影响远不如玩家直觉中那么重要。核心论点在于，GTO策略的本质并非单纯依赖某一街的下注尺度，而是通过整棵游戏树上的后续策略调整来维持对手的“无差别状态”。", "讲师用较为进阶的理论解释了这一现象：当你处于游戏树的某个节点时，下注尺度的首要目标是让对手范围中的某些牌型变得无差别（即跟注与弃牌EV相等）。而实现这一目标的关键变量，并不仅仅是当前街的下注大小，更在于你未来街（转牌与河牌）的策略组合，尤其是转牌的双重下注频率。因此，翻牌圈采用小尺度或大尺度，最终模拟出的整体EV会非常接近，因为软件会自动调整后续策略来补偿。", "最后，讲师对比了早期街与后期街下注尺度的重要性差异。由于转牌和河牌之后几乎没有调整空间，后期街的下注尺度错误是致命的，会立即导致EV损失。而早期街的错误则可以通过后续街的策略补偿来挽回。这一认知有助于玩家打破对翻牌圈尺度“精确匹配”的执念，将更多精力投入到后续街的策略执行上。"], "note": ""}, {"id": "DGL#59-s0", "ep": "59", "type": "topic", "topic": "DGL#59 - 翻前与翻牌单次下注尺度策略：过度简化之谬误", "en": "PFR SRP IP The Fallacy of Over Simplification", "q": "简化策略的可行性", "clues": [], "a": ["许多玩家会问：“为什么不在每个翻牌面都统一使用小尺度下注来简化策略？”讲师明确回答：这是完全可行的。", "讲师通常会告诉这类玩家：早期街（翻前与翻牌）的下注尺度选择被严重高估，它对于整体EV的发展并不是极其重要的因素。", "这一结论的前提是你必须理解后续街策略的补偿机制，而非仅仅机械地使用统一尺度。"], "note": ""}, {"id": "DGL#59-s1", "ep": "59", "type": "topic", "topic": "DGL#59 - 翻前与翻牌单次下注尺度策略：过度简化之谬误", "en": "PFR SRP IP The Fallacy of Over Simplification", "q": "GTO中的无差别状态生成", "clues": ["GTO"], "a": ["当你处于游戏树的某个节点（如翻牌或翻前）并希望使用某个下注尺度时，策略的首要目标是：在对手的回应中生成一定程度的无差别状态。", "达到均衡的唯一途径，就是在对手的策略中生成某种水平的无差别。这是理解GTO策略的一个非常重要的核心概念。", "你必须将下注尺度视为一种工具，其用途是在对手范围中的某个手牌区域生成无差别状态。"], "note": ""}, {"id": "DGL#59-s2", "ep": "59", "type": "topic", "topic": "DGL#59 - 翻前与翻牌单次下注尺度策略：过度简化之谬误", "en": "PFR SRP IP The Fallacy of Over Simplification", "q": "小尺度下注的实战示例", "clues": [], "a": ["以翻牌面 K-7-2 彩虹面为例，如果你下注小尺度，你可以用范围中绝大部分手牌进行下注。", "你是在非常频繁地利用整个范围来生成无差别状态，并且能在对手范围中一个非常显著的手牌区域内制造无差别。", "观察所有那些非同花手牌，它们都会因为小尺度下注而变得无差别。务必记住：非同花手牌的数量远多于同花手牌。", "让所有这些非同花手牌变得无差别，对你而言价值巨大。扑克是零和游戏，如果你将对手范围中某些手牌的EV降至零，就意味着你范围中某些手牌的EV得到了提升。"], "note": ""}, {"id": "DGL#59-s3", "ep": "59", "type": "topic", "topic": "DGL#59 - 翻前与翻牌单次下注尺度策略：过度简化之谬误", "en": "PFR SRP IP The Fallacy of Over Simplification", "q": "早期街下注尺度的真正作用机制", "clues": [], "a": ["在讨论早期街策略时，关键在于：翻牌或翻前的下注尺度，只是你用来生成对手无差别状态的众多变量之一。", "当你下注翻牌时，真正用来生成无差别状态的并非仅仅是下注尺度本身，而是所有未来节点上的策略组合。", "你的转牌双倍下注频率（double barrel frequency）对于在翻牌圈生成无差别状态至关重要。", "如果你在翻牌下注小尺度，但转牌圈严重缺乏双倍下注，你就无法生成任何无差别状态。对手可以用任意两张牌漂浮跟注，因为他总能实现权益，看到河牌并在河牌圈诈唬你。"], "note": ""}, {"id": "DGL#59-s4", "ep": "59", "type": "topic", "topic": "DGL#59 - 翻前与翻牌单次下注尺度策略：过度简化之谬误", "en": "PFR SRP IP The Fallacy of Over Simplification", "q": "早期街与后期街的EV补偿机制", "clues": [], "a": ["在早期街，你有很多手段可以在后续街生成无差别状态。这就是为什么用不同尺度求解翻牌（小尺度、大尺度、更小尺度），最终所有模拟的整体EV都会非常接近。", "软件会自动调整未来街的策略来维持那种无差别状态。例如，翻牌下注更小，对手获得更好的跟注赔率，他会开始更多漂浮跟注。", "但你可以通过提高转牌双倍下注频率来对抗这一点。对手范围变弱，你双倍下注更多，从而抵消了他在翻牌获得的更低底池赔率。", "因此，早期街下注尺度对整体EV权重并不重要，因为你总能在后续街补偿它。"], "note": ""}, {"id": "DGL#59-s5", "ep": "59", "type": "topic", "topic": "DGL#59 - 翻前与翻牌单次下注尺度策略：过度简化之谬误", "en": "PFR SRP IP The Fallacy of Over Simplification", "q": "后期街下注尺度的不可逆性", "clues": [], "a": ["恰恰相反，这正是转牌和河牌上下注尺度极其重要的原因：因为此时你几乎没有机会去弥补潜在的理论错误。", "如果你在河牌圈犯了下注尺度的错误，那是无法挽回的。你会立即损失EV，没有任何调整空间。", "讲师强调：早期街尺度不重要的根本原因，在于你总能调整未来街策略来维持早期街的无差别状态。"], "note": ""}, {"id": "DGL#59-note", "ep": "59", "type": "note", "topic": "DGL#59 - 翻前与翻牌单次下注尺度策略：过度简化之谬误", "en": "PFR SRP IP The Fallacy of Over Simplification", "q": "避坑提醒与行动项", "clues": ["DGL", "SRP", "GTO"], "a": ["本视频属于DGL系列（第59期），聚焦于翻前单次加注底池（SRP）且有位置（IP）的场景。视频内容承接了之前关于简化策略的讨论，并引入了更深层的GTO理论视角，帮助玩家理解为何不应过度纠结于翻牌圈的精确尺度选择。值得进一步学习的方向包括：转牌与河牌圈的具体下注尺度选择逻辑，以及如何根据对手的漂浮频率动态调整双倍下注频率。", "**行动项与常见错误：**", "- 不要做：在翻牌圈花费过多精力追求“完美”的下注尺度，而忽略了后续街的策略连贯性。", "- 应该做：将翻牌小尺度下注与高频率的转牌双倍下注配套使用，以维持对手的无差别状态。", "- 应该做：在河牌圈下注前反复确认尺度，因为这是无法通过后续行动补偿的最终决策点。"], "note": ""}, {"id": "DGL#60-intro", "ep": "60", "type": "intro", "topic": "DGL#60 - 翻前加注者单次加注底池中有利位置持续下注尺度启发式策略", "en": "PFR SRP IP Cbet Sizes Heuristics", "q": "DGL#60 - 翻前加注者单次加注底池中有利位置持续下注尺度启发式策略", "clues": ["PFR", "SRP", "bet"], "a": ["本视频聚焦于翻前加注者（PFR）在单次加注底池（SRP）中处于有利位置（IP）时的翻牌圈持续下注（c-bet）尺度选择问题。讲师提出了一套极其简化的启发式框架：将翻牌圈下注尺度分为小、中、大（超池）三档，并指出核心任务仅在于判断哪些牌面不适用小尺度，因为绝大多数牌面都应以小尺度为主。这一框架大幅降低了翻牌圈决策的复杂度。", "视频的核心观点是，牌面结构（尤其是连通性、是否有顺子可能、花色组合）直接决定了下注尺度的选择。低半连通双色牌面（无顺子可能）应使用超池下注，以最大化高对优势并迫使对手弃掉高牌与后门听牌；而存在顺子可能的低连通牌面则适合中等尺度。同时，讲师强调了平衡范围的重要性，并详细列出了在双高张双色牌面上作为诈唬来源的各类牌型组合。", "最后，讲师着重指出了玩家在实战中普遍存在的严重问题——诈唬不足（under bluffing）。由于缺乏足够的诈唬组合（如低对、底对、A嗨非同花牌等），玩家在转牌圈会面临被对手过度探注（over-probing）剥削的困境。视频提供了具体的牌型示例和行动指导，帮助玩家构建更平衡、更难被剥削的范围。"], "note": ""}, {"id": "DGL#60-s0", "ep": "60", "type": "topic", "topic": "DGL#60 - 翻前加注者单次加注底池中有利位置持续下注尺度启发式策略", "en": "PFR SRP IP Cbet Sizes Heuristics", "q": "三档下注尺度框架", "clues": [], "a": ["翻牌圈持续下注仅需三种尺度：小、中、大（超池）。绝大多数牌面使用小尺度，因此实战中只需判断哪些牌面不适用小尺度即可。", "小尺度通常为1/3底池左右，适用于大多数干燥或低冲突牌面；中尺度适用于中等连通牌面；大尺度（超池）适用于特定低半连通双色牌面。", "该框架的核心逻辑是：先确定哪些牌面必须用大尺度或中尺度，剩余牌面一律用小尺度，从而大幅简化决策过程。"], "note": ""}, {"id": "DGL#60-s1", "ep": "60", "type": "topic", "topic": "DGL#60 - 翻前加注者单次加注底池中有利位置持续下注尺度启发式策略", "en": "PFR SRP IP Cbet Sizes Heuristics", "q": "超池下注适用牌面", "clues": [], "a": ["超池下注主要适用于低半连通双色牌面，即点数较低（9高或更低）、无顺子可能、且以双色为主的牌面，偶尔也出现在彩虹面。", "典型牌面包括：T-7双色、Q-Q双色（皇后对子双色）、双高张双色牌面（如K-T双色、A-K双色）、T-9-4双色、J-8-6双色（因高牌多可视为低牌面）。", "双高张双色牌面中，含A的牌面（如A-K双色、A-Q双色）使用超池下注的频率最高，甚至彩虹面也适用；但不含A的双高张彩虹面（如K-T-3彩虹）仍应使用小尺度。", "核心逻辑：在低半连通双色牌面上，翻前加注者拥有巨大的高对优势，通过超池下注迫使对手弃掉所有高牌和后门听牌，同时让对手用被压制的一对牌型跟注。"], "note": ""}, {"id": "DGL#60-s2", "ep": "60", "type": "topic", "topic": "DGL#60 - 翻前加注者单次加注底池中有利位置持续下注尺度启发式策略", "en": "PFR SRP IP Cbet Sizes Heuristics", "q": "中等尺度适用牌面", "clues": ["T8o"], "a": ["中等尺度适用于低牌面但存在顺子可能，或连通性显著导致后续发牌极易出现顺子的牌面。", "典型牌面包括：9-6-5（超池过大、小尺度过小，中等尺度最佳）、J-9-7（对手范围中存在T8o等顺子组合）。", "这类牌面中，超池下注会过度膨胀底池且无法有效保护高对权益，小尺度又不足以建立足够底池赔率压力，因此中等尺度是平衡选择。"], "note": ""}, {"id": "DGL#60-s3", "ep": "60", "type": "topic", "topic": "DGL#60 - 翻前加注者单次加注底池中有利位置持续下注尺度启发式策略", "en": "PFR SRP IP Cbet Sizes Heuristics", "q": "牌面结构对尺度的影响", "clues": ["50%"], "a": ["以K-Q-7双色为例：求解器显示约50%的频率选择过牌，超池下注是最常用的下注尺度，且范围同时包含价值与诈唬组合。", "将同一牌面改为K-Q-7彩虹后，过牌频率显著增加，小尺度成为最常用下注尺度。", "若仅允许单一尺度策略，求解器会优先选择小尺度，因为其能产生最高的期望值（EV）。", "结论：花色组合（双色vs彩虹）对尺度选择影响巨大，双色牌面显著提升超池下注的使用频率。"], "note": ""}, {"id": "DGL#60-s4", "ep": "60", "type": "topic", "topic": "DGL#60 - 翻前加注者单次加注底池中有利位置持续下注尺度启发式策略", "en": "PFR SRP IP Cbet Sizes Heuristics", "q": "低对作为诈唬组合", "clues": ["stakes"], "a": ["在双高张双色牌面上，低口袋对子（如44、55、66等）是极佳的诈唬组合，即使没有后门同花听牌也应积极下注。", "这些低对不阻挡对手的弃牌范围（即不阻挡高牌组合），且拥有在后续发牌中击中暗三条的潜在权益，可在河牌圈从对手的抓诈唬牌型中获取最大价值。", "该启发式策略对中高 stakes 玩家较为熟悉，但低 stakes 玩家在双高张双色牌面上的执行能力明显不足。"], "note": ""}, {"id": "DGL#60-s5", "ep": "60", "type": "topic", "topic": "DGL#60 - 翻前加注者单次加注底池中有利位置持续下注尺度启发式策略", "en": "PFR SRP IP Cbet Sizes Heuristics", "q": "诈唬组合的完整构成", "clues": ["A5o", "A6o", "T6s", "J6s"], "a": ["求解器在双高张双色牌面上使用的诈唬组合包括：低口袋对子、同花听牌、顺子听牌、A嗨非同花牌（如A5o、A6o）、底对以及少量随机纯空气牌。", "A嗨非同花牌至关重要，若范围中缺少这些组合，将在大量转牌/河牌发牌中严重诈唬不足，导致对手过度弃牌而被剥削。", "底对（如7-5、6-5、5-4等）在双高张双色牌面上同样被大量用作诈唬，其效果与低对类似，且阻挡牌效应更优。", "随机纯空气牌（如T6s、J6s等）虽使用频率极低，但为保持后续街平衡（即牌面覆盖）仍是必要的，绝大多数玩家（甚至顶级玩家）都未能充分执行这一点。"], "note": ""}, {"id": "DGL#60-s6", "ep": "60", "type": "topic", "topic": "DGL#60 - 翻前加注者单次加注底池中有利位置持续下注尺度启发式策略", "en": "PFR SRP IP Cbet Sizes Heuristics", "q": "诈唬不足的剥削风险", "clues": ["over-fold", "over-probing"], "a": ["诈唬不足是扑克中的严重问题，因为大多数对手会过度弃牌（over-fold），导致诈唬不足者被系统性剥削。", "具体表现：翻牌圈检查过弱范围后，转牌圈对手会过度探注（over-probing），迫使诈唬不足者过度弃牌，从而损失大量底池。", "解决之道：构建合理的范围结构，确保在大多数转牌/河牌发牌中拥有足够的诈唬组合，避免被对手利用。"], "note": ""}, {"id": "DGL#60-s7", "ep": "60", "type": "topic", "topic": "DGL#60 - 翻前加注者单次加注底池中有利位置持续下注尺度启发式策略", "en": "PFR SRP IP Cbet Sizes Heuristics", "q": "实战执行清单", "clues": [], "a": ["在低半连通双色牌面（无顺子可能）上，用高对和超强牌执行超池下注，迫使对手弃掉高牌与后门听牌。", "在存在顺子可能的低连通牌面上，使用中等尺度下注，避免超池或小尺度的极端选择。", "在双高张双色牌面上，积极用低对、底对、同花/顺子听牌及A嗨非同花牌进行诈唬下注。", "避免在彩虹高牌面（如K-T-3彩虹）上过度使用超池下注，坚持小尺度策略。"], "note": ""}, {"id": "DGL#60-c3", "ep": "60", "type": "cloze", "topic": "DGL#60 - 翻前加注者单次加注底池中有利位置持续下注尺度启发式策略", "en": "PFR SRP IP Cbet Sizes Heuristics", "q": "以K-Q-7双色为例：求解器显示约＿＿的频率选择过牌，", "clues": [], "a": ["以K-Q-7双色为例：求解器显示约50%的频率选择过牌，超池下注是最常用的下注尺度，且范围同时包含价值与诈唬组合。"], "note": "50%"}, {"id": "DGL#60-note", "ep": "60", "type": "note", "topic": "DGL#60 - 翻前加注者单次加注底池中有利位置持续下注尺度启发式策略", "en": "PFR SRP IP Cbet Sizes Heuristics", "q": "避坑提醒与行动项", "clues": ["DGL", "Deep Game Logic", "PioSOLVER"], "a": ["本视频属于DGL系列（Deep Game Logic）第60期，聚焦于翻前加注者单次加注底池中的翻牌圈持续下注尺度选择。该系列此前已讨论过翻前范围构建与翻牌圈策略基础，本视频则进一步细化为具体的尺度启发式规则，适合已掌握基础范围概念的玩家深入学习。视频中提到的“本周视频”可能指同系列中关于剥削与反剥削的专题，建议配合观看以理解诈唬不足被剥削的完整逻辑。", "进一步学习方向包括：转牌圈与河牌圈的持续下注策略、不同筹码深度下的尺度调整、以及如何根据对手倾向（过度弃牌或过度跟注）动态调整诈唬频率。此外，求解器软件的实操练习（如PioSOLVER或GTO+）可帮助验证本视频中的启发式规则在不同牌面结构下的适用性。", "**行动项与常见错误：**", "- 应该做：在低半连通双色牌面上用高对超池下注，在双高张双色牌面上用低对和底对积极诈唬。", "- 应该做：确保范围中包含足够的A嗨非同花牌和随机纯空气牌，以维持后续街的诈唬频率。", "- 不应该做：在存在顺子可能的低连通牌面上使用超池下注，或在彩虹高牌面上过度使用超池下注。", "- 不应该做：翻牌圈检查过弱范围后，在转牌圈面对探注时过度弃牌——这通常是诈唬不足的直接后果。"], "note": ""}, {"id": "DGL#61-intro", "ep": "61", "type": "intro", "topic": "DGL#61 - 单次加注底池中，有利位置玩家在探针下注线下的跟注阈值研究", "en": "PFR SRP IP Calling Thresholds in Probe Lines", "q": "DGL#61 - 单次加注底池中，有利位置玩家在探针下注线下的跟注阈值研究", "clues": ["SRP", "probe bet"], "a": ["本视频聚焦于单次加注底池（SRP）中，有利位置（IP）玩家面对对手探针下注（probe bet）时的跟注阈值问题。讲师指出，许多玩家在翻牌圈检查范围构建不当，导致在转牌或河牌面对探针下注时过度弃牌，从而损失大量EV。核心解决方案是研究并掌握不同下注尺度下的跟注阈值，同时修正翻牌圈的过牌频率。", "视频通过具体牌面（如K♥7♦、Q♠J♣8♦）和多个示例手牌，展示了如何分析检查范围、识别薄弱环节，并给出了改善执行力的具体建议。讲师强调，玩家应避免过度弃牌，尤其是在面对小尺度探针下注时，需要保留更多中等强度手牌进行跟注。", "视频还对比了不同下注尺度（小尺度、3/4底池、超池下注）下的应对策略，并指出翻牌圈检查范围的缺陷会直接导致后续街的被动局面。最终目标是帮助玩家将单次加注底池中的IP执行评分从6-8分提升至接近10分。"], "note": ""}, {"id": "DGL#61-s0", "ep": "61", "type": "topic", "topic": "DGL#61 - 单次加注底池中，有利位置玩家在探针下注线下的跟注阈值研究", "en": "PFR SRP IP Calling Thresholds in Probe Lines", "q": "翻牌圈检查范围构建的重要性", "clues": [], "a": ["以K♥7♦翻牌面为例，讲师指出，如果玩家不想在翻牌圈下注（例如担心过牌-加注过多或不想早期投入），就必须确保检查范围中包含足够的强牌（如KQ、KJ、KT）。", "若检查范围过弱，对手会频繁进行探针下注，导致玩家被迫弃掉大量边缘牌，损失EV。讲师强调，这是单次加注底池中IP玩家最常见的错误之一。", "具体数据：在K♥7♦翻牌面，玩家应检查KQ、KJ、KT等牌，而不是全部下注；同时应避免用J♦6♦、J♣6♣等垃圾牌下注，否则检查范围将变得极其薄弱。"], "note": ""}, {"id": "DGL#61-s1", "ep": "61", "type": "topic", "topic": "DGL#61 - 单次加注底池中，有利位置玩家在探针下注线下的跟注阈值研究", "en": "PFR SRP IP Calling Thresholds in Probe Lines", "q": "探针下注的常见尺度与应对", "clues": ["overbet"], "a": ["讲师列出对手在探针下注时最常用的三种尺度：小尺度（约1/3底池）、3/4底池尺度、超池下注（overbet）。", "面对小尺度探针下注时，玩家需要明确跟注阈值，不能仅凭直觉认为某些牌应直接弃牌。例如在Q♠J♣8♦翻牌面转牌5♦时，应继续跟注口袋对子3、4、6、7以及所有卡顺听牌（如K6、A3等）。", "讲师指出，许多玩家在面对小尺度探针时过度弃牌，尤其是口袋对子类手牌，这是巨大的EV损失点。"], "note": ""}, {"id": "DGL#61-s2", "ep": "61", "type": "topic", "topic": "DGL#61 - 单次加注底池中，有利位置玩家在探针下注线下的跟注阈值研究", "en": "PFR SRP IP Calling Thresholds in Probe Lines", "q": "具体牌例分析：Q♠J♣8♦翻牌面", "clues": [], "a": ["在Q♠J♣8♦翻牌面，转牌为5♦时，玩家应保留的跟注范围包括：口袋对子3、4、6、7，所有卡顺听牌（如K6、A3），以及部分高牌组合。", "讲师强调，玩家在翻牌圈应更多过牌QJ、KQ等强牌，而不是全部下注。若翻牌圈检查范围过窄，转牌面对探针时范围将充满空气牌，导致被迫过度弃牌。", "若转牌为更低的牌（如2♦），玩家范围中可能只剩76s（同花76）和口袋对子7及以下，此时面对下注几乎无法继续，进一步凸显翻牌圈检查范围构建的缺陷。"], "note": ""}, {"id": "DGL#61-s3", "ep": "61", "type": "topic", "topic": "DGL#61 - 单次加注底池中，有利位置玩家在探针下注线下的跟注阈值研究", "en": "PFR SRP IP Calling Thresholds in Probe Lines", "q": "跟注阈值的核心原则", "clues": ["over-call"], "a": ["讲师提出，玩家必须研究不同探针下注尺度下的跟注阈值，即哪些手牌应该跟注、哪些应该弃牌。没有启发式规则时，玩家会本能地将边缘牌视为纯弃牌，这是错误的。", "面对转牌探针下注时，应倾向于过度跟注（over-call），因为下一街（河牌）仍有额外EV可获取。讲师明确表示：“应该过度跟注，因为下一街还有额外EV。”", "具体执行建议：在单次加注底池中，IP玩家应停止对任何下注（翻牌、转牌、河牌）的过度弃牌，尤其是在构建检查范围时。"], "note": ""}, {"id": "DGL#61-s4", "ep": "61", "type": "topic", "topic": "DGL#61 - 单次加注底池中，有利位置玩家在探针下注线下的跟注阈值研究", "en": "PFR SRP IP Calling Thresholds in Probe Lines", "q": "常见错误与改进方向", "clues": [], "a": ["讲师指出，玩家最常见的错误是翻牌圈检查范围过弱，导致后续街面对探针时范围充满垃圾牌，进而过度弃牌。", "另一个错误是翻牌圈下注频率过高，尤其是用KQ、KJ等强牌下注，导致检查范围失去强度。正确做法是保留这些强牌在检查范围中，以平衡整体策略。", "改进方向：首先修正翻牌圈的过牌策略，确保检查范围包含足够强牌；其次研究并记住不同探针尺度下的跟注阈值；最后在实战中刻意执行，避免凭直觉弃牌。"], "note": ""}, {"id": "DGL#61-s5", "ep": "61", "type": "topic", "topic": "DGL#61 - 单次加注底池中，有利位置玩家在探针下注线下的跟注阈值研究", "en": "PFR SRP IP Calling Thresholds in Probe Lines", "q": "执行评分与提升目标", "clues": [], "a": ["讲师提到，许多玩家在单次加注底池IP位置的自评分为6-8分（满分10分），目标是通过改进跟注阈值和检查范围构建，将执行评分提升至接近10分。", "具体行动项：停止过度弃牌，尤其是面对小尺度探针下注时；在翻牌圈保留更多强牌过牌；在转牌和河牌面对探针时，根据阈值表选择跟注而非自动弃牌。"], "note": ""}, {"id": "DGL#61-note", "ep": "61", "type": "note", "topic": "DGL#61 - 单次加注底池中，有利位置玩家在探针下注线下的跟注阈值研究", "en": "PFR SRP IP Calling Thresholds in Probe Lines", "q": "避坑提醒与行动项", "clues": ["DGL", "GTO", "PioSolver"], "a": ["本视频是DGL系列第61期，承接了上一期关于“过牌-加注频率”的讨论，进一步深入探针下注场景下的跟注决策。讲师强调，改善单次加注底池IP表现的关键在于系统性研究跟注阈值，而非依赖临场直觉。建议玩家结合GTO求解器（如PioSolver）分析具体牌面，并记录常见探针尺度的应对范围。", "值得进一步学习的方向包括：不同筹码深度下的探针应对差异、多人底池中的探针策略、以及河牌探针下的范围划分。此外，玩家应复盘自己的翻牌圈检查范围，确保其强度足以支撑后续街的跟注决策。", "**行动项清单**：", "- 不要过度弃牌：面对小尺度探针下注时，保留口袋对子、卡顺听牌等边缘牌跟注。", "- 翻牌圈检查范围需包含强牌（如KQ、KJ、QJ），避免全部下注导致范围失衡。", "- 研究并记忆不同探针尺度（1/3底池、3/4底池、超池）下的跟注阈值。", "- 转牌面对探针时，倾向于过度跟注而非弃牌，以获取河牌额外EV。", "- 避免用垃圾牌（如J♦6♦）在翻牌圈下注，防止检查范围过弱。"], "note": ""}, {"id": "DGL#62-intro", "ep": "62", "type": "intro", "topic": "DGL#62 - 翻前加注者单次加注底池中，有利位置延迟持续下注（Delayed Cbet）与空气牌诈唬策略", "en": "PFR SRP IP Delayed Cbet with Airs", "q": "DGL#62 - 翻前加注者单次加注底池中，有利位置延迟持续下注（Delayed Cbet）与空气牌诈唬策略", "clues": ["PFR", "SRP", "Delayed Cbet"], "a": ["本视频聚焦于翻前加注者（PFR）在单次加注底池（SRP）中，处于有利位置（IP）时，翻牌圈过牌后于转牌圈进行延迟持续下注（Delayed Cbet）的策略。讲师以自身2016年在微注额级别论坛上的一次经历为引，强调用纯空气牌在转牌圈诈唬是正确且必要的打法，而绝大多数低级别玩家严重缺乏这一行为。", "讲师通过大量数据与牌例指出，低级别玩家在翻牌圈过牌后，转牌圈对纯空气牌的下注频率严重不足，导致其过牌范围中充斥着大量垃圾牌。这种不平衡使得他们在河牌圈面对对手下注时过度弃牌（over fold）超过20%，甚至达到25%，从而白白损失大量底池权益。", "视频的核心价值在于揭示了一个巨大的剥削机会：由于对手在转牌圈延迟持续下注后，河牌圈面对下注的弃牌率远超平衡频率，玩家可以大幅增加转牌圈空气牌诈唬频率，并在河牌圈继续施加压力，从而获取可观的期望值（EV）。讲师通过具体牌例（如J4、K4、A5等）和范围分析，详细展示了哪些空气牌应该下注、哪些应该过牌，以及如何利用对手的过度弃牌倾向来最大化收益。"], "note": ""}, {"id": "DGL#62-s0", "ep": "62", "type": "topic", "topic": "DGL#62 - 翻前加注者单次加注底池中，有利位置延迟持续下注（Delayed Cbet）与空气牌诈唬策略", "en": "PFR SRP IP Delayed Cbet with Airs", "q": "3.1 延迟持续下注的核心概念", "clues": ["Delayed Cbet", "blank", "Kalupsu", "draws"], "a": ["延迟持续下注（Delayed Cbet）指翻前加注者在翻牌圈选择过牌后，于转牌圈进行下注的行为。讲师强调，这一打法在单次加注底池中极为重要，尤其是当翻牌圈过牌后，转牌圈出现空白牌（blank）时。", "讲师回忆2016年在微注额论坛发帖时，一位高水平玩家（用户Kalupsu）指出他应该用纯空气牌在转牌圈延迟下注。这一建议让讲师茅塞顿开，意识到用“完全垃圾”的牌下注是正确的，而大多数玩家恰恰没有做到这一点。", "关键原则：转牌圈的诈唬牌应该优先选择那些在翻牌圈没有下注的纯空气牌，因为你的听牌（draws）已经在翻牌圈下注过了，转牌圈的诈唬必须由这些“垃圾牌”来承担。"], "note": ""}, {"id": "DGL#62-s1", "ep": "62", "type": "topic", "topic": "DGL#62 - 翻前加注者单次加注底池中，有利位置延迟持续下注（Delayed Cbet）与空气牌诈唬策略", "en": "PFR SRP IP Delayed Cbet with Airs", "q": "3.2 低级别玩家的普遍错误", "clues": ["balanced", "over fold", "20%", "25%"], "a": ["讲师通过研究人群倾向（population tendencies）发现，低级别玩家在翻牌圈过牌后，转牌圈对纯空气牌的下注频率严重不足，导致其过牌范围中充斥着大量垃圾牌。", "具体数据：当讲师研究玩家“过牌两次后面对下注的弃牌率”时，发现这些玩家相对于平衡频率（balanced）过度弃牌（over fold）超过20%，有时甚至达到25%。", "根本原因：玩家在转牌圈没有下注那些本该下注的空气牌，而是选择过牌，导致河牌圈面对下注时无法防守，只能大量弃牌。"], "note": ""}, {"id": "DGL#62-s2", "ep": "62", "type": "topic", "topic": "DGL#62 - 翻前加注者单次加注底池中，有利位置延迟持续下注（Delayed Cbet）与空气牌诈唬策略", "en": "PFR SRP IP Delayed Cbet with Airs", "q": "3.3 转牌圈必须下注的空气牌类型", "clues": ["bet pure", "Axe", "showdown value"], "a": ["讲师以翻牌面Q-9-6（皇后-九-六）为例，详细列举了转牌圈空白牌（如2或7）时，哪些空气牌必须纯下注（bet pure）：", "J4（红桃或草花）：必须纯下注，即使只有高牌J和4。", "J5、J7等随机J高牌：必须下注。", "K3（红桃）：可以不下注，但K4（尤其是草花K4）必须下注。", "A5：必须下注，A4等低踢脚A高牌（Axe）也必须纯下注。", "核心逻辑：这些牌在翻牌圈过牌后，转牌圈没有摊牌价值（showdown value），必须通过诈唬来夺取底池，否则只能过牌并在河牌圈放弃。"], "note": ""}, {"id": "DGL#62-s3", "ep": "62", "type": "topic", "topic": "DGL#62 - 翻前加注者单次加注底池中，有利位置延迟持续下注（Delayed Cbet）与空气牌诈唬策略", "en": "PFR SRP IP Delayed Cbet with Airs", "q": "3.4 翻牌圈顶对过牌频率与转牌圈慢打", "clues": ["solver", "big bet sizing", "top pair", "slow play"], "a": ["在Q-9-6翻牌面，讲师指出解算器（solver）会采用大尺寸下注（big bet sizing），并且有58%的顶对（top pair）选择过牌。但低级别玩家远未达到这一过牌频率，他们过牌顶对的次数太少。", "当转牌圈继续出现空白牌时，解算器仍然会慢打（slow play）30%的顶对。讲师强调，低级别玩家几乎从不这样做，他们要么在翻牌圈下注过多，要么在转牌圈无法平衡过牌范围。", "结果就是：玩家的过牌范围中缺乏强牌（顶对），同时充满了本该诈唬的空气牌，导致河牌圈面对下注时防守能力极差。"], "note": ""}, {"id": "DGL#62-s4", "ep": "62", "type": "topic", "topic": "DGL#62 - 翻前加注者单次加注底池中，有利位置延迟持续下注（Delayed Cbet）与空气牌诈唬策略", "en": "PFR SRP IP Delayed Cbet with Airs", "q": "3.5 剥削机会与实战应用", "clues": ["20%", "25%"], "a": ["由于对手在转牌圈延迟持续下注后，河牌圈面对下注的弃牌率远超平衡频率（超过20%甚至25%），这为剥削性玩家（exploitative player）留下了巨大的盈利空间。", "讲师指出，当对手“过牌两次”后，你可以在河牌圈用更宽的范围下注，因为对手的弃牌率极高。这意味着你可以用更少的价值牌和更多的诈唬牌来最大化EV。", "具体行动建议：在转牌圈，如果你的手牌是纯空气（如J4、K4、A5等），且翻牌圈已经过牌，那么转牌圈空白牌时应该果断下注，而不是过牌。这样既能平衡你的过牌范围，又能利用对手的过度弃牌倾向。"], "note": ""}, {"id": "DGL#62-s5", "ep": "62", "type": "topic", "topic": "DGL#62 - 翻前加注者单次加注底池中，有利位置延迟持续下注（Delayed Cbet）与空气牌诈唬策略", "en": "PFR SRP IP Delayed Cbet with Airs", "q": "3.6 常见误区与纠正", "clues": ["pure garbage", "58%", "30%", "20%"], "a": ["常见错误一：翻牌圈过牌后，转牌圈仍然过牌纯空气牌。讲师强调，这些牌必须下注，否则你的过牌范围将变得“纯垃圾”（pure garbage），河牌圈无法防守。", "常见错误二：翻牌圈顶对过牌频率过低（远低于58%），转牌圈慢打顶对频率过低（远低于30%）。这导致过牌范围中强牌不足，空气牌过多。", "常见错误三：河牌圈面对下注时过度弃牌（超过20%甚至25%）。这是前两个错误的直接后果，也是对手可以利用的最大漏洞。"], "note": ""}, {"id": "DGL#62-c1", "ep": "62", "type": "cloze", "topic": "DGL#62 - 翻前加注者单次加注底池中，有利位置延迟持续下注（Delayed Cbet）与空气牌诈唬策略", "en": "PFR SRP IP Delayed Cbet with Airs", "q": "发现这些玩家相对于平衡频率（balanced）过度弃牌（over fold）超过＿＿，", "clues": [], "a": ["具体数据：当讲师研究玩家“过牌两次后面对下注的弃牌率”时，发现这些玩家相对于平衡频率（balanced）过度弃牌（over fold）超过20%，有时甚至达到25%。"], "note": "20%"}, {"id": "DGL#62-c3", "ep": "62", "type": "cloze", "topic": "DGL#62 - 翻前加注者单次加注底池中，有利位置延迟持续下注（Delayed Cbet）与空气牌诈唬策略", "en": "PFR SRP IP Delayed Cbet with Airs", "q": "并且有＿＿的顶对（top pair）选择过牌。但低级别玩家远未达到这一过牌频率，", "clues": [], "a": ["在Q-9-6翻牌面，讲师指出解算器（solver）会采用大尺寸下注（big bet sizing），并且有58%的顶对（top pair）选择过牌。但低级别玩家远未达到这一过牌频率，他们过牌顶对的次数太少。"], "note": "58%"}, {"id": "DGL#62-c4", "ep": "62", "type": "cloze", "topic": "DGL#62 - 翻前加注者单次加注底池中，有利位置延迟持续下注（Delayed Cbet）与空气牌诈唬策略", "en": "PFR SRP IP Delayed Cbet with Airs", "q": "河牌圈面对下注的弃牌率远超平衡频率（超过＿＿甚至25%），", "clues": [], "a": ["由于对手在转牌圈延迟持续下注后，河牌圈面对下注的弃牌率远超平衡频率（超过20%甚至25%），这为剥削性玩家（exploitative player）留下了巨大的盈利空间。"], "note": "20%"}, {"id": "DGL#62-note", "ep": "62", "type": "note", "topic": "DGL#62 - 翻前加注者单次加注底池中，有利位置延迟持续下注（Delayed Cbet）与空气牌诈唬策略", "en": "PFR SRP IP Delayed Cbet with Airs", "q": "避坑提醒与行动项", "clues": ["DGL", "Deep Game Logic", "58%"], "a": ["本视频属于DGL系列（Deep Game Logic）的第62期，聚焦于翻前加注者单次加注底池中的延迟持续下注策略。讲师通过个人经历引入话题，结合解算器数据和人群倾向分析，揭示了低级别玩家在转牌圈空气牌诈唬上的系统性缺失，并提供了具体的剥削策略。这一主题与系列中其他关于翻前范围、持续下注频率和河牌圈防守的内容紧密衔接，建议结合学习。", "值得进一步学习的方向包括：解算器在具体翻牌面（如Q-9-6）上的完整转牌圈下注范围与频率分布；如何根据对手的弃牌率动态调整河牌圈诈唬频率；以及如何在实战中识别并利用对手“过牌两次后过度弃牌”的倾向。此外，讲师提到的“顶对过牌频率58%”和“转牌圈慢打30%”等数据，可以作为构建平衡过牌范围的参考基准。", "- 应该这样做：转牌圈空白牌时，用J4、K4、A5等纯空气牌果断延迟下注；翻牌圈适当增加顶对过牌频率（接近58%）；转牌圈继续慢打部分顶对（约30%）。", "- 不要这样做：不要在转牌圈过牌所有纯空气牌；不要翻牌圈过牌顶对频率过低；不要在河牌圈面对下注时过度弃牌超过20%。"], "note": ""}, {"id": "DGL#63-intro", "ep": "63", "type": "intro", "topic": "DGL#63 - 翻前加注底池中的有利位置小尺度持续下注策略", "en": "PFR 3BP IP Exploring the Tiny Cbet Sizes", "q": "DGL#63 - 翻前加注底池中的有利位置小尺度持续下注策略", "clues": ["bet pot", "tiny c-bet", "size"], "a": ["本视频聚焦于翻前加注底池（3-bet pot）中，有利位置（IP）玩家在翻牌圈使用极小持续下注尺度（tiny c-bet size，如15%底池）的策略。讲师指出，许多玩家并未充分利用这一高效工具，尤其是在高牌面（high card textures）结构上，Solver（最优解算器）会以极高频率甚至全范围选择15%左右的极小下注尺度。", "视频的核心逻辑在于：下注尺度的选择应基于“你想在对手范围中针对哪一部分牌制造无差别（indifference）”。在翻前加注底池中，对手范围中最大的组成部分是口袋对子（pocket pairs），而极小下注尺度恰好能以极低成本让这些口袋对子陷入无差别境地，从而迫使对手犯错。讲师强调，GTO策略的核心只有两个变量——尺度（sizing）与频率（frequency），而选择尺度的关键思维就是最大化“针对更多手牌、更频繁地制造无差别”。", "视频还对比了不同牌面结构下极小尺度的适用性：在高牌面（如A-Q-8、K-J-9、A-K-K）上，Solver几乎全范围使用15%尺度；而在中等牌面（如K-9-4彩虹面）上，Solver更倾向于混合使用30%和60%的大尺度，但讲师认为极小尺度在此类牌面上反而能给对手制造更多困难决策，尤其针对低对子和低连张组合。"], "note": ""}, {"id": "DGL#63-s0", "ep": "63", "type": "topic", "topic": "DGL#63 - 翻前加注底池中的有利位置小尺度持续下注策略", "en": "PFR 3BP IP Exploring the Tiny Cbet Sizes", "q": "极小下注尺度的基本概念", "clues": ["tiny c-bet", "size", "bet pot", "BTN vs HJ"], "a": ["视频核心介绍的是翻牌圈15%底池左右的极小持续下注尺度（tiny c-bet size），讲师认为这是多数玩家未充分利用的高效策略工具。", "该策略场景设定为：翻前加注底池（3-bet pot），有利位置（IP）玩家在翻牌圈行动，以BTN（庄位）vs HJ（劫位）作为主要代理场景。", "讲师指出，在BTN vs HJ场景中，Solver在翻牌圈的持续下注频率高达78%，其中13.6%为过牌，15%为下注尺度，且15%尺度被大量使用。"], "note": ""}, {"id": "DGL#63-s1", "ep": "63", "type": "topic", "topic": "DGL#63 - 翻前加注底池中的有利位置小尺度持续下注策略", "en": "PFR 3BP IP Exploring the Tiny Cbet Sizes", "q": "高牌面结构下的全范围极小下注", "clues": ["Solver", "range bet", "15%", "100%"], "a": ["在高牌面结构（如A-Q-8彩虹面）上，Solver倾向于以15%尺度进行全范围下注（range bet），即100%频率使用该尺度。", "其他类似高牌面包括：A-Q-8彩虹面、K-J-9、A-Q-9、A-K-K等，这些“非常高牌面”结构都极其适合极小尺度下注。", "讲师强调，在这些牌面上，你的范围足够强，可以几乎每次都用15%尺度下注，且能对对手范围中很大一部分手牌制造无差别。"], "note": ""}, {"id": "DGL#63-s2", "ep": "63", "type": "topic", "topic": "DGL#63 - 翻前加注底池中的有利位置小尺度持续下注策略", "en": "PFR 3BP IP Exploring the Tiny Cbet Sizes", "q": "极小尺度的核心目的：针对口袋对子制造无差别", "clues": ["indifference", "10%"], "a": ["极小下注尺度的核心目的是在对手范围中最大的组成部分——口袋对子（如口袋10、口袋6、口袋3）上制造无差别（indifference）。", "讲师指出，即使使用10%底池的尺度，也足以让口袋10、口袋3、口袋6这类手牌陷入无差别境地，因为这些手牌面对极小下注时很难做出正确决策。", "关键思维：下注尺度的选择应基于“你想在对手范围中针对哪一部分手牌制造无差别”，并尽可能同时针对更多手牌。"], "note": ""}, {"id": "DGL#63-s3", "ep": "63", "type": "topic", "topic": "DGL#63 - 翻前加注底池中的有利位置小尺度持续下注策略", "en": "PFR 3BP IP Exploring the Tiny Cbet Sizes", "q": "尺度与频率是GTO策略的唯二要素", "clues": ["GTO", "sizing", "frequency"], "a": ["讲师强调，应用GTO策略时，你只需要两个东西：尺度（sizing）和频率（frequency），仅此而已。", "选择合适尺度的思维过程是：思考对手范围中你想针对的手牌区域是什么？你想在哪里制造无差别？", "你希望同时针对尽可能多的手牌，且越频繁越好——针对的手牌越多，平均收益越高；越有能力针对这些手牌，效果越好。"], "note": ""}, {"id": "DGL#63-s4", "ep": "63", "type": "topic", "topic": "DGL#63 - 翻前加注底池中的有利位置小尺度持续下注策略", "en": "PFR 3BP IP Exploring the Tiny Cbet Sizes", "q": "全范围下注 vs 极化下注的对比", "clues": ["range bet for", "tiny size", "20%", "80%"], "a": ["讲师对比了两种策略思路：全范围极小下注（range bet for tiny size）与极化下注（polarized betting）。", "如果选择极化下注（如只为制造弃牌率而大尺度下注），你只能下注约20%的范围，这意味着对手80%的时间能看到转牌，效率极低。", "正确的思路是：尽可能频繁地制造无差别，同时尽可能针对更多手牌——这两者的结合才能产生最佳策略。"], "note": ""}, {"id": "DGL#63-s5", "ep": "63", "type": "topic", "topic": "DGL#63 - 翻前加注底池中的有利位置小尺度持续下注策略", "en": "PFR 3BP IP Exploring the Tiny Cbet Sizes", "q": "中等牌面结构上的尺度选择争议", "clues": ["Solver", "float", "30%", "60%"], "a": ["以K-9-4彩虹面为例，Solver主要使用30%和60%的大尺度，极小尺度使用较少。", "讲师指出，大尺度的问题在于让对手的防守决策变得更直观——哪些手牌有利可图、哪些无利可图一目了然。", "例如面对30%尺度，口袋8、口袋7在K-9-4牌面上很难漂浮跟注（float），而A-J、A-10等牌的决策也相对明显。"], "note": ""}, {"id": "DGL#63-s6", "ep": "63", "type": "topic", "topic": "DGL#63 - 翻前加注底池中的有利位置小尺度持续下注策略", "en": "PFR 3BP IP Exploring the Tiny Cbet Sizes", "q": "极小尺度在中等牌面的优势", "clues": ["check-raise", "15%"], "a": ["如果改用15%极小尺度，K-9-4牌面上会出现更多让对手棘手的决策：口袋3和口袋2变得无差别，6-5同花需要开始过牌加注（check-raise），7-6同花也需要调整策略。", "讲师认为，极小尺度会让对手陷入更多困难局面，更难对抗；即使面对非常优秀的玩家（损失EV极少），面对大多数普通玩家时，极小尺度预计能赚更多钱。", "原因在于：大多数玩家不会正确应对这些低牌（低对子、低连张），他们的防守频率和策略都会出错。"], "note": ""}, {"id": "DGL#63-s7", "ep": "63", "type": "topic", "topic": "DGL#63 - 翻前加注底池中的有利位置小尺度持续下注策略", "en": "PFR 3BP IP Exploring the Tiny Cbet Sizes", "q": "实战建议：何时使用极小尺度", "clues": ["Solver", "15%"], "a": ["讲师给出的首要建议是：在实战中尝试使用这些极小下注尺度，甚至可以在Solver建议使用更大尺度的牌面上使用。", "高牌面（如A-Q-8、K-J-9、A-K-K）是极小尺度的最佳适用场景，可以全范围使用15%尺度。", "中等牌面（如K-9-4）虽然Solver偏好大尺度，但极小尺度能制造更多对手错误，值得混合使用。"], "note": ""}, {"id": "DGL#63-c0", "ep": "63", "type": "cloze", "topic": "DGL#63 - 翻前加注底池中的有利位置小尺度持续下注策略", "en": "PFR 3BP IP Exploring the Tiny Cbet Sizes", "q": "视频核心介绍的是翻牌圈＿＿底池左右的极小持续下注尺度（tiny c-bet size），", "clues": [], "a": ["视频核心介绍的是翻牌圈15%底池左右的极小持续下注尺度（tiny c-bet size），讲师认为这是多数玩家未充分利用的高效策略工具。"], "note": "15%"}, {"id": "DGL#63-c1", "ep": "63", "type": "cloze", "topic": "DGL#63 - 翻前加注底池中的有利位置小尺度持续下注策略", "en": "PFR 3BP IP Exploring the Tiny Cbet Sizes", "q": "Solver倾向于以＿＿尺度进行全范围下注（range bet），", "clues": [], "a": ["在高牌面结构（如A-Q-8彩虹面）上，Solver倾向于以15%尺度进行全范围下注（range bet），即100%频率使用该尺度。"], "note": "15%"}, {"id": "DGL#63-c2", "ep": "63", "type": "cloze", "topic": "DGL#63 - 翻前加注底池中的有利位置小尺度持续下注策略", "en": "PFR 3BP IP Exploring the Tiny Cbet Sizes", "q": "即使使用＿＿底池的尺度，也足以让口袋10、口袋3、口袋6这类手牌陷入无差别境地，", "clues": [], "a": ["讲师指出，即使使用10%底池的尺度，也足以让口袋10、口袋3、口袋6这类手牌陷入无差别境地，因为这些手牌面对极小下注时很难做出正确决策。"], "note": "10%"}, {"id": "DGL#63-note", "ep": "63", "type": "note", "topic": "DGL#63 - 翻前加注底池中的有利位置小尺度持续下注策略", "en": "PFR 3BP IP Exploring the Tiny Cbet Sizes", "q": "避坑提醒与行动项", "clues": ["DGL", "bet", "Solver"], "a": ["本视频属于DGL系列（#63），聚焦于翻前加注底池中有利位置的翻牌圈策略，特别是极小持续下注尺度的应用。视频承接了系列中关于翻前范围构建和翻后下注频率的讨论，为玩家提供了一种基于“制造无差别”思维的尺度选择框架。值得进一步学习的方向包括：不同转牌牌面下的后续策略调整、如何针对不同对手类型调整极小尺度的使用频率、以及如何在3-bet底池中平衡过牌范围与下注范围。", "### 行动项与常见错误", "- 应该这样做：在高牌面（A-Q-8、K-J-9、A-K-K等）上尝试全范围使用15%极小下注尺度，针对对手口袋对子制造无差别。", "- 应该这样做：选择下注尺度时，先思考“我想针对对手范围中哪一部分手牌制造无差别”，并尽可能同时针对更多手牌。", "- 应该这样做：在中等牌面（如K-9-4）上，即使Solver偏好大尺度，也可以尝试混合使用15%极小尺度，给对手制造更多困难决策。", "- 不要这样做：不要只为了制造弃牌率而选择极化大尺度下注，这会导致你只能下注约20%的范围，让对手80%的时间看到转牌。", "- 不要这样做：不要忽视极小尺度的威力——即使10%底池的尺度也足以让口袋对子陷入无差别，不需要更大尺度。"], "note": ""}, {"id": "DGL#64-intro", "ep": "64", "type": "intro", "topic": "DGL#64 - 翻前加注单次加注底池翻牌圈不利位置：小盲对盲注位迷你下注策略介绍", "en": "PFR SRP OOP Introducing to Mini Bet Flop - BvB", "q": "DGL#64 - 翻前加注单次加注底池翻牌圈不利位置：小盲对盲注位迷你下注策略介绍", "clues": ["SRP", "OOP", "Solver"], "a": ["本视频聚焦于单次加注底池（SRP）中翻牌圈处于不利位置（OOP）的场景，重点分析小盲位（SB）对阵大盲位（BB）这一最关键的对局。讲师通过Solver（求解器）聚合报告展示了翻牌圈的最优策略，核心发现是：小盲位在翻牌圈拥有显著的权益优势（55%对44.6%），这源于翻前范围的差异，并转化为高频率的持续下注（c-bet）策略。", "视频的核心观点是：在SB vs BB的单次加注底池中，Solver强烈倾向于使用极小下注尺度——迷你下注（min bet，即1BB）和1/4底池下注，而非玩家常用的1/3底池。讲师通过多个具体牌面示例（如A-2-2、K-T-2、A-9-3、10-9-3、K-Q-4、A-Q-8）展示了Solver如何分配下注尺度，并解释了极小下注背后的逻辑：对手范围弱且宽，小注足以制造大量无差别决策（indifference），从而以更高频率下注。"], "note": ""}, {"id": "DGL#64-s0", "ep": "64", "type": "topic", "topic": "DGL#64 - 翻前加注单次加注底池翻牌圈不利位置：小盲对盲注位迷你下注策略介绍", "en": "PFR SRP OOP Introducing to Mini Bet Flop - BvB", "q": "视频主题与聚焦范围", "clues": ["Cingray", "OOP", "BTN", "fish"], "a": ["本视频使用Cingray的聚合报告，聚焦于翻牌圈不利位置（OOP）的场景，特别强调小盲位（SB）对阵大盲位（BB）这一最核心的对局。", "讲师指出，虽然高劫位（HJ）对阵按钮位（BTN）对抗鱼玩家（fish）时很常见，但对抗常规玩家（regulars）时，SB vs BB才是最重要的战场。", "该场景是翻前加注后单次加注底池（SRP），翻牌圈由小盲位处于不利位置，需要制定最优的持续下注策略。"], "note": ""}, {"id": "DGL#64-s1", "ep": "64", "type": "topic", "topic": "DGL#64 - 翻前加注单次加注底池翻牌圈不利位置：小盲对盲注位迷你下注策略介绍", "en": "PFR SRP OOP Introducing to Mini Bet Flop - BvB", "q": "翻牌圈权益优势与下注频率", "clues": ["bet", "broadways", "GTO", "check"], "a": ["小盲位在翻牌圈拥有巨大的权益优势：整体权益为55%，而翻牌圈在有利位置（IP）的玩家仅有44.6%的权益。", "这一优势源于翻前范围的差异：由于只剩两名玩家，大盲位（IP玩家）的3-bet（再加注）范围相当宽，包括88+的口袋对子、强非同花高张（broadways）以及大量同花连牌等。", "当大盲位仅跟注时，小盲位的范围在翻牌圈明显更强，这转化为高频率的持续下注（c-bet）策略。", "在GTO（博弈论最优）框架下，小盲位应进行66%频率的持续下注，同时有34%的频率选择过牌（check）。", "讲师预期大多数玩家在实际数据库中远未达到66%的下注频率，其数据库中低级别玩家在该位置的持续下注频率仅为51%，与GTO阈值66%存在明显差距。"], "note": ""}, {"id": "DGL#64-s2", "ep": "64", "type": "topic", "topic": "DGL#64 - 翻前加注单次加注底池翻牌圈不利位置：小盲对盲注位迷你下注策略介绍", "en": "PFR SRP OOP Introducing to Mini Bet Flop - BvB", "q": "Solver下注尺度分配与迷你下注", "clues": ["Solver", "quarter pot", "min bet", "HUD deception"], "a": ["Solver在该位置压倒性地偏好小尺度下注：29.53%的频率使用1/4底池下注（quarter pot），25.86%的频率使用迷你下注（min bet，即1BB）。", "讲师估计99%的玩家目前并未在武器库中使用迷你下注，但这是一个极佳的隐藏打法（HUD deception），只需在翻牌圈下注一个大盲注（1BB）。", "由于极少人使用迷你下注，对手不知道如何应对，这使其具有额外的剥削价值。", "1/3底池下注并非Solver偏好的尺度：如果给Solver提供小于1/3底池的选项，它几乎总是会选择更小的尺度，如1/4底池或迷你下注。"], "note": ""}, {"id": "DGL#64-s3", "ep": "64", "type": "topic", "topic": "DGL#64 - 翻前加注单次加注底池翻牌圈不利位置：小盲对盲注位迷你下注策略介绍", "en": "PFR SRP OOP Introducing to Mini Bet Flop - BvB", "q": "具体牌面示例与下注策略", "clues": ["Ace", "Deuce", "Solver", "min bet"], "a": ["A-2-2牌面（Ace, Deuce, Deuce）：Solver建议几乎用整个范围进行迷你下注（min bet）。", "K-T-2双色牌面（King Ten Two-tone）：Solver更偏好迷你下注而非1/4底池下注。", "A-9-3牌面：Solver压倒性地使用迷你下注。", "10-9-3单色牌面（Monotone）：Solver在61.6%的情况下使用迷你下注，即只需下注一个大盲注。", "K-Q-4单色牌面：迷你下注在底部的70%范围中被使用，频率高达66%。", "A-Q-8彩虹牌面：大量高牌面（high card board）和单色牌面（monotone board）都倾向于使用迷你下注。"], "note": ""}, {"id": "DGL#64-s4", "ep": "64", "type": "topic", "topic": "DGL#64 - 翻前加注单次加注底池翻牌圈不利位置：小盲对盲注位迷你下注策略介绍", "en": "PFR SRP OOP Introducing to Mini Bet Flop - BvB", "q": "极小下注的核心逻辑与目的", "clues": ["super min bet", "indifference", "tough spot"], "a": ["超级迷你下注（super min bet）的核心逻辑：对手的范围弱且宽，因此极小下注尺度足以制造无差别决策（indifference）。", "下注尺度的目的不是最大化单次下注的利润，而是将对手范围中相当数量的牌置于艰难决策（tough spot）之中。", "艰难决策即无差别决策的通俗说法：跟注、弃牌、加注的期望值（EV）非常接近，让对手难以抉择。", "正确的下注尺度应能最大化对手策略中艰难决策的数量，而迷你下注允许你以更高频率下注，同时制造大量艰难决策，这正是其最优性的原因。"], "note": ""}, {"id": "DGL#64-c1", "ep": "64", "type": "cloze", "topic": "DGL#64 - 翻前加注单次加注底池翻牌圈不利位置：小盲对盲注位迷你下注策略介绍", "en": "PFR SRP OOP Introducing to Mini Bet Flop - BvB", "q": "小盲位在翻牌圈拥有巨大的权益优势：整体权益为＿＿，", "clues": [], "a": ["小盲位在翻牌圈拥有巨大的权益优势：整体权益为55%，而翻牌圈在有利位置（IP）的玩家仅有44.6%的权益。"], "note": "55%"}, {"id": "DGL#64-c2", "ep": "64", "type": "cloze", "topic": "DGL#64 - 翻前加注单次加注底池翻牌圈不利位置：小盲对盲注位迷你下注策略介绍", "en": "PFR SRP OOP Introducing to Mini Bet Flop - BvB", "q": "Solver在该位置压倒性地偏好小尺度下注：＿＿的频率使用1/4底池下注（quarter pot），", "clues": [], "a": ["Solver在该位置压倒性地偏好小尺度下注：29.53%的频率使用1/4底池下注（quarter pot），25.86%的频率使用迷你下注（min bet，即1BB）。"], "note": "29.53%"}, {"id": "DGL#64-c3", "ep": "64", "type": "cloze", "topic": "DGL#64 - 翻前加注单次加注底池翻牌圈不利位置：小盲对盲注位迷你下注策略介绍", "en": "PFR SRP OOP Introducing to Mini Bet Flop - BvB", "q": "10-9-3单色牌面（Monotone）：Solver在＿＿的情况下使用迷你下注，", "clues": [], "a": ["10-9-3单色牌面（Monotone）：Solver在61.6%的情况下使用迷你下注，即只需下注一个大盲注。"], "note": "61.6%"}, {"id": "DGL#64-note", "ep": "64", "type": "note", "topic": "DGL#64 - 翻前加注单次加注底池翻牌圈不利位置：小盲对盲注位迷你下注策略介绍", "en": "PFR SRP OOP Introducing to Mini Bet Flop - BvB", "q": "避坑提醒与行动项", "clues": ["DGL", "PFR SRP", "OOP"], "a": ["本视频属于DGL系列的第64期，聚焦于翻前加注单次加注底池（PFR SRP）中不利位置（OOP）的翻牌圈策略，特别是小盲位对大盲位场景。视频为后续深入探讨迷你下注策略奠定了基础，后续内容可能涉及如何构建迷你下注的范围、如何应对对手的加注以及转牌圈和河牌圈的延续策略。", "值得进一步学习的方向包括：迷你下注在不同牌面结构（高张牌面、单色牌面、配对牌面）中的具体范围构建、如何根据对手的翻前跟注范围调整下注频率，以及如何在实战中平衡迷你下注与过牌-加注（check-raise）策略。", "行动项与常见错误：", "- 应该做：在SB vs BB的单次加注底池中，将翻牌圈持续下注频率提升至66%左右，而非停留在51%的常见水平。", "- 应该做：在翻牌圈积极使用迷你下注（1BB）和1/4底池下注，替代常用的1/3底池下注。", "- 应该做：在A-2-2、A-9-3、10-9-3单色、K-Q-4单色等牌面上，优先选择迷你下注。", "- 不要做：不要认为1/3底池是翻牌圈的标准下注尺度——Solver在给出更小选项时几乎总是偏好更小尺度。", "- 不要做：不要忽略迷你下注的隐藏价值——由于极少人使用，对手缺乏应对经验，这本身就是一种剥削优势。"], "note": ""}, {"id": "DGL#65-intro", "ep": "65", "type": "intro", "topic": "DGL#65 - 翻前3-Bet底池中有利位置时，低对与口袋对子作为诈唬的频率与下注尺度", "en": "PFC 3BP IP How Often to Use Low PairsPockets as Bluffs - vs B X", "q": "DGL#65 - 翻前3-Bet底池中有利位置时，低对与口袋对子作为诈唬的频率与下注尺度", "clues": ["BTN", "bet", "low pair"], "a": ["本视频聚焦于一个特定翻后场景：你在关位（BTN）开局加注，小盲（SB）3-bet，你跟注；翻牌圈小盲下注小尺度，你跟注；转牌圈小盲过牌，此时你获得机会用低对（low pair）或低口袋对子（low pocket pair）进行诈唬下注。讲师Andre通过PioSOLVER自战模拟生成近100万手牌，并利用Hand2Note筛选数据，量化了在这种场景下低对/低口袋对子的最优下注频率、下注尺度以及河牌圈的持续下注策略。", "核心结论是：在转牌圈，低对/低口袋对子应以53%的频率下注，且首选下注尺度为50%底池（B50），占所有转牌下注组合的68%；若被跟注，河牌圈应以62%的频率继续下注，且通常为全下（80%-100%底池）。低对/低口袋对子占转牌总下注范围的11%，占河牌总下注范围的11.5%。讲师强调，这些频率必须根据对手类型进行调整：面对紧弱型对手可增加下注频率，面对粘性强的对手则应减少。"], "note": ""}, {"id": "DGL#65-s0", "ep": "65", "type": "topic", "topic": "DGL#65 - 翻前3-Bet底池中有利位置时，低对与口袋对子作为诈唬的频率与下注尺度", "en": "PFC 3BP IP How Often to Use Low PairsPockets as Bluffs - vs B X", "q": "场景定义与筛选条件", "clues": ["BTN", "SB 3-bet", "small C-bet", "Q7o"], "a": ["本视频分析的场景为：BTN开局加注，SB 3-bet，BTN跟注；翻牌圈SB下注小尺度（small C-bet），BTN跟注；转牌圈SB过牌，BTN获得下注机会。", "翻前范围筛选：仅选择口袋对子22-66（不包括77及以上），因为这些才被视为“低口袋对子”。同时选择能在翻牌或转牌形成低对的牌（如Q7o、J7o、J8o），但这些牌实际上不在翻前跟注3-bet的范围中，因此不影响分析。", "行动筛选：必须确保BTN开局加注、SB 3-bet、BTN跟注、SB在翻牌下注小尺度、BTN跟注、SB在转牌过牌。", "牌力筛选：转牌时，低对/低口袋对子不能已经形成顺子、同花、同花听牌、顺子听牌、卡顺听牌、两头顺听牌或组合听牌，确保分析的是“纯低对”的诈唬潜力。"], "note": ""}, {"id": "DGL#65-s1", "ep": "65", "type": "topic", "topic": "DGL#65 - 翻前3-Bet底池中有利位置时，低对与口袋对子作为诈唬的频率与下注尺度", "en": "PFC 3BP IP How Often to Use Low PairsPockets as Bluffs - vs B X", "q": "转牌下注频率与尺度", "clues": ["B50", "53%", "50%", "68%"], "a": ["在满足上述条件的7,503个低对/低口袋对子组合中，有4,002个组合选择在转牌下注，占比53%。", "在这4,002个下注组合中，有2,706个组合使用50%底池（B50）的下注尺度，占比约68%（2,706 ÷ 4,002）。", "因此，当面对转牌过牌时，低对/低口袋对子的首选策略是：53%的频率下注，且下注尺度以50%底池为主。"], "note": ""}, {"id": "DGL#65-s2", "ep": "65", "type": "topic", "topic": "DGL#65 - 翻前3-Bet底池中有利位置时，低对与口袋对子作为诈唬的频率与下注尺度", "en": "PFC 3BP IP How Often to Use Low PairsPockets as Bluffs - vs B X", "q": "低对占转牌总下注范围的比例", "clues": ["BTN", "SB 3-bet", "11%"], "a": ["为了计算低对/低口袋对子占整个转牌下注范围的比例，需取消所有翻前和翻后牌力筛选，仅保留行动筛选（BTN开局、SB 3-bet、BTN跟注、SB翻牌小注、BTN跟注、SB转牌过牌）。", "结果显示，到达转牌的总组合数为9,906个，其中下注组合数为36,260个（注：原文此处数字可能有误，但按原文保留）。", "低对/低口袋对子在转牌下注4,002个组合，占整个转牌下注范围的11%（4,002 ÷ 36,260）。", "讲师强调，11%对于仅两类手牌（低对和低口袋对子）而言是相当高的比例，说明这些牌在诈唬范围中扮演重要角色。"], "note": ""}, {"id": "DGL#65-s3", "ep": "65", "type": "topic", "topic": "DGL#65 - 翻前3-Bet底池中有利位置时，低对与口袋对子作为诈唬的频率与下注尺度", "en": "PFC 3BP IP How Often to Use Low PairsPockets as Bluffs - vs B X", "q": "河牌继续下注频率", "clues": ["62%"], "a": ["当转牌下注被跟注，且河牌对手过牌时，低对/低口袋对子应以62%的频率继续下注（双倍下注）。", "筛选条件：翻前范围、行动筛选（转牌下注、对手跟注、河牌过牌）以及牌力筛选（低对/低口袋对子未形成三条、两对、同花或顺子，尽管形成同花/顺子几乎不可能，因为转牌已排除听牌）。", "62%的继续下注频率是相当显著的，说明低对/低口袋对子在河牌圈仍具有较高的诈唬价值。"], "note": ""}, {"id": "DGL#65-s4", "ep": "65", "type": "topic", "topic": "DGL#65 - 翻前3-Bet底池中有利位置时，低对与口袋对子作为诈唬的频率与下注尺度", "en": "PFC 3BP IP How Often to Use Low PairsPockets as Bluffs - vs B X", "q": "河牌下注尺度与全下模式", "clues": ["B80-B100", "B50", "B75", "80%"], "a": ["河牌最常用的下注尺度是80%-100%底池（B80-B100），其次是50%底池（B50）。", "通过检查手牌历史发现：若转牌使用B50，河牌通常使用接近B100的全下；若转牌使用接近B75，河牌则使用接近B50的全下（底池比例约0.6）。", "无论哪种模式，河牌下注最终都倾向于全下，且转牌尺度与河牌尺度存在对应关系（转牌大则河牌小，转牌小则河牌大）。", "总结：转牌下注后，62%的情况下河牌会继续下注，且通常为全下。"], "note": ""}, {"id": "DGL#65-s5", "ep": "65", "type": "topic", "topic": "DGL#65 - 翻前3-Bet底池中有利位置时，低对与口袋对子作为诈唬的频率与下注尺度", "en": "PFC 3BP IP How Often to Use Low PairsPockets as Bluffs - vs B X", "q": "低对占河牌总下注范围的比例", "clues": ["11.5%"], "a": ["为计算低对/低口袋对子占河牌总下注范围的比例，需取消所有翻前和翻后牌力筛选，仅保留行动筛选（转牌下注、对手跟注、河牌过牌）。", "结果显示，到达河牌的总组合数为10,605个，其中下注组合数为10,605个（原文如此，可能指全部组合均下注）。", "低对/低口袋对子在河牌下注1,218个组合，占整个河牌下注范围的11.5%（1,218 ÷ 10,605）。", "11.5%的比例同样显著，说明低对/低口袋对子在河牌诈唬范围中占据重要地位。"], "note": ""}, {"id": "DGL#65-s6", "ep": "65", "type": "topic", "topic": "DGL#65 - 翻前3-Bet底池中有利位置时，低对与口袋对子作为诈唬的频率与下注尺度", "en": "PFC 3BP IP How Often to Use Low PairsPockets as Bluffs - vs B X", "q": "频率调整与剥削策略", "clues": ["tight", "sticky", "GTO", "53%"], "a": ["核心频率总结：转牌下注频率53%，河牌继续下注频率62%；低对占转牌下注范围11%，占河牌下注范围11.5%。", "如果忽略这些下注机会（误以为有摊牌价值而选择过牌），或过度下注，都会使自己暴露于被剥削的风险中。", "必须根据对手类型调整频率：若对手偏紧弱（tight），应增加转牌下注频率（超过53%）和河牌下注频率（超过62%）；若对手偏粘性（sticky），应减少转牌下注频率（低于53%）和河牌下注频率（低于62%）。", "讲师强调，这些频率是GTO基准，实际游戏中需结合对手画像进行剥削性调整。"], "note": ""}, {"id": "DGL#65-c1", "ep": "65", "type": "cloze", "topic": "DGL#65 - 翻前3-Bet底池中有利位置时，低对与口袋对子作为诈唬的频率与下注尺度", "en": "PFC 3BP IP How Often to Use Low PairsPockets as Bluffs - vs B X", "q": "有4,002个组合选择在转牌下注，占比＿＿。", "clues": [], "a": ["在满足上述条件的7,503个低对/低口袋对子组合中，有4,002个组合选择在转牌下注，占比53%。"], "note": "53%"}, {"id": "DGL#65-c2", "ep": "65", "type": "cloze", "topic": "DGL#65 - 翻前3-Bet底池中有利位置时，低对与口袋对子作为诈唬的频率与下注尺度", "en": "PFC 3BP IP How Often to Use Low PairsPockets as Bluffs - vs B X", "q": "占整个转牌下注范围的＿＿（4,002 ÷ 36,260）。", "clues": [], "a": ["低对/低口袋对子在转牌下注4,002个组合，占整个转牌下注范围的11%（4,002 ÷ 36,260）。"], "note": "11%"}, {"id": "DGL#65-c3", "ep": "65", "type": "cloze", "topic": "DGL#65 - 翻前3-Bet底池中有利位置时，低对与口袋对子作为诈唬的频率与下注尺度", "en": "PFC 3BP IP How Often to Use Low PairsPockets as Bluffs - vs B X", "q": "低对/低口袋对子应以＿＿的频率继续下注（双倍下注）。", "clues": [], "a": ["当转牌下注被跟注，且河牌对手过牌时，低对/低口袋对子应以62%的频率继续下注（双倍下注）。"], "note": "62%"}, {"id": "DGL#65-note", "ep": "65", "type": "note", "topic": "DGL#65 - 翻前3-Bet底池中有利位置时，低对与口袋对子作为诈唬的频率与下注尺度", "en": "PFC 3BP IP How Often to Use Low PairsPockets as Bluffs - vs B X", "q": "避坑提醒与行动项", "clues": ["DGL", "bet", "PioSOLVER"], "a": ["本视频是DGL系列第65期，专注于翻前3-bet底池中有利位置（IP）的诈唬策略，特别是低对/低口袋对子的使用。它承接了前几期关于3-bet底池翻后玩法的讨论，并提供了具体的数据支撑。值得进一步学习的方向包括：其他牌型（如高张、同花连牌）在相同场景下的下注频率、不同翻牌面结构对低对诈唬价值的影响，以及如何利用软件（如PioSOLVER、Hand2Note）自定义筛选来验证其他复杂场景。", "**行动项与常见错误**：", "- 应该做：在转牌面对过牌时，用低对/低口袋对子以53%频率下注，首选50%底池尺度；若被跟注，河牌以62%频率继续下注，通常全下。", "- 应该做：根据对手类型调整频率——紧弱对手增加下注，粘性对手减少下注。", "- 不要做：不要因为低对看似有摊牌价值而过度过牌，也不要盲目过度下注，否则容易被剥削。", "- 不要做：不要忽略低对/低口袋对子在诈唬范围中的占比（转牌11%、河牌11.5%），这些牌是平衡范围的关键组成部分。"], "note": ""}, {"id": "DGL#66-intro", "ep": "66", "type": "intro", "topic": "DGL#66 - 翻前3-bet后处于有利位置：如何在低牌面（LLL）上游戏非对子底牌", "en": "PFR 3BP IP - How To Play Unpaired Hands on LLL Boards", "q": "DGL#66 - 翻前3-bet后处于有利位置：如何在低牌面（LLL）上游戏非对子底牌", "clues": ["bettor", "probe bet"], "a": ["本视频聚焦于一个高难度翻后场景：作为翻前3-bet方（3-bettor）处于有利位置（IP），在翻牌圈过牌后，面对对手在转牌圈发出的探注（probe bet）时，如何用非对子底牌（A高牌与垃圾牌）进行正确反应。讲师强调，在三人底池与两人底池中，低牌面（triple low boards）是3-bet方过牌频率最高的牌面结构，因此必须掌握面对探注时的应对策略。", "视频的核心结论是：在这些低牌面上，玩家不能过度弃牌（over fold），也不能过于被动。A高牌（Ace High）需要高频跟注，尤其是高踢脚的A高牌几乎要纯跟注；两张高牌（two overcards）也需要以一定频率继续游戏，甚至需要将其纳入加注诈唬范围。讲师通过大量频率数据与具体牌例，展示了不同位置组合（BTN vs CO、BB vs SB）和不同探注尺度（30%底池、70%底池、1.2倍底池）下的最优应对频率。", "视频最后给出了简化的执行策略：将高踢脚A高牌放入高频跟注区间（如80%或纯跟注），将中低踢脚A高牌放入低频跟注区间（如20%），以此在实战中更精确地执行理论频率，并利用对手在此类场景中普遍过度弃牌、加注不足的倾向进行剥削。"], "note": ""}, {"id": "DGL#66-s0", "ep": "66", "type": "topic", "topic": "DGL#66 - 翻前3-bet后处于有利位置：如何在低牌面（LLL）上游戏非对子底牌", "en": "PFR 3BP IP - How To Play Unpaired Hands on LLL Boards", "q": "场景设定与过牌频率", "clues": ["probe bet", "UTG", "BB vs SB", "BTN vs CO"], "a": ["本视频讨论的场景为：翻前3-bet方处于有利位置（IP），翻牌圈过牌后，在转牌圈面对对手的探注（probe bet）。", "位置组合包括：BTN vs 劫位（HJ）/关位（CO）/枪口（UTG），以及BB vs SB。", "在BTN vs CO的组合中，所有牌面结构下3-bet方的过牌频率仅为18%，但在三低牌面（triple low boards）上过牌频率升至37%。", "在BB vs SB的组合中，整体过牌频率为38%，而在三低牌面上过牌频率为32%。", "两个位置组合在三低牌面上都有显著的过牌频率，这是本视频策略讨论的基础。", "BB vs SB组合在三低牌面上过牌频率略低于BTN vs CO，原因是BB的范围更加极化（polarized），包含更多低牌（如A2o、A3o、K6o），而BTN vs CO的范围主要是中等口袋对和更好的同花高张。"], "note": ""}, {"id": "DGL#66-s1", "ep": "66", "type": "topic", "topic": "DGL#66 - 翻前3-bet后处于有利位置：如何在低牌面（LLL）上游戏非对子底牌", "en": "PFR 3BP IP - How To Play Unpaired Hands on LLL Boards", "q": "非对子底牌的整体应对频率", "clues": ["BTN vs CO", "trash", "BB vs SB", "30%"], "a": ["在BTN vs CO组合、三低牌面上，面对30%底池探注时，A高牌与垃圾牌（trash）三类手牌的综合应对频率为：跟注63%、弃牌23%、加注15%。", "在BB vs SB组合、三低牌面上，面对70%底池探注时（该尺度在理论上最常用），应对频率为：跟注53%、弃牌42%、加注5.5%。", "讲师强调：在这些场景中不能过于被动，必须大量跟注，并且有时需要加注，不能只用对子牌型继续游戏。"], "note": ""}, {"id": "DGL#66-s2", "ep": "66", "type": "topic", "topic": "DGL#66 - 翻前3-bet后处于有利位置：如何在低牌面（LLL）上游戏非对子底牌", "en": "PFR 3BP IP - How To Play Unpaired Hands on LLL Boards", "q": "A高牌应对30%探注（BTN vs CO）", "clues": ["BTN vs HJ", "30%", "23%", "68%"], "a": ["面对30%底池探注时，A高牌的整体频率为：弃牌23%、跟注68%、加注9.3%。", "大部分弃牌来自低踢脚的A高牌，高踢脚A高牌几乎不弃牌。", "牌例1：BTN vs HJ，翻牌面6-3-2两花色，翻牌圈过牌过牌，转牌8♣，面对1/4底池下注——A K与A Q组合纯跟注，中等踢脚的A高牌弃牌。", "牌例2：转牌为7时，A K与A Q纯跟注，中等踢脚弃牌；转牌为6时，跟注范围扩展至A J；转牌为5时，A K与A Q跟注，A J少量跟注；转牌为4时，A K与A Q在跟注范围中占比很高。", "核心原则：在低牌面上，高踢脚的A高牌倾向于纯跟注，低踢脚的A高牌更多弃牌，平均跟注频率68%意味着高踢脚纯跟、低踢脚多弃。"], "note": ""}, {"id": "DGL#66-s3", "ep": "66", "type": "topic", "topic": "DGL#66 - 翻前3-bet后处于有利位置：如何在低牌面（LLL）上游戏非对子底牌", "en": "PFR 3BP IP - How To Play Unpaired Hands on LLL Boards", "q": "两张高牌（Two Overcards）的应对", "clues": ["BTN vs CO", "30%", "20%", "11%"], "a": ["在BTN vs CO、三低牌面、面对30%探注时，两张高牌（如Q J）的应对频率为：跟注约20%、加注11%。", "两张高牌并非100%放弃，它们既属于加注诈唬范围的一部分，也属于跟注范围的一部分。", "牌例：翻牌面5-3-3，转牌6，对手下注30%底池，手持Q J不能总是弃牌——否则会被剥削。需要以一定频率继续跟注，也需要以一定频率加注。", "讲师指出：大多数玩家在此场景中会过度弃牌且加注不足，这是可剥削的漏洞。"], "note": ""}, {"id": "DGL#66-s4", "ep": "66", "type": "topic", "topic": "DGL#66 - 翻前3-bet后处于有利位置：如何在低牌面（LLL）上游戏非对子底牌", "en": "PFR 3BP IP - How To Play Unpaired Hands on LLL Boards", "q": "BB vs SB面对70%探注", "clues": ["BB vs SB", "split", "70%", "50%"], "a": ["在BB vs SB组合、三低牌面上，面对70%底池探注时，A高牌的应对频率为约50%跟注、50%弃牌（50-50 split）。", "高踢脚A高牌跟注更多，低踢脚A高牌弃牌更多；如果没有卡顺听牌等额外补牌，低踢脚会更倾向于弃牌。", "面对70%底池探注时，两张高牌的跟注频率仅为4.9%-12%，几乎不跟注。", "讲师表示：如果追求极致频率精确性，可以少量跟注这些两张高牌；但如果直接弃掉，也不会被责怪。"], "note": ""}, {"id": "DGL#66-s5", "ep": "66", "type": "topic", "topic": "DGL#66 - 翻前3-bet后处于有利位置：如何在低牌面（LLL）上游戏非对子底牌", "en": "PFR 3BP IP - How To Play Unpaired Hands on LLL Boards", "q": "BB vs SB面对30%探注", "clues": ["BB vs SB", "float", "BTN vs CO", "30%"], "a": ["在BB vs SB组合、三低牌面上，如果面对30%底池探注（小尺度探注），A高牌的应对频率为：弃牌29%、跟注63%、加注7.5%。", "两张高牌的跟注频率为46%——面对小尺度探注时，必须大量漂浮跟注（float）两张高牌。", "讲师强调：不要在此场景中过度弃牌，这一点与BTN vs CO组合类似。"], "note": ""}, {"id": "DGL#66-s6", "ep": "66", "type": "topic", "topic": "DGL#66 - 翻前3-bet后处于有利位置：如何在低牌面（LLL）上游戏非对子底牌", "en": "PFR 3BP IP - How To Play Unpaired Hands on LLL Boards", "q": "面对超池下注（Overbet）的应对", "clues": ["BB vs SB", "40%", "50%"], "a": ["在BB vs SB组合、三低牌面上，面对1.2倍底池的超池探注时，A高牌仍需跟注40%——主要是高踢脚A高牌，低踢脚几乎不跟。", "牌例1：翻牌面6-6-2，翻牌圈过牌过牌，转牌7♣，面对1.1倍底池下注——A K从不弃牌，A Q几乎从不弃牌，A J也是极高频率跟注。", "牌例2：翻牌面6-6-2（同前），转牌为6，面对超池下注——A K跟注约50%，A Q跟注更多，A J跟注频率非常高。", "结论：即使在低牌面上面对超池下注，也必须用A高牌继续跟注，否则会被剥削。"], "note": ""}, {"id": "DGL#66-s7", "ep": "66", "type": "topic", "topic": "DGL#66 - 翻前3-bet后处于有利位置：如何在低牌面（LLL）上游戏非对子底牌", "en": "PFR 3BP IP - How To Play Unpaired Hands on LLL Boards", "q": "简化执行策略", "clues": ["bucket", "BTN vs CO", "68%", "80%"], "a": ["讲师指出：这些频率数字不需要死记硬背，可以将其归入几个大致的区间（bucket）。", "核心记忆原则：高踢脚A高牌比中等踢脚A高牌跟注更多。", "执行建议1：在跟注频率约68%的场景中，将高踢脚A高牌放入80%或纯跟注区间，将中低踢脚A高牌放入20%跟注区间。", "执行建议2：在50-50跟注/弃牌的场景中，将高踢脚A高牌放入60%跟注区间，将低踢脚A高牌放入20%甚至0%跟注区间。", "理由：在BTN vs CO等组合中，低踢脚A高牌本身在范围中占比就不高，因此将其低频处理不会损失太多EV。"], "note": ""}, {"id": "DGL#66-c0", "ep": "66", "type": "cloze", "topic": "DGL#66 - 翻前3-bet后处于有利位置：如何在低牌面（LLL）上游戏非对子底牌", "en": "PFR 3BP IP - How To Play Unpaired Hands on LLL Boards", "q": "所有牌面结构下3-bet方的过牌频率仅为＿＿，但在三低牌面（triple low boards）上过牌频率升至37%。", "clues": [], "a": ["在BTN vs CO的组合中，所有牌面结构下3-bet方的过牌频率仅为18%，但在三低牌面（triple low boards）上过牌频率升至37%。"], "note": "18%"}, {"id": "DGL#66-c1", "ep": "66", "type": "cloze", "topic": "DGL#66 - 翻前3-bet后处于有利位置：如何在低牌面（LLL）上游戏非对子底牌", "en": "PFR 3BP IP - How To Play Unpaired Hands on LLL Boards", "q": "面对＿＿底池探注时，A高牌与垃圾牌（trash）三类手牌的综合应对频率为：跟注63%、弃牌23%、加注15%。", "clues": [], "a": ["在BTN vs CO组合、三低牌面上，面对30%底池探注时，A高牌与垃圾牌（trash）三类手牌的综合应对频率为：跟注63%、弃牌23%、加注15%。"], "note": "30%"}, {"id": "DGL#66-c2", "ep": "66", "type": "cloze", "topic": "DGL#66 - 翻前3-bet后处于有利位置：如何在低牌面（LLL）上游戏非对子底牌", "en": "PFR 3BP IP - How To Play Unpaired Hands on LLL Boards", "q": "面对＿＿底池探注时，A高牌的整体频率为：弃牌23%、跟注68%、加注9.3%。", "clues": [], "a": ["面对30%底池探注时，A高牌的整体频率为：弃牌23%、跟注68%、加注9.3%。"], "note": "30%"}, {"id": "DGL#66-note", "ep": "66", "type": "note", "topic": "DGL#66 - 翻前3-bet后处于有利位置：如何在低牌面（LLL）上游戏非对子底牌", "en": "PFR 3BP IP - How To Play Unpaired Hands on LLL Boards", "q": "避坑提醒与行动项", "clues": ["DGL", "Dose of Green", "Line"], "a": ["本视频是DGL系列（Dose of Green Line）的第66期，专注于翻前3-bet后有利位置、低牌面、面对探注的非对子底牌处理。该系列以简洁的启发式规则（heuristics）为核心教学方式，帮助玩家在复杂场景中快速做出接近GTO的决策。本视频与此前关于3-bet底池翻后策略的视频形成承接关系，后续可进一步学习对子底牌（pair+）在同一场景下的处理方式，以及转牌圈其他牌面结构（如高牌面、连牌面）的应对策略。", "### 行动项与常见错误", "- 应该这样做：面对小尺度探注（30%底池）时，A高牌整体跟注频率应保持在60%以上，高踢脚A高牌纯跟注。", "- 应该这样做：面对小尺度探注时，两张高牌（如Q J）需要以约20%频率跟注、约11%频率加注，不能完全放弃。", "- 应该这样做：面对超池探注（1.2倍底池）时，A K、A Q仍需高频跟注，A J也需大量跟注。", "- 应该这样做：将高踢脚A高牌放入高频跟注区间（80%或纯跟），将中低踢脚A高牌放入低频跟注区间（20%或更低）。", "- 不要这样做：不要在三低牌面上过度弃牌——大多数玩家在此场景中弃牌过多，这是可被剥削的漏洞。", "- 不要这样做：不要只用对子牌型继续游戏，A高牌和两张高牌必须承担大量跟注与加注频率。", "- 不要这样做：面对70%底池探注时，不要用两张高牌频繁跟注——此时弃牌是合理的，少量跟注仅为频率平衡。"], "note": ""}, {"id": "DGL#67-intro", "ep": "67", "type": "intro", "topic": "DGL#67 - 翻前加注单次加注底池有利位置：提升阻挡牌识别能力", "en": "PFR SRP IP Improving Blocker Recognition", "q": "DGL#67 - 翻前加注单次加注底池有利位置：提升阻挡牌识别能力", "clues": ["double barrel", "blocker", "GTO Wizard"], "a": ["本视频通过一个具体的翻后三枪牌例，深入讲解如何在有利位置（IP）构建转牌圈的双重下注（double barrel）策略，核心目标是提升玩家对阻挡牌（blocker）效应的识别能力。视频以GTO Wizard模拟数据为基础，展示了在特定公共牌面下，空气牌（air）部分范围应如何以混合频率下注，并强调了“阻挡对手弃牌范围”这一关键原则。", "视频首先指出，在翻牌圈下注75%底池后，转牌圈需要继续下注的范围应包含听牌、一对牌型以及空气牌。随后，视频重点分析了空气牌内部的不同选择：并非所有空气牌都适合高频下注，例如Q高和J高牌型下注频率较低，而两张中间牌（如98s、87s）则接近纯下注。这一差异的根本原因在于阻挡牌效应——需要识别对手的弃牌范围主要集中于哪些牌型组合。", "最后，视频提出了一个可操作的思考框架：在构建诈唬范围前，先可视化对手面对下注时的弃牌范围，尤其是非同花（offsuit）组合。通过判断自身牌型是阻挡还是未阻挡（unblock）对手的弃牌范围，玩家可以更精准地调整下注频率，从而在保持整体平衡的基础上，提高诈唬策略的剥削性和有效性。"], "note": ""}, {"id": "DGL#67-s0", "ep": "67", "type": "topic", "topic": "DGL#67 - 翻前加注单次加注底池有利位置：提升阻挡牌识别能力", "en": "PFR SRP IP Improving Blocker Recognition", "q": "牌例背景与行动线", "clues": ["Frenzy", "SRP", "75%", "100%"], "a": ["牌例来自社区成员Frenzy在Hand History Forum分享的一手牌，原问题是询问在大盲位手持A9面对常规对手三枪下注是否该跟注，但本视频从对手（翻前加注者）视角分析策略。", "行动线：CO位（关位）开局加注2.5x，大盲位跟注，翻牌圈CO位下注75%底池，转牌圈下注100%底池（满池），河牌圈继续下注（三枪）。", "公共牌面：A♠T♦4♣2♣（翻牌A-T-4彩虹面，转牌2♣），底池与筹码深度未明确给出，但属于单次加注底池（SRP）且IP玩家为翻前加注者。"], "note": ""}, {"id": "DGL#67-s1", "ep": "67", "type": "topic", "topic": "DGL#67 - 翻前加注单次加注底池有利位置：提升阻挡牌识别能力", "en": "PFR SRP IP Improving Blocker Recognition", "q": "转牌圈双重下注的整体策略框架", "clues": ["draws", "one pair hands", "GTO", "gut shots"], "a": ["转牌圈下注范围需包含三类牌型：听牌（draws）、一对牌型（one pair hands）和空气牌（air hands），三者缺一不可，这是GTO平衡策略的支柱之一。", "听牌部分：卡顺听牌（gut shots）必须采用50-50的混合策略（约50%下注、50%过牌），不能总是下注，否则会被剥削；例如QT、J9等卡顺听牌均需混合。", "一对牌型：需要下注一些一对牌型，例如54（对子+卡顺）、口袋对子55和33（对子+卡顺），若范围中有类似结构的牌型（如A2s）也应混合下注。", "空气牌部分：整体下注频率为40-60（40%下注、60%过牌），高于此类牌型在该行动线中的典型频率约25%，原因是本牌面结构特殊。"], "note": ""}, {"id": "DGL#67-s2", "ep": "67", "type": "topic", "topic": "DGL#67 - 翻前加注单次加注底池有利位置：提升阻挡牌识别能力", "en": "PFR SRP IP Improving Blocker Recognition", "q": "空气牌内部的频率差异与选择标准", "clues": ["pure bet", "one overcard to", "the second pair", "equity"], "a": ["在空气牌范围内，Q高和J高牌型（如QJ、KQ、KJ等）下注频率较低，不是好的诈唬候选；而两张中间牌（如98s、97s、87s、86s、76s）下注频率极高，部分甚至接近纯下注（pure bet）。", "常见但在此处无效的启发式规则：用“一张高过第二对子（one overcard to the second pair）”的牌型下注。该规则在其他场合有效，但本牌面中对手的第二对子（如T-x）在翻牌圈已大量弃牌，转牌圈几乎全部弃牌，因此保留的权益（equity）意义不大。", "核心判断标准：阻挡牌效应（blockers to folding range）。需要可视化对手面对下注时的弃牌范围，选择未阻挡（unblock）该范围的牌型进行诈唬，避免阻挡（block）该范围的牌型。"], "note": ""}, {"id": "DGL#67-s3", "ep": "67", "type": "topic", "topic": "DGL#67 - 翻前加注单次加注底池有利位置：提升阻挡牌识别能力", "en": "PFR SRP IP Improving Blocker Recognition", "q": "对手弃牌范围的构成与阻挡牌分析", "clues": ["Broadway", "75%"], "a": ["当翻牌圈下注75%后，转牌圈继续下注时，对手（大盲位）的弃牌范围高度集中于非同花的Broadway区域（即Q-x、J-x、K-x等牌型）。", "原因：对手在翻牌圈会用卡顺听牌和第二对子跟注，转牌圈这些牌型大多无法承受满池下注，因此成为弃牌范围的主体。", "非同花组合数量远多于同花组合，因此在可视化对手弃牌范围时，必须优先考虑非同花组合，这是估计阻挡牌好坏的关键。", "具体数据：对手弃牌范围中有大量Q-x、J-x、K-x组合，而几乎没有任何两张中间牌（如98、87、76）的组合（除T-x外），这使得Q高/J高牌型阻挡了对手的主要弃牌区域，而中间牌型未阻挡该区域。"], "note": ""}, {"id": "DGL#67-s4", "ep": "67", "type": "topic", "topic": "DGL#67 - 翻前加注单次加注底池有利位置：提升阻挡牌识别能力", "en": "PFR SRP IP Improving Blocker Recognition", "q": "构建诈唬范围的实操方法", "clues": ["GTO", "baseline bucket", "25%", "30%"], "a": ["第一步：确定空气牌的整体下注频率基线（如25%、30%、40%），这是GTO策略的基础桶（baseline bucket）。", "第二步：在基线基础上进一步细分，识别空气牌内部哪些牌型阻挡了对手弃牌范围（应降低下注频率），哪些未阻挡（应提高下注频率）。", "第三步：在实战中，每次构建诈唬范围前，先在脑中可视化对手的弃牌范围，尤其关注非同花组合，然后据此调整具体牌型的下注频率。", "示例：本牌例中，通过可视化对手弃牌范围高度集中于Q高/J高，即可轻松得出“降低Q高/J高下注频率、提高98s/87s等中间牌下注频率”的结论。"], "note": ""}, {"id": "DGL#67-s5", "ep": "67", "type": "topic", "topic": "DGL#67 - 翻前加注单次加注底池有利位置：提升阻挡牌识别能力", "en": "PFR SRP IP Improving Blocker Recognition", "q": "常见错误与误区", "clues": ["40%", "25%"], "a": ["错误一：对所有空气牌使用统一的下注频率（如统一40%或25%），而不区分具体牌型，这会导致诈唬范围包含过多阻挡对手弃牌的牌型，降低整体EV。", "错误二：盲目使用“一张高过第二对子”的启发式规则，未考虑对手第二对子是否会在转牌圈继续跟注，本牌例中该规则失效。", "错误三：在可视化对手弃牌范围时只考虑同花组合，忽略非同花组合，导致对阻挡牌效应的估计严重偏差。"], "note": ""}, {"id": "DGL#67-c0", "ep": "67", "type": "cloze", "topic": "DGL#67 - 翻前加注单次加注底池有利位置：提升阻挡牌识别能力", "en": "PFR SRP IP Improving Blocker Recognition", "q": "翻牌圈CO位下注＿＿底池，转牌圈下注100%底池（满池），", "clues": [], "a": ["行动线：CO位（关位）开局加注2.5x，大盲位跟注，翻牌圈CO位下注75%底池，转牌圈下注100%底池（满池），河牌圈继续下注（三枪）。"], "note": "75%"}, {"id": "DGL#67-c1", "ep": "67", "type": "cloze", "topic": "DGL#67 - 翻前加注单次加注底池有利位置：提升阻挡牌识别能力", "en": "PFR SRP IP Improving Blocker Recognition", "q": "听牌部分：卡顺听牌（gut shots）必须采用50-50的混合策略（约＿＿下注、50%过牌），", "clues": [], "a": ["听牌部分：卡顺听牌（gut shots）必须采用50-50的混合策略（约50%下注、50%过牌），不能总是下注，否则会被剥削；例如QT、J9等卡顺听牌均需混合。"], "note": "50%"}, {"id": "DGL#67-c3", "ep": "67", "type": "cloze", "topic": "DGL#67 - 翻前加注单次加注底池有利位置：提升阻挡牌识别能力", "en": "PFR SRP IP Improving Blocker Recognition", "q": "当翻牌圈下注＿＿后，转牌圈继续下注时，", "clues": [], "a": ["当翻牌圈下注75%后，转牌圈继续下注时，对手（大盲位）的弃牌范围高度集中于非同花的Broadway区域（即Q-x、J-x、K-x等牌型）。"], "note": "75%"}, {"id": "DGL#67-note", "ep": "67", "type": "note", "topic": "DGL#67 - 翻前加注单次加注底池有利位置：提升阻挡牌识别能力", "en": "PFR SRP IP Improving Blocker Recognition", "q": "避坑提醒与行动项", "clues": ["DGL", "Deep Game Logic", "PFR SRP"], "a": ["本视频是DGL系列（Deep Game Logic）第67期，承接了之前关于翻前加注单次加注底池（PFR SRP）中IP玩家策略的讨论，重点转向转牌圈的双重下注策略与阻挡牌识别。视频强调，阻挡牌效应是GTO策略中连接范围构建与具体牌型选择的桥梁，掌握这一能力需要大量练习和对手弃牌范围的清晰可视化。建议观众在实战中刻意练习“先想对手弃牌范围，再选诈唬牌型”的思考流程，并可使用GTO Wizard等工具验证自己的判断。", "行动项：", "- 在转牌圈构建双重下注范围时，先确定空气牌的整体下注频率基线（如25%-40%），再根据阻挡牌效应调整具体牌型频率。", "- 可视化对手弃牌范围时，优先考虑非同花组合，因为其数量远多于同花组合。", "- 避免对所有空气牌使用统一频率，应降低阻挡弃牌范围牌型的下注频率，提高未阻挡弃牌范围牌型的下注频率。", "- 不要盲目套用“一张高过第二对子”的规则，需结合具体牌面判断对手第二对子的弃牌倾向。"], "note": ""}, {"id": "DGL#68-intro", "ep": "68", "type": "intro", "topic": "DGL#68 - 翻前单次加注底池、不利位置、第二大对子面对转牌混合策略分桶", "en": "PFC SRP OOP 2nd Pair Mixed Strategy Bucket", "q": "DGL#68 - 翻前单次加注底池、不利位置、第二大对子面对转牌混合策略分桶", "clues": ["second pair"], "a": ["本视频聚焦于一个具体且高频的翻后场景：玩家在大盲位（BB）对抗有利位置玩家（IP），翻牌圈面对小尺度下注后跟注，转牌圈又面对一个中等偏大（约3/4底池）的下注，此时手持第二大对子（second pair）应该如何应对。讲师明确指出，这类牌型是翻后最常遇到的困难局面之一，因此必须建立一套清晰的理论启发式策略，而不是临场随意决定。", "视频的核心方法论是使用“混合策略分桶系统”（mixed strategy bucket system），即把行动频率按20%的倍数进行归类。通过GTO求解器数据，讲师发现第二大对子在此类线路中的最优策略接近50/50的跟注与弃权拆分，但为便于实际执行，建议玩家采用“40%跟注、60%弃牌”的简化分桶。该策略既能防止被对手过度剥削，又可根据具体牌面结构进行微调。", "视频还通过两个具体牌例验证了这一分桶的适用性：一个是大盲对关位（CO）在A-10-4-2-10牌面，另一个是大盲对按钮位（BTN）在K-9-3转牌2的牌面。两个例子中，第二大对子的最优跟注频率均在40%-50%区间，进一步印证了该分桶作为通用基准的可靠性。"], "note": ""}, {"id": "DGL#68-s0", "ep": "68", "type": "topic", "topic": "DGL#68 - 翻前单次加注底池、不利位置、第二大对子面对转牌混合策略分桶", "en": "PFC SRP OOP 2nd Pair Mixed Strategy Bucket", "q": "视频背景与问题定义", "clues": ["A9o"], "a": ["本视频由之前分析过的一手牌引发：英雄在大盲位手持A9o，在A-10-4-2-10的牌面上面对对手的三枪下注（翻牌、转牌、河牌）。", "现在暂时忽略A9这手牌，假设英雄手持的是10x类型的第二大对子，这正是转牌圈容易被第二枪下注置于困境的典型牌型。", "核心问题：面对有利位置玩家的转牌第二枪下注，第二大对子应该以多高的频率跟注？"], "note": ""}, {"id": "DGL#68-s1", "ep": "68", "type": "topic", "topic": "DGL#68 - 翻前单次加注底池、不利位置、第二大对子面对转牌混合策略分桶", "en": "PFC SRP OOP 2nd Pair Mixed Strategy Bucket", "q": "场景设定与前提条件", "clues": ["small size", "size bet", "SRP"], "a": ["本视频的标准场景：大盲位（BB）对抗有利位置玩家（IP），翻牌圈面对小尺度下注（small size），转牌圈面对约3/4底池的下注（three-quarter pot size bet）。", "讲师特别说明：之前那手牌中翻牌圈面对的是大尺度下注，但这种情况并不常见；最常见的翻牌下注尺度是小注，因此本视频以此为标准场景。", "该场景设定适用于绝大多数翻前单次加注底池（SRP）中第二大对子面对的典型压力局面。"], "note": ""}, {"id": "DGL#68-s2", "ep": "68", "type": "topic", "topic": "DGL#68 - 翻前单次加注底池、不利位置、第二大对子面对转牌混合策略分桶", "en": "PFC SRP OOP 2nd Pair Mixed Strategy Bucket", "q": "混合策略分桶的推导方法", "clues": ["GTO", "OOP", "double barrel", "middle pair"], "a": ["推导混合策略分桶和手牌类别频率启发式的方法非常简单：使用GTO求解器生成的手牌历史（GTO hand histories）数据。", "讲师已预设好过滤器：我方处于不利位置（OOP），面对有利位置玩家的双枪下注（double barrel）。", "在转牌圈我方可能持有的所有手牌类别中，第二大对子（middle pair）是出现频率最高的类别，因此掌握其正确打法至关重要。"], "note": ""}, {"id": "DGL#68-s3", "ep": "68", "type": "topic", "topic": "DGL#68 - 翻前单次加注底池、不利位置、第二大对子面对转牌混合策略分桶", "en": "PFC SRP OOP 2nd Pair Mixed Strategy Bucket", "q": "第二大对子的核心分桶结论", "clues": ["GTO", "OOP", "20%", "50%"], "a": ["GTO数据显示：第二大对子在此场景下的最优策略接近50/50的跟注与弃牌拆分。", "由于讲师推荐使用20%倍数的分桶系统（buckets multiples of 20%），50%更接近40%的桶，因此实际执行建议为：60%弃牌、40%跟注。", "该结论适用于：不利位置（OOP）对抗有利位置玩家（IP），翻牌小注、转牌中等偏大下注的线路。", "只要遵循这个40%跟注、60%弃牌的分桶，就能在第二大对子区域获得非常精准的执行效果。"], "note": ""}, {"id": "DGL#68-s4", "ep": "68", "type": "topic", "topic": "DGL#68 - 翻前单次加注底池、不利位置、第二大对子面对转牌混合策略分桶", "en": "PFC SRP OOP 2nd Pair Mixed Strategy Bucket", "q": "牌例验证一：A-10-4-2-10牌面", "clues": ["GTO", "40%", "60%"], "a": ["具体场景：大盲位（BB）对抗关位（CO），翻牌圈面对小尺度下注，转牌圈面对约3/4底池的下注。", "在转牌圈的第二大对子区域，GTO求解器给出的最优策略同样是40%跟注、60%弃牌。", "该结果与前述通用分桶完全一致，验证了分桶系统的稳定性。"], "note": ""}, {"id": "DGL#68-s5", "ep": "68", "type": "topic", "topic": "DGL#68 - 翻前单次加注底池、不利位置、第二大对子面对转牌混合策略分桶", "en": "PFC SRP OOP 2nd Pair Mixed Strategy Bucket", "q": "牌例验证二：K-9-3转牌2牌面", "clues": ["BTN", "bet small", "pot", "50%"], "a": ["具体场景：大盲位（BB）对抗按钮位（BTN），翻牌圈面对小尺度下注（c-bet small），转牌圈下注1.2倍底池（1.2x pot）。", "在9x区域（即第二大对子），最优策略是50%跟注、50%弃牌。", "该例子中跟注频率略高于40%，但仍在40%-50%的合理区间内，进一步说明40%跟注分桶作为通用基准的可靠性。"], "note": ""}, {"id": "DGL#68-s6", "ep": "68", "type": "topic", "topic": "DGL#68 - 翻前单次加注底池、不利位置、第二大对子面对转牌混合策略分桶", "en": "PFC SRP OOP 2nd Pair Mixed Strategy Bucket", "q": "分桶的调整原则", "clues": ["top pair", "40%", "50%"], "a": ["不同牌面结构下，第二大对子的具体跟注频率会有所变化：某些牌面可以弃牌更多，某些牌面可以跟注更多。", "调整的依据主要取决于：我方范围内第二大对子的数量、可用于跟注的顶对（top pair）数量等因素。", "40%跟注或50%跟注的分桶是非常稳固的基准，只要纳入游戏计划，就能避免被对手过度剥削。", "如果玩家有充分理由认为对手过度弃牌或过度跟注，可以相应增加或减少跟注频率，即上调或下调分桶。"], "note": ""}, {"id": "DGL#68-c3", "ep": "68", "type": "cloze", "topic": "DGL#68 - 翻前单次加注底池、不利位置、第二大对子面对转牌混合策略分桶", "en": "PFC SRP OOP 2nd Pair Mixed Strategy Bucket", "q": "由于讲师推荐使用＿＿倍数的分桶系统（buckets multiples of 20%），", "clues": [], "a": ["由于讲师推荐使用20%倍数的分桶系统（buckets multiples of 20%），50%更接近40%的桶，因此实际执行建议为：60%弃牌、40%跟注。"], "note": "20%"}, {"id": "DGL#68-c4", "ep": "68", "type": "cloze", "topic": "DGL#68 - 翻前单次加注底池、不利位置、第二大对子面对转牌混合策略分桶", "en": "PFC SRP OOP 2nd Pair Mixed Strategy Bucket", "q": "GTO求解器给出的最优策略同样是＿＿跟注、60%弃牌。", "clues": [], "a": ["在转牌圈的第二大对子区域，GTO求解器给出的最优策略同样是40%跟注、60%弃牌。"], "note": "40%"}, {"id": "DGL#68-c5", "ep": "68", "type": "cloze", "topic": "DGL#68 - 翻前单次加注底池、不利位置、第二大对子面对转牌混合策略分桶", "en": "PFC SRP OOP 2nd Pair Mixed Strategy Bucket", "q": "在9x区域（即第二大对子），最优策略是＿＿跟注、50%弃牌。", "clues": [], "a": ["在9x区域（即第二大对子），最优策略是50%跟注、50%弃牌。"], "note": "50%"}, {"id": "DGL#68-note", "ep": "68", "type": "note", "topic": "DGL#68 - 翻前单次加注底池、不利位置、第二大对子面对转牌混合策略分桶", "en": "PFC SRP OOP 2nd Pair Mixed Strategy Bucket", "q": "避坑提醒与行动项", "clues": ["DGL", "20%", "40%"], "a": ["本视频是DGL系列（第68期）的一部分，延续了之前关于第二大对子面对三枪下注的讨论，但将焦点从河牌圈决策转移到转牌圈的混合策略分桶。视频中提到的“手牌类别频率启发式”和“20%倍数分桶系统”是该系列的核心方法论，建议观众结合前几期内容系统学习。后续可进一步探讨河牌圈的第二大对子决策，以及不同翻牌面结构（如连接性、花色分布）对分桶的具体影响。", "**行动项与常见错误：**", "- 应该做：在翻牌小注、转牌3/4底池下注的线路中，第二大对子默认采用40%跟注、60%弃牌的分桶。", "- 应该做：根据具体牌面中第二大对子的数量以及顶对数量，微调跟注频率（上调或下调一个桶）。", "- 不要做：在没有明确理由的情况下，对第二大对子采取极端策略（如几乎总是跟注或几乎总是弃牌），这容易被对手利用。", "- 不要做：忽略第二大对子是该线路中最高频出现的手牌类别，必须为其制定明确的策略而非临场随意决定。"], "note": ""}, {"id": "DGL#69-intro", "ep": "69", "type": "intro", "topic": "DGL#69 - 翻前加注者单次加注底池、不利位置过牌加注尺度启发式", "en": "PFR SRP OOP XR Size Heuristics", "q": "DGL#69 - 翻前加注者单次加注底池、不利位置过牌加注尺度启发式", "clues": ["Discord", "SRP", "50%"], "a": ["本视频围绕一位成员在Discord上提出的问题展开：在单次加注底池（SRP）中，当小盲位（SB）翻前加注、大盲位（BB）跟注后，小盲位在翻牌圈过牌，面对大盲位的下注时，求解器有时会选择50%底池的过牌加注尺度，有时又选择100%底池的尺度，是否有启发式规则可以帮助我们选择合适的过牌加注尺度。讲师通过分析三种典型的翻牌面结构（锁定型、动态波动型、低连接且有利于不利位置玩家范围型），系统性地回答了这一问题。", "视频的核心观点是：过牌加注尺度的选择并非随意，而是取决于翻牌面纹理、双方范围的互动方式、小盲位自身的翻牌圈过牌策略以及大盲位的下注尺度与范围结构。讲师强调，选择尺度的根本逻辑在于“生成对手范围的无差别点（indifference）”——即让对手的某些牌在跟注与弃牌之间无差别，而非简单地根据底池大小或抽牌数量来决定。此外，视频还详细展示了每种翻牌面类型下过牌加注范围的具体构成，包括价值牌与诈唬牌的组合选择。", "内容框架分为三部分：首先分析锁定型高牌面（如A-J-5）的过牌加注策略，其次讨论动态湿牌面（如J-T-4）的过牌加注策略，最后探讨低连接且对不利位置玩家不利的牌面（如7-6-5）的过牌加注策略。每一部分都包含了范围构成、下注尺度、频率以及背后的理论依据。"], "note": ""}, {"id": "DGL#69-s0", "ep": "69", "type": "topic", "topic": "DGL#69 - 翻前加注者单次加注底池、不利位置过牌加注尺度启发式", "en": "PFR SRP OOP XR Size Heuristics", "q": "问题背景与分析方法", "clues": ["Nadi Ma", "Discord", "GTO Wizard", "50%"], "a": ["问题来源：成员Nadi Ma在Discord上提问，在单次加注底池中，求解器有时用50%底池、有时用100%底池作为过牌加注尺度，是否有启发式规则帮助选择。", "分析工具：使用GTO Wizard等常规求解器工具，但工具本身不是重点，重点在于理解策略背后的逻辑。", "分析框架：聚焦三个核心要素——范围互动（双方范围如何与翻牌面连接）、小盲位翻牌圈过牌策略（影响过牌范围构成，进而影响对手的下注范围）、大盲位的下注尺度（影响过牌加注策略的构建）。", "结论输出：基于求解器输出结果提取启发式规则，适用于不同翻牌面配置。"], "note": ""}, {"id": "DGL#69-s1", "ep": "69", "type": "topic", "topic": "DGL#69 - 翻前加注者单次加注底池、不利位置过牌加注尺度启发式", "en": "PFR SRP OOP XR Size Heuristics", "q": "翻牌面类型一：锁定型高牌面", "clues": ["GTO Wizard", "bet", "Broadway", "75%"], "a": ["典型牌面：A♠J♥5♦（两色），属于高牌锁定型，小盲位具有坚果优势，拥有A-J、暗三条以及大盲位可能没有的高踢脚K-X组合。", "大盲位策略：在此类牌面上，若使用单一尺度，求解器偏好低频的75%底池下注；根据GTO Wizard，大盲位最佳下注尺度为100%底池，且仅在下注频率22%时使用。", "范围构成数据：小盲位范围中顶对占比22%，大盲位为15%；两对占比4%，暗三条占比1.8%；大盲位拥有更多空气牌，小盲位在最佳牌型上优势显著，中等牌力区域双方接近，垃圾牌小盲位更少。", "过牌加注尺度：求解器偏好50%底池的低频过牌加注。原因在于对手采用极化范围和大尺度下注，小尺度已足以生成对手反应的无差别点，并能接近几何级增长地扩大底池。", "范围构成：虽然尺度小，但范围仍然高度极化，包含两对以上牌型、阻挡牌以及强听牌作为诈唬。具体包括口袋对5、口袋对J、A-J、A-5，甚至部分顶对作为“价值诈唬”组合。", "关键洞察：当双方范围呈极化对极化互动时，小尺度过牌加注是首选。类比翻前：小盲位对BB的3-bet进行4-bet时，最优尺度也是小尺度，因为BB范围极化，小尺度已能生成无差别点，无需做大。", "锁定型牌面的特征：双高牌面（如双Broadway牌）、坚果优势显著且未来街牌面变化不大的牌面。"], "note": ""}, {"id": "DGL#69-s2", "ep": "69", "type": "topic", "topic": "DGL#69 - 翻前加注者单次加注底池、不利位置过牌加注尺度启发式", "en": "PFR SRP OOP XR Size Heuristics", "q": "翻牌面类型二：动态波动型牌面", "clues": ["GTO Wizard", "50%", "34%", "75%"], "a": ["典型牌面：J♠T♦4♣，看似与A-J-5相似，但实质不同。此牌面存在大量高权益听牌，如卡顺、两头顺以及带后门同花听的顺子听牌，未来街牌面结构变化极大。", "权益与EV数据：大盲位权益略高，EV也略高。小盲位仍具坚果优势，但大盲位相对权益份额更高。转牌圈有多张权益转移牌，如9、Q、黑桃等，这些牌会带来顺子并改变牌力分布。", "小盲位翻牌圈策略：使用半极化策略，若用单一尺度，GTO Wizard选择50%底池下注，频率较低（34%）。", "大盲位策略：下注尺度为75%底池，范围呈半极化结构，包含更多价值牌，如顶对、部分第二对，以及更多薄价值下注和诈唬组合。", "范围构成数据：大盲位两对以上牌型占比3%（因范围中包含T-9s等组合），小盲位拥有更多暗三条和超对，顶对和第二对双方接近，第三对大盲位更多。", "过牌加注尺度：求解器偏好底池大小的过牌加注，频率中等。范围构成包括对子加听牌、底对作为阻挡牌以及坚果价值牌，相比锁定型牌面，范围中加入了更多一对牌型（超对和部分顶对）。", "尺度选择逻辑：由于大盲位范围中存在大量高权益听牌，小尺度无法对这些牌生成无差别点。小尺度只能对极弱牌生成无差别，这不是此处的目标。大尺度能够有效拒绝权益，且小盲位拥有足够强的范围（如超对）来支撑大尺度。", "关键条件：选择大尺度的前提是自身范围足够强。即使结构上偏好大尺度，若范围强度不足也无法使用。本例中，大盲位没有J和T，小盲位拥有足够的超对来支持大尺度。", "重要澄清：并非因为听牌多就一定要大尺度，关键在于能否有效生成对手范围的无差别点。有些协调性高、听牌多的牌面反而未必适合大尺度，取决于自身范围在当前及未来街的可玩性。"], "note": ""}, {"id": "DGL#69-s3", "ep": "69", "type": "topic", "topic": "DGL#69 - 翻前加注者单次加注底池、不利位置过牌加注尺度启发式", "en": "PFR SRP OOP XR Size Heuristics", "q": "翻牌面类型三：低连接且IP范围占优", "clues": ["merged", "75%", "58%", "110%"], "a": ["典型牌面：7♠6♥5♦（两色），属于低连接牌面，小盲位因显著范围劣势而大量过牌，甚至可能范围过牌。", "大盲位优势：大盲位与此类牌面连接极深，拥有小盲位没有的非同花两对组合（如7-6o）、大量听牌，整体范围优势明显。", "大盲位策略：使用75%底池下注，频率高达58%，采用融合（merged）策略，针对小盲位封顶的过牌范围。", "权益与EV数据：权益几乎五五开（50-50），但权益实现率差异巨大——大盲位为110%，小盲位仅为72%。这意味着小盲位大量权益无法实现，会被大盲位有效诈唬和多条街施压而被迫弃牌。", "范围构成数据：大盲位顺子占比4.5%，小盲位仅1.8%；大盲位两对比例翻倍，顶对更多，超对更少。权益桶方面，大盲位拥有更多最佳牌型，且首次出现大盲位垃圾牌少于小盲位的情况——小盲位有大量高牌在此牌面上完全无用。", "过牌加注策略：小盲位范围强度不足以支持大尺度过牌加注，且大尺度会孤立自身范围。唯一选择是小尺度过牌加注，但必须执行——即使处于范围劣势，也必须通过过牌加注反击，否则会遭受更大损失。", "范围构成：采用融合范围，针对对手范围中较弱的区域生成无差别点，而非施压听牌。核心组合包括口袋对9和口袋对8（超对且阻挡顺子），以及8x组合（如带同花听牌的顺子听牌、裸卡顺听牌），还有K♠9、Q♠9、J♠9、T♠9等带黑桃的卡顺听牌。暗三条以中等频率游戏，不能总是快打。此外还有A♠5、A♠7、A♠6等带阻挡牌的一对牌型。", "核心作用：在高度连接的低牌面上，小盲位过牌加注必须承担两个角色——阻止对手过度实现权益，以及在不过度投入的情况下回收自身权益。由于范围强度不足，只能选择中等尺度（50%底池）来针对对手的中等权益牌。", "关键洞察：在有利于不利位置玩家范围的牌面上，使用融合的50%底池过牌加注尺度，目的是“生存”。"], "note": ""}, {"id": "DGL#69-s4", "ep": "69", "type": "topic", "topic": "DGL#69 - 翻前加注者单次加注底池、不利位置过牌加注尺度启发式", "en": "PFR SRP OOP XR Size Heuristics", "q": "三类牌面的总结与对比", "clues": ["bet", "50%", "100%"], "a": ["锁定型牌面：小尺度（50%底池）过牌加注 + 极化范围。原因：牌面有利于小盲位，对手下注极化且尺度大，小尺度已能生成无差别点，无需做大。类比翻前4-bet小盲对BB的3-bet。", "动态波动型牌面：大尺度（100%底池）过牌加注 + 范围包含更多一对牌型。原因：牌面仍有利但波动大，需要拒绝对手高权益听牌的权益，且自身范围足够强（有超对）来支撑大尺度。大尺度有效的关键在于能让对手的中等权益牌无差别，而非单纯“惩罚抽牌”。", "低连接且IP占优牌面：中等尺度（50%底池）过牌加注 + 融合范围。原因：自身范围弱，无法做大尺度，但必须反击。融合范围针对对手弱到中等权益牌生成无差别点，阻止对手过度实现权益。", "常见误区：选择大尺度不是因为“有抽牌要收费”，而是因为自身范围足够强、能够有效让对手的中等权益牌无差别。如果大尺度无法让对手的听牌无差别，那只是白白扩大底池，反而可能输给后门听牌。"], "note": ""}, {"id": "DGL#69-c0", "ep": "69", "type": "cloze", "topic": "DGL#69 - 翻前加注者单次加注底池、不利位置过牌加注尺度启发式", "en": "PFR SRP OOP XR Size Heuristics", "q": "求解器有时用＿＿底池、有时用100%底池作为过牌加注尺度，", "clues": [], "a": ["问题来源：成员Nadi Ma在Discord上提问，在单次加注底池中，求解器有时用50%底池、有时用100%底池作为过牌加注尺度，是否有启发式规则帮助选择。"], "note": "50%"}, {"id": "DGL#69-c1", "ep": "69", "type": "cloze", "topic": "DGL#69 - 翻前加注者单次加注底池、不利位置过牌加注尺度启发式", "en": "PFR SRP OOP XR Size Heuristics", "q": "求解器偏好低频的＿＿底池下注；根据GTO Wizard，", "clues": [], "a": ["大盲位策略：在此类牌面上，若使用单一尺度，求解器偏好低频的75%底池下注；根据GTO Wizard，大盲位最佳下注尺度为100%底池，且仅在下注频率22%时使用。"], "note": "75%"}, {"id": "DGL#69-c2", "ep": "69", "type": "cloze", "topic": "DGL#69 - 翻前加注者单次加注底池、不利位置过牌加注尺度启发式", "en": "PFR SRP OOP XR Size Heuristics", "q": "GTO Wizard选择＿＿底池下注，频率较低（34%）。", "clues": [], "a": ["小盲位翻牌圈策略：使用半极化策略，若用单一尺度，GTO Wizard选择50%底池下注，频率较低（34%）。"], "note": "50%"}, {"id": "DGL#69-note", "ep": "69", "type": "note", "topic": "DGL#69 - 翻前加注者单次加注底池、不利位置过牌加注尺度启发式", "en": "PFR SRP OOP XR Size Heuristics", "q": "避坑提醒与行动项", "clues": ["DGL", "Deep Game Logic", "50%"], "a": ["本视频属于DGL系列（Deep Game Logic）第69期，聚焦于翻前加注者单次加注底池中不利位置过牌加注尺度的选择。视频建立在之前关于翻前范围构建和翻牌圈策略的基础上，为玩家提供了从求解器输出中提炼可操作启发式规则的方法论。值得进一步学习的方向包括：转牌圈和河牌圈的过牌加注策略、不同筹码深度下的尺度调整、以及如何根据对手的具体倾向进行剥削性调整。", "**行动项与常见错误：**", "- 应该做：在锁定型高牌面上，面对对手的大尺度极化下注，使用小尺度（50%底池）过牌加注，范围保持极化。", "- 应该做：在动态波动型牌面上，若自身范围足够强（有足够超对），使用大尺度（100%底池）过牌加注来拒绝对手高权益听牌的权益。", "- 应该做：在低连接且自身范围劣势的牌面上，仍然必须过牌加注，使用中等尺度（50%底池）和融合范围来反击。", "- 不要做：不要因为“有抽牌要收费”就盲目选择大尺度过牌加注——关键在于能否让对手的中等权益牌无差别，否则大尺度只是扩大底池而无效。", "- 不要做：不要因为自身范围弱于对手就放弃过牌加注——不反击只会让对手更有效地剥削你，导致权益实现率进一步下降。"], "note": ""}, {"id": "DGL#70-intro", "ep": "70", "type": "intro", "topic": "DGL#70 - 3-bet底池中处于不利位置时，如何游戏非对子听牌对抗双重下注", "en": "PFC 3BP OOP How To Play Unpaired Draws vs Double Barrel", "q": "DGL#70 - 3-bet底池中处于不利位置时，如何游戏非对子听牌对抗双重下注", "clues": ["bet", "unpaired draws"], "a": ["本视频聚焦于一个极具挑战性的实战场景：在3-bet底池中，玩家位于小盲位（SB），对手位于大盲位（BB）。翻前我方开局加注，对手3-bet，我方跟注；翻牌圈对手持续下注（c-bet），我方跟注；转牌圈我方过牌后，对手再次开火（双重下注）。此时我方手牌为非对子听牌（unpaired draws），视频旨在通过生成的手牌历史数据，分析不同下注尺度序列下各类听牌的最优频率策略。", "视频核心是展示四种下注尺度序列（翻牌25%或50%底池，转牌50%或70%底池）下，五类非对子听牌（卡顺、两头顺听牌、同花听牌、A高同花听牌、组合听牌）的过牌加注、跟注与弃牌频率分布。讲师强调，理解这些频率“桶”（buckets）能帮助玩家在实战中快速做出接近GTO的决策，同时也可根据对手特征进行剥削性调整。", "视频最后总结了一套快速决策流程：根据听牌强度（弱/中/强）和对手转牌下注尺度（50%为中压，70%为高压）选择行动，并特别指出在B25B50序列下应使用非全下的小额过牌加注（3倍），而在其他序列下则更多采用全下（check-jam）策略。"], "note": ""}, {"id": "DGL#70-s0", "ep": "70", "type": "topic", "topic": "DGL#70 - 3-bet底池中处于不利位置时，如何游戏非对子听牌对抗双重下注", "en": "PFC 3BP OOP How To Play Unpaired Draws vs Double Barrel", "q": "场景定义与手牌分类", "clues": ["bet", "SB vs", "open", "call"], "a": ["具体场景：3-bet底池，我方SB vs 对手BB。翻前我方open，对手3-bet，我方call；翻牌对手c-bet，我方call；转牌我方check，对手二次下注（double barrel）。", "分析对象仅为转牌圈的非对子听牌，分为五类：卡顺（gut shots）、两头顺听牌（open-ended straight draws）、同花听牌（flush draws）、A高同花听牌（ace high flush draws）、组合听牌（combo draws）。", "使用生成的手牌历史数据，通过Hand2Note工具统计各手牌类别的频率分布。"], "note": ""}, {"id": "DGL#70-s1", "ep": "70", "type": "topic", "topic": "DGL#70 - 3-bet底池中处于不利位置时，如何游戏非对子听牌对抗双重下注", "en": "PFC 3BP OOP How To Play Unpaired Draws vs Double Barrel", "q": "四种下注尺度序列", "clues": ["B25", "B70", "B50", "50%"], "a": ["翻牌圈对手（BB）可选择半池（50%）或25%底池的下注；转牌圈第二枪可选择70%或50%底池。", "由此形成四种组合序列：B25→B70、B25→B50、B50→B50、B50→B70。", "视频分别统计了每种序列下五类听牌的过牌加注、跟注、弃牌频率。"], "note": ""}, {"id": "DGL#70-s2", "ep": "70", "type": "topic", "topic": "DGL#70 - 3-bet底池中处于不利位置时，如何游戏非对子听牌对抗双重下注", "en": "PFC 3BP OOP How To Play Unpaired Draws vs Double Barrel", "q": "B25→B70序列频率分析", "clues": ["70%", "88%", "11%", "61%"], "a": ["转牌采用大尺度（70%）时，整体弃牌频率显著升高：卡顺几乎纯弃牌（88%弃牌，11%跟注，1%加注）。", "两头顺听牌：61%弃牌，20%跟注，16%加注。", "同花听牌：约50%弃牌、50%跟注，且过牌加注频率低于两头顺。", "A高同花听牌：几乎纯跟注，极少弃牌，含少量过牌全下。", "组合听牌：20%加注、80%跟注的“20-80”分配。", "总体：非对子听牌9%过牌加注、41%跟注、50%弃牌。"], "note": ""}, {"id": "DGL#70-s3", "ep": "70", "type": "topic", "topic": "DGL#70 - 3-bet底池中处于不利位置时，如何游戏非对子听牌对抗双重下注", "en": "PFC 3BP OOP How To Play Unpaired Draws vs Double Barrel", "q": "B25→B50序列频率分析", "clues": ["B25", "B70", "9%", "17%"], "a": ["与B25→B70相比，转牌尺度降低后，整体弃牌减少9%，跟注增加9%，加注频率基本不变。", "卡顺仍以弃牌为主，加注极少；两头顺加注频率仍低，弃牌频率相似。", "同花听牌是最大差异点：加注频率上升，弃牌大幅下降至仅17%。", "A高同花听牌与组合听牌策略与B25→B70时几乎相同。", "关键结论：对手尺度降低时，同花听牌应减少弃牌，卡顺也略微少弃，其余策略高度相似。"], "note": ""}, {"id": "DGL#70-s4", "ep": "70", "type": "topic", "topic": "DGL#70 - 3-bet底池中处于不利位置时，如何游戏非对子听牌对抗双重下注", "en": "PFC 3BP OOP How To Play Unpaired Draws vs Double Barrel", "q": "B25→B50序列的非全下加注尺寸", "clues": ["non-all-in", "check-raise", "GTO", "B25B50"], "a": ["面对B25→B50序列时，最优加注尺寸为3倍的非全下加注（non-all-in check-raise），而非全下。", "示例：翻牌面Q-7-3，手持A-3（适合25%下注的牌面），转牌出现配对顶牌，对手半池下注。此时底池约14BB，若全下85BB属于超池（约1.2倍），应改用3倍加注。", "若想接近GTO，面对B25B50序列应使用较小的过牌加注尺寸。"], "note": ""}, {"id": "DGL#70-s5", "ep": "70", "type": "topic", "topic": "DGL#70 - 3-bet底池中处于不利位置时，如何游戏非对子听牌对抗双重下注", "en": "PFC 3BP OOP How To Play Unpaired Draws vs Double Barrel", "q": "B50→B50与B50→B70序列频率分析", "clues": ["SPR", "B50", "B70", "T9x"], "a": ["转牌SPR（筹码底池比）降低，加注频率整体上升，因为需要在转牌快速变现强牌并保护权益。", "B50→B50：非对子听牌总体17%过牌加注、43%跟注、40%弃牌。", "B50→B70：加注频率略降，范围更极化，32%跟注、55%弃牌。", "卡顺在B50→B50下有28%的跟注频率（多数带一张或两张高牌，如KJ在T9x牌面），但B50→B70下弃牌升至90%。", "两头顺听牌在B50→B50下有37%的过牌全下频率，是除组合听牌外最高的，应积极惩罚对手双重下注。"], "note": ""}, {"id": "DGL#70-s6", "ep": "70", "type": "topic", "topic": "DGL#70 - 3-bet底池中处于不利位置时，如何游戏非对子听牌对抗双重下注", "en": "PFC 3BP OOP How To Play Unpaired Draws vs Double Barrel", "q": "各听牌类别的“桶”分配建议", "clues": ["B50B50", "B50B70", "B25", "40%"], "a": ["组合听牌：面对B50B50或B50B70序列，采用40%全下、60%跟注的“40-60”分配。", "A高同花听牌：建议放入纯跟注桶，无需10%的全下；若想更激进（认为对手双重下注频率失控），可提升至20%全下、80%跟注。", "同花听牌：除B25→B70外，均放在20%加注桶，即20%过牌加注、80%跟注。", "卡顺：大部分弃牌，若带高牌可适当跟注。", "两头顺听牌：B50→B70下采用20%加注、20%跟注、60%弃牌；B50→B50下采用40%加注、40%跟注、20%弃牌。"], "note": ""}, {"id": "DGL#70-s7", "ep": "70", "type": "topic", "topic": "DGL#70 - 3-bet底池中处于不利位置时，如何游戏非对子听牌对抗双重下注", "en": "PFC 3BP OOP How To Play Unpaired Draws vs Double Barrel", "q": "核心原则与规律总结", "clues": ["B70", "SPR", "B25B50"], "a": ["越强的听牌过牌加注频率越高，组合听牌最高；A高同花听牌是例外，因有摊牌价值而偏向被动跟注。", "转牌尺度越大（如B70），过牌加注减少、过牌弃牌增加，因为对手范围更极化。", "SPR较小时（如B25B50序列），存在非全下加注空间，使用3倍加注尺寸。", "实战中可根据对手特征将这些频率桶上下调整，实现剥削性策略。"], "note": ""}, {"id": "DGL#70-s8", "ep": "70", "type": "topic", "topic": "DGL#70 - 3-bet底池中处于不利位置时，如何游戏非对子听牌对抗双重下注", "en": "PFC 3BP OOP How To Play Unpaired Draws vs Double Barrel", "q": "快速决策流程", "clues": ["B70", "B50B50", "B25B50", "40%"], "a": ["听牌强度分类：卡顺=弱听牌；两头顺、同花听牌=中等听牌；组合听牌、A高同花听牌=强听牌。", "对手转牌尺度：B50=中等压力；B70=高压力（更极化范围）。", "卡顺：过牌弃牌为主，极少加注；带高牌时可多跟注。", "两头顺：混合过牌加注、跟注、弃牌，面对B70时以弃牌为主，但记住B50B50下的40%加注桶。", "同花听牌：以过牌跟注和过牌加注为主，弃牌不多，但面对B70时弃牌增加。", "A高同花听牌：几乎总是跟注，少量加注，面对B70时略多弃牌。", "组合听牌：积极过牌加注，尤其面对B50B50时采用40-60分配。", "加注尺寸：除B25B50序列用3倍非全下加注外，其余序列使用全下尺寸。"], "note": ""}, {"id": "DGL#70-c1", "ep": "70", "type": "cloze", "topic": "DGL#70 - 3-bet底池中处于不利位置时，如何游戏非对子听牌对抗双重下注", "en": "PFC 3BP OOP How To Play Unpaired Draws vs Double Barrel", "q": "翻牌圈对手（BB）可选择半池（＿＿）或25%底池的下注；", "clues": [], "a": ["翻牌圈对手（BB）可选择半池（50%）或25%底池的下注；转牌圈第二枪可选择70%或50%底池。"], "note": "50%"}, {"id": "DGL#70-c2", "ep": "70", "type": "cloze", "topic": "DGL#70 - 3-bet底池中处于不利位置时，如何游戏非对子听牌对抗双重下注", "en": "PFC 3BP OOP How To Play Unpaired Draws vs Double Barrel", "q": "转牌采用大尺度（＿＿）时，整体弃牌频率显著升高：卡顺几乎纯弃牌（88%弃牌，", "clues": [], "a": ["转牌采用大尺度（70%）时，整体弃牌频率显著升高：卡顺几乎纯弃牌（88%弃牌，11%跟注，1%加注）。"], "note": "70%"}, {"id": "DGL#70-c3", "ep": "70", "type": "cloze", "topic": "DGL#70 - 3-bet底池中处于不利位置时，如何游戏非对子听牌对抗双重下注", "en": "PFC 3BP OOP How To Play Unpaired Draws vs Double Barrel", "q": "转牌尺度降低后，整体弃牌减少＿＿，跟注增加9%，", "clues": [], "a": ["与B25→B70相比，转牌尺度降低后，整体弃牌减少9%，跟注增加9%，加注频率基本不变。"], "note": "9%"}, {"id": "DGL#70-note", "ep": "70", "type": "note", "topic": "DGL#70 - 3-bet底池中处于不利位置时，如何游戏非对子听牌对抗双重下注", "en": "PFC 3BP OOP How To Play Unpaired Draws vs Double Barrel", "q": "避坑提醒与行动项", "clues": ["DGL", "bet", "SB vs BB"], "a": ["本视频是DGL系列第70期，聚焦于3-bet底池中SB vs BB的转牌圈非对子听牌策略，属于进阶的GTO频率分析内容。视频基于大量模拟数据，给出了具体可执行的频率桶，适合已有一定理论基础、希望精细化转牌圈策略的玩家。建议结合前序关于翻牌圈c-bet防守和转牌圈范围构建的视频学习，以形成完整的3-bet底池攻防体系。", "值得进一步学习的方向包括：河牌圈不同听牌未击中时的诈唬与摊牌策略、有位置玩家（IP）面对过牌加注的应对频率、以及如何根据对手实际倾向调整这些频率桶。", "**行动项与常见错误提醒：**", "- 不要对卡顺进行频繁过牌加注，除非带高牌且面对较小转牌尺度。", "- 不要忽视B25B50序列下的3倍非全下加注选项，盲目全下会损失EV。", "- 不要对A高同花听牌过度激进，纯跟注通常是最优解。", "- 面对B70大尺度转牌下注时，应显著增加弃牌频率，尤其是卡顺和同花听牌。", "- 组合听牌应积极过牌全下，尤其面对B50B50序列时，40%全下是标准频率。"], "note": ""}, {"id": "DGL#71-intro", "ep": "71", "type": "intro", "topic": "DGL#71 - 翻前3-bet底池中，不利位置（CO vs BTN）面对双枪下注时如何游戏未成对听牌", "en": "PFC 3BP OOP How To Play Unpaired Draws vs Double Barrel - CO vs BTN", "q": "DGL#71 - 翻前3-bet底池中，不利位置（CO vs BTN）面对双枪下注时如何游戏未成对听牌", "clues": ["double barrel", "SB vs BB", "BTN"], "a": ["本视频是“如何在翻牌圈跟注后，于转牌圈面对对手双枪下注（double barrel）时防守未成对听牌”系列的第二部分。上一集探讨了小盲对盲注位（SB vs BB）的防守策略，本集则聚焦于关位（CO）对抗按钮位（BTN）的三人底池场景，并对比两者之间的关键差异。视频基于PioSOLVER生成的GTO解算数据，系统分析了在不同下注尺度序列下，各类未成对听牌（卡顺、两头顺、同花听牌、A高同花听牌、组合听牌）的最优应对频率与行动选择。", "核心结论是：面对不同的转牌下注尺度，防守策略会发生显著变化。例如，面对较小的转牌下注（如B50），同花听牌的过牌加注频率会大幅上升；而面对较大的下注（如B100），整体防守频率则显著下降，仅保留A高同花听牌和组合听牌继续游戏。此外，视频还对比了CO vs BTN与SB vs BB两种阵型在SPR（筹码底池比）、翻前范围结构以及防守风格上的差异，指出CO vs BTN场景下防守更极化——弃牌更多，但过牌加注也更多。"], "note": ""}, {"id": "DGL#71-s0", "ep": "71", "type": "topic", "topic": "DGL#71 - 翻前3-bet底池中，不利位置（CO vs BTN）面对双枪下注时如何游戏未成对听牌", "en": "PFC 3BP OOP How To Play Unpaired Draws vs Double Barrel - CO vs BTN", "q": "翻前与翻牌圈场景设定", "clues": ["bet pot", "Hero", "BTN", "B25-B70"], "a": ["本视频场景为三人底池（3-bet pot）：Hero在CO位（关位）开局加注至2.3BB，BTN位（按钮位）3-bet（再加注），Hero跟注。翻牌圈BTN持续下注（c-bet），Hero跟注，转牌圈Hero过牌，BTN再次下注（双枪）。", "翻牌圈最常见的c-bet尺度为B25（25%底池）和B50（50%底池）。若翻牌圈下注B25，转牌圈BTN最常继续下注B70（70%底池），同时也会使用B50和B100。若翻牌圈下注B50，转牌圈BTN最常继续下注B50，也会使用B70。", "本视频分析的五种下注尺度序列为：B25-B70、B25-B50、B25-B100、B50-B50、B50-B70。所有数据均基于PioSOLVER生成的GTO策略。"], "note": ""}, {"id": "DGL#71-s1", "ep": "71", "type": "topic", "topic": "DGL#71 - 翻前3-bet底池中，不利位置（CO vs BTN）面对双枪下注时如何游戏未成对听牌", "en": "PFC 3BP OOP How To Play Unpaired Draws vs Double Barrel - CO vs BTN", "q": "面对B25-B70序列的防守策略", "clues": ["B25-B70", "jam", "gut shots", "SB vs BB"], "a": ["面对B25-B70序列，未成对听牌的整体防守频率为：11%过牌加注、17%跟注、72%弃牌。加注时首选全下（jam），但小尺度加注（约2.6x-3x）也占加注频率的40%，用于极化范围并施压对手中等强度牌。", "卡顺听牌（gut shots）几乎从不加注（0%），以极高频率弃牌为主，与SB vs BB阵型中的表现一致。", "两头顺听牌（open-ended straight draws）无对子时：72%弃牌、10%过牌跟注、18%过牌加注，属于高度混合的策略。", "同花听牌（flush draws）无对子时：81%弃牌、8%跟注、11%过牌加注，整体偏被动防守。", "A高同花听牌（Ace-high flush draws）以跟注为主，辅以少量加注，因其有坚果听牌权益，防守价值最高。", "组合听牌（combo draws）几乎呈现50-50的跟注与加注比例，但仍有少量弃牌，是防守最积极的手牌类别。"], "note": ""}, {"id": "DGL#71-s2", "ep": "71", "type": "topic", "topic": "DGL#71 - 翻前3-bet底池中，不利位置（CO vs BTN）面对双枪下注时如何游戏未成对听牌", "en": "PFC 3BP OOP How To Play Unpaired Draws vs Double Barrel - CO vs BTN", "q": "面对B25-B50序列的防守策略", "clues": ["B25-B50", "B70", "SB vs BB", "14%"], "a": ["面对B25-B50序列，整体防守频率变为：14%过牌加注、25%跟注、61%弃牌。相比B70，弃牌率下降11个百分点，加注率上升3个百分点，范围极化程度降低，可以更积极地快打价值牌并搭配更多诈唬。", "卡顺听牌依然几乎不加注，以弃牌为主。两头顺听牌仍为高度混合策略，包含加注、跟注和相
