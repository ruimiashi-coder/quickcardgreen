区域的大小（组合数多少）——组合数少则弃牌率上升，组合数正常则维持基准。", "变量二：下注尺度的选择——放大下注（如77%底池或超额）时弃牌率降至40%，缩小下注（如23%底池）时弃牌率升至60%。", "变量三：河牌与对手范围的关联度——关联度高（如9♥）则弃牌率降低，关联度低（如5♠）则弃牌率升高。", "通过这三个变量的组合，玩家可以精确调节弃牌频率，在X-B-B线路中接近平衡状态。"], "note": ""}, {"id": "DGL#86-s7", "ep": "86", "type": "topic", "topic": "DGL#86 - 翻前单次加注底池、不利位置过牌-下注-下注线路中的河牌弃牌策略构建", "en": "PFC SRP OOP River Give Ups in X-B-B Line", "q": "常见误区与心理调整", "clues": ["50%", "80%"], "a": ["最常见的错误：玩家在河牌圈不愿放弃\"看起来还有希望\"的未成对牌，导致诈唬过度。", "讲师强调，即使面对能激进抓诈的对手，也必须接受放弃部分诈唬牌的事实——这是平衡的必要代价。", "即使是在最有利的河牌面（如9♥），弃牌率依然高达40-50%，玩家不应期望完全避免弃牌。", "在河牌为10的极端情况下，80%的诈唬牌必须放弃，这需要极强的纪律性。"], "note": ""}, {"id": "DGL#86-c1", "ep": "86", "type": "cloze", "topic": "DGL#86 - 翻前单次加注底池、不利位置过牌-下注-下注线路中的河牌弃牌策略构建", "en": "PFC SRP OOP River Give Ups in X-B-B Line", "q": "河牌圈需要放弃＿＿的未成对牌——这是该线路的基准弃牌率。", "clues": [], "a": ["在转牌下注2/3底池后，河牌圈需要放弃66%的未成对牌——这是该线路的基准弃牌率。"], "note": "66%"}, {"id": "DGL#86-c2", "ep": "86", "type": "cloze", "topic": "DGL#86 - 翻前单次加注底池、不利位置过牌-下注-下注线路中的河牌弃牌策略构建", "en": "PFC SRP OOP River Give Ups in X-B-B Line", "q": "软件数据显示：未成对牌在河牌圈下注＿＿、过牌47%，", "clues": [], "a": ["在X-B-B线路中，软件数据显示：未成对牌在河牌圈下注53%、过牌47%，接近50-50的基准。"], "note": "53%"}, {"id": "DGL#86-c3", "ep": "86", "type": "cloze", "topic": "DGL#86 - 翻前单次加注底池、不利位置过牌-下注-下注线路中的河牌弃牌策略构建", "en": "PFC SRP OOP River Give Ups in X-B-B Line", "q": "在5♠河牌面，弃牌率高达＿＿；在9♥河牌面，", "clues": [], "a": ["在5♠河牌面，弃牌率高达66%；在9♥河牌面，弃牌率降至约50%，更接近基准。"], "note": "66%"}, {"id": "DGL#86-note", "ep": "86", "type": "note", "topic": "DGL#86 - 翻前单次加注底池、不利位置过牌-下注-下注线路中的河牌弃牌策略构建", "en": "PFC SRP OOP River Give Ups in X-B-B Line", "q": "避坑提醒与行动项", "clues": ["DGL", "Deep Game Logic", "Red Line"], "a": ["本视频属于DGL系列（Deep Game Logic）第86期，承接了之前\"红线\"（Red Line）视频中关于抓诈策略的讨论。该视频从有利位置玩家（IP）的视角出发，探讨如何对抗一个能够激进抓诈的对手，与之前从不利位置（OOP）视角讨论的抓诈策略形成互补。讲师提到的\"红线\"和\"绿线\"概念分别对应剥削性策略和GTO平衡策略，本视频重点在于如何在两者之间找到平衡点。", "值得进一步学习的方向包括：深入研究不同翻牌面结构（如连牌面、彩虹面、同花面）对X-B-B线路弃牌率的具体影响；学习如何利用阻挡牌（blocker）来优化河牌圈的诈唬选择；以及如何在实战中快速评估价值区域大小和下注尺度的匹配关系。建议结合GTO软件进行模拟训练，逐步培养对弃牌频率的直觉判断。", "**行动项与常见错误提醒：**", "- 应该做：在X-B-B线路中，默认以50-50为弃牌基准，再根据河牌结构调整。", "- 应该做：当河牌放大下注尺度时（如77%底池或超额），将弃牌率下调至40%左右。", "- 应该做：当河牌缩小下注尺度时（如23%底池），将弃牌率上调至60%左右。", "- 应该做：当河牌价值区域极小（如河牌T）时，接受80%的弃牌率，不要强行诈唬。", "- 不要做：在河牌圈不愿放弃未成对牌，导致诈唬频率过高，被擅长抓诈的对手剥削。", "- 不要做：忽视河牌与对手范围的关联度，机械地套用固定弃牌率。", "- 不要做：在价值区域很小的情况下仍然使用大尺度下注并期望保持平衡。"], "note": ""}, {"id": "DGL#87-intro", "ep": "87", "type": "intro", "topic": "DGL#87 手牌复盘：4-bet底池中SB vs BB的翻牌圈持续下注策略", "en": "Hand Review Flop Cbet Strategy 4BP SB vs BB", "q": "DGL#87 手牌复盘：4-bet底池中SB vs BB的翻牌圈持续下注策略", "clues": ["GTO", "Balicious", "AKo"], "a": ["本视频由GTO蓝图课程讲师主讲，围绕一位学员（Balicious）提交的1-2级别手牌展开：他在小盲位持AKo，开局加注3x，遭遇3-bet后4-bet到23BB，大盲跟注，翻牌发出J♠T♦2♣（双色面）。学员在翻牌圈选择过牌-跟注，随后在转牌出现同花完成牌时弃牌，事后他质疑自己是否应该在翻牌圈直接全下。视频以此为契机，系统对比了不同位置形态下4-bet底池的翻牌圈持续下注策略差异。", "讲师首先澄清了GTO蓝图课程中“翻牌圈统一25%底池下注”建议的适用范围——仅适用于UTG、HJ、CO等不利位置对抗有利位置玩家的形态，因为这些位置的开局范围线性且权益较高。而小盲位由于会弃掉部分弱非同花高张牌，其范围特征不同，导致翻牌策略需要相应调整。通过GTO解算器数据对比，讲师展示了SB vs BB在J-T-X翻牌面上存在显著的全下或过牌策略倾向，这与紧位形态下的策略形成鲜明对比。", "视频核心结论是：在SB vs BB的4-bet底池中，面对J-T-X翻牌面，全下或过牌是GTO最优策略，全下频率高达72%-73%。这一策略的底层逻辑在于IP（大盲）范围中高张牌占比极高，但J和T的组合相对稀缺，使得OOP（小盲）在权益上占据优势。讲师还提供了具体的执行框架：全下所有高张牌、过牌顶set和垃圾牌，使策略既接近解算器又易于实战操作。"], "note": ""}, {"id": "DGL#87-s0", "ep": "87", "type": "topic", "topic": "DGL#87 手牌复盘：4-bet底池中SB vs BB的翻牌圈持续下注策略", "en": "Hand Review Flop Cbet Strategy 4BP SB vs BB", "q": "手牌背景与学员疑问", "clues": ["Balicious", "AKo", "bet", "GTO"], "a": ["学员Balicious在1-2级别现金局中，小盲位持A♠K♦（AKo），开局加注3x，遭遇3-bet后4-bet到23BB，大盲位跟注。", "翻牌发出J♠T♦2♣（双色面，J-T-x结构），学员选择过牌-跟注，转牌出现同花完成牌后弃牌。", "学员自述：“我对J-T-x翻牌面有时会被全下有模糊概念，但当时认为那是CO位的情况，可能不适用于这里，于是退缩了，选择了感觉更差的打法。”", "学员还提到GTO蓝图课程模块建议“翻牌圈统一使用25%底池下注”，但他不确定该建议是否适用于SB vs BB形态。"], "note": ""}, {"id": "DGL#87-s1", "ep": "87", "type": "topic", "topic": "DGL#87 手牌复盘：4-bet底池中SB vs BB的翻牌圈持续下注策略", "en": "Hand Review Flop Cbet Strategy 4BP SB vs BB", "q": "25%底池下注建议的适用范围", "clues": ["GTO", "UTG", "A5o", "T8s"], "a": ["讲师明确澄清：GTO蓝图课程中“翻牌圈统一25%底池下注”的建议，仅适用于UTG、HJ、CO等不利位置对抗有利位置玩家的形态。", "原因在于这些位置的开局范围非常线性且权益较高，而小盲位会弃掉部分弱非同花高张牌（如A5o、T8s等），导致范围结构不同。", "数据显示：UTG/HJ/CO对抗BTN时，25%底池下注的使用频率接近80%，而半池下注仅占8.8%-9.9%。", "讲师补充：“有很多牌面你只需要攻击10%-15%的时间，我认为没有理由去平衡那些范围。例如大量Q-high牌面上，你约85%的范围都应该下注。”"], "note": ""}, {"id": "DGL#87-s2", "ep": "87", "type": "topic", "topic": "DGL#87 手牌复盘：4-bet底池中SB vs BB的翻牌圈持续下注策略", "en": "Hand Review Flop Cbet Strategy 4BP SB vs BB", "q": "SB vs BB的翻牌持续下注频率与尺度", "clues": ["GTO", "SB vs BB", "bet", "64%"], "a": ["在GTO解算器数据中，SB vs BB的4-bet底池翻牌持续下注频率仅为64%，远低于紧位形态的80%。", "下注尺度分布：半池下注约占下注总量的三分之一，25%底池下注占20%的时间，且存在全下选项。", "讲师指出：“SB vs BB形态下，使用半池下注确实有其合理性。”", "这些数据来自讲师提供的GTO手牌历史库（超过2000万手），学员可自行导入分析验证。"], "note": ""}, {"id": "DGL#87-s3", "ep": "87", "type": "topic", "topic": "DGL#87 手牌复盘：4-bet底池中SB vs BB的翻牌圈持续下注策略", "en": "Hand Review Flop Cbet Strategy 4BP SB vs BB", "q": "J-T-X翻牌面的全下或过牌策略", "clues": ["SB vs BB", "Broadway", "OOP", "10%"], "a": ["讲师展示了两个SB vs BB的J-T-X翻牌面模拟结果：J♠T♦6♣（双色）和J♠T♦4♣（彩虹面）。", "模拟使用讲师自研算法，分别测试10%、25%、50%和全下或过牌四种单一策略，全下或过牌策略的EV最高。", "J-T-6双色面：全下或过牌频率为73%；J-T-4彩虹面：同样采用全下或过牌策略。", "核心逻辑：IP（大盲）范围中高张牌（Broadway）占比极高，但J和T的组合相对稀缺，OOP（小盲）在权益上占据优势。", "讲师结论：“如果你想完全按照解算器打，SB vs BB在J-T-X翻牌面上就应该使用全下或过牌作为持续下注策略。”"], "note": ""}, {"id": "DGL#87-s4", "ep": "87", "type": "topic", "topic": "DGL#87 手牌复盘：4-bet底池中SB vs BB的翻牌圈持续下注策略", "en": "Hand Review Flop Cbet Strategy 4BP SB vs BB", "q": "紧位形态与SB vs BB的策略差异", "clues": ["HJ vs BTN", "GTO", "25%"], "a": ["在HJ vs BTN等紧位形态中，J-T-X双色面不再使用全下或过牌策略，而是回归25%底池下注或过牌。", "原因推测：紧位形态下IP玩家范围中J和T的占比显著更高，全下会被大量J-T组合跟注，且IP范围中还有大量A高牌。", "讲师建议：“如果你打的是紧位形态，不要采用全下或过牌策略，而应使用GTO蓝图课程推荐的25%底池下注或过牌。”"], "note": ""}, {"id": "DGL#87-s5", "ep": "87", "type": "topic", "topic": "DGL#87 手牌复盘：4-bet底池中SB vs BB的翻牌圈持续下注策略", "en": "Hand Review Flop Cbet Strategy 4BP SB vs BB", "q": "全下或过牌策略的实战执行框架", "clues": ["SB vs BB", "set", "A5o", "A6o"], "a": ["讲师认为在SB vs BB形态下采用全下或过牌策略“非常容易执行”，并给出具体操作指南：", "全下所有高张牌（如AK、AQ等），因为这些牌有不错的权益且能对对手范围施压。", "过牌所有set（如JJ、TT、22），因为set完全不受威胁且阻挡了对手的跟注范围，适合慢打。", "过牌完全无权益的垃圾牌（如A5o、A6o、K7o、97o等），这些牌无法承受全下的风险。", "其余有不错权益的牌型全部全下。", "讲师强调：“如果你希望更接近解算器，下次在SB vs BB的J-T-X翻牌面直接全下即可。”"], "note": ""}, {"id": "DGL#87-c0", "ep": "87", "type": "cloze", "topic": "DGL#87 手牌复盘：4-bet底池中SB vs BB的翻牌圈持续下注策略", "en": "Hand Review Flop Cbet Strategy 4BP SB vs BB", "q": "开局加注3x，遭遇3-bet后4-bet到＿＿，大盲位跟注。", "clues": [], "a": ["学员Balicious在1-2级别现金局中，小盲位持A♠K♦（AKo），开局加注3x，遭遇3-bet后4-bet到23BB，大盲位跟注。"], "note": "23BB"}, {"id": "DGL#87-c1", "ep": "87", "type": "cloze", "topic": "DGL#87 手牌复盘：4-bet底池中SB vs BB的翻牌圈持续下注策略", "en": "Hand Review Flop Cbet Strategy 4BP SB vs BB", "q": "讲师明确澄清：GTO蓝图课程中“翻牌圈统一＿＿底池下注”的建议，", "clues": [], "a": ["讲师明确澄清：GTO蓝图课程中“翻牌圈统一25%底池下注”的建议，仅适用于UTG、HJ、CO等不利位置对抗有利位置玩家的形态。"], "note": "25%"}, {"id": "DGL#87-c2", "ep": "87", "type": "cloze", "topic": "DGL#87 手牌复盘：4-bet底池中SB vs BB的翻牌圈持续下注策略", "en": "Hand Review Flop Cbet Strategy 4BP SB vs BB", "q": "SB vs BB的4-bet底池翻牌持续下注频率仅为＿＿，", "clues": [], "a": ["在GTO解算器数据中，SB vs BB的4-bet底池翻牌持续下注频率仅为64%，远低于紧位形态的80%。"], "note": "64%"}, {"id": "DGL#87-note", "ep": "87", "type": "note", "topic": "DGL#87 手牌复盘：4-bet底池中SB vs BB的翻牌圈持续下注策略", "en": "Hand Review Flop Cbet Strategy 4BP SB vs BB", "q": "避坑提醒与行动项", "clues": ["DGL", "GTO", "bet"], "a": ["本视频是DGL系列第87期，承接了GTO蓝图课程中关于翻牌圈持续下注策略的讨论，并针对4-bet底池中SB vs BB这一特殊形态进行了深入剖析。讲师通过具体手牌复盘，将抽象的理论概念（如范围优势、权益分布）转化为可操作的实战决策，并提供了从解算器数据到简化执行框架的完整链路。值得进一步学习的方向包括：4-bet底池中转牌和河牌圈的策略调整、不同翻牌面结构（如A-high、K-high）下的全下或过牌适用性，以及如何根据对手偏离调整全下频率。", "**行动项与常见错误：**", "- 应该做：在SB vs BB的4-bet底池中，面对J-T-X翻牌面，优先考虑全下或过牌策略，全下所有高张牌，过牌set和垃圾牌。", "- 应该做：区分不同位置形态的策略差异，紧位形态（UTG/HJ/CO vs BTN）使用25%底池下注，SB vs BB可考虑全下或过牌。", "- 不要做：将GTO蓝图课程中“统一25%底池下注”的建议机械套用到所有形态，尤其不要忽略SB vs BB的特殊性。", "- 不要做：在紧位形态（如HJ vs BTN）的J-T-X翻牌面上盲目全下，因为IP范围中J和T占比更高，全下容易被跟注。"], "note": ""}, {"id": "DGL#88-intro", "ep": "88", "type": "intro", "topic": "DGL#88 - 手牌复盘：4Bet底池不利位置双枪与过牌-下注-过牌线路", "en": "Hand Review 4Bet OOP Double Barrel and B-X-B Line", "q": "DGL#88 - 手牌复盘：4Bet底池不利位置双枪与过牌-下注-过牌线路", "clues": ["DGL", "aggressor", "David"], "a": ["本视频是DGL系列第88期，聚焦于4Bet底池中作为不利位置进攻方（aggressor）的理论策略框架。讲师以会员David的一手实战牌局为切入点，系统讲解了4Bet底池翻牌圈持续下注后，转牌圈的双枪（double barrel）策略构建，以及河牌圈在“过牌-下注-过牌”（bet-check-bet）线路下的诈唬频率控制。视频强调以理论基准（theory heuristic）为出发点，再根据对手倾向进行剥削性调整。", "讲师首先给出了4Bet底池不利位置转牌圈的三种下注尺度选择：全下（all-in）、25%底池小注和约40%底池的几何尺度（geometric size），并明确了各自适用的牌面类型。随后，视频重点分析了河牌圈bet-check-bet线路中未成对牌的放弃频率（give up frequency），通过GTO手牌历史数据统计，揭示了不同牌面结构下诈唬频率的显著差异，为玩家提供了可量化的调整依据。"], "note": ""}, {"id": "DGL#88-s0", "ep": "88", "type": "topic", "topic": "DGL#88 - 手牌复盘：4Bet底池不利位置双枪与过牌-下注-过牌线路", "en": "Hand Review 4Bet OOP Double Barrel and B-X-B Line", "q": "牌局背景与问题提出", "clues": ["AJs", "BTN", "David 4-bet", "22BB"], "a": ["会员David在劫位（HJ）手持AJs（红桃A与红桃J同花），开局加注2BB，按钮位（BTN）玩家3-bet，David 4-bet至22BB，对手跟注。", "翻牌圈：K♠Q♦9♣彩虹面，David下注1/4底池，对手跟注。", "转牌圈：2♦（完全空白牌），David选择过牌。", "河牌圈：另一张空白牌，David再次过牌，最终摊牌。", "David自述对4Bet底池研究甚少，原本考虑翻前直接弃牌；他预期对手跟注范围较紧，因此计划翻牌下注后放弃。他承认这手牌打得不好，认为至少应该在转牌圈双枪，并寻求反馈。", "讲师指出David给出了大量剥削性解释（如“对手太紧我应该放弃”），但本视频将聚焦理论基准，实战中可根据对手画像偏离。"], "note": ""}, {"id": "DGL#88-s1", "ep": "88", "type": "topic", "topic": "DGL#88 - 手牌复盘：4Bet底池不利位置双枪与过牌-下注-过牌线路", "en": "Hand Review 4Bet OOP Double Barrel and B-X-B Line", "q": "4Bet底池转牌圈策略框架", "clues": ["Bet", "SPR", "depolarized", "25%"], "a": ["4Bet底池不利位置转牌圈共有三种下注尺度：全下、25%底池、约40%底池的几何尺度。", "全下尺度适用于双花顺（double flush draw）牌面或牌面连接性极强的结构，例如：J♠9♠3♣、J♠T♦3♣、8♥6♦5♣、7♦5♣4♦等。", "此类牌面上，由于SPR（筹码底池比）在转牌圈已略超1，且你拥有大量超对和听牌组合，直接全下是合理的战略选择，因为牌面存在大量可用的听牌。", "25%底池尺度仅适用于转牌圈发出A的情况。前提是翻牌圈你用整个范围下注25%底池（这是标准策略，小盲对大盲略有不同）。", "转牌A时，继续缩小下注尺度，使用去极化（depolarized）的双枪策略，下注频率为你范围的63%。", "其他所有转牌牌面，使用几何尺度，约为40%底池的下注，这是你的范围构成方式。"], "note": ""}, {"id": "DGL#88-s2", "ep": "88", "type": "topic", "topic": "DGL#88 - 手牌复盘：4Bet底池不利位置双枪与过牌-下注-过牌线路", "en": "Hand Review 4Bet OOP Double Barrel and B-X-B Line", "q": "本手牌转牌圈的正确行动", "clues": ["David", "gut shot", "AJo", "AJs"], "a": ["David这手牌的翻牌面K♠Q♦9♣不属于双花顺牌面，也没有大量听牌，转牌2♦也不是A，因此落入“其他一切”类别，应使用几何尺度。", "理论上下注约40%底池，按底池约70BB计算，约为28BB。考虑到双方有效筹码140BB，可以略微加大至接近半池，约35BB。", "顺子听牌（gut shot）应被归入80%的下注频率档位，AJo（此处为AJs）是极佳的双枪候选牌，应积极下注。", "David实际选择过牌，偏离理论过远，至少应下注1/4底池以上。"], "note": ""}, {"id": "DGL#88-s3", "ep": "88", "type": "topic", "topic": "DGL#88 - 手牌复盘：4Bet底池不利位置双枪与过牌-下注-过牌线路", "en": "Hand Review 4Bet OOP Double Barrel and B-X-B Line", "q": "河牌圈bet-check-bet线路的诈唬频率", "clues": ["bet-check-bet", "GTO", "overbluff", "69%"], "a": ["本视频重点分析4Bet底池不利位置中，转牌过牌后河牌圈的下注策略（bet-check-bet线路）。", "讲师使用GTO手牌历史系统，统计了该线路下未成对牌的平均放弃频率。", "平均而言，在所有牌面结构下，到达河牌圈后应放弃69%的未成对牌——这是一个非常高的放弃比例，说明该位置极易过度诈唬（overbluff）。", "大多数玩家容易犯的错误是：过度快打强牌。两对及以上牌力只应下注40%的时间，顶对则应有60%的时间选择过牌。", "如果对手倾向于快打其范围顶端的强牌，那么你需要更严格地控制频率，可能需放弃80%的未成对牌。"], "note": ""}, {"id": "DGL#88-s4", "ep": "88", "type": "topic", "topic": "DGL#88 - 手牌复盘：4Bet底池不利位置双枪与过牌-下注-过牌线路", "en": "Hand Review 4Bet OOP Double Barrel and B-X-B Line", "q": "不同牌面结构下的放弃频率差异", "clues": ["River Third to", "Flush", "Bet", "AQs"], "a": ["河牌圈发出顺子完成牌（River Fortress Straight）或同花完成牌（River Third to Flush）时，应更加被动，放弃频率高达80%。", "原因在于：你的范围在这些牌面上并不强——转牌圈你已用同花听牌下注，而顺子完成牌面上你缺乏价值下注牌型，只能用一对甚至两对作为价值牌，诈唬范围必须被严格限制。", "河牌圈发出A时，所有牌面结构下平均仅需放弃38%的未成对牌，几乎是平均值的一半。", "原因：河牌A击中了你过牌范围中大量存在的“A高无听牌”牌型。转牌圈A高无听牌只应下注40%的时间，因此60%的此类牌会过牌。", "翻前4Bet范围中A高牌组合极多，尤其是AQs非同花（Ace Queen off）出现频率很高，此外还有A5s、ATs、AJs，部分玩家会有A4s等。", "当大量A高牌在转牌过牌后，河牌发出A时你拥有大量价值下注牌型，因此可以更少地放弃诈唬牌。"], "note": ""}, {"id": "DGL#88-s5", "ep": "88", "type": "topic", "topic": "DGL#88 - 手牌复盘：4Bet底池不利位置双枪与过牌-下注-过牌线路", "en": "Hand Review 4Bet OOP Double Barrel and B-X-B Line", "q": "翻牌高牌对放弃频率的影响", "clues": ["blank plus blank", "70%", "58%", "51%"], "a": ["讲师进一步测试了翻牌圈不同高牌（A高、K高、Q高）对放弃频率的影响。", "Q高翻牌面：放弃频率约为平均值，即70%。", "K高翻牌面：放弃频率降至58%。", "A高翻牌面：放弃频率进一步降至51%。", "结论：在A高和K高翻牌面上，你可以比平均值更激进地诈唬；Q高翻牌面接近平均；低牌面则需要放弃更多。", "若翻牌为K高且转牌河牌均为空白（blank plus blank），放弃频率可低至51%。"], "note": ""}, {"id": "DGL#88-s6", "ep": "88", "type": "topic", "topic": "DGL#88 - 手牌复盘：4Bet底池不利位置双枪与过牌-下注-过牌线路", "en": "Hand Review 4Bet OOP Double Barrel and B-X-B Line", "q": "本手牌河牌圈的启示", "clues": ["David"], "a": ["David这手牌是K高翻牌面，且转牌河牌均为空白，属于放弃频率低于平均值的牌面类型。", "即便如此，理论上仍应放弃约一半的诈唬牌，因此David选择过牌并非巨大错误。", "实战中应思考的关键问题是：如何根据对手倾向调整诈唬频率（过度诈唬或减少诈唬），这将在下一期视频中详细解答。"], "note": ""}, {"id": "DGL#88-c0", "ep": "88", "type": "cloze", "topic": "DGL#88 - 手牌复盘：4Bet底池不利位置双枪与过牌-下注-过牌线路", "en": "Hand Review 4Bet OOP Double Barrel and B-X-B Line", "q": "会员David在劫位（HJ）手持AJs（红桃A与红桃J同花），开局加注＿＿，按钮位（BTN）玩家3-bet，", "clues": [], "a": ["会员David在劫位（HJ）手持AJs（红桃A与红桃J同花），开局加注2BB，按钮位（BTN）玩家3-bet，David 4-bet至22BB，对手跟注。"], "note": "2BB"}, {"id": "DGL#88-c1", "ep": "88", "type": "cloze", "topic": "DGL#88 - 手牌复盘：4Bet底池不利位置双枪与过牌-下注-过牌线路", "en": "Hand Review 4Bet OOP Double Barrel and B-X-B Line", "q": "4Bet底池不利位置转牌圈共有三种下注尺度：全下、＿＿底池、约40%底池的几何尺度。", "clues": [], "a": ["4Bet底池不利位置转牌圈共有三种下注尺度：全下、25%底池、约40%底池的几何尺度。"], "note": "25%"}, {"id": "DGL#88-c2", "ep": "88", "type": "cloze", "topic": "DGL#88 - 手牌复盘：4Bet底池不利位置双枪与过牌-下注-过牌线路", "en": "Hand Review 4Bet OOP Double Barrel and B-X-B Line", "q": "理论上下注约＿＿底池，按底池约70BB计算，", "clues": [], "a": ["理论上下注约40%底池，按底池约70BB计算，约为28BB。考虑到双方有效筹码140BB，可以略微加大至接近半池，约35BB。"], "note": "40%"}, {"id": "DGL#88-note", "ep": "88", "type": "note", "topic": "DGL#88 - 手牌复盘：4Bet底池不利位置双枪与过牌-下注-过牌线路", "en": "Hand Review 4Bet OOP Double Barrel and B-X-B Line", "q": "避坑提醒与行动项", "clues": ["DGL", "DTO", "heuristics"], "a": ["本视频是DGL系列中关于4Bet底池策略的重要一环，承接了DTO蓝图模块中4Bet底池不利位置的内容。讲师强调，理论基准（heuristics）是实战决策的起点，玩家应首先掌握这些频率和尺度，再根据对手的具体倾向进行剥削性调整。视频中使用的GTO手牌历史数据来自讲师的系统，观众也可自行下载手牌历史导入软件进行验证和学习。", "值得进一步学习的方向包括：下一期视频将深入探讨如何根据对手倾向调整诈唬频率（over bluff / under bluff）；以及4Bet底池中其他线路（如bet-bet-bet）的策略构建。建议先观看DTO蓝图模块中4Bet底池不利位置的相关内容，以获得更完整的理论框架。", "**行动项与常见错误提醒：**", "- 转牌圈务必根据牌面类型选择正确的下注尺度：双花顺/高连接牌面用全下，转牌A用25%小注，其他牌面用约40%几何尺度。", "- 顺子听牌在4Bet底池转牌圈应积极双枪，不要轻易放弃。", "- 河牌圈bet-check-bet线路中，平均应放弃约70%的未成对牌，切勿过度诈唬。", "- 河牌发出A时，可大幅提高诈唬频率（放弃率降至38%）；河牌完成顺子或同花时，应大幅降低诈唬频率（放弃率升至80%）。", "- 不要过度快打强牌：两对及以上只下注40%，顶对应过牌60%。"], "note": ""}, {"id": "DGL#89-intro", "ep": "89", "type": "intro", "topic": "DGL#89 手牌复盘：低双色翻牌面防守转牌探注", "en": "Hand Review Defending vs Turn Probes - Low Two Tone Boards", "q": "DGL#89 手牌复盘：低双色翻牌面防守转牌探注", "clues": ["BTN", "85%"], "a": ["本视频围绕一个具体手牌展开：讲师在BTN位用K♣J♣开局加注，翻牌7♠6♠4♣（双色低牌面）选择过牌，转牌Q♠对手领先下注半池，讲师选择加注（约85%底池），河牌7♠对手过牌后讲师放弃诈唬，最终对手亮出4♣3♣收池。讲师复盘后认为自己的加注在理论上并非最优，纯跟注才是正确选择。", "视频核心贡献在于揭示两个关键理论点：第一，面对采用单一尺度策略的对手时，你的加注频率应显著低于面对多尺度策略的对手——单尺度下加注频率仅6.87%，多尺度下升至9.83%（增幅近50%），因为多尺度策略会稀释对手半池范围内的坚果占比（从13.7%降至10%）。第二，面对转牌探注时整体加注频率极低（半池下注仅7%），大多数强牌和听牌都应选择跟注，只有极少数组合（如带卡顺的同花听牌或两头顺同花听牌）才适合加注。", "视频还深入分析了河牌圈的诈唬选择逻辑：当后门同花完成时，阻挡前门同花听牌的牌（如带♠的牌）应大幅放弃（60%过牌），不阻挡同花听牌的牌应纯诈唬下注，而带后门同花阻挡牌的杂色牌（如K♦3♦）则混合策略。讲师强调需要在转牌范围中保留少量\"垃圾牌\"（如K♣3♣），以便在河牌完成听牌时仍有可诈唬的组合。"], "note": ""}, {"id": "DGL#89-s0", "ep": "89", "type": "topic", "topic": "DGL#89 手牌复盘：低双色翻牌面防守转牌探注", "en": "Hand Review Defending vs Turn Probes - Low Two Tone Boards", "q": "手牌回顾与初始决策", "clues": ["BTN", "donk", "pot", "50%"], "a": ["讲师在BTN位用K♣J♣开局加注，翻牌7♠6♠4♣（双色低牌面），选择过牌——在此类低牌面上翻牌圈应有很高的过牌频率，尤其当对手donk(反主动下注)不足时。", "转牌Q♠，对手领先下注半池（50% pot）。讲师认为K♣J♣是\"完美加注候选\"，选择加注至约85%底池（与A♣Q♣、K♣Q♣的加注尺度一致）。", "讲师加注时主要考虑的是用A♣Q♣、K♣Q♣等顶对牌型应采用何种尺度，然后让其他牌型（暗三条、两对、听牌、诈唬）跟随该尺度。", "河牌7♠，对手过牌后讲师放弃诈唬（K♣J♣未中牌），对手亮出4♣3♣（顺子）收池。讲师认为7♠对对手的转牌跟注范围非常有利，因此选择放弃。"], "note": ""}, {"id": "DGL#89-s1", "ep": "89", "type": "topic", "topic": "DGL#89 手牌复盘：低双色翻牌面防守转牌探注", "en": "Hand Review Defending vs Turn Probes - Low Two Tone Boards", "q": "单尺度与多尺度策略的差异", "clues": ["face-up", "6.87%", "9.83%", "50%"], "a": ["核心概念：面对使用单一尺度策略的对手与面对使用多尺度策略的对手，你的加注频率应有显著差异。", "单尺度模拟（对手转牌仅用半池一个尺度）：面对半池探注，你的范围加注频率为6.87%。", "多尺度模拟（对手转牌有2.5x、1.2x、半池三个尺度）：面对半池探注，你的加注频率升至9.83%——看似仅增加3%，实际加注次数增加近50%。", "原因：多尺度策略下对手将强牌分散到不同下注尺度中，其半池范围内的坚果占比从13.7%（单尺度）降至10%（多尺度），因此你可以更激进地加注。", "多尺度下加注频率提升的具体牌型：K♣Q♣、A♣Q♣、Q♣7♣（大幅增加）、7♣6♣、以及其他价值牌型。", "实战判断规则：思考对手是\"只用一种尺度\"还是\"按牌力选尺度\"（后者更常见，即face-up打法）。若对手按牌力选尺度，你应采用更激进的加注策略（更多价值加注+更多诈唬）。"], "note": ""}, {"id": "DGL#89-s2", "ep": "89", "type": "topic", "topic": "DGL#89 手牌复盘：低双色翻牌面防守转牌探注", "en": "Hand Review Defending vs Turn Probes - Low Two Tone Boards", "q": "面对探注的整体加注频率极低", "clues": ["bet", "42%", "3.6%", "32%"], "a": ["关键结论：面对转牌探注，整体上不应频繁加注。多尺度模拟（未优化未剪枝）显示：面对3/4池下注，弃牌频率42%，加注频率仅3.6%。", "面对半池探注：平均弃牌频率32%，加注频率仅7%——即使对手在低牌面用半池下注，加注频率依然很低。", "原因：你在有利位置不想过度封盖自己的跟注范围；且对手若遭遇加注，仍可用3-bet反击。", "讲师手牌K♣J♣在理论上为纯跟注，跟注与加注的EV差异仅0.1BB（不可忽略），因此应选择跟注。"], "note": ""}, {"id": "DGL#89-s3", "ep": "89", "type": "topic", "topic": "DGL#89 手牌复盘：低双色翻牌面防守转牌探注", "en": "Hand Review Defending vs Turn Probes - Low Two Tone Boards", "q": "听牌加注的严格门槛", "clues": ["combo draw", "naked flush draw", "gut shot", "open-ended"], "a": ["组合听牌（combo draw）加注频率：多尺度模拟中仅35%，单尺度模拟中仅27%。", "具体规则：裸同花听牌（naked flush draw）永远不加注，纯跟注；同花听牌+卡顺（gut shot）也不加注，纯跟注；只有同花听牌+两头顺（open-ended）或同花听牌+顺子听牌（straight flush draw）才允许加注。", "讲师强调这一门槛\"相当高\"，自己原本预期可以更激进，但模拟结果颠覆了这一直觉。"], "note": ""}, {"id": "DGL#89-s4", "ep": "89", "type": "topic", "topic": "DGL#89 手牌复盘：低双色翻牌面防守转牌探注", "en": "Hand Review Defending vs Turn Probes - Low Two Tone Boards", "q": "河牌诈唬选择逻辑", "clues": ["60%", "40%", "50%"], "a": ["场景设定：转牌加注后被跟注，河牌发出后门同花完成牌（如♦），对手过牌。讲师重点分析河牌的下注/过牌策略。", "总体策略：未配对牌（A高或更差）在河牌60%过牌放弃，40%下注诈唬——符合\"诈唬牌在河牌放弃50%以上\"的一般原则。", "阻挡前门同花听牌的牌（如带♠的牌）大多放弃：T♠9♠、9♠8♠、J♠5♠混合策略，K♠5♠、A♠5♠大多放弃。", "不阻挡任何同花听牌的牌纯下注诈唬：如K♥3♥、K♣3♣（裸卡顺）在转牌以一定频率保留，河牌几乎全部下注，且使用全下尺度。", "带后门同花阻挡牌的杂色牌混合策略：A♦4♦、A♦5♦纯诈唬下注，K♦8♦、J♦8♦混合策略。", "关键洞察：转牌范围中必须保留少量\"垃圾牌\"（如K♣3♣），因为当河牌完成某些听牌时，你需要有合适的诈唬组合来平衡价值下注。"], "note": ""}, {"id": "DGL#89-s5", "ep": "89", "type": "topic", "topic": "DGL#89 手牌复盘：低双色翻牌面防守转牌探注", "en": "Hand Review Defending vs Turn Probes - Low Two Tone Boards", "q": "范围构建的平衡原则", "clues": ["blocker", "60%", "40%"], "a": ["河牌整体策略：未配对牌60%放弃，40%下注；但具体分类明确——阻挡前门同花听牌且未中的牌放弃，不阻挡同花听牌的牌纯下注，带后门同花阻挡牌的杂色牌混合策略。", "这种分类构建出平衡的下注范围，同时保持适当的放弃频率。", "讲师强调\"阻挡牌\"（blocker）在河牌诈唬选择中的核心作用：阻挡对手跟注范围的牌应放弃，不阻挡的牌应诈唬。"], "note": ""}, {"id": "DGL#89-c0", "ep": "89", "type": "cloze", "topic": "DGL#89 手牌复盘：低双色翻牌面防守转牌探注", "en": "Hand Review Defending vs Turn Probes - Low Two Tone Boards", "q": "对手领先下注半池（＿＿ pot）。讲师认为K♣J♣是\"完美加注候选\"，", "clues": [], "a": ["转牌Q♠，对手领先下注半池（50% pot）。讲师认为K♣J♣是\"完美加注候选\"，选择加注至约85%底池（与A♣Q♣、K♣Q♣的加注尺度一致）。"], "note": "50%"}, {"id": "DGL#89-c1", "ep": "89", "type": "cloze", "topic": "DGL#89 手牌复盘：低双色翻牌面防守转牌探注", "en": "Hand Review Defending vs Turn Probes - Low Two Tone Boards", "q": "单尺度模拟（对手转牌仅用半池一个尺度）：面对半池探注，你的范围加注频率为＿＿。", "clues": [], "a": ["单尺度模拟（对手转牌仅用半池一个尺度）：面对半池探注，你的范围加注频率为6.87%。"], "note": "6.87%"}, {"id": "DGL#89-c2", "ep": "89", "type": "cloze", "topic": "DGL#89 手牌复盘：低双色翻牌面防守转牌探注", "en": "Hand Review Defending vs Turn Probes - Low Two Tone Boards", "q": "多尺度模拟（未优化未剪枝）显示：面对3/4池下注，弃牌频率＿＿，加注频率仅3.6%。", "clues": [], "a": ["关键结论：面对转牌探注，整体上不应频繁加注。多尺度模拟（未优化未剪枝）显示：面对3/4池下注，弃牌频率42%，加注频率仅3.6%。"], "note": "42%"}, {"id": "DGL#89-note", "ep": "89", "type": "note", "topic": "DGL#89 手牌复盘：低双色翻牌面防守转牌探注", "en": "Hand Review Defending vs Turn Probes - Low Two Tone Boards", "q": "避坑提醒与行动项", "clues": ["DGL", "low two tone", "boards"], "a": ["本视频属于DGL系列（第89期），聚焦于低双色翻牌面（low two tone boards）上防守转牌探注的理论框架。视频以一手具体手牌为引子，结合GTO模拟数据（单尺度与多尺度对比）提炼出可操作的启发式规则。讲师明确表示\"剥削性策略\"（exploitative adjustments）将留待后续视频讨论，本视频仅覆盖理论层面。", "值得进一步学习的方向：①对手donk(反主动下注)频率对翻牌过牌频率的影响；②面对探注时的剥削性调整（如针对过度弃牌的对手增加诈唬加注）；③转牌范围中\"垃圾牌\"（如K♣3♣）的保留频率与具体选择标准；④河牌不同完成牌（前门同花vs后门同花）对诈唬策略的差异化影响。", "**行动项清单：**", "- 面对转牌探注时，默认以跟注为主，加注频率控制在7%左右（半池下注场景），不要高估加注的EV。", "- 判断对手是单尺度还是多尺度策略：若对手按牌力选尺度（face-up），可提高加注频率（约9.8%），并增加价值加注与诈唬加注。", "- 组合听牌加注门槛：裸同花听牌、同花听牌+卡顺一律跟注；仅同花听牌+两头顺或同花听牌+顺子听牌才考虑加注。", "- 河牌诈唬选择：阻挡前门同花听牌的牌优先放弃（60%以上），不阻挡同花听牌的牌纯诈唬下注，带后门同花阻挡牌的杂色牌混合策略。", "- 转牌范围中保留少量\"垃圾牌\"（如K♣3♣、K♥3♥），以便河牌完成听牌时有足够的诈唬组合。"], "note": ""}, {"id": "DGL#90-intro", "ep": "90", "type": "intro", "topic": "DGL#90 - 河牌圈玩法：寻找河牌全下诈唬的机会", "en": "River Play Finding Overbet All-In Bluffs on The River", "q": "DGL#90 - 河牌圈玩法：寻找河牌全下诈唬的机会", "clues": ["overbet all-in", "bluff", "pocket eights"], "a": ["本视频通过一个具体的对局案例，深入讲解如何在河牌圈识别并执行超额全下诈唬（overbet all-in bluff）。讲师以自己在CO位手持口袋对子8（pocket eights）的经历为例，展示了当对手范围中存在大量中等强度牌型而坚果牌有限时，全下诈唬可以成为极具盈利性的策略选择。视频强调，理解双方范围的构成与交互是做出这类高级决策的核心基础。", "视频的核心观点是：在河牌圈，当你是位置玩家且对手过牌时，如果你能感知到对手范围中坚果牌比例极低、而大量中等强度抓诈唬牌（bluff catcher）占主导，同时你自身范围中坚果牌（如同花、顺子）丰富，那么采用2倍底池甚至更大的全下尺度将迫使对手用大量边缘牌跟注，从而极大提升你的诈唬成功率。讲师通过求解器（solver）数据展示了这一策略在理论上如何成立，并强调了范围可视化（range visualization）能力对于区分普通玩家与顶尖玩家的重要性。", "视频还详细拆解了最小防御频率（MDF）在河牌全下场景中的应用，指出当对手面对2倍底池全下时，理论上需要防御约33%的范围，但由于诈唬牌本身可能拥有权益（equity），对手实际可略微降低防御频率。讲师通过具体数据展示了对手被迫用顶对（top pair）甚至更弱牌型跟注的“疯狂”场景，并以此说明理解这些数学原理如何帮助玩家在实战中做出更优决策。"], "note": ""}, {"id": "DGL#90-s0", "ep": "90", "type": "topic", "topic": "DGL#90 - 河牌圈玩法：寻找河牌全下诈唬的机会", "en": "River Play Finding Overbet All-In Bluffs on The River", "q": "牌例回顾：口袋对子8的河牌全下", "clues": ["bet", "33%", "40%"], "a": ["牌局背景：CO位手持8♠8♥（口袋对子8）开局加注，SB位3-bet（再加注），CO位跟注。翻牌为K♣9♣4♣，SB位持续下注（c-bet）33%底池，CO位跟注。转牌为6♣，双方过牌。河牌为T♦，SB位过牌，CO位全下，SB位弃牌。", "讲师选择用口袋对子8在河牌全下，是基于对双方范围构成的深入分析，而非随意诈唬。他提到自己在实战中凭直觉认为这手牌在理论上可能不是诈唬牌，但求解器显示类似牌型（如口袋对子7）在理论平衡策略中确实应该以40%频率全下诈唬。", "讲师强调，这种打法并非“疯狂”或“随机”，而是基于对对手范围中坚果牌比例与抓诈唬牌比例的清晰感知，以及对自己范围优势的准确判断。"], "note": ""}, {"id": "DGL#90-s1", "ep": "90", "type": "topic", "topic": "DGL#90 - 河牌圈玩法：寻找河牌全下诈唬的机会", "en": "River Play Finding Overbet All-In Bluffs on The River", "q": "范围分析：双方牌力构成对比", "clues": ["bet", "T8s", "3%", "3.8%"], "a": ["对手（SB位）范围特征：作为3-bet方，其范围中大量集中了中等强度的抓诈唬牌，如KQ、KJ、QJ、JT、JJ、QQ等，以及部分T8s、98s等牌型。这些牌在河牌圈一旦过牌，就沦为纯粹的抓诈唬牌。", "对手坚果牌有限：对手在转牌和河牌圈已经用部分同花牌型下注，因此过牌范围中同花和顺子的比例被稀释。求解器数据显示，对手范围中同花仅占3%，顺子仅占3.8%，两者合计约7%。", "我方（CO位）范围优势：作为翻前跟注3-bet的一方，我方范围中包含大量对手不可能拥有的同花连牌（如5♣4♣、8♣7♣），以及更多慢打的强牌（如同花、顺子）。讲师指出，我方在河牌圈拥有比对手更多的同花和顺子组合。", "关键结论：当对手范围中坚果牌极少而中等牌力牌型极多，且我方范围中坚果牌丰富时，全下诈唬的盈利空间巨大。"], "note": ""}, {"id": "DGL#90-s2", "ep": "90", "type": "topic", "topic": "DGL#90 - 河牌圈玩法：寻找河牌全下诈唬的机会", "en": "River Play Finding Overbet All-In Bluffs on The River", "q": "河牌圈下注尺度选择与范围构建", "clues": ["thin value bet", "pocket sevens", "blocker effect", "low pairs"], "a": ["求解器显示，在此牌面结构下，我方在河牌圈应采用三种下注尺度：小注（约23%底池）、2倍底池全下（约10%频率）以及介于两者之间的中等尺度。讲师指出，小注可能只是求解器为了应对剥削性调整而出现的产物，实战中通常不会采用。", "价值下注范围：K9（两对）在此处是纯全下牌型，两对及以上的牌力大多选择全下。讲师强调，由于牌面结构（同花和顺子同时完成），薄价值下注（thin value bet）变得不再合适，K9这类两对牌型如果选择小注下注，反而容易被对手加注剥削。", "诈唬范围构建：求解器显示，口袋对子7（pocket sevens）是理论上的最强诈唬牌，应以40%频率全下；口袋对子5、A4等牌型也是合理的全下诈唬候选。讲师选择口袋对子8，是因为它比A高牌（如AQ）具有更好的阻挡牌效应（blocker effect），且对手面对全下时可能过度弃牌。", "讲师特别指出，如果不用这些低对（low pairs）作为诈唬牌，就无法构建足够的诈唬频率，因为其他牌型（如A高牌）在阻挡牌和权益方面都不如这些低对有效。"], "note": ""}, {"id": "DGL#90-s3", "ep": "90", "type": "topic", "topic": "DGL#90 - 河牌圈玩法：寻找河牌全下诈唬的机会", "en": "River Play Finding Overbet All-In Bluffs on The River", "q": "最小防御频率（MDF）与对手的跟注压力", "clues": ["MDF", "sets", "top pair", "KTo"], "a": ["面对2倍底池全下，对手的最小防御频率（MDF）为33%（即1/(1+2)）。但由于我方部分诈唬牌（如口袋对子7）拥有约20%的权益，对手实际可以略微降低防御频率至约26%-27%。", "求解器数据显示，对手实际防御频率为26%（跟注），弃牌率为73%。其跟注范围中，同花占11%，顺子占14%，暗三条（sets）占18%，两对占17%，顶对（top pair）占19%。", "这意味着对手必须用大量边缘牌跟注，例如KTo（无梅花阻挡牌）、KJo（无梅花）、JJ（无梅花）等。讲师强调，这些牌在实战中几乎没有人会用来跟注2倍底池的全下，但理论上为了阻止我方过度诈唬，对手必须这样做。", "讲师用“疯狂”（insane）形容这一场景：对手在顺子完成、同花完成的牌面上，被迫用顶对甚至更弱的牌型跟注全下，这充分说明了理解MDF和范围交互的重要性。"], "note": ""}, {"id": "DGL#90-s4", "ep": "90", "type": "topic", "topic": "DGL#90 - 河牌圈玩法：寻找河牌全下诈唬的机会", "en": "River Play Finding Overbet All-In Bluffs on The River", "q": "范围可视化的实战应用", "clues": ["crusher", "mediocre player", "MDF"], "a": ["讲师提出一个简化的思考框架：不需要精确计算组合数，但要对双方范围中“坚果牌比例”与“中等抓诈唬牌比例”有一个粗略的感知。如果你能判断对手坚果牌有限而抓诈唬牌极多，同时自己坚果牌丰富，那么河牌圈全下诈唬就是高盈利的选择。", "具体操作步骤：1）分析对手翻前和翻后的范围构成，判断其过牌范围中坚果牌的密度；2）评估自己范围中坚果牌的数量与质量；3）结合下注尺度（如2倍底池）计算对手需要防御的频率；4）选择具有阻挡牌效应且有一定权益的牌型作为诈唬牌。", "讲师强调，这种能力是区分“碾压级玩家”（crusher）和“平庸玩家”（mediocre player）的关键。通过持续练习范围可视化、理解MDF和底池赔率，玩家可以显著提升决策质量。"], "note": ""}, {"id": "DGL#90-s5", "ep": "90", "type": "topic", "topic": "DGL#90 - 河牌圈玩法：寻找河牌全下诈唬的机会", "en": "River Play Finding Overbet All-In Bluffs on The River", "q": "常见错误与误区", "clues": [], "a": ["误区一：看到求解器中的全下诈唬策略就直接忽略，认为这只是理论上的“花哨”打法。讲师指出，如果理论已经允许你用部分范围进行超大下注，那么理解并掌握这种打法将带来巨大的额外优势，因为大多数对手对此类策略应对不当。", "误区二：在河牌圈用A高牌（如AQ）进行全下诈唬。讲师明确表示，A高牌在阻挡牌效应和权益方面都不如低对（如口袋对子8），因此不是理想的诈唬候选。", "误区三：在对手范围中坚果牌比例较高的情况下强行全下诈唬。讲师强调，全下诈唬的前提是对手坚果牌有限、抓诈唬牌众多，否则诈唬成功率将大幅下降。", "误区四：忽略薄价值下注的适用性。在此类牌面结构（同花和顺子同时完成）下，两对牌型不应选择小注下注，而应直接全下，否则容易被对手剥削。"], "note": ""}, {"id": "DGL#90-c0", "ep": "90", "type": "cloze", "topic": "DGL#90 - 河牌圈玩法：寻找河牌全下诈唬的机会", "en": "River Play Finding Overbet All-In Bluffs on The River", "q": "SB位持续下注（c-bet）＿＿底池，CO位跟注。", "clues": [], "a": ["牌局背景：CO位手持8♠8♥（口袋对子8）开局加注，SB位3-bet（再加注），CO位跟注。翻牌为K♣9♣4♣，SB位持续下注（c-bet）33%底池，CO位跟注。转牌为6♣，双方过牌。河牌为T♦，SB位过牌，CO位全下，SB位弃牌。"], "note": "33%"}, {"id": "DGL#90-c1", "ep": "90", "type": "cloze", "topic": "DGL#90 - 河牌圈玩法：寻找河牌全下诈唬的机会", "en": "River Play Finding Overbet All-In Bluffs on The River", "q": "求解器数据显示，对手范围中同花仅占＿＿，顺子仅占3.8%，", "clues": [], "a": ["对手坚果牌有限：对手在转牌和河牌圈已经用部分同花牌型下注，因此过牌范围中同花和顺子的比例被稀释。求解器数据显示，对手范围中同花仅占3%，顺子仅占3.8%，两者合计约7%。"], "note": "3%"}, {"id": "DGL#90-c2", "ep": "90", "type": "cloze", "topic": "DGL#90 - 河牌圈玩法：寻找河牌全下诈唬的机会", "en": "River Play Finding Overbet All-In Bluffs on The River", "q": "我方在河牌圈应采用三种下注尺度：小注（约＿＿底池）、2倍底池全下（约10%频率）以及介于两者之间的中等尺度。", "clues": [], "a": ["求解器显示，在此牌面结构下，我方在河牌圈应采用三种下注尺度：小注（约23%底池）、2倍底池全下（约10%频率）以及介于两者之间的中等尺度。讲师指出，小注可能只是求解器为了应对剥削性调整而出现的产物，实战中通常不会采用。"], "note": "23%"}, {"id": "DGL#90-note", "ep": "90", "type": "note", "topic": "DGL#90 - 河牌圈玩法：寻找河牌全下诈唬的机会", "en": "River Play Finding Overbet All-In Bluffs on The River", "q": "避坑提醒与行动项", "clues": ["DGL", "MDF", "GTO"], "a": ["本视频是DGL系列课程中关于河牌圈玩法的专项讲解，重点聚焦于超额全下诈唬的识别与执行。讲师通过一个实战牌例，将范围分析、MDF计算、阻挡牌效应等高级概念有机串联，展示了从理论到实战的完整思考路径。视频内容承接了GTO蓝图课程中关于MDF和范围构建的模块，适合已经掌握基础扑克策略、希望进一步提升河牌圈决策能力的玩家学习。", "值得进一步学习的方向包括：1）深入研究求解器中不同牌面结构下的全下诈唬频率与牌型选择；2）练习快速估算对手范围中坚果牌与抓诈唬牌的比例；3）结合ICM等锦标赛因素，调整河牌全下诈唬的频率与尺度。讲师在视频结尾强调，持续锻炼范围可视化和数学计算能力，是成为顶尖玩家的必经之路。", "**行动项与常见错误提醒：**", "- 应该做：在河牌圈作为位置玩家时，主动分析对手过牌范围中坚果牌与中等牌力的比例，若对手坚果牌有限而抓诈唬牌众多，积极考虑全下诈唬。", "- 应该做：选择诈唬牌时，优先考虑具有阻挡牌效应且有一定权益的牌型（如口袋对子7、8），而非A高牌。", "- 应该做：理解并运用MDF概念，计算对手面对不同下注尺度时需要防御的频率，以此判断全下诈唬的盈利性。", "- 不要做：在对手范围中坚果牌比例较高时强行全下诈唬，这会导致诈唬成功率大幅下降。", "- 不要做：忽略求解器中全下诈唬策略的价值，应将其视为提升自身打法层次的重要工具。", "- 不要做：在顺子和同花同时完成的牌面上，用两对牌型选择小注下注，应直接全下以避免被剥削。"], "note": ""}, {"id": "DGL#91-intro", "ep": "91", "type": "intro", "topic": "DGL#91 - 翻前加注者单挑底池中，A-低-低牌面下的有利位置持续下注策略", "en": "PFR SRP IP C-betting on Ace-Low-Low Textures", "q": "DGL#91 - 翻前加注者单挑底池中，A-低-低牌面下的有利位置持续下注策略", "clues": ["Ace-Low-Low", "PFR", "bet"], "a": ["本视频通过一个具体牌例，深入讲解在A-低-低（Ace-Low-Low）牌面结构下，翻前加注者（PFR）在有利位置（IP）面对大盲防守时应如何调整持续下注（C-bet）频率。讲师明确指出，许多玩家认为这类干燥且己方有坚果优势的牌面适合高频下注，但GTO求解器给出的答案是：应当以极高频率过牌，而非下注。", "视频通过GTO Wizard求解器数据，展示了CO对BB、BTN对BB、HJ对BB三种位置对抗下，A-低-低牌面的最优过牌频率分别为66%、63%和70%。讲师从对手范围构成（两对、暗三条、顺子听牌）、己方中等强度牌的权益实现、以及被过牌加注后的可玩性等角度，系统解释了为何这类牌面需要被动打法，并指出中等强度牌区域的大小决定了整个范围的策略倾向。", "最后，讲师通过实战牌例展示了在这种平衡策略下获得的隐藏收益——对手因不理解你的范围而做出错误决策，从而让你获得额外价值。"], "note": ""}, {"id": "DGL#91-s0", "ep": "91", "type": "topic", "topic": "DGL#91 - 翻前加注者单挑底池中，A-低-低牌面下的有利位置持续下注策略", "en": "PFR SRP IP C-betting on Ace-Low-Low Textures", "q": "牌例引入与直觉误区", "clues": ["Ace", "Four", "Deuce", "bet"], "a": ["实战牌例：CO位用65s（同花65）开局加注，BB位防守，翻牌为A-4-2彩虹面（Ace, Four, Deuce，两张方片）。", "许多玩家直觉认为这类牌面非常适合高频C-bet，理由有三：己方有Ace优势、牌面相对干燥、对手范围较弱。", "讲师强调，这种直觉是错误的，A-低-低牌面的C-bet频率应当非常低，与多数人的认知相反。"], "note": ""}, {"id": "DGL#91-s1", "ep": "91", "type": "topic", "topic": "DGL#91 - 翻前加注者单挑底池中，A-低-低牌面下的有利位置持续下注策略", "en": "PFR SRP IP C-betting on Ace-Low-Low Textures", "q": "求解器数据：CO对BB的过牌频率", "clues": ["GTO Wizard", "78%", "22%", "33%"], "a": ["使用GTO Wizard求解器分析CO对BB单挑底池，翻牌A-4-2彩虹面。", "求解器结果显示：78%的频率选择过牌，下注频率仅为22%左右。", "注意：GTO Wizard中最小下注尺度为33%底池，这已经算相对较大的尺度；若加入更小的下注尺度（如25%或20%底池），过牌频率会略有下降，但仍会维持在65%-70%的高位。", "结论：这类牌面上过牌频率极高，远超多数玩家的预期。"], "note": ""}, {"id": "DGL#91-s2", "ep": "91", "type": "topic", "topic": "DGL#91 - 翻前加注者单挑底池中，A-低-低牌面下的有利位置持续下注策略", "en": "PFR SRP IP C-betting on Ace-Low-Low Textures", "q": "对手范围优势：两对、暗三条与顺子听牌", "clues": [], "a": ["A-低-低牌面上，对手（BB位）拥有相当数量的两对、暗三条以及顺子听牌组合，这些是己方（CO位）不具备或数量更少的牌型。", "具体组合对比：对手可能持有54s（同花54）形成顺子听牌，而己方没有；双方都有一定数量的暗三条，但对手拥有全部的22和44，而CO位有时需要弃掉部分小对子（虽然讲师认为几乎没人会从CO位弃掉22）。", "两对组合：对手拥有A4、A2、42s（同花42），而己方没有42s。", "对手拥有更多第二对子和第三对子（如K4、Q4、K2等），这些牌通常附带卡顺听牌，且具有很好的阻挡牌效应，从对手视角看是极佳的诈唬候选牌。"], "note": ""}, {"id": "DGL#91-s3", "ep": "91", "type": "topic", "topic": "DGL#91 - 翻前加注者单挑底池中，A-低-低牌面下的有利位置持续下注策略", "en": "PFR SRP IP C-betting on Ace-Low-Low Textures", "q": "中等强度牌为何偏好过牌", "clues": ["check-raise", "79%", "11%"], "a": ["己方中等强度牌（如K高、Q高、J高等）在A-低-低牌面上最怕被过牌加注（check-raise），因为面对加注无法继续游戏。", "这些牌型实际上不需要太多\"保护\"——持有K高时，真正需要防范的听牌并不多；唯一的\"保护\"方式是在被诈唬之前先诈唬对手。", "由于对手在转牌圈被迫保持被动（过牌频率高达79%），己方的中等强度牌在过牌线路上能获得极佳的权益实现（equity realization），无需担心失去底池份额。", "理论要点：如果下注，将面临大量过牌加注——求解器显示对手在翻牌的过牌加注频率超过11%，且有时加注尺度很大。"], "note": ""}, {"id": "DGL#91-s4", "ep": "91", "type": "topic", "topic": "DGL#91 - 翻前加注者单挑底池中，A-低-低牌面下的有利位置持续下注策略", "en": "PFR SRP IP C-betting on Ace-Low-Low Textures", "q": "纯策略过牌与范围主导原则", "clues": ["pure strategy", "Top Pair", "75%", "46%"], "a": ["在A-低-低牌面上，求解器给出了大量纯策略（pure strategy）过牌，这在大多数牌面结构中极为罕见。", "具体表现：大量K高、Q高、J高甚至部分口袋对子T（TT）都是纯过牌。", "核心理由：过牌线路的权益实现极高，而下注线路的权益实现不佳，因此中等强度牌一致偏好过牌。", "重要原则：当范围中最大的区域（中等强度牌）倾向于某种打法时，强牌也需要跟随该区域调整策略——本例中，顶对（Top Pair）的过牌频率高达75%，两对+的过牌频率为46%（接近50/50混合）。", "这与通常\"强牌主导范围策略\"的认知相反，但在扑克中，范围中最大的区域才是决定整体策略的关键。"], "note": ""}, {"id": "DGL#91-s5", "ep": "91", "type": "topic", "topic": "DGL#91 - 翻前加注者单挑底池中，A-低-低牌面下的有利位置持续下注策略", "en": "PFR SRP IP C-betting on Ace-Low-Low Textures", "q": "各位置A-低-低牌面过牌频率汇总", "clues": ["BTN", "66%", "63%", "70%"], "a": ["CO对BB，A-低-低牌面（高牌为A，中牌≤7，低牌≤7，非对子牌面）：整体过牌频率66%。", "BTN对BB，A-低-低牌面：整体过牌频率63%。", "HJ对BB，A-低-低牌面：整体过牌频率70%，为三者中最高。", "讲师推测HJ过牌频率更高的原因：HJ位加注尺度可能更小（虽然本视频中仍为2.5x），对手可能拥有更多非同花两对组合。", "结论：在所有位置对抗BB的情况下，A-低-低牌面的最优策略都是高频率过牌，频率在63%-70%之间。"], "note": ""}, {"id": "DGL#91-s6", "ep": "91", "type": "topic", "topic": "DGL#91 - 翻前加注者单挑底池中，A-低-低牌面下的有利位置持续下注策略", "en": "PFR SRP IP C-betting on Ace-Low-Low Textures", "q": "实战牌例与平衡策略的隐藏收益", "clues": ["bluff catcher", "90%"], "a": ["实战过程：翻牌A-4-2彩虹面，己方过牌；转牌对手下注，己方跟注；河牌发出3♣，己方组成坚果顺子（A-2-3-4-5）。", "对手下注半个底池，己方全下，对手用抓诈唬牌型（bluff catcher）跟注。", "求解器显示，对手的抓诈唬牌型面对全下应当以90%以上的频率弃牌，但实战中对手错误跟注。", "隐藏收益：当你在这些牌面上保持平衡策略时，对手无法准确理解你的范围，会做出各种错误假设，从而让你通过更平衡的打法获得额外优势。"], "note": ""}, {"id": "DGL#91-c1", "ep": "91", "type": "cloze", "topic": "DGL#91 - 翻前加注者单挑底池中，A-低-低牌面下的有利位置持续下注策略", "en": "PFR SRP IP C-betting on Ace-Low-Low Textures", "q": "求解器结果显示：＿＿的频率选择过牌，下注频率仅为22%左右。", "clues": [], "a": ["求解器结果显示：78%的频率选择过牌，下注频率仅为22%左右。"], "note": "78%"}, {"id": "DGL#91-c3", "ep": "91", "type": "cloze", "topic": "DGL#91 - 翻前加注者单挑底池中，A-低-低牌面下的有利位置持续下注策略", "en": "PFR SRP IP C-betting on Ace-Low-Low Textures", "q": "由于对手在转牌圈被迫保持被动（过牌频率高达＿＿），", "clues": [], "a": ["由于对手在转牌圈被迫保持被动（过牌频率高达79%），己方的中等强度牌在过牌线路上能获得极佳的权益实现（equity realization），无需担心失去底池份额。"], "note": "79%"}, {"id": "DGL#91-c4", "ep": "91", "type": "cloze", "topic": "DGL#91 - 翻前加注者单挑底池中，A-低-低牌面下的有利位置持续下注策略", "en": "PFR SRP IP C-betting on Ace-Low-Low Textures", "q": "顶对（Top Pair）的过牌频率高达＿＿，两对+的过牌频率为46%（接近50/50混合）。", "clues": [], "a": ["重要原则：当范围中最大的区域（中等强度牌）倾向于某种打法时，强牌也需要跟随该区域调整策略——本例中，顶对（Top Pair）的过牌频率高达75%，两对+的过牌频率为46%（接近50/50混合）。"], "note": "75%"}, {"id": "DGL#91-note", "ep": "91", "type": "note", "topic": "DGL#91 - 翻前加注者单挑底池中，A-低-低牌面下的有利位置持续下注策略", "en": "PFR SRP IP C-betting on Ace-Low-Low Textures", "q": "避坑提醒与行动项", "clues": ["DGL", "GTO Wizard", "bet"], "a": ["本视频是DGL系列第91期，聚焦于翻前加注者单挑底池中A-低-低牌面的持续下注策略。讲师提到，后续会有另一期视频专门展示在这种平衡策略下的更多隐藏收益。建议结合GTO Wizard等求解器工具，自行查看不同位置、不同筹码深度下A-低-低牌面的求解结果，加深对\"范围中最大区域决定策略\"这一原则的理解。", "**行动项与常见错误：**", "- 应该做：在A-低-低牌面上大幅降低C-bet频率，CO对BB约66%过牌，BTN对BB约63%过牌，HJ对BB约70%过牌。", "- 应该做：用中等强度牌（K高、Q高、J高等）纯过牌，利用对手被迫保持被动的特点实现权益。", "- 应该做：让强牌跟随中等强度牌的策略，顶对也应以约75%频率过牌。", "- 不要做：不要因为己方有Ace优势就认为A-低-低牌面适合高频下注——对手拥有更多两对、暗三条和顺子听牌组合。", "- 不要做：不要用中等强度牌下注后被过牌加注——对手在这些牌面上的过牌加注频率超过11%，且你无法继续游戏。"], "note": ""}, {"id": "DGL#92-intro", "ep": "92", "type": "intro", "topic": "DGL#92 - 翻前加注者有利位置翻牌圈持续下注后，转牌圈单张高牌无听牌时的双重下注策略", "en": "PFR 3BP IP Double Barreling One Over no Draw", "q": "DGL#92 - 翻前加注者有利位置翻牌圈持续下注后，转牌圈单张高牌无听牌时的双重下注策略", "clues": ["PFR", "one over no", "draw"], "a": ["本视频聚焦于翻前加注者（PFR）在有利位置（IP）面对翻牌圈被跟注后，转牌圈持有“单张高牌无听牌”（one over no draw）牌型时的下注频率问题。讲师指出，玩家群体（population）普遍存在转牌圈下注不足（under-barrel）的倾向，而河牌圈又存在诈唬不足（under-bluff）的问题，这两个漏洞组合导致防守方（OOP）在转牌圈应该过度弃牌（over-fold）来剥削。", "讲师通过一个具体牌例（手持口袋对子99，翻牌面Q-6-5彩虹，转牌Q♥）引出话题，并使用Solver软件分析Q-6-5-Q转牌面上各类高牌组合（K高、A高）的最优下注频率。核心结论是：这类“单张高牌无听牌”的牌型应该以60%的频率持续下注，但大多数玩家实际下注频率远低于此，从而被有经验的对手利用。", "视频最后给出明确行动建议：如果你不想成为被剥削的一方，就应该将转牌圈的单张高牌无听牌牌型纳入60%下注频率的范畴，保持平衡，避免被过度弃牌的对手剥削。"], "note": ""}, {"id": "DGL#92-s0", "ep": "92", "type": "topic", "topic": "DGL#92 - 翻前加注者有利位置翻牌圈持续下注后，转牌圈单张高牌无听牌时的双重下注策略", "en": "PFR 3BP IP Double Barreling One Over no Draw", "q": "牌例引入：口袋对子99防守", "clues": ["UTG", "bet", "clean 6-5", "rainbow"], "a": ["讲师以自己最近打的一手牌为例：手持口袋对子99，翻前UTG位开局加注后被3-bet（再加注），讲师跟注。", "翻牌面为6-5-2彩虹（clean 6-5 rainbow），讲师过牌，对手持续下注1/3底池，讲师跟注。", "转牌发出2♥（clean of hearts），对手再次下注（barrel）。", "讲师指出这手牌本身并不特别有趣，但引出了一个重要讨论：IP玩家在转牌圈的下注频率问题。"], "note": ""}, {"id": "DGL#92-s1", "ep": "92", "type": "topic", "topic": "DGL#92 - 翻前加注者有利位置翻牌圈持续下注后，转牌圈单张高牌无听牌时的双重下注策略", "en": "PFR 3BP IP Double Barreling One Over no Draw", "q": "群体漏洞：转牌下注不足与河牌诈唬不足", "clues": ["red line", "under-barrel the", "turn", "under-bluff the"], "a": ["讲师在另一条“红线”（red line，指非摊牌赢利）分析中讨论过这手牌，发现两个群体性漏洞：", "转牌圈下注不足（under-barrel the turn）", "河牌圈诈唬不足（under-bluff the river），且诈唬范围构成不合理", "这两个漏洞组合在一起，使得防守方（OOP玩家）在转牌圈应该过度弃牌（over-fold the turn）。", "正确的适应策略是：作为OOP玩家，在转牌圈用抓诈唬牌型（bluff catcher）过度弃牌，因为IP玩家诈唬不足。"], "note": ""}, {"id": "DGL#92-s2", "ep": "92", "type": "topic", "topic": "DGL#92 - 翻前加注者有利位置翻牌圈持续下注后，转牌圈单张高牌无听牌时的双重下注策略", "en": "PFR 3BP IP Double Barreling One Over no Draw", "q": "单张高牌无听牌的60%下注频率", "clues": ["one over card", "no draw", "OOP", "overfold"], "a": ["讲师引用蓝图课程（Detail Blueprint Course）的笔记：单张高牌无听牌（one over card no draw）类型应该以60%的频率下注。", "讲师个人认为这是该场景下被严重低估下注频率的主要牌型类别，正是这种不足导致了数据中观察到的群体漏洞。", "如果IP玩家不下注这些牌，OOP玩家就可以在翻牌圈过度跟注（overcall the flop），并在河牌圈过度弃牌（overfold）来剥削。"], "note": ""}, {"id": "DGL#92-s3", "ep": "92", "type": "topic", "topic": "DGL#92 - 翻前加注者有利位置翻牌圈持续下注后，转牌圈单张高牌无听牌时的双重下注策略", "en": "PFR 3BP IP Double Barreling One Over no Draw", "q": "Solver分析：K高牌型的下注频率", "clues": ["Solver", "blocker", "trips", "heuristic"], "a": ["使用Solver分析翻牌面Q-6-5彩虹、转牌Q♥的场景，假设翻牌圈IP玩家持续下注后被跟注，进入转牌圈。", "查看K高牌型（单张高牌无听牌）的最优策略：", "K♠J♠、K♦J♦、K♣J♣、K♠T♠、K♣T♣、K♦T♦ 等组合", "Solver显示这些牌型下注频率恰好为60%。", "讲师认为这些牌型是非常自然的转牌圈下注选择，因为拥有阻挡牌（blocker），阻挡了对手的明三条（trips）组合。", "但很多玩家尚未在思维过程中固化这一启发式规则（heuristic），因此讲师鼓励观众在游戏中增加这类下注。"], "note": ""}, {"id": "DGL#92-s4", "ep": "92", "type": "topic", "topic": "DGL#92 - 翻前加注者有利位置翻牌圈持续下注后，转牌圈单张高牌无听牌时的双重下注策略", "en": "PFR 3BP IP Double Barreling One Over no Draw", "q": "Solver分析：A高牌型的下注频率", "clues": ["check", "54%", "60%", "40%"], "a": ["查看A高牌型（同样为单张高牌无听牌）：", "如果排除AK（讲师认为AK是玩家在该场景下更自然的下注牌型），其余A高牌型的下注频率为54%。", "如果四舍五入到最近的频率档位（讲师一贯推荐的做法），应该以60%的频率下注。", "具体涉及的牌型包括：A♠J♠、A♠T♠、A♠8♠、A♠7♠、A♠4♠ 等。", "汇总这些牌型的整体策略：60%下注、40%过牌（check）。"], "note": ""}, {"id": "DGL#92-s5", "ep": "92", "type": "topic", "topic": "DGL#92 - 翻前加注者有利位置翻牌圈持续下注后，转牌圈单张高牌无听牌时的双重下注策略", "en": "PFR 3BP IP Double Barreling One Over no Draw", "q": "剥削链与平衡策略", "clues": ["OOP", "balanced", "60%"], "a": ["如果玩家不下注这些单张高牌无听牌牌型，会产生连锁反应：", "转牌圈下注频率不足 → OOP玩家可以在翻牌圈过度跟注", "河牌圈诈唬不足 → OOP玩家可以在河牌圈过度弃牌", "避免被剥削的方法：在转牌圈持有单张高牌无听牌时，将其纳入60%下注频率的范畴。", "通过以60%频率下注这些牌型，你能够保持平衡（balanced），避免被OOP玩家利用过度弃牌策略剥削。"], "note": ""}, {"id": "DGL#92-c2", "ep": "92", "type": "cloze", "topic": "DGL#92 - 翻前加注者有利位置翻牌圈持续下注后，转牌圈单张高牌无听牌时的双重下注策略", "en": "PFR 3BP IP Double Barreling One Over no Draw", "q": "讲师引用蓝图课程（Detail Blueprint Course）的笔记：单张高牌无听牌（one over card no draw）类型应该以＿＿的频率下注。", "clues": [], "a": ["讲师引用蓝图课程（Detail Blueprint Course）的笔记：单张高牌无听牌（one over card no draw）类型应该以60%的频率下注。"], "note": "60%"}, {"id": "DGL#92-c3", "ep": "92", "type": "cloze", "topic": "DGL#92 - 翻前加注者有利位置翻牌圈持续下注后，转牌圈单张高牌无听牌时的双重下注策略", "en": "PFR 3BP IP Double Barreling One Over no Draw", "q": "Solver显示这些牌型下注频率恰好为＿＿。", "clues": [], "a": ["Solver显示这些牌型下注频率恰好为60%。"], "note": "60%"}, {"id": "DGL#92-c4", "ep": "92", "type": "cloze", "topic": "DGL#92 - 翻前加注者有利位置翻牌圈持续下注后，转牌圈单张高牌无听牌时的双重下注策略", "en": "PFR 3BP IP Double Barreling One Over no Draw", "q": "如果排除AK（讲师认为AK是玩家在该场景下更自然的下注牌型），其余A高牌型的下注频率为＿＿。", "clues": [], "a": ["如果排除AK（讲师认为AK是玩家在该场景下更自然的下注牌型），其余A高牌型的下注频率为54%。"], "note": "54%"}, {"id": "DGL#92-note", "ep": "92", "type": "note", "topic": "DGL#92 - 翻前加注者有利位置翻牌圈持续下注后，转牌圈单张高牌无听牌时的双重下注策略", "en": "PFR 3BP IP Double Barreling One Over no Draw", "q": "避坑提醒与行动项", "clues": ["DGL", "red line", "OOP"], "a": ["本视频是DGL系列（#92）的一部分，承接了之前关于翻前加注者有利位置策略的讨论，特别是翻牌圈持续下注后的转牌圈行动选择。视频中提到的“红线”（red line）分析是讲师另一条内容线，关注非摊牌赢利（non-showdown winnings），与本视频的转牌圈下注频率问题相互印证。值得进一步学习的方向包括：河牌圈诈唬范围的构成与平衡、不同转牌牌面对下注频率的影响，以及如何根据对手的群体倾向调整自己的下注频率。", "**行动项与常见错误：**", "- 应该做：在转牌圈持有单张高牌无听牌（如K高、A高无听牌）时，以60%频率持续下注。", "- 应该做：将AK视为更自然的下注牌型，但不要因此忽略其他A高牌型的下注频率。", "- 不要做：不要因为担心被跟注而减少转牌圈的下注频率，这会让你的范围变得可预测且容易被剥削。", "- 不要做：不要成为“转牌圈下注不足、河牌圈诈唬不足”的群体性漏洞玩家，这会让OOP对手通过过度弃牌来剥削你。"], "note": ""}, {"id": "DGL#93-intro", "ep": "93", "type": "intro", "topic": "DGL#93 - 翻前3-bet底池中，位置有利时用低踢脚A高张作为多街诈唬牌", "en": "PFC 3BP IP Using Low Kicker A Highs as Multi-Street Bluffs", "q": "DGL#93 - 翻前3-bet底池中，位置有利时用低踢脚A高张作为多街诈唬牌", "clues": ["BTN", "bet", "Low Board"], "a": ["本视频聚焦于一个具体的翻后场景：你在翻前于有利位置（如BTN）跟注了对手（尤其是小盲位）的3-bet(再加注)，翻牌面为低牌面（Low Board，即牌面最高牌不超过J），且对手过牌给你。讲师提出一个核心启发式策略：在这种局面下，手持低踢脚A高张（如A3、A5等）且没有任何听牌（包括后门同花听牌）时，你应该以极高频率进行多街诈唬。", "视频通过一个实战牌例（A3在T-7-6彩虹面）展示了完整的诈唬线路，随后用GTO求解器数据验证了该策略：翻牌圈面对过牌时下注频率高达80%，转牌圈在对手跟注后继续下注的频率为64%。讲师强调，这类牌型是天然的诈唬候选，因为低踢脚牌不会阻挡对手的弃牌范围，同时A高张本身具备摊牌权益和反超潜力。", "内容框架分为三部分：实战牌例演示、GTO数据筛选条件说明、翻牌与转牌的具体下注频率启发式。最终结论是：在3-bet底池中作为有利位置跟注者，面对低牌面且无听牌时，低踢脚A高张应作为高频多街诈唬牌使用，而非被动过牌或只下注一条街。"], "note": ""}, {"id": "DGL#93-s0", "ep": "93", "type": "topic", "topic": "DGL#93 - 翻前3-bet底池中，位置有利时用低踢脚A高张作为多街诈唬牌", "en": "PFC 3BP IP Using Low Kicker A Highs as Multi-Street Bluffs", "q": "实战牌例：A3在T-7-6彩虹面", "clues": ["A3o", "A3s", "BTN", "bet"], "a": ["讲师手持A3（具体为A3o或A3s未明确，但属于低踢脚A高张），在BTN(庄位)或CO(关位)开局加注，被小盲位常规玩家3-bet(再加注)，讲师选择跟注。", "翻牌面为T-7-6彩虹面（T♥7♠6♦，三色），小盲位过牌。讲师指出，此时应立即意识到应该用这类牌高频下注。", "讲师在翻牌圈下注（stab），对手跟注；转牌发出A♥，对手再次过牌，讲师继续下注（barrel），对手再次跟注；河牌发出6♥，对手第三次过牌，讲师全下（all-in）诈唬，对手弃牌。", "讲师强调，转牌的A对己方范围有利，因为己方范围中包含一些9x和口袋对子88，这张A增强了整体范围的牌力。"], "note": ""}, {"id": "DGL#93-s1", "ep": "93", "type": "topic", "topic": "DGL#93 - 翻前3-bet底池中，位置有利时用低踢脚A高张作为多街诈唬牌", "en": "PFC 3BP IP Using Low Kicker A Highs as Multi-Street Bluffs", "q": "低踢脚A高张的诈唬逻辑", "clues": ["A2s-A8s", "bet", "overcard equity"], "a": ["这类牌（如A2s-A8s）在低牌面、3-bet底池、有利位置跟注者场景下，是极佳的多街诈唬候选。", "低踢脚牌（如A3中的3）完全不会阻挡对手的弃牌范围——对手弃牌范围中通常包含大量低张（如2-8），而你的低踢脚不会减少这些组合，因此对手更容易弃牌。", "A高张本身具备高张权益（overcard equity），即转牌或河牌发出A时，你有可能反超对手的对子或听牌，这为诈唬提供了额外的胜率保障。", "如果只依赖纯权益驱动的范围（如只下注有强成牌或强听牌的牌），你的范围会缺乏诈唬组合，导致下注频率不足，容易被对手剥削。"], "note": ""}, {"id": "DGL#93-s2", "ep": "93", "type": "topic", "topic": "DGL#93 - 翻前3-bet底池中，位置有利时用低踢脚A高张作为多街诈唬牌", "en": "PFC 3BP IP Using Low Kicker A Highs as Multi-Street Bluffs", "q": "GTO数据筛选条件", "clues": ["GTO Wizard", "bet", "A2s", "A8s"], "a": ["讲师使用GTO求解器（GTO Wizard）进行数据验证，筛选条件为：己方在有利位置开局加注，面对小盲位3-bet(再加注)后跟注，翻牌后小盲位过牌。", "己方手牌范围限定为A2s到A8s（低踢脚A同花），排除A9s及以上。", "牌面限定为低牌面（board not jack high or higher，即最高牌不超过J），且己方没有任何听牌——包括顺子听牌、同花听牌，甚至后门同花听牌（backdoor flush draw）也被排除。", "该筛选确保数据反映的是“纯A高张、无任何额外权益”的最纯粹场景。"], "note": ""}, {"id": "DGL#93-s3", "ep": "93", "type": "topic", "topic": "DGL#93 - 翻前3-bet底池中，位置有利时用低踢脚A高张作为多街诈唬牌", "en": "PFC 3BP IP Using Low Kicker A Highs as Multi-Street Bluffs", "q": "翻牌圈下注频率：80%", "clues": ["GTO", "80%", "20%"], "a": ["GTO数据显示，在上述筛选条件下，翻牌圈面对对手过牌时，低踢脚A高张的下注频率为80%，过牌频率为20%。", "讲师列出多个具体牌例验证这一频率：A5♣在9-8-2（两黑桃一红心）牌面、A5♣在T-9-6牌面、A4♣在T-7-5牌面、A4♦在8-2-2牌面、A4♣在9-6-5牌面——所有这些组合都应以80%频率下注。", "讲师指出，这一80%下注频率可能超出许多玩家的预期，但这是GTO标准策略，应纳入自己的游戏计划。"], "note": ""}, {"id": "DGL#93-s4", "ep": "93", "type": "topic", "topic": "DGL#93 - 翻前3-bet底池中，位置有利时用低踢脚A高张作为多街诈唬牌", "en": "PFC 3BP IP Using Low Kicker A Highs as Multi-Street Bluffs", "q": "转牌圈下注频率：64%", "clues": ["double barrel", "bucket on the", "flop", "turn"], "a": ["在翻牌圈下注且对手跟注后，转牌圈的继续下注（double barrel）频率为64%，过牌频率为36%。", "这意味着，翻牌圈80%下注频率的牌型，在转牌圈仍保持约60%以上的下注频率，是极佳的双重下注（double barrel）候选。", "讲师总结为“80% bucket on the flop, 60% bucket on the turn”，即翻牌圈80%频率下注，转牌圈60%频率继续下注。"], "note": ""}, {"id": "DGL#93-s5", "ep": "93", "type": "topic", "topic": "DGL#93 - 翻前3-bet底池中，位置有利时用低踢脚A高张作为多街诈唬牌", "en": "PFC 3BP IP Using Low Kicker A Highs as Multi-Street Bluffs", "q": "策略总结与执行要点", "clues": ["bet", "threadpots", "low boards", "80%"], "a": ["核心启发式：在3-bet底池中，作为有利位置跟注者，面对低牌面且对手过牌时，低踢脚A高张（无听牌）应作为多街诈唬牌，翻牌圈下注频率80%，转牌圈（若被跟注）继续下注频率64%。", "这一策略适用于“threadpots”（即3-bet底池）和“low boards”（低牌面），且己方无任何听牌（包括后门同花听牌）。", "讲师强调，如果玩家尚未将此策略纳入游戏计划，应尽快添加，因为这类牌型是弥补诈唬频率不足的关键。"], "note": ""}, {"id": "DGL#93-c3", "ep": "93", "type": "cloze", "topic": "DGL#93 - 翻前3-bet底池中，位置有利时用低踢脚A高张作为多街诈唬牌", "en": "PFC 3BP IP Using Low Kicker A Highs as Multi-Street Bluffs", "q": "翻牌圈面对对手过牌时，低踢脚A高张的下注频率为＿＿，过牌频率为20%。", "clues": [], "a": ["GTO数据显示，在上述筛选条件下，翻牌圈面对对手过牌时，低踢脚A高张的下注频率为80%，过牌频率为20%。"], "note": "80%"}, {"id": "DGL#93-c4", "ep": "93", "type": "cloze", "topic": "DGL#93 - 翻前3-bet底池中，位置有利时用低踢脚A高张作为多街诈唬牌", "en": "PFC 3BP IP Using Low Kicker A Highs as Multi-Street Bluffs", "q": "转牌圈的继续下注（double barrel）频率为＿＿，", "clues": [], "a": ["在翻牌圈下注且对手跟注后，转牌圈的继续下注（double barrel）频率为64%，过牌频率为36%。"], "note": "64%"}, {"id": "DGL#93-c5", "ep": "93", "type": "cloze", "topic": "DGL#93 - 翻前3-bet底池中，位置有利时用低踢脚A高张作为多街诈唬牌", "en": "PFC 3BP IP Using Low Kicker A Highs as Multi-Street Bluffs", "q": "翻牌圈下注频率＿＿，转牌圈（若被跟注）继续下注频率64%。", "clues": [], "a": ["核心启发式：在3-bet底池中，作为有利位置跟注者，面对低牌面且对手过牌时，低踢脚A高张（无听牌）应作为多街诈唬牌，翻牌圈下注频率80%，转牌圈（若被跟注）继续下注频率64%。"], "note": "80%"}, {"id": "DGL#93-note", "ep": "93", "type": "note", "topic": "DGL#93 - 翻前3-bet底池中，位置有利时用低踢脚A高张作为多街诈唬牌", "en": "PFC 3BP IP Using Low Kicker A Highs as Multi-Street Bluffs", "q": "避坑提醒与行动项", "clues": ["DGL", "bet", "GTO"], "a": ["本视频是DGL系列（#93）中的一集，聚焦于翻前3-bet底池的翻后策略，属于中级到高级玩家适用的内容。视频承接了系列中关于“位置优势”和“范围构建”的讨论，将理论落实到具体的牌型类别（低踢脚A高张）和具体频率（80%/64%）。建议玩家结合GTO求解器自行验证，并注意该策略适用于“无听牌”的纯粹A高张场景，若手牌带有后门同花听牌或顺子听牌，下注频率可能有所调整。", "**行动项与常见错误：**", "- 应该做：在3-bet底池、低牌面、有利位置跟注者场景下，手持低踢脚A高张（A2s-A8s）且无听牌时，翻牌圈面对过牌应高频下注（约80%）。", "- 应该做：翻牌圈下注被跟注后，转牌圈应继续下注（约64%频率），保持多街诈唬压力。", "- 不要做：不要因为A高张“只有高张权益”而选择过牌或只下注一条街，这会削弱你的诈唬频率，使范围过于透明。", "- 不要做：不要用Broadway高张（如KQ、AJ）完全替代A高张作为诈唬牌，因为Broadway牌会阻挡对手的弃牌范围（对手可能弃掉KQ、QJ等），降低诈唬成功率。"], "note": ""}, {"id": "DGL#94-intro", "ep": "94", "type": "intro", "topic": "DGL#94 - 河牌圈玩法：在花面完成时用差阻挡牌诈唬", "en": "River Play Bluffing Bad Blockers on Flush Completing Runouts", "q": "DGL#94 - 河牌圈玩法：在花面完成时用差阻挡牌诈唬", "clues": ["DGL", "river", "flush blocker"], "a": ["本视频延续上一期DGL系列内容，聚焦于河牌圈（river）的诈唬决策，特别是当公共牌面完成同花时，是否必须持有同花阻挡牌（flush blocker）才能进行诈唬。讲师通过自己实战的一手牌（A♦3♦）引出话题，指出大多数玩家（包括讲师自己过去）存在一个常见误区：认为在花面完成的河牌上，没有同花阻挡牌就不应该诈唬。", "讲师利用GTO求解器数据证明这一观点是错误的。数据显示，在特定场景下，即使没有同花阻挡牌，用未成花的同花空气牌在河牌圈诈唬的频率依然高达43%-44%。视频还进一步分析了底池大小对诈唬频率的影响，指出底池越大，诈唬频率会略有下降，但核心结论不变：不应只依赖阻挡牌来决定是否诈唬。", "视频的核心教学价值在于帮助玩家建立更平衡、更难被剥削的河牌圈诈唬策略，避免因过度依赖阻挡牌而导致的诈唬不足（under-bluffing）问题。"], "note": ""}, {"id": "DGL#94-s0", "ep": "94", "type": "topic", "topic": "DGL#94 - 河牌圈玩法：在花面完成时用差阻挡牌诈唬", "en": "River Play Bluffing Bad Blockers on Flush Completing Runouts", "q": "回顾上一期：翻牌与转牌的低踢脚A高牌诈唬", "clues": ["A3o", "A4o", "A5o", "low boards"], "a": ["上一期视频讨论了用低踢脚A高牌（如A3o、A4o、A5o）在有利位置作为翻前跟注者进行多街诈唬的策略。", "在低牌面（low boards）上，翻牌圈（flop）应该用这类牌下注，频率高达80%（80% bucket）。", "如果翻牌圈被跟注，转牌圈（turn）继续下注（double barrel）的频率为60%。", "这些频率属于较高的诈唬频率，目的是在对手范围较弱时施加压力。"], "note": ""}, {"id": "DGL#94-s1", "ep": "94", "type": "topic", "topic": "DGL#94 - 河牌圈玩法：在花面完成时用差阻挡牌诈唬", "en": "River Play Bluffing Bad Blockers on Flush Completing Runouts", "q": "实战牌例：A♦3♦的河牌全下", "clues": ["check", "all-in"], "a": ["讲师分享的实战牌例：翻牌圈和转牌圈连续下注后，河牌发出6♥，对手过牌（check），讲师用A♦3♦选择全下（all-in）。", "这手牌在河牌圈并没有同花阻挡牌（A♦3♦不含任何红桃），但讲师仍然选择诈唬全下。", "讲师指出，这是一个典型的“没有阻挡牌也要诈唬”的场景，与大多数玩家的直觉相反。"], "note": ""}, {"id": "DGL#94-s2", "ep": "94", "type": "topic", "topic": "DGL#94 - 河牌圈玩法：在花面完成时用差阻挡牌诈唬", "en": "River Play Bluffing Bad Blockers on Flush Completing Runouts", "q": "常见误区：只凭阻挡牌决定诈唬", "clues": ["heuristic"], "a": ["大多数玩家（包括讲师过去）在花面完成的河牌上，倾向于只用同花阻挡牌（如A♥K♥、A♥Q♥等）进行诈唬。", "这种思路的出发点是合理的：有阻挡牌意味着对手更少可能持有同花，同时自身可能还有高张的摊牌价值。", "但问题在于，如果把这个启发式（heuristic）过度外推，就会得出“没有阻挡牌就绝对不能诈唬”的错误结论。", "讲师强调，这个启发式本身是正确的，但不应成为唯一决策依据。"], "note": ""}, {"id": "DGL#94-s3", "ep": "94", "type": "topic", "topic": "DGL#94 - 河牌圈玩法：在花面完成时用差阻挡牌诈唬", "en": "River Play Bluffing Bad Blockers on Flush Completing Runouts", "q": "GTO数据：无阻挡牌时的诈唬频率", "clues": ["GTO", "suited air", "split", "A4s"], "a": ["讲师使用GTO求解器历史数据，筛选出特定场景：转牌圈下注被跟注后，河牌发出第三张同花牌，自己持有未成花的同花空气牌（suited air）。", "筛选结果显示，在这种场景下，即使没有同花阻挡牌，河牌圈的下注（诈唬）频率为43%（数据加载后显示43%）。", "具体到A♦3♦这手牌，GTO给出的策略是50-50的混合策略（50-50 split），即约一半频率下注、一半频率过牌。", "此外，A4s、A5s等类似牌型也被GTO纳入诈唬范围，进一步证明无阻挡牌诈唬的合理性。"], "note": ""}, {"id": "DGL#94-s4", "ep": "94", "type": "topic", "topic": "DGL#94 - 河牌圈玩法：在花面完成时用差阻挡牌诈唬", "en": "River Play Bluffing Bad Blockers on Flush Completing Runouts", "q": "底池大小对诈唬频率的影响", "clues": ["35BB", "43%", "41%"], "a": ["讲师进一步筛选了底池大小因素，因为底池大小会显著影响范围紧度和诈唬频率。", "当河牌圈底池达到35BB或更高时，无阻挡牌诈唬的下注频率从43%降至41%。", "底池越大，范围越紧，阻挡牌的效果越显著，因此无阻挡牌的诈唬手牌在诈唬范围中的占比会降低。", "但即使如此，41%的频率仍然相当可观，说明无阻挡牌诈唬始终是策略中不可忽视的一部分。"], "note": ""}, {"id": "DGL#94-s5", "ep": "94", "type": "topic", "topic": "DGL#94 - 河牌圈玩法：在花面完成时用差阻挡牌诈唬", "en": "River Play Bluffing Bad Blockers on Flush Completing Runouts", "q": "核心结论：花面完成时不应只诈唬阻挡牌", "clues": ["less exploitable", "under-bluffing"], "a": ["视频的核心结论：即使河牌完成了同花，也不应只依赖同花阻挡牌来决定诈唬。", "正确的做法是：无阻挡牌的同花空气牌在河牌圈应保持约40-60的诈唬-过牌比例（具体为40/60或43/57）。", "这种策略能让你的打法更难被剥削（less exploitable），因为对手如果假设你在花面完成时只会用阻挡牌诈唬，就会对你的过牌范围过度信任。", "只依赖阻挡牌诈唬会导致系统性诈唬不足（under-bluffing），让对手可以轻松弃牌并获利。"], "note": ""}, {"id": "DGL#94-c0", "ep": "94", "type": "cloze", "topic": "DGL#94 - 河牌圈玩法：在花面完成时用差阻挡牌诈唬", "en": "River Play Bluffing Bad Blockers on Flush Completing Runouts", "q": "翻牌圈（flop）应该用这类牌下注，频率高达＿＿（80% bucket）。", "clues": [], "a": ["在低牌面（low boards）上，翻牌圈（flop）应该用这类牌下注，频率高达80%（80% bucket）。"], "note": "80%"}, {"id": "DGL#94-c3", "ep": "94", "type": "cloze", "topic": "DGL#94 - 河牌圈玩法：在花面完成时用差阻挡牌诈唬", "en": "River Play Bluffing Bad Blockers on Flush Completing Runouts", "q": "河牌圈的下注（诈唬）频率为＿＿（数据加载后显示43%）。", "clues": [], "a": ["筛选结果显示，在这种场景下，即使没有同花阻挡牌，河牌圈的下注（诈唬）频率为43%（数据加载后显示43%）。"], "note": "43%"}, {"id": "DGL#94-c4", "ep": "94", "type": "cloze", "topic": "DGL#94 - 河牌圈玩法：在花面完成时用差阻挡牌诈唬", "en": "River Play Bluffing Bad Blockers on Flush Completing Runouts", "q": "当河牌圈底池达到＿＿或更高时，无阻挡牌诈唬的下注频率从43%降至41%。", "clues": [], "a": ["当河牌圈底池达到35BB或更高时，无阻挡牌诈唬的下注频率从43%降至41%。"], "note": "35BB"}, {"id": "DGL#94-note", "ep": "94", "type": "note", "topic": "DGL#94 - 河牌圈玩法：在花面完成时用差阻挡牌诈唬", "en": "River Play Bluffing Bad Blockers on Flush Completing Runouts", "q": "避坑提醒与行动项", "clues": ["DGL", "GTO", "A4s"], "a": ["本视频是DGL系列第94期，承接上一期关于低踢脚A高牌多街诈唬的内容，将讨论延伸到河牌圈。讲师通过GTO数据与实战牌例结合的方式，打破了“花面完成必须持阻挡牌才能诈唬”的常见思维定式，为玩家提供了更精细的河牌圈决策框架。建议结合上一期视频学习，形成完整的“翻牌-转牌-河牌”三街诈唬策略体系。", "值得进一步学习的方向包括：不同公共牌结构（如对子牌面、顺子完成面）下的河牌诈唬频率差异，以及如何根据对手类型调整这些GTO基准频率。", "**行动项与常见错误：**", "- 应该做：在花面完成的河牌上，即使没有同花阻挡牌，也要保留一定频率的诈唬（约40-60比例）。", "- 应该做：用A4s、A5s等无阻挡牌的同花空气牌混合诈唬与过牌，避免策略单一化。", "- 不要做：不要因为自己没有同花阻挡牌就自动放弃河牌诈唬。", "- 不要做：不要只依赖“有阻挡牌才诈唬”的启发式，否则会沦为可预测的玩家。"], "note": ""}, {"id": "DGL#95-intro", "ep": "95", "type": "intro", "topic": "DGL#95 - 翻前加注者单次加注底池中，小盲对盲注位翻牌圈持续下注后转牌圈的双重下注尺度拆分策略", "en": "PFR SRP OOP Double Barreling SB vs BB - Splitting Sizes", "q": "DGL#95 - 翻前加注者单次加注底池中，小盲对盲注位翻牌圈持续下注后转牌圈的双重下注尺度拆分策略", "clues": [], "a": ["本视频围绕一个具体牌例展开，讨论在翻牌圈和转牌圈通常建议采用单一固定下注尺度策略的前提下，何时以及如何合理地拆分转牌圈的下注尺度。讲师强调，单一尺度策略能保持策略稳定且易于执行，但在某些特定牌面结构下，拆分尺度能显著提升整体期望值。", "视频核心观点是：当你的范围中存在两个规模庞大且性质截然不同的价值牌区域时，就有必要拆分下注尺度。讲师以自己手持K9s在小盲位对抗大盲位对手的牌局为例，展示了在Q-J-T彩虹翻牌面转牌发出T♣后，由于翻前加注者拥有全部AK组合而对手没有，形成了巨大的坚果优势，因此需要同时使用超池下注和小尺度下注来覆盖不同强度的价值牌。", "视频重点讲解了拆分尺度时的核心原则：必须将坚果牌分配到两个下注尺度中，以避免小尺度下注范围被封顶而变得易被剥削。讲师给出了具体的频率分配方法，如80-20下注-过牌比例下，将坚果牌40%放入大尺度、40%放入小尺度、20%过牌，以此实现范围的平衡。"], "note": ""}, {"id": "DGL#95-s0", "ep": "95", "type": "topic", "topic": "DGL#95 - 翻前加注者单次加注底池中，小盲对盲注位翻牌圈持续下注后转牌圈的双重下注尺度拆分策略", "en": "PFR SRP OOP Double Barreling SB vs BB - Splitting Sizes", "q": "单一尺度策略的默认原则", "clues": [], "a": ["讲师在社区中通常推荐在翻牌圈和转牌圈使用单一固定下注尺度策略，这能保持策略稳定、易于执行。", "采用单一尺度策略时，通过专注于每条街只使用一个下注尺度，可以达成非常低的能力要求策略，适合大多数玩家执行。", "但这一默认原则存在例外情况，本视频正是讨论这些例外何时出现以及如何应对。"], "note": ""}, {"id": "DGL#95-s1", "ep": "95", "type": "topic", "topic": "DGL#95 - 翻前加注者单次加注底池中，小盲对盲注位翻牌圈持续下注后转牌圈的双重下注尺度拆分策略", "en": "PFR SRP OOP Double Barreling SB vs BB - Splitting Sizes", "q": "牌例背景与翻牌圈行动", "clues": ["K9s"], "a": ["讲师在小盲位手持K9s（同花K9）开局加注，对手是常规玩家，在大盲位跟注。", "翻牌面为Q♠J♥3♦（彩虹面），这是一个非常干燥的高牌结构，对翻前加注者极为有利。", "讲师选择高频小额持续下注，这是该牌面下正确的策略，因为干燥高牌面显著偏向翻前加注者的范围。", "对手跟注后，转牌发出T♣。"], "note": ""}, {"id": "DGL#95-s2", "ep": "95", "type": "topic", "topic": "DGL#95 - 翻前加注者单次加注底池中，小盲对盲注位翻牌圈持续下注后转牌圈的双重下注尺度拆分策略", "en": "PFR SRP OOP Double Barreling SB vs BB - Splitting Sizes", "q": "转牌圈范围优势分析", "clues": [], "a": ["T♣是一张显而易见的牌，所有人都能认识到翻前加注者在单次加注底池中拥有巨大优势。", "当牌面运行到Q-J-T时，翻前加注者拥有全部AK组合，而对手没有任何AK组合，这是关键的不对称优势。", "由于这种坚果分布的不对称，翻前加注者的范围应该发展出超池下注尺度，因为可以利用对手缺乏坚果牌的劣势。", "翻前加注者可以投入大量筹码到底池，同时仍能保持对抗跟注范围的权益，因为对手必须用一些抓诈牌来跟注。", "在暗三条区域同样有显著优势：翻前加注者拥有全部QQ、JJ和TT，而对手只有口袋对子33这一种暗三条组合。"], "note": ""}, {"id": "DGL#95-s3", "ep": "95", "type": "topic", "topic": "DGL#95 - 翻前加注者单次加注底池中，小盲对盲注位翻牌圈持续下注后转牌圈的双重下注尺度拆分策略", "en": "PFR SRP OOP Double Barreling SB vs BB - Splitting Sizes", "q": "拆分尺度的必要性", "clues": ["K9o"], "a": ["如果只采用超池下注或过牌的二选一策略，会错过用一些真正想投入底池的牌下注的机会。", "只关注超池下注或过牌时，范围中有一大部分牌会缺乏攻击性，被迫过牌或以极低频率下注。", "这些被忽视的牌包括所有顶对，例如顶对在这张牌面上仍然非常强，因为对手没有Q、J、T或AK。", "顶对可以从对手的JJ、T-x以及随机K高牌中获得价值，这些牌对手在此时会持有。", "范围中还有一些两对组合，虽然很强，但如果超池下注可能无法保留足够权益，因为对手仍有K9o和89o等顺子组合。", "因此，范围中明显存在两个不同的价值牌区域：暗三条和顺子为一组，两对和顶对为另一组，这两组牌需要不同的下注尺度。"], "note": ""}, {"id": "DGL#95-s4", "ep": "95", "type": "topic", "topic": "DGL#95 - 翻前加注者单次加注底池中，小盲对盲注位翻牌圈持续下注后转牌圈的双重下注尺度拆分策略", "en": "PFR SRP OOP Double Barreling SB vs BB - Splitting Sizes", "q": "拆分尺度的适用条件", "clues": [], "a": ["当范围中存在两个规模庞大且显著不同的价值牌区域时，就应该拆分下注尺度以最大化策略的期望值。", "这两个区域必须是大规模区域，因为如果某个区域很小，就不值得为它增加另一个下注尺度——即使小区域能获得一点期望值，在整体策略中也无关紧要。", "如果两个区域都很大，且一个区域因尺度下调而损失大量期望值、另一个区域因尺度上调而损失大量期望值，这就是必须拆分尺度的情形。", "在本牌例中，讲师会为顶对区域使用一个小尺度，为暗三条和顺子区域使用一个大尺度，同时将部分两对也放入大尺度区域。"], "note": ""}, {"id": "DGL#95-s5", "ep": "95", "type": "topic", "topic": "DGL#95 - 翻前加注者单次加注底池中，小盲对盲注位翻牌圈持续下注后转牌圈的双重下注尺度拆分策略", "en": "PFR SRP OOP Double Barreling SB vs BB - Splitting Sizes", "q": "GTO范围的构建方式", "clues": ["GTO"], "a": ["通过GTO求解器可以看到，该范围确实构建了一个小尺度下注和一个大尺度下注，与讲师描述完全一致。", "暗三条和顺子被大量放入大尺度下注，并配以适当的诈唬进行平衡。", "顶对、部分两对（如QJ、JT）被放入小尺度下注，同时顶对、第二对甚至第三对也进入小尺度范围。", "小尺度下注用低权益诈唬平衡，例如A-x卡顺听牌、8-x卡顺听牌。", "两个不同的价值牌区域清晰可见，大尺度围绕超强价值牌构建，小尺度围绕中等价值牌构建。"], "note": ""}, {"id": "DGL#95-s6", "ep": "95", "type": "topic", "topic": "DGL#95 - 翻前加注者单次加注底池中，小盲对盲注位翻牌圈持续下注后转牌圈的双重下注尺度拆分策略", "en": "PFR SRP OOP Double Barreling SB vs BB - Splitting Sizes", "q": "平衡范围的核心原则", "clues": [], "a": ["不能简单地将暗三条及以上牌力用大尺度下注、顶对及更差牌力用小尺度下注，这会使策略极易被剥削。", "对手可以针对大尺度下注过度弃牌，同时针对小尺度下注过度加注和过度跟注。", "小尺度下注范围绝对不能封顶，这是拆分尺度策略中最重要的一点。", "必须将坚果牌也放入另一个下注尺度中，即不能所有好牌都用大尺度下注，否则小尺度下注范围就封顶了。", "如果小尺度下注范围封顶，对手会开始加注和诈唬，导致这些小尺度下注的牌期望值下降。", "当对手开始加注和过度跟注小尺度下注时，用小尺度下注其他牌的价值反而会增加，这是一个平衡过程。", "最终会达到一个无差别阈值：坚果牌无论用大尺度还是小尺度下注，赚到的钱相同。"], "note": ""}, {"id": "DGL#95-s7", "ep": "95", "type": "topic", "topic": "DGL#95 - 翻前加注者单次加注底池中，小盲对盲注位翻牌圈持续下注后转牌圈的双重下注尺度拆分策略", "en": "PFR SRP OOP Double Barreling SB vs BB - Splitting Sizes", "q": "坚果牌的频率分配方法", "clues": ["80%", "40%", "20%"], "a": ["拆分尺度策略中最重要的一点是：将坚果牌分配到两个下注尺度中，且只建议分配两个尺度，不建议平衡三个范围。", "以80-20的下注-过牌比例为例，通常几乎所有行动线中两对及以上牌力都放入80%的下注频率桶中。", "将坚果牌在两个尺度间平均分配是最简单的平衡方法：80%下注中，40%放入大尺度、40%放入小尺度，剩余20%过牌。", "这样构建的范围非常平衡，因为范围平衡最重要的是包含坚果牌——一个范围如果没有坚果牌，就是最不平衡的状态。", "只要确保坚果牌被拆分到两个尺度中，就能大幅降低策略的可剥削性。", "当然还需要拆分诈唬牌，但这是另一个视频的主题，首要任务是拆分坚果牌。"], "note": ""}, {"id": "DGL#95-s8", "ep": "95", "type": "topic", "topic": "DGL#95 - 翻前加注者单次加注底池中，小盲对盲注位翻牌圈持续下注后转牌圈的双重下注尺度拆分策略", "en": "PFR SRP OOP Double Barreling SB vs BB - Splitting Sizes", "q": "不同下注频率下的分配示例", "clues": ["60%", "40%", "30%"], "a": ["如果采用60-40的下注-过牌比例，即60%坚果牌下注、40%过牌，则需要将60%拆分为两个尺度，可以各30%。", "也可以根据范围大小感觉调整，例如某个范围明显大于另一个时，可以按40-20分配，加上40%过牌。", "通常来说，平均分配是最简单的做法：60-40下注-过牌比例下，30%大尺度、30%小尺度、40%过牌，就能构建出合理平衡的双尺度策略。", "讲师承认在实战中精确做到这一点很难，但目标是达成合理策略，而非完美策略，避免出现“大尺度全是坚果、小尺度没有坚果”的暴露性问题。"], "note": ""}, {"id": "DGL#95-c7", "ep": "95", "type": "cloze", "topic": "DGL#95 - 翻前加注者单次加注底池中，小盲对盲注位翻牌圈持续下注后转牌圈的双重下注尺度拆分策略", "en": "PFR SRP OOP Double Barreling SB vs BB - Splitting Sizes", "q": "通常几乎所有行动线中两对及以上牌力都放入＿＿的下注频率桶中。", "clues": [], "a": ["以80-20的下注-过牌比例为例，通常几乎所有行动线中两对及以上牌力都放入80%的下注频率桶中。"], "note": "80%"}, {"id": "DGL#95-c8", "ep": "95", "type": "cloze", "topic": "DGL#95 - 翻前加注者单次加注底池中，小盲对盲注位翻牌圈持续下注后转牌圈的双重下注尺度拆分策略", "en": "PFR SRP OOP Double Barreling SB vs BB - Splitting Sizes", "q": "即＿＿坚果牌下注、40%过牌，则需要将60%拆分为两个尺度，", "clues": [], "a": ["如果采用60-40的下注-过牌比例，即60%坚果牌下注、40%过牌，则需要将60%拆分为两个尺度，可以各30%。"], "note": "60%"}, {"id": "DGL#95-note", "ep": "95", "type": "note", "topic": "DGL#95 - 翻前加注者单次加注底池中，小盲对盲注位翻牌圈持续下注后转牌圈的双重下注尺度拆分策略", "en": "PFR SRP OOP Double Barreling SB vs BB - Splitting Sizes", "q": "避坑提醒与行动项", "clues": ["DGL", "GTO", "80%"], "a": ["本视频是DGL系列第95期，承接了GTO蓝图课程中关于两对及以上牌力在转牌圈通常以80%频率下注的通用原则，并将其应用于双尺度拆分的具体场景。视频重点解决了“何时拆分尺度”和“如何平衡双尺度范围”两个核心问题，为玩家在类似高坚果优势牌面上构建更精细、更难被剥削的策略提供了实用框架。", "值得进一步学习的方向包括：诈唬牌如何在两个尺度间分配、不同对手类型下如何调整分配比例、以及河牌圈在类似结构下是否适用相同的拆分逻辑。", "**行动项与常见错误：**", "- 应当做：当范围中存在两个大规模且性质不同的价值牌区域时，主动拆分转牌圈下注尺度。", "- 应当做：将坚果牌按约50-50比例分配到两个下注尺度中，确保小尺度下注范围不封顶。", "- 应当做：在80-20下注-过牌比例下，按40%大尺度、40%小尺度、20%过牌分配坚果牌。", "- 不要做：将所有坚果牌都放入大尺度下注，导致小尺度下注范围封顶、被对手加注剥削。", "- 不要做：尝试平衡三个下注尺度，两个尺度已经足够且更易执行。"], "note": ""}, {"id": "DGL#96-intro", "ep": "96", "type": "intro", "topic": "DGL#96 - 翻前3-bet底池中，翻牌圈作为翻前跟注者在有利位置面对过牌加注时的防守门槛手牌", "en": "PFC 3BP IP Facing Flop XR", "q": "DGL#96 - 翻前3-bet底池中，翻牌圈作为翻前跟注者在有利位置面对过牌加注时的防守门槛手牌", "clues": ["bet", "check-raise", "gut shot"], "a": ["本视频围绕一个具体牌局展开：翻前3-bet底池中，作为翻前跟注者在有利位置（IP）面对对手翻牌圈过牌加注（check-raise）时的防守决策。讲师以自己实战中一手用卡顺（gut shot）跟注过牌加注的牌局为引子，重点讨论了一个被广泛忽视的关键问题——玩家在此类局面中普遍存在严重过度弃牌（over-fold）的漏洞。", "讲师通过GTO数据库中的翻牌手牌报告，系统展示了不同牌型类别在翻牌圈面对小尺度下注后被中等尺度过牌加注时的最优频率。核心结论是：口袋对子（特别是低对）通常以50-50左右的比例混合跟注和弃牌；卡顺听牌和同花听牌几乎从不弃牌；而真正的分界线在于高牌（overcards）——无后门听牌的高牌大多弃牌，带后门听牌的高牌则混合跟注，高踢脚A高牌（如AK、AQ、AJ）则接近总是跟注。", "讲师特别强调，普通玩家在此类局面中的过度弃牌幅度远超理论最优，且没有任何理由这样做。相反，由于对手在后续街存在大量剥削性漏洞，玩家反而应该倾向于过度跟注（over-call）。视频通过多个具体翻牌面（J-3-2彩虹、T-6-3彩虹、Q-4-3彩虹）给出了精确的跟注门槛手牌清单，帮助玩家建立实用的防守基准。"], "note": ""}, {"id": "DGL#96-s0", "ep": "96", "type": "topic", "topic": "DGL#96 - 翻前3-bet底池中，翻牌圈作为翻前跟注者在有利位置面对过牌加注时的防守门槛手牌", "en": "PFC 3BP IP Facing Flop XR", "q": "视频背景与核心问题", "clues": ["bet", "threshold hands", "huge leak of", "population"], "a": ["本视频源于讲师近期打的一手牌：翻前3-bet底池，翻牌圈作为翻前跟注者在有利位置面对过牌加注，用卡顺听牌跟注。这手牌本身决策简单直接，但讲师以此为背景，引出更重要的教学主题——面对翻牌圈过牌加注时的门槛手牌（threshold hands）识别。", "核心问题：在3-bet底池、有利位置、翻前跟注者的身份下，面对翻牌圈过牌加注，哪些手牌是必须防守的底线？普通玩家在此类局面中普遍存在严重过度弃牌，这是人群中一个巨大的漏洞（huge leak of population）。", "讲师明确表示：相对于GTO理论，普通常客玩家在此类局面中的过度弃牌幅度非常大，而且没有任何合理理由支持这种过度弃牌。事实上，讲师甚至认为由于对手在后续街存在大量策略漏洞，玩家反而应该倾向于过度跟注而非过度弃牌。"], "note": ""}, {"id": "DGL#96-s1", "ep": "96", "type": "topic", "topic": "DGL#96 - 翻前3-bet底池中，翻牌圈作为翻前跟注者在有利位置面对过牌加注时的防守门槛手牌", "en": "PFC 3BP IP Facing Flop XR", "q": "GTO数据库分析：不同牌型的防守频率", "clues": ["GTO", "stab", "flop hand report", "draws"], "a": ["讲师使用GTO手牌历史数据库，筛选出特定场景：翻牌圈对手过牌，我们小尺度下注（stab），对手以中等尺度过牌加注。通过翻牌手牌报告（flop hand report），按牌型类别查看不同手牌的频率。", "关键发现：一旦进入听牌类别（draws），例如卡顺听牌、同花听牌，这些手牌几乎从不弃牌（never folding）。这是防守的最低底线。", "在听牌之上，存在一个门槛手牌区域（threshold hands region）：低对（low pockets）混合跟注和弃牌；高牌（overcards）是真正的分界线所在。", "高牌中，完全没有后门听牌的高牌有时也会跟注，但大多数情况下，带后门听牌的高牌才是防守的分界线。具体数据：KQ、KJ、QJ这类高牌呈现30-70的跟注-弃牌比例（call 30% fold 70%）；A高牌（Ace Highs）遵循同样的启发式规则，也是30%跟注、70%弃牌。", "但AK、AQ、AJ这类高踢脚A高牌则完全反转：变成70%跟注、30%弃牌。讲师指出，如果玩家想要保持平衡（balanced），就必须用这个区域的手牌进行跟注防守，这在实践中极其困难但极为重要。"], "note": ""}, {"id": "DGL#96-s2", "ep": "96", "type": "topic", "topic": "DGL#96 - 翻前3-bet底池中，翻牌圈作为翻前跟注者在有利位置面对过牌加注时的防守门槛手牌", "en": "PFC 3BP IP Facing Flop XR", "q": "翻牌面一：J-3-2彩虹面", "clues": ["Jack three deuce", "rainbow", "quarter pot", "raise"], "a": ["具体场景：翻牌面J-3-2彩虹（Jack three deuce rainbow），我们下注1/4底池（quarter pot），对手过牌加注到3.5倍我们的下注（3.5x raise）。我们下注5.5BB，对手加注到19BB。", "防守要求：KTs（同花KT）带后门同花听牌时，必须总是跟注（call all the time）；甚至KTs的碎片组合（shreds of King 10 of clubs）也要跟注。", "Q9s（同花Q9）应该是60-40的跟注-弃注比例（60% call 40% fold）；K9s（同花K9）应该是40-60的比例（40% call 60% fold）；A9s（同花A9）应该跟注80%的时间。", "KQo（非同花KQ）应该非常频繁地跟注，特别是当手中有草花（club）时；即使没有草花，也应该有40%的跟注频率。", "总结：在这个翻牌面上，防守分界线通常画在K高牌和A高牌手牌上。这是玩家通常需要划定底线的地方。"], "note": ""}, {"id": "DGL#96-s3", "ep": "96", "type": "topic", "topic": "DGL#96 - 翻前3-bet底池中，翻牌圈作为翻前跟注者在有利位置面对过牌加注时的防守门槛手牌", "en": "PFC 3BP IP Facing Flop XR", "q": "翻牌面二：T-6-3彩虹面", "clues": ["high board 10", "rainbow", "Solver", "KJs"], "a": ["具体场景：翻牌面T-6-3彩虹（10 high board 10, 6, 3 rainbow），对手有时会过牌，我们小尺度下注后，对手进行过牌加注。此局面中Solver选择更大的过牌加注尺度——30BB的过牌加注。", "即使面对30BB的大尺度过牌加注（我们下注5BB，对手加注到30BB），防守要求依然很高：KJs（同花KJ）必须跟注；QJs（同花QJ）几乎一半时间（almost half the time）要跟注；KJo（非同花KJ）约34%的时间要跟注；AJo（非同花AJ）也要跟注。", "低对在此类翻牌面上呈现50-50的跟注-弃牌比例（50-50 split），而高牌则呈现70-30的比例（70%弃牌、30%跟注）。", "例外情况：高踢脚A高牌（high kicker ace highs）通常不会过多弃牌——AQ总是跟注（always calling），AK也几乎总是跟注。这是防守的重要底线。"], "note": ""}, {"id": "DGL#96-s4", "ep": "96", "type": "topic", "topic": "DGL#96 - 翻前3-bet底池中，翻牌圈作为翻前跟注者在有利位置面对过牌加注时的防守门槛手牌", "en": "PFC 3BP IP Facing Flop XR", "q": "翻牌面三：Q-4-3彩虹面（干燥Q高翻牌面）", "clues": ["Queen four three", "rainbow", "K8s", "KJo"], "a": ["具体场景：翻牌面Q-4-3彩虹（Queen four three rainbow），对手会以半底池频率过牌（half potter check），我们小尺度下注后，对手以中等尺度过牌加注。", "防守分界线：K8s（同花K8）是分界线所在。所有KJ、KT、K9都跟注；部分KJo（非同花KJ）带草花时跟注；部分AJo（非同花AJ）带草花时跟注。", "面对中等尺度过牌加注（我们下注1/4底池，对手加注到3.5-4倍），防守分界线精确地画在带某种后门听牌的A高牌和K高牌上。这些手牌的特点是：一张高牌（overcard）加后门顺子听牌，或一张高牌加后门同花听牌。", "具体数据：所有带后门同花听牌的A高牌都必须跟注——A7s（同花A7）带后门同花听牌、A8s（同花A8）带后门同花听牌、A9s（同花A9）带后门同花听牌，这些手牌面对过牌加注时都不能弃牌。", "讲师强调：这正是该局面被大规模过度弃牌的原因——如果使用中等过牌加注尺度，几乎没有人能正确游戏这些手牌，所有人都会过度弃掉整个区域。例如，JTs（同花JT）带后门同花听牌面对过牌加注时，应该有40%的跟注频率。"], "note": ""}, {"id": "DGL#96-s5", "ep": "96", "type": "topic", "topic": "DGL#96 - 翻前3-bet底池中，翻牌圈作为翻前跟注者在有利位置面对过牌加注时的防守门槛手牌", "en": "PFC 3BP IP Facing Flop XR", "q": "核心结论与行动指南", "clues": ["ace high weak", "king high", "queen high", "high kickers"], "a": ["如果不想成为过度弃牌的那个人（再次强调，你不应该过度弃牌，因为当今玩家已经找到了合适的过牌加注频率，且他们在后续街存在漏洞，反而激励你过度跟注），就必须掌握正确的防守门槛。", "具体而言，你需要做到：用弱踢脚A高牌（ace high weak kickers）以30%的频率跟注；用K高牌、Q高牌中的高踢脚牌型（king high, queen high, high kickers）以30%的频率跟注；高踢脚A高牌（high kicker ace highs）则以70-30的比例更多跟注。", "这些频率要求在实践中极难执行，但正是区分优秀玩家与普通玩家的关键所在。讲师总结道：这就是本视频的全部内容，期待下个视频再见。"], "note": ""}, {"id": "DGL#96-c1", "ep": "96", "type": "cloze", "topic": "DGL#96 - 翻前3-bet底池中，翻牌圈作为翻前跟注者在有利位置面对过牌加注时的防守门槛手牌", "en": "PFC 3BP IP Facing Flop XR", "q": "具体数据：KQ、KJ、QJ这类高牌呈现30-70的跟注-弃牌比例（call ＿＿ fold 70%）；", "clues": [], "a": ["高牌中，完全没有后门听牌的高牌有时也会跟注，但大多数情况下，带后门听牌的高牌才是防守的分界线。具体数据：KQ、KJ、QJ这类高牌呈现30-70的跟注-弃牌比例（call 30% fold 70%）；A高牌（Ace Highs）遵循同样的启发式规则，也是30%跟注、70%弃牌。"], "note": "30%"}, {"id": "DGL#96-c2", "ep": "96", "type": "cloze", "topic": "DGL#96 - 翻前3-bet底池中，翻牌圈作为翻前跟注者在有利位置面对过牌加注时的防守门槛手牌", "en": "PFC 3BP IP Facing Flop XR", "q": "对手过牌加注到3.5倍我们的下注（3.5x raise）。我们下注＿＿，对手加注到19BB。", "clues": [], "a": ["具体场景：翻牌面J-3-2彩虹（Jack three deuce rainbow），我们下注1/4底池（quarter pot），对手过牌加注到3.5倍我们的下注（3.5x raise）。我们下注5.5BB，对手加注到19BB。"], "note": "5.5BB"}, {"id": "DGL#96-c3", "ep": "96", "type": "cloze", "topic": "DGL#96 - 翻前3-bet底池中，翻牌圈作为翻前跟注者在有利位置面对过牌加注时的防守门槛手牌", "en": "PFC 3BP IP Facing Flop XR", "q": "此局面中Solver选择更大的过牌加注尺度——＿＿的过牌加注。", "clues": [], "a": ["具体场景：翻牌面T-6-3彩虹（10 high board 10, 6, 3 rainbow），对手有时会过牌，我们小尺度下注后，对手进行过牌加注。此局面中Solver选择更大的过牌加注尺度——30BB的过牌加注。"], "note": "30BB"}, {"id": "DGL#96-note", "ep": "96", "type": "note", "topic": "DGL#96 - 翻前3-bet底池中，翻牌圈作为翻前跟注者在有利位置面对过牌加注时的防守门槛手牌", "en": "PFC 3BP IP Facing Flop XR", "q": "避坑提醒与行动项", "clues": ["DGL", "Daily Game Lab", "bet"], "a": ["本视频属于DGL（Daily Game Lab）系列第96期，聚焦于翻前3-bet底池中翻牌圈面对过牌加注的防守策略。视频以具体牌局为引子，结合GTO数据库的量化分析，为玩家提供了清晰的防守门槛手牌清单。讲师特别强调，普通玩家在此类局面中的过度弃牌是一个巨大的系统性漏洞，而正确的做法恰恰相反——由于对手在后续街存在大量可剥削的漏洞，玩家反而应该倾向于过度跟注。", "值得进一步学习的方向包括：不同翻牌面结构（如连张面、同花面）对防守门槛的具体影响；转牌和河牌圈面对持续攻击时的后续防守策略；以及如何根据对手的过牌加注尺度（小尺度vs大尺度）动态调整自己的防守范围。此外，讲师提到的“对手在后续街的漏洞激励我们过度跟注”这一观点，值得通过具体牌局复盘来深入验证。", "- 应该这样做：面对翻牌圈过牌加注时，用带后门听牌的高牌（如A高、K高）积极跟注防守；用低对以50-50比例混合跟注；用卡顺听牌和同花听牌坚决跟注；高踢脚A高牌（AK、AQ、AJ）接近总是跟注。", "- 不要这样做：不要因为面对过牌加注感到不适就轻易弃掉带后门听牌的高牌；不要过度弃牌——普通玩家在此类局面中的过度弃牌幅度远超理论最优，且没有任何合理理由支持这种做法。"], "note": ""}, {"id": "DGL#97-intro", "ep": "97", "type": "intro", "topic": "DGL#97：翻前3-bet底池中，有利位置面对双重下注时如何游戏顶对", "en": "PFC 3BP IP Shoving Top Pairs Facing Double Barrel", "q": "DGL#97：翻前3-bet底池中，有利位置面对双重下注时如何游戏顶对", "clues": ["bet", "double barrel", "BTN"], "a": ["本视频聚焦于翻前3-bet底池中，作为翻前跟注者在有利位置面对对手翻牌圈和转牌圈连续下注（double barrel）时，如何游戏顶对区域。讲师通过一手实战牌例（BTN位AQs对抗BB位3-bet）引出这一主题，并指出这是许多玩家在实战中容易忽略的理论要点。", "视频核心观点是：在翻牌面为J高或更低牌面时，面对对手半池+半池的下注线路，顶对区域应该以非常高的频率进行加注（甚至全下），而非简单地跟注。讲师通过GTO solver数据展示了这一结论，并解释了背后的逻辑——通过加注迫使对手弃掉大量高张（如AK、AQ、KQ），从而剥夺这些牌的权益，同时避免在河牌支付这些牌的成牌价值。", "视频还对比了不同牌面结构下的策略差异：在低牌面（J高及以下）上顶对加注频率显著更高，而在A高牌面上则几乎不需要用顶对加注。这一启发式规则（heuristic）对玩家调整自身策略具有直接指导意义。"], "note": ""}, {"id": "DGL#97-s0", "ep": "97", "type": "topic", "topic": "DGL#97：翻前3-bet底池中，有利位置面对双重下注时如何游戏顶对", "en": "PFC 3BP IP Shoving Top Pairs Facing Double Barrel", "q": "实战牌例引入", "clues": ["AQs", "bet", "BTN vs BB", "half pot"], "a": ["讲师在BTN位用AQs（非同花AQ）开局加注，BB位3-bet，讲师跟注，形成BTN vs BB的3-bet底池。", "翻牌为J♠6♦4♣（彩虹面），BB位下注半池（half pot），讲师跟注。", "转牌为2♦，BB位再次下注半池。讲师指出，在这个牌面上，顶对区域应该大量加注甚至全下。", "讲师强调，本视频重点讨论理论启发式（theory heuristics），而非针对该手牌的具体剥削性调整（exploitative adjustments）。"], "note": ""}, {"id": "DGL#97-s1", "ep": "97", "type": "topic", "topic": "DGL#97：翻前3-bet底池中，有利位置面对双重下注时如何游戏顶对", "en": "PFC 3BP IP Shoving Top Pairs Facing Double Barrel", "q": "顶对区域的加注频率", "clues": ["solver", "J9s", "JTs", "pure jam"], "a": ["在J-6-4-2牌面上，面对半池+半池的下注线路，solver建议用J9s（同花J9）和JTs（同花JT）直接全下（pure jam）。", "全局统计数据：solver在该节点有11%的加注频率、33%的弃牌频率、56%的跟注频率。", "按牌型分类：超对（over pairs）加注频率很高，但顶对好踢脚（top pair good kicker）和顶对弱踢脚（top pair weak kicker）才是加注频率最高的区域。", "顶对出现的频率远高于超对：顶对区域有20,000个实例，而超对仅有3,000个实例，前者是后者的6倍以上。", "顶对弱踢脚有23%的加注频率，顶对好踢脚有37%的加注频率，且由于SPR（筹码底池比）较低，这些加注基本都是全下（all-in jam）。"], "note": ""}, {"id": "DGL#97-s2", "ep": "97", "type": "topic", "topic": "DGL#97：翻前3-bet底池中，有利位置面对双重下注时如何游戏顶对", "en": "PFC 3BP IP Shoving Top Pairs Facing Double Barrel", "q": "低牌面与高牌面的策略差异", "clues": ["over cards", "high", "54%", "50%"], "a": ["低牌面（包括J高牌面）上，顶对加注频率显著更高，因为牌面上仍存在大量高张（over cards）。", "在9-high及更低的牌面上，逻辑发生反转：顶对弱踢脚的加注频率（如54%）反而高于顶对好踢脚（如50%）。", "在10-high牌面上，顶对弱踢脚加注频率为54%，顶对好踢脚为50%，加注频率接近50%。", "在J-high牌面上，顶对好踢脚加注频率为42%，顶对弱踢脚为29%。", "在A-high牌面上，顶对好踢脚加注频率仅为20%，顶对弱踢脚几乎不加注，整体加注频率降至8.8%。"], "note": ""}, {"id": "DGL#97-s3", "ep": "97", "type": "topic", "topic": "DGL#97：翻前3-bet底池中，有利位置面对双重下注时如何游戏顶对", "en": "PFC 3BP IP Shoving Top Pairs Facing Double Barrel", "q": "加注的核心逻辑", "clues": ["deny equity", "SPR"], "a": ["用顶对（如JT、J9）加注的核心目的是迫使对手弃掉AK、AQ、KQ等高张组合，从而剥夺这些牌的权益（deny equity）。", "由于SPR较低，如果转牌不加注而让对手免费看河牌，一旦河牌发出K或Q，自己仍然需要跟注支付对手的成牌价值。", "通过转牌全下加注，可以迫使这些高张直接弃牌，避免在河牌支付它们。", "这一策略在低牌面上尤其有效，因为低牌面上对手范围中包含大量高张组合。"], "note": ""}, {"id": "DGL#97-s4", "ep": "97", "type": "topic", "topic": "DGL#97：翻前3-bet底池中，有利位置面对双重下注时如何游戏顶对", "en": "PFC 3BP IP Shoving Top Pairs Facing Double Barrel", "q": "常见误区与启发式规则", "clues": ["30%", "50%"], "a": ["讲师指出，大多数玩家在实战中可能严重低估了顶对区域的加注频率，尤其是在低牌面上。", "一个实用的启发式规则：在J高或更低的牌面上，面对翻牌圈和转牌圈半池+半池的下注线路，顶对区域应该有30%-50%的加注频率。", "在A高牌面上，顶对区域几乎不需要加注，因为对手范围中高张组合较少，加注的收益显著降低。"], "note": ""}, {"id": "DGL#97-c1", "ep": "97", "type": "cloze", "topic": "DGL#97：翻前3-bet底池中，有利位置面对双重下注时如何游戏顶对", "en": "PFC 3BP IP Shoving Top Pairs Facing Double Barrel", "q": "全局统计数据：solver在该节点有＿＿的加注频率、33%的弃牌频率、56%的跟注频率。", "clues": [], "a": ["全局统计数据：solver在该节点有11%的加注频率、33%的弃牌频率、56%的跟注频率。"], "note": "11%"}, {"id": "DGL#97-c2", "ep": "97", "type": "cloze", "topic": "DGL#97：翻前3-bet底池中，有利位置面对双重下注时如何游戏顶对", "en": "PFC 3BP IP Shoving Top Pairs Facing Double Barrel", "q": "逻辑发生反转：顶对弱踢脚的加注频率（如＿＿）反而高于顶对好踢脚（如50%）。", "clues": [], "a": ["在9-high及更低的牌面上，逻辑发生反转：顶对弱踢脚的加注频率（如54%）反而高于顶对好踢脚（如50%）。"], "note": "54%"}, {"id": "DGL#97-c4", "ep": "97", "type": "cloze", "topic": "DGL#97：翻前3-bet底池中，有利位置面对双重下注时如何游戏顶对", "en": "PFC 3BP IP Shoving Top Pairs Facing Double Barrel", "q": "面对翻牌圈和转牌圈半池+半池的下注线路，顶对区域应该有＿＿-50%的加注频率。", "clues": [], "a": ["一个实用的启发式规则：在J高或更低的牌面上，面对翻牌圈和转牌圈半池+半池的下注线路，顶对区域应该有30%-50%的加注频率。"], "note": "30%"}, {"id": "DGL#97-note", "ep": "97", "type": "note", "topic": "DGL#97：翻前3-bet底池中，有利位置面对双重下注时如何游戏顶对", "en": "PFC 3BP IP Shoving Top Pairs Facing Double Barrel", "q": "避坑提醒与行动项", "clues": ["DGL", "bet", "red line"], "a": ["本视频是DGL系列第97期，聚焦于翻前3-bet底池中有利位置顶对区域的策略。讲师提到，后续视频将讨论玩家在实际游戏中如何错误地游戏这一局面（red line），以及如何利用这些错误进行剥削性调整（over calling和over raising）。本视频提供的理论框架是后续剥削策略的基础。", "值得进一步学习的方向包括：不同下注尺度（如2/3 pot、满池）对顶对加注频率的影响、转牌SPR较高时的策略差异、以及如何在实战中识别对手过度弃牌或过度跟注的倾向并加以利用。", "**行动项与常见错误：**", "- 应该这样做：在J高或更低牌面、面对半池+半池下注线路时，用顶对（尤其是顶对弱踢脚）频繁加注甚至全下，频率应达到30%-50%。", "- 应该这样做：利用顶对加注迫使对手弃掉AK、AQ、KQ等高张，剥夺其权益。", "- 不要这样做：在A高牌面上用顶对加注，此时加注频率应显著降低（约20%或更低）。", "- 不要这样做：在低牌面上仅跟注顶对而不加注，这会错过剥夺对手高张权益的机会。"], "note": ""}, {"id": "DGL#98-intro", "ep": "98", "type": "intro", "topic": "DGL#98 - 单次加注底池翻前不利位：过牌-过牌-下注路线中的慢打平衡策略", "en": "PFC SRP OOP Slowplaying in the XC-X-B Line", "q": "DGL#98 - 单次加注底池翻前不利位：过牌-过牌-下注路线中的慢打平衡策略", "clues": ["BTN"], "a": ["本视频聚焦于德州扑克中最重要也最容易被剥削的路线之一：翻前加注者在大盲位（BB）对抗按钮位（BTN）进攻者，翻牌圈双方过牌后，转牌再次过牌，最终在河牌圈面对对手的过牌，大盲位如何平衡自己的过牌范围。讲师指出，绝大多数玩家在这一节点严重失衡，核心原因在于他们没有用足够多的强牌选择过牌，导致过牌范围过弱、过牌加注频率不足，以及过牌加注时诈唬比例过高。", "讲师基于一百万手单次加注底池（SRP）按钮位对大小盲的数据，给出了一个极其简洁且可操作的频率启发式规则：所有两对及以上的强牌（Two Pair Plus）应按照“60%下注、40%过牌”的比例分配，唯独暗三条（Set）例外，应按照“40%下注、60%过牌”执行。视频通过多个具体牌例和不同河牌牌面结构（如高牌面、低牌面、河牌A、河牌成花等）验证了这一规则的稳定性，并强调阻挡牌效应是导致暗三条更倾向于过牌的关键原因。"], "note": ""}, {"id": "DGL#98-s0", "ep": "98", "type": "topic", "topic": "DGL#98 - 单次加注底池翻前不利位：过牌-过牌-下注路线中的慢打平衡策略", "en": "PFC SRP OOP Slowplaying in the XC-X-B Line", "q": "过牌-过牌-下注路线的重要性", "clues": ["over bluffing", "capped range"], "a": ["该路线（翻前加注者在大盲位，翻牌和转牌均过牌，河牌面对对手过牌）是整场游戏中最关键的线路之一，因为作为大盲位的不利位置防守方，这种情况出现频率极高。", "绝大多数玩家在这一节点极度容易被剥削（super exploitable），原因在于他们无法正确平衡自己的过牌范围。", "作为有利位置的进攻方，可以针对对手的失衡进行系统性剥削：对手下注时往往过度诈唬（over bluffing），可以过度跟注；对手对加注过度弃牌，可以过度加注；对手过牌时范围被封顶（capped range），对攻击过度弃牌且过牌加注不足，可以用小尺寸做薄价值下注、用大尺寸诈唬；对手过牌加注时诈唬过多，可以过度跟注。", "所有这些剥削机会存在的根本原因，是玩家在过牌时没有放入足够多的强牌，导致过牌范围过弱、过牌加注频率不足、过牌加注范围中诈唬占比过高。"], "note": ""}, {"id": "DGL#98-s1", "ep": "98", "type": "topic", "topic": "DGL#98 - 单次加注底池翻前不利位：过牌-过牌-下注路线中的慢打平衡策略", "en": "PFC SRP OOP Slowplaying in the XC-X-B Line", "q": "全局频率：两对以上牌力60%下注40%过牌", "clues": ["SRP", "Two Pair Plus", "60%", "40%"], "a": ["基于一百万手单次加注底池（SRP）按钮位对大小盲的数据，过滤出河牌圈两对及以上牌力（Two Pair Plus）后，统计其下一动作（下注或过牌）。", "核心发现：坚果级别的强牌应放入“60%下注桶”——即60%的时间下注、40%的时间过牌。", "这意味着在对手翻牌过牌、转牌过牌（表明其牌力中等或偏弱）后，你仍然应该用40%的强牌选择过牌，而非全部下注。", "讲师强调：如果你知道应该用强牌如此被动地游戏，却仍然觉得不需要研究扑克，那就没有什么是值得研究的了——这一发现极具洞察力。"], "note": ""}, {"id": "DGL#98-s2", "ep": "98", "type": "topic", "topic": "DGL#98 - 单次加注底池翻前不利位：过牌-过牌-下注路线中的慢打平衡策略", "en": "PFC SRP OOP Slowplaying in the XC-X-B Line", "q": "具体牌例：河牌圈过牌加注的强牌", "clues": ["check-raise", "Q97", "A10", "check-call"], "a": ["牌例1：A9（河牌形成同花），在河牌圈选择过牌加注（check-raise）。", "牌例2：Q9（两对且带9X阻挡牌），河牌圈对手过牌后，应选择过牌加注。", "牌例3：74（双阻挡牌），翻牌圈有人下大注、你跟注后，转牌河牌均过牌，此时应选择过牌加注——讲师特别指出这是“大底池”局面。", "牌例4：A8（形成大牌），跟注后同样选择过牌加注。", "牌例5：97（形成两对），过牌加注。", "牌例6：Q97牌面，转牌J、河牌A，对手会用所有A6、A5、A10等牌重新开池下注，此时应选择过牌跟注（check-call）——讲师表示自己原本会100%加注，但数据显示有时应该过牌跟注，这令人惊讶。", "牌例7：Q4牌面，形成同花，过牌加注。", "总结：在所有上述情况中，强牌都应有40%的频率选择过牌。"], "note": ""}, {"id": "DGL#98-s3", "ep": "98", "type": "topic", "topic": "DGL#98 - 单次加注底池翻前不利位：过牌-过牌-下注路线中的慢打平衡策略", "en": "PFC SRP OOP Slowplaying in the XC-X-B Line", "q": "不同牌力等级的频率差异", "clues": ["Two Pair", "Set", "Flush", "Full House"], "a": ["两对（Two Pair）：下注频率59%，过牌41%，对应60%下注桶。", "暗三条（Set）：下注频率47%，过牌53%，对应40%下注桶——暗三条的过牌频率显著高于两对。", "同花（Flush）：下注频率63%，过牌37%，对应60%下注桶。", "葫芦（Full House）：下注频率64%，过牌36%，对应60%下注桶。", "顺子（Straight）：下注频率64%，过牌36%，对应60%下注桶。", "结论：除暗三条外，所有强牌类别都高度一致地落在60%下注桶；暗三条是唯一例外，过牌频率明显更高。"], "note": ""}, {"id": "DGL#98-s4", "ep": "98", "type": "topic", "topic": "DGL#98 - 单次加注底池翻前不利位：过牌-过牌-下注路线中的慢打平衡策略", "en": "PFC SRP OOP Slowplaying in the XC-X-B Line", "q": "暗三条为何更倾向于过牌：阻挡牌效应", "clues": ["T96", "T53", "Q985", "blocking bet"], "a": ["暗三条（尤其是中小暗三条）持有两张与牌面相关的牌，会阻挡对手过牌范围中的关键组合。", "例如：在T96牌面上持有66，阻挡了对手可能过牌的6X组合；在T53牌面上持有55或44，同样阻挡了对手的过牌跟注范围。", "具体牌例：Q985牌面持有88，应选择阻挡下注（blocking bet）；T6385牌面持有55，暗三条同样更倾向于过牌。", "核心逻辑：当你持有暗三条时，对手更不可能有强牌，因此你的过牌加注价值降低，过牌跟注或过牌让牌更合理——阻挡牌效应是暗三条过牌频率更高的主要原因。"], "note": ""}, {"id": "DGL#98-s5", "ep": "98", "type": "topic", "topic": "DGL#98 - 单次加注底池翻前不利位：过牌-过牌-下注路线中的慢打平衡策略", "en": "PFC SRP OOP Slowplaying in the XC-X-B Line", "q": "不同牌面结构的频率稳定性", "clues": ["60%", "40%", "63%", "37%"], "a": ["低牌面（10高牌面）：下注60%、过牌40%；9高牌面：下注63%、过牌37%——几乎一致。", "J高牌面：下注59%、过牌41%；Q高牌面：下注58%、过牌42%——下注频率略降但幅度很小。", "A高牌面：下注62%、过牌38%——与低牌面无显著差异。", "结论：翻牌圈最高牌的大小（高牌面vs低牌面）对河牌圈慢打频率几乎没有影响。"], "note": ""}, {"id": "DGL#98-s6", "ep": "98", "type": "topic", "topic": "DGL#98 - 单次加注底池翻前不利位：过牌-过牌-下注路线中的慢打平衡策略", "en": "PFC SRP OOP Slowplaying in the XC-X-B Line", "q": "河牌牌面特征对频率的影响", "clues": ["overcard", "river third to", "flush", "river pairs the"], "a": ["河牌为高牌（overcard，高于翻牌圈所有牌）：下注频率从平均值略微下降至55-58%左右（55/45、54/46、58/42），但变化不大。", "河牌为破花的同花听牌（busted flush draw，翻牌两色）：频率与平均值几乎一致。", "河牌为破花的同花听牌（翻牌彩虹面）：频率同样稳定。", "河牌为第三张同花（river third to flush）：下注61%、过牌39%——与60%桶几乎完全一致。", "河牌为A：下注60%、过牌40%——完全一致。", "河牌配对顶牌（river pairs the top card）：下注50%、过牌50%——这是所有河牌类型中变化最显著的，但依然在合理范围内。", "转牌为第三张同花、转牌为第四张同花：频率同样稳定。", "河牌形成四张顺子面（无间隔）：下注52%、过牌48%；四张顺子面（有间隔）：下注63%、过牌37%——无间隔顺子面中，很多两对实际上只是抓诈牌（bluff catcher），因此过牌频率略高。", "讲师总结：令人难以置信的是，不同河牌结构下频率几乎不变——策略在不同牌面纹理间具有高度一致性。"], "note": ""}, {"id": "DGL#98-s7", "ep": "98", "type": "topic", "topic": "DGL#98 - 单次加注底池翻前不利位：过牌-过牌-下注路线中的慢打平衡策略", "en": "PFC SRP OOP Slowplaying in the XC-X-B Line", "q": "核心启发式规则与执行建议", "clues": ["Two Pair Plus", "Set", "leak", "60%"], "a": ["实战中只需记住两条规则：所有两对及以上牌力（Two Pair Plus）——60%下注、40%过牌；暗三条（Set）——40%下注、60%过牌。", "如果你在游戏中牢记这些频率，你的过牌范围将变得显著更加平衡。", "几乎所有游戏中的漏洞（leak）都源于你没有把坚果牌充分放入所有战略选项中——如果你把强牌过多放入下注范围，下注范围会很强，但过牌范围或小尺寸下注范围会非常弱。", "正确做法：60%下注、40%过牌适用于所有两对以上牌力，唯独暗三条按40%下注、60%过牌执行。"], "note": ""}, {"id": "DGL#98-c1", "ep": "98", "type": "cloze", "topic": "DGL#98 - 单次加注底池翻前不利位：过牌-过牌-下注路线中的慢打平衡策略", "en": "PFC SRP OOP Slowplaying in the XC-X-B Line", "q": "核心发现：坚果级别的强牌应放入“＿＿下注桶”——即60%的时间下注、40%的时间过牌。", "clues": [], "a": ["核心发现：坚果级别的强牌应放入“60%下注桶”——即60%的时间下注、40%的时间过牌。"], "note": "60%"}, {"id": "DGL#98-c2", "ep": "98", "type": "cloze", "topic": "DGL#98 - 单次加注底池翻前不利位：过牌-过牌-下注路线中的慢打平衡策略", "en": "PFC SRP OOP Slowplaying in the XC-X-B Line", "q": "此时应选择过牌跟注（check-call）——讲师表示自己原本会＿＿加注，", "clues": [], "a": ["牌例6：Q97牌面，转牌J、河牌A，对手会用所有A6、A5、A10等牌重新开池下注，此时应选择过牌跟注（check-call）——讲师表示自己原本会100%加注，但数据显示有时应该过牌跟注，这令人惊讶。"], "note": "100%"}, {"id": "DGL#98-c3", "ep": "98", "type": "cloze", "topic": "DGL#98 - 单次加注底池翻前不利位：过牌-过牌-下注路线中的慢打平衡策略", "en": "PFC SRP OOP Slowplaying in the XC-X-B Line", "q": "两对（Two Pair）：下注频率＿＿，过牌41%，", "clues": [], "a": ["两对（Two Pair）：下注频率59%，过牌41%，对应60%下注桶。"], "note": "59%"}, {"id": "DGL#98-note", "ep": "98", "type": "note", "topic": "DGL#98 - 单次加注底池翻前不利位：过牌-过牌-下注路线中的慢打平衡策略", "en": "PFC SRP OOP Slowplaying in the XC-X-B Line", "q": "避坑提醒与行动项", "clues": ["DGL", "SRP", "40%"], "a": ["本视频属于DGL系列（第98期），聚焦于单次加注底池（SRP）中翻前不利位（大盲位）在过牌-过牌-下注路线上的平衡策略。视频基于大规模数据（一百万手牌）提炼出极简的频率启发式，适合作为该路线的第一层认知框架。后续可进一步学习：不同下注尺度下的范围分配、转牌圈的过牌范围构建、以及针对特定对手的剥削性调整。", "**行动项与常见错误：**", "- 应该做：用两对以上强牌在河牌圈过牌40%的时间，不要全部下注。", "- 应该做：暗三条在河牌圈过牌60%的时间，下注仅40%。", "- 应该做：在持有阻挡牌（如暗三条阻挡对手过牌范围）时，更倾向于过牌而非下注。", "- 不要做：把所有强牌都放入下注范围，导致过牌范围过弱、过牌加注频率不足。", "- 不要做：在对手过牌后，用全部强牌下注——这会让你在该节点被有利位置玩家系统性剥削。"], "note": ""}, {"id": "DGL#99-intro", "ep": "99", "type": "intro", "topic": "DGL#99 - 翻前单次加注底池、有利位置持续下注：薄价值下注的“下注-下注-过牌”线路", "en": "PFC SRP IP Going for the B-B-X Line with Thin Value", "q": "DGL#99 - 翻前单次加注底池、有利位置持续下注：薄价值下注的“下注-下注-过牌”线路", "clues": ["GTO"], "a": ["本视频围绕一个具体牌例展开：大盲位手持口袋对子66，在翻牌面5-4-3彩虹面下注后，转牌发出9时选择过牌，讲师指出这是一个明显的EV损失错误。视频的核心目的是解释为什么在软件（GTO求解器）中，这类“对子+顺子听牌”的牌型在转牌是纯下注牌，以及如何识别这类下注机会。", "讲师通过范围分析展示了两个关键论据：一是大盲位在转牌拥有远多于对手的顶对组合（13%对4%），而对手范围中A高牌占比高达37%；二是66、77这类牌具备“被更差牌跟注、迫使高张弃牌、阻挡过牌加注范围、击中坚果时建立底池”四大下注属性。视频强调，求解器在整棵游戏树中都偏好用“对子+听牌”型牌进行双重下注，这是贯穿全局的模式。"], "note": ""}, {"id": "DGL#99-s0", "ep": "99", "type": "topic", "topic": "DGL#99 - 翻前单次加注底池、有利位置持续下注：薄价值下注的“下注-下注-过牌”线路", "en": "PFC SRP IP Going for the B-B-X Line with Thin Value", "q": "牌例回顾与错误定位", "clues": ["BVB"], "a": ["牌例背景：大小盲单挑（BVB），大盲位手持66防守小盲位开局加注。", "翻牌面为5-4-3彩虹面，大盲位用中等尺度下注，小盲位跟注。", "转牌发出9♥，小盲位过牌，大盲位选择过牌——讲师明确指出这是“纯下注牌”却选择过牌，属于EV损失错误。", "河牌发出A♣，小盲位继续过牌，大盲位最终可能做了某种价值下注，但核心问题出在转牌。"], "note": ""}, {"id": "DGL#99-s1", "ep": "99", "type": "topic", "topic": "DGL#99 - 翻前单次加注底池、有利位置持续下注：薄价值下注的“下注-下注-过牌”线路", "en": "PFC SRP IP Going for the B-B-X Line with Thin Value", "q": "翻牌面范围优势分析", "clues": ["A7o", "KQo", "KTs", "A2o"], "a": ["5-4-3彩虹面是大盲位具有显著优势的牌面，尤其在两对和顺子区域，以及“对子+听牌”型的非同花牌。", "求解器在此翻牌面的下注频率接近70%，属于极高侵略性下注频率。", "几乎所有牌都参与下注，包括A高牌——例如A7o的下注频率高达80%，原因是这些牌阻挡了对手的弃牌范围，且自身范围极强。", "唯一完全过牌的牌是KQo和KTs，其余牌均混合下注。", "即使在此类强牌面，仍保留少量顶范围慢打：A2o有5-10%的过牌频率，整体“两街以上下注”的牌中约10%选择过牌，这是GTO策略中“顶范围慢打”的典型模式。"], "note": ""}, {"id": "DGL#99-s2", "ep": "99", "type": "topic", "topic": "DGL#99 - 翻前单次加注底池、有利位置持续下注：薄价值下注的“下注-下注-过牌”线路", "en": "PFC SRP IP Going for the B-B-X Line with Thin Value", "q": "转牌范围对比与下注理由", "clues": ["x6x", "x4x3x", "set", "13%"], "a": ["转牌发出9后，大盲位顶对占比13%，而小盲位仅4%——差距源于大盲位翻牌下注中包含非同花9x牌，而小盲位不会用这些牌跟注。", "小盲位范围中A高牌占比高达37%，包含大量同花高张Kx和Ax，以及7x6x听牌、5x4x3x对子。", "大盲位在“set以上”牌型也有优势：8%对4%，但双方范围极宽，净优势不足以支撑开发第二个下注尺度。", "因此，3/4底池是唯一合适的下注尺度，该尺度同时容纳9x价值牌、坚果牌、5x/4x/3x对子以及顺子牌。"], "note": ""}, {"id": "DGL#99-s3", "ep": "99", "type": "topic", "topic": "DGL#99 - 翻前单次加注底池、有利位置持续下注：薄价值下注的“下注-下注-过牌”线路", "en": "PFC SRP IP Going for the B-B-X Line with Thin Value", "q": "66与77的“融合下注”属性", "clues": ["merged bet"], "a": ["66和77在此转牌是纯下注牌，属于求解器中的“融合下注”（merged bet），类似牌型还有5-7s、6-5s等强5x牌。", "这类牌具备四大下注属性：1. 被更差牌跟注：小盲位会用所有5x、大部分4x、部分3x、A6/A7高张带卡顺听牌、以及部分同花听牌跟注。2. 迫使高张弃牌：能让大量A高牌弃牌，显著提升权益实现——避免河牌发出A或K时输掉底池。3. 阻挡过牌加注：66和77阻挡了小盲位主要的过牌加注范围（6x和7x），降低被加注的频率，即使被加注也有足够权益跟注。4. 击中时建立底池：这些牌能在某些河牌发出时构成坚果，提前下注为击中时的大底池做准备。"], "note": ""}, {"id": "DGL#99-s4", "ep": "99", "type": "topic", "topic": "DGL#99 - 翻前单次加注底池、有利位置持续下注：薄价值下注的“下注-下注-过牌”线路", "en": "PFC SRP IP Going for the B-B-X Line with Thin Value", "q": "下注-下注-过牌线路的执行", "clues": ["70%"], "a": ["求解器在大多数河牌发出空白牌时，会采用“下注-下注-过牌”线路：转牌下注后，河牌过牌摊牌。", "这类牌已经完成了目标：从更差对子和A高牌处获得价值，迫使高张弃牌，因此河牌可以直接摊牌获胜。", "摊牌时权益通常超过70%，属于高频获胜场景。"], "note": ""}, {"id": "DGL#99-c1", "ep": "99", "type": "cloze", "topic": "DGL#99 - 翻前单次加注底池、有利位置持续下注：薄价值下注的“下注-下注-过牌”线路", "en": "PFC SRP IP Going for the B-B-X Line with Thin Value", "q": "求解器在此翻牌面的下注频率接近＿＿，属于极高侵略性下注频率。", "clues": [], "a": ["求解器在此翻牌面的下注频率接近70%，属于极高侵略性下注频率。"], "note": "70%"}, {"id": "DGL#99-c2", "ep": "99", "type": "cloze", "topic": "DGL#99 - 翻前单次加注底池、有利位置持续下注：薄价值下注的“下注-下注-过牌”线路", "en": "PFC SRP IP Going for the B-B-X Line with Thin Value", "q": "大盲位顶对占比＿＿，而小盲位仅4%——差距源于大盲位翻牌下注中包含非同花9x牌，", "clues": [], "a": ["转牌发出9后，大盲位顶对占比13%，而小盲位仅4%——差距源于大盲位翻牌下注中包含非同花9x牌，而小盲位不会用这些牌跟注。"], "note": "13%"}, {"id": "DGL#99-c4", "ep": "99", "type": "cloze", "topic": "DGL#99 - 翻前单次加注底池、有利位置持续下注：薄价值下注的“下注-下注-过牌”线路", "en": "PFC SRP IP Going for the B-B-X Line with Thin Value", "q": "摊牌时权益通常超过＿＿，属于高频获胜场景。", "clues": [], "a": ["摊牌时权益通常超过70%，属于高频获胜场景。"], "note": "70%"}, {"id": "DGL#99-note", "ep": "99", "type": "note", "topic": "DGL#99 - 翻前单次加注底池、有利位置持续下注：薄价值下注的“下注-下注-过牌”线路", "en": "PFC SRP IP Going for the B-B-X Line with Thin Value", "q": "避坑提醒与行动项", "clues": ["DGL", "Daily Green Line", "SRP"], "a": ["本视频属于DGL系列（Daily Green Line）的第99期，聚焦于翻前单次加注底池（SRP）中有利位置（IP）的薄价值下注策略。视频以具体牌例为切入点，系统展示了如何通过范围分析识别转牌下注机会，并总结了“对子+听牌”型牌在双重下注线路中的通用决策模式。", "值得进一步学习的方向包括：不同转牌牌面（如8、T、J）对范围优势的影响、不同下注尺度的适用场景、以及如何在实际游戏中快速识别“融合下注”机会。", "**行动项与常见错误：**", "- 应该做：当手牌具备“被更差牌跟注、迫使高张弃牌、阻挡过牌加注、击中坚果建立底池”四大属性时，转牌应果断下注。", "- 应该做：在自身顶对优势明显的牌面（如9、8、T等中张牌），使用3/4底池的单一尺度下注。", "- 不要做：因为转牌发出高张（如9）而自动过牌——应先对比双方顶对占比和对手A高牌频率，再决定是否下注。", "- 不要做：忽略“对子+听牌”型牌的下注价值，这类牌是求解器双重下注线路的核心组成部分。"], "note": ""}, {"id": "DGL#100-intro", "ep": "100", "type": "intro", "topic": "DGL#100 - 翻前单次加注底池、不利位置：河牌圈开发10%底池下注策略", "en": "PFC SRP OOP Developing 10% Pot Bets on the River", "q": "DGL#100 - 翻前单次加注底池、不利位置：河牌圈开发10%底池下注策略", "clues": ["pot bet", "bluff catcher", "10%"], "a": ["本视频围绕“10%底池下注”（10% pot bet）这一战略性下注尺度展开，讲师通过一手实战牌例（大盲位J♠K♣ vs 按钮位开局加注）详细演示了在河牌圈何时以及如何使用这一微小下注尺度。核心逻辑在于：当你的范围中大量中等强度牌型（bluff catcher）与少量坚果牌并存、且几乎没有空气牌时，而对手范围中空气牌占比极高、可跟注的强牌很少，此时用10%底池的微小下注可以最大化中等强度牌型的价值，同时逼迫对手用空气牌加注，从而让你的坚果牌获得额外价值。", "视频进一步通过三个典型场景（翻牌小注被加注后转牌过牌、单次加注底池不利位置跟注两条街后顶牌成对）展示了这种“权益分布匹配”（equity distribution matchup）的普遍性。讲师强调，只要出现“你方大量中等牌+少量坚果+极少空气，对手大量空气+少量可跟注牌+少量坚果”的分布格局，10%底池下注就是最优策略。最后，讲师将这一概念与AKQ玩具游戏（toy game）的理论框架联系起来，说明其在整个无限注德州扑克理论中的基础性地位。"], "note": ""}, {"id": "DGL#100-s0", "ep": "100", "type": "topic", "topic": "DGL#100 - 翻前单次加注底池、不利位置：河牌圈开发10%底池下注策略", "en": "PFC SRP OOP Developing 10% Pot Bets on the River", "q": "实战牌例：大盲位J♠K♣ vs 按钮位", "clues": ["donk bet", "10%"], "a": ["牌局背景：大盲位手持J♠K♣（非同花JK），对手在按钮位开局加注，大盲位防守跟注。翻牌为T♠8♥2♦（彩虹面），对手选择大尺度下注（3/4底池或超池下注）。", "翻牌决策：在此牌面结构下，进攻方（按钮位）应选择大注或过牌。大盲位手持J♠K♣无红桃，属于简单跟注范围，不应频繁加注。若有J♥9♥（带红桃的J9），有时可以过牌加注；但无红桃的J9（如J♦9♠）则始终跟注。", "转牌与河牌：转牌发出7♣，大盲位组成坚果顺子（J9）。由于对手范围中也包含大量J9组合，大盲位不应频繁反主动下注（donk bet），因此选择过牌。对手随后过牌，河牌发出Q♦，大盲位选择使用10%底池下注这一战略性选项。"], "note": ""}, {"id": "DGL#100-s1", "ep": "100", "type": "topic", "topic": "DGL#100 - 翻前单次加注底池、不利位置：河牌圈开发10%底池下注策略", "en": "PFC SRP OOP Developing 10% Pot Bets on the River", "q": "10%底池下注的核心逻辑", "clues": ["air-heavy", "K9o", "10%"], "a": ["主要前提：对手的范围必须非常“重空气”（air-heavy），即包含大量没有摊牌价值的弱牌。同时，你的范围需要包含大量中等强度牌型（middling strength hands）。", "你的范围构成：跟注翻牌大注后，你的范围主体为10x和8x组合（如T9、T7、87、86等），加上少量顺子听牌（如QJ）和红桃同花听牌。转牌7♣发出后，空气牌极少——仅剩未中的小红桃听牌（如5♥4♥、5♥3♥）和部分QJ。整体范围极度集中于中等牌力，坚果牌（J9、T8、T7、A2）占比有限。", "对手的范围构成：对手翻牌超池下注后转牌过牌的范围包含大量空气——KJ、Q♠6♠、J7（抓诈牌）、K♠9♠、K9o等。他必须控制听牌的持续下注频率（如KJ在转牌有卡顺听牌时不能总是继续下注）。此外，他还有一些10x（如JT、QT）和少量7x，但整体空气占比极高。", "为什么10%下注有效：你的中等强度牌型（8x、10x甚至部分7x）可以用10%底池下注逼迫对手弃掉所有空气牌，从而“买下底池”并避免被诈唬。由于对手缺乏抓诈牌，你无法用大注获取价值；由于你本身缺乏诈唬牌，也无法平衡大注中的价值牌。微小下注同时迫使对手为了防守而用部分空气牌加注，这反过来让你的坚果牌获得额外价值。"], "note": ""}, {"id": "DGL#100-s2", "ep": "100", "type": "topic", "topic": "DGL#100 - 翻前单次加注底池、不利位置：河牌圈开发10%底池下注策略", "en": "PFC SRP OOP Developing 10% Pot Bets on the River", "q": "权益分布匹配：何时适用10%下注", "clues": ["A4o", "A5o", "A6o", "KJo"], "a": ["匹配条件：你的范围包含大量中等强度牌型、一定数量的坚果牌、极少空气；对手范围包含大量空气、少量抓诈牌、极少量坚果牌。这种分布匹配是10%底池下注策略的充分必要条件。", "分布图解读：在实战牌例的权益分布图中，按钮位（对手）范围中超过50%的牌型权益低于20%，包含大量K高、A高弱牌（如K♥5♥、A3、A4o、A5o、A6o、KJo）；而你方范围中弱牌仅占16%-20%（如K♥6♥、QJo、Q9o），其余为大量中等牌力和坚果牌。", "大注不适用原因：对手没有足够多的可跟注牌，你也没有足够多的诈唬牌来平衡大注中的价值牌。大注只会赶走对手的空气牌，无法获取额外价值。", "10%下注的普遍性：只要上述权益分布匹配出现，10%底池下注就会成为策略中的高频选项。这一现象在扑克中相当常见，关键在于识别分布匹配而非特定牌面。"], "note": ""}, {"id": "DGL#100-s3", "ep": "100", "type": "topic", "topic": "DGL#100 - 翻前单次加注底池、不利位置：河牌圈开发10%底池下注策略", "en": "PFC SRP OOP Developing 10% Pot Bets on the River", "q": "场景一：翻牌小注被加注后转牌过牌", "clues": ["10%"], "a": ["牌例设定：翻牌为K♣4♠3♥（两色），你在不利位置（如大盲位）高频小注（约1/3底池），对手加注，你跟注，转牌发出9♥，对手过牌。", "你的跟注范围：翻牌小注被加注后，你的跟注范围包含大量顶对（Kx）和少量听牌（红桃同花听牌、A♥Qo、A♥Jo等），整体为中等牌力加少量坚果（口袋K、口袋A带红桃听牌）。", "对手转牌过牌的范围含义：对手过牌意味着其范围极度偏弱、空气占比极高。他被迫过牌部分10x、部分顺子听牌（QJ、KJ、KQ等需控制频率的牌），以及大量A高牌（A♠4x、A♠5x、A♠6x等非同花组合）。", "河牌策略：若河牌为空白牌，你应高频使用10%底池下注。权益分布匹配显示对手范围中大量极弱牌，你方无诈唬、大量中等牌力、双方各有少量坚果。对手坚果牌（如A5、65、AK）的存在是未更频繁使用10%下注的唯一原因——若对手坚果更少，10%下注频率会更高。"], "note": ""}, {"id": "DGL#100-s4", "ep": "100", "type": "topic", "topic": "DGL#100 - 翻前单次加注底池、不利位置：河牌圈开发10%底池下注策略", "en": "PFC SRP OOP Developing 10% Pot Bets on the River", "q": "场景二：单次加注底池不利位置跟注两条街", "clues": ["check-call", "top card pairs", "10%"], "a": ["适用条件：你在不利位置作为翻前跟注者，面对对手翻牌和转牌连续下注（check-call两条街），河牌出现使对手范围“空气化”的牌面。", "关键机制：当转牌为超池下注时，你无法在不利位置用听牌跟注，因此你的河牌范围几乎全是抓诈牌加少量坚果，空气极少。此时若河牌出现“顶牌成对”（top card pairs），对手的转牌价值范围（如Kx）组合数大幅缩减（牌面已有1张K，仅剩2张K可组成价值牌），而诈唬范围不变，导致对手范围空气占比飙升。", "具体牌例：按钮位翻前加注，你在大盲位跟注。翻牌K♦9♠4♥，对手下注你跟注；转牌2♣，对手超池下注你跟注；河牌K♥（顶牌成对）。此时你的范围以9x为主（大量抓诈牌），对手范围中约三分之二的牌型为空气。", "策略结果：你的9x可以用10%底池下注直接“买下底池”，坚果牌（如KQ、KJ）也因对手被迫用空气加注而获得额外价值。若对手不进行足够的诈唬加注，你的9x将凭借10%下注持续盈利。"], "note": ""}, {"id": "DGL#100-s5", "ep": "100", "type": "topic", "topic": "DGL#100 - 翻前单次加注底池、不利位置：河牌圈开发10%底池下注策略", "en": "PFC SRP OOP Developing 10% Pot Bets on the River", "q": "与AKQ玩具游戏的理论联系", "clues": ["GTO", "AKQ", "indifferent", "10%"], "a": ["讲师指出，10%底池下注的动态与GTO蓝图课程中讲解的AKQ玩具游戏完全一致——这是无限注德州扑克理论中最重要的玩具游戏。", "在均衡状态下，对手必须加注到足够频率，使你的中等强度牌型（如9x）在“下注10%底池”与“过牌”之间无差别（indifferent）。若对手加注不足，你的中等牌力牌型将凭借10%下注持续获利。", "这一框架解释了10%下注的双重价值：直接为中等牌力牌型“买下底池”，同时通过诱导对手加注为坚果牌创造额外收益。"], "note": ""}, {"id": "DGL#100-c0", "ep": "100", "type": "cloze", "topic": "DGL#100 - 翻前单次加注底池、不利位置：河牌圈开发10%底池下注策略", "en": "PFC SRP OOP Developing 10% Pot Bets on the River", "q": "河牌发出Q♦，大盲位选择使用＿＿底池下注这一战略性选项。", "clues": [], "a": ["转牌与河牌：转牌发出7♣，大盲位组成坚果顺子（J9）。由于对手范围中也包含大量J9组合，大盲位不应频繁反主动下注（donk bet），因此选择过牌。对手随后过牌，河牌发出Q♦，大盲位选择使用10%底池下注这一战略性选项。"], "note": "10%"}, {"id": "DGL#100-c1", "ep": "100", "type": "cloze", "topic": "DGL#100 - 翻前单次加注底池、不利位置：河牌圈开发10%底池下注策略", "en": "PFC SRP OOP Developing 10% Pot Bets on the River", "q": "为什么＿＿下注有效：你的中等强度牌型（8x、10x甚至部分7x）可以用10%底池下注逼迫对手弃掉所有空气牌，", "clues": [], "a": ["为什么10%下注有效：你的中等强度牌型（8x、10x甚至部分7x）可以用10%底池下注
